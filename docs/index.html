   "body": "# 短线选股条件（问财 / 同花顺版）\n\n> **一句话**：条件是死的，量比是活的。照抄「量比小于 1」到问财，会在早盘把票全筛掉。\n\n> **2026-10-21 修正**：原版有两处说法问财不认 —— 已改为「竞价涨幅」和「昨日未涨停」。见第一节。这是结果对不上的首要原因。\n\n---\n\n## 〇、先说结论：别用问财复现\n\n问财**做不到**和软件一模一样。原因只有一条：**问财只有实时量比，没有全天量比**。\n\n软件的「量比 < 1」是全天口径，靠一条日内量占比曲线折出来。曲线是估算，本身有 10%~20% 误差。拿它去要求问财出同一份名单，等于要求两个都有误差的东西逐位相等。\n\n**正确做法是反过来**：软件筛，然后把代码贴进同花顺。\n\n```\npython -m shortline.cli scan --codes            # 一行一个 6 位代码\npython -m shortline.cli scan --codes --sealed-only   # 只要已封板的\n```\n\n粘到同花顺「自选股 → 导入」即可。这一步没有任何口径损失，因为它不重算，只搬运。\n\n问财留着干别的：**盯盘时快速扫一眼有没有新面孔**。它的名单当作「候选」，不当「唯一答案」。\n\n---\n\n## 一、一句话（复制就能用）\n\n阈值随时点变，所以**不要用一句话覆盖一个半小时**。按当下时刻挑最近的三分钟那一行。\n\n**09:30 — 09:45**（阈值 3.8 → 2.9，取中间偏松 3.0）\n\n```\n涨幅大于7%，竞价涨幅大于3%，竞价涨幅小于9%，量比小于3，今日涨停，昨日未涨停，非st\n```\n\n**09:45 — 10:30**（阈值 2.9 → 1.7，取 2.0）\n\n```\n涨幅大于7%，竞价涨幅大于3%，竞价涨幅小于9%，量比小于2，今日涨停，昨日未涨停，非st\n```\n\n**10:30 — 11:30**（阈值 1.7 → 1.2，取 1.4）\n\n```\n涨幅大于7%，竞价涨幅大于3%，竞价涨幅小于9%，量比小于1.4，今日涨停，昨日未涨停，非st\n```\n\n**13:00 — 14:00**（阈值 1.1 → 1.0，取 1.1）\n\n```\n涨幅大于7%，竞价涨幅大于3%，竞价涨幅小于9%，量比小于1.1，今日涨停，昨日未涨停，非st\n```\n\n**14:00 — 14:30**（阈值 1.0 → 0.9，取 1.0）\n\n```\n涨幅大于7%，竞价涨幅大于3%，竞价涨幅小于9%，量比小于1，今日涨停，昨日未涨停，非st\n```\n\n**三处必须照抄，一个字都别换**：\n\n| 写这个 | 不是这个 | 为什么 |\n|---|---|---|\n| `竞价涨幅` | ~~开盘涨幅~~ | 问财认「竞价涨幅」，官方示例就是 `竞价涨幅大于0小于4` |\n| `今日涨停，昨日未涨停` | ~~首板~~ | 「首板」不是标准字段。两个词合起来才等于首板 |\n| `量比小于` + 按表填 | ~~量比小于1~~（早盘） | 早盘填 1，等于要求全天量比 0.3，全灭 |\n\n`今日涨停` 和 `昨日未涨停` 必须成对出现。只写一个，意思就变了：只写「今日涨停」允许连板，只写「昨日未涨停」允许没涨停的票混进来。\n\n**只想要候选、不要求已封板**：把 `今日涨停，` 去掉。剩下的票要盯，封不上不能买。\n\n末尾可加 `，按量比从小到大排序`。这句只影响顺序，不影响结果。\n\n---\n\n## 二、量比为什么不是 1（最容易错的一条）\n\n同花顺的「量比」是**实时口径**。它的分子只算已过去的几分钟。\n\n我们的「量比」是**全天口径**。回测里的「量比 < 1」指全天成交量小于前 5 日均量。\n\n两个不是一回事。两者换算是：\n\n```\n实时量比 = 全天量比 × 占比(t) × 240 / 已交易分钟\n```\n\n占比(t) 是到时刻 t 的累计成交量占全天的比例。软件里有一条曲线存这个值。\n\n按软件的曲线算，每个时点该填多少：\n\n| 时点 | 已交易分钟 | 累计占比 | **实时量比该填** |\n|---|---:|---:|---:|\n| 09:35 | 5 | 8.0% | **3.8** |\n| 09:40 | 10 | 13.0% | **3.1** |\n| 09:45 | 15 | 18.0% | **2.9** |\n| 10:00 | 30 | 29.0% | **2.3** |\n| 10:15 | 45 | 36.0% | **1.9** |\n| 10:30 | 60 | 42.0% | **1.7** |\n| 11:00 | 90 | 52.0% | **1.4** |\n| 11:30 | 120 | 58.0% | **1.2** |\n| 13:30 | 150 | 66.0% | **1.1** |\n| 14:00 | 180 | 74.0% | **1.0** |\n| 14:30 | 210 | 82.0% | **0.9** |\n\n已交易分钟不计午休。下午 13:00 起算第 121 分钟。\n\n**结论**：09:40 直接筛「量比小于 1」，等于要求全天量比约 0.32。会砍掉九成目标池。\n\n**注意**：占比曲线只用单只票 5 天实测。10:00 的真实占比在 23%~37% 之间波动。表里的值是偏上的。宁可放宽，不筛空。\n\n---\n\n## 三、逐项对照\n\n软件的条件与问财的说法一一对应。**第二列是唯一正确写法**，第三列是被我写错过的。\n\n| 条件 | 软件里的值 | 问财正确说法 | 容易写错的说法 |\n|---|---|---|---|\n| 当日涨幅 | ≥ 7.0% | `涨幅大于7%` | ~~今日涨幅~~（能认但多余） |\n| 竞价涨幅下限 | ≥ 3.0% | **`竞价涨幅大于3%`** | ~~开盘涨幅大于3%~~ · ~~高开3%以上~~ |\n| 竞价涨幅上限 | < 9.0% | **`竞价涨幅小于9%`** | ~~开盘涨幅小于9%~~ |\n| 量比 | < 1.0（全天口径） | `量比小于N`（N 查第二节表） | ~~量比小于1~~ 用在早盘 |\n| 已封板 | 是 | `今日涨停` | ~~涨停~~（能认但更含糊） |\n| 首板 | 连板数 ≤ 1 | **`今日涨停，昨日未涨停`** | ~~首板~~ · ~~连续涨停天数等于1~~ |\n| 排除 ST | 是 | `非st` | — |\n| 排除北交所 | 是 | `上市板不是北交所` | ~~非北交所~~ |\n\n**为什么「竞价涨幅」对、「开盘涨幅」不对**：同花顺自己的选股教程里，问句写的就是 `竞价涨幅大于0小于4`。问财靠语义匹配，词差一个字就可能退化成模糊搜索，命中一堆不相干的票，或者干脆不生效。\n\n**为什么「首板」不对**：「首板」是股民口语，不是问财字段。它的严格定义是「今日涨停 且 昨日未涨停」，拆成两个已知字段才可靠。实测最省事的写法就是这两个词连着写。\n\n**「非北交所」的替代**：如果 `上市板不是北交所` 也不认，就在问句最前面加限定范围 `沪深A股`，把北交所和科创板一起排除掉。\n\n---\n\n## 四、怎么验证是哪一条出错\n\n问财是黑盒，看不到它怎么解析你的句子。所以只能**一句一个条件去对数字**。\n\n### 单条件对照卡\n\n挑一个交易日盘中，按下面顺序逐句粘进问财，把每次的「共 N 只」记下来，和软件的基准数字比。\n\n| # | 粘这一句 | 软件同一天的数 |\n|---|---|---:|\n| 1 | `涨幅大于7%` | 81 |\n| 2 | `涨幅大于7%，竞价涨幅大于3%，竞价涨幅小于9%` | 18 |\n| 3 | `涨幅大于7%，竞价涨幅大于3%，竞价涨幅小于9%，量比小于1.2` | 6 |\n| 4 | `涨幅大于7%，竞价涨幅大于3%，竞价涨幅小于9%，量比小于1.2，今日涨停，昨日未涨停` | 2 |\n| 5 | 加上 `非st` | 2 |\n\n上表是 **2026-10-21 11:26 实测**（全市场 5,574 只，涨停池 43 只，基准截至 10-20）。\n\n**怎么读这张表**\n\n- 第 1 行就差得远 → 问财的「涨幅」口径和昨收不一样，或者被限定在某个板块里。检查问句前面有没有残留的板块限定。\n- 第 2 行断崖式变 0 → 「竞价涨幅」没被认出来，或者被理解成「日内涨幅」。换个写法 `9点25分涨幅大于3%`。\n- 第 3 行变 0 → 量比阈值填高了。**盘中 11:26 全市场量比中位数约 1.0，填 1.2 已经只剩个位数。**\n- 第 4 行变 0 → 「今日涨停，昨日未涨停」没认对。退一步去掉这两个词，自己看名单里有没有连板票。\n- 第 5 行和 4 一样 → 正常。\n\n### 一条不用登录就能自查的性质\n\n第 2 行到第 3 行之间的下降幅度，**必须和第 4 行之前的下降幅度接近**。如果某一行直接从几十只跌到 0，那 99% 是那个词没被识别，不是市场没有。\n\n### 不要这样做\n\n- 不要用问财回测历史。它只答「此刻」。\n- 不要指望问财和软件名单逐只相同。软件每天出 2~3 只（十年均值 2.64 只），基数这么小，错一只就是 50% 的差异。\n\n---\n\n## 五、四个坑\n\n**坑一：词写错**。问财靠语义匹配，不是按字段名精确查。写 `开盘涨幅` 和写 `竞价涨幅` 可能得到完全不同的结果，而它**不会报错**，只会默默按另一种理解给你一批票。这是最隐蔽的一个。官方示例用的是 `竞价涨幅大于0小于4`。\n\n**坑二：量比口径**。见第二节。早盘照抄「量比小于1」等于要求全天量比 0.3，全灭。\n\n**坑三：问财不给历史**。它只能回答「现在」。所以它不能复现我的回测。回测数字全部来自本地十年日K。\n\n**坑四：「涨停」是此刻封住**。炸板后这只票就消失了，不会提示你。所以盘中要反复刷，每 10~20 分钟一次。刷到也不代表封得住：十年数据里 35.6% 的涨停会打开。\n\n---\n\n## 六、代码版\n\n**真源是配置文件**，不是这份文档。改 `config.json` 就改变软件行为。\n\n```json\n\"filters\": {\n  \"min_gain_pct\": 7.0,\n  \"open_gain_min_pct\": 3.0,\n  \"open_gain_max_pct\": 9.0,\n  \"vr_max\": 1.0,\n  \"max_boards\": 1,\n  \"exclude_st\": true,\n  \"exclude_bj\": true,\n  \"require_sealed\": false\n}\n```\n\n等价的判定式，一行一条：\n\n```\ngain      = last / prev_close - 1        ≥ 0.07\nopen_gain = open / prev_close - 1        ≥ 0.03  且 < 0.09\nprogress  = volume / v5                  v5 = 前 5 个交易日均量\nvr        = progress / share(now)        < 1.00\nboards                                   ≤ 1      （首板）\n名称                                     不含 \"ST\"\n代码                                     不以 8 / 4 / 92 开头（北交所）\n```\n\n代码实现在 `shortline/rules.py` 的 `evaluate()`。改规则只改那一个函数。\n\n**反向导出**：先让软件筛，再把结果贴进同花顺自选股。\n\n```\npython -m shortline.cli scan --codes\n```\n\n输出 6 位代码，一行一个。贴进同花顺「自选股 → 导入」即可。加 `--sealed-only` 只导出已封板的。\n\n---\n\n## 七、限界\n\n1. **问财永远对不齐软件**。它没有全天量比。名单当候选看，不当答案。要精确就用 `--codes` 导出。\n2. **占比曲线样本少**。单只票 5 天。表里的值偏上。真实值可能让阈值差 10%~20%。\n3. **每天只 2~3 只**。十年均值每天 2.64 只。筛空是常态，不是语句错。\n4. **形态不能省**。量比达标不等于可以买。封不住就不买。这条数据证明过：炸板期望 −5.18%。\n5. **一句话管不了一整个时段**。09:45 的阈值 2.9、11:30 的阈值 1.2，差 2.4 倍。必须按当下时刻挑那一行。\n6. **自己跑对照**：`python tools/diag_wencai.py`，一条命令把单条件命中数、累积漏斗、两种量比口径全打出来。\n\n---\n\n_2026-10-21 建立 · 2026-10-21 修正字段写法（竞价涨幅 / 昨日未涨停）并补单条件对照卡 · 条件与 短线回测_04_打板操作手册 一致 · 规则一条未改，仍在验证期_",

  }

const CARDS = DATA.cards;
const KEY = 'etf-cards-v1';
const GROUP_ORDER = ['认知地基','路线A · 定投','路线B · 波段','实战工具','基础与书架','交易手册 · 人读','短线'];

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {learned:{},days:[]} }catch(e){ return {learned:{},days:[]} } }
function save(s){ localStorage.setItem(KEY, JSON.stringify(s)) }
let S = load();

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }
function epochDay(){ return Math.floor((Date.now() - new Date().getTimezoneOffset()*60000)/86400000) }

const INTERVALS = [1,3,7,15,30,60];
function isLearned(c){ return !!S.learned[c.id] }
function dueCards(){
  const now = Date.now();
  return CARDS.filter(c=>{ const r=S.learned[c.id]; if(!r) return false;
    const gap = INTERVALS[Math.min(r.n||0, INTERVALS.length-1)] * 86400000;
    return now - r.at >= gap; });
}
function todayCard(){
  const due = dueCards().sort((a,b)=>(S.learned[a.id].at||0)-(S.learned[b.id].at||0));
  if(due.length) return {card:due[0], review:true};
  const un = CARDS.filter(c=>!isLearned(c));
  if(!un.length) return {card:null, review:false};
  return {card: un[epochDay() % un.length], review:false};
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  return s;
}
function md(text){
  const L = text.split(/\r?\n/); let h='', i=0, ul=false, ol=false;
  const close=()=>{ if(ul){h+='</ul>';ul=false} if(ol){h+='</ol>';ol=false} };
  while(i<L.length){
    let ln=L[i];
    if(/^\s*\|/.test(ln) && i+1<L.length && /^\s*\|[\s:|-]+\|?\s*$/.test(L[i+1])){
      close(); const rows=[];
      while(i<L.length && /^\s*\|/.test(L[i])){ rows.push(L[i]); i++ }
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim()));
      let t='<table><thead><tr>'+cells(rows[0]).map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
      for(let k=2;k<rows.length;k++) t+='<tr>'+cells(rows[k]).map(c=>'<td>'+c+'</td>').join('')+'</tr>';
      h+=t+'</tbody></table>'; continue;
    }
    if(/^\s*$/.test(ln)){ close(); i++; continue }
    if(/^---+$/.test(ln.trim())){ close(); h+='<hr>'; i++; continue }
    let m;
    if(m=ln.match(/^(#{1,6})\s+(.*)$/)){ close(); const lv=Math.min(m[1].length,3); h+='<h'+lv+'>'+inline(m[2])+'</h'+lv+'>'; i++; continue }
    if(/^>\s?/.test(ln)){ close(); const q=[];
      while(i<L.length && /^>\s?/.test(L[i])){ q.push(L[i].replace(/^>\s?/,'')); i++ }
      h+='<blockquote>'+q.map(inline).join('<br>')+'</blockquote>'; continue }
    if(m=ln.match(/^\s*[-*+]\s+(.*)$/)){ if(!ul){close();h+='<ul>';ul=true} h+='<li>'+inline(m[1])+'</li>'; i++; continue }
    if(m=ln.match(/^\s*\d+[.)]\s+(.*)$/)){ if(!ol){close();h+='<ol>';ol=true} h+='<li>'+inline(m[1])+'</li>'; i++; continue }
    close();
    const buf=[ln]; i++;
    while(i<L.length && !/^\s*$/.test(L[i]) && !/^(#{1,6}\s|>\s?|\s*[-*+]\s|\s*\d+[.)]\s|---)/.test(L[i]) && !/^\s*\|/.test(L[i])){ buf.push(L[i]); i++ }
    h+='<p>'+buf.map(inline).join('<br>')+'</p>';
  }
  close(); return h;
}
function bodyHTML(c){
  let b = c.body.replace(/^#\s+[^\n]*\r?\n?/, '').replace(/^\s+/, '');
  if(/^>/.test(b)){
    const L = b.split(/\r?\n/); let k = 0;
    while(k < L.length && /^>/.test(L[k])) k++;
    if(L.slice(0,k).join('\n').includes('一句话')) b = L.slice(k).join('\n');
  }
  return md(b.trim());
}
function chip(c){ return '<span class="chip">'+esc(c.category)+' · '+esc(c.sub)+'</span>' }

function markLearned(id){
  const r = S.learned[id];
  S.learned[id] = { at: Date.now(), n: r ? (r.n||0)+1 : 0 };
  const t = todayStr();
  if(!S.days.includes(t)) S.days.push(t);
  save(S);
}
function streak(){
  const set = new Set(S.days); let n=0; const d=new Date();
  for(;;){ const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(set.has(k)){ n++; d.setDate(d.getDate()-1) } else break }
  return n;
}

let cur = null;
function renderToday(){
  const {card, review} = todayCard();
  const el = document.getElementById('v-today');
  if(!card){
    el.innerHTML = '<div class="empty">149 张卡全部学完了。<br>接下来是复习回炉——明天再来。</div>'; return;
  }
  cur = card;
  const st = S.learned[card.id];
  const done = isLearned(card.id);
  el.innerHTML =
   '<div class="card">' + chip(card) +
   '<h2>'+esc(card.title)+'</h2>' +
   '<p class="one">'+esc(card.oneliner)+'</p>' +
   '<div class="acts">' +
     '<button onclick="toggle()" id="btnD">展开详解</button>' +
     (done ? '<button class="ok" onclick="markAgain()">已学 · 复习一次</button>'
           : '<button class="primary" onclick="markNow()">标记已学</button>') +
   '</div>' +
   (review ? '<div style="margin-top:12px;font-size:12px;color:var(--fg3)">这是一张到期待复习的卡（第 '+((st.n||0)+1)+' 次）</div>' : '') +
   '<div class="detail" id="det">'+bodyHTML(card)+'</div>' +
   '</div>';
}
function toggle(){
  const d=document.getElementById('det'), b=document.getElementById('btnD');
  d.classList.toggle('show'); b.textContent = d.classList.contains('show') ? '收起' : '展开详解';
}
function markNow(){ markLearned(cur.id); renderToday(); refreshNav() }
function markAgain(){ markLearned(cur.id); renderToday(); refreshNav() }

function renderCat(){
  const el = document.getElementById('v-cat');
  let h = '';
  GROUP_ORDER.forEach(g=>{
    const list = CARDS.filter(c=>c.category===g);
    if(!list.length) return;
    const done = list.filter(isLearned).length;
    h += '<details class="grp"><summary><span>'+esc(g)+'</span><span class="n">'+done+' / '+list.length+'</span></summary><div class="sub2">';
    const subs = [...new Set(list.map(c=>c.sub))];
    subs.forEach(s=>{
      h += '<h4>'+esc(s)+'</h4>';
      list.filter(c=>c.sub===s).forEach(c=>{
        h += '<div class="row '+(isLearned(c)?'done':'')+'" onclick="openCard(\''+c.id+'\')"><i class="dot"></i><span>'+esc(c.title)+'</span></div>';
      });
    });
    h += '</div></details>';
  });
  el.innerHTML = h;
}
function renderStat(){
  const total = CARDS.length, done = CARDS.filter(isLearned).length;
  const pct = Math.round(done/total*100);
  let h = '<div class="stat"><div><b>'+done+'</b><span>已学</span></div>' +
          '<div><b>'+total+'</b><span>总卡数</span></div>' +
          '<div><b>'+streak()+'</b><span>连续天数</span></div></div>' +
          '<div class="g2" style="margin-top:18px"><div class="t"><span>总进度</span><em>'+pct+'%</em></div>' +
          '<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  GROUP_ORDER.forEach(g=>{
    const list = CARDS.filter(c=>c.category===g); if(!list.length) return;
    const d = list.filter(isLearned).length, p = Math.round(d/list.length*100);
    h += '<div class="g2"><div class="t"><span>'+esc(g)+'</span><em>'+d+' / '+list.length+'</em></div><div class="bar"><i style="width:'+p+'%"></i></div></div>';
  });
  h += '<div class="sec">复习队列</div>';
  const due = dueCards().length;
  h += '<div class="g2"><div class="t"><span>待复习</span><em>'+due+' 张</em></div></div>';
  h += '<div style="margin-top:26px"><button onclick="resetAll()" style="font:inherit;font-size:13px;padding:8px 14px;border-radius:9px;border:.5px solid var(--line);background:none;color:var(--fg3)">清空全部学习记录</button></div>';
  document.getElementById('v-stat').innerHTML = h;
}
function resetAll(){ if(confirm('清空所有已学记录？不可恢复。')){ S={learned:{},days:[]}; save(S); renderToday(); renderCat(); renderStat(); refreshNav() } }

function openCard(id){
  const c = CARDS.find(x=>x.id===id); if(!c) return;
  cur = c;
  document.getElementById('ovBody').innerHTML = '<div class="card">'+chip(c)+'<h2>'+esc(c.title)+'</h2><p class="one">'+esc(c.oneliner)+'</p></div>'+'<div class="detail show" style="border-top:0">'+bodyHTML(c)+'</div>';
  document.getElementById('ovAct').textContent = isLearned(c.id) ? '已学 ✓' : '标记已学';
  document.getElementById('ov').classList.add('show');
  document.body.style.overflow = 'hidden';
  window.scrollTo(0,0);
}
function closeOv(){ document.getElementById('ov').classList.remove('show'); document.body.style.overflow = ''; renderCat(); renderToday(); renderStat(); refreshNav() }
function ovMark(){ if(cur){ markLearned(cur.id); document.getElementById('ovAct').textContent='已学 ✓' } }

function go(t){
  ['today','cat','stat'].forEach(k=>{
    document.getElementById('v-'+k).style.display = k===t?'':'none';
    document.getElementById('t-'+k).className = k===t?'on':'';
  });
  if(t==='cat') renderCat(); if(t==='stat') renderStat();
  if(t==='today') renderToday();
  window.scrollTo(0,0);
}
function refreshNav(){
  const done = CARDS.filter(isLearned).length;
  document.getElementById('sub').textContent = todayStr()+' · 已学 '+done+'/'+CARDS.length+' · 连续 '+streak()+' 天';
}

document.getElementById('sub').textContent = todayStr()+' · 已学 0/'+CARDS.length;
renderToday(); refreshNav();
</script>
</body>
</html>
