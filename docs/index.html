   "source": "03-知识/概念/③线口径诊断.md",
   "body": "# ③线口径诊断\n\n> 一句话：**现行 ③ 线 = 「① 之后各日日内最高的最大值」，而这个区间包含当日 → 条件等价于「收盘 > 当日最高价」→ 在趋势中恒不成立。** 全窗口回测（8 只标的 / 2024-2026）触发 **0 次**，是路线B「总是没有满足进场的标的」的机械原因。\n>\n> ⚠️ **本文是回测诊断，不是投资建议，也尚未改真源。** 2026-10-01 立；真源 ETF交易系统 §3A.3 与 `scan_signals.py` 的**默认判定口径未改**，仅在该脚本新增 `--both` 对照开关。\n\n## 是什么\n\n止跌企稳三信号 的第三信号是「**放量突破反弹高点**」，落在工具里就是 `scan_signals.py` 的这一行：\n\n```python\nseg  = rows[sig1_i + 1:]                          # ① 之后的全部交易日\npeak = max((r[\"high\"] for r in seg), default=None) # ③线 = 该区间的日内最高\nres[\"sig3_ok\"] = bool(last[\"close\"] > peak and ...) # ③成立 = 收盘 > ③线 且 放量\n```\n\n**问题在 `seg` 包含 `last` 本身**（`last = rows[-1]`）。于是：\n\n```\n③成立  ⟺  收盘 > max(①之后所有日的日内高，含当日)\n       ⟺  收盘 > 当日日内高          ← 收盘价永远 ≤ 当日最高价\n       ⟺  恒不成立\n```\n\n只有当**当日没有创出新高**时才可能成立——而在真正的「放量突破」里，**当日最高价就是新高本身**。\n\n## 为什么重要（它在系统里的位置）\n\n路线B 的进场是一条**串联**闸门链：\n\n```\n大盘档位（3A.1，含 ③弱势 R1+R2 豁免）→ 3A.3 三信号 ①→②→③ → 3A.4 进场三问 → 3A.5 试探仓\n```\n\n③ 是最后一关，也是**恒不成立**的那一关。所以无论前面的闸门放宽到多松，成交都不会发生——这解释了 2026-09-10 之后的实盘事实：\n\n| 日期 | 现象 |\n|---|---|\n| 09-18 | v1.16 放宽大盘闸门后，R1+R2 达标 4 只（159516 +11.85pp / 159995 +6.84pp / 512480 +8.39pp / 159583 +5.42pp）**全部放行**，但**四只全部卡在 ③** |\n| 09-21 | R1+R2 达标 5 只，**③ 仍全部未收盘确认** → 次日仍不可开 |\n| 09-10 起至今 | 路线B 累计成交 **1 笔**（159995，且靠 ① 恰好于 09-15 作废、③线锁在旧值 1.706 才勉强开成），该笔已于 09-28 按纪律止损 −5.28% |\n\n## 证据\n\n### 证据一 · 结构恒等式（不依赖样本）\n\n`peak` 取自含当日的区间 → 要求收盘超过当日最高价。**这是数学结论，不是统计结论。**\n\n### 证据二 · 全窗口回测 0 触发\n\n数据源与 `scan_signals.py` 一致（腾讯 fqkline 前复权）。同一 ① 结构下只改 ③ 线口径：\n\n| 标的 | 区间 | 区间涨幅 | 现行·浮动③线 | 改法·固定③线 |\n|---|---|---|---:|---:|\n| 159995 芯片 | 2024-04 ~ 2026-09 | +156.2% | **0 次触发** | 2024-07-09 触发 |\n| 159516 半导体设备 | 同上 | +220.7% | **0 次触发** | 2024-10-09 触发 |\n| 159583 通信 | 2024-07 ~ 2026-09 | +217.0% | **0 次触发** | 2024-09-26 触发 |\n\n### 证据三 · 完整规则回测（含离场）\n\n把 ①②③ 与**大盘闸门 + −5% 硬止损 + 3A.6 加仓 + 浮盈阶梯**一起模拟，2024-2026、8 只标的：\n\n| 组合 | 笔数 | 胜率 | 平均盈 | 平均亏 | 盈亏比 | 每笔期望 | 累计盈亏 |\n|---|---:|---:|---:|---:|---:|---:|---:|\n| 现行·浮动③线 | **0** | — | — | — | — | — | 0 元 |\n| 现行·浮动③线（忽略大盘闸门） | **0** | — | — | — | — | — | 0 元 |\n| **改法·固定③线** | 22 | 36.4% | +23.16% | −6.53% | **3.55 : 1** | **+4.27%** | +2,767.92 元 |\n\n**保本只需 22% 胜率**（盈亏比 3.55），实测交出 36.4%。\n\n> 关键旁证：这组回测说明 **ETF交易系统 的离场设计是对的**——22 笔里 14 笔亏损中 13 笔是「①硬止损」，全部落在 −5% ~ −10.2%；赢单交给 ③回撤去跑，跑出 +35.14% / +32.36% / +29.66%。这正是 让利润奔跑 与 海龟止损 的组合效果。**问题不在离场，只在 ③ 这一条入场条件。**\n\n### 证据四 · 离场参数扫描（排除离场嫌疑）\n\n27 组（硬止损 5/7/9% × 阶梯阈值 10/15/20% × 回撤 5/8/12%）全部为正期望；**现行参数（5% / 15% / 5%）每笔期望 +4.27%，排中上，不是短板**。故 ③ 线是唯一需要改的环节。\n\n## 改法\n\n```python\n# 现行（恒不成立）\npeak = max((r[\"high\"] for r in seg), default=None)\n\n# 改法：③线 = ① 结构确立当日日内高（固定结构位，不随后续新高上移）\npeak = sig1[\"high\"]\n```\n\n**为什么这个口子不松**——①②③ 三关都还在，且都不变：\n\n| 关卡 | 要求 | 改法后 |\n|---|---|---|\n| ① 放量收阳止跌 | 收>开 且 收>前收 且 量 ≥ 前5日均量×1.5 | 不变 |\n| ② 缩量回踩不破前低 | 收盘不破 ① 日内低 | 不变 |\n| ③ 放量突破 | 收盘站上 ③线 且 量 ≥ 前5日均量×1.5 | **参照位由「浮动最高点」改为「结构确立位」** |\n| −5% 硬止损 / 浮亏绝不加仓 / 同主线 ≤40% | — | 不变 |\n\n**变的只是「突破」的参照物**：突破的应是**结构**，不是自己。这才是「放量突破」的原意。\n\n## 什么时候用\n\n- **进场信号判读**：`scan_signals.py --both` 同时打印两套口径，纸上对照期用（当前 8 只全池两套都未成立，因 2026-09-30 处于回调段）。\n- **复盘归因**：出现「有行情却没信号」时，先查是不是 ③ 被浮动线抬走了。\n- **改规则前**：本文是 ETF交易系统 §7.9「三处同步」的待办输入；改动需同步真源 §3A.3 + 速查卡 + 观察池模板 + 进场准备模板 + `domains/etf.json` + 三条自动化 prompt。\n\n## 边界与限制（必读）\n\n| # | 限制 | 影响 |\n|---|---|---|\n| 1 | **回测窗口是科技成长大牛市**（三只标的 +156% / +220% / +217%） | 正期望**高度依赖趋势市**，震荡市表现未知 |\n| 2 | 未模拟 R1/R2 弱势豁免通道 | 只跑了「大盘闸门开」，豁免仓未计入 |\n| 3 | 未含滑点 / 整数手 / 涨停无法成交 | 结果偏乐观 |\n| 4 | 进场简化为次日开盘价 | 实际是 9:30~9:45 限价 + 1.02 高开护栏 |\n| 5 | 闸门②（逻辑止损）未实现，用「①结构破」近似 | 与人工三问有偏差 |\n| 6 | **样本 8 只标的、单一阶段、22 笔** | **不能外推为一般胜率** |\n| 7 | **⚠️ 回测用的价格数据未做「单位跳变」清洗** | 那版回测取的是 8 只标的的日K。2026-10-01 复测发现行情源存在**单位跳变**（如 510500 在 2015-04-15 跳 +248.6%、510210 在 2021-01-25 跳 −80%），会让波动率与买点失真。**上述 22 笔的明细尚未重跑清洗版**——结论「浮动③线 0 触发」是**结构恒等式**（不受数据影响），但胜率/盈亏比/期望值三项**需以清洗后重跑为准**。清洗规矩见 行情数据源可用性 §二 坑1 |\n\n> **结论纪律**：证据一（数学恒等式）是**确定的**；证据二～四是**该窗口内的实测**，不是承诺。按 概率思维——**放宽 ≠ 会赚钱**，所以 2026-10-01 只做「脚本加 `--both` 对照」，**不动真源**，先纸上验证。\n\n## 相关\n\n- 信号口径：止跌企稳三信号（③ 的原始定义与五种形态）· 突破真假三验证（假突破过滤）\n- 纪律与离场：海龟止损 · 让利润奔跑 · 趋势持股与卖出信号清单 · 离场三闸门\n- 心态：概率思维（单次对错 ≠ 系统正确）· 交易认知偏差（结果偏好）\n- 真源与载体：ETF交易系统（§3A.3）· ETF交易系统速查卡 · 观察池模板（2026-10-20 已删） · 进场准备模板\n- 原始取证：判断台账 2026-09-18 / 09-21 / 09-22 各行 · 周复盘_第二周_2026-09-11至09-18 §三",

   "body": "# 主线雷达判据验证\n\n> 一句话：用 **348 只 ETF / 2012–2026** 验证主线雷达的三条件判据——**focus 判据是准的**（前瞻 20 日超额 **+0.99pp**、观察池实际 **+1.80pp**），**但「建议下沉 drop」判据方向是反的**（该形态 20 日 **+1.00%**、超额 +0.82pp，位置越低收益越高）。\n> 附带结论：**雷达只覆盖全市场命中事件的 2.1%**，「帮我监视市场」这个目标需要扩范围。\n>\n> ⚠️ 本文是判据留痕，供日后复核与扩范围决策用。不构成投资建议。2026-10-02 立。\n\n## 一、雷达三条件（现网判据）\n\n| 条件 | 定义 |\n|---|---|\n| **C1** | 大盘档位：上证+沪深300+创业板指 **≥2 个「收盘 > MA20」** |\n| **C2** | 代理 ETF **收盘 > MA20 且 当日量 ≥ 5日均量×1.5** |\n| **C3** | 代理 ETF **当日最高价 > 前 60 日最高** |\n\n命中三条件 → 🎯 重点关注（可进入 新赛道研究五步法 第 1/2/3 步）；三分类另有两档：👀 观察中、**⚠️ 深跌区（非出池理由）**（旧名「🗑 建议下沉」，2026-10-02 废弃）。\n\n## 二、验证方法\n\n- 数据：**348 只 ETF**，新浪日K（**跳变截断 + 2%/年分红**），2012–2026\n- 逐只逐日**机械判定**三条件，命中后测 **5/10/20 日前瞻收益**及期间最大回撤\n- 基线 = 同池**所有交易日**的前瞻收益（同口径），超额 = 命中 − 基线\n- 脚本：工作区 `bt_radar2.py` / `bt_radar3.py` / `bt_drop.py` / `bt_corr.py` / `bt_scope.py`\n\n## 三、核心结果\n\n### 3.1 focus 判据有真实边缘\n\n| 口径 | n | 20 日 | 胜率 | vs 基线 +0.66% |\n|---|---:|---:|---:|---:|\n| **C1+C2+C3（原判据）** | 5,648 | **+1.65%** | 56.1% | **+0.99pp** |\n| **观察池 8 方向实际命中** | 120 | **+2.47%** | 54.2% | **+1.80pp** |\n\n**分段（只取命中数≥30 的年份）**：2012–2019 超额 **+0.72pp** ／ 2020–2026 超额 **+1.02pp** → **没有衰减，近段还略强**。\n\n### 3.2 「创 60 日新高」是最强的单条件——原以为它是追高，实测相反\n\n| 变体 | n | 20 日 | 胜率 |\n|---|---:|---:|---:|\n| **只 C3（创60日新高）** | 28,362 | **+1.38%** | **57.7%** ← 胜率最高 |\n| 只 C2（站上MA20+放量） | 28,155 | +1.08% | 54.4% |\n| **C2+C3 + 位置<70%（软化追高）** | **206** | **+0.38%** | **50.0%** |\n| C2 改缩量回踩型（量0.5~1.2 + 位置<70%） | 56,820 | +0.50% | 50.9% |\n\n> **结论**：在 ETF 上，**「创 60 日新高」是动量信号，不是过热信号**；加上「位置<70%」这个过滤器，样本从 5,648 塌到 **206**、胜率掉到 **50%**、边缘被抹平。\n> **所以要「让 C3 更安全」的想法是错的**——那会把唯一有效的条件废掉。若担心拥挤度，应由 新赛道研究五步法 第 3 步（拥挤度）人工判断，**不在雷达层过滤**。\n\n### 3.3 「建议下沉 drop」判据方向是反的\n\ndrop 定义 = `60日位置 < 35%` **且** `未站上 MA20` **且** `MA20 下倾`\n\n| 口径 | n | 20 日 |\n|---|---:|---:|\n| **drop 命中** | 94,553 | **+1.00%**（超额 **+0.82pp**） |\n| **位置更极端（<15%）** | 51,829 | **+1.47%** |\n| 基线 | 370,958 | +0.18% |\n\n**位置越低，后续收益越高。** 机制：**ETF 是分散化品种，不会退市/爆雷**，「位置低 + 均线下倾」在 ETF 上更接近**局部底部**（均值回归在地板价上），而不是「没戏」。**雷达把「冷」当成了「坏」。**\n\n→ **已改**：脚本语义由「🗑 建议下沉」改为「**⚠️ 深跌区（非出池理由）**」，建议文案改为「等 ① 放量收阳企稳」；**出池改由人工按 主线雷达操作手册 §五 处理**，脚本不再给方向性错误建议。\n\n### 3.4 C1 口径：简化版与 3A.1 完整版实测无差异\n\n| | 20 日 | 胜率 | n |\n|---|---:|---:|---:|\n| C1 简化（只看收盘>MA20） | +1.65% | 56.1% | 5,648 |\n| C1 完整 3A.1（+斜率+量能） | +1.60% | 56.2% | 4,883 |\n\n→ **保留简化版**（`_radar_check.py` 已输出斜率/量比，需要时可切）。但**报告中须标注口径**，避免与 3A.1 档位表述混淆。\n\n## 四、附带发现\n\n### 4.1 ③弱势豁免通道基本零边缘（**拟另案裁决，本轮未动**）\n\n| | n | 20 日 | 胜率 |\n|---|---:|---:|---:|\n| **③弱势豁免 R1+R2**（v1.16 唯一允许弱势开仓的通道） | 7,748 | **+0.62%** | 52.1% |\n| 基线 | 370,958 | +0.66% | 52.4% |\n\n**超额 −0.04pp** —— 比雷达本身（+0.99pp）宽得多，却没有边缘。与实盘唯一样本吻合：豁免仓 159995 于 09-18 建仓、09-28 −5% 止损出局。\n\n### 4.2 观察池不是「一个方向的多个切面」（原担心已撤回）\n\n8 方向近 250 日日收益**平均两两相关仅 0.36**：\n\n- 512980 传媒/AI视频 ↔ 159869 游戏 = **0.88**（高度重叠）\n- 512480 半导体/芯片 ↔ 512660 军工 = **−0.01**（几乎无关）\n\n### 4.3 数据局限（必须先说）\n\n| 方向 | 可用历史 | 能否验证 |\n|---|---:|---|\n| 通信 159583 | **221 根** | ❌ |\n| 半导体设备 159516 | **58 根** | ❌ |\n| 芯片 159995 | **61 根** | ❌ |\n| 半导体/芯片 512480 | **63 根** | ❌ |\n| 传媒影视 512980 | 2,110 根 | ✅ |\n| 游戏 159869 | 1,354 根 | ✅ |\n| 电子/MLCC 159997 | 1,586 根 | ✅ |\n| 军工 512660 | 2,465 根 | ✅ |\n\n原因：新浪序列的**单位跳变**被截断（见 行情数据源可用性）。**而雷达最常命中的恰是前四只** → 这四只的结论须保留，观察池那 +1.80pp 的样本也只有 n=120。\n\n## 五、扫描范围：现状只覆盖 2.1%\n\n| | 命中事件 | 年均 | 池内占比 |\n|---|---:|---:|---:|\n| 全市场（348 只） | 5,649 | 377 次/年 | — |\n| **其中池内（8 方向）** | **120** | 8 次/年 | **2.1%** |\n| **池外（新方向）** | **5,529** | 369 次/年 | **97.9%（现完全不可见）** |\n\n### 四方案对比\n\n| 方案 | 说明 | 推送/年 | 20 日 | 胜率 |\n|---|---|---:|---:|---:|\n| **A** | 现状：只扫池内 8 方向 | 121 | +1.09% | 55.2% |\n| **B** | 全市场扫 + 连续 2 日命中 + 限 3/日 | 50 | **+3.22%** | **63.2%** |\n| **C** | 全市场扫 + 连续 2 日 + 位置<85% + 限 2/日 | **3** | **+6.94%** | **75.6%** |\n| **D** | 全市场扫 + 连续 3 日 + 位置<85% + 限 2/日 | 1 | +6.85% | 73.3% |\n\n> **关键**：扩大范围**没有稀释质量，反而把质量提高 3~6 倍**。原因：**「连续 N 日命中」这个确认条件本身就是极强的过滤器**——它把「单日脉冲」滤掉，只留「持续转强」。\n> **池内 vs 池外**：池内 +2.47%（n=120）／池外 +1.63%（n=5,529）→ 池内质量更高，说明**人工维护的池子是有价值的**；但池外 97.9% 的事件完全不可见，**「看不见」本身就是最大缺陷**。\n\n**方案 C 实际推送内容（近 18 个月，按月 1~3 个）**：159840 **+30.0%** · 515700 +23.2% · 159952 +18.0% · 561560 +14.6% · 159857 +11.9% · 518800 +8.3% · 512200 +6.3% ／ 反向样本：515220 −18.5% · 159828 −6.3%\n\n## 六、已改 / 未改\n\n| | 内容 |\n|---|---|\n| ✅ **已改（零规则风险）** | `scan_watchlist.py`：drop → **深跌区（非出池理由）**；md/html 标签、小结、脚注同步；docstring 补入全部验证结论与数据局限。`AI上手手册.md` 补入判据验证结论与扫描范围。 |\n| ✅ **已改（扩范围，2026-10-02）** | `scan_watchlist.py` 新增 `--new` 全市场「新方向初现」扫描（**境内/QDII 分层**、数据瑕疵自检、无状态）；新增 `_radar_warm.py` 批量预热缓存。`AI上手手册.md` 补判据验证结论 + 通达信 MCP 映射与迁移顺序。 |\n| ⛔ **未改** | **交易规则真源仍 v1.17（①+②）** · **③豁免通道未动**（拟另案裁决）· **雷达 prompt 未改**（需把 `--new` 接进去；且 tdx 迁移未实测） |\n| 📌 **待裁决** | ① 扫描范围是否扩到全市场（方案 B/C/D）② 扩范围后推送策略与去重 ③ ③弱势豁免通道是否保留 |\n\n## 七、扩范围已落地（2026-10-02）\n\n**方案 C 已实现**并改为「**分两层推**」：\n\n| 层 | 内容 |\n|---|---|\n| **🇨🇳 A 股板块新方向** | 全市场扫 + **连续 2 日命中** + 位置<85% + **每日限 2 个** —— 这才是「板块轮动」信号 |\n| **🌏 QDII/跨境** | 单列一栏、**不占新方向名额** —— 它的「连续新高」反映的是**海外市场自身连续上涨**，属外围参考 |\n\n**为什么必须分层（实测）**：近 6 个月 15 次触发里，**7/8 只有连续段的标的是 QDII**（纳指/美国50/亚太/德国/日经）。若不分层，**QDII 会把真正的 A 股新方向挤掉**。分层后（近 120 交易日）：**境内 9 次 / QDII 21 次**，境内样本 = 电力、绿电、煤炭、龙头券商、生物药、创新药、房地产 —— 这才是板块轮动。\n\n**实现要点**：\n- 标的池 `观察池/_radar_universe.json`（293 只，按成交额降序，剔债/货币，保留黄金商品）\n- **日K 缓存** `观察池/_radar_kline.json`，由 `_radar_warm.py` **并发预热（293 只 6 秒）** → `--new` 扫描 **0.4 秒**\n  （原实现逐只串行抓、每只先等东财超时 = **10~20 分钟**，已提速 1500 倍以上）\n- **数据瑕疵自检**：单只近段价格极差/最低 > 80% 判为跳变残留 → 标「不可用」不计入结果（近 120 交易日剔除 **13 只**，含 159516/512480）\n- 无状态：用日K**机械复算**「今日与上一交易日均命中」，**不依赖昨日是否跑过**\n\n## 八、通达信 MCP（2026-10-02 认定为首选取数源）\n\n`tdx-connector` 已绑定启用（`https://txmcp.tdx.com.cn:3001/txmcp`，Streamable HTTP），**20 个工具**。与现有爬虫的映射：\n\n| 现有做法（脆弱） | 换成 | 收益 |\n|---|---|---|\n| 新浪 `getKLineData`（**单位跳变**，历史被砍到 58~221 根） | **`tdx_kline`** | 无跳变、含成交额、支持 A股/港股/期货/指数 |\n| 腾讯 `fqkline`（~640 根上限） | **`tdx_kline`** | 历史更长 |\n| 东财 `push2his`（**反复拒连**） | **`tdx_kline`** | 稳定 |\n| 东财 `clist` 板块榜（反复拒连） | **`tdx_screener`**（自然语言条件选股） | NLP 选股，不必拼接口 |\n| 手工算 MA/量比/新高 | **`tdx_technical_indicator_query`** | 通达信原生指标序列 |\n| 消息面靠 WebSearch | **`wenda_news_query`** | 实时市场动态核心工具 |\n\n⚠️ **能力边界**：① 该 MCP **只在 WorkBuddy 侧可用**，**本地 Python 脚本调不到**（401 需鉴权、凭据加密不可解）→ **脚本仍走新浪/腾讯，自动化优先用 tdx**；② **本会话未挂载 tdx，无法实测其返回格式** → 迁移须**先在一条自动化上试跑验证**再推广。\n\n## 九、相关\n\n- 判据出处：新赛道研究五步法（第 4 步右侧确认）· ETF交易系统 3A.1（大盘档位，C1 的完整口径）· 主线雷达操作手册（§五 出池优先级）\n- 同期验证：路线B大样本回测 · ③线口径诊断 · 震荡状态识别检验 · 网格交易法 实测节\n- 报告与留痕：报告预判对账 · 观察池模板（2026-10-20 已删） · 行情数据源可用性（跳变截断口径）\n- 心态：概率思维 · 等待最佳时机（没信号就不交易）",

   "source": "03-知识/方法/支撑与压力的画法.md",
   "body": "# 支撑与压力的画法\n\n> 一句话：**只画水平线，画「被买起来 / 被砸下来」的价，≥2 次触及才算数**——画线的唯一目的是给进场带和止损线找落点，不是画着好看。\n\n## 四步画法\n\n1. **日 K、前复权、只画水平线**——斜线是趋势不是支撑压力；ETF 日 K 一根顶指数一天，不用看分钟图；\n2. **支撑：找「跌到这被买起来」的价格**——近 20 日低点 / 横盘平台下沿 / 前低，三个候选取离现价最近的一个；至少被触及 2 次才值得画，触及越多、每次触及都缩量，线越可信；\n3. **压力：找「涨到这被砸下来」的价格**——前高 / 平台上沿 / 向下缺口 / 密集成交区上沿；三信号里的「反弹高点」（①→③期间日内最高）就是最近的压力；\n4. **画窄带不画绝对价**——支撑压力是 ±0.3% 左右的区不是某一分钱（所以判定统一用收盘价）；画完写进 观察池模板（已删 2026-10-20） / 进场准备模板，不画在心里。\n\n## 与系统的咬合点（怎么用不在本卡展开）\n\n- 支撑 S 定了 → 进场带 S×1.03~1.04 → 止损自动落**支撑下方 1~2%**（ETF交易系统 3A.4 进场三问「舒服」档）——这是画支撑的全部目的；\n- 支撑下沿紧贴**插针密集区** → 进场位作废（3A.4 最危险档，159583 实证：插针扫完止损再反弹）；\n- 压力线 = ③要放量突破的线（止跌企稳三信号），突破成立没有另有三关（突破真假三验证）；\n- **ETF 对照指数图画**：两边支撑压力基本重合，指数更光滑更好认；不重合时以 ETF 自身为准（买卖的是它）。\n\n## 资料索引\n\n- **库内**：突破真假三验证（压力侧）· 蜡烛图三原则（K线形态配合）· 三重滤网交易系统（多周期互验）· 欧奈尔成长股准则20条（枢轴点买点）；支撑侧的用法已在 ETF交易系统 3A.4 + 成本口径与止损基准，不重复建卡；\n- **书**（本地 `01-原料/书籍/` 有原料，微信读书可传书）：《日本蜡烛图技术新解》（只看支撑压力+反转形态两章）· 《股票大作手回忆录》（关键点/最小阻力线，薄）· 《期货市场技术分析》（支撑压力原典章节，当字典查）· 《笑傲股市》（枢轴点买点，库内有准则卡可缓）；\n- **一句话**：画法本身是入门概念，本卡四步已够用；书的价值在「为什么有效」（筹码与人性），按需查不通读——观察池的时间预算比大部头值钱。\n\n> 免责：技术概念是概率不是保证，画出的线必须配止损纪律使用；AI 内容仅供学习参考。",

   "body": "# 止跌企稳三信号（右侧进场）\n\n> 一句话：阴跌/破位后**别猜底**——等三个信号齐全再进：① 放量收阳不再创新低（止跌）→ ② 缩量回踩不破前低（确认）→ ③ 放量突破反弹高点（**进场点**）。1、2 是\"等\"的信号，只有 3 能买。\n\n## 是什么\n\n\"等企稳再进场\"（ETF交易系统 3B.5 离场后重进、3A.1 不接飞刀）经常因三个词含糊而无法执行：「放量」看哪个量？放多少算数？「右侧确认」确认什么？本卡把这三个词全部量化为可打勾的动作。\n\n**为什么必须等 ③ 而不是 ① 就进**：单日放量收阳也可能是超跌反抽（一天游）；只有\"回踩不破 + 二次放量突破\"才能证明资金是**持续**进场而不是博一把就跑。买在 ① 是猜底（赚接飞刀的钱），买在 ③ 是顺势（赚涨起来那段）。\n\n## 三个信号（右侧进场检查表）\n\n| 信号 | 含义 | 怎么认 | 能买吗 |\n|---|---|---|---|\n| **① 放量收阳止跌** | 有资金进场承接，跌势到头 | 放量日收阳/长下影，**收盘不再创新低** | ❌ 只观察，放进观察池盯住 |\n| **② 缩量回踩不破** | ① 是真的不是反抽，抛压确实没了 | 涨 1~2 天后回落，**缩量**且**不破 ① 的低点**（前低） | ❌ 还等临门一脚 |\n| **③ 放量突破** | 下跌结构被打破，趋势转多 | 再**放量突破 ② 反弹的高点** | ✅ **进场点**：试探仓 1/5~1/4 + 挂 -5% 止损 |\n\n时间验证（**全按交易日计**）：①→② 回踩 1~3 个交易日、②→③ 等突破 2~10 个交易日、全程 5~15 个交易日；**至少 2~3 个交易日**，1 天反抽永远不算数。\n\n## ①②③之间的五种形态（2026-09-13 补，答疑沉淀）\n\n> ①②③ 之间隔几天才是常态，之间走出的形态就这五种。每步的命门是同一条线——**①的日内最低价，且只用收盘价判**（三个判定全用收盘价，两个参照全用日内极值）。\n\n### 形态A：标准回踩\n\n- **长相**：①后 1~3 个交易日缩量回落，收盘不破①日内低；\n- **判定**：量 ≤0.7×5日均量 + 收盘 > 前低 → **②当场成立**；\n- **动作**：勾②，等③放量突破反弹高点——最好走的路；\n- **命门**：收盘跌破①低 → 重新计数。\n\n### 形态B：缩量横盘磨底\n\n- **长相**：①后贴着①收盘窄幅（±1% 内）横 2~5 个交易日甚至更久，量柱逐日变矮；\n- **判定**：量缩 ≤0.7× + 收盘不破前低 = **弱②等价**——回踩用「价格向下+量缩」验证抛压枯竭，横盘用「价格不动+量更缩」验证，等价成立。横盘期间的日内最高就是③要突破的线，每周五整表时刷新（前低不动）；\n- **动作**：**不动**。资格只在③放量突破横盘区高点当天生成；横盘越久突破越可靠，但不是提前买的理由；横盘天数照吃观察期额度，磨 2 周没突破时间兜底照样强删；\n- **死穴**：重心逐日下移（那是阴跌不是磨）/ 收盘破前低 / 放量收阴（有资金出逃，直接出池）。\n\n### 形态C：盘中插针\n\n- **长相**：某日盘中戳破前低、收盘收回；\n- **判定**：收盘判**不算破，①没死**；但连续多日插针 = 有资金反复试探，警惕级别上调、降级处理；\n- **动作**：不动，记下插针低点；若插针区紧贴止损设计位 → 回看 ETF交易系统 3A.4 插针区警告（159583 实证：插针扫完止损再反弹）；\n- **命门**：一旦收盘真破 → 全部重新计数。\n\n### 形态D：不回踩直接连涨\n\n- **长相**：①后不回踩直接连涨（含缩量连续大涨几天 5%+）；\n- **判定**：②无锚 → ③的突破线跟着天天上移，结构已经跑掉；\n- **动作**：**放弃这笔，等新结构**。错过成本 = 0，绝不追——「怕踏空」是代表性偏差；等它自己走出新结构，按三信号从头再来；\n- **命门**：无（它已经不欠你什么了，是你欠它一个「不追」）。\n\n### 形态E：②后滞涨\n\n- **长相**：②成立后既不突破也不回落，量能温吞横着；\n- **判定**：不破前低就还活着，但在吃观察期倒计时；\n- **动作**：继续等③，每周五整表刷新反弹高点；时间兜底（2~3 个交易周）一到照样强删——「磨」不是无限期赖池的理由；\n- **命门**：收盘破前低 / 放量收阴，同 B。\n\n## 口径与边界（2026-09-12 补，09-13 增，答疑沉淀）\n\n- **总口诀：三个判定全用收盘价，两个参照全用日内极值**——①「不创新低」/②「不破前低」/③「突破」的**判定**一律收盘价；**参照点**前低=①当日日内最低、反弹高点=期间日内最高，记录取日内极值。\n- **① 当天「不创新低」用收盘价判**：收盘不低于近期下跌低点即算——盘中插到新低、收盘收回 = 长下影探底，常恰是①的模样；但参照点仍记「①当日日内最低」（插针低点会成为前低，这正是 3A.4 插针区警告的来源）。\n- **① 前低 = ① 当日的日内最低价**（不是收盘价）；「不破」**用收盘价判**——回踩日收盘低于①日内低点才算破；盘中插针破、收盘收回 = 不算破但要警惕（连续插针逼近 = 抛压未枯竭，降级处理）。\n- **② 反弹高点 = ①→② 期间反弹各日的日内最高价**（取最高那根的最高价）；③「突破」同样**用收盘价判**——盘中刺上、收盘缩回 = 伪突破，不算。\n- **③ 执行时点**：③ 当日**尾盘 14:30~14:55** 进场（条件：价格站稳反弹高点上方 + 全天量能已明显放大）；尾盘未及执行 → 次日开盘执行，参照 ETF交易系统 3A.6 高开护栏精神（高开 >2% 挂低等回落，不回落放弃）。\n- **① 后不回踩直接连涨**：② 不成立 → ③ 无锚 → **放弃这笔，等下一个结构**（错过成本 = 0；「怕踏空」是代表性偏差）。\n- **② 的弱等价形态**：缩量横盘磨底、或贴着①附近的缩量微涨（日涨幅约 1% 内）不破①低，都算弱②——量缩证明抛压枯竭即可，不必非砸出深度；若**缩量连续大涨**（几天涨出 5%+）= 已是「不回踩直接连涨」D 情形，不追，等新结构。\n\n## 量能口径（看哪个量、放多少算数）\n\n1. **看具体那只 ETF 自身的成交额**（你买卖它就看它的日 K 量柱）——量价必须同标的才配对。ETF 成交极清淡时才退看其跟踪指数/龙头；用户持仓的 159273/510300/159107/510210 流动性都够，直接看自身。\n2. **和它自己近 5 日均量比，不看绝对数字**（小 ETF 放 2 亿是巨量，宽基 2 亿是地量）：\n   - 缩量（抛压枯竭/跌不动）≈ 近 5 日均量的 **0.7 倍以下**\n   - 温和放量（资金进场）≈ **≥1.5 倍**；明显放量（倍量）≈ **≥2 倍**\n3. **完整企稳是两步，缺一不可**：先缩量跌不动（卖盘枯竭）→ 再放量拉回（买盘进场）。只有缩量没放量 = 可能还有最后一跌；只有放量没缩量铺垫 = 可能是超跌反抽。\n4. **盘面工具速查（2026-09-13 补）**：VOL 副图的 **MAVOL5** 就是 5 日均量线——量柱明显高于它一截 ≈ 放量、缩到它下面 ≈ 缩量；手机 App 的**量比**（当日每分钟均量 ÷ 近 5 日每分钟均量）收盘后 ≈ 全天量对 5 日均量的倍数：**量比 ≥1.5 = 放量、≤0.7 = 缩量**，盘中（如尾盘 14:30 验③）也能实时看。注意 MAVOL5/量比按**成交量（手）**算、系统口径按**成交额**——ETF 单日价格波动小，两者几乎相等，仅除权/份额折算日失真，那时改用成交额人工核算。**量比 ≥1.5 只是「放量」这一条腿**：① 还须同时收阳 + 收盘不创新低；放量 + 收阴反而是出货警讯。\n\n## 两个坑（比\"放多少量\"更重要）\n\n- ⚠️ **放量 + 继续收阴创新低 = 放量下跌**（出货），不是企稳——量对了方向错，绝对不能接。\n- ⚠️ **别在 ① 当天进场**：① 也可能只是反抽；等 ②③ 确认是\"少赚一段\"与\"接飞刀深套\"的差别。\n\n## 进场后\n\n- 仓位：试探仓 **1/5~1/4**，分批小仓（对齐 ETF交易系统 3A.5/§四）；\n- 止损：挂 **-5%**，位置放 **② 回踩低点下方**（对齐 ETF交易系统 3A.4 进场三问：止损≈关键支撑下方，别悬空别骑支撑）；\n- 买的同时写下两行规则：价格线 + 逻辑线（止损触发三问）。\n\n## 与纪律对接\n\n- **路线B 止损离场后想重进**、**观察池标的首次建仓**、**破位后被\"急跌必有急反\"勾住想抄底** → 都走这套三信号，走不完就空仓等（空仓也是仓位）；\n- **路线A 宽基不适用本卡**——A 线定投越跌越买、不设止损，右侧信号只属于路线B 波段；两线不许互相污染（ETF交易系统 §一）。\n\n## 一句话记忆\n\n**① 好像到底了 → ② 确实到底了 → ③ 开始涨了。买在 ③，别买在 ①。**\n\n> 免责：技术信号是概率不是保证，任何信号进场都必须配止损线；AI 内容仅供学习参考。",

   "oneliner": "海龟式\"突破入场\"最怕假突破——墨菲给三把滤网验真：①价格确认（收盘价穿越 ≥ 3%，重要位可放宽到 10%）②时间确认（连续 2 天收在另一侧）③角色确认（突破后原阻力变支撑、回踩不破才算数）。三关都过再追，专治\"一突破就追、一追就被套\"。",
   "source": "03-知识/方法/突破真假三验证.md",
   "body": "# 突破真假三验证\n\n> 一句话：海龟式\"突破入场\"最怕假突破——墨菲给三把滤网验真：**①价格确认（收盘价穿越 ≥ 3%，重要位可放宽到 10%）②时间确认（连续 2 天收在另一侧）③角色确认（突破后原阻力变支撑、回踩不破才算数）**。三关都过再追，专治\"一突破就追、一追就被套\"。\n\n## 是什么\n期货市场技术分析 第4章给的有效突破判定标准。唐奇安突破入场 解决了\"什么时候该注意\"（创新高），但这本解决\"这个突破是真的还是假的\"——**支撑/阻挡、趋势线被穿越多深、持续多久、之后回不回头，决定这次突破要不要信**。核心思想：让市场用\"穿越的幅度 + 时间 + 角色互换后的回踩\"来证明自己，而不是靠当天盘中一瞬的刺穿。\n\n## 具体怎么做\n\n### 第一关 · 价格确认：穿越要够深（幅度过滤）\n- 收盘价穿越才算数，**盘中瞬间刺穿不算**。\n- 价格过滤器：重要趋势线/支撑阻挡的突破要求**收盘价穿越至少 3%**；越重要的水平，要求的穿越幅度越大（有分析师用 10%）。\n- 短线交易可放宽到 **1%**（否则等 3% 走完已错过一大截）；仓位越短、要求越严时用更小的过滤值。\n- 过滤值两难：设太小→滤不掉\"拉锯\"噪音；设太大→有效信号出现前错过初始行情。**按所追市场趋势的发育程度自己调**，没有万能值。\n\n### 第二关 · 时间确认：收盘要站住（时间过滤）\n- 最常见的\"两天原则\"：**市场必须连续两天收市在趋势线/关键位的另一侧**，突破才成立。\n- 只持续一天、次日又收回来 = 不成立，继续等。\n\n### 第三关 · 角色确认：突破后看回踩（结构过滤）\n- 支撑/阻挡被**决定性地**穿越后互换角色：**原阻力变成支撑（向上突破后），原支撑变成阻挡（向下突破后）**——旧线向右延长，等价格回踩新角色线不破，确认突破有效。\n- 趋势线同理：上升趋势线被向下突破后变阻挡线，反弹到它下方被压回 = 确认转弱。\n- 反向证伪信号：向上突破后价格又跌回突破位下方、**把突破跳空完全填回** → 原突破不成立，是假突破。\n- 跳空辅助辨型：**突破跳空**（高量、通常不填回，之后调整中充当支撑/阻挡）→ 突破可信；**衰竭跳空**（趋势末段，几天内被填回）→ 行情将尽。\n\n### 一条总流程（画趋势/等突破时照做）\n1. 先画线：标出关键支撑/阻挡、趋势线（两点成线，**第三点回踩确认**后才算有效趋势线）。\n2. 突破当天不追：看收盘价是否穿越（幅度关）+ 是否连续两天（时间关）。\n3. 突破成立后等回踩：价格回到原阻力（现支撑）不破，再上车——比突破瞬间追价更安全。\n4. 用角色互换位置设止损：跌破新支撑/回到突破位下方即离场，亏损有限。\n\n## 何时用 / 何时不用\n- 用：趋势跟踪/突破类入场（对应 唐奇安突破入场、海龟加仓）——把\"创新高就买\"升级为\"创新高 + 三关验证后才买\"，滤掉多数假突破。\n- 不用：纯震荡市（区间内来回穿越，三关也会反复误报）——横向延伸阶段本就该用 等待最佳时机 空仓，而不是硬做突破。\n\n## 关联\n- 上游概念：最小阻力线（方向判断）、机械交易系统（把三关写成规则）\n- 短线总装：合并进 短线纪律核对表 的盘前/触发段\n- 姊妹卡：资金管理四上限（同书，入场后管仓位与风险）",

   "body": "# 蜡烛图三原则\n\n> 一句话：K 线形态满天飞，但尼森给的用法只有三条铁律——**①位置比形状重要（同样长下影：低位锤子线=买、高位吊颈线=卖）②顺着趋势用信号（牛市里的多头信号才做多，熊市的多头信号只用来平空）③止损定在形态极值外侧、动手前先算风险收益比**。形态是信号不是圣旨，三条少一条就放弃这笔。\n\n## 是什么\n日本蜡烛图技术新解 的核心心法。新手看 K 线只看\"这个形态看涨/看跌\"，尼森指出形态本身**没有固定方向**——同一根蜡烛线在不同位置含义完全相反（日本原话：\"如果它出现在下方，买入；如果它出现在上方，卖出\"）。真正的功夫在形态之外的三条上下文判断。\n\n## 具体怎么做\n\n### 原则一 · 位置比形状重要（先看形态在哪）\n下单前先回答：**这个形态出现在趋势的什么位置？**\n| 形态（形状一样） | 低位/大跌后 | 高位/大涨后 |\n|---|---|---|\n| 长下影小实体 | **锤子线**=买（正在锤磨底部） | **吊颈线**=卖（空头要吊死多头） |\n| 长上影小实体 | 试盘（可能转强） | **流星线**=卖（上方卖压重） |\n| 反转信号 | 底部反转=关注买入 | 顶部反转=关注卖出 |\n\n- 判定：形态须出现在**大幅下跌/严重超卖之后**（锤子）或**明显上升之后**（吊颈/流星）。两三天下跌后的\"类锤子\"没有指示作用。\n- 反转信号要等**收盘价确认**：盘中刺穿不算，收盘站在关键位另一侧才算数。\n\n### 原则二 · 顺着趋势用信号（先定大势，再谈信号）\n- **上升趋势中**：多头信号（锤子/启明星/多头吞噬）→ 建立/加仓多头；空头信号（乌云盖顶/吊颈/空头吞噬）→ 只**冲销既有多头**，不反手做空。\n- **下降趋势中**：空头信号 → 建立空头（期货）/离场；多头信号 → 只用来**平掉空头**，不抄底做多。\n- 大前提：先确认趋势（趋势线/均线/三重滤网交易系统 定方向），**熊市里再漂亮的锤子线也不做新多**——除非行情已突破下降趋势线。\n\n### 原则三 · 止损在外侧 + 先算风险收益比\n- **止损点 = 形态极值的外侧**（按收盘价触发）：\n  - 做多（锤子/启明星）→ 止损在形态最低点下方；\n  - 做空（乌云盖顶/空头吞噬）→ 止损在形态最高点上方；\n  - 用窗口做支撑/阻力 → 收盘价封闭窗口 = 趋势结束信号（做多者止损离场）。\n- 形态完成后**不急着下单**：先量\"止损位到目标位\"的距离。\n  - 目标价怎么定：蜡烛图自己不给目标 → 用支撑/阻力、趋势线、回调位、前高前低（**K 线发信号、西方工具定目标**）。\n  - 风险收益比不诱人（参照 资金管理四上限 的 **≥3:1** 门槛）→ **放弃这笔**，拉弓等待下一次。\n- 例（原书）：启明星完成价 1205，止损位 1169（风险 36），目标 1220（收益 15）→ 收益风险比太低，不值得买。\n\n### 一张核对短句（下单前默念）\n形态位置对吗（不在高位找底、低位找顶）→ 大势顺吗（牛市的买、熊市不平反）→ 止损挂了吗（形态外侧）→ 收益是风险的 3 倍吗（不够就放）。\n\n## 何时用 / 何时不用\n- 用：日内/波段入场那一瞬间的信号识别——看到\"锤子/吞没/黄昏星/启明星/乌云盖顶\"时，用三原则过滤后再决定动不动。\n- 不用：判断大方向（那是趋势分析的事，见 最小阻力线 三重滤网交易系统）；信号频繁的震荡市（\"像8级地震\"时形态全是噪音，退场观望）。\n\n## 关联\n- 同逻辑不同尺度：突破真假三验证（墨菲讲支撑/趋势线突破也要收盘确认 + 幅度过滤）\n- 入场后风险：资金管理四上限（3:1 盈亏比门槛）、2%与6%法则（单笔/月度风险红线）\n- 总装进：短线纪律核对表（触发信号段）",
   "id": "03-知识/方法/蜡烛图三原则.md"

   "status": "未学",
   "oneliner": "把「厄尔尼诺」这类事件驱动主题，按产业链传导拆成四阶段炒作顺序的经验框架——预期发酵→能源需求→暴雨资源→兑现反向。⚠️ 它是「题材先后顺序的经验」，不是 30 年不变的真理：用前必须先校验当前 ENSO 状态与发展阶段（对照 WMO 月报），否则会照本宣科买在错误阶段。",
   "source": "03-知识/方法/厄尔尼诺顺序.md",
   "body": "# 厄尔尼诺顺序\n\n> 一句话：把「厄尔尼诺」这类**事件驱动主题**，按产业链传导拆成**四阶段炒作顺序**的经验框架——预期发酵→能源需求→暴雨资源→兑现反向。⚠️ 它是「题材先后顺序的经验」，**不是 30 年不变的真理**：用前必须先校验当前 ENSO 状态与发展阶段（对照 WMO 月报），否则会照本宣科买在错误阶段。\n\n## 是什么\n\n一类「事件驱动主题」的产业链顺序框架：天气/宏观事件（厄尔尼诺）→ 不同板块在不同阶段接力上涨。它的价值不是预测涨幅，而是**把模糊主题拆成可跟踪的产业链节点**（与 CANSLIM选股法「先 M 后 L」思路同源，见 复盘笔记_2026-09-08（已删 2026-10-20） 19:38 笔记「做消息下一环」）。\n\n### 四阶段顺序（原文要点，2026-09-08）\n\n| 阶段 | 性质 | 板块链条 |\n|---|---|---|\n| 一 | 预期发酵（干旱/减产预期） | 种业 → 白糖 → 钛商品 → 航运 |\n| 二 | 高温/能源需求（中期） | 火电 → 煤炭 → 天然气 → 电力设备 |\n| 三 | 暴雨/资源品（后期） | 工业金属°（铜、铝）→ 水利基建 → 水产养殖 |\n| 四 | 兑现 / 反向（尾声） | 主题临近兑现前的高位接力——最后一棒最危险 |\n\n## AI 校验（2026-09-09）：链条哪些准、哪些牵强\n\n**背景锚**：WMO《El Niño/La Niña Update》(2026-08) 确认 El Niño 已确立，近 100% 概率持续至 2027-02，将达 very strong、可能是有记录以来最强（峰值 2026-11 ~ 2027-01）；NOAA CPC 2026-09 显示 Niño-3.4 距平 +1.4°C（7 月均值）、10-12 月有 69% 概率超 1950 年以来纪录。**当前处于事件增强期，不是尾声。**\n\n| 阶段·板块 | 准确度 | 理由 |\n|---|:-:|---|\n| 一·**白糖** | ★★★★★ | 30 年最稳传导：印度/泰国干旱 → 甘蔗减产 → 国际糖价 |\n| 一·**航运** | ★★★★ | 路径=中美洲干旱 → 巴拿马运河限航 → 运价（2023-24 已验证） |\n| 一·**种业** | ★★ | 中国主粮自给+储备厚，弹性小，更多是政策+粮价综合反映 |\n| 一·**钛商品** | ★ | 主驱动是航空航天/军工/产能，与 El Niño 无直接因果，归因牵强 |\n| 二·**电力设备/火电** | ★★★ | 暖冬+极端高温推升负荷，逻辑在，但时间窗口未到（峰值 2026Q4~2027 夏） |\n| 二·**煤炭/天然气** | ★★ | 反直觉点：暖冬→取暖需求降→偏利空；只剩「夏储」+2027 夏高温预期 |\n| 三·**水利基建** | ★★★ | El Niño 衰减/转拉尼娜年长江流域洪涝→水利订单，主兑现窗口在 **2027 汛期** |\n| 三·**工业金属（铜铝）** | ★★ | 主驱动是全球需求+美元；「暴雨→减产」只在智利/秘鲁特定矿区成立，归因过强 |\n| 三·**水产养殖** | ★ | 暴雨→鱼塘受灾逻辑存在但弹性小、影响有限 |\n| 四·**兑现/反向** | ★★★ | 「高潮-兑现」是 A 股主题普适铁律；但当前 El Niño 才开始增强，「尾声」时机错位 |\n\n### 三个核心问题（用这张卡的必读前提）\n\n1. **「30 年不变」是过度承诺**：本次 WMO 预告为 40 年最强级别，按历史经验线性外推风险大；\n2. **时间窗口错配是最大硬伤**：四阶段≠线性时间轴。2026-09 当下=增强期——阶段一已发生（航运/煤炭已大涨）、阶段二窗口在 2026Q4~2027Q2、阶段三在 2027 汛期、阶段四在 El Niño 衰减/转拉尼娜后。**能交易的只有「阶段一叠加阶段二早期」，且\"先涨的\"此时已是鱼尾不是鱼头**；\n3. **阶段会重叠、非线性**：强 El Niño 下白糖+航运+煤炭夏储可能同步启动，不会整齐排队——框架对弱/中等事件更适用。\n\n## 纪律对接（路线B 视角）\n\n- 与持仓无关的方向消息 → **仅观察记录，不参与**；想参与一律「试探仓 1/5~1/4 + 挂 −5% 止损」，不因文章/当日大涨追高；\n- 当日已大涨的先行方向（航运/煤炭等）= 追高即接最后一棒，等回踩 MA20 不破 + 缩量企稳再议；\n- 跟踪节奏：**WMO ENSO 月报每月 9 日前后发布**（NOAA CPC 每月第二周）——报告「确认/加强」→ 阶段一可再起一波；「不及预期」→ 已涨方向兑现回落。\n\n## 来源\n公众号《30年不变的厄尔尼诺顺序》（维论山客，2026-09-08，用户 2026-09-09 截图分享入库）；AI 校验依据 WMO El Niño/La Niña Update 2026-08、NOAA CPC ENSO Diagnostic Discussion 2026-09（WebSearch 实查，非编造）。\n\n## 相关概念 / 方法\n复盘笔记_2026-09-08（已删 2026-10-20） —— 19:11 笔记（厄尔尼诺科普+炒作评估：粮食 ETF 20 日 +13~20%、分歧已现→观察档）与 19:38 笔记（事件日历三路换轨）；复盘笔记_2026-09-09（已删 2026-10-20） —— 本卡收录溯源；CANSLIM选股法 —— 同为把模糊主题拆成可跟踪节点的框架；新赛道研究五步法 —— 位置/右侧确认流程；高估五类 —— 「题材」是散户财富粉碎机第一名；第二层次思维 钟摆与周期 —— 读市场冷热与一致预期",

   "oneliner": "判断一个新赛道（题材/行业）值不值得进、还有没有上涨空间——别靠新闻标题和宏大叙事，按五步找客观数据：逻辑 → 验证 → 位置 → 右侧确认 → 小仓试错。",
   "source": "03-知识/方法/新赛道研究五步法.md",
   "body": "# 新赛道研究五步法\n\n> 一句话：判断一个新赛道（题材/行业）值不值得进、还有没有上涨空间——别靠新闻标题和宏大叙事，按五步找客观数据：**逻辑 → 验证 → 位置 → 右侧确认 → 小仓试错**。\n\n## 是什么\n\n路线B 的**进场前置研究**：止损离场后要不要换赛道、看到一个新题材要不要开仓，先回答「这个赛道有没有上涨空间」，再谈买哪只标的。\n\n三条核心认知（专治换赛道时的自我欺骗）：\n- **上涨空间 ≠ 叙事多宏大**，而是「景气度 × 当前位置」——故事再大，位置在高位、情绪在亢奋端，空间也已经打进价格；\n- **被止损的是标的，不等于赛道没机会**：高位破位的那只是分支，赛道内部往往强弱分化，别拿一只最弱的代表整个赛道（止损触发三问）；\n- **换赛道 ≠ 追已涨上天的热点**：刚被资金抛弃的方向与正在被爆炒的方向，哪个是机会哪个是风险，用位置和钟摆定位。\n\n## 具体怎么做\n\n> 每步都找客观数据，不靠新闻标题。每研究完一个赛道，填一行**赛道档案**（景气逻辑 / 龙头验证 / 估值位置 / 技术状态 / 计划买入价+止损），周末静态梳理观察池时直接用。\n\n1. **逻辑（需求从哪来）**：需求从哪来？渗透率现在多高、还有几倍空间？**谁在真金白银买单**（政策补贴 / 企业资本开支 / 消费者）？能不能讲清 2~3 年景气延续？——画不出这条需求链，说明只是题材炒作不是赛道。\n2. **验证（龙头财报说了算）**：看赛道龙头营收/利润增速**是否真的在加速**（对应 CANSLIM 的 C/A）；公司自己砸钱扩产 / 回购 = 真信号，媒体吹 = 噪音。\n3. **位置（好赛道也要好价格）**：这个赛道/板块已涨了多少？估值在历史什么分位？现在交易拥挤吗？——人人都说好的时候，预期已经打进去了（钟摆与周期 / 第二层次思维）。\n4. **右侧确认（等市场自己走出来）**：板块指数**站回 MA20 + 放量**、有龙头创新高，再谈进场（CANSLIM 倒过来用：先 M 看大盘方向给不给机会、再 L 锁定赛道内最强的领导分支）；**不接下跌中的飞刀**。\n5. **小仓试错（用试错成本验证研究）**：试探仓 **1/5~1/4** + 挂 **−5% 止损**；看错了代价很小，看对了再加（试探建仓与加码）。研究说得再漂亮，最后都要用真金白银的小仓试错来验证。\n\n## 什么时候用 / 什么时候别用\n\n- **适合**：路线B 换赛道前、发现新题材想研究时、周末静态梳理观察池（ETF交易系统 §9.2 步骤3）、复盘「亏损的标的是否该换方向」。\n- **不适合**：\n  - 路线A 宽基定投——它不选赛道，是估值定投，别拿赛道思维污染底仓；\n  - **盘中**临时研究——研究放盘前/收盘后/周末，盘中只执行不研究（盘中是情绪接管时刻）；\n  - 用它给「已经亏损的仓位」找继续持有的理由——那是沉没成本在说话，先过 止损触发三问。\n\n## 来源\n\n复盘笔记_2026-09-04（已删 2026-10-20）（17:02 笔记 · AI 评价「直接回答」部分，2026-09-06 提炼为独立卡）\n\n## 相关方法\n\nCANSLIM选股法（先 M 后 L：大盘方向 → 领导分支，五步法的第 4 步靠它落地）· 第二层次思维（好赛道是不是人尽皆知的好）· 钟摆与周期（赛道在情绪钟摆哪一端）· 止损触发三问（区分标的与赛道、逻辑破坏与价格噪音）· 试探建仓与加码（小仓试错 → 盈利加码）· 短线纪律核对表\n\n## 配套工具\n\n新赛道研究工作表（07-复盘笔记/ETF/，可照填的模板——方法卡讲\"是什么\"，工作表讲\"每一步怎么打勾\"，周末研究赛道时直接填表）· 读财报看景气（第二步\"验证龙头财报\"的具体打法：增速/毛利率/现金排雷三步 + 排雷三问，源自 一本书读懂财报）",

   "oneliner": "用七个字母当过滤器，在几千支股票里筛出\"盈利加速 + 创新高 + 大盘配合\"的真领涨股——C 当季盈利暴增、A 年度盈利持续增长、N 有\"新\"催化并创股价新高、S 供需健康且放量突破、L 是行业领导股、I 有机构资金认同、M 大盘方向向上。七关不是\"挑几个满足\"，是全部满足才值得下重注。",
   "source": "03-知识/方法/CANSLIM选股法.md",
   "body": "# CANSLIM选股法\n\n> 一句话：**用七个字母当过滤器，在几千支股票里筛出\"盈利加速 + 创新高 + 大盘配合\"的真领涨股**——C 当季盈利暴增、A 年度盈利持续增长、N 有\"新\"催化并创股价新高、S 供需健康且放量突破、L 是行业领导股、I 有机构资金认同、M 大盘方向向上。七关不是\"挑几个满足\"，是全部满足才值得下重注。\n\n## 具体怎么做（步骤化）\n欧奈尔用 1952-2001 年每年涨幅最大的 600+ 支股票复盘出这套公式，执行顺序建议**倒过来用**（先 M 后 C，避免在错误环境里做无用功）：\n\n**Step 0 先看 M（市场方向）——最高优先级的闸门**：\n- M = Market Direction。**大盘下跌时约七成个股跟着跌**，再好的选股也扛不住系统性下跌\n- 每日跟踪大盘指数（标普500/道指/纳指/或A股上证+创业板）：判断现在牛还是熊\n- 识别顶部信号：**放量滞涨（\"倒货日\"）**——成交量大增但指数涨不动/收跌；连续出现多日 = 大盘见顶，先持币\n- 识别底部信号：缩量企稳后再放量上涨（\"跟进日\"）→ 牛市起步\n- 大盘转弱就空仓等待，**不逆势硬扛、不抄底接刀**（这是七字母里\"一票否决\"的一项）\n\n**Step 1 用 L 锁定\"领导股\"候选池（缩小范围）**：\n- L = Leader。只买**行业龙头**：RS 相对价格强度排名前 20-40% 的股票（IBD 用 RS Rating）\n- 不买\"便宜的二流股\"：二流股牛市涨得慢、熊市跌得狠\n- 对照表：同板块内选最强的 1-2 支，而不是最\"划算\"的那支\n\n**Step 2 用 C + A 确认基本面够硬（真成长）**：\n- C = Current Quarterly Earnings（当季每股收益）：**当季 EPS 同比大增 25-30% 起步，40-500% 更佳**——股价上涨最直接的燃料是当季业绩\n- A = Annual Earnings（年度盈利增长）：**过去 3 年每年 EPS 增长 25% 以上**（100%+ 更好），且最近两季度增长在**加速**\n- C+A 合读 = \"盈利持续且加速度\"的成长股画像；只满足其一容易买错（单季暴涨可能是卖资产/一次性收益）\n\n**Step 3 用 N + S + I 确认时机与资金面（现在能不能买）**：\n- N = New：公司要有**新产品 / 新管理 / 新高度**——真正的牛股总在\"创新高\"时启动而非跌深反弹后；**在股价创出新高时买入是特征不是禁忌**（与抄底直觉相反）\n- S = Supply & Demand：流通盘适中（小盘更易涨）；**突破时成交量放大 40-50%+（常达 500-1000%）**——量是机构吸筹的脚印，无量突破不可信\n- I = Institutional Sponsorship：要有**聪明钱（基金/机构）在买**——机构是推动大牛股的主力；但别买机构已过度抱团、利好出尽的\n\n**Step 4 只在\"精确买点\"扣扳机（把 N 落到图形上）**：\n- 等股价形成健康形态（如 杯柄突破买点）并**放量突破买点**时入场，不在半路追高\n- 买入同时挂好 **7-8% 止损位**（见 欧奈尔买卖纪律）——公式管\"买什么\"，纪律管\"错了怎么办\"\n\n## 能举的例子\n- 例 1（C+A 验证）：某公司当季 EPS 同比 +180%、过去 3 年每年 +60% 且逐季加速 → C/A 双过；若同时是板块内 RS 第一、创一年新高、放量突破 → 进入可买名单\n- 例 2（M 一票否决）：2022 年熊市里哪怕找到 C/A/L/N/S/I 全过的个股，M 不过 → 空仓等待，不买任何\"突破\"（熊市中大多数形态会失败）\n- 例 3（N 的反直觉）：很多人嫌\"涨太高不敢买\"的股票（如当年思科、得州仪器创新高时），恰恰是 CAN SLIM 的买点；而\"跌了很多很便宜\"的股票往往是价值陷阱\n\n## 为什么重要 / 常在哪出现\n- 它回答了路线 B（战术/成长轨）的核心问题：**\"好公司\"遍地都是，怎么挑出会涨的那一支**——用盈利加速度(C/A)筛基本面、用领导地位(L)和机构认同(I)筛资金面、用创新高(N)和量能(S)筛时机、用大盘(M)筛环境\n- 与 安全边际 恰好镜像：价值派买\"跌出价值的便宜货\"，CAN SLIM 买\"创新高的强势股\"——两种方法都对，但**混用必乱**，必须先选定自己的路\n- 它的局限也写在书里：CAN SLIM 的历史样本以美股为主、A 股适用需验证；只适合有精力盯盘和执行的进攻型投资者，不适合 防御型投资者纪律 的定投者\n\n## 来源\n笑傲股市（引言 + 第1-7章逐字母拆解 + 第一部分总结\"牢记并运用\"）\n\n## 相关概念 / 方法\n杯柄突破买点 —— N 的图形化落点；欧奈尔买卖纪律 —— 公式选股后的止损止盈配套；海龟交易法则 —— 同为趋势/动量派但偏机械系统，CAN SLIM 多了基本面筛选；安全边际 —— 价值派镜像；双轨并用决策 —— CAN SLIM 属于路线 B 的操作系统",

   "source": "03-知识/方法/投资错误清单.md",
   "body": "# 投资错误清单\n\n> 一句话：**欧奈尔用 60 年观察总结的\"投资者最常犯的 19 种错误\"**——它不是\"应该怎么做\"的正面教条，而是**一份反向自检表**：逐条对照自己过去的操作，找出的错误越多，改进空间越大。前 3 条（死扛亏损 / 抄底下跌股 / 向下摊平）是犯得最多、代价最高的。\n\n## 具体怎么做（步骤化）\n\n**用法**：不做\"学习材料\"读，做**体检表**用——每次复盘或每季度，逐条问自己\"这一条我犯过吗？最近一次是什么时候？\"打勾的都是待改项。\n\n### A 组 · 头号杀手（与止损直接相关）\n\n| # | 错误 | 反面（应该怎么做） |\n|---|---|---|\n| 1 | 亏损还在合理范围时固执持有，等损失难以收拾才认赔（**犯得最多的一条**） | 跌破买价 7-8% 立即止损 |\n| 2 | 买处于跌势的股票（\"看起来便宜\"）——1981 国际收割机、1999 施乐 34→6 美元 | 不接飞刀，等底部形态成立 |\n| 3 | **向下摊平**（40 买、30 再加，成本摊到 35） | 只在上涨 2-3% 后向上加码（金字塔） |\n| 12 | 一有小赚就获利退场，却死守赔钱股（**完全做反**） | 赔钱股快砍、赚钱股耐心拿 |\n\n### B 组 · 选股标准错误\n\n| # | 错误 | 要点 |\n|---|---|---|\n| 4 | 买很多低价股而非少量高价绩优股 | 要看\"投了多少钱\"不是\"买了多少股\"；低价股差价/手续费占比高、风险大 15-20% |\n| 7 | 因股息或低市盈率选二流股 | 高股息常意味公司变差；低 PE 常是过去表现差的代价 |\n| 8 | 用错选股标准，专挑二流/投机科技股 | 要看盈利、营收、ROE，找真正的市场领导者 |\n| 9 | 只买自己熟悉的老公司股票 | 大牛股常在还不家喻户晓的新公司里 |\n| 11 | 不用图表、不敢买创新高的股票（**98% 的人认为创新高=太贵**） | 牛市最佳买点 = 从 7-8 周基线刚启动上扬时 |\n| 15 | 没认识到\"机构认同 + 图表验证时机\"很重要 | 机构资金是推动上涨的主力 |\n\n### C 组 · 信息与心态错误\n\n| # | 错误 | 要点 |\n|---|---|---|\n| 5 | 想短期不费力气赚大钱，急功近利 | 又不学习、又不止损 |\n| 6 | 听小道消息/传言/电视专家选股 | 传言大多是错的；即使对的，股价也可能跌 |\n| 10 | 不会识别有用的信息和建议 | 朋友、亲戚、经纪人的建议不能照单全收 |\n| 13 | 过度考虑税负与手续费 | 首要目标是获利；为避税忍住不卖会错过大利 |\n| 14 | 只研究\"买什么\"，不管\"何时卖\" | 卖出无原则无计划 = 只做了一半 |\n| 16 | 指望一夜致富，过度依赖期权期货投机 | 无抵押期权风险极大收益极小 |\n| 17 | 总用限价单，纠结几毛钱 | 耽误主要行情、延误止损 |\n| 18 | 该决策时犹豫不决 | 犹豫 = 没有方针原则 |\n| 19 | 不能客观看待股票，只靠偏好与期盼 | 要跟随市场行为，不是个人意见 |\n\n## 能举的例子\n- 例 1（错误 2 的两个真实案例）：1981 年买国际收割机（当年最低价买入），结果公司差点破产；1999 年买施乐 34 美元\"看起来便宜\"，一年后跌到 6 美元。\n- 例 2（错误 3 的算术）：40 买、30 加 → 成本降到 35，看似\"摊薄\"，实则把更多好钱押在错误决定上，亏损被放大。\n- 例 3（错误 4 的差价算术）：5 美元股票买卖差价 0.25 元 = 5%；50 美元股票差价占比仅 0.5% —— 低价股要先多涨 5% 才能回本。\n- 例 4（错误 12 的对照）：卖飞小赚、死守大亏，是散户最典型的\"两件都做反\"。\n\n## 为什么重要 / 常在哪出现\n- **与 交易认知偏差 / 第二层次思维 同为\"心态层\"锚点**，但风格迥异：卡尼曼讲\"为什么大脑会这样想\"（机制），欧奈尔讲\"具体哪些动作会让你亏钱\"（行为）——**一个归因，一个对照，可搭配用**。\n- **涵盖全库最高频禁忌**：向下摊平、接飞刀、死扛亏损——在 海龟止损、2%与6%法则、止损触发三问 里反复出现，说明这几条是跨系统共识。\n- **对路线 A 的边界**：本清单里的\"止损\"\"不接飞刀\"针对**个股/路线 B**；路线 A 的宽基定投是\"越跌越买\"，两者规则相反，**别拿这张单子去改定投计划**（区分见 双轨并用决策）。\n- 最适合的用法：**打印出来贴在看盘电脑旁**，亏损后逐条对照，比读十本\"成功学\"更有效。\n\n## 来源\n笑傲股市（第8章 投资人常犯的19种错误）\n\n## 相关概念 / 方法\n交易认知偏差 —— 偏差的心理学归因（与本清单互补）；欧奈尔买卖纪律 —— 本章错误的正面对应纪律；止损触发三问 —— 止损执行框架；短线纪律核对表 —— 同类的\"打勾式\"自检表；海龟止损 / 2%与6%法则 —— 跨系统的止损共识；双轨并用决策 —— 路线 A/B 规则不可混用",

   "oneliner": "欧奈尔把\"创新高买入\"落成一张可识别的图——股价先涨一大段、再回调 7-8 周以上形成圆弧底的\"杯\"，杯的右上沿小幅回调形成\"柄\"，价格放量突破柄的上沿（买点/中心点）时，就是精确的买入时刻。杯柄 = 上涨中继的健康整理，突破 = 整理结束、主升段开始。",
   "source": "03-知识/概念/杯柄突破买点.md",
   "body": "# 杯柄突破买点\n\n> 一句话：**欧奈尔把\"创新高买入\"落成一张可识别的图**——股价先涨一大段、再回调 7-8 周以上形成圆弧底的\"杯\"，杯的右上沿小幅回调形成\"柄\"，**价格放量突破柄的上沿（买点/中心点）时，就是精确的买入时刻**。杯柄 = 上涨中继的健康整理，突破 = 整理结束、主升段开始。\n\n## 是什么（定义）\n- 一套**看涨持续形态**：形态完成后股价大概率沿原方向继续大涨，是欧奈尔复盘 600+ 支牛股后认定的\"大牛股最常见启动形态\"\n- 由两段组成：\n  - **杯（Cup）**：前期上涨后的回调+圆弧底。深度通常为前高的 12-33%（太深=走坏），时长 7 周至 65 周不等（太短不扎实）\n  - **柄（Handle）**：杯的右上沿（接近前高处）小幅回调 1-2 周形成，回调幅度小（10-15% 以内）、最好沿下降趋势线收敛——柄的意义是**洗掉最后一批不坚定者**\n- **买点（Pivot Point / 中心点）**：柄的最高点处向上突破的位置，通常**比形态绝对高点低 5-10%**——等真正的历史新高再买就晚了（书中原话：多数买点低于前高 5-10%）\n\n## 三个硬条件（缺一不可）\n1. **放量突破**：突破买点当天成交量比均量放大 **50%+**（牛股启动常见 +500%-1000%）；无量突破 = 假突破\n2. **形态健康**：杯底与柄部出现 **2-3 周成交量萎缩**（惜售、抛压枯竭）；周线波动窄幅收敛\n3. **相对强度在线**：该股是板块领导股（RS 靠前），且大盘（M）方向向上——熊市里形态成功率暴跌，不买突破\n\n## 能举的例子\n- 例 1（教科书杯柄）：某股 20 元涨到 40 元 → 回调到 28 元（-30%，杯左壁）→ 圆弧回升到 38 元 → 小回调到 35 元形成柄 → 放量突破 38 元买点 → 主升到 55 元。买点 38 元而非等它创新高 40+ 才追\n- 例 2（假突破识别）：突破当天量能平平（<50% 均量）→ 不买；或突破后 3 天内跌回柄内 → 形态失败，离场观望\n- 例 3（第三/第四次底部 = 走坏）：同一支股票反复构筑松散、过宽的底部形态，柄像楔形/太宽松 → 放弃（书中明确：底部阶段越往后形态越不可靠）\n\n## 为什么重要 / 常在哪出现\n- 它解决了动量交易最纠结的问题：**\"创新高买\"到底在哪一秒买**——不是追盘中最高点，而是等\"放量突破整理区上沿\"这个精确信号，把追高风险降到最低（欧奈尔：买点精准时，股价很少从买价跌 8%）\n- 与 CAN SLIM 的 N（创新高）是一体两面：基本面用 C/A 筛\"该买谁\"，杯柄用图形定\"何时扣扳机\"\n- 与价值派完全相反的位置感：安全边际 说\"跌出来的便宜才是机会\"，杯柄说\"突破整理后的新高才是买点\"——两套系统对着同一张 K 线会给出相反动作，正因如此**才要先定轨再操作**\n\n## 推论 / 使用注意\n- 买点上方 5% 之外**不追高**（延伸太远，一个正常回调就会打到止损）\n- 买入即挂 7-8% 止损在形态下方（见 欧奈尔买卖纪律）——杯柄管\"何时进\"，止损管\"错了何时出\"\n- 熊市不买任何突破；只有大盘转强（M 确认）后，杯柄形态才有意义\n\n## 来源\n笑傲股市（第12章 如何像专家那样看图 + 第10章 卓法斯基金研究\"股价创新高时买入\"的发现）\n\n## 相关概念 / 方法\nCANSLIM选股法 —— 杯柄是其 N 字母的图形落点；欧奈尔买卖纪律 —— 买点配套的止损止盈；突破真假三验证 —— 通用的突破过滤思路（幅度/时间/回踩），可与杯柄放量条件互证；最小阻力线 —— 利弗莫尔\"中心点\"概念同源（书中引用）",
   "id": "03-知识/概念/杯柄突破买点.md"

   "oneliner": "\"8% 止损 + 20% 止盈 + 只在创新高买 + 向上金字塔加仓\"四条铁律组成的成长股交易纪律——用固定百分比把单笔亏损锁死在 8% 以内，用\"赚两成才卖\"兑现利润，让 3:1 盈亏比自动成立。核心是反人性的：赔钱股快砍、赚钱股多拿（多数人恰好做反）。",
   "source": "03-知识/方法/欧奈尔买卖纪律.md",
   "body": "# 欧奈尔买卖纪律\n\n> 一句话：**\"8% 止损 + 20% 止盈 + 只在创新高买 + 向上金字塔加仓\"四条铁律组成的成长股交易纪律**——用固定百分比把单笔亏损锁死在 8% 以内，用\"赚两成才卖\"兑现利润，让 3:1 盈亏比自动成立。核心是反人性的：**赔钱股快砍、赚钱股多拿**（多数人恰好做反）。\n\n## 具体怎么做（步骤化）\n\n**铁律 1：止损 = 买入价下方 7-8%，无条件执行**\n- 每支股票最大亏损锁死在买入价的 **7-8%**；大盘转弱（熊市信号出现）时收紧到 **3-4%**\n- 一旦触发**立即卖，不等收盘、不找借口、不\"再观望几天\"**——止损如买保险，卖出动作不造成损失（损失在下跌时已发生）\n- 卖出后股票又涨了 ≠ 卖错：保护了本金就永远是对的（巴鲁克：十次对三四次，靠快速止损也能致富）\n- 与 止损触发三问 配合：欧奈尔管\"固定百分比铁限\"，三问管\"触发后判断该清还是该留\"——先砍到舒适仓位，再用三问分类\n\n**铁律 2：止盈 = 从买点上涨 20-25%，分批兑现**\n- 从精确买点算起涨 **20-25%** 考虑卖出（数据来源：牛股突破后普遍先涨 20-25% 再回调整理）\n- **超强股例外**：8 周内就涨 20% 说明是龙头中的龙头 → 至少持有 8 周以上，别急着下车\n- 配合 8% 止损 = 自动 3:1 盈亏比：错两次、对一次仍不亏钱\n- 时间效率视角（书中原话）：3-6 个月赚 20% 远比一年赚 20% 好；一年做两笔 20% = 年化 44%\n\n**铁律 3：只在创新高/精确买点买入，绝不抄底、绝不向下摊平**\n- 只在股价从健康形态**放量突破买点（创新高）**时买入（见 杯柄突破买点）\n- **绝不向下摊平**（越跌越买 = 把好钱砸向坏决定，是全书最高频禁忌，与 海龟止损 同源）\n- **金字塔向上加仓**：股价从买点上涨 2-3% 后再追加（用盈利证明判断对），**只在盈利仓上加码**，把资金集中到最强的 1-2 支上\n\n**铁律 4：集中持仓，反对过度分散**\n- 资金 2-10 万美元 → 持有 **4-5 支**；5 千-2 万 → 3 支；3 千 → 2 支\n- 要买第 6 支？先卖掉手里最弱的一支（**换股操作**）\n- 理由：分散太多 = 反应慢、照顾不过来；真正赚钱的是 1-2 支翻倍股，不是 15 支\"还不错\"的股票\n\n## 能举的例子\n- 例 1（3:1 盈亏比）：40 美元买入，止损挂 37（-7.5%），止盈目标 48-50（+20-25%）——做错两次各亏 7.5% = -15%，做对一次赚 20%+，净赚\n- 例 2（向上加仓 vs 向下摊平）：买入后涨 3% → 加一笔；再涨 3% → 再加一笔（递减规模）。错误示范：40 买、跌到 30 再买 30 块摊低成本——欧奈尔称这\"只会加重错误\"\n- 例 3（20% 止盈的例外）：某股 6 周涨 22% → 属于超强股，不卖，至少拿到第 8 周再评估是否持有 6 个月博长期资本利得\n\n## 为什么重要 / 常在哪出现\n- 它把\"截断亏损、让利润奔跑\"这句老话**变成了可执行数字**：8% 铁限（截断）+ 20% 止盈/超强股例外（奔跑）——没有数字的纪律无法执行\n- 与 2%与6%法则（埃尔德）、海龟止损（海龟 1% 单笔风险）是**同一风险控制思想的三套参数**：埃尔德管\"账户红线\"、海龟管\"波动率仓位\"、欧奈尔管\"单支股票的固定百分比铁限\"——按自己的系统选一套，别混用\n- 反人性强度全书最高：第8章 19 种错误里至少 5 条是它的反面（死扛亏损、向下摊平、赚小钱就跑、听消息、买便宜货）——这套纪律的本质是用规则对抗情绪\n\n## 来源\n笑傲股市（第8章 19种错误 + 第9章 卖出止损时机 + 第10章 卖出获利时机 + 第11章 集中持仓）\n\n## 相关概念 / 方法\n止损触发三问 —— 触发止损后的分类判断框架（与 8% 铁限配套）；海龟止损 —— 同类但用波动率而非固定百分比；2%与6%法则 —— 埃尔德账户级红线；CANSLIM选股法 —— 纪律服务的选股系统；杯柄突破买点 —— 精确买点定义；让利润奔跑 —— 同一思想的方法论表述；趋势持股与卖出信号清单 —— 本纪律\"何时主动卖出\"的图形层展开（第10章），与 20% 止盈互补；投资错误清单 —— 本纪律的反面自检表（第8章 19 种错误）；欧奈尔成长股准则20条 —— 全书的清单化版本",

   "source": "03-知识/方法/欧奈尔成长股准则20条.md",
   "body": "# 欧奈尔成长股准则20条\n\n> 一句话：**《笑傲股市》全书浓缩成的 20 条可打勾准则**——从\"不要买什么\"（细价股、跌势股、向下摊平）到\"要买什么\"（EPS 25%+ 增长、ROE 17%+、行业第一、机构认同），一页纸把 CANSLIM 选股 + 买卖纪律 + 市场判断全串起来。**这是全库少见的\"可直接抄成交易前核对卡\"的材料。**\n\n## 具体怎么做（步骤化）\n\n**用法**：入场前逐条打勾。任一\"必须项\"打不上勾，就不买。\n\n### 选股硬条件（1-8）\n\n| # | 准则 | 具体数字 |\n|---|---|---|\n| 1 | 不买细价股 | 纳斯达克 15-300 美元；纽交所 20-300 美元；绝不碰垃圾股 |\n| 2 | 买增长型股票 | 过去 3 年 EPS 每年 **+25% 起**；市场预期来年 +25% 或更多；现金流入增长 **+20% 以上** |\n| 3 | 最近两季 EPS 大幅上升 | **25%-30% 起**；牛市中要 **40%-500%** |\n| 4 | 看销售金额增幅 | 过去 3 季逐季上升，或最近一季 **+25% 以上** |\n| 5 | ROE 在 17% 以上 | 最优公司落在 **25%-50%** 区间 |\n| 6 | 最近一季税后净利率提高 | 最好处在历史最高净利率附近 |\n| 7 | **不要**根据红利或市盈率选股 | 只要公司在行业内排名第一，就该买 |\n| 8 | 成交量要求 | 多数持股日交易量在几十万股以上 |\n\n### 时机与技术（9-11）\n\n| # | 准则 | 具体数字 |\n|---|---|---|\n| 9 | 学会看股价图 | 辨识支撑/阻力线；**首次突破阻力且成交量超均量 50%+ → 绝佳买点** |\n| 10 | 止损铁限 | 低于买入价 **7%-8% 立即卖出**，不存侥幸 |\n| 11 | **写下出仓准则** | 明确\"什么情况下卖\"+\"想赚多少利润率\"（事前写，事中不商量） |\n\n### 持仓与市场（12-17）\n\n| # | 准则 | 要点 |\n|---|---|---|\n| 12 | 持股中要有机构青睐的绩优股 | 共同基金上一报告期买过；机构支持应**逐季增强** |\n| 13 | 至少有一件热销新产品/服务 | 且市场足够大，能支撑现有销量 |\n| 14 | 大市场处于上升期，或中小型公司受青睐 | 即 CANSLIM 的 M（市场方向） |\n| 15 | 不要什么都投 | 期权/外国股/债券/商品不要多头并进；期权占比限 **5%-10%** |\n| 16 | 管理层持有自家股票 | 利益一致信号 |\n| 17 | 投\"新美国\"企业 | 最近 7-8 年兴起的公司，而非\"旧美国\"老巨头 |\n\n### 心态与禁忌（18-20）\n\n| # | 准则 | 要点 |\n|---|---|---|\n| 18 | 绝不骄傲自满、绝不与市场争论 | 智商/学历不能保证成功；市场永远比你对 |\n| 19 | 公司回购 5%-10% 普通股时要小心 | 查是否更换管理层及其背景 |\n| 20 | **不买跌到低谷的股票，不买持续下跌的股票，不向下摊平** | 全书最高频禁忌的三连 |\n\n## 能举的例子\n- 例 1（硬条件齐备的画像）：一家上市 5 年的公司，最近两季 EPS 同比 +60% / +45%，过去三年 EPS 年均 +35%，ROE 28%，最近一季净利率创新高，正因新产品放量而放量突破 8 周整理平台——20 条里 1-9、12-14、16-17 全部打勾 → 值得集中下注。\n- 例 2（第 20 条的三连禁忌）：某股从 50 跌到 35\"看起来很便宜\"（违反第 20 条前半）→ 继续跌到 28（持续下跌）→ 此时再加仓摊低成本（向下摊平）——三条全犯，是典型的散户亏损路径。\n- 例 3（第 11 条的实操）：买入前写下\"涨 20% 分批止盈；跌破 46.5（-7%）无条件清仓\"——把第 10、11 条同时落地。\n\n## 为什么重要 / 常在哪出现\n- **它是 CANSLIM选股法 + 欧奈尔买卖纪律 的最小可用版**：七字母体系和四条铁律都能在这 20 条里找到锚点——想快速复习整本书，只看这 20 条即可。\n- **与 短线纪律核对表 定位相同、适用对象不同**：核对表服务路线 B 的 ETF 短线（破位/止损/仓位），本 20 条服务**个股成长股**（更多是选股硬条件）。两者可上下搭配：先用 20 条筛标的，再用核对表管执行。\n- **对 ETF 玩家的现实价值**：第 1-8 条的个股财务门槛，可**迁移到 ETF 的成分股质量筛选**（如选主动型/行业 ETF 时看成分股整体 ROE 与盈利增速）；第 10、11、20 条则与路线 B 纪律直接同源。\n- **边界提醒**：20 条整体是**成长股/路线 B 语境**，与路线 A（宽基低估定投）哲学相反——不要把\"不买跌势股\"套到定投计划上。\n\n## 来源\n笑傲股市（第20章 股票投资备忘录：股票投资重要准则 + 投资人错过绩优股买入时机的四大原因）\n\n## 相关概念 / 方法\nCANSLIM选股法 —— 七字母选股系统（20 条是其浓缩）；欧奈尔买卖纪律 —— 第 10/11/20 条展开的完整纪律；趋势持股与卖出信号清单 —— 第 11 条\"出仓准则\"的技术化；投资错误清单 —— 第 20 条的反面清单；短线纪律核对表 —— 路线 B 的执行侧核对表；双轨并用决策 —— 路线 A/B 规则边界",

   "body": "# 趋势持股与卖出信号清单\n\n> 一句话：**欧奈尔把\"什么时候该卖\"从感觉变成了一张可以逐条打勾的清单**——先用「高潮型顶点 + 量能衰竭 + 3/4 级底架」三类信号识别领导股见顶，再用「跌破支撑区五条」确认趋势破坏，最后用「何时该耐心持股」防止过早下车。核心前提：**卖点极少来自公司消息，永远来自价格与成交量的行为**（盈利翻倍时股价可能早已见顶）。\n\n## 具体怎么做（步骤化）\n\n### 第 0 步：卖出决策的两条前提（先记住）\n\n1. **买对了，卖就容易一半**：在精确买点（杯柄突破）入场、且不超过买点 5% 加仓的股票，日后很少跌到买点下方 8% 以下；反之买错的票，往往跌 4-5% 就已知错 → **卖出的从容度，在买入那一刻就决定了**。\n2. **牛市里的\"大卖单\"要用全局视角看**：龙头股会出现为时一周到数周的较强卖压，量比历史不算太大，属正常拉回，别被吓出场。\n\n### 第 1 组：高潮型顶点（10 条 · 顶部信号）\n\n| # | 信号 | 判读 |\n|---|---|---|\n| 1 | 涨升最多的那一天 | 数月推升后，某日收盘涨幅大于启动以来任何一天 → 极近顶部 |\n| 2 | 最大的日成交量 | 成交自放大以来最大的一天，往往就是最后高峰 |\n| 3 | 消耗型缺口 | 整理数月后向上跳空（如 50 → 52 开盘且全天 52 上方）→ 涨升接近尾声 |\n| 4 | 轨道线式快涨 | 周线图连续 2-3 周加速上冲（日线 8-10 天）= 行情最高顶点；两条平行水平线间\"量仍大而价不再上\" |\n| 5 | 出货迹象 | 长期涨升后\"巨额成交 + 价格上涨\"= 出货，在别人还深信不疑前先走 |\n| 6 | 股票分割 | 因拆股在 1-2 周内涨 20-25%，或突破后宣布分割 → 多数情况出清 |\n| 7 | 连跌天数结构反转 | 原来是\"涨 4 天跌 2-3 天\"，突然变成\"跌 4-5 天只涨 2-3 天\" → 性质已变 |\n| 8 | 上升轨道线 | 由数月内多个低点/高点各连成两条平行线，股价快速触及**上轨** → 出清 |\n| 9 | 200 日均线乖离 | 股价高于 200 日均线 **70%~80%** → 卖出 |\n| 10 | 高位跌落 | 已错过顶部，则跌破高点后回落时卖；初次崩滑后偶有回抽，别等第二次 |\n\n### 第 2 组：量能衰竭与其他虚弱迹象（7 条）\n\n1. **低量创新高**：价升量减 = 大户已失去兴趣。\n2. **贴近年内低点**：连日收在当日最低附近，把当天涨幅全部吐掉（日线图上\"向下箭头\"）。\n3. **3 级 / 4 级底架突破**：从第 3、第 4 个价格底架向上突破创新高 → 卖（第 3 次涨升对市场已无吸引力，底架越靠后越宽、越松散、越弱）。\n4. **弱势反弹**：顶部附近第一次大量抛售后，反弹的量与涨幅都萎缩；**在反弹的第 2-3 天就卖**——这是跌破支撑区前最后一次好机会。\n5. **自顶点回落**：跌 **8%** 起要查（区分正常 8-12% 修正 vs 结束）；**跌超 12-15%** 可考虑卖出。\n6. **相对强度（RS）走弱**：IBD 相对价格力量比率跌破 **70** → 考虑卖。\n7. **\"独行侠\"**：个股在涨，但同行业无其他重要成员呼应 → 考虑卖。\n\n### 第 3 组：跌破价格支撑区（5 条 · 趋势破坏确认）\n\n> 定义：**周线收盘**落在已形成的主要价格线或其他支撑区以下。\n\n1. **跌破长期涨升线**：周末收盘低于主要长期上升趋势线，或**放量跌破关键支撑区** → 卖。（趋势线必须连接至少 3 个月线/周线低点，短周期连线无用）\n2. **单日最大跌幅**：长期涨升后出现启动以来最大单日跌幅，且有其他迹象印证 → 考虑卖。\n3. **放量下跌**：出现近几年最大**周成交量**的同时价格跌破 → 卖。\n4. **200 日均线拐头向下**：长期涨升后 200 日均线由升转跌 → 考虑卖；若形态很弱（多数日线处在形态下半部、且在 200 日均线下方）→ 在创新高时卖。\n5. **跌破 10 周均线且无法收复**：收盘低于 10 周均线并在其下徘徊数周反弹不上去 → 考虑卖。\n\n### 第 4 组：其他主要卖出指示点（6 条）\n\n1. **涨幅换挡**：止损设 7-8% 时，涨 25-30% 可获利了结（赚 3 次≈100%+）；**但**若在 1/2/3 周内就涨 20% 的优质领导股 → 别为 25-30% 卖掉，继续持有。\n2. **利好中卖出**：股价已涨且有**好消息发布**时，大户必在此找买主出货 → 考虑卖。\n3. **人尽乐观时清仓**：所有人看来行情明显振奋时赶紧卖（卓法斯：\"人人都跑来煽动别人买股票，说明他们的钱早投进去了，已无法推升行情\"）——**在担心失败时买，在心满意足时卖**。\n4. **盈利减速**：季盈余成长明显放缓或连续两季衰退 → 多数情况卖出。\n5. **别被谣言吓卖**：谣言/坏消息通常只造成短线冲击，是洗小散户的。\n6. **复盘自己的卖出失误**：把历史买卖点画在图上逐笔分析 → 追加规则（欧奈尔 1961 年靠此法亡羊补牢）。\n\n### 第 5 组：何时应该耐心持股（防过早下车）\n\n- **至少给 13 周**：买入后若未跌破止损线，至少给 13 周再判断\"这支股票不行\"。\n- **8 周内涨 20% 的例外**：属于最强股 → **持有至少 8 周以上**，再评估是否持满 6 个月（长期资本利得）。\n- **买入即在图上画防御线**：红笔标出止损位（低于买点 8%）；牛市头 1.5-2 年可给多一点下跌空间。**提高止损线时，切勿贴近现价**，否则会被正常回整洗出场，也失去向上加仓空间。\n- **涨 15% 后注意力转向卖出规则**：开始盯\"何时兑现\"。\n- **绝不让 +20% 变成亏损**：50 买、涨到 60 没卖，就没有任何理由让它跌回 50 以下——不获利入袋已经错一次，别再错第二次。\n- **利弗莫尔**：\"赚大钱不是靠你思前想后，靠的是抱牢。\" 新牛市头两年是持股最佳、最安全的时期。\n\n## 能举的例子\n- 例 1（消耗型缺口）：股价整理数月后某日收 50，次日 52 开盘且全天不回落 → 消耗型缺口，涨升接近顶部。\n- 例 2（200 日乖离）：股价 200 日均线在 30，价格涨到 51-54（+70%~80%）→ 按第 9 条卖出。\n- 例 3（+20% 后跌回成本）：50 买入 → 涨到 60（+20%）没卖 → 之后跌回 50 附近：**必须卖掉**，因为已经\"没获利入袋\"犯了一次错。\n- 例 4（塞丁梯反例 · 反面案例）：20 出头买入，被大盘吓到 +2~3% 就慌张卖出 → 后来涨到 3 倍。教训 = 在正确买点买入后要**给足时间**，同时 90 年代初的 1961 年教训是\"会买不会卖，赚了又吐回去\"。\n\n## 为什么重要 / 常在哪出现\n- **补齐了全库\"卖出侧\"的技术判断空白**：欧奈尔买卖纪律 只给了固定的「-8% / +20%」百分比铁律，本章给的是**图形层的见顶与破位信号**——一个是\"账户红线\"，一个是\"图形证据\"，两者并行不冲突。\n- 与 离场三闸门 是**同一件事的两套语言**：闸门管\"我的持仓该不该走\"（纪律流程），本清单管\"图形在说什么\"（市场证据）。\n- **与路线 B 的高度对齐**：路线 B 的\"破位全清 + 高点回落 5% 移动止损\"在本清单里有现成对应项——第 2 组第 5 条（自顶点回落%）与第 3 组（跌破支撑区）可以直接用来给持仓 ETF 做\"破位\"的定义校准。\n- **对路线 A 的提醒**：清单**不适用于宽基定投**（路线 A 不止损、越跌越买），只服务路线 B 的题材/行业仓位；混用会把定投仓洗掉。\n\n## 来源\n笑傲股市（第10章 卖出获利时机：高潮型顶点 / 成交量下降及其他虚弱迹象 / 跌破价格支撑区 / 其他主要卖出指示点 / 何时才能耐心持股；并整合第8章 19 种错误与第9章 7-8% 止损铁限的前置条件）\n\n## 相关概念 / 方法\n欧奈尔买卖纪律 —— -8%/+20% 的百分比铁律（本清单的\"账户红线\"基础）；杯柄突破买点 —— 精确买点（卖出的从容度在此决定）；离场三闸门 —— 纪律流程版的离场框架；CANSLIM选股法 —— 选股系统（M 字母与大盘见顶信号同源）；蜡烛图三原则 —— K 线层的形态判读；让利润奔跑 —— 避免过早下车的同一思想；成本口径与止损基准 —— 止损基准口径",

   "body": "# ETF 交易系统 v1.22\n\n> **一句话**：路线分治——宽基定投养底仓，题材波段守纪律；涨跌预判仅供参考，**不覆盖个人止损/定投纪律**。\n>\n> **本文作用**：把散在复盘笔记、每日报告、主页里的纪律、流程、实战经验，固化成一份可随时对照的「规则总纲」。改规则先改这里，再同步 ETF复盘主页 与 `domains/etf.json` 的 discipline_rules。\n>\n> 数据基线：交割单（2026-07-20 起）合并去重后统计；每日持仓以 `trading/analyze.py`（FIFO）输出为准。**持仓与实战数据一律现取现用，本文不存副本（见 §六）。**\n>\n> 🤖 **本目录（`交易系统/`）= AI 读版**（2026-10-19 定）：全量口径、精确边界、版本记录、台账，供自动化与脚本解析。**人读请看 `交易手册-人读/`**（00-先看这里 起读）——那份是派生提炼版，两处冲突以本目录为准。\n\n---\n\n## 一、系统总览\n\n| 维度 | 路线A 宽基（底仓） | 路线B 题材/行业（波段） |\n|---|---|---|\n| 定位 | 长期资产、养底仓 | 练手、放大收益弹性 |\n| 代表标的 | 沪深300（510300）、上证综指（510210/510050）等 | 云计算（159273）、软件（159107）、通信（159583）等 |\n| 买入 | 定期定投，不择时 | 试探仓 1/5~1/4 + 挂止损（**v1.18：止损价进场时按 结构位−0.5×N 写定**，见 3B.2；固定 −5% 退为兜底） |\n| 持有 | 越跌越买 | 盈利前不加仓、不摊平 |\n| 卖出 | 估值/目标收益率止盈 | 写定止损价破位全清；**浮盈 ≥15% 后**按最高价回撤 **8%** 移动止损（阶梯见 3B.4；v1.17 由 5% 放宽）；**拿满 20 个交易日收盘离场（3B.1 ④，v1.22）** |\n| 止损 | **不设止损** | **硬止损，跌破全清** |\n| 心态参照 | 定投计划落纸面、不看盘 | 机械执行、盘前定规则 |\n\n**两条路线不许互相污染**：宽基亏损不能用题材思维砍掉；题材亏损不能套宽基“越跌越买”扛单。\n\n**为什么两条路线要用两套离场规则（理论依据，2026-09-10 补）**：\n\n| 路线 | 定义层 | 原理层 | 风险层 |\n|---|---|---|---|\n| **A 宽基** | 买的是**资产价值**——属 坚实基础理论与空中楼阁理论 的“坚实基础”一侧，价格终向价值收敛 | 分散持有、长期复利，短期波动是均值回归的过程 | 浮亏是**波动**，只要不被逼卖出就不构成永久损失 → **故不设止损** |\n| **B 题材** | 买的是**预期与情绪**——按 投资与投机之分，格雷厄姆定义的**投机**（不产生现金流、靠价差获利） | 题材没有价值锚，涨跌由资金与情绪驱动，可以长期不回本 | 下跌**可能是永久损失**（景气证伪即价值归零）→ **故必须 -5% 硬止损** |\n\n一句话：**A 不止损，因为它的亏损是“波动”；B 必止损，因为它的亏损可能是“永久损失”**（风险是永久损失）；B 在定义上属投机，投机没有“扛”的资格（投资与投机之分）。\n\n---\n\n## 二、路线A：宽基定投（不设止损、越跌越买）\n\n**适用**：沪深300 / 上证综指 / 上证50 / 中证500 / 创业板等宽基指数 ETF。\n\n1. **买入（基准档）**：按固定频率/金额定投（如每周/每月固定档位），**不因单日涨跌择时**。\n2. **加档（“越跌越买”到底怎么算，2026-09-10 补）**——只在**估值档位**变低时加，**不按日涨跌加**：\n\n   > 公式：**本月投入 = 基准金额 × (1 + 级差)^n**，n = 当前低估档级\n   > （n=0 正常估值 → 基准；n=1 低估一档；n=2 深度低估）\n\n   - **级差**取 `0.2 ~ 0.5`（保守 0.2 / 标准 0.3），**n 封顶 2**——再往下加不是定投是赌方向，复利三来源 靠的是时间不是单次重仓；\n   - **判档依据**：指数估值历史分位（盈利收益率定投法、PE/PB 分位），**同一档位每月只加一次，不因连续下跌重复跳档**；\n   - 例：基准 1000 元、级差 0.3 → 低估一档投 1300 元，深度低估投 1600 元；\n   - 完整打法见 定投收益放大器。\n3. **定投频率**：周投 / 月投长期收益差 <1%（定投频率选择）——**按“能不能坚持”选，不按收益差选**；工资到账即投最省心。\n4. **持有**：长期持有，途中不因浮亏卖出。\n5. **卖出（止盈）**：只在两种情况下动——\n   - **估值分位止盈（主用）**：分 **3 批**，比例 **30% / 30% / 40%**（越高越卖）——PE 十年分位 **≥70% 卖 30%**（剩 7 成）→ **≥80% 再卖 30%**（剩 4 成）→ **≥90% 卖 40%**（清仓）。\n   - **目标收益率止盈（备用，怕算不清估值时用）**：先定最小目标 =(1 + 通胀 + 理财年化)^年数 − 1；到达后按同一节奏分 3 批兑现（+30% 卖 30% → +40% 再 30% → +50% 卖 40%）。\n   - **跌回买回（与卖出配套，3 批）**：以**最后一次卖出价**为基准，回落 **10% 买回卖出款的 30%** → 回落 **20% 再买 30%** → 回落 **30% 买回剩余 40%**。用最后卖出价而不用最高价，因为那是实际离场价。\n   - **双保险**：估值分位**先回落到 50% 以下**即启动第 1 批买回，不必等价格跌够 10%（估值是本质、价格是表象，哪个先到用哪个）。\n   - **卖飞应对**：**不追**。资金转逆回购等下一轮——用更高价买回同样的东西等于把利润还回去。\n   - **执行约束**：场内按 **100 份整数手、向下取整**；持仓不足 3 手时分批不可执行 → **一次卖完**（资金规模限制，不算违反纪律）。\n   - **红线**：不因下跌卖、不因上涨追；三批的触发分位与回落幅度**写定后不盘中改**。\n6. **红线**：**不设止损**。宽基下跌不砍仓，反而是定投摊低成本的窗口。\n7. 知识卡：盈利收益率定投法 · 定投计划落纸面 · 双轨并用决策 · 定投收益放大器（加档公式） · 定投频率选择\n\n---\n\n## 三、路线B：题材/行业波段\n\n**适用**：云计算、通信、软件、半导体等主题/行业 ETF（短线波段思维，非长期持有）。\n\n> 一句话总纲：**进场靠\"等\"（3A），离场靠\"触发\"（3B）**——进场宁缺毋滥、错过不亏钱；离场触发即执行、卖飞是止损税。\n\n```mermaid\nflowchart TD\n    S0[\"① 大盘四档（3A.1）<br/>A强势 / B贴线震荡 / C分歧 / D弱势\"] -->|\"A 或 B（B 只做稳强型）\"| S1[\"② 方向研究（3A.2）<br/>赛道有无上涨空间？<br/>新赛道研究五步法\"]\n    S0 -->|\"C 分歧 / D 弱势<br/>（D 唯一例外=深跌反弹 C 类 3A.3b）\"| WAIT[\"空仓等待\"]\n    S1 -->|否| WAIT\n    S1 -->|是| S2[\"③ 分状态硬性条件（3A.3）<br/>A=新高+乖离≤10%+vol≤2.0<br/>B=距60日高≤3%+vol≤1.5（vol>2.0 一票否决）\"]\n    S2 -->|不齐| WAIT\n    S2 -->|齐| S3[\"④ 进场三问（3A.4）<br/>止损位舒服吗？能接受卖飞吗？\"]\n    S3 -->|否| WAIT\n    S3 -->|是| BUY[\"试探仓 1/5~1/4 进场（3A.5）<br/>写下价格线 + 逻辑线\"]\n    BUY --> HOLD[\"持有<br/>盈利前不加仓 · 亏损不摊平\"]\n    HOLD --> EXIT{\"⑤ 离场闸门触发？（3B）<br/>价格破止损价 ｜ 逻辑破 ｜ 回撤 8% ｜ 到期 20 日\"}\n    EXIT -->|未触发| HOLD\n    EXIT -->|触发| OUT[\"清仓 / 锁利离场\"]\n    OUT --> BACK[\"⑥ 离场后（3B.5）<br/>重新计划，别扛单、别等回本\"]\n    BACK --> S2\n```\n\n---\n\n### 3A 进场篇：怎么买（右侧确认，宁缺毋滥）\n\n> 适用：路线B 任何一笔买入前。完整方法卡：新赛道研究五步法 · 止跌企稳三信号 · 试探建仓与加码。\n\n#### 3A.1 大盘与板块过滤（先看大环境，再谈个股）\n\n> 大盘过滤是一道闸门不是预测器——问的是\"大盘至少不拖后腿\"，不是\"明天涨不涨\"。收盘后查**上证指数 + 沪深300 + 创业板指**三指数日 K（路线B 是成长题材，创业板的脸色比上证重要），用 **MA20 当生命线**，三件事定档：① 收盘在 MA20 上还是下 ② MA20 上翘/走平/下压 ③ 回调缩量还是放量下跌。\n\n**大盘四档判定表（2026-10-19 v1.22 重构；机械化口径、收盘判定，供脚本复现）**：\n\n| 档位 | 判定（收盘 vs MA20，机械化） | 动作 |\n|---|---|---|\n| **A 强势** | 上证 + 沪深300 + 创业板 **3/3 收盘站上 MA20**（且沪深300 不在贴线区） | ✅ 正常开仓（走 3A.2~3A.5，硬性条件见 3A.3 分状态表） |\n| **B 贴线震荡** | 沪深300 收盘距 MA20 **±1.5% 以内**（贴线走平） | 🟡 可做，**只做「稳强型」**：距 60 日收盘高 ≤3% 且 vol20 ≤1.5，试探仓 1/5~1/4；**不追领涨** |\n| **C 分歧态** | 恰好 **2/3** 站上 MA20（非贴线） | ❌ **不开新仓，等方向**——14 年回测该档随便买 −0.12%/胜 24%，全部候选进场条件为负 |\n| **D 弱势** | **≤1/3** 站上 MA20 | ❌ **默认不开新仓**；**唯一例外 = 深跌反弹 C 类（3A.3b）** |\n\n- **数据底账（v1.22）**：287 只题材 ETF × 全历史（2005-06~2026-09）、30,698 个事件、B 线出场机制（`_bt_state_signal.py`）：A 档分状态最优进场 **+1.29%/胜 38%**；B 档稳强型 **+0.50%/36%** 全档最优；C 档无一候选为正；D 档随便买 +0.59% 但深跌反弹 **+4.44%/63%** 碾压。\n- **高轮动佐证（`_bt_rotation.py`）**：领涨组周持续性中位数 0.20（=随机），快轮动周占 57%——「跑赢 5pp + 站上 MA20」在快轮动 **−0.90%/胜 26%**：下跌市里还能跑赢指数的题材，多半是刚见顶、还没开始补跌的。\n- **大盘弱势/科技回调期默认不开新仓**（见 §四；**唯一例外**＝深跌反弹 C 类 3A.3b），科技/成长开仓再加看创业板指——上证被权重护盘上涨而创业板下跌 = 对你（云计算/软件）仍是弱势；\n- 板块**站回 MA20 且放量**、有龙头走强（右侧确认），**不接下跌中的飞刀**；\n- **消息不追涨**：板块重大利好当天涨幅已大 → 不追，等回踩（回踩怎么接 → 3A.3）。\n\n**「③弱势-相对强度豁免通道」已撤销（2026-10-19 v1.22）**\n\nv1.16 引入的 R1（近5日超额 ≥ +5pp）+ R2（站上 MA20）弱市豁免，经 14 年回测判决：弱市事件 21,951 个中收益 **0.00%、胜率 28%**，与「弱市随便买」（+0.01%）无区别；分年份 11 个里 6 亏；实盘 36 笔胜率 36.1%、累计 −214.07 元。七个改法变体（R1 阈值 ±、加 vol/乖离/量比过滤、D3 同款）最好仅 +0.51%，全部远不及同期深跌反弹（+1.82%~2.21% / 胜 65~72%）。判决脚本 `_bt_exemption.py`。**原因：下跌市里还能跑赢指数 5pp 的题材，多半是刚见顶、尚未补跌的——最强的恰是最危险的。** 教训：用「放宽条件」修「踏空」修出来的是负期望；缺机会的解法是换进场逻辑（深跌反弹 C 类）。R1 相对强度仍作**观察指标**保留（`trading/calc_rel_strength.py`），不再作为开仓放行条件。\n\n> 理论依据：试探建仓与加码（小仓试错的成本可控）· 海龟头寸规模（仓位由风险倒推，不由信心决定）。\n\n#### 3A.2 方向研究：新赛道研究五步法（进场前先研究\"赛道\"，再选\"标的\"）\n\n> 什么时候用：想换赛道、看到新题材想开仓、周末静态梳理观察池——先研究**赛道**有没有上涨空间，再谈买哪只标的。完整卡：新赛道研究五步法。\n\n1. **逻辑**：需求从哪来？渗透率几倍空间？**谁在真金白银买单**（政策/资本开支/消费者）？能否讲清 2~3 年景气延续？画不出需求链 = 题材炒作不是赛道。\n2. **验证**：看龙头财报——营收/利润增速**真的在加速吗**（C/A）？公司砸钱扩产/回购 = 真信号，媒体吹 = 噪音。\n3. **位置**：已涨多少？估值历史分位？交易拥挤吗？——**好赛道也要好价格**，人人都说好的时候预期已打进价格。\n4. **右侧确认**：大盘方向向上（M）→ 板块站回 MA20 + 放量 → 有龙头创新高（L），才谈进场；**不接下跌中的飞刀**。\n5. **小仓试错**：试探仓 1/5~1/4 + 挂止损（进场时按 3B.2 v1.18 写定），用真金白银验证研究；看错代价小，看对按 **3A.6** 加仓。\n\n**两条铁律**：被止损的是**标的**（高位破位分支）≠ 否定**赛道**（景气逻辑可能没变，看内部强弱分化）；换赛道 ≠ 追已涨上天的热点。研究放盘前/盘后/周末，**盘中只执行不研究**。\n\n#### 3A.3 分状态硬性进场条件（v1.22）＋ 止跌企稳三信号（形态识别）\n\n> **v1.22 重构（2026-10-19）**：买不买由「大盘档位 → 分状态硬性条件」决定（下表）。14 年数据（287 只 × 全历史、30,698 事件，`_bt_state_signal.py`）显示**每个大盘状态的最优进场条件不同，不存在「一套信号走天下」**。原「三信号必须全齐才买」作废——①②③ **降级为形态识别**：描述结构、决定追还是等（3A.4 v1.19），不再是买不买的硬门槛。\n\n**分状态硬性进场条件表（全部满足才可买）**：\n\n| 大盘档位（3A.1） | 硬性进场条件 | 依据 |\n|---|---|---|\n| **A 强势** | **创 60 日新高**（收盘或日内突破前 60 日最高）＋ **20 日乖离 ≤ +10%** ＋ **vol20 ≤ 2.0%** | +1.29%/胜 38%；比含量比版（+1.01%/33%）更高且信号 4 倍，分年份 8/12 更优，2021 后样本外 +0.80% vs +0.70% |\n| **B 贴线震荡** | **距 60 日收盘高 ≤3%** ＋ **vol20 ≤ 1.5%**（稳强型） | +0.50%/胜 36%，全档最优；不追领涨 |\n| **C 分歧态** | **无**——不开仓 | 全部候选为负 |\n| **D 弱势** | 仅 **深跌反弹 C 类**（3A.3b） | +4.44%/胜 63%，碾压该档其他一切 |\n\n**两条通用硬约束（所有档位适用）**：\n- **vol20 一票否决**：20 日波动率（近 20 日日涨跌幅标准差）**> 2.0% → 放弃**，无论形态多漂亮——信号内最高波动段 −0.05% vs 其他段约 +2%；B 线真实事件 vol>3.5 尾部 −1.49%/胜 24%；阈值 1.5~3.0 扫描平滑全优（`_radar_insignal_study.py` / `_bt_bline_volfilter.py`），取整 2.0。\n- **量比不作硬性要求**：全市场 IC ≈ 0（无预测力，`_radar_factor_study.py`）；强势档「去掉量比」比「含量比」收益更高、信号 4 倍。放量（≥1.5 倍 5 日均量）只作形态参考与 ③ 事件识别口径，**不再独立否决进场**。\n\n---\n\n**止跌企稳三信号（形态识别，服务追/等判定与结构描述）**\n\n> 什么时候用：**止损离场后想重进（承接 3B.5）、观察池标的首次建仓、破位后想抄底前**——别猜底，等结构。3A.1「不接下跌中的飞刀 / 站回 MA20 + 放量」的量化版。完整方法：止跌企稳三信号。\n> 一句话：**① 好像到底了 → ② 确实到底了 → ③ 开始涨了——只有 ③ 是进场点，①② 都是\"等\"。**\n\n```mermaid\nflowchart TD\n    A[\"破位 / 阴跌后想重进\"] --> B{\"① 放量收阳<br/>收盘不再创新低？\"}\n    B -->|否| A\n    B -->|是| C{\"② 缩量回踩<br/>不破前低？\"}\n    C -->|否| B\n    C -->|是| D{\"③ 放量突破<br/>①日高点（固定结构位）？\"}\n    D -->|否| B\n    D -->|是| E[\"进场：试探仓 1/5~1/4<br/>止损放②低点下方 −0.5×N\"]\n```\n\n1. **三信号形态走法（识别用，非硬门槛——买不买看上方分状态表）**：\n   - ① **放量收阳止跌**：放量日收阳/长下影，收盘不再创新低 → 只观察、放观察池，**不买**（单日反抽可能假）；\n   - ② **缩量回踩不破**：回踩时**缩量**且**不破 ① 前低** → 二次确认，仍不买；\n   - ③ **放量突破** = **收盘放量站上 ③线** → **进场点**。时间上至少看 2~3 个交易日，1 天反抽不算数。\n     - 📌 **③线定义（2026-10-01 v1.17 修订）**：**③线 = ① 结构确立当日（放量收阳日）的日内最高价，固定不动**。\n       修订前为「① 之后各日日内最高的**最大值**」——该 max 取自**包含当日**的区间，故条件等价于「**收盘 > 当日最高价**」，**在趋势中恒不成立**（实证：299 只 ETF × 14 年，**0 笔交易**）。详见 ③线口径诊断、路线B大样本回测。\n       **不变的部分**：① 仍要求放量收阳不创新低、② 仍要求回踩不破前低、③ 仍要求**收盘放量**突破——**变的只是「突破」的参照物：突破的应是结构，不是自己**。\n2. **量能口径**：看**该 ETF 自身成交额**，跟它**自己近 5 日均量**比（不看绝对数）——缩量 ≤0.7 倍 = 抛压枯竭；放量 ≥1.5 倍、明显 ≥2 倍 = 资金进场。盘面工具：VOL 副图 **MAVOL5** 就是 5 日均量线；手机 App **量比** 收盘后 ≈ 全天量对 5 日均量倍数（≥1.5 放量 / ≤0.7 缩量）——注意量比按成交量算、本系统按成交额，ETF 单日波动小两者几乎相等，仅除权/折算日失真。**量比 ≥1.5 只是「放量」一条腿，① 还须同时收阳 + 收盘不创新低。**\n3. **反例排除**：放量 + 继续收阴创新低 = 放量下跌（出货）不是企稳，不接。\n4. **判价口径总口诀（2026-09-13 补）**：**三个判定全用收盘价，两个参照全用日内极值**——①「不创新低」/②「不破前低」/③「突破」的**判定**一律收盘价（①当天盘中插新低收回 = 长下影探底，恰常是①的模样；②期间插破前低收回不算破但连续插针要警惕；③盘中刺上缩回 = 伪突破）；**参照点**前低 = ①当日日内最低、**③线 = ① 结构确立当日日内最高（固定结构位，v1.17）**，记录取日内极值。\n5. **时间尺度（全部按交易日计）**：①→② 回踩 1~3 个交易日、②→③ 等突破 2~10 个交易日、全程 5~15 个交易日；一天走完 ①②③ 的基本是假结构。\n6. **② 的弱等价**：缩量横盘磨底、或贴着①附近的缩量微涨（日涨幅约 1% 内）不破①低 = 弱②等价（量缩证明抛压枯竭即可，不必砸出深度）；**缩量连续大涨**（几天 5%+）= ①后不回踩直接连涨 → 放弃等新结构，绝不追。\n7. **①→③ 之间的五种形态**（长相/判定/动作逐个展开 → [[止跌企稳三信号#①②③之间的五种形态]]）：[[止跌企稳三信号#形态A：标准回踩|A 标准回踩]] · [[止跌企稳三信号#形态B：缩量横盘磨底|B 缩量横盘磨底]] · [[止跌企稳三信号#形态C：盘中插针|C 盘中插针]] · [[止跌企稳三信号#形态D：不回踩直接连涨|D 不回踩直接连涨]] · [[止跌企稳三信号#形态E：②后滞涨|E ②后滞涨]]。\n\n#### 3A.3b 深跌反弹 C 类进场（弱市专用，2026-10-19 v1.22 新增）\n\n> 一句话：**别人恐慌错杀时接一刀，反弹回 20 日线就走。** 突破/回踩系进场在下跌行情全部失效（弱市回踩实测 0.00%，波动率过滤只能止血救不回），C 类是弱市唯一进场方式；月均 2~4 次，全部集中在弱市，与 3A.1 档位 D 天然互补。\n\n**触发条件（收盘判定，两条都要齐）**：\n1. 标的收盘 **20 日乖离 ≤ −12%**（且 **> −18%**：跌更深多半是个体暴雷不是错杀，反转反而差）；\n2. 大盘**急跌态**：沪深300 近 5 日跌幅 ≥ 2%。**阴跌市不做**（5 日跌幅 <2% 时实测 +0.96%/胜 42%；急跌/股灾态 +3.93%/76%）。\n\n**买入**：次日开盘；止损 = **进场价 − 1×N**（恐慌期 ATR 天然大，1% 风险公式下仓位自动变小）；**试探仓 400~500 元**。C 类为一次性试探仓，**不适用 3A.6 加仓**。\n\n**出场（三条先到先走，同 3B.1 ④）**：收盘回 MA20 → 次日开盘卖（均值回归完成）｜收盘 ≤ 进场价 − 1×N → 次日开盘清｜拿满 **15** 个交易日收盘清。\n\n**数据底账**：219 只题材 ETF 2011~2026、532 事件，**+3.45%/胜 65%**；分年份 7 赚 3 亏（2015/2016/2019 亏但 ≤−1.9%）。脚本 `_bt_bline_rebound*.py`，报告 `_bt_bline_rebound_report.md`。\n\n**三条诚实提醒**：① 幸存者偏差对此策略最不利（清盘暴雷的老 ETF 不在样本），真实收益会比回测略低；② 最差单笔 **−28%**（跳空穿止损），只有仓位公式能兜——**绝不因「已经跌了很多」重仓，这是 C 类最大的死法**；③ 它赚恐慌错杀的钱不是趋势的钱，阴跌年（2026 实测 +0.93%）没用——是补丁，不是主力。\n\n#### 3A.4 进场前止损自检：进场位和止损位一起设计（先于进场想清楚）\n\n> 什么时候用：**每次路线B 计划进场前**。止损位质量的上游是进场位——同一标的，支撑附近回踩进场 vs 震荡中段追高进场，同样挂 -5%，一个止损在结构失效位下方（舒服），另一个悬在半空或骑在支撑上（一碰就扫）。提炼自 复盘笔记_2026-09-07（已删 2026-10-20）（159583 卖飞归因）。\n> 一句话：**止损位 = 进场位 + 下方支撑 一起设计的产物；进场后机械执行、绝不盘中改止损。**\n\n**进场三问（在图上找好支撑再下单）**：\n1. **进场点离下方最近关键支撑（近20日低/平台低/前低）多远？** 越近越好——回踩进，不追高。\n2. **按该批成本 -5% 算出的止损，落在支撑的哪一档？**\n   - 舒服：止损 ≈ 关键支撑**下方 1~2%**（跌破 = 结构失效 = 认错，干净利落）；\n   - 尴尬：止损**悬空**（下方 3%+ 才见支撑）或**骑支撑**（距支撑 <1%）→ 进场位不舒服 → 降试探仓或放弃，等回踩；\n   - 最危险：止损正好落在**支撑密集区下方的插针区**——回踩插针即扫、扫完反弹（159583 实证）。\n3. **这笔止损若触发，能否接受「卖飞」？** 不能 → 别进。\n\n> 卖飞认知：止损后暴涨是必然出现的（10 次止损约 3 次卖飞是正常价格），它是用来看住另外 7 次大亏的\"税\"。**不因单次卖飞否定 -5% 纪律**（那是 交易认知偏差 的结果偏好）；真正该审的是进场位与执行，不是规则本身。\n\n**v1.18 量化补充：用 N 当尺子，把三问变成算术**（N值，N = 20 日 ATR）：\n\n1. **止损价写定公式**：`止损价 = 关键支撑下沿 − 0.5×N`。它取代「成本×0.95」成为首选定价法——固定 −5% 对日波动 3~4% 的题材 ETF 常落在噪音区（一扫就反弹），对波动小的票又放得太远。写不出有效支撑时，才退回 `成本 × 0.95` 兜底。\n   - **突破式进场的锚换位**（2026-10-17 v1.18 补充）：突破时关键结构位是**突破位本身**（突破后前高变支撑），不是下方 20 日低点 → `止损价 = 进场价 − 1×N`。宽度依据：近十年 12 ETF 回测中 −1N 收益/回撤比 6.0 全场最优（0.5N 对突破太窄——354 笔、卖飞率 62%，纯噪音磨损；2N 是海龟期货口径，ETF 波动小、放得太远）；1N 也恰为埃尔德「保护性止损至少离入场 1 个 ATR」的下限。**回踩式进场维持 `支撑下沿 − 0.5×N` 不变**——统一记法：结构位下沿 − 0.5~1N，回踩取 0.5N、突破取 1N。\n2. **距离三档表**（d = 现价到支撑下沿的距离，按 N 分档）：\n\n| 距离 | 判定 | 处理 |\n|---|---|---|\n| d < 1N | 止损在噪音区 | **不进**。等回踩拉开距离，或放弃 |\n| 1N ≤ d ≤ 2.5N | 正常区 | 进。止损 = 支撑下沿 − 0.5×N |\n| d > 2.5N | 追高风险（价格已远离支撑） | **首选等回踩**；逻辑极强要进 → 用中间结构位当锚（20日线/突破确认位 − 0.5×N），仓位公式自动压小 |\n\n3. **仓位与止损配合**（治隔夜跳空）：`仓位金额 = 账户 × 1%（单笔风险预算） ÷ 止损距离%`。距离宽 → 仓位自动小 → 跳空 3% 的绝对伤害恒定；距离窄 → 仓位可放大（但距离不该小于 1N）。写进 建仓日志 的一行由此多两个字段：**止损价 + 仓位**，买入瞬间写死、盘中不改。\n4. **硬的是执行线，不是某个数字**：触发（触及止损价）→ 次日开盘无条件清仓，与 v1.17 相同；变的是止损价怎么定，不是「破了走」这条执行线。\n5. **v1.19 技术形态判据（2026-10-17，观察条款）**：③触发当晚用两个可观测特征决定「追 or 等」——\n   - **突破前 10 日振幅**（前 10 日最高价−最低价，÷ 前一日收盘）：\n     **< 8%（窄幅蓄势平台）且近光头收盘**（收盘位于当日区间上 20%）→ **可追**（锚 = 进场价 − 1×N）；\n     **≥ 15%（大波动后急拉）→ 禁追**，93% 会回踩，等回踩——追入 10 年均值 **−4.83%**、胜率仅 13%，接近硬规则；\n     介于 8~15% → 默认等回踩。\n   - **③日涨幅 ≥ 6% 的大阳线**：追无优势（−0.96% vs 等 −0.77%），默认不追。\n   - **执行时点（2026-10-19 补）**：**突破型 = ③确认日尾盘 14:45 之后，或次日开盘**（绝不盘中早段追——上午 10 点看到的「突破」，到收盘可能已破）；**回踩型 = 盘中预挂限价单 + 收盘复核**。\n   - **止损锚点随进场方式变**：回踩式 = 结构位下沿 − 0.5×N（3B.2 v1.18a）；突破式 = **进场价 − 1×N**（锚为突破位本身，十年 12 ETF 回测收益/回撤比 6.0，全场最优）。**两种锚不得混用**。\n   - **数值来源分工（v1.20）**：**盘前 / 收盘报告读脚本字段** `scan_signals.py --closed --json` 的 `chase_verdict` / `amp10` / `close_pos` / `chase_date`（可复现、可核对，字段为 `null` = 近 5 个交易日无③触发）；**午盘报告必须用当日实时价现场算**——脚本字段基于已收盘K线，盘中不适用。两者算法同一，仅数据源不同。\n   - **适用范围（2026-10-19 v1.22 补）**：本判据为**通用规则**——强势/贴线震荡两档分别验证排序一致（可追 +1.10%/+1.14% > 等回踩 > 禁追 −0.85%/−0.75%；7,735 个突破事件，分年份 8/8 可追胜禁追，`_bt_chase_state.py`）。**深跌反弹 C 类无追等选择（固定次日开盘）**；分歧/弱势档 3A.1 已禁开仓，本判据用不上。\n   - **依据**：12+282 只 ETF、2016-10~2026-10、**4178 个③事件**分桶（脚本 `_bt_condX2.py`/`_bt_condX3.py`）：窄平台追 +1.14% vs 等 +0.31%（n=3240）；大波动追 −4.83% vs 等 +0.20%（n=117）；**剔除原 12 只、仅 282 只新标的复核单调结构原样复现**（+1.10%/−0.33%/−5.11%）。机制：窄平台=筹码密集无套牢盘，光头收盘=买盘控到尾盘；大波动后急拉=追在情绪峰。详见 突破追入形态判据。\n   - **定位与保留意见**：观察条款非铁律——①回踩进仍是系统首选（收益差小，主要赢在止损结构化与行为纪律）；②特征经过 ~20 格多重比较筛选，存在残余过拟合风险，继续用 判断台账 跟踪实盘攒样本；③样本含幸存者偏差（能活 10 年的品种）。\n\n#### 3A.5 仓位与两行规则（买入瞬间写死）\n\n- 仓位：**试探仓 1/5~1/4**（分批小仓试错，见 §四），盈利验证前不加仓；验证通过后按 **3A.6** 一次补齐到计划位；**同主线合计 ≤ 40%**（见 §四）；\n- 买入同时写下两行规则——**价格线**（止损价进场时按 3B.2 v1.18 写定：结构位 − 0.5×N，写不出支撑退回成本×0.95）+ **逻辑线**（当初为什么买它，见 3B.3），**盘中不改**；\n- **写到哪 → 建仓日志**（2026-09-10 新建的载体）：每建一笔写一行（日期 / 代码 / 该批成本 / 止损价 / 逻辑线 / 当时大盘档位）。**不写下来 = 没有规则**——周复盘要照这张表逐笔核对，而不是凭记忆重构当时怎么想的。\n\n#### 3A.6 加仓规则：验证通过后一次补齐（2026-09-12 新增）\n\n> 什么时候用：路线B 试探仓在手、验证期（通常 3~5 个交易日）给出正面答案后。一句话：**试探仓是学费仓不是利润仓——验证通过，一次把仓位补到计划位，让 1% 风险预算完整上岗。**\n\n**触发条件（三条同时满足，收盘判定，不在盘中拍板）**：\n1. 试探批浮盈 ≥ **+3%**（按该批成本计）；\n2. 收盘站上 **MA5**；\n3. 大盘档位未恶化（未收在 MA20 下方，档位判定见 3A.1）。**→ 档位 C/D（分歧/弱势）时本条不成立——不开常规仓；深跌反弹 C 类为一次性试探仓，不适用 3A.6（v1.22）。**\n\n**动作**：一次加到计划位剩余部分（通常 3/4）；**加仓批 = 新批次**，建仓日志 单独记一行（成本 / 止损价 / 逻辑线）。\n\n**执行时点与高开护栏（2026-09-12 补）**：触发日收盘确认 → **次日开盘后 9:30~9:45 正常限价执行**（不竞价挂单、不盘中追）。\n- 开盘价 ≤ 昨收 × 1.02 → 直接执行补齐；\n- 开盘价 > 昨收 × 1.02 → 限价挂 昨收 × 1.01 以下等回落，当日成交按**实际成交价**记成本；全天不回落 → **放弃本次加仓**，试探仓按原止损继续持有（放弃 ≠ 亏损；次日重新满足三条件可再次触发）。\n- 加仓批止损 = **按该批实际成交价与结构位重定**（结构位 − 0.5×N；写不出支撑则 实际成交价×0.95，同 3B.2 v1.18）。\n\n**止损同步（关键）**：加仓后整仓止损线取 **max(各批止损价) = max(各批进场时写定的止损价)**——只收紧不放宽，首批浮盈就此锁进止损线；此后浮盈 ≥15% 转 3B.4 阶梯。**两条批次线合并为整仓一条线：触发 = 全部清仓，不存在「只清加仓批留试探批」（那是变相死扛）。**\n\n**三条红线（不变）**：\n1. **浮亏绝不加仓**——跌破试探批止损 = 清仓离场，没有「跌了补」这个选项（海龟加仓：涨了加才叫顺势）；\n2. **加仓 = 新交易**——加仓批单独核算成本、单独过 1% 风险检查（2%与6%法则 第 6 条）；\n3. 加满后同主线合计仍 ≤40%、最多 2 只（§四）。\n\n> 数字示例（总资金 2 万）：计划位 4,000 元 → 试探 1,000 元@1.600（止损 1.520）→ 涨至 1.650（+3.1%）站上 MA5 → 加 3,000 元@1.650 → 整仓止损上移 1.568。看对到 1.90：整仓约 +750 元（总资金 +3.8%）；加仓后立刻反转：最多亏约 190 元（总资金 -0.95%）——收益放大 5 倍，风险仍锁在 1% 附近。\n\n---\n\n### 3B 离场篇：怎么卖（触发即执行，不判断）\n\n> 适用：路线B 持仓后的每一天。完整方法卡：离场三闸门 · 止损触发三问 · 让利润奔跑。\n> 一句话：**路线B 没有\"猜顶离场\"，只有四道写死的闸门——价格破、逻辑破、回撤 8%、到期 20 日，触发哪道走哪道；进场可以等，离场不能侥幸。**\n\n```mermaid\nflowchart TD\n    HOLD[\"持有中：每日收盘后自检\"] --> T20{\"拿满 20 个交易日？（C 类 15 日，3B.1 ④）\"}\n    T20 -->|是| OUT4[\"闸门④ 到期收盘离场<br/>不论盈亏\"]\n    T20 -->|否| P{\"当前浮盈还是浮亏？\"}\n    P -->|浮亏| G1{\"跌破止损价？<br/>（3B.2）\"}\n    G1 -->|是| OUT1[\"闸门① 次日开盘无条件清仓<br/>不摊平 · 不再看\"]\n    G1 -->|否| KEEP[\"继续持有<br/>不摊平（加仓见 3A.6）\"]\n    P -->|浮盈| G3{\"浮盈 ≥15%？<br/>（3B.4 阶梯）\"}\n    G3 -->|否| A6{\"试探仓浮盈 ≥3%<br/>且收盘站上 MA5？（3A.6）\"}\n    A6 -->|是| ADD[\"加仓补齐计划位<br/>整仓止损上移至 max(各批止损价)\"]\n    A6 -->|否| KEEP\n    ADD --> P\n    G3 -->|是| G4{\"自持仓最高价回撤 8%？\"}\n    G4 -->|是| OUT3[\"闸门③ 卖出锁利<br/>曾达 +20% 则保本线抬到成本价\"]\n    G4 -->|否| KEEP\n    ANY[\"任何时刻：买入逻辑被证伪？<br/>（3B.3）\"] -->|是| OUT2[\"闸门② 不看价格，直接走\"]\n    KEEP --> P\n    OUT1 --> AFTER[\"离场后（3B.5）重新计划\"]\n    OUT2 --> AFTER\n    OUT3 --> AFTER\n    OUT4 --> AFTER\n```\n\n#### 3B.1 四道闸门总览（v1.22 由三道扩为四道）\n\n| 闸门 | 何时生效 | 触发条件 | 动作 |\n|---|---|---|---|\n| **① 价格硬止损** | 建仓起一直生效 | 收盘 ≤ **止损价**（进场时按 3B.2 v1.18 写定；默认兜底 = 该批成本 × 0.95） | **次日开盘无条件清仓**，不摊平、不再看 |\n| **② 逻辑止损** | 建仓起一直生效 | 买入逻辑被证伪（景气/政策/趋势破坏，非大盘噪音） | **不等价格，直接走** |\n| **③ 移动止损 + 浮盈阶梯** | **浮盈 ≥15%** 后才启用（<15% 仍守①，**不上移动止损**） | 自持仓期间最高价回撤 **8%**（v1.17 由 5% 放宽）；曾达 +20% 抬到成本价 | 卖出锁利，让利润奔跑（三档见 3B.4） |\n| **④ 时间止损（到期线，v1.22 新增）** | 建仓起生效 | **拿满 20 个交易日**（普通仓）／**15 个交易日**（深跌反弹 C 类） | 当日**收盘离场，不论盈亏**——全部回测里 B 线收益有效期就是 20 日，到期不走 = 资金占着不出力，把仓位还给下一个信号 |\n\n**优先级**：盘中先看①破没破；拿不准时用 止损触发三问（3B.3）分类。**止损可以错一次（最多亏 5% 试错成本），纪律不能破一次（破了就回到死扛）。**\n\n**大盘转弱，卖不卖？——不卖，按原闸门走（2026-10-19 v1.22）**：持仓期间「大盘转分歧即清／转弱势即清／沪深300 跌破 MA20 即清／标的跌破 MA20／标的跌破 MA10」五种提前清仓变体**全部不优于**按原闸门走（基准 +0.71%，变体最好 +0.66%、最差 +0.42%；分年份 14 个里 10 个提前清更差，`_bt_sell_state.py`，7,284 个持仓事件）。止损与移动止盈已管住下跌，大盘转弱就清仓 = 主动砍掉还在赚钱的仓位。**结论：大盘档位只在买之前管用（3A.1），持仓中不多加卖出动作**。唯一例外：闸门① 破线照走、闸门② 逻辑破照走。\n\n#### 3B.2 闸门①：价格硬止损 + 止损基准（用「该批成本」，不用摊薄成本）\n\n**触发规则**：\n- **价格线**：收盘价 ≤ 止损价 → 触发（止损价 = 进场时写定，见下方 v1.18 定价规则）；\n- **报告红线**：路线B 收盘破止损 → **次日开盘无条件清仓、不摊平、不再看**；\n- 盘中跌破是否马上走？——按 3B.3 逻辑线判断；**拿不准就先按价格线执行**（止损可以错一次最多亏 5%，纪律不能破一次）。\n\n**止损定价规则（2026-10-17 v1.18 升级）**：\n> 一句话：**首选 `结构位下沿 − 0.5×N`，写不出有效支撑才退回 `该批成本 × 0.95` 兜底**——止损价进场时写进 建仓日志，之后机械执行、盘中不改。硬的是「破了走」这条执行线，不是 −5% 这个数字（动机：固定 −5% 落在题材 ETF 的噪音区，一扫就反弹；且隔夜跳空只能靠仓位公式压伤害，见 3A.4 v1.18 量化补充）。距支撑不足 1N 不进、超 2.5N 等回踩（三档表同 3A.4）。\n> **未写定止损价的旧仓/遗忘仓**：一律按 `该批成本 × 0.95` 执行，与 v1.17 口径完全一致——报告红线的默认算法不变，只是「有写定价」的仓位以写定价优先。\n\n**止损基准口径**：\n> 一句话：路线B 止损 = **该批买入成本（FIFO 单笔）× 0.95**。同花顺/券商默认显示的「持仓成本」是**摊薄成本**（含历史高价单/补仓痕迹），拿它当 -5% 基准会让止损线系统性偏高、更易被插针扫。完整方法：成本口径与止损基准。\n> 实证（159583，2026-09-07 交割单裁决）：摊薄 ≈1.66 → -5% ≈1.58，09-04 盘中 1.564 触发离场；FIFO 单笔（该批 08-25 @1.590）→ 止损 1.5105 未触及，**实际只亏 -0.57%**。同一笔卖出，口径不同结论相反。\n\n规则：\n1. **每笔建仓独立核算**：当前持仓由哪批买入构成（交割单 FIFO 配对）→ 止损 = 该批成本 × 0.95；\n2. 同花顺摊薄成本**只宜看账户浮盈浮亏**，别当纪律基准价；\n3. 分批建仓：各批分开记、分开设止损，或在计划里写明本仓用的是哪批口径（**先定基准，再谈执行与复盘**）；\n4. 挂单前把「成本基准 + 止损价 + 依据支撑」写进计划，盘中不改。\n\n#### 3B.3 闸门②：逻辑止损 / 止损触发三问（给\"要不要走\"分类）\n\n1. 当初买入的逻辑（景气/政策/趋势）**被破坏了吗**？破坏 → 走，不犹豫；\n2. 只是**价格噪音**（大盘拖累、缩量回调）？可给一次反抽机会，但价格线破位仍先离场；\n3. 触发时**别在盘中判断**——盘中是情绪接管时刻；判断放在买入前和收盘后。\n\n> 一句话：**止损可以错一次（最多亏 5% 试错成本），纪律不能破一次（破了就回到死扛）。**\n\n#### 3B.4 闸门③：移动止损 + 浮盈阶梯（盈利后）\n\n**基础规则**：**浮盈 ≥15% 后**，止损线上移到**最高价回撤 8%**（v1.17 由 5% 放宽）——价格每创新高，止损线跟着抬；作用是让利润奔跑的同时锁住回撤，避免盈利单变亏损单。**<15% 不启用**（详见下方阶梯）。\n\n> **为什么 5% → 8%（2026-10-01 v1.17）**：成本敏感性网格（36 组，见 路线B大样本回测）显示——回撤 5% 时**安全边际仅 +1.8pp**（胜率 24.9% vs 保本 23.1%）；放宽到 8% 后边际升到 **+3.6pp**、每笔期望 +0.47% → **+1.05%**。\n> 机制：赢单平均 +19% 说明方向判对了，却在 5% 回撤中被洗出——**放宽只影响已盈利单的锁利节奏，不改变单笔最大风险**。\n\n**浮盈阶梯（2026-09-10 新增）**：把“一刀切 5% 回撤”分成三档——**浮盈越厚，保护越紧**（源自 趋势持股与卖出信号清单）：\n\n| 浮盈区间 | 止损线怎么放 | 看什么 |\n|---|---|---|\n| **< 15%** | 仍用**该批成本 × 0.95**（＝闸门①），不动 | 只守硬止损、**不看信号**——小浮盈最容易被噪音洗掉 |\n| **≥ 15%** | 取**更靠上的那条**：`max(该批成本×0.95, 期间最高价×0.92)` ← v1.17 由 ×0.95 改为 ×0.92 | 开始盯 趋势持股与卖出信号清单（高潮型顶点 / 量能衰竭 / 跌破支撑），**信号触发即锁利离场** |\n| **曾达 +20%** | 止损线**抬到该批成本价**（保本线） | 此后最差是平走离场，**绝不让一笔曾赚 20% 的单变成亏损单** |\n\n**三条执行铁律（不遵守等于把闸门③废掉）**：\n1. **只收紧、不放宽**——阶梯只让止损线上移，任何情况下不许因为“看好后市”把线往下挪；\n2. **只朝盈利方向移动，不设回头路**——与 海龟止损 同源；\n3. **只用收盘价判、不在盘中判**——信号只用于“提前锁定”，**绝不用于“再等一等”**；否则破坏 3B 总纲「触发即执行，不判断」。\n\n> 阈值 15% / 20% 为保守设定，可按标的历史波动调整（科技题材波动大 → 可放宽到 20% / 30%），**但写定之后不许盘中改**。\n\n#### 3B.5 离场后：重新计划（不是失败，是纪律被执行）\n\n- 止损离场 **不是失败**，是纪律被执行；离场后仍看好 → 不扛单，**重新计划**：回 **3A.3** 等三信号齐全（止跌不再创新低 / 收复止损位上方）→ 重新按「试探仓 + 新挂 -5% 止损」进场，**不扛单、不等回本**；\n- 赛道 vs 标的要分开：止损的是**标的**（高位破位分支），不等于否定**赛道**（软件/云计算景气逻辑未变）——用 止损触发三问 区分。\n\n---\n\n## 四、仓位与资金管理\n\n| 规则      | 内容                                 |\n| ------- | ---------------------------------- |\n| 试探仓     | 新标的首次只投计划资金的 **1/5~1/4**，验证逻辑后再谈加码；验证通过后按 **3A.6** 一次补齐 |\n| **计划资金（计划位）** | **总资金 × 20%**（= 单笔风险预算 1% ÷ 止损距离 5%，2026-09-12 定义）；同主线 ≤40% 总资金 = 2 只 × 20%，与「最多 2 只」互相咬合。路线A 定投不占用此预算 |\n| 不加仓/不摊平 | 路线B 亏损途中**绝不补仓摊低成本**（那是把短线做成长线死扛）  |\n| **同主线集中度** | 同一科技主线合计 ≤ **总资金的 40%**（＝ **2 个计划位**；2026-09-18 v1.15 口径统一，原写作「计划资金的 40%」与上行「2 只 × 20%」相差 5 倍），且同主线**最多 2 只**——同时持有 3 只 ≈ 同一风险下注三次（2026-09-10 补，依据 现代投资组合理论） |\n| 主线怎么算   | 按**驱动逻辑**归并，不按板块名：AI 算力链（云计算 / 通信 / PCB / 存储）算 **1 条**；软件应用与算力硬件若同受 AI 资本开支驱动，也算 **1 条**。拿不准时**按同一条算**（宁可少开一只） |\n| 现金管理    | 弱势市场不急着花现金；宁可错过不可做错                |\n| 开新仓门槛   | 按大盘四档（3A.1 v1.22）：**A 强势正常开**；**B 贴线震荡只做稳强型（距60日高≤3%+vol≤1.5）试探仓**；**C 分歧 / D 弱势不开**（D 唯一例外=深跌反弹 C 类 3A.3b）；硬性条件见 3A.3 分状态表，**vol20>2.0 一票否决**；新方向一律试探仓起步          |\n| 单笔风险    | 每笔止损控制在总资金小比例内（-5% 硬线本质就是在控制单笔风险）  |\n\n> **关于债券腿（2026-09-10 决定：不进本系统）**：股债50-50再平衡 的“再平衡”思想对本账户意义有限——学生小资金、纯股双路线本身已经足够清晰，硬加债券腿会与上表「现金管理」行重复，还多出一条要维护的纪律线。故该卡**只作认知地基层**挂进 §八 知识地图，**本系统不新增债券品种、不设股债比例**。日后资金体量上来再议。\n>\n> **费率不是硬条件（2026-09-10 结论；2026-09-12 补实测）**：ETF 交易只有佣金（无印花税），相对于 -5% 止损可忽略——**费率不该进开仓决策**，但值得知道它有多小：见 指数基金费用清单。**实测费率（2026-09-12，大同证券）：单笔 ≤6,000 元收 0.3 元固定，>6,000 元按万 0.5——无最低佣金门槛，全区间费率均可忽略，「小额交易不划算」的担忧不成立**（决策碎片化仍是坏习惯，但那与费率无关）。真正的费用杀手是**场内 ETF 的管理费/托管费**（年化 0.15%~0.6%），选标的时用同类比价，不用它否决买点。\n\n---\n\n## 五、每日工作流（学习飞轮落地）\n\n```\n交割单导出 → 知识库交割单目录 → analyze.py 合并去重 FIFO → pos.json / 当日收盘报告（§六）\n行情/消息 → 盘前(**08:30**)/午盘(11:35)/收盘(15:05) 复盘报告（含涨跌预判 + 热门板块机会评价；收盘另有期指信号栏。盘前 2026-09-16 由 09:26 提前至 08:30 → **早于集合竞价，报告改用「昨日收盘口径」，不含今日竞价数据**，红线按昨日收盘价判定）\n单聊/群发想法 → 三段式收录（原话→评价→知识链接）→ 复盘笔记_日期.md\n复盘笔记 → 知识卡合集(txt) → 微信读书阅读划线\n知识缺口 → 回写书单/拆书/卡池 → 沉淀为知识卡\n```\n\n1. **每日三份报告**（交易日定时）：盘前（当日预判）→ 午盘（下午预判）→ 收盘（次日预判：大盘 + 每只持仓逐只给方向），全部含「AI 预判仅供参考，不覆盖个人止损/定投纪律」。午盘与收盘报告另含「今日热门板块与机会评价」节（2026-09-06 新增：热门榜→资金主线→代表板块三档评价 有机会/观察/回避→持仓纪律映射；午盘=上午半日快照、收盘=全天实际；热门≠追高，档位仅供参考）。收盘报告另含「期指信号栏」（2026-09-06 新增：中金所前20净空单**边际变化** + 升贴水率，仅作次日预判辅助情绪参考，绝对量不作方向依据，不构成买卖触发）。\n2. **笔记收录**：在复盘机器人单聊（或 ETF 群）发想法 → 自动收录，AI 三段式评价（先判对错：对=符合哪条纪律 / 错=违反哪条，再强制推荐 1~2 条知识库内容）。\n3. **交割单管理**：新导出直接丢进 `交割单/`；**新旧重叠续导必须合并去重**（analyze.py 已内置：全部文件合并 → 按成交要素去同存异 → FIFO）。\n4. **建仓时**：立刻在 建仓日志 写一行（日期 / 代码 / 该批成本 / 止损价 / 逻辑线 / 当时大盘档位）——这是 3A.5 的落地载体，也是周复盘核对的原始证据。\n5. **每周回看**：① 现跑 `analyze.py` 看胜率、盈亏比、单笔最大亏损（数据来源见 §六）；② 填 周复盘模板 第一节的**纪律执行率**（守纪律笔数 ÷ 总笔数）——胜率是结果，**执行率才是唯一完全由你控制的指标**；③ 对照 §七 坑表逐条自检。\n\n---\n\n## 六、持仓与基线的事实来源（本文不存副本）\n\n> ⚠️ **本节只放取数入口，不存数据。** 教训（2026-09-10）：原「六、当前持仓档案」+「七、实战基线」是 `analyze.py` 输出的**手抄副本**，抄完即无人同步——一个月内笔数（30→29）、胜率（43.3%→44.8%）、总盈亏（−117.47→−108.87）、平均持仓（6.36→6.02 天）**四项全部与实盘对不上**。会腐烂的副本比没有更危险。\n\n| 要什么 | 唯一来源 | 怎么取 |\n|---|---|---|\n| 当前持仓 / 每批成本 / 止损位 | `trading/analyze.py`（FIFO 配对）→ `trading/pos.json` | 新交割单落地 → 重跑 analyze.py |\n| 今日持仓与盯防点 | 当日收盘复盘报告（`trading/daily_reports/`） | 自动化按时推送 |\n| 胜率 / 盈亏比 / 平均持仓天数 | 同上（analyze.py 统计段） | 周复盘时**现跑现看**，不抄进本文 |\n| **建仓当时的决策依据**（逻辑线 / 大盘档位 / 计划止损） | **建仓日志** | 建仓时手写一行——**交割单只有价格数量，永远查不到“当时为什么买”** |\n| 纪律执行率 | 周复盘模板 第一节 | 每周按 建仓日志 逐笔核对后填 |\n| 交割单原件 | `07-复盘笔记/ETF/交割单/`（**全部文件合并去重**后 FIFO） | 新导出直接丢进目录 |\n\n> 止损基准 = **该批成本 × 0.95**（见 3B.2，不用摊薄成本）；数据基线：交割单 2026-07-20 起。\n\n---\n\n## 七、已踩过的坑（认知错误检查表）\n\n> 每条来自真实复盘笔记，出现即对照本表自检。\n\n| 错误 | 表现 | 正确做法 | 知识卡 |\n|---|---|---|---|\n| 结果偏好 | 止损后反弹了 → 觉得\"止损是错的\" | 用决策过程评判对错，不用单次结果 | 交易认知偏差 |\n| 接飞刀 | \"急跌必有急反\"，破位想扛等反弹 | 破位先离场，企稳后重新计划再进（3B.5 → 3A.3） | 止损触发三问 |\n| 盘中判断止损 | 破位时纠结\"要不要先判断\" | 规则写在买入前，触发只执行不判断 | 短线纪律核对表 |\n| 代表性偏差 | 一只最弱分支亏损 → 否定整个赛道 | 区分**标的**与**赛道**，看内部强弱分化 | 第二层次思维 |\n| 沉没成本 | \"研究这么久了/亏了所以它最好\" | 上涨空间 = 景气度 × 位置，与已亏多少无关 | 钟摆与周期 |\n| 伪二选一 | \"坚持硬科技 or 换赛道\" | 止损标的不等于否定赛道；换赛道≠追已涨热点 | CANSLIM选股法 |\n| 追高避险反抽 | 养殖/白酒大涨想去追 | 防御反抽不追；等回踩或右侧确认（3A.3） | 等待最佳时机 |\n| **赚小跑·死守亏** | 有浮盈就急着兑现，亏了反而扛着等回本 | 用闸门③替代“感觉”：浮盈交给移动止损锁、浮亏交给 -5% 砍——**方向相反才叫纪律**。实证：515880 通信六笔小赚（+0.4~+2.9%）对三笔大亏（−5.7/−14.5/−14.8%） | 让利润奔跑 · 前景理论 |\n| **下跌途中摊平** | “跌了就补，摊低成本” | 路线B 亏损途中绝不补仓。实证：159611 电力ETF 07-23 起三日内连买 4 笔 @1.082/1.078/1.078/1.095，越买越套——摊平是把单笔小亏变成仓位大亏 | 试探建仓与加码 |\n\n> 后两条来自 2026-09-10 交割单复盘；此前坑表只覆盖“认知错误”，这两条是**交割单里真实亏掉的模式**。\n\n---\n\n## 八、非交易日工作流（周末生产日）\n\n> 一句话：**交易日 = 执行（消费），非交易日 = 生产（研究 / 复盘 / 学习）——周末的产出，决定下一周执行的质量。**（2026-09-06 新增：承接\"非交易日干什么都没兴趣\"的状态管理；配套模板 周复盘模板）\n\n### 8.1 先卸一个包袱：周末本来就该\"无事可做\"\n\n- A线定投看计划、B线止损已托管——双路线在非交易日本就是**零动作设计**；周末没有必须研究的\"该不该买\"，也没有需要盯的外盘。\n- 休市的是行情，不是你的系统。周末觉得无聊/没劲，通常来自三种机制，都不是你的错：① **刺激源断电**（行情、快讯、报告的即时反馈停了，大脑缺多巴胺——是戒断反应）；② **把\"忙碌\"当\"价值\"**（盯盘≠赚钱，闲着≠退步）；③ **把\"无事可做\"当\"失职\"**（其实恰恰是纪律在正常运转）。\n- **红线**：非交易日不因无聊去追研究新热点、不因焦虑把旧亏损复盘十遍——周末的手痒，周一会变成追高。\n\n### 8.2 四步工作流（把周末改成生产日）\n\n| 步骤 | 时间建议 | 做什么 |\n|---|---|---|\n| 1. **周复盘** | 周五收盘后或周六上午，30-40 分钟 | 按 周复盘模板 填：本周每笔守没守纪律、情绪记录、下周价位预案。**最值钱的一步** |\n| 2. **消化 + 学习** | 周六/周日各 30-60 分钟 | 清\"待消化\"的复盘笔记、书单、知识卡合集；**一次消化一条**，写成想法发复盘单聊 → 下个交易日自动收录变知识卡 |\n| 3. **静态梳理观察池** | 周日下午，限 30 分钟 | 只整理上周报告\"有机会/观察\"板块的逻辑与计划位，**不加新标的、不追周末消息** |\n| 4. **关闭仪式** | 周日晚 | 合上行情软件 → 把下周计划写进待办 → 对自己说\"本周交易相关到此为止\" |\n\n### 8.3 心智护栏（防\"交易占据全部心智\"）\n\n- 把\"你这个人\"和\"你的账户\"分开：周末提不起劲、忍不住反复看账户 → 是交易占据心智的早期信号（戒断反应），不是勤奋。\n- 分辨自己对交易的兴趣属于哪种：对**研究/系统/市场规律**有兴趣 → 是资产，可转化为学习与研究热情；只对**行情跳动/账户数字**有兴趣 → 需要刻意隔离，去建交易之外的生活线（运动/社交/阅读）。\n- 休市期间系统仍在运行（定投计划 + 止损线托管），不需要用\"看盘\"证明自己在场。\n\n### 8.4 知识锚点\n\n- 为什么盯着账户会痛苦：交易认知偏差（损失厌恶/结果偏好）· 概率思维\n- 如何在非交易日积累优势：学习飞轮 复盘笔记_2026-09-03（已删 2026-10-20） · 复盘笔记_2026-09-04（已删 2026-10-20）；学习方法 间隔重复 · 提取练习（把学习科学用在自己身上）\n\n---\n\n## 附录：现金管理 · 国债逆回购关键窗口（2026 下半年）\n\n> 完整打法（品种速查 / 周几规则 / **日内几点买** / 实操细节）见独立速查卡 国债逆回购速查卡。下表只列关键窗口。\n>\n> 规则：计息按**实际占款自然日**（周末/假期都计）；周五做 1 天期=周末白嫖只 1 天息，别做；**长假前在\"倒数第 2 个交易日\"做 1 天期**才吃满假期（最后一天做假期无息）。下单页以券商标注的「计息 N 天」为准。休市按交易所 2026 年公告（上证公告〔2025〕45 号）。\n\n| 窗口 | 操作日 | 休市 | 怎么做 | 计息预期 |\n|---|---|---|---|---|\n| 每周四（固定习惯） | 每交易日周四 | — | 收盘后 1 天期（GC001/R-001） | 3 天（含周末） |\n| 中秋节 | **9/23(三)** | 9/25–9/27 | 1 天期 | ≈3–4 天 |\n| 国庆 + 9月季末 | **9/29(二)** 主窗口；9/30(三) 当天可补 | 10/1–10/7 | 1 天期 | ≈8 天（全年最肥） |\n| 10 月末 | 10/29(四)（周四+月末前日） | — | 1 天期 | 3 天 |\n| 11 月末 | 11/30(一) 当天 | — | 1 天期 | 1–3 天（当天高息） |\n| 年末 + 元旦 | **12/30(三)** 主窗口；12/31(四) 当天补 | 1/1 起 | 1 天期 | ≈4 天 |\n\n提醒：以上非常规高息窗口（中秋/国庆/年末）已设飞书 ETF 群一次性提醒（操作前一晚 21:00）；每周四为固定习惯无需提醒。普通 10/11 月末提升有限不设提醒。\n\n---\n\n> **历史版本记录已拆出** → _版本记录（v1.0 ~ 当前，含每次改动理由与当时口径）。本文件只保留**现行规则**，避免旧口径被误读。\n> **知识导航已移至人读版** → 00-先看这里「延伸阅读」节（AI 执行规则不需要卡片索引）。",

   "body": "# ETF 交易系统速查卡（一页纸）\n\n> **用途**：决策当时翻这一页——**建仓前 / 止损触发时 / 手痒时**。完整规则见 ETF交易系统（正文 400+ 行，日常不必读）。\n> **一句话**：路线分治——宽基定投养底仓，题材波段守纪律；**规则写在买入前，触发只执行不判断**。\n\n---\n\n## 一、双路线（先分清自己这笔属于哪条）\n\n| | 路线A 宽基 | 路线B 题材/行业 |\n|---|---|---|\n| 标的 | 沪深300 / 综指 / 上证50 / 中证500 / 创业板 | 云计算 / 通信 / 软件 / 半导体等 |\n| 买入 | 定额定投，**不择时**；低估加档 | 试探仓 **1/5~1/4**；验证通过按 **3A.6** 一次补齐 |\n| 持有 | 越跌越买，不止损 | 浮亏**不摊平**；浮盈验证通过才加仓（3A.6） |\n| 卖出 | **分位 ≥70/80/90% → 卖 30/30/40%**；回落 10/20/30% → 买回 30/30/40%（v1.21） | **四道闸门，触发即走** |\n| 亏损性质 | **波动**（不是永久损失）→ 可扛 | **可能是永久损失**（投机）→ 必须砍 |\n\n**不许互相污染**：宽基亏损不能用题材思维砍；题材亏损不能套“越跌越买”扛单。\n\n---\n\n## 二、路线B 进场四步（顺序不能跳）\n\n| 步 | 闸门 | 不过就等 |\n|---|---|---|\n| 1 | **大盘四档**（v1.22，收盘 vs MA20）：**A 强势**=3/3 站上；**B 贴线震荡**=沪深300 距 MA20 ±1.5%；**C 分歧**=恰好 2/3；**D 弱势**=≤1/3 | A 正常开；B 只做**稳强型**（距60日高≤3%+vol≤1.5）试探仓；**C/D 不开**（D 唯一例外=深跌反弹 C 类 3A.3b）。旧「相对强度豁免通道」**已撤销**（v1.22 回测 0.00%/28%） |\n| 2 | **方向研究**（赛道有没有空间）：逻辑 → 验证 → 位置 → 右侧确认 | 画不出需求链 = 题材炒作 |\n| 3 | **分状态硬性条件**（v1.22）：A=**创60日新高+乖离≤10%+vol20≤2.0**；B=距高≤3%+vol≤1.5；C/D 见步1 | **vol20>2.0 一票否决**；量比不作硬性要求。①②③三信号=形态识别（管追/等），非硬门槛 |\n| 4 | **进场三问**：进场位离下方支撑多远（≥1N 吗）？止损价（支撑下沿 −0.5×N）落得舒服吗？能接受卖飞吗？ | 有一问答不上 → 降仓或放弃 |\n\n**买完立刻做两件事**：① 在 建仓日志 写一行（含逻辑线）；② 挂好止损单。\n\n---\n\n## 三、路线B 四道闸门（离场，触发即执行；v1.22 由三道扩为四道）\n\n| 闸门 | 触发条件 | 动作 |\n|---|---|---|\n| **① 价格硬止损** | 收盘 ≤ **止损价**（进场写定 = 支撑下沿 −0.5×N；突破进场=进场价−1×N；未写定兜底 该批成本 ×0.95） | **次日开盘无条件清仓**，不摊平、不再看 |\n| **② 逻辑止损** | 买入逻辑被证伪（景气/政策/趋势破坏，非大盘噪音） | **不看价格，直接走** |\n| **③ 移动止损 + 浮盈阶梯** | 浮盈 <15%：仍用进场写定的止损价（未写定兜底 成本×0.95）<br>浮盈 ≥15%：用 `max(止损价, 期间最高×0.92)`，并盯卖出信号<br>曾达 +20%：止损抬到**成本价**（保本） | 卖出锁利 |\n| **④ 时间止损（v1.22）** | 拿满 **20 个交易日**（C 类 15 日） | **收盘离场，不论盈亏** |\n\n**三条铁律**：只**收紧**不放宽 · 只朝盈利方向移动 · 只**收盘后**判、**不盘中判**。\n**大盘转弱不卖**（v1.22）：持仓中大盘转分歧/弱势、破 MA20 都**不多加卖出动作**——五种提前清仓变体回测全部减分；大盘档位只在买前管用。\n\n> 止损基准 = **该批成本（FIFO）**（兜底口径），v1.18 起优先用进场写定的结构位止损价（支撑下沿 −0.5×N）。止损可以错一次（最多亏 5%），**纪律不能破一次**。\n\n---\n\n## 四、硬数字（记不住别的，记这几个）\n\n| 数字 | 含义 |\n|---|---|\n| **止损价 = 支撑下沿 − 0.5×N** | 路线B 止损定价（v1.18；N = 20 日 ATR，见 N值）。写不出有效支撑 → 退回 **−5%**（该批成本 ×0.95）兜底 |\n| **突破进场：止损价 = 进场价 − 1×N** | 突破式进场锚换位（v1.18a；锚=突破位本身，非下方 20 日低点）。回踩进场维持 0.5N；统一记法「结构位 − 0.5~1N：回踩 0.5N、突破 1N」 |\n| **追 or 等形态判据（v1.19 观察条款）** | ③触发看两点：**前 10 日振幅 <8% 且近光头收盘 → 可追**；**前 10 日振幅 ≥15% → 禁追**（追 −4.83%、胜率 13%，93% 回踩）；8~15% 与大阳（≥6%）→ 默认等回踩 |\n| **1N / 2.5N** | 距离三档：现价离支撑 <1N **不进**；1~2.5N 正常进；>2.5N **等回踩** |\n| **追/等执行时点（v1.20）** | **突破型 = ③确认日尾盘 14:45 后 或 次日开盘**（绝不盘中早段追）；**回踩型 = 盘中预挂限价单 + 收盘复核**。脚本字段：`scan_signals.py` 的 `amp10` / `close_pos` / `chase_verdict` |\n| **vol20 ≤ 2.0**（v1.22） | 进场硬门槛，>2.0 一票否决（B 档稳强型 ≤1.5）；vol20 = 近 20 日日涨跌幅标准差 |\n| **C 类深跌反弹（v1.22）** | 触发：**20日乖离 ≤−12% 且 >−18%** + 沪深300 **5 日跌幅 ≥2%**（阴跌不做）；次日开盘进、止损=进场价−1×N、试探仓 400~500；出场=回MA20/−1N/**15 日**封顶；不适用 3A.6 |\n| **20 日到期线（v1.22）** | 普通仓拿满 20 个交易日**收盘离场不论盈亏**（C 类 15 日）；B 线收益有效期就是 20 日 |\n| **1% ÷ 止损距离%** | 仓位公式（治跳空）：账户 1% 风险 ÷ 止损距离 = 仓位金额；距离宽仓位自动小 |\n| **8%** | 路线B 移动止损回撤（最高价回撤 8%；v1.17 由 5% 放宽） |\n| **1/5 ~ 1/4** | 新标的试探仓比例（20%~25% 计划位） |\n| **20%** | 计划资金 = 总资金比例（1% 风险 ÷ 5% 止损距离） |\n| **3%** | 3A.6 加仓触发：试探批浮盈 ≥3% 且收盘站上 MA5、大盘未收 MA20 下 |\n| **+2%** | 3A.6 加仓高开护栏：次日开盘 ≤ 昨收×1.02 直接买；>×1.02 挂 ≤×1.01 等回落，不回落放弃（触发=收盘判定，执行=次日开盘 9:30~9:45 限价） |\n| **40%** | 同一主线合计上限（同主线最多 **2 只**） |\n| **15% / 20%** | 浮盈阶梯两档（≥15% 盯信号 / 曾达 20% 抬到成本价） |\n| **0 次** | 路线B 允许摊平的次数 |\n\n---\n\n## 五、当下禁止做的事（手痒时读这段）\n\n1. **不盘中改规则**——止损线、仓位、逻辑，一律买入前写死；盘中只执行。\n2. **不接飞刀**——破位不抄底，等分状态硬性条件齐（3A.3 v1.22）。\n3. **不追消息**——利好当天涨幅已大 = 等回踩，不追高。\n4. **不摊平**——下跌途中补仓是把单笔小亏变成仓位大亏（159611 实证）。\n5. **不因单次卖飞否定纪律**——10 次止损约 3 次卖飞，那是看住另外 7 次大亏的“税”。\n6. **不在非交易日手痒开新研究**——周末是生产日；红线上周手痒，周一会变成追高。\n\n---\n\n## 六、一句话自检（每天收盘后 30 秒）\n\n> 今天有没有**盘中临时决策**？有没有**该走没走**？有没有**写下逻辑线**？\n> 三个都没有 = 今天守住了；有一项没有 = 去 §七 坑表找对应错误。\n\n---\n\n*本文是 ETF交易系统 的一页纸摘要，**以正文为准**；正文改版时须同步本卡（见 `00-使用说明` §七）。*",

   "body": "# ETF 域书籍导读（投资 · 交易 · 财报）\n\n> 本域书目地图：01-原料 里与投资/交易/财报相关的书，每本给「状态 + 有没有必要读 + 建议顺序」，按你的双路线体系排优先级。原料书**只读不改**；本页只做导读，不替代 ETF复盘主页 锚点与 ETF交易系统。\n>\n> 档位：🟢必读（贴当前体系/缺口）· 🔵推荐（完善体系）· 🟡可选/按需（工具书）· ⚪暂缓（相关性低）。\n> 状态以来源卡 frontmatter 为准：读完=全书已拆；在读=已拆核心或部分，正文仍可续读；未拆=原料已备、尚未建卡。\n> **财报区 2026-09-10 已批量拆完 5 本**（仅林明樟扫描版跳过）——完整闭环见下方财报区。\n>\n> ## ⚠️ 2026-10-20 边界变更：个股短线的书已全部移出本页\n>\n> 个股短线已独立成域（`domain: shortline`），本页**不再负责**下列 4 本：\n>\n> 缠论 · 香象渡河 · 股票大作手操盘术 · 炒股养家心法 → 全部见 **短线书籍导读**\n>\n> 以下 5 本仍留在本域（`domain: etf`，技术分析通用，ETF 侧 20+ 张卡以它们为源），**短线域只按「跨域参考」借用、归属不改**：\n> 专业投机原理 · 短线交易秘诀 · 威科夫操盘法 · 量价分析 · 我如何从股市赚了200万\n>\n> **为什么不改归属**：这 5 本的卡已被 ETF交易系统 与日报引用，改 `domain` 会让它们变成孤儿卡。改归属的成本 > 收益。\n>\n> 本页与 短线书籍导读 的分工：**本页只回答「ETF 该怎么投」，个股短线怎么打一律不看本页。**\n\n## 一句话总览（先看这里）\n\n- **路线A 定投体系已闭环**（指南+老罗+共同基金+漫步华尔街+聪明投资者都已拆核心），剩下是\"补认知\"，不紧急；\n- **路线A 两大执行本均已收官（2026-09-10）**：指数基金投资指南（14 张卡：估值→买入→成本→计划→心理全链条）+ 指数基金投资从入门到精通（6 张卡：止盈与多策略工具箱）——**路线A 从\"为什么买\"到\"怎么坚持\"已无缺口**；\n- **路线A 的\"策略层\"已补上**（2026-09-10 老罗本收官 → 网格交易法/金字塔法买入策略/二八轮动策略/核心-卫星策略/定投止盈三法/智能定投（定期不定额））：从此路线A 不只是\"定期买\"，还能**按市场状态切换打法**；\n- **当前最大缺口 = 财报**（研究赛道五步法第二步\"验证龙头财报\"要用）：**地基+正向+防守+排雷四张卡已全部就绪**（会计恒等式与三表勾稽/读财报看景气/安全边际读表法/财报排雷清单+财务诡计识别框架），研究赛道验证龙头时照卡打勾即可；\n- **路线B 交易技术书已拆够用**（海龟/以交易为生/笑傲股市**全部读完**），大部头（期货技术分析/蜡烛图）当**工具书按需查**，不必通读；想补路线B 的\"什么时候卖\"→ 直接查 趋势持股与卖出信号清单（笑傲股市第10章）；\n- 想给路线A 的\"估值止盈\"再加固 → **已收官**（指数基金投资指南 已补齐）；认知层的\"补认知 5 本\"也已 **2026-09-10 去同存异拆完**；\n\n## 路线A 宽基定投（顺序 1→4）\n\n| 书（来源卡） | 状态 | 必要度 | 建议顺序 / 说明 |\n|---|---|---|---|\n| 指数基金投资指南 | 读完 ✅（2026-09-10 补齐第5–8章） | 🟢必读 | 路线A 操作蓝本（低估定投/止盈），**已收官**。共 14 张卡（方法10+概念4）：估值 盈利收益率定投法+低估是一个区域 · 买入 定投收益放大器/分批投入存量资金/定投频率选择 · 成本 指数基金费用清单/分红再投入与填权 · 计划 定投计划落纸面/三类定投计划模板 · 心理 定投双核制/复利三来源/价格围绕价值波动 |\n| 指数基金投资从入门到精通 | 读完 ✅（2026-09-10 补齐） | 🔵推荐 | 老罗（广发基金）。**指数基金地图 + 多策略工具箱**：品种/费用/场内场外打底，第8章止盈、第9章按市场状态选策略（网格/金字塔/二八/核心-卫星）。已提炼 6 张卡 → 定投止盈三法、智能定投（定期不定额）、金字塔法买入策略、网格交易法、二八轮动策略、核心-卫星策略 |\n| 共同基金常识 | 在读（成本/指数化已拆） | 🔵推荐 | 路线A 底层逻辑（成本拖累/指数化为何赢），拆完核心后按需补 |\n| 漫步华尔街 | 在读 | 🔵推荐 | 随机漫步/资产配置/生命周期，给\"定投不止损\"提供理论底气；长线慢慢读 |\n| 聪明的投资者 | 在读 | 🔵推荐 | 大部头；**只挑防御型投资者章节**读即可，不必全本啃 |\n| 投资最重要的事 | 在读 | 🔵推荐 | 周期/风险/第二层次思维——**报告情绪面锚点来源**，认知进阶放最后 |\n\n## 路线B 交易/技术（核心已拆，补读按需）\n\n| 书（来源卡） | 状态 | 必要度 | 建议顺序 / 说明 |\n|---|---|---|---|\n| 笑傲股市 | 读完 ✅（2026-09-10 补齐卖出/获利章） | 🔵推荐 | 与路线B 题材股最相关：**卖出/获利章已补齐**，对齐你系统 3B 离场篇。共 6 张卡：CANSLIM选股法、欧奈尔买卖纪律、杯柄突破买点、趋势持股与卖出信号清单（第10章图形层卖点全谱）、投资错误清单（第8章19种错误自检）、欧奈尔成长股准则20条（第20章最小可用清单） |\n| 以交易为生 | 在读（三重滤网/2%6%已拆） | 🟡按需 | 心理+风控章已拆；剩余章节当扩展，不赶 |\n| 期货市场技术分析 | 在读 | 🟡工具书 | **不要求通读**；趋势/形态/指标当字典查（MA/成交量概念） |\n| 日本蜡烛图技术新解 | 在读 | 🟡工具书 | K线形态速查；蜡烛图三原则 已拆，够用 |\n| 止损赚钱 | 读完 ✅（2026-10-17 当日拆完 6 卡） | 🔵推荐 | Arms（TRIN/Equivolume 发明人）讲**止损单两用 + 量价**；6 张卡：止损单两用、一局而非一仓、等量图Equivolume、强度盒信号、简易波动指标EMV、阿姆斯指数TRIN。对位路线 B：止损单纪律 + 强度盒进场 + 一局式加仓；形态章与工具书重叠未拆，按需查 |\n| 专业投机原理 | 读完 ✅（2026-10-20 拆完 6 卡） | 🟢必读 | 斯波朗迪。**短线第一梯队第 1 本**（03-短线超短 指定缺口=2B 法则）：6 张卡 2B法则、123法则、趋势线一致性画法、趋势剩余寿命法、一致性获利三原则、鳄鱼原则。对位：2B 补形态二**假突破否决**（512980 那笔的病因）、寿命法可回测成 A 股 ETF 版「涨多少算多」。期权/美国经济/当日冲销三块明确不搬 |\n| 短线交易秘诀 | 读完 ✅（2026-10-20 拆完 6 卡） | 🟢必读 | 拉里·威廉斯。**短线第一梯队第 2 本**。6 张卡：波动性突破（开盘价±前日波幅×系数，**我 1N 止损的原始出处**）· 攻击日形态（突出收盘+次日反向）· 做市商陷阱（窄箱突破后 1~3 天跌回＝假突破，512980 的判定语言）· 最大振荡值GSV（失败振荡×1.8 作触发）· 时间创造利润（持 6 天收益是 1 天的 5.6 倍）· 盈亏对称的几何必亏（50% 胜率+1:1 长期必亏）。**去同存异**：Oops 形态（电子盘后作者自认失效）、周内/月度交易日过滤（无 A 股对应样本）、其资金管理公式（10~15% 账户暴露，与 2%/6% 冲突）均不建卡 |\n| 威科夫操盘法 | 读完 ✅（2026-10-20 拆完 6 卡） | 🟢必读 | 孟洪涛。判断层：6 张卡 努力与结果（全书唯一底层判据）· Spring弹簧效应（跌破无量直接进/带量等二次测试）· 停止行为 · 聪明钱看盘顺序（五步检查表）· 吸筹四阶段 · 支撑阻力即供求。对位：给形态二补「**量配不配**」这一维；报告缺的「性质判断」一节可直接照此补。**去同存异**：UT 并入 Spring 卡（镜像）、JOC/SOS/冰线等术语并入吸筹卡 |\n| 量价分析 | 读完 ✅（2026-10-20 拆完 3 卡） | 🔵推荐 | 安娜·库林。规则层：量价三步法（微观→宏观→全局）· 量价异常三例（长阳低量/短阳高量/连续递减量）· 多周期传导（涟漪与发条车）。**与威科夫那本合读才完整**：孟洪涛给「看什么」，库林给「按什么顺序看」。**去同存异**：投入产出定律与 努力与结果 是同一条，已并入该卡不另建；VAP 需盘中数据，不搬 |\n| 我如何从股市赚了200万 | 读完 ✅（2026-10-20 拆完 2 卡） | 🔵推荐 | 达瓦斯（舞蹈演员，靠电报交易）。箱体理论（箱体层层上叠才做，跌破下轨就出，宽度 10~20%）· 移动止损（止损随股价上移，只损小部分利润）。对位：「箱体下轨」＝破位止损的几何定义；「止损上移」是我体系目前的**真缺口**。**注意**：A 股宽基 ETF 常横向震荡，「金字塔上叠」前提常不成立 |\n| 加密货币技术分析 | 在读（10-17 入库，书卡已建正文未拆） | ⚪暂缓 | 加密市场版 TA 入门：技术+基本面（链上）+炒作三路分析。K 线部分与蜡烛图/期货技术分析重叠；独有增量=链上指标/供应机制/情绪框架化。**加密市场特性不能搬进 A 股 ETF 体系**，暂不排阅读计划，涉足加密资产时按需查 |\n| 海龟交易法则 | 读完 ✅ | ⚪已完成 | 系统骨架（突破/仓位/止损）已全拆，无需重读 |\n| 交易心理分析 | 读完 ✅ | ⚪已完成 | 概率思维/赢家态度已入库 |\n| 股票大作手回忆录 | 读完 ✅ | ⚪已完成 | 纪律/顺势案例已沉淀 |\n| 李大霄投资战略 | 读完 ✅ | ⚪已完成 | 风向标/底部判据已拆（A股本土视角） |\n\n## 认知与心理（跨路线底层）\n\n| 书（来源卡） | 状态 | 必要度 | 建议顺序 / 说明 |\n|---|---|---|---|\n| 思考快与慢 | 读完 ✅（2026-09-10 补齐） | 🟡按需 | 大部头，已提炼 5 张卡：系统1与系统2/外部意见预测法 + 本轮补 前景理论（第25–26章）/心理账户（第31–32章）/后见之明与结果偏见（第19章）——**后三张直接对应交易行为**（成本价执念 / 分红漏损 / 复盘污染） |\n| 交易认知偏差 | 概念卡（已拆） | — | 非书，是上面几本的心理提炼，报告「心态层」锚点 |\n\n## 财报/基本面（原料已备 · 已拆 5 本 / 待拆 1 本[扫描版]）\n\n> 背景：研究赛道（新赛道研究五步法 第二步）要用龙头财报验证景气；对 ETF 玩家**地基 + 验证 + 排雷**三本核心就够，不鼓励学个股深度排雷全套。\n> 2026-09-10 已拆前 5 本，共提炼 5 张方法卡，构成完整闭环：\n> - **地基**：会计恒等式与三表勾稽（柠檬汁摊记账直觉：资产=负债+权益 / 利润≠现金 / 权责发生制）\n> - **进取·正向**：读财报看景气（增长→质量→现金排雷三问）\n> - **防守·安全**：安全边际读表法（格雷厄姆三铁律：营运资金/流动速动比率/利息保障倍数）\n> - **排雷·反向**：财报排雷清单（财报外信号→科目扫雷→操纵手法→董事会报告连读）\n> - **排雷·原理**：财务诡计识别框架（四大类诡计图谱 + 法证式十招）\n> **推荐路径：地基（会计恒等式）→ 正向（看景气）+ 防守（安全边际）→ 排雷（唐朝清单 + 财务诡计原理）**，研究赛道验证龙头时照卡打勾即可，不必先啃全书。\n\n| 书（原料 epub/pdf） | 状态 | 必要度 | 建议顺序 / 说明 |\n|---|---|---|---|\n| 《一本书读懂财报》（肖星） | ✅已拆 2026-09-10 | 🟢必读 | **财报第 2 本**。三表框架地基 → 来源卡 一本书读懂财报；已提炼 读财报看景气 方法卡 |\n| 《手把手教你读财报》（唐朝） | ✅已拆 2026-09-10 | 🟢必读 | **财报第 3 本**。A股年报实操+排雷视角 → 来源卡 手把手教你读财报；已提炼 财报排雷清单 方法卡（排除法四段） |\n| 《世界上最简单的会计书》（穆利斯/奥洛夫） | ✅已拆 2026-09-10 | 🟢必读 | **财报第 1 本（最入门·最该先读）**。柠檬汁摊故事把三表演成肌肉记忆 → 来源卡 世界上最简单的会计书；已提炼 会计恒等式与三表勾稽 方法卡 |\n| 《像格雷厄姆一样读财报》（格雷厄姆） | ✅已拆 2026-09-10 | 🔵推荐 | **财报第 4 本**。价值投资防守视角，34章逐科目+15比率 → 来源卡 像格雷厄姆一样读财报；已提炼 安全边际读表法 方法卡（与路线A 气质最合） |\n| 《财务诡计》（施利特等·第4版） | ✅已拆 2026-09-10 | 🔵推荐 | **财报第 5 本**。四大类舞弊图谱+法证式十招 → 来源卡 财务诡计；已提炼 财务诡计识别框架 方法卡（排雷原理） |\n| 《用生活常识就能看懂财务报表》（林明樟） | ⚠️未拆（扫描版无文本层） | 🟡可选 | PDF 为纯图片扫描（无文字层，233页/74MB），无法程序化提取；若确要拆需 OCR（成本高）。前 5 本已覆盖同类内容，**建议跳过或仅在纸质版借阅时翻阅** |\n\n## 阅读决策树（30 秒版）\n\n```\n想补路线A 认知？   → 指南已收官；可选 聪明投资者(防御章) → 投资最重要的事\n想补路线A 操作？   → 已闭环：估值 盈利收益率定投法 → 买多少 定投收益放大器 → 省钱 指数基金费用清单 → 计划 三类定投计划模板\n想补路线A 策略？   → 老罗第9章（已拆卡）：牛市满仓/震荡网格/熊市金字塔/风格二八轮动
