   "body": "# 主线雷达操作手册\n\n> **一句话**：路线B 进场侧的「客观右侧确认器」——脚本扫全市场挑候选 + 对观察池做 v1.22 分状态复核，把「今天该研究哪个方向」从靠感觉变成看数据。替代「问财选股」这个第三方工具。\n>\n> **它不做什么**：不给买卖建议，不替代 新赛道研究五步法 第 1/2/3 步（需求链 / 龙头财报 / 拥挤度——这三步机器替代不了，必须人判断）。它只做第 4 步「右侧确认」里**能客观算的部分**。\n\n**版本对齐**：本手册判据随 ETF交易系统 走，当前 **v1.22（2026-10-19）**——大盘四档 A/B/C/D + 分状态硬性进场条件（3A.3）+ 深跌反弹 C 类 + 四道闸门（3B.1）。旧「①②③三档 + R1/R2 豁免通道」**已撤销**（判决性回测 0.00%/28%），R1 降为观察指标。\n\n---\n\n## 一、完整链路\n\n```\n脚本 --discover（扫全市场行业/概念榜）\n        │  每天盘后跑，看今天资金在买谁（⚠️ 东财拒连时此层空缺，以 --new 为准）\n        ▼\n观察池 watchlist.json（候选范围，自动发现 + 人工补充）\n        │  你在 ETF 群说「关注 XX」→ 收录进池\n        ▼\n脚本 --json（v1.22 分状态复核：大盘四档 + 分状态硬性进场条件）\n        │\n        ▼\nfocus_active=true（命中≥2只）→ 推 ETF 群「focus 命中」→ 你走五步法 1/2/3 步\n未命中 → 静默（退潮期空仓是最优解，不制造噪音）\n```\n\n- **日常你 0 操作**。只有两种情况需要出手：① 想看新方向深究 → 跟我说，我帮你查需求链和龙头财报；② 看到群里的「focus 命中」提醒 → 决定要不要往下走。\n- 脚本不碰券商、不碰下单，最后「真买」那一下才打开券商 App 下单。**取数会调用同花顺金融数据 CLI 与股叉叉 MCP**（2026-10-02 起，见 §四）。\n\n## 二、v1.22 判定标准（真源 ETF交易系统 3A.1 / 3A.3）\n\n### 大盘四档（3A.1 机械化收盘口径）\n\n基准：上证 + 沪深300 + 创业板指 **收盘价 vs MA20**。\n\n| 档位 | 判定 | 动作 |\n|---|---|---|\n| **A 强势** | 3/3 站上 MA20 | 正常开仓 |\n| **B 贴线震荡** | 沪深300 距 MA20 ±1.5% | 只做稳强型试探仓、不追领涨 |\n| **C 分歧** | 恰 2/3 站上 | 不开仓 |\n| **D 弱势** | ≤1/3 站上 | 默认不开仓；唯一例外=深跌反弹 C 类 |\n\n> 旧「①②③三档 + R1/R2 豁免通道」已撤销（v1.22）：弱市最强=刚见顶要补跌，豁免通道判决性回测 0.00%/28%。`calc_rel_strength.py` 保留，R1 降为**观察指标**。\n\n### 分状态 focus 条件（3A.3，14年×219只数据 `_bt_state_signal.py`）\n\n| 档位 | 硬性进场条件 | 回测 |\n|---|---|---|\n| A | 创60日新高 + 距MA20乖离≤10% + vol20≤2.0（**量比不作硬性**，IC≈0） | +1.29%/38% |\n| B | 距60日高≤3% + vol20≤1.5（稳强型） | +0.50%/36% |\n| C | 无（空仓最优） | — |\n| D | 仅深跌反弹 **C 类**：20日乖离 ≤−12% 且 >−18% + 大盘5日跌≥2%（急跌态，阴跌不做） | +3.45%/65% |\n\n- **vol20>2.0 一票否决**（波动率 Q5 崩盘段，`_bt_bline_volfilter.py` 倒U形结论）。\n- ①②③三信号**降级为形态识别**（服务追等判定），不再是买不买的门槛。\n- C 类出场=回 MA20 / −1N / 15日封顶，三选一先到；止损=成交价−1×N；试探仓 400~500。\n\n### focus 推送口径（`_radar_timing_count.py` 实测，写定）\n\n| 项 | 口径 |\n|---|---|\n| 触发 | 单日命中 **≥2 只** 才推 focus（命中 1 只=伪突破嫌疑，−0.70%/25% → 降级 watch 提示） |\n| 排序 | 距60日高升序（最强优先） |\n| 上限 | 5 只 |\n| 执行 | **次日开盘**（尾盘进与次日开盘进实测等价） |\n| 进场价格参考 | 逐只给：进场=次日开盘价；**止损=成交价−1×N（N=atr20）**；MA20 出场线。数字一律取 `focus_list` 的 close/atr20/ma20 字段，**禁止自己算或编造** |\n| 正式口径 | 收盘 16:00 雷达=正式确认；午盘 11:35 推送=盘中候选预警（标注候选非确认、尾盘 14:45 复核后才进场） |\n\n### 情绪档位（位置不是预测，钟摆与周期）\n\n| 档位 | 判定 | 动作 |\n|---|---|---|\n| 极冷 | 跌停>涨停 且 下跌>4000家 | 不开仓 |\n| 偏冷 | — | 不开仓 |\n| 中性 | — | 按 3A.1 |\n| 偏热 | — | 可开仓不追高 |\n| 过热 | 涨停≥100 或 炸板率>40% | 宁可不进 |\n\n情绪读数**不替代 3A.1 闸门，两者取更严**；涨停原因取同花顺原文、禁止主观归纳；三池全 0=「无数据」不得当中性。\n\n## 三、脚本用法\n\n```bash\n# 0. ⚠️ K 线预热（2026-10-02 起**必须最先跑**，否则 --new 直接报「日K缓存缺失」）\npython trading/_radar_warm.py            # 增量；当天已跑过会跳过\npython trading/_radar_warm.py --force    # 全量重抓（294 只 8 并发约 60-70 秒）\n#   主源＝同花顺 CLI `fund history`（前复权、无单位跳变）；腾讯为自动备源\n#   产物：trading/观察池/_radar_kline.json\n\n# 1. 观察池复核（v1.22：market_tier/tier_code/focus_list/focus_active）\npython trading/scan_watchlist.py\npython trading/scan_watchlist.py --html  # 自包含 HTML → trading/观察池/观察池_<运行日>.html\n#   focus 生效时页面自带「📍 进场价格参考」表（含止损距离%）\n\n# 2. 今日候选发现：扫行业/概念榜（替代问财），标出哪些已在池\npython trading/scan_watchlist.py --discover\n#   ⚠️ 东财 clist 两主机当前拒连 → 会返回 discover_ok=false + discover_error，\n#      并补一条**独立维度** industry_crowding（股叉叉行业拥挤度快照，带 crowding_asof）。\n#      拥挤度 ≠ 涨幅榜，**不可当候选发现用**；发现层以 --new 为准。\n\n# 3. 全市场「新方向初现」（连续 2 日命中 C2+C3 且 60 日位置 <85%）\npython trading/scan_watchlist.py --new            # 读缓存，约 0.7 秒\npython trading/scan_watchlist.py --new --json\n#   境内/QDII 分层：new_directions[] / qdii_directions[]；口径如实披露\n#   （universe = scanned + skipped_kline + bad_data + pool_excluded + excluded_kw）\n\n# 4. 情绪面（涨停/跌停/炸板池 + 连板天梯 + 龙虎榜；源＝同花顺 CLI special/*）\npython trading/scan_watchlist.py --sentiment\npython trading/scan_watchlist.py --sentiment --date-ms <Asia/Shanghai 零点毫秒>   # 回溯历史交易日\n\n# 5. 纯 JSON 输出（供自动化/后续报告消费）\npython trading/scan_watchlist.py --json\n#   v1.22 关键字段：market_tier / tier_code(A/B/C/D) / above_count / hs300_dev /\n#   hs300_5d（大盘5日跌幅，C类环境判据）/ focus_list[]（dist60 升序、上限5，\n#   含 close/atr20/ma20）/ focus_active（≥2只才 true）/ focus_pool_n\n\n# 6. R1 相对强度（v1.22 起降为**观察指标**，不再是豁免通道门槛）\npython trading/calc_rel_strength.py --closed          # 扫 watchlist.json 全部；--closed = 只看已收盘\n\n# 7. 止跌企稳三信号批量进度（①放量收阳日 / 前低 / ③线＝①日高·固定 / 参考进场带）\npython trading/scan_signals.py --closed\n#   ①②③ 已降级为形态识别（服务追等判定），不是买不买的门槛\n\n# 8. 一步复核（推荐）：三分类 + 推送结论，代替手工解析 --json\npython trading/_radar_check.py              # 基准日取 **data_date**（K线末日），不是运行日\npython trading/_radar_check.py 2026-09-30   # 指定日期复核\n#   同时落盘 trading/tmp_radar_sum_<data_date>.txt（复核留档，不推送）\n```\n\n### 口径：`date` vs `data_date`（2026-10-02 立）\n\n| 字段 | 含义 | 用法 |\n|---|---|---|\n| `date` / `run_date` | **运行日**（脚本跑的那天） | 只用于 HTML 文件名（避免假期手跑覆盖真实交易日归档） |\n| `data_date` | **K 线末日 = 有效交易日** | **分类基准日**（`_classify(x, today)` 的 `today`）、`--new` 判据、复核留档文件名 |\n| `data_stale` | `data_date != date` | 为 true 时报告**顶部强制标注**「数据口径 X（非当日，结论基于上一交易日）」 |\n\n**为什么**：假期/手动重跑时，旧版一律用运行日 → 页面日期、`--new` 留档名、「已观察 N 天」全被多算，等于把上一交易日的结论冒充当日结论。**判定基准一律用 `data_date`（有效口径）**。\n\n⚠️ **`--closed` 不是可选项，是口径红线**：腾讯 fqkline 在盘中会把**当日未收盘的半截 K 线**作为最后一行返回，不加 `--closed` 得到的是「盘中快照」。**做纪律判定一律加 `--closed`**；盘中快照只用于盯盘。\n\n⚠️ **三分类不要读 `--json` 的 `results[].status`**：那是 `watchlist.json` 的原始字段，**不等于** focus/watch/drop；三分类只在 render 时由 `_classify(x, today)` 算（**两参**）。要三分类就走一步复核脚本，或读 HTML badge。\n\n用 `C:/Users/35313/.workbuddy/binaries/python/versions/3.13.12/python.exe` 跑，工作目录 `F:/Ai/workbuddy/2026-09-02-15-22-29/`。\n\n## 四、数据源与回退链\n\n| 数据 | 主源 | 回退 |\n|---|---|---|\n| 日K线（算 MA20/量能/新高/vol20/乖离） | **同花顺 CLI `fund history`**（前复权、无单位跳变） | 腾讯 `web.ifzq.gtimg.cn` fqkline → 新浪 |\n| 指数行情（大盘四档 3A.1） | 同花顺 CLI `index history` | 腾讯 → 新浪 |\n| 全市场标的池（`--new`） | `观察池/_radar_kline.json`（`_radar_warm.py` 预热） | — |\n| 板块涨跌/净流入（`--discover`） | 东财 `push2delay`/`push2` clist | **股叉叉 `get_industry_crowding`（仅作独立维度，非替代）** |\n| 情绪面（涨停/跌停/炸板/连板） | 同花顺 CLI `special/*` | — |\n| 龙虎榜（情绪面附属） | 同花顺 CLI `special dragon-tiger` | — |\n\n- 全部失败时降级为「不可算」，**绝不硬编数值**（沿用系统铁律：禁止编造）。\n- ⚠️ **失败必须显式标识，不能说成「今天没有」**：`--discover` 在东财挂掉时返回 `discover_ok=false` + `discover_error`，并附 `industry_crowding`（股叉叉拥挤度，带 `crowding_asof`）。它是「位置/过热」维度，**不是「今日资金在买谁」**，报告里禁止冒充涨幅榜。\n- 凌晨/非交易时段东财历史域可能被断连（实测 `Remote end closed connection`），脚本内置三级回退。\n\n## 五、观察池维护（watchlist.json）\n\n- 路径：`trading/观察池/watchlist.json`（2026-09-21 起观察池资产统一收进 `trading/观察池/`）\n- 每个候选：`name`（板块名）/ `etf`（腾讯代码，sz/sh 开头）/ `secid`（东财代码，沪 1. 深 0.）/ `status`（watch=观察 / ready=右侧确认齐 / drop=已放弃）/ `leaders`（龙头股 secid，可选）/ `note`\n- **每只另带机器算字段**：`rel_strength`（R1 近5日超额 / MA20 / R2；v1.22 起仅观察指标）与 `signals`（`sig1_date` / `prev_low` / `sig3_line` / `sig3_gap_pct` / `band_ref`）；两者都带 `basis` 字段 = 数据基准日，**一律为已收盘口径**。字段由脚本复算，不要手改。\n- **扫描范围 = 唯一池**：`watchlist.json` 是雷达的扫描范围，也是候选池唯一载体。（原「候补席周表」机制——`07-复盘笔记/ETF/观察池/观察池_YYYY-MM-DD当周.md` + 观察池模板（已删 2026-10-20）——自 2026-09-21 后停更，**2026-10-20 废止并删除**，模板与两期周表备份在工作区 `trading/_backups/2026-10-20_删除KB观察池/`。）\n- ⚠️ **出池必须物理删行，不能只改 `status`**：`status=drop` 只影响显示，**雷达仍会照扫、继续报 drop**（159587 粮食/厄尔尼诺自 09-18 判出池后一直被扫到 09-24，就是只改了 status 没删行的后果）。**2026-09-24 首次整池裁剪**：按雷达 ⚠️ 深跌区提示 + 用户指令，物理移除 7 只（159273／515230／515790／516160／512880／561560／159587），扫描范围 **15 → 8 只**；明细写进 json 的 `removed_log`，原文件备份 `watchlist.json.bak_20260924`。\n- **加候选**：你在 ETF 群说「关注存储」→ 收录时我加进池；或你自己填一行\n- **删候选**：逻辑证伪 / 长期无资金 → **直接删行**（推荐；删前备份，明细记进 `removed_log`）。⚠️ 只改 `status=drop` 不删行 = 雷达照扫，等于没出池\n\n### 出池优先级（2026-09-24 立 · 2026-10-20 随周表废止修订）\n\n**一句话：所有候选（原候补席/方向代理两类，周表废止后统一为「池内候选」）按自身逻辑出池；雷达的「深跌区」只作提示。**\n\n| 类别 | 定义 | 雷达 ⚠️ 深跌区怎么处理 | 出池依据 |\n|---|---|---|---|\n| **池内候选**（周表废止后统一） | 在 `watchlist.json` 里的标的 | **只作提示，不触发删除** | 逻辑证伪（E1）／池子上限（E2）／人工判断（原候补席的「观察期到期/①作废/破前低」规则随周表机制废止，如需沿用按人工判断执行） |\n\n> **2026-10-02 口径统一（消歧）**：`drop` 的判据验证结论是——该形态命中后 20 日 **+1.00%**（超额 **+0.82pp**），60 日位置 <15% 时 **+1.47%**，**更接近局部底部而非「没戏」**。故 `drop` 只作「深跌区观察提示」（文案固定写「等 ① 放量收阳企稳」）。**两类都不以 `drop` 为出池依据**；要出池得走上面的自身规则或你直接指令。\n\n- **硬例外 E1（逻辑证伪优先）**：驱动逻辑被推翻（涨价函停止、政策转向、需求链断裂）→ **立即出池**；依据以对话/复盘记录为准。\n- **硬例外 E2（池子上限优先）**：池子过大又有新标的入池 → 先删最弱，按强弱 + 出池条件是否满足排序，**不    "body": "# 同花顺金融数据 CLI\n\n> 一句话：`@hithink-tech/hithink-finance-cli`（同花顺官方，MIT）—— **104 个命令**覆盖行情/基金/指数/财务/特色数据/期货/期权，**K 线无单位跳变**，是继新浪/腾讯/东财之后**最完整的取数源**，并自带 **DuckDB 本地批量存储**。\n> 安装与验证：2026-10-02。**安装 + 认证均完成**。\n\n## 一、安装与认证（2026-10-02 完成）\n\n| 项 | 值 |\n|---|---|\n| 包 | `@hithink-tech/hithink-finance-cli` **v0.1.13**（MIT，仓库 `github.com/HiThink-Tech/Financial-API`）|\n| 依赖 | zod · commander · **@duckdb/node-api**（本地库）· **@napi-rs/keyring**（凭据加密）· skills |\n| CLI 路径 | `C:\\Users\\35313\\.workbuddy\\binaries\\node\\versions\\22.22.2-3\\hithink-finance.cmd` |\n| Node 要求 | `>=22.12.0`（本机 22.22.2 ✅）|\n| **Skill** | **12 个** → `C:\\Users\\35313\\.workbuddy\\skills\\hithink-finance-*`（Junction 链接）|\n| Skill 同步目标 | codex ✓ / claude-code ✓ / **workbuddy ✓** |\n| 认证 | ✅ `configured: true`（keyring，**API Key 不落明文**）|\n| 本地库 | `...\\AppData\\Local\\hithink-finance\\data\\market.duckdb` —— ✅ **已 init（2026-10-02）**：**A股个股 10 年日K**（1,031 万行 / 2,320 只 / 2,427 交易日 / 2016-10-10~2026-09-30）+ 复权因子 1,031 万行 |\n\n> ⚠️ 机器上**无 `npx`**，用 **`pnpm dlx`** 跑 `skills` 包时因子进程找不到 `node` 而失败；最终按用户第二条指令走 **`npm install -g`**（npm 在 WorkBuddy 的 node 22 内：`...\\22.22.2-3\\node_modules\\npm\\bin\\npm-cli.js`）。\n\n## 二、数据质量实测（关键结论）\n\n**用本项目已知被新浪跳变污染的 4 只做对照**（`fund history`，前复权，`--interval 1d`）：\n\n| thscode | 根数 | 区间 | **最大单日跳变** | 判定 |\n|---|---:|---|---:|---|\n| 512480.SH 半导体 | 908 | 2023-01-03 ~ 2026-09-30 | **10.1%** | ✅ 干净 |\n| 159995.SZ 芯片 | 908 | 2023-01-03 ~ 2026-09-30 | **10.1%** | ✅ 干净 |\n| 159516.SZ 半导体设备 | 772 | 2023-07-27 ~ 2026-09-30 | **10.1%** | ✅ 干净 |\n| 159583.SZ 通信 | 543 | 2024-07-08 ~ 2026-09-30 | **10.0%** | ✅ 干净 |\n\n**三方对照**：\n\n| 源 | 最大单日跳变 | 最大根数 | 结论 |\n|---|---:|---:|---|\n| **新浪** `getKLineData` | **+248%** ⚠️ | 4000 | 需截断，历史被砍 |\n| **腾讯** `fqkline` | 10.1% | 800 | 干净但短 |\n| **同花顺** `fund history` | **10.1%** | **908+** | ✅ **干净且更长** |\n\n**交叉验证通过**：`512480` 末值 **0.955**（=腾讯）、`index history` 沪深300 末值 **4357.62**（=报告内嵌实际值）、交易日历覆盖 20251009~20260930（241 天）。\n\n> 📌 **一处需注意**：同花顺 K 线**从 2023-01-03 起**（约 908 根 ≈ 3.7 年），**不足以做 14 年长历史回测**（那仍需新浪截断序列）。**日常取数与短中期回测用它，长历史保留新浪。**\n\n## 三、命令全景（104 个）\n\n| 模块 | 数量 | 关键命令 | 对应用途 |\n|---|---:|---|---|\n| **fund** | 34 | `history` `snapshot` `nav` `diagnostics` `holdings` `drawdowns` `backtest-result` `quota-list` `indicators-table` | **ETF 主力模块**：前复权日线、净值、回撤区间、持仓、诊断、**在线回测**、QDII 额度 |\n| **futures** | 20 | `main` `basis-history` `warehouse-receipts` `position-companies` `daily` | 期指/商品：升贴水历史、仓单、持仓龙虎 |\n| **special** | 11 | `limit-up-pool` `limit-down-pool` `limit-break-pool` **`limit-up-ladder`** `anomaly-list` `hot-stock` `dragon-tiger` `skyrocket` | **情绪面**（替代东财 ztpool/dtpool/zbpool）+ **连板天梯/异动原因/龙虎榜/热股榜** |\n| **market** | 8 | `history` `snapshot` **`auction-snapshot`** **`auction-benchmark`** `calendar` `corporate-actions` `panel*` `adjustment-factors*` | **集合竞价快照**（盘前报告一直缺的当日竞价）· 复权因子 · 本地全市场面板 |\n| **data** | 8 | `init` `sync` `status` `validate` `repair` `migrate` `clean` `remove` | **DuckDB 本地批量下载**（用户提到的「批量下载」）|\n| **db** | 3 | `describe` `query` `export` | 本地库只读 SQL / 导出 |\n| **index** | 4 | `catalog` `constituents` **`history`** `snapshot` | 指数目录/成分/历史（替代东财 clist）|\n| **financials** | 4 | `income` `balance-sheet` `cash-flow` `indicators` | 财务三表与指标 |\n| **symbol** | 2 | `search` `list` | **名称/ticker → thscode**（替代东财代码表）|\n| **valuation** | 1 | `snapshot` | A 股估值快照 —— ⚠️ **当前上游报错**（见 §四）|\n| **options** | 6 | `varieties` `contracts` `daily` … | 期权 |\n| **skills** | 3 | `status` `sync` `remove` | 技能安装/同步 |\n\n（`*` = `source: local`，需先 `data init` + `data sync`）\n\n## 三之二、本地 DuckDB（`data init` 实测）\n\n**`data init` 下载 172.8 MiB parquet + 复权因子，耗时 86 秒**：\n\n| 项 | 值 |\n|---|---|\n| 库路径 | `C:\\Users\\35313\\AppData\\Local\\hithink-finance\\data\\market.duckdb` |\n| 表 | `raw_kline_daily` · `raw_adjustment_events` · `dim_symbol` + 4 个 `stg_*` + **4 个视图** |\n| **视图** | **`v_daily`（不复权）· `v_daily_qfq`（前复权）· `v_daily_hfq`（后复权）· `v_symbol`** |\n| 规模 | **10,316,588 行 / 2,320 只 / 2,427 个交易日 / 2016-10-10 ~ 2026-09-30（整 10 年）** |\n| 字段 | `thscode, date, open, high, low, close, prev_close, volume, amount`（列名是 **`date`**，不是 `trade_date`）|\n| 查询 | `hithink-finance db query --sql \"SELECT ... FROM v_daily_qfq WHERE ...\"`（**只接受单条 SELECT、不能带分号**）|\n\n> ⚠️ **范围边界**：本地库**只有 A 股个股**（`asset_type='a-share'`）——**不含 ETF**。ETF 必须走远端 `fund history`。\n> 📌 **列名陷阱**：`raw_kline_daily` 用 `date`；写成 `trade_date` 会静默返回 `null`。\n\n## 三之三、special 情绪面（实测 2026-09-30）\n\n| 命令 | 实测结果 | 拿到什么 |\n|---|---|---|\n| `special limit-up-pool` | **56 只** | 个股 · 涨幅 · **封板时间** · **涨停原因（题材原文）** · `continue_day_cnt` 连板数 · `seal_money` 封单额 · `is_st` |\n| `special limit-down-pool` | **11 只** | 跌停（对应档位判定）|\n| `special limit-break-pool` | **12 只** | 炸板（过热信号）|\n| `special limit-up-ladder` | **30 天** | 连板天梯（2板/3板…）· `seal_nextday` **次日封板结果** · `sign_level` |\n| `special dragon-tiger` | ✅ **2026-10-02 复测已可用**（原本 2026-09-30 记为「0 条未发布」） | 龙虎榜：`--board-type` 可选 `all` / `org`（机构）/ `hot_money`（游资）· `--date YYYY-MM-DD` 可回溯。字段：`net_value` 净买额 · `org_net_value` 机构净买 · `hot_money_net_value` 游资净买 · `concept_list` 题材 · `hot_rank`。⚠️ **同一只票会在多个榜单重复出现，取数时必须按 `ticker` 去重**；⚠️ 2026-09-30 实测 79 条/66 只，`hot_money` 单类型当日为 0 条（游资榜可能缺发布）|\n| `special hot-stock` / `anomaly-list` / `anomaly-stock` | 仅当日 | 热股榜 / 个股异动 |\n\n**2026-09-30 真实读数**：涨停 56 / 跌停 11 / 炸板 12 / **最高 7 板**；连板分布 7板×1、4板×1、3板×4、2板×6、首板×44；最高连板个股 新华传媒(7板·09:25·拟收购界面财联社) / 襄阳轴承(4板) / 善水科技(3板)。\n**涨停原因原文**可看出当日主线：**固态电池**（上海洗霸/紫竹高科/传艺科技）、**国资重组**（新华传媒/襄阳轴承/深物业A）。\n\n## 三之四、集合竞价（新增能力，实测）\n\n| 命令 | 参数 | 实测 |\n|---|---|---|\n| `market auction-snapshot` | `--thscodes`（逗号分隔，≤100）· **`--stage` 可选 `live` / `final`** | ⚠️ **只接 A 股个股**（ETF 报 `Unknown thscode`）|\n| `market auction-benchmark` | `--date YYYY-MM-DD`（可回溯） | ✅ 返回 6 只**竞价异动个股**（`auction_pct` + `tags` 题材标签），如 2026-09-30：新华传媒 +9.99%、万科A −6.86% |\n\n> **对盘前报告的意义**：`--stage live` 可在 **09:15~09:25 竞价进行中**取数 → 盘前 08:30 报告仍拿不到竞价（时点早于竞价），**但若把盘前报告的「竞价自查」环节延到 09:20 左右，就能拿到实时竞价快照**。这是一个**可选的时点/task 拆分方案**，尚未采纳。\n> ⚠️ 两个竞价命令**都不含 ETF 价格** → **「盘前拿不到 ETF 竞价价」这个结构性限制依然存在**（v1.17 的盘前口径条文无需修改）。\n\n## 四、已知问题与边界\n\n| # | 问题 | 说明 |\n|---|---|---|\n| 1 | **`valuation snapshot` 上游报错** | `FUYAO_3001: Target not found in A-share code table` —— 传 `600519.SH` 亦报错，**Hithink 服务端问题，非用法错误**。估值仍用蛋卷/guchacha。|\n| 2 | **`market history` 不接 ETF** | 报 `Unknown thscode: 512480.SH`（尽管 `symbol search` 刚返回它）；**ETF 行情必须走 `fund history`** |\n| 2b | **`index history` 不支持 `--interval`** | `fund history` 有 `--interval`，**`index history` 没有** → 若照抄参数会报 `unknown option '--interval'` 并**静默失败**（2026-10-02 踩过，导致三个指数全部取不到）|\n| 3 | **远端 K 线有窗口上限** | `fund history` 请求 900 天实际只回 **598 根**（约 2.4 年）；要更长历史走**本地库**（见下）|\n| 4 | **本地库只含 A 股个股，不含 ETF** | `raw_kline_daily` 2,320 只全为 `a-share`；`dim_symbol` 查 ETF 返回 0；`512480.SH` 在库中 0 行 → **ETF 必须走远端 `fund history`**。库内 10 年历史**只覆盖个股** |\n| 5 | **本会话（DSH）读不到那 12 个 Skill** | 它们装在 `~/.workbuddy/skills/`；DSH 的 `.dsh/skills` 为空。**CLI 本身我可用 pwsh 调用**（已验证）。**2026-10-02 复测：WorkBuddy 会话的 available_skills 里已能看到全部 12 个 `hithink-finance-*`** → 该限制在 WorkBuddy 侧**已不复现**，仅 DSH 侧可能仍存在 |\n\n## 五、取数源选型（2026-10-02 更新）\n\n| 优先级 | 源 | 用于 |\n|---|---|---|\n| **1** | **同花顺 CLI** | ETF 日线（`fund history`）、指数（`index history`）、名称映射（`symbol search`）、**情绪面（`special *`）**、财务（`financials *`）、**A股 10 年日K（本地 `db query`）** |\n| 2 | 腾讯 `fqkline` | ⚠️ **2026-10-02 起开始返 501**（预热时可用、随后五种请求头组合全挂）→ 仅作备源 |\n| 3 | 新浪 `getKLineData` | **仅长历史回测**（4000 根，需跳变截断）|\n| 4 | 蛋卷 / guchacha MCP | 估值分位（同花顺 valuation 报错期间的替代）|\n| — | **东财** | ❌ **全线拒连**（`push2his`/`push2delay`/`clist` 均 `Remote end closed`）|\n| — | **问财** | ❌ **403**（现需登录态）|\n| — | 本地 `hexinhelper` 8701 | ❌ **403**（需客户端 token）|\n\n## 五之二、已接入雷达（2026-10-02）\n\n`trading/scan_watchlist.py` 新增两条能力：\n\n| 参数 | 作用 | 耗时 | 数据源 |\n|---|---|---|---|\n| `--new` | 全市场「新方向初现」（连续2日命中+位置<85%，境内/QDII 分层） | **0.7s**（读缓存） | 缓存由 `_radar_warm.py` 预热 |\n| **`--sentiment`** | **情绪面**：涨停/跌停/炸板池 + 连板分布 + 最高连板 + **涨停原因原文** + 档位→动作 | **5.1s** | **同花顺 CLI `special/*`** |\n| `--sentiment --date-ms <ms>` | 同上，可**回溯历史交易日** | 5.1s | 同上 |\n\n`trading/_radar_warm.py` **主源已换成同花顺**（`fund history`）：**293 只 / 8 并发 / 59 秒**，全部成功；备源腾讯（同花顺不可用时自动回退）。\n实测缓存：**中位 598 根，全池最大单日跳变 26.1%（仅 1 只超阈值，属创业板 20% 限制附近的边界样本）**。\n\n> 📌 **与腾讯源对比**：腾讯 800 根但为**未复权**语境下的前复权、同花顺 598 根；两者末值一致（`512480`=0.955、`510300`=4.432）。**同花顺的价值在于：官方口径、含 amount 成交额、且与 `special`/本地库同一套 thscode 体系，减少代码映射层。**\n\n## 五之三、雷达取数已全部切到同花顺（2026-10-02）\n\n**踩坑经过**（值得记）：把 `scan_watchlist.kline()` 主源由东财换成腾讯后，**腾讯随即开始返 501**（`Not Implemented`，五种请求头组合全挂）——与东财「全线拒连」同型，说明**外部爬虫源都在收紧**。最终改为：\n\n```\nkline() 主源 = 同花顺 CLI（指数 index history ／ ETF fund history）\n        备源 = 腾讯 fqkline\n        末位 = 新浪 getKLineData\n```\n\n**一处必踩的坑**：`fund history` 有 `--interval 1d`，但 **`index history` 没有** —— 照抄参数会报 `unknown option '--interval'` 并**静默失败**（我因此让三个指数全部取不到，排查了一轮）。已在代码里按 `cmd` 分支处理。\n\n**另一处**：指数窗口要给足——同花顺端侧约需 **≥120 天**才有数据，原 `kline(secid)` 默认 90 天会导致指数空返回。现指数取 **150 天**、观察池标的取 **180 天**。\n\n**实测结果**（2026-10-02 休市日跑）：三个指数全部取到，与同花顺直查**逐位一致** —— 上证 3842.19 / 沪深300 4357.62 / 创业板指 3135.277；`159583` 收 1.566、量比 0.73、位置 34%；R1 超额 −5.52pp 也能算出。整轮 `_radar_check.py` **12.9 秒**。\n\n> **顺带修了两个既有 bug**（非本轮引入）：① `_radar_check.py` 在指数取数失败时直接取 `v[\"close\"]` → `KeyError` 崩整轮（东财拒连时必现），已加容错降级；② 同型问题在结果循环里 `x[\"c1\"]` 也会崩，一并容错。\n\n## 五之四、雷达 prompt 已更新（2026-10-02）\n\n`64181ef3`（ETF主线雷达·盘后16:00）prompt **4,311 → 7,201 字**，回读一致。新增：\n\n| 内容 | 说明 |\n|---|---|\n| **B. 全市场「新方向初现」** | `_radar_warm.py` 预热（60s）→ `scan_watchlist.py --new --json`（0.7s）；**境内/QDII 分层**，QDII 不占名额、**不自动收进观察池** |\n| **C. 情绪面** | `--sentiment --json`（5s）：档位→动作 + 连板分布 + 最高连板 + **涨停原因原文（禁止主观归纳）**；三池全 0 判「无数据」不判「中性」 |\n| **drop 语义改向** | 由「🗑 建议下沉」改为「**⚠️ 深跌区（非出池理由）**」，文案「等 ① 放量收阳企稳」；`_radar_check.py` 同步 |\n| **推送条件三选一** | ① 池内 focus ② **境内**新方向 ③ 情绪 ∈ {极冷, 过热}；**一天最多推 1 条**（多条成立则合并摘要） |\n| **摘要格式扩充** | 加「情绪」行、「A股新方向」行、QDII 行（仅同时有 focus 时出现） |\n\n备份：`trading/rule_sync_backup_20261002-radar/`（`radar_live_before.md` 改前全文 + `radar_NEW.md` 已生效版）。\n\n## 六、相关\n\n- 取数规矩：行情数据源可用性 · 判据验证：主线雷达判据验证 · 回测证据：路线B大样本回测\n- 备选数据源：同花顺 vs 通达信 MCP（`tdx-*`，仅 WorkBuddy 侧可用）——见工作区 `AI上手手册.md` 的映射表\n- 备份/记录：`F:\\知识库\\.workbuddy\\backup\\` · 工作区 `hx/`（本次实测样本）",

   "body": "# 报告预判对账\n\n> 一句话：三份日报每天做 **6 处方向预判**，但**此前从无任何一处回验**。本文定义对账机制、判定规则，并留下**历史回补**作为基线。\n>\n> 配套：规格已写入工作区 `AI上手手册.md` §7.1 步骤 **6c**（收盘报告新增「预判对账」节）与 §7 顶部「**触发语义**」补充。**最终权威 = 收盘自动化 prompt**。\n\n## 一、为什么要有它（缺口）\n\n| 现有留痕机制 | 记的是什么 | 是否覆盖 AI 预判 |\n|---|---|---|\n| 判断台账 | **用户本人**说过的判断 + 逐条对账 | ❌ 只记用户，不记 AI |\n| 收盘报告「今日纪律小结」 | **纪律动作**（如 159995 破线清仓） | ❌ 记动作，不记预判 |\n| 建仓日志 | 建仓/离场的逻辑线 | ❌ 与预判无关 |\n| **AI 预判准确率** | — | **❌ 此前 0 条记录** |\n\n**代价**：预判会逐日累积成「看着专业但没人验证」的文字。这与 v1.16 那次栽的跟头同型——**依据不留痕 → 无法统计 → 回到拍脑袋**。用户当初加「每日涨跌预判」这个设计，本意是辅助决策；**不闭环则无法知道它是否真有辅助作用**。\n\n## 二、对账机制（每次 3 行）\n\n| # | 对账对象 | 说明 |\n|---|---|---|\n| ① | **上一交易日「盘前」的大盘当日预判** | 该预判最完整（含依据与关键位） |\n| ② | **今日「午盘」的大盘下午预判** | 午盘报告含 |\n| ③ | **涉及持仓的预判** | 上一交易日盘前或今日午盘若对持仓有方向预判，各列一行；无则写「无」 |\n\n**输出位置**：收盘报告 `ETF收盘复盘_<date>.html` 新增一节，约 4~6 行，**不展开成分析段落**。\n\n## 三、判定规则（机械，对齐「触发语义」）\n\n三份报告的预判**必须带触发语义**（2026-10-01 起，`AI上手手册` §7 顶部）：\n\n```\n方向：<看涨 | 看跌 | 震荡>\n触发语义：站上 <价A> 视为偏强 / 跌破 <价B> 视为偏弱 / 两者之间为区间\n```\n\n| 情况 | 判定 |\n|---|---|\n| 预判为**有触发语义的方向**（看涨/看跌 + 价A/价B） | 收盘价实际触发该方向 → **命中**；触发反向 → **偏差**；两者都未触发（落在区间内）→ **中性（未触发）** |\n| 预判为**「震荡」且给了区间** | 收盘落在区间内 → **命中**；越出上/下沿 → **偏差**（越上=低估强度 / 越下=高估强度） |\n| 预判为**「震荡」但未给区间** | 记 **「不可对账」** + 备注「缺区间，下次须给」——**强制提醒，不粉饰为命中** |\n| 缺预判来源（前一日盘前缺失/脚本失败） | 记「无预判可对账」 |\n\n> 🚨 **唯一红线：不得为了好看的准确率而放宽判定。** 准确率难看是**有价值的信号**（累积 1~2 个月即可回答「AI 在什么行情下系统性偏乐观」）；粉饰则整个机制失去意义（对齐 概率思维「单次对错 ≠ 系统正确」、交易认知偏差「结果偏好」）。\n\n## 四、历史回补（2026-09-07 ~ 09-30 · 19 个交易日）\n\n> **回补方法**：从 `daily_reports/` 历史报告提取预判原文；「实际」用腾讯指数日K（`sh000001`）收盘值，**已与报告内嵌数值交叉验证一致**（如 09-15 报告写 3864.28，K线取 3864.28）。\n> ⚠️ **回补的判定是近似的**——因为**当时的预判大多没给触发语义或区间**，无法机械判定。下表「判定」列凡标「**不可对账**」者，即属此列。**这正是加「触发语义」的原因。**\n\n| 交易日 | 预判来源 | 方向 | 实际收盘（上证） | 判定 |\n|---|---|---|---|---|\n| 09-07 | 午盘 09-07 | 震荡（结构分化，上下两难） | 3932.70 **−0.09%** | ✅ 命中（真震荡） |\n| 09-08 | 午盘 09-08 | （缺） | 3940.55 +0.20% | — 无预判可对账 |\n| 09-09 | 午盘 09-09 | 震荡（偏谨慎） | 3951.51 +0.28% | ✅ 命中 |\n| 09-10 | 午盘 09-10 | 震荡偏弱 | 3934.40 **−0.43%** | ⚠️ 方向偏弱但跌幅大于「震荡」 |\n| 09-11 | 午盘 09-11 | **看跌**（弱势震荡） | 3888.11 **−1.51%** | ✅ 命中（强） |\n| 09-14 | 盘前 09-11 + 午盘 09-14 | 看跌（偏弱）／震荡（偏弱平衡 3870~3920） | 3885.33 −0.07% | ⚠️ 方向错（跌了但幅度远小于「看跌」）；午盘区间**命中** |\n| 09-15 | 盘前 09-14 + 午盘 09-15 | 看跌/震荡偏弱／震荡偏弱 | 3864.28 **−0.54%** | ✅ 命中（两处） |\n| 09-16 | 盘前 09-15 + 午盘 09-16 | 震荡偏弱（看跌概率略大）／**震荡偏强**（3865~3910） | 3891.60 **+0.71%** | ❌ **盘前偏差**（判跌实涨）／✅ 午盘命中（区间内） |\n| 09-17 | 盘前 09-16 + 午盘 09-17 | 震荡偏弱／震荡偏弱（3860~3900） | 3875.60 −0.41% | ✅ 命中（两处） |\n| 09-18 | 盘前 09-17 + 午盘 09-18 | 震荡（偏弱概率略高）／**看涨（偏强上攻）** | 3911.87 **+0.94%** | ❌ 盘前低估（判震荡实涨近 1%）／✅ 午盘命中 |\n| 09-21 | 午盘 09-21 | 震荡偏强（倾向看涨） | 3949.91 **+0.97%** | ✅ 命中 |\n| 09-22 | 午盘 09-22 | 偏多 | 3952.13 +0.06% | ✅ 命中（但幅度极小，「偏多」偏强） |\n| 09-23 | 盘前 09-22 + 午盘 09-23 | **看涨（震荡偏强）**／震荡偏弱（3920~3950） | 3936.52 **−0.40%** | ❌ **盘前偏差**（判涨实跌）／✅ 午盘命中 |\n| 09-24 | 盘前 09-23 + 午盘 09-24 | 震荡偏强（谨慎看涨）／**看跌**（3890~3925） | 3888.37 **−1.70%** | ❌ **盘前偏差**／✅ 午盘命中（且低估幅度） |\n| 09-28 | 盘前 09-24 + 午盘 09-28 | 震荡（偏弱略高）／下午偏弱，「收在 **3820 下方**概率偏高」 | 3823.62 **−1.66%** | ✅ 盘前命中／❌ **午盘偏差（唯一可机械判定的一次）** |\n\n**统计（可机械判定的口径）**：\n\n| 口径 | 命中 | 偏差 | 不可对账 |\n|---|---:|---:|---:|\n| 盘前大盘预判（7 次有值） | 2 | **3** | 2 |\n| 午盘大盘预判（13 次有值） | 10 | 1 | 2 |\n\n### 🔑 回补暴露的**最重要一条**\n\n**19 个交易日、13 次午盘预判里，只有 1 次是可机械判定的**——就是 09-28 午盘那句「**收在 3820 下方概率偏高**」，而实际收 **3823.62（在 3820 上方）→ 偏差**。\n\n**其余 12 次全是「震荡/偏弱/偏强/看跌」这类定性词**：事后总能解释成\"大致对\"。**没有触发语义，对账就退化成叙事**——这条观察本身就是加「触发语义」的最强论据。\n\n> 顺带一个可复用的观察：**盘前预判的 3 次偏差全部是「判弱实强」**（09-16 / 09-18 / 09-24 中的 09-23 判强实弱除外，故为 2 次判弱实强 + 1 次判强实弱）。样本太小不能定论，但**这是对账表累积 1~2 个月后最该盯的模式**。\n\n## 五、本轮全部改动清单（5 项，2026-10-01）\n\n规格全部落在工作区 `AI上手手册.md`（**报告规格权威文档**）。**均不改交易规则。**\n\n| # | 改动 | 落点 | 类型 |\n|---|---|---|---|\n| **1** | 收盘报告新增「**预判对账**」节 | §7.1 步骤 **6c** | 🔴 信息增量（补最大缺口） |\n| **2** | 盘前报告新增「**距③线速查**」 | §7.0 步骤 **7b** | 🔴 信息增量（接 v1.17） |\n| **3** | **情绪「档位→动作」映射**（极冷/偏冷/中性/偏热/过热 五档各配动作；只管情绪维度、不替代 3A.1 闸门、两者取更严） | §7.0 步骤 **6b** | 🟠 可执行性 |\n| **4** | **预判「结论先行」**（每处预判先给一行 `<指数>｜方向｜一句依据≤40字｜关键位`，再展开依据） | §7.0 步骤 **9/10** | 🟠 可读性 |\n| **5** | **数据纪律补两条**：(a) **均线口径统一表**（盘前=昨收 / 午盘=盘中实时 / 收盘=当日收盘，各自标注；禁止沿用旧口径却不改标注）(b) **数值精度统一表**（止损/触发价/进场价 5 位有效小数；均线/点位 2 位；涨跌幅 2 位；成交额整数亿；距线 2 位带符号） | §3.2 | 🟡 消除歧义 |\n\n**改动 5 修的具体问题**（均在评审中实测发现）：\n- 09-28 午盘报告写「关键均线位置（**截至 09-24 收盘口径**）」→ 口径错标，**距均线百分比与支撑压力位会全部失真**\n- 收盘报告写 `止损线 1.0973`、盘前写 `1.09725` → **同一数值不一致**，用户核对时会犹豫\n\n**未做（评审中列为「不建议直接改」）**：三份报告间的 4 组重复（外围 / 成交额 / 情绪 / 消息面）。**重复保证了三个决策时点都看得到关键信息，直接删会伤可用性**。可选的低风险做法是：午盘/收盘的**外围美股段**（08:30→11:35 数据不会变）压缩为「是否有变化」一句话，把篇幅让给盘中变化的部分（如 09-28 午盘那条「恒生逆势 +0.66% 说明外资态度」就很有价值）。\n\n## 六、待办\n\n- [x] **三条自动化 prompt 已改完并生效（2026-10-01 23:00）** —— 从 `workbuddy.db` 的 `automations` 表取现网全文 → 应用全部补丁 → 校验 → 写回。\n      **盘前 11,782→14,637 字 · 午盘 13,551→15,648 字 · 收盘 16,541→19,609 字**，写后回读一致。\n      ⚠️ 关键教训：工作区 `automation_prompt_backup_*.md` **全是「改动前」快照**（最新一份只含 v1.16 **改动片段**），**照备份重写全文会回退 prompt**——故改为「读现网库 → 打补丁 → 写回」并逐处校验命中数。\n      **首次验证时点：2026-10-08（周四，国庆休市 10-01~10-07 后首个交易日）。** 验收看：收盘报告是否出现「预判对账」节 + 盘前是否出现【距③线速查】表 + 6 处预判是否都带触发语义。\n      备份：`trading/rule_sync_backup_20261001_v117/live_prompts_before/`（改前全文 + sha1）· 同目录 `*_NEW.md`（已生效新版）· `prompt_patch_20261001.md`（补丁规格留档，已标记「已执行」）。\n- [ ] 对账累积 1~2 个月后，统计「AI 在什么行情下系统性偏乐观/偏保守」，据此调整预判措辞的置信度\n- [ ] 若发现某类预判（如隔夜美股映射）长期无效，考虑**从报告中删掉该类预判**而不是继续生成\n\n## 六之二、主线雷达判据验证（2026-10-02）\n\n另案验证了主线雷达的三条件判据，结论见 主线雷达判据验证。要点：**focus 有真实边缘**（20 日超额 +0.99pp、观察池 +1.80pp）；**C3 创新高是最强单条件**（软化为「位置<70%」反而抹平边缘）；**drop 判据方向存疑**（命中后 20 日 +1.00%、超额 +0.82pp → 已改为「深跌区（非出池理由）」）；**扫描范围只覆盖全市场命中事件的 2.1%**。\n\n## 七、相关\n\n- 规格：`AI上手手册.md` §3.2（数据纪律）· §7 顶部（触发语义）· §7.0 步骤 6b/7b/9/10 · §7.1 步骤 6c\n- 留痕机制对照：判断台账（记用户判断）· 建仓日志（记建仓逻辑线）· 周复盘模板（记纪律执行率）\n- 心态：概率思维 · 交易认知偏差（结果偏好 / 后见之明）· 后见之明与结果偏见 · 钟摆与周期（情绪读数＝位置不是预测）\n- 报告与规则：ETF交易系统 v1.17 · ETF复盘主页 · v1.17修订草案 · 行情数据源可用性",

   "source": "07-复盘笔记/ETF/交易系统/行情数据源可用性.md",
   "body": "# 行情数据源可用性\n\n> 一句话：**做回测/取行情前先看这一页**——哪些源能用、各能取多长、哪些字段有坑。每条都是 2026-10-01 ~ **10-02** 实测所得，不是转述文档。\n>\n> ⚠️ **本页是「实测快照」**：数据源的可用性会变（限流、改接口、加鉴权）。**每次新做回测若发现与本文不符，回来更新本页并注明日期。**\n> 📌 **2026-10-02 格局变化**：东财全线拒连、腾讯开始返 501 → **首选取数源已换成同花顺 CLI**（价格/情绪面）＋**股叉叉 MCP**（估值/拥挤度/宏观），新浪降为长历史兜底。\n\n## 一、源清单与实测能力\n\n| 源 | 地址 | 能力 | 历史长度 | 复权 | 状态 |\n|---|---|---|---|---|---|\n| **同花顺 CLI** ⭐ | `hithink-finance`（npm `@hithink-tech/hithink-finance-cli`） | ETF 日线/指数/**情绪面 special\\***/财务/本地 DuckDB | 远端约 598 根；本地库 A 股个股 **10 年** | **前复权** | ✅ **2026-10-02 起列为首选取数源**；详见 同花顺金融数据CLI |\n| **新浪** `getKLineData` | `money.finance.sina.com.cn/quotes_service/api/json_v2.php/CN_MarketData.getKLineData` | 日K（OHLCV） | **510050 到 2010-04（4000 根上限）** | **不复权** | ⚠️ 已降为**长历史兜底**，且必须做跳变截断 |\n| **腾讯** `fqkline` | `web.ifzq.gtimg.cn/appstock/app/fqkline/get` | 日/周/月K | 日K **上限约 640 根（≈2.4 年）**；周K 200 根；月K 80 根 | **前复权** | ⚠️ **2026-10-02 起开始返 501**（`Not Implemented`，多种请求头组合全挂）→ 仅兜底 |\n| **东财** `push2his` | `push2his.eastmoney.com/api/qt/stock/kline/get` | 日K（含成交额） | 实测 510300 取到 **3488 根 / 2012-05 起** | 前复权（`fqt=1`） | ❌ **2026-10-02 全线拒连**（`Remote end closed`），加 Referer/Origin 无效 |\n| **东财** `clist` | `push2.eastmoney.com/api/qt/clist/get` | 全市场 ETF 清单、板块榜 | — | — | ❌ **同期亦拒连**；板块榜脚本已加同花顺/股叉叉回退 |\n| **股叉叉 MCP** | `https://guchacha.com/mcp` | 指数估值序列（含十年分位）、**行业拥挤度**、宏观与两融、个股全景、指数权重/前瞻PE | **沪深300 PE 周序列到 2005-04（1096 点）** | — | ✅ 需 token；11 个工具，见下 |\n| 蛋卷 `danjuanfunds` | `danjuanfunds.com/djapi/index_eva/detail/<code>` | 指数估值 | **仅当前快照**，无历史序列 | — | ⚠️ 回测不可用（只有当期值）|\n| ~~问财 / hexinhelper~~ | — | — | — | — | ❌ 问财 **403**（需登录态）；本地 `hexinhelper` 8701 **403**（需客户端 token）|\n\n## 二、⚠️ 已知数据坑（必读）\n\n### 坑1：新浪数据存在「单位跳变」——会静默污染回测\n\n**症状**：某一日之后价格整体换了一个量级，但日涨跌幅看起来只在跳变那天异常。\n\n**实测到的两例**：\n\n| 代码 | 跳变日 | 跳变幅度 | 真实情况 | 处置 |\n|---|---|---|---|---|\n| `510500` 中证500ETF | **2015-04-15** | 2.243 → 7.818（**+248.6%**） | 当日实际仅 +0.5% | **2015-04-15 之前的价格不可用** |\n| `510210` 上证指数ETF | **2021-01-25** | **−80.0%** | 非真实市场行为 | **2021-01-25 之前的价格不可用** |\n\n**为什么会致命**：A股 ETF 涨跌停 10%（双创 20%），所以 **|日涨跌| > 21% 必然是错数据**。如果不清洗：\n\n- **波动率被彻底污染**：中证500 的日波动算成 4.64%（年化 73.4%），清洗后是 1.72%（年化 27.2%）——**差 2.7 倍**\n- **回测买点被污染**：上一轮用它跑出的「中证500 年化 12.01%」是错的，清洗后为 **6.01%**\n\n**处置规矩**：\n```\n1. 每次取新浪数据后，先扫一遍 |日涨跌| > 21% 的点\n2. 有跳变 → **在最后一次跳变处截断**，只用其后的数据（不要逐点顶替，\n   那会把人工值当成真实价喂进策略）\n3. 在回测输出里**明确写出实际可用起点**，不要拿不同区间的标的直接比\n```\n\n**实测扫描结果（2026-10-01）**：\n\n| 代码 | 名称 | 跳变数 | 可用起点 |\n|---|---|---:|---|\n| `510300` | 沪深300ETF | 0 | 2012-05-28（全段可用）|\n| `159915` | 创业板ETF | 0 | 2011-12-09（全段可用）|\n| `510050` | 上证50ETF | 0 | 2010-04-15（全段可用）|\n| `159949` | 创业板50ETF | 0 | 2016-07-22（全段可用）|\n| `510500` | 中证500ETF | 1 | **2015-04-15** |\n| `510210` | 上证指数ETF | 1 | **2021-01-25** |\n\n### 坑2：新浪是**不复权**，腾讯才是前复权\n\n**实测标定**（同一日期新浪收盘 ÷ 腾讯前复权收盘）：\n\n```\n510300：2024-02-07 比值 0.9368  →  2026-09-30 比值 1.0000\n510210：全段比值 1.0000（该 ETF 期间无分红调整）\n```\n\n**含义**：新浪价是原始成交价，**不含分红再投**。做长期回测若直接用，会**系统性低估收益**（510300 期间差约 6.3%）。\n\n**处置规矩**：\n```\n方案 A（推荐）：用新浪的原价 + 显式「年化股息率」参数补偿，做敏感性分析\n                （如 0% / 2.5% 两档，结论写「真实值介于两者之间」）\n方案 B：用腾讯前复权（但只有 ~640 根 ≈ 2.4 年）\n方案 C：东财 fqt=1（复权且很长）——但该源当前被断连\n```\n\n> 定投加档速查 的 PE 分位**来自股叉叉**（2026-10-02 起；此前写 Wind，已废弃），价格只用于算收益，两者口径不冲突。\n\n### 坑3：腾讯 `fqkline` 请求根数过大会**返回 list 而非 dict**\n\n```\n请求 600 根 → 正常返回\n请求 3000 根 → 解析报 'list' object has no attribute 'get'\n```\n**处置**：日K 请求不要超过 640；要更长历史走新浪或东财。\n\n## 三、股叉叉 MCP 用法要点\n\n```\n地址：https://guchacha.com/mcp\n鉴权：Authorization: Bearer gcc_xxx\n协议：JSON-RPC 2.0 over HTTP（不是 SSE；tools/list 与 tools/call 均可用）\n限流：600 次/小时\n```\n- ⚠️ **token 不要写进知识库**——放工作区（`F:\\Ai\\workbuddy\\...\\trading\\.guchacha.json`）或环境变量 `GUCHACHA_TOKEN`。本库内**不得**出现 `gcc_` 开头的字符串。\n- ⚠️ **鉴权失败也返回 HTTP 200**，错误在 JSON-RPC body 里（`result.content[].text`）。**别用 HTTP 状态码判成功**。\n\n### 3.1 全部 11 个工具（2026-10-02 实测 tools/list）\n\n| 工具 | 给什么 | 已用于 |\n|---|---|---|\n| `get_index_valuation` | 18 个中外指数估值 + **各窗口历史分位**（since/10y/5y/3y/1y） | ✅ `fetch_valuation.py`（定投判档）|\n| `get_industry_crowding` | **申万一级 31 行业拥挤度**：成交占比/换手/动量/超配/综合，各带历史分位 | ✅ `fetch_hot_daily.py`（报告热门板块节）|\n| `get_market_series` | 中美日国债 2/5/10/30Y、汇率（usdcny/dxy…）、**两融余额与杠杆率**、商品（碳酸锂/茅台批价/生鲜乳…）、私募信贷 | ✅ `fetch_macro.py` |\n| `get_index_forward_pe` | 指数前瞻 PE 与前瞻股息率 + 预期盈利增速 | ⏳ 未接（候选第二判据）|\n| `get_index_weight` | 指数成分权重与贡献点数（**仅上证50/沪深300/科创50/创业板指**）| ⏳ 未接 |\n| `get_macro` | CPI/PPI/PMI/GDP/巴菲特指标/美国非农/韩国信用融资… | ⏳ 未接 |\n| `get_stock` | 个股全景（行情+PE/PB+股息率+DCF 买点+前瞻PE+行业+指数权重）| — |\n| `search_stocks` | 全市场约 5500 只筛选/排行（板块、PE/PB/市值区间）| — |\n| `get_dcf_report` | DCF 估值报告全文（A股 38 篇 + 美股 8 篇）| — |\n| `list_datasets` | 数据集目录与最后更新日期 | — |\n| `get_watchlist` | 用户在股叉叉的自选股 | — |\n\n### 3.2 本地取数脚本（工作区 `trading/`，2026-10-02 新建）\n\n| 脚本 | 作用 | 关键点 |\n|---|---|---|\n| `fetch_valuation.py` | 路线A 定投判档（PE 十年分位 → 档位 n → 本月金额）| 必须 `window=10y`；顶层 `pe_percentile` 是 **since** 分位，不是十年分位 |\n| `fetch_macro.py` | 两融余额/杠杆率、中美 10Y、汇率/美元指数、碳酸锂/茅台批价 | 各序列**单位与频率不同**，须按各自 `date`/`unit` 陈述 |\n| `fetch_hot_daily.py`（改造） | 热门板块；新增 `crowding_*` 字段 | 拥挤度**独立于**涨幅榜成败；`crowding_asof` 通常为 **T-1** |\n\n> 三者共用 `trading/.guchacha.json` 取 token；**脚本可用**（股叉叉是静态 Bearer token，不像通达信 MCP 那样把凭据加密存起来）→ **自动化里也能用**。\n\n### 3.3 与其他源的定位关系\n\n- **股叉叉 = 估值 / 拥挤度 / 宏观**（低频、非价格类）；**同花顺 CLI = 价格 / 情绪面 / 财务**（高频、可回溯）。\n- 两者**互补不替代**：股叉叉**不提供** ETF 日线（价格仍走同花顺 `fund history` → 腾讯 → 新浪）；同花顺 `valuation snapshot` 上游报错 `FUYAO_3001`，估值仍只能走股叉叉。\n\n**关键：`get_index_valuation` 的 `history` 参数**\n\n```python\n{\"index_code\": \"000300\", \"metric\": \"pe_ttm\", \"history\": True}\n# history 必须是布尔 True（传 \"true\" / 1 会被忽略，只返回当期快照）\n```\n\n返回 `history.series = [{\"date\": \"...\", \"value\": 15.51}, ...]`，**周频**（每周四）。\n\n| 指数 | metric | 点数 | 跨度 |\n|---|---|---:|---|\n| 000300 沪深300 | pe_ttm / pb | 1096 | 2005-04-07 起 |\n| 000905 中证500 | pe_ttm | 1009 | 2007-01-14 起 |\n| 399006 创业板指 | pe_ttm | 838 | 2010-05-31 起 |\n| 000016 上证50 | pe_ttm | 1159 | 2004-01-01 起 |\n| 1000004 上海A股 | pe_ttm | 394 | 1994-01-02 起（**季频，稀疏**）|\n\n> ⚠️ **服务里没有「上证综指 000001」的估值序列**（`get_index_valuation` 只覆盖 18 个指数，不含它）。510210 那一路只能用「上海A股」近似。\n\n### ⚠️ 用法坑：`pe_percentile` 是「以今天为终点」的分位，**回测不能用**\n\n```json\n\"percentile_windows\": {\"pe_ttm\": {\"1y\": 1.92, \"3y\": 59.74, \"5y\": 70.31, \"10y\": 60.16, \"since\": 50.18}}\n```\n这是**当前时点**对历史窗口的分位。回测时若直接用它，等于**用未来信息**（look-ahead bias）。\n\n**正确做法**：拿 `history.series` 的**原始 PE 序列自己算 point-in-time 分位**——每个时点只用该时点之前的数据、按十年窗口排名。\n\n**验证**：自算的沪深300 十年分位 **60.2%** vs 股叉叉 `10y` 窗口 **60.16%** —— 对得上，说明自算实现正确。\n\n## 四、路线B 数据源（日K + 成交额）\n\n- **标的池**：原用东财 `clist` 分页取全市场 ETF（实测 789 只）→ **东财已拒连**，现由 `trading/观察池/_radar_universe.json` 维护、`_radar_warm.py` 预热\n- **价格（现役）**：**同花顺 `fund history`**（前复权、无单位跳变、含 `amount` 成交额）→ 备源腾讯 → 末位新浪（仅长历史，须截断）\n- **注意**：③ 线的量能判定用「近 5 日均量 × 1.5」——**同花顺日线带成交额，是当前最合适的一档**；新浪 `volume` 够用但需截断、东财 `amount` 更精确但源已不可用\n\n## 五、相关\n\n- 规则真源：ETF交易系统 · 资料取数入口：ETF交易系统 §六\n- **同花顺 CLI 全貌**：同花顺金融数据CLI（104 命令、本地 DuckDB、情绪面、竞价）\n- 定投判档数据：定投加档速查（**2026-10-02 起股叉叉口径**）· 盈利收益率定投法\n- 数据源坑的实战后果：③线口径诊断（③线恒不成立那次的取证）",

   "oneliner": "把「盯着止损价」这件最累的事交给券商 App 免费做——但只开提醒、绝不开自动委托。  为什么这条红线不能破：[[ETF交易系统]] 3B.4 铁律「只用收盘价判、不盘中判」，闸门①「收盘 ≤ 成本×0.95 → 次日开盘清仓」。券商条件单的「自动委托」是盘中价触发即挂单，等于用盘中价替你执行纪律——第一天就和自己的系统打架。所以下面每一项，「自动委托」那个开关必须关掉，只保留「到价提醒」。",
   "source": "07-复盘笔记/ETF/交易系统/券商到价提醒模板.md",
   "body": "# 券商到价提醒模板\n\n> **一句话**：把「盯着止损价」这件最累的事交给券商 App 免费做——但**只开提醒、绝不开自动委托**。\n>\n> **为什么这条红线不能破**：ETF交易系统 3B.4 铁律「**只用收盘价判、不盘中判**」，闸门①「**收盘** ≤ 成本×0.95 → 次日开盘清仓」。券商条件单的「自动委托」是**盘中价触发即挂单**，等于用盘中价替你执行纪律——第一天就和自己的系统打架。所以下面每一项，**「自动委托」那个开关必须关掉，只保留「到价提醒」**。\n\n---\n\n## 一、三条止损线，哪些能托管给券商\n\n| 止损线 | 性质 | 能不能设到价提醒 | 谁来算 |\n|---|---|---|---|\n| ① 硬止损 = 该批成本 × 0.95 | **固定价**（建仓时算一次） | ✅ 能，设一次即可 | 建仓时写死 |\n| ② 移动止损 = max(成本×0.95, 期间最高×0.95) | **动态价**（最高价每天变） | ❌ 券商算不了 | 收盘后脚本/报告算 |\n| ③ 保本线 = 该批成本价 | **固定价**（浮盈曾达 +20% 后启用） | ✅ 能（此时价已固定） | 浮盈阶梯升档时算 |\n\n**结论**：券商只托管「固定价」的 ① 和 ③；动态的 ② 留给收盘复盘自动给（ETF交易系统 浮盈阶梯已在收盘报告里分档给止损位）。\n\n## 二、设置清单（照抄填）\n\n| # | 标的（代码） | 提醒价位 | 提醒内容 | 自动委托 |\n|---|---|---|---|---|\n| 1 | ＿＿＿＿ | ＿＿＿＿（= 该批成本×0.95） | 「已逼近硬止损，若收盘仍破则次日清仓」 | **关** |\n| 2 | ＿＿＿＿ | ＿＿＿＿（= 该批成本价，保本线） | 「已到保本线，浮盈阶梯升档」 | **关** |\n\n> 说明：路线A 宽基（510300/510210 等）**不设止损**，不用挂到价提醒；它的离场是估值/目标收益止盈，低频，不需要盘中提醒。\n\n## 三、当前状态（2026-09-11）\n\n- **B 线空仓** → 现在**没有可挂的止损价位**，本模板暂时空置。\n- 等按 主线雷达操作手册 命中 + 五步法走完 + 建了第一笔 B 仓，再回这里填「提醒价位」。\n- 提醒价位的来源 = 建仓日志 里的「止损价」栏（建仓时写死的 该批成本×0.95）。\n\n## 四、自查第一步（券商能力）\n\n你是**大同证券**（交割单文件头「营业部代号：大同电信委托」），**不在条件单第一梯队**（广发/华泰/银河/中信建投是标配）。开 App 搜这几个词，确认有没有、能不能只提醒不下单：\n\n- 「条件单」「到价提醒」「智能单」「预警」\n\n**如果大同 App 没有「只提醒」的选项**（只有自动委托），就**不要用它的条件单**——宁可不挂，也不能为图省事开自动委托。备选：换同花顺 App 下单（问财和云条件单同 App），但需先确认你的账户适配「同花顺云条件单」。\n\n---\n\n*配套：ETF交易系统（止损纪律唯一真源）· 建仓日志（止损价来源）· 主线雷达操作手册（进场侧，与离场侧对称）。*",

   "oneliner": "用法：每周末填一遍（建议周五收盘后或周六上午，30-40 分钟）。本周没有交易也照填——填\"无交易，纪律状态正常\"同样是有效产出。每次产出可另存为 `周复盘_<日期>.md` 归档。  目的：交易日的执行质量来自周末的复盘与计划，不是盘中盯出来的（见 [[ETF交易系统]] 第九节·非交易日工作流）。  配套：周五收盘后\"ETF 群\"会推送周末生产清单提醒（周复盘 / 消化学习 / 静态梳理 / 关闭仪式）。",

   "body": "# 周复盘模板\n\n> **用法**：每周末填一遍（建议周五收盘后或周六上午，30-40 分钟）。**本周没有交易也照填**——填\"无交易，纪律状态正常\"同样是有效产出。每次产出可另存为 `周复盘_<日期>.md` 归档。\n>\n> **目的**：交易日的执行质量来自周末的复盘与计划，不是盘中盯出来的（见 ETF交易系统 第九节·非交易日工作流）。\n>\n> **配套**：周五收盘后\"ETF 群\"会推送周末生产清单提醒（周复盘 / 消化学习 / 静态梳理 / 关闭仪式）。\n\n---\n\n## 一、本周纪律核对与执行率（对照 ETF交易系统 双路线）\n\n### 1.1 本周纪律核对（6 项）\n\n| # | 检查项 | 是否 | 备注 |\n|---|---|---|---|\n| 1 | 路线A：定投档位按计划执行，无因涨跌临时中断/追加 | ☐是 ☐否 | |\n| 2 | 路线B：每次进场前写下了价格线 + 逻辑线（并在 建仓日志 留痕） | ☐是 ☐否 | |\n| 3 | 路线B：破止损当日/次日开盘执行清仓，**未摊平** | ☐是 ☐否 | |\n| 4 | 没有盘中临时决策（规则写在买入前，触发只执行） | ☐是 ☐否 | |\n| 5 | 没有因消息面/单日大涨追高 | ☐是 ☐否 | |\n| 6 | 非交易日没有手痒研究/焦虑复盘（红线） | ☐是 ☐否 | |\n\n### 1.2 纪律执行率（本周核心 KPI）\n\n> **执行率 = 守纪律笔数 ÷ 本周总操作笔数。** 胜率是结果、**执行率才是唯一完全由你控制的指标**（投资相对主义）。数据源 = 建仓日志 的「按规则执行？」列。\n\n| 本周操作笔数 | 破纪律笔数 | **执行率** | 与上周比 |\n|---|---|---|---|\n| | | ＿＿% | ↑ / ↓ / — |\n\n### 1.3 破纪律逐笔归因（无则写\"无\"）\n\n| 日期 | 代码 | 破了哪条 | 当时的情绪/理由 | 对应 §七 哪个坑 |\n|---|---|---|---|---|\n| | | | | |\n\n> 任何一项为\"否\" → 对照 ETF交易系统 第七节\"已踩过的坑\"找对应错误，写进第三节。\n\n## 二、本周交易逐笔回看（无交易则写\"无\"）\n\n| 代码/名称 | 进场理由 | 出场理由 | 合纪律(√/×) | 情绪状态 |\n|---|---|---|---|---|\n| | | | | |\n\n## 三、情绪记录（这步最容易被跳过，也最值钱）\n\n- 本周最难受/最冲动的时刻：什么时候？当时想做什么？最后做了没有？\n- 事后看，如果那个冲动被执行了会怎样？它对应第七节哪个坑？\n- 本周对\"账户数字\"的注意力 vs 对\"研究/纪律\"的注意力，几比几？\n\n## 四、下周预案\n\n### 4.1 持仓价位（以周五收盘复盘\"明日计划\"为准更新）\n\n| 持仓 | 路线 | 现价 | 止损/纪律位 | 下周预案 |\n|---|---|---|---|---|\n| | | | | |\n\n### 4.2 观察池（只列逻辑与计划位，不追涨）\n\n| 板块 | 核心逻辑 | 计划进场位 | 触发条件（右侧确认） |\n|---|---|---|---|\n| | | | |\n\n### 4.3 路线A 定投计划\n\n- 下周定投档位/日期/金额：＿＿＿＿＿＿＿＿\n\n## 五、学习与知识卡\n\n- 本周消化的待消化笔记/书卡（一次一条）：＿＿＿＿＿＿\n- 新想法草稿（写成一段完整的话，交易日发复盘单聊 → 自动收录成知识卡）：＿＿＿＿＿＿\n\n---\n\n**本周一句话总结**（纪律执行 / 情绪 / 下周最该改的一点）：＿＿＿＿＿＿＿＿＿＿＿＿\n\n---\n\n*模板维护：改 ETF交易系统 纪律时同步检查本表检查项是否仍准确。*",

   "status": "未学",
   "oneliner": "把\"哪天做 × 做几天 × 几点买\"三件事配对好，比纠结盘中几分钟的高点重要得多。收益 = 年化 × 计息天数，成交瞬间锁定年化；计息按实际占款自然日（周末/假期都计）。  用途：空仓现金管理（配合 [[ETF交易系统]] 的\"现金管理\"一格）。本卡 2026-09-05 整理，2026 下半年窗口按交易所公告排定，到期需更新。",
   "source": "07-复盘笔记/ETF/交易系统/国债逆回购速查卡.md",
   "body": "# 国债逆回购速查卡\n\n> **一句话**：把\"哪天做 × 做几天 × 几点买\"三件事配对好，比纠结盘中几分钟的高点重要得多。**收益 = 年化 × 计息天数**，成交瞬间锁定年化；**计息按实际占款自然日**（周末/假期都计）。\n>\n> 用途：空仓现金管理（配合 ETF交易系统 的\"现金管理\"一格）。本卡 2026-09-05 整理，2026 下半年窗口按交易所公告排定，到期需更新。\n\n---\n\n## 〇、规则底线（记不住别的也要记住这 3 条）\n\n1. **方向是\"卖出\"**（你是借出方），不是买入，点错会废单；\n2. **周五别做 1 天期**——周末不计息，只算 1 天，白借；\n3. **长假前在\"倒数第 2 个交易日\"做 1 天期**——才吃满假期；最后一天做，假期无息。\n\n---\n\n## 一、品种速查（沪深门槛已统一：1000 元起、0.005 档位、利率趋同 → 谁年化高点谁）\n\n| 期限 | 沪市 204 | 深市 1318 | 什么时候用 |\n|---|---|---|---|\n| 1 天 | GC001 | R-001 | **日常过夜首选**（九成情况） |\n| 2/3/4 天 | GC002/003/004 | R-002/003/004 | 周末或短假前精准匹配 |\n| 7/14 天 | GC007/014 | R-007/014 | 一两周不用；长假前 |\n| 28 天+ | GC028… | — | 长期闲置不如货基，别碰 |\n\n---\n\n## 二、A 面 · 周几与日历（找\"高息日 × 多计息日\"的叠加点）\n\n| 时机 | 怎么做 | 计息 | 说明 |\n|---|---|---|---|\n| **每周四** | 做 **1 天期** | **3 天**（五六日） | 每周固定的福利窗口：起息于周五、周末计入占款；资金周五可用、下周一可取，不耽误 |\n| 周五 | 别做短期逆回购 | 1/2/3 天期都只约 1 天息 | **起息顺延到下周一，紧邻周末不计息**（名义 2–3 天也补不回）；想吃周末息只能周四做 1 天期；周五的闲钱若下周也不用，可做 7 天期锁下周 |\n| 月末/季末/年末 | 倒数第 1–2 个交易日做 1 天期 | 1–3 天但**年化冲高** | 银行考核资金最紧，年化 3%–8%，全年最肥 |\n| 长假前（国庆/春节/中秋） | **倒二交易日**做 1 天期 | 覆盖整个假期 | 国庆做 1 天期可吃 ≈8 天息，性价比之王 |\n| 平时普通日 | 1 天期 | 1 天 | 年化 1.5%–2.5%，平常心 |\n\n### 2026 下半年已排好的窗口（ETF 群会提前一晚提醒）\n\n| 窗口 | 操作日 | 提醒 |\n|---|---|---|\n| 中秋 | **9/23（三）** 做 1 天期（9/25-27 休市） | 9/22 晚 |\n| **国庆 + 9 月季末（全年最肥）** | **9/29（二）** 主窗口；9/30 当天年化冲高可补 | 9/28 晚 |\n| **年末 + 元旦** | **12/30（三）** 主窗口；12/31 当天可补（年化常全年最高） | 12/29 晚 |\n\n---\n\n## 三、B 面 · 日内几点买（\"双峰买入、跳水区离场\"）\n\n**普通交易日的日内利率形态**：两个峰 + 一个深谷后跳水。\n\n| 时段 | 利率水平 | 结论 |\n|---|---|---|\n| **9:30–10:00** | 日内峰值出现概率最高（回测 75%+ 交易日） | ✅ 优选①：开盘机构集中融资，够心理价就锁 |\n| 10:00–14:00 | 回落，午间常是全天低位 | ⚠️ 别在这段等着买 |\n| **14:00–14:45** | 第二波回升（约 40% 交易日超早盘高点） | ✅ 优选②：普通日最稳出手区间 |\n| 14:45–14:55 | 高位震荡尾声 | 🟡 仅月末/季末/节前可能脉冲冲高，转瞬即逝别赌 |\n| **14:55–15:00** | 散户扎堆出借 → 供给暴增 | ❌ 断崖跳水区，别拖到最后几分钟 |\n| **15:00–15:30** | 股票收盘后闲置资金全涌进 → 供过于求 | ❌ **全天最低区**，越晚越低（次日做不交易都一样，别以为可以晚买） |\n\n> **要点**：次日做不交易，放宽的是\"不必卡早盘 + 可以从容挑两窗口之一 + 专心选期限\"，**不是**\"可以拖到 15:00 后\"。\n>\n> **省心打法**：挂单派=14:00 前按心理年化挂两笔分批；定时派=设 14:20 闹钟看一眼，够高就卖、14:45 前收手。\n\n---\n\n## 四、实操与到账细节\n\n- **成交即锁定**：下单\"价格\"就是年化，成交后涨跌无关；**不支持提前赎回**，持有到期本息自动回款。\n- **计息口径**：以券商下单页「计息 N 天」标注为准。\n- **到账两拍**：到期日资金\"可用\"（可买 ETF / 可再续做）；**再下一个交易日**才\"可取\"（可转银行卡）。\n- **手续费**：1 天期约成交额 0.001%（10 万 ≈ 1 元），只收佣金、无印花税、**个人利息免税**。\n- **金额**：1000 元整数倍，方向选\"卖出\"，一般点市价/最优自动成交。\n\n---\n\n## 五、与 ETF 系统衔接（你的用法）\n\n- **收盘后顺手做**：A 股 15:00 收盘、逆回购到 15:30；收盘复盘（15:05）确认当日不加仓后，把空余资金做 1 天期，次日早盘自动可用、不耽误买 ETF；\n- **纪律配合**：路线B 清仓后/观望期的现金、定投档位间隙的钱，都适合放隔夜利息——补上\"弱势市场不急着花钱\"那一格；\n- **收益平常心**：小额一天几毛到几块，意义是**资金不闲置 + 养成收盘后打理现金的习惯**；大头在月末/季末/节前几个高息日，到点多放钱做 1 天期即可。\n\n---\n\n## 关联\n\n- 规则总纲：ETF交易系统（现金管理附录含 2026 下半年窗口）\n- 领域主页：ETF复盘主页\n- 操作节奏参考复盘报告：复盘笔记_2026-09-04（已删 2026-10-20）\n\n> 免责：本文为市场经验与规则整理，仅供学习参考；逆回购利率实时波动、无保证高点，不构成投资建议。",

   "title": "定投加档速查（路线A 该投多少：档位 × 金额 × 整数手）",

   "oneliner": "路线A 的\"加仓点位\"是估值点位，不是价格点位。每月定投日查一次 PE 十年分位 → 判档 → 套公式算金额 → 按整数手买入。跌多少不构成加仓理由。  定位：本卡是 [[ETF交易系统]] §二（路线A）的执行页，只回答\"当月该投多少\"。规则真源仍是 [[ETF交易系统]]（v1.17），本卡不覆盖真源。",
   "source": "07-复盘笔记/ETF/交易系统/定投加档速查.md",
   "body": "# 定投加档速查（路线A）\n\n> **一句话**：路线A 的\"加仓点位\"是**估值点位，不是价格点位**。每月定投日查一次 PE 十年分位 → 判档 → 套公式算金额 → 按整数手买入。**跌多少不构成加仓理由**。\n>\n> **定位**：本卡是 ETF交易系统 §二（路线A）的执行页，只回答\"当月该投多少\"。规则真源仍是 ETF交易系统（**v1.17**），本卡不覆盖真源。\n\n---\n\n## 〇、取数（2026-10-02 起改为脚本，一键出档位）\n\n```bash\ncd F:/Ai/workbuddy/2026-09-02-15-22-29\npython trading/fetch_valuation.py            # 人类可读表\npython trading/fetch_valuation.py --json     # 机器可读\n```\n\n- **数据源 = 股叉叉 MCP `get_index_valuation`（PE 十年分位）**；token 存工作区 `trading/.guchacha.json`，**不得写进知识库**。\n- 输出：`ETF | 标的 | PE(TTM) | 十年分位 | 档位 n | 本月金额`，并在 `--json` 下附 `note` 字段。\n- ⚠️ **必须用 `window=10y` 的十年分位**——股叉叉顶层 `pe_percentile` 是 **`since`（上市以来）** 分位，**不是十年分位**，两者可能差 10 个百分点（2026-09-29 实测：沪深300 `since` 50.18% vs `10y` 60.16%，**恰好跨过 70% 以外的判定档**）。\n- ⚠️ `510210` 对应指数**无官方估值序列**，脚本用「上海A股」近似，且该序列为**季频稀疏**（约 394 点/1994 年起）→ **分位精度低，须标注「近似口径」**。\n- 备选（脚本不可用时人工查）：中证指数官网 / 理杏仁 / 蛋卷。**Wind 已不可用**（MCP 连续多轮无响应），不要再作为首选。\n\n---\n\n## 一、四步执行流程（定投日走一遍，5 分钟）\n\n1. **查**：目标宽基指数 **PE(TTM) 近 10 年分位**（见 §〇，一键脚本）；\n2. **判**：对照 §二 档位表定 n（0 / 1 / 2，或\"偏贵不投\"）；\n3. **算**：`本月投入 = 基准金额 × (1 + 级差)^n`；\n4. **买**：场内 ETF 按 **100 份整数手**下单，不足一手的余额**结转下月**，不凑单、不追高。\n\n---\n\n## 二、档位表（判据：PE 十年分位）\n\n| n | 档位 | PE 十年分位 | 动作 | 倍数（级差 0.3） |\n|---|---|---|---|---|\n| **2** | 深度低估 | < 10% | 加倍投 | ×1.69 |\n| **1** | 低估一档 | 10% ~ 30% | 加档投 | ×1.30 |\n| **0** | 正常估值 | 30% ~ 70% | 投基准 | ×1.00 |\n| — | 偏贵 | > 70% | **只持不买**（不强制卖） | — |\n\n**三条硬约束**：\n- **n 封顶 2**——再往下加不是定投是赌方向，复利三来源 靠的是时间不是单次重仓；\n- **同一档位每月只加一次**，不因连续下跌重复跳档；\n- **只按估值分位判，不按单日/单周涨跌判**。\n\n> ⚠️ 档位边界（10% / 30% / 70%）是**本卡口径**——ETF交易系统 **v1.17** §二 仍只写了\"按估值档位加\"、未定义边界。见 §八 待办①。\n\n---\n\n## 三、金额表\n\n**倍数表**（不依赖你的基准，先存这张）：\n\n| n | 级差 0.2（保守） | **级差 0.3（推荐）** | 级差 0.5（激进） |\n|---|---|---|---|\n| 0 | ×1.00 | ×1.00 | ×1.00 |\n| 1 | ×1.20 | **×1.30** | ×1.50 |\n| 2 | ×1.44 | **×1.69** | ×2.25 |\n\n**实算（基准 500 元/月）**：\n\n| n | 级差 0.2 | **级差 0.3（推荐）** | 级差 0.5 |\n|---|---|---|---|\n| 0 | 500 | **500** | 500 |\n| 1 | 600 | **650** | 750 |\n| 2 | 720 | **845** | 1,125 |\n\n- **单月上限 ≤ 1,000 元（基准 ×2）**——不设上限，持续阴跌会把弹药打光，真底来了没子弹；\n- 若你实际的基准不是 500，**直接拿倍数表乘你的基准**即可，本表不必重写。\n\n**为什么推荐级差 0.3 而不是 0.5**：0.5 档在 n=2 时单月 1,125 元，已突破 1,000 元上限线；0.2 档加档力度太弱（n=2 仅 720 元），放大效果不明显。0.3 是唯一\"加档有感、又不破上限\"的取值。\n\n---\n\n## 四、基准金额为什么定 500（2026-09-28 推荐）\n\n| 参数 | 取值 | 说明 |\n|---|---|---|\n| 总资金 | **¥10,000** | 2026-09-18 用户提供 |\n| 路线B 计划资金 | ¥2,000 | 占 20%，**不占路线A 预算** |\n| 路线A 现有持仓 | ≈ ¥1,483 | 510300 300 份 ¥1,386.5 + 510210 100 份 ¥96.6（口径滞后，见 §八 待办③） |\n| 路线A 可用弹药 | **≈ ¥6,500** | 总资金 − 路线B 预留 − 现有持仓 |\n\n**推算**：\n- 基准 500/月 → 正常档 12 个月 = 6,000；即使中途 3 个月进 n=1（+150/月）、1 个月进 n=2（+345），全年 ≈ **6,795 元** → 刚好在弹药内，**留出 2 档加档空间**；\n- 基准 1,000/月 → 正常档一年就 12,000，**超弹药 85%**；真到深度低估时反而没钱投 → 放大器失效（定投收益放大器 反例明确警告此坑）；\n- 结论：**500/月 = 撑满 12 个月 + 留足加档档位 的最大安全基准**。\n\n> 🔧 若这个数不对（每月能投的不止 500，或弹药另有安排）→ **只改这一个数**，其余照倍数表走。\n\n---\n\n## 五、投哪只（2026-09-28 实测）\n\n| 标的 | 现价 | 成本单价 | 浮动 | PE(TTM) | **PE 十年分位** | 距 MA250 | **本月档位** |\n|---|---|---|---|---|---|---|---|\n| 510300 沪深300ETF | 4.422 | 4.6217 | −4.32% | 13.09 | **61.72%** | −6.97% | **n=0 → 投基准 500** |\n| 510210 上证指数ETF | 0.985 | 0.9660 | +1.97% | 15.44 | **75.32%** | −4.17% | **偏贵 → 只持不买** |\n\n> 数据：Wind，2026-09-28 10:53（盘中值，**定投日须按当日收盘口径复核**）。MA250 参考：沪深300 = 4673.60、上证综指 = 3991.13。\n>\n> **2026-10-02 复核（改为股叉叉，快照日 2026-09-29）**：510300 PE 13.179 / 十年分位 **60.16%** → **n=0**；510210 PE 16.146 / **77.69%** → **只持不买**；510050 上证50ETF PE 10.686 / 53.52% → n=0。**结论与 09-28 同档，未变**（差异来自数据源与快照日不同，非口径变化）。\n> 🔧 **2026-10-02 起取数统一改为 `python trading/fetch_valuation.py`**（见 §〇），Wind 口径不再使用。\n\n**结论（本月动作）**：\n1. **510300 → 投基准 500 元**：4.422 × 100 份 ≈ **442 元**，**余 58 元结转下月**；\n2. **510210 → 不投**：分位 75.32% 已进偏贵区，只持有、不再买入；\n3. **两只宽基成分高度重叠，不因\"想分散\"多投一只**——分散度不增，操作成本增加；510210 现有 100 份保留不动（路线A **不设止损**）；\n4. 510210 待其 PE 分位回落 < 70% 后，才重新纳入定投候选。\n\n---\n\n## 六、与路线B 的隔离红线\n\n- 路线A 加仓**只看估值分位**；路线B 走 −5% 硬止损 + 3A.6 加仓规则——**两套不同源，禁止互借**；\n- **禁止用\"越跌越买\"去补路线B 的仓**（路线B 破线即清、绝不摊平）；\n- 路线A 定投**不占用**路线B 的计划资金预算。\n\n---\n\n## 七、卖出端（不归本卡管）\n\n只在两种情况下动：① 估值进历史高分位 → 分批止盈；② 达目标收益率 → 分批兑现。\n\n**分批比例（v1.21 已入真源 §二 5）**：卖出 3 批 **30% / 30% / 40%**（PE 十年分位 ≥70% → 30%，≥80% → 30%，≥90% → 40% 清仓）；买回 3 批，以最后一次卖出价为基准回落 **10% / 20% / 30%** 各接 **30% / 30% / 40%**；估值分位先回落 50% 以下即启动第 1 批买回。\n\n→ 见 定投止盈三法；阈值争议见 §八 待办②。\n\n---\n\n## 八、待办与口径来源\n\n| # | 事项 | 状态 |\n|---|---|---|\n| ① | **档位边界**（10% / 30% / 70%）未被 ETF交易系统 §二 定义 | 本卡按通行口径暂定；**v1.17（2026-10-01）只落了修订①②，边界仍未入真源** → 待并入 v1.18（需走改规则五步） |\n| ② | 10Y 国债现 **1.6763%**（成书时代约 3.5%）→ 原版\"盈利收益率 > 10% 买 / < 6.4% 卖\"阈值是否按比例平移 | 两种口径结论相反 → **建议以 PE 分位为主判据**，回避该争议 |\n| ③ | 交割单最新成交 2026-09-18，滞后 7 个交易日 → 路线A 持仓金额为推算值 | 待补导最新交割单 |\n\n---\n\n## 相关\n\n规则真源：ETF交易系统 §二 ｜ 一页纸总览：ETF交易系统速查卡\n知识卡：盈利收益率定投法（何时能买）· 定投收益放大器（该买多少）· 智能定投（定期不定额） · 定投计划落纸面（写下来 = 不需要意志力的外部约束）· 定投止盈三法（卖出端）· 定投频率选择 · 分批投入存量资金 · 低估是一个区域\n\n---\n\n*本卡为个人交易系统执行页，非投资建议；所有阈值须由本人确认后并入规则真源。*",

   "body": "# 新赛道研究工作表\n\n> **用法**：路线B 想换赛道 / 看到新题材想开仓 / 周末静态梳理观察池时，照表填一次。配套方法：新赛道研究五步法（先读方法卡、再填这张表）；方法卡是\"知识\"，这张表是\"照着做\"。\n>\n> **纪律**：五步全过才谈\"买哪只\"；任何一步不过 = 先放观察池，不进场。**别在盘中填**（盘中是情绪接管时刻，研究放盘前/收盘后/周末）；**别用它给已亏损仓位找持有理由**（那是沉没成本在说话，先过 止损触发三问）。\n\n---\n\n## 赛道与缘由\n\n| 赛道/板块 | 研究日期 | 为什么现在看它（消息/涨势/他人提及） |\n|---|---|---|\n| | | |\n\n## 第一步 逻辑：需求从哪来（画不出需求链 = 题材炒作，停）\n\n| 问题 | 我的回答（找客观数据，不写\"我觉得\"） | 数据来源 |\n|---|---|---|\n| 需求从哪来？2~3 年景气能否讲清？ | | |\n| 渗透率现在多高、还有几倍空间？ | | |\n| 谁在真金白银买单？（政策补贴 / 企业资本开支 / 消费者） | | |\n\n**自检**：☐ 能画出一条完整需求链 → 过；☐ 画不出 → 题材炒作，到此为止。\n\n## 第二步 验证：龙头财报说了算（公司砸钱 = 真信号，媒体吹 = 噪音）\n\n| 龙头标的 | 营收增速 | 利润增速 | 是否在加速 | 扩产/回购实证 |\n|---|---|---|---|---|\n| | | | ☐ 加速 ☐ 未加速 | |\n\n**自检**：☐ 龙头真在加速 → 过；☐ 只有故事没有财报 → 停，别听媒体。\n\n## 第三步 位置：好赛道也要好价格（人人都说好的时候，预期已打进价格）\n\n| 问题 | 数据 |\n|---|---|\n| 板块/赛道已涨多少？（距 60 日高/低位置） | |\n| 估值在历史什么分位？ | |\n| 交易拥挤吗？（换手率 / 成交额 / 情绪热度） | |\n\n**自检**：☐ 中低位、不算拥挤 → 过；☐ 已大涨 / 人人都在说好 → 预期已打进价格，等回踩。\n\n## 第四步 右侧确认：等市场自己走出来（不接下跌中的飞刀）\n\n| 确认项 | 结果 |\n|---|---|\n| 大盘档位 ≥ 震荡企稳？（ETF交易系统 3A.1：上证+沪深300+创业板指 站回 MA20） | ☐ 过 ☐ 否（**档位③ 走「③弱势-相对强度豁免通道」，须 R1 近5日超额 ≥+5pp + R2 收盘站上 MA20 全过**） |\n| 板块指数站回 MA20 且放量？ | ☐ 过 ☐ 否 |\n| 有龙头创新高 / 最强分支走强？ | ☐ 过 ☐ 否 |\n\n**自检**：三项全过才谈进场；任一不过 = 放观察池等信号（止跌企稳三信号）。\n\n## 第五步 小仓试错：用试错成本验证研究\n\n- 计划买入价：＿＿＿＿（右侧确认后进，**不追单日大涨**）\n- 试探仓金额（总计划资金 1/5~1/4）：＿＿＿＿\n- 止损价（买入价 × 0.95，挂单前写死、盘中不改）：＿＿＿＿\n- **逻辑线**（当初为什么买，这条破了 → 逻辑止损直接走）：＿＿＿＿\n\n## 结论（勾一个）\n\n- ☐ **值得进**：五步全过 + 右侧确认齐 → 进观察池排优先级，等回踩 5 日线企稳或放量突破再议计划位\n- ☐ **观察**：逻辑在但位置偏高 / 确认不足 → 放观察池，写清触发条件，不预判不提前买\n- ☐ **放弃**：逻辑画不出 / 龙头证伪 / 位置太高 → 不进场，记录一句话理由备用\n\n一句话理由：＿＿＿＿＿＿＿＿＿＿＿＿\n\n---\n\n*填完提醒：本表只是研究工作产出，最终进场仍按 ETF交易系统 3A.3 三信号 + 3A.5 仓位规则执行；大盘弱势（3A.1 档位③）**默认不开新仓**，唯一例外是「③弱势-相对强度豁免通道」（R1 标的近5交易日涨幅 − 沪深300 同期 ≥ +5pp + R2 收盘站上 MA20，非盘中），放行后按**标准试探仓 1/5~1/4（400~500 元）**开仓、合计 ≤ 总资金 20%、最多 2 只。研究说得再漂亮，都要用真金白银的小仓试错验证（试探建仓与加码）。*",

   "body": "# 离场步骤模板（路线B 持仓每日收盘过一遍）\n\n> 一句话：**进场问值不值，离场只问破没破**——离场不判断、不预测，只对照闸门执行；触发哪道走哪道。\n> 使用时机：路线B 有持仓的每个交易日**收盘后**花 2 分钟过一遍；盘中遇急跌用 §三。路线A 宽基不适用本模板（A 不设止损）。\n\n## 一、持仓档案（从 进场准备模板 §六 / 建仓日志 抄，批次分开记）\n\n| 批次 | 代码 | 该批成本（FIFO） | 数量 | 买入逻辑线（一句） | 当前浮盈档 |\n|---|---|---|---|---|---|\n| 试探批 | | | | | □<15% □≥15% □曾达+20% |\n| 加仓批 | | | | | □<15% □≥15% □曾达+20% |\n\n**当前止损线怎么算（每天收盘重算一次，只上不下）**：\n\n| 浮盈档 | 止损线 |\n|---|---|\n| < 15% | 该批成本 × 0.95（不上移动止损） |\n| ≥ 15% | max(该批成本 × 0.95, 期间最高收盘 × 0.95) |\n| 曾达 +20% | max(该批成本价, 期间最高收盘 × 0.95)——保本线兜底（防跳空极端，正常由移动线先触发） |\n\n多批持仓 → 整仓一条线 = max(各批止损线)；**触发 = 全部清仓，不存在只清一批**。\n创新高判定用**收盘价**（盘中脉冲不抬线）；回撤 **8%**（v1.17，原 5%）同样用收盘价判。\n\n## 二、每日收盘四连检（按顺序，触发即停，第二天开盘执行）\n\n| # | 检查 | 判定 | 触发后动作 |\n|---|---|---|---|\n| 1 | **闸门① 价格线** | 收盘 ≤ 当前止损线？ | **次日开盘无条件全清**，不摊平、不判断、不再看 |\n| 2 | **闸门② 逻辑线** | 买入逻辑被证伪？（催化落空 / 板块逻辑坏 / 结构破坏） | 不看价格，直接走（等不到次日开盘） |\n| 3 | **闸门③ 移动止损** | 浮盈≥15% 且自最高收盘回撤 ≥5%？ | 次日开盘清仓锁利 |\n| 4 | **抬线**（未触发时做） | 收盘创新高？浮盈曾达 +20%？ | 按上表重算止损线，写进 §四 明日计划 |\n\n浮盈 ≥15% 的持仓同时开始盯 **趋势持股与卖出信号清单**（高潮型顶点 / 量能衰竭 / 跌破支撑）——**信号触发即锁利离场，不必等回撤 8%**。\n\n## 三、盘中急跌分诊（3B.3 止损触发三问，只分三类）\n\n| 盘中形态 | 性质 | 动作 |\n|---|---|---|\n| 放量急跌（≥2倍量）+ 逻辑动摇 | 逻辑止损嫌疑 | **直接走，不等收盘**；拿不准也走——止损错一次亏 5%，破纪律才是大亏 |\n| 缩量阴跌 / 震荡磨线 | 价格噪音 | 不动，等收盘判定 |\n| 插针急跌拉回 | 噪音 | 不动；连续多日插针逼近止损位 → 收盘后重估进场位质量 |\n\n## 四、明日动作（写死一句可执行的话，不写 = 没有规则）\n\n```\n日期：____　止损线（收盘重算后）：____\n明日动作：□ 持有不动（线=____）　□ 开盘清仓（触发闸门：①/②/③）\n关键价位：____（支撑/压力/卖出信号位）　观察信号：____\n```\n\n## 五、离场之后（3B.5，三条不许）\n\n1. **不在低位接回**——离场后想买回去 = 重新进场，走 止跌企稳三信号 全流程，没有捷径；\n2. **不复盘「要是没卖就好了」**——卖飞是止损税，复盘打决策质量不打盈亏；\n3. **当天不留恋**——清仓当笔，建仓日志 补卖出行，情绪记录进当日复盘，然后不再看这只（等下一份观察池/周复盘再说）。\n\n---\n\n**改系统数字须同步检查本表**（0.95 / 5% / 15% / 20% / 三闸门顺序）。真源：ETF交易系统 §三 3B；免责：模板为个人纪律执行工具，AI 内容仅供参考。",

   "source": "07-复盘笔记/ETF/交易系统/进场准备模板.md",
   "body": "# 进场准备模板（选好标的后 · 资金与规则篇）\n\n> **用法**：路线B 每次计划进场前填一遍（选好标的、三信号未齐时就可以先填，挂单等价格进带）。**没填完这页 = 没有进场资格**——它是 ETF交易系统 §三 3A 与 §四 的执行载体，填完归档或贴进 建仓日志 当笔。\n>\n> **目的**：进场质量的上游是准备质量。止损线、仓位、预案全部在买入前写死，盘中只执行不判断（见 3A.4 进场三问、3A.5 两行规则）。\n>\n> **原则**：本模板里所有数字都由公式决定，**没有一处是拍脑袋**——你唯一要做的判断是「支撑在哪」和「逻辑是什么」。\n\n---\n\n## 一、标的与逻辑线（买入前写死，写不出 = 不买）\n\n| 项 | 内容 |\n|---|---|\n| 代码 / 名称 | ＿＿＿＿＿＿ |\n| 一句话逻辑（为什么是它） | ＿＿＿＿＿＿＿＿＿＿＿＿＿＿ |\n| 赛道研究出处 | 新赛道研究五步法 第＿＿步结论 / 观察池第＿＿行 |\n| 路线 | ☐ A 宽基（本模板后半部分不适用，走定投纪律） ☐ B 题材 |\n\n## 二、大盘档位（3A.1 · 大盘过滤不过 = 全部作废）\n\n| 检查项 | 数值 | 判定 |\n|---|---|---|\n| 上证收盘 vs MA20 | ＿＿＿ | ☐ 上方 ☐ 下方 |\n| 大盘三档档位 | ＿＿＿ | 档位判定结论：＿＿＿ |\n\n> 收在 MA20 下方 → 本笔不开（试探仓也不开）。**唯一例外：3A.1「③弱势-相对强度豁免通道」（v1.16）**——同时满足 **R1**（标的近5交易日涨幅 − 沪深300 同期 ≥ +5pp）+ **R2**（收盘站上 MA20，非盘中）时，可按**标准试探仓 1/5~1/4（400~500 元）**开仓（合计 ≤ 总资金 20%、最多 2 只）；允许按 3A.6 补齐（等价判据：当日仍满足 R1 且收盘站上 MA5）；止损仍为该批成本×0.95；建仓日志档位栏写「③弱势-相对强度豁免仓」并记 R1 实测超额。\n\n## 三、支撑与进场带（3A.4 · 唯一需要你判断价格的地方）\n\n| 步骤 | 公式 | 数值 |\n|---|---|---|\n| ① 关键支撑 S（近20日低 / 平台低 / 前低） | 图上找 | S = ＿＿＿ |\n| ② 回踩进场带 | S × 1.03 ~ 1.04 | ＿＿＿ ~ ＿＿＿ |\n| ③ 计划进场价 E（限价挂在带内） | 带内自定 | E = ＿＿＿ |\n| ④ 止损线 | E × 0.95 | ＿＿＿ |\n| ⑤ 止损落点检查 | 止损 vs S | ☐ 舒服（支撑下方1~2%）☐ 骑支撑（<1%）☐ 悬空（3%+）☐ 插针区 |\n\n> ⑤ 不是「舒服」→ **不按现价进**：骑支撑/悬空 → 只在带内限价等回踩；插针区 → 本进场位作废，等右侧重新企稳。\n> 等不到回踩？错过成本 = 0，错过不等于亏损（止损触发三问 卖飞认知同理）。\n\n## 四、资金计算链（§四 · 从风险预算倒推，逐级填）\n\n| 层级 | 公式 | 金额（元） |\n|---|---|---|\n| ① 总资金 | 账户实际 | ＿＿＿ |\n| ② 单笔风险预算 | 总资金 × 1% | ＿＿＿ |\n| ③ **计划资金（计划位）** | 总资金 × 20%（= 1% ÷ 5%） | ＿＿＿ |\n| ④ **试探仓（本笔实际买入）** | 计划位 × 1/5 ~ 1/4 | ＿＿＿ |\n| ⑤ 加仓批（验证通过后才动） | 计划位 − 试探仓 | ＿＿＿ |\n\n> 记忆锚：**1% 是「允许亏的钱」不是买入金额**；试探仓是学费仓不是利润仓，验证期通常 3~5 个交易日（3A.5 / 3A.6）。\n\n## 五、仓位约束校验（§四 硬约束，逐项勾）\n\n- ☐ 同主线已有持仓 + 本笔合计 ≤ **总资金的 40%（＝2 个计划位；2026-09-18 v1.16 口径统一）**\n- ☐ 同主线持仓（含本笔）≤ 2 只\n- ☐ 本笔为浮亏持仓的补仓？ → **是 = 禁止，直接终止**（浮亏绝不加仓）\n- ☐ 本月已触发 6% 月度回撤红线？ → **是 = 本月不开新仓**\n\n## 六、买入瞬间两行规则（3A.5 · 下单同时写进 建仓日志）\n\n| 行 | 内容 |\n|---|---|\n| 价格线 | 该批成本 × 0.95 = ＿＿＿（触发 → 次日开盘无条件清仓，不摊平） |\n| 逻辑线 | 当初为什么买它：＿＿＿＿＿＿＿＿＿＿（逻辑坏 → 3B.3 三问归因） |\n\n## 七、预案（写好就不许盘中改）\n\n| 情形 | 预案 |\n|---|---|\n| 收盘 ≤ 价格线 | 次日开盘无条件清仓，不摊平、不问理由 |\n| 盘中放量急跌 + 逻辑动摇 | 可提前执行逻辑止损；缩量磨线 → 等收盘（止损触发三问 三情形表） |\n| 试探批浮盈 ≥3% 且收盘站上 MA5 且大盘未收 MA20 下 | 3A.6 加仓：**收盘确认 → 次日开盘后 9:30~9:45 限价补齐**（高开护栏：开盘 ≤ 昨收×1.02 直接买；>×1.02 挂 ≤昨收×1.01 等回落，全天不回落 → 放弃本次加仓，试探仓按原止损继续）；整仓止损上移至 **加仓批实际成交价 × 0.95**（两条批次线合并为整仓一条线，触发 = 全部清仓） |\n| 浮盈 ≥15% | 转 3B.4 浮盈阶梯：max(成本×0.95, 最高价×0.95)；曾达 +20% → 保本线 |\n| 止损后暴涨 | 卖飞是止损税（10 次约 3 次），重进须等 3B.5 三信号，不在低位接回 |\n\n---\n\n**进场三问终检**（三问全勾才允许下单）：\n\n☐ 进场点离下方支撑足够近（带内限价，非追高） 　☐ 止损落点舒服（支撑下方1~2%） 　☐ 能接受卖飞\n\n*模板维护：改 ETF交易系统 §三/§四 数字（1% / 5% / 20% / 1/4 / +3% / 40%）时同步检查本表公式。*",

   "body": "# 第1章 指数基金的魅力\n\n> 一句话：普通人最靠谱的理财方式，是指数基金。\n\n## 讲了什么\n\n用博格、巴菲特、美国家庭的例子说明：为什么指数基金适合绝大多数普通人。\n\n## 要点\n\n- **什么是指数**：选取有代表性的一组股票编制，描述市场整体价格水平（如上证50、沪深300）。\n- **指数基金**：被动跟踪指数买入一篮子股票，指数涨它就涨。\n- 1975 年全球第一只指数基金诞生；约翰·博格（先锋集团创始人）是\"指数基金之父\"。\n- 巴菲特推崇指数基金：主动基金经理长期跑不赢标普500（著名的\"10年赌约\"）。\n- 美国家庭普遍把指数基金作为基金资产配置的主力。\n\n## 核心结论\n\n- 主动投资想战胜市场很难，普通人选指数基金更省心、更靠谱。\n- 指数基金的优势：**费用低、分散风险、透明、被动跟踪不靠基金经理**。\n\n## 相关\n\n- 所属书卡：指数基金投资从入门到精通\n\n- 第2章 指数的介绍、第3章 指数基金入门知识",

   "source": "02-来源卡/指数基金投资从入门到精通/笔记/第2章 指数的介绍.md",
   "body": "# 第2章 指数的介绍\n\n> 一句话：买指数基金前，先看懂你买的是哪条指数、贵不贵。\n\n## 指数分类\n\n- **宽基指数**：覆盖多行业，如上证50、沪深300、中证500、创业板指。\n- **行业指数**：成份股同属一个行业，如医药、白酒、银行。\n- **主题指数**：围绕某主题，如环保、军工、人工智能。\n- **策略指数（Smart Beta）**：红利、低波、等权等。\n\n## 加权方式\n\n市值加权（主流）、等权重、基本面加权、波动率加权等。\n\n## 估值指标（判断贵不贵）\n\n- **市盈率 PE** = 股价/盈利：越低越便宜。\n- **市净率 PB** = 股价/净资产：周期性行业（券商、能源）用这个。\n- **股息率**：分红回报。\n- 看「历史估值分位」：当前估值在历史什么位置，低位买、高位卖。\n\n## 常见宽基指数\n\n- **上证50**：沪市最大的 50 只（大盘蓝筹）。\n- **沪深300**：沪深最大的 300 只（大盘）。\n- **中证500**：中盘 500 只（中小盘，波动大、适合定投）。\n- **创业板指**：成长型科技股。\n\n## 相关\n\n- 所属书卡：指数基金投资从入门到精通\n\n- 第3章 指数基金入门知识、第9章 指数基金投资策略",

   "source": "02-来源卡/指数基金投资从入门到精通/笔记/第3章 指数基金入门知识.md",
   "body": "# 第3章 指数基金入门知识\n\n> 一句话：搞懂场内/场外、A/C 份额、α 与 β，以及判断贵不贵的博格公式。\n\n## 场内 vs 场外\n\n- **场内**：交易所上市交易（如 ETF），像股票一样实时买卖，费用低。\n- **场外**：通过基金公司/平台申赎，按净值结算，可定投、门槛低。\n\n## 三种类型\n\n- **ETF**：交易所上市，可场内交易、可申赎。\n- **LOF**：既能场内交易又能场外申赎。\n- **普通指数基金 / 联接基金**：以场外为主。\n\n## 名称里的 A / B / C\n\n- A 类：收申购费，适合长期持有。\n- C 类：不收申购费、收销售服务费，适合短期持有。\n- 长期选 A，短期选 C。\n\n## α 与 β\n\n- **β（贝塔）**：跟随市场的收益（指数涨你也涨）。\n- **α（阿尔法）**：超越市场的超额收益（主动基金才追求）。\n- 指数基金赚的是 β，主动基金搏的是 α（但大多搏不到）。\n\n## 博格公式（判断指数贵不贵）\n\n**长期年复合收益率 ≈ 期初股息率 + 市盈率变化率 + 盈利增长率**\n\n- 股息率、盈利增长是\"真回报\"；市盈率变化是\"投机回报\"（可正可负）。\n- 周期性行业用改进版：**≈ 市净率变化率 + 净资产增长率**。\n- 用法：股息率高 + 市盈率大概率向上 + 盈利大概率增长 → 值得买。\n\n## 相关\n\n- 所属书卡：指数基金投资从入门到精通\n\n- 第2章 指数的介绍、第4章 指数基金技巧",

   "source": "02-来源卡/指数基金投资从入门到精通/笔记/第4章 指数基金技巧.md",
   "body": "# 第4章 指数基金技巧\n\n> 一句话：选基要看费用、跟踪误差，别被\"高大上\"的名头忽悠。\n\n## 关键要点\n\n- **跟踪误差**：指数基金跟指数之间的偏差，越小越好。\n- **费用**：申购费、赎回费、管理费、托管费，长期累积差异巨大，优先选低费率的。\n- **选基小技巧**：关注打新收益、基金规模（别低于 5000 万，1 亿以上更稳）。\n\n## 其他玩法（了解即可）\n\n- **LOF 套利**：场内价格与场外净值出现价差时低买高卖。\n- **日历效应**：A 股有\"春节效应\"\"年末效应\"等规律，可作参考、不宜依赖。\n\n## 相关\n\n- 所属书卡：指数基金投资从入门到精通\n\n- 第3章 指数基金入门知识、第5章 ETF基金",

   "source": "02-来源卡/指数基金投资从入门到精通/笔记/第5章 ETF基金.md",
   "body": "# 第5章 ETF基金\n\n> 一句话：ETF 是\"像股票一样买卖的指数基金\"，是散户最方便的指数工具。\n\n## 什么是 ETF\n\n交易型开放式指数基金，兼具股票（可实时交易）、开放式基金（可申赎）的优点。\n\n## 交易机制\n\n- **一级市场**：用一篮子股票申购/赎回（机构为主）。\n- **二级市场**：像股票一样在券商账户买卖（散户主要用这个）。\n- 有套利机制，价格一般紧跟净值。\n\n## 常见投资策略\n\n定投 ETF、波段操作、套利、网格、底仓+波段、杠杆 ETF 等。\n\n## 提醒\n\n杠杆 ETF 有损耗和风险，不适合长期持有，新手慎碰。\n\n## 相关\n\n- 所属书卡：指数基金投资从入门到精通\n\n- 第4章 指数基金技巧、第7章 基金定投入门、第9章 指数基金投资策略",

   "source": "02-来源卡/指数基金投资从入门到精通/笔记/第6章 分级基金.md",
   "body": "# 第6章 分级基金\n\n> 一句话：分级基金是带杠杆的结构化基金，已退出 A 股，了解即可。\n\n## 结构\n\n- 母基金拆成 **A 份额**（约定收益、低风险）和 **B 份额**（杠杆、高风险）。\n- A 拿固定收益，B 拿剩余收益（放大涨跌）。\n\n## 关键概念\n\n- **折算**：定期/不定期把净值归一，调整份额。\n- **套利**：母基金与 A+B 之间的价差。\n\n## ⚠️ 重要提醒\n\n分级基金已于 2020 年前后陆续清盘/转型退出，**现在已无法投资**。本章作为历史知识了解即可，无需实操。\n\n## 相关\n\n- 所属书卡：指数基金投资从入门到精通\n\n- 第5章 ETF基金",

   "source": "02-来源卡/指数基金投资从入门到精通/笔记/第7章 基金定投入门.md",
   "body": "# 第7章 基金定投入门\n\n> 一句话：定投指数基金，靠\"微笑曲线\"越跌越买、摊低成本，是普通人的最佳姿势。\n\n## 微笑曲线（核心）\n\n- 定投在下跌中买入更多份额（摊低成本），涨回来就赚。\n- 下跌不是坏事，是\"捡便宜\"的机会。\n- A 股 2001 年以来出现过 5 次微笑曲线，定投收益率几乎都跑赢一次性买入。\n\n## 为什么定投指数基金\n\n- 不择时、纪律化，适合上班族和月光族强制储蓄。\n- 选波动大的指数（如中证500）定投效果更好。\n\n## 实操\n\n- **定投金额**：用闲钱，一般不超过\"（月收入－月支出）的一半\"。\n- **频率**：周定投 vs 月定投，长期差异不大，选顺手的。\n- **亏损怎么办**：越跌越坚持，低位多买，别停。\n\n## 相关\n\n- 所属书卡：指数基金投资从入门到精通\n\n- 第8章 基金定投高级、第9章 指数基金投资策略",

   "source": "02-来源卡/指数基金投资从入门到精通/笔记/第8章 基金定投高级.md",
   "body": "# 第8章 基金定投高级\n\n> 一句话：定投\"会买\"只是第一步，\"会卖\"（止盈）才真正落袋为安。\n\n## 止盈（怎么卖）\n\n- **目标收益率止盈**：到设定的收益率（如 20% / 30%）就卖。\n- **估值止盈**：指数估值到历史高位时卖。\n- **分批止盈**：涨一点卖一点，落袋为安。\n\n## 其他进阶\n\n- **智能定投**：跌多买多、涨多买少的升级版定投。\n- **止盈后再投**：赎回的钱重新开始下一轮定投（复利）。\n- **组合定投**：多只指数（大盘 + 中小盘 + 行业）搭配，分散风险。\n\n## 相关\n\n- 所属书卡：指数基金投资从入门到精通\n\n- 第7章 基金定投入门、第9章 指数基金投资策略",

   "oneliner": "不同市场用不同策略——牛市满仓、震荡分批/网格、熊市金字塔越跌越买。",
   "source": "02-来源卡/指数基金投资从入门到精通/笔记/第9章 指数基金投资策略.md",
   "body": "# 第9章 指数基金投资策略\n\n> 一句话：不同市场用不同策略——牛市满仓、震荡分批/网格、熊市金字塔越跌越买。\n\n## 三种买入方式\n\n- **满仓**：一次全买，适合单边牛市，但择时难、风险大。\n- **分批**：先买一部分，跌了再补，适合震荡市。\n- **定投**：定期定额，适合长期。\n\n## 金字塔法（熊市越跌越买）\n\n- 资金分 4 份：10% / 20% / 30% / 40%，跌得越多补得越多。\n- 加仓触发幅度看估值：高位每跌 15-20%、中位 8-15%、低位 5-8%。\n\n## 分批买入\n\n- 先买 30%，每跌 15% 补 30%，再跌补 40%。\n\n## 网格交易（震荡市波段）\n\n- 设定价格区间和网格，每跌一格买一份、每涨一格卖一份。\n- 三步：定网格计划 → 下跌买入 → 上涨卖出。\n- 选 ETF（不是个股）、低估值、波动大的品种；留底仓防踏空。\n\n## 卖出\n\n估值高、收益率达标、市场过热时卖出。\n\n## 相关\n\n- 所属书卡：指数基金投资从入门到精通\n\n- 第5章 ETF基金、第7章 基金定投入门、第8章 基金定投高级",

   "body": "# 《一本书读懂财报》\n\n> 一句话：清华会计系主任写给零基础读者的三张报表入门书——**用\"经营、投资、融资\"三件事把资产负债表（企业的单反相机=家底照片）、利润表（摄像机=一段时期赚没赚钱）、现金流量表（流水账=风险视角）串成一个整体**，再教同型分析/比率分析，最后落到一个判断：\"什么才算赚钱？\"——不是有利润，而是**扣掉股东的机会成本后仍有超额收益（经济利润>0）**。\n\n## 基本信息\n- 作者：肖星，清华经管学院会计系主任，讲财务报表分析课 16 年，先出同名 MOOC（学堂在线）后成书\n- 主题领域：财务报表阅读 + 财务分析入门（三表逻辑 → 分析方法 → 如何判断好公司）\n- 读它的目的：补全库最大缺口——研究赛道（新赛道研究五步法 第二步\"验证龙头财报\"）要用龙头财报验证景气，需要先建立\"看得懂三张表\"的地基\n- 方法学背景：作者主张**财务是一种描述企业经营的语言，不要陷入会计数字**；带着\"看企业\"的目的读表，数字才有意义。全书用同一家\"新成立公司 13 项经济活动\"贯穿三张表的诞生，再以造纸/家电两个行业的真实公司案例演示数据如何带上行业烙印\n\n## 全书脉络\n\n**引言 会计是什么？**：会计既非科学也非艺术，而是\"魔法\"——准则之内充满判断与选择。用\"3000 万房子抵 1.6 亿贷款再买回、把亏损做成盈利\"的案例立警：**别人会用你的报表做决策，所以报表会被修饰，读财报先带三分警惕**。\n\n**第一部 资产负债表 = 企业的单反相机（时点快照）**\n- 企业一辈子只做三件事：**经营（生产销售回款）、投资（扩产/并购/新业务）、融资（借钱/找股东）**\n- 左边资产=钱被拿去做了什么；右边负债+股东权益=钱从哪来；**资产=负债+股东权益（会计恒等式）**\n- 关键概念：流动资产（货币资金/应收/存货/预付）vs 非流动（固定/无形）；应收 vs 其他应收（**关联方占用资金常藏在\"其他应收款\"**）；应付 vs 预收；折旧=资产变成费用的过程（**资产是明天的费用**）\n- 股东权益四件套：股本+资本公积（外面拿进来的）、盈余公积+未分配利润（里面留下的）；股东是\"剩余求偿权\"人——**公司风险的最终承担者**\n\n**第二部 利润表 = 企业的摄像机（时段视频）**\n- 逻辑漏斗：营业收入 − 营业成本 = 毛利 → − 税金及附加/三费（销售+管理+财务）→ ± 投资收益/资产减值/公允价值变动 = **营业利润**（可持续）→ ± 营业外收支/补贴（**不可持续，最不靠谱**）→ 利润总额 → − 所得税 = 净利润\n- 利润表的两个作用：①告诉你现在赚了多少、在哪赚的；②**区分可持续与不可持续项目 → 推断未来盈利**（同样 1000 万利润，900 万来自主营 vs 900 万来自营业外，含金量天差地别）\n- 铁律：**有收入≠收到现金，有费用≠付出现金**（应收/折旧/预收/预付款造成）→ 利润 ≠ 现金流\n\n**第三部 三张报表的内在勾稽**\n- 同一笔经济业务如何在三张表上各自落账（13 项活动全程演示）；成本费用分类（生产成本入表成存货、期间费用直接抵利润）\n- 三张报表=两个维度：**现金流量表=风险维度（能不能活下去）；资产负债表+利润表=收益维度（能活下去的话长什么样）**——两维缺一不可\n\n**第四部 现金流量表 = 家庭的流水账（风险视角）**\n- 现金流入流出按 经营/投资/融资 三分类；**经营现金流最稳定可靠（造血功能），投资流出可能创造未来收益，融资流入是输血**\n- 为什么存在：两张表都能告诉你\"现金变了多少\"，只有它告诉你\"**为什么变**\"——同样净增 1000 万，A 公司经营自给自足 vs B 公司靠融资输血，健康度完全不同\n\n**第五部 活用三张表 = 分析工具箱**\n- 谁看哪张表：**银行家盯现金流量表（怕你还不上现金）、投资者盯利润表（看未来盈利）、收购者盯资产负债表（买的是股东权益=资产+负债，负债是被低估的风险）**\n- 同型分析：利润表各项 ÷ 收入、资产负债表各项 ÷ 总资产 → 看\"结构\"，一眼看出钱损耗在哪一步\n- 比率分析四组（附录公式全）：盈利能力（毛利率/净利率）、营运能力（应收/存货/总资产周转率，周转天数=365/周转率）、偿债能力（流动比率/速动比率/利息保障倍数/资产负债率）、投资回报（ROA/ROE；**ROA = 效率(周转率) × 效益(净利率)**）\n- 财务数据带行业烙印：毛利率反映行业竞争强度、应收/存货反映对下游话语权、应付反映对上游话语权、固定资产占比反映行业资金密集度——**先看行业（五力图）再看企业**\n\n**第六部 好公司的标准 = \"赚钱\"的严格定义**\n- **总资产报酬率(ROA) = 效益(净利率) × 效率(总资产周转率)**；两种战略路线：成本领先=低毛利高周转（薄利多销）、差异化=高毛利低周转——殊途同归，战略执行不到位则两头落空\n- **及格线是资本成本（WACC）**：经济利润 =（投资资本回报率 − 加权平均资本成本）× 投资资本；**净利润>0 但经济利润<0 = 表面赚钱实际为股东亏钱**（股东的钱投别处更划算，公司跑不赢行业平均）\n- 股东收益靠什么：ROE = ROA × 权益乘数；**靠借钱（加杠杆）提 ROE 是假象，根子是总资产报酬率**——公司整体投资回报上不去，加杠杆只会放大风险\n- 案例：造纸龙头 A 公司 vs B 公司——规模 3 倍却效益效率双输（多产品无规模经济/原材料基地远水不解近渴/运费与并购管理费高/在建工程拖累周转），但多产品+原材料布局又为它扛过 2008 行业巨变埋下伏笔：**当前数据差≠未来差，判断未来要结合行业周期与战略布局**\n\n**第七部 把控风险 = 现金流八分类**\n- 经营/投资/融资现金流正负组合共 8 类，对应生命周期与风险：**经营(+)+投资(−)+融资(−) = 成熟健康**；经营(−)靠融资输血 = 初创或衰退；**第八类（三项全负）= 等死**，任何企业不能长期停留\n- 关键警示：经营现金流为正时大规模举债扩张（第三种）→ 警惕投资规模/节奏失控（非油炸方便面企业资金链断裂案例）；经营现金流好但大量融资无投资计划 → 警惕掏空/资金闲置\n\n**第八部 利润 vs 现金流，哪个重要？**\n- 本质是\"**追求收益 vs 控制风险**\"之争：**风险大（行业被替代/衰退）→ 现金流第一，利润表可能骗人**（电子书企业：利润 8000 万但应收存货大增、经营现金流 −3.2 亿，次年亏 5 亿）；**风险可控（寡头/定制订单）→ 利润更重要**（通信设备商应收大增却第二年利润翻倍）\n- 统一结论：风险大看现金流，风险可控看利润；经济形势差时企业普遍更关注现金流\n\n**终曲 应用**：企业内部决策（A 公司案例的\"照镜子\"用法）；投资决策=NPV>0 的本质是\"**只投自己有竞争优势的领域**\"——财务数据是评估竞争优势的工具\n\n## 提炼出的知识\n- 读财报看景气——本篇书卡主提炼：面向 ETF 玩家\"用龙头财报验证赛道景气 + 排雷\"的精简三步法（增速/毛利趋势/现金匹配 + 应收存货排雷三问）\n- 关联已有卡：CANSLIM选股法（C/A 的盈利加速判据 = \"景气验证\"的尺子，本书给的是读懂尺子的底层知识）· 高估五类（题材 vs 基本面的反向警戒）· 新赛道研究五步法（本卡的直接服务对象）\n\n## 我的感受 / 行动\n1. **这本书对 ETF 玩家的正确用法是\"验证赛道景气\"，不是学个股深度排雷**：你买的是 ETF，不用学全套造假识别；但要会用龙头财报回答五步法第二步的三个问题——行业真在景气吗（龙头收入/利润在加速）、竞争格局恶化没（龙头毛利率趋势）、有没有暴雷前兆（经营现金流与利润背离）。\n2. 最该记住的一句话：**净利润>0 不是赚钱，跑赢行业平均（经济利润>0）才算**——这与 CANSLIM 的 C/A（盈利增速要显著高于市场预期）同源，也是判断\"题材 vs 真成长\"的底层尺子：题材炒的是\"故事\"，真成长必须财报兑现。\n3. 三张表的速记：**资产负债表=家底照片（时点）、利润表=赚钱录像（时段）、现金流量表=流水账（风险）**；判断一家公司先问\"它现在风险大不大\"——风险大看现金流、风险可控才信利润。\n4. 财报数据一律**先对照行业再下结论**（毛利率 15% 在彩电行业是常态、在软件行业就是灾难）；比较对象要\"门当户对\"（同行业、同地区、同战略路线）。\n5. 本书地基打完后，下一本按导读顺序读唐朝《手把手教你读财报》（A 股年报实操 + 排雷视角），把\"看哪几个科目、怎么排雷\"落到中国年报的具体格式上。\n\n## 本书提炼的知识卡\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 读财报看景气 | 方法 | 你买的是 ETF，不需要学个股深度排雷、会计造假全套——那是选股者的功课。财报对你只有两个用途： |",

   "source": "02-来源卡/专业投机原理.md",
   "body": "# 《专业投机原理》\n\n> 一句话：**一本把「怎么判断趋势变没变」讲到可判定、把「怎么不死」讲到有算式、把「为什么会自己作死」讲到心理层的书**——1-2-3 法则与 2B 法则的原始出处，也是「风险优先于利润」这句话最完整的论证。\n\n## 基本信息\n\n- 作者：维克多·斯波朗迪（1937– ），华尔街自营交易者、基金经理。**1972–1987 连续 16 年没有任何一年亏损，年均名义回报 70.7%**（书中表 0-1/0-2 自述）\n- 本书是两本合订：上卷 *Methods of a Wall Street Master* + 下卷 *Principles of Professional Speculation*\n- 六篇 31 章，中文约 34 万字\n- 入库：2026-10-20（原书 epub + 全文提取件已归位书架「投资与经济/专业投机原理/」）\n- 读它的目的：03-短线超短 书单**第一梯队第 1 本**，指定缺口 = **2B 法则 + 123 法则**（形态二的假突破否决条件）\n\n## 全书脉络（六篇 31 章）\n\n| 篇 | 章 | 内容 |\n|---|---|---|\n| **一 · 建立基本知识** | 1–12 | 作者历程 → **鳄鱼原则**（第 2 章）→ **一致性获利三原则**（第 3 章）→ **道氏理论**（第 4 章）→ **趋势的定义**（第 5 章，含行情四阶段/窄幅盘整/量价关系）→ 技术分析优缺点（第 6 章）→ **辨识趋势的改变**（第 7 章：趋势线、**123 法则**、**2B 法则**、ABC 三浪）→ 指标与选股（第 8 章：均线/相对强度/动能）→ 经济学基础（第 9–10 章）→ **衡量风险与资金管理**（第 11 章：风险/回报 1:3、**趋势剩余寿命法**）→ **50 种亏钱方法**（第 12 章） |\n| **二 · 情绪的纪律** | 13–17 | 理性与情绪的战争（史波克症候群）→ 成功之道 → 改变才能坚持 → **克服谬误的自尊**（第 16 章，鳄鱼原则的心理根源）→ 个人自由 |\n| **三 · 基本面分析** | 18–23 | 投资哲学原则 → 经济预测 → 货币信用与经济循环 → 政治对循环的影响 → 90 年代展望 → 美元走势 |\n| **四 · 技术分析** | 24–28 | 波动与交易机会 → 股市作为经济预测指标（百年资料）→ 风险/回报的技术基础（第 26 章）→ **市场分析的技术性原则**（第 27 章）→ 原则的运用（第 28 章） |\n| **五 · 期权交易** | 29–30 | 期权三位数回报 → **当日冲销的专业交易方法** |\n| **六 · 交易者心理** | 31 | 交易者的特质与个性 |\n\n## 与我的体系\n\n### 直接对位（为什么排第一梯队第 1 本）\n\n- **2B法则** → 补 03-短线超短 形态二（突破后确认）的**否决条件**：突破后跌回突破位下方 = 2B 成立，本次形态作废。这正对 2026-10-12 追 512980 那笔亏损的直接病因：**追了一个没确认的突破**。\n- **123法则** + **趋势线一致性画法** → 给「趋势还在不在」一套可以数出来的判据，替代感觉判断。\n- **趋势剩余寿命法** → 可量化、可回测，能用我的 10 年 ETF 数据算出 A 股版「寿命表」，给「涨多少算多」一个客观刻度。\n\n### 认知层\n\n- **鳄鱼原则** → 补「亏损状态下允许做哪些动作」的行为白名单。库内的止损卡都在讲阈值，没人讲「不许自救」。\n- **一致性获利三原则** → 与 2%与6%法则 形成「月度熔断 + 季度缩放」双层资金管理。\n\n### 明确不搬的部分\n\n| 内容 | 为什么不搬 |\n|---|---|\n| 期权交易（第 29–30 章） | 我目前不做期权；且 ETF 期权与个股期权结构不同 |\n| 美国经济/货币/财政分析（第 9–10、19–23 章） | 时代背景 1980s 美国，与 A 股政策市结构不同；只借用「看政策与信用周期」的思路 |\n| 当日冲销（第 30 章） | 场内 ETF 是 T+1，当天买当天卖不了（见 03-短线超短 第一节） |\n| 个股选择与相对强度（第 8 章） | ETF 无个股基本面，相对强度已在 主线雷达判据验证 里另有实现 |\n\n## 本书提炼的知识卡（2026-10-20，共 6 张：方法 5 + 概念 1）\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 2B法则 | 方法 | 创新高没站住、又跌回前高之下 = 趋势反转信号；成因是场内「清除止损」 |\n| 123法则 | 方法 | 趋势变动三征兆（破线/试探失败/破前低），三个齐了才算变 |\n| 趋势线一致性画法 | 方法 | 两低点之间不得穿越任何价位；与线性回归斜率对照，排除主观 |\n| 趋势剩余寿命法 | 方法 | 用幅度与期限的分布算「这波还能走多久」的胜算，可换算成仓位比例 |\n| 一致性获利三原则 | 方法 | 保障资本→一致性获利→追求卓越回报；单笔 1~2%、1:3 门槛、季度缩放 |\n| 鳄鱼原则 | 概念 | 认错就一键平仓，禁止摊平/对冲/换标的/等反弹四件事 |\n\n## 去同存异说明（哪些没建卡，为什么）\n\n- **2%/6% 风险法则** → 已有 2%与6%法则，本书 1~2% 单笔与之同量级，只在 一致性获利三原则 里做对照，不重复建卡；\n- **R 乘数记账** → 已有 R乘数；\n- **突破真假过滤** → 已有 突破真假三验证（墨菲三关），与 2B 分工已在新卡里写明；\n- **支撑压力水平线画法** → 已有 支撑与压力的画法；本书只补斜线（趋势线）规则，见 趋势线一致性画法；\n- **行情四阶段（承接/出货/趋势/整理）+ 窄幅盘整突破** → 内容与 支撑与压力的画法 的平台概念、震荡状态识别检验 的「震荡能否识别」高度重叠，且后者已有回测结论。**本轮不建卡**，需要时按第 5 章原文查（提取件行 885–912）；\n- **50 种亏钱方法（第 12 章）** → 与 投资错误清单（欧奈尔 19 错）同类。原文清单更长更细，**留作待拆**：等路线 B 复盘攒够自己的亏损样本，再拿它做对照表，比现在抄一份清单有用。\n\n## 行动\n\n- [x] 拆第 7 章（趋势线 / 123 / 2B / ABC 三浪）→ 3 张卡\n- [x] 拆第 11 章（风险衡量的统计方法）→ 趋势剩余寿命法\n- [x] 拆第 2–3 章（鳄鱼原则 / 三原则）→ 2 张卡\n- [ ] **待用户拍板**：把 2B 否决条款写进 ETF交易系统 与 03-短线超短（属改规则，须走 §7.9 三处同步）\n- [ ] 待做：用 10 年 ETF 数据算 A 股版「趋势寿命表」（须先回测后写规则，参照 震荡状态识别检验 的教训）\n\n## 相关\n\n全库书单 · ETF书籍导读 · 03-短线超短 · 止损赚钱 · 以交易为生 · 海龟交易法则 · 期货市场技术分析 · 炒股养家心法",

   "source": "02-来源卡/世界上最简单的会计书.md",
   "body": "# 《世界上最简单的会计书》\n\n> 一句话：用**一个小孩摆柠檬汁摊、做满一个暑假生意**的故事，把资产负债表、利润表、现金流量表三张表从零\"演\"出来——每笔交易都问\"什么出去了、什么进来了、报表平不平\"，读完就能亲手编出一家小公司的完整账单，也第一次真切体会：**利润不是现金，赚钱的公司也会因为没现金而倒下**。\n\n## 基本信息\n- 作者：达雷尔·穆利斯 & 朱迪丝·奥洛夫，美国会计教育畅销书（原书 The Accounting Game），被大量 MBA/财务入门课程用作教材\n- 主题领域：会计入门（零基础）——用故事化教学取代公式灌输\n- 读它的目的：**在三表\"地基\"里补最底层的一块**。肖星《一本书读懂财报》给你\"三张表各是什么、怎么勾稽\"的骨架，本书给你\"亲手做一遍、理解每个数字怎么来的\"血肉。研究 ETF 赛道要验证龙头财报（新赛道研究五步法 第二步），得先把会计恒等式和记账逻辑变成本能\n- 方法学背景：全书按\"周\"推进，小朋友经营柠檬汁摊，每周发生新交易（赊购、雇人、折旧、赊销、坏账、交税、清算），每章教你把这些交易记进三张表。到期末会把整夏做成完整报表并做趋势分析——**从经营到报表到分析，完整闭环**\n\n## 全书脉络\n- **第1章 资产负债表诞生**：现金、原始投资、资产、负债、所有者权益、存货、盈利。**会计恒等式：资产 = 负债 + 所有者权益**；用记账卡\"左右必相等\"的机械规则，让每笔交易自己把报表填平\n- **第2章 利润表诞生**：毛利、净利润、利润表、现金流量。销售收入 − 销售成本 = 毛利 → − 费用 = 净利润；**利润表是\"一段时期\"（摄像机），资产负债表是\"某一时点\"（照片）**\n- **第3章 赊账与留存收益**：贷款、赊账、应付账款、应付票据。赊购时资产（存货）增加、负债（应付账款）同步增加**——不花现金也能增加资产；上周利润滚入\"留存收益\"**\n- **第4章 权责发生制**：应付工资、应收账款、坏账、利息、待摊费用、**权责发生制 vs 收付实现制、创意会计**。收入在\"赚得\"时确认而非\"收钱\"时确认；坏账准备要提前计提（谨慎性原则）\n- **第5章 服务业**：服务业没有存货，成本分\"服务成本\"与\"费用\"；**服务业唯一的存货是\"时间\"**，可计费小时是命脉\n- **第6章 存货计价 FIFO/LIFO**：价格上涨时，先进先出（FIFO）利润高、税多；后进先出（LIFO）利润低、税少——**公司选 LIFO 的唯一目的是节税**；但无论用哪种，\"实际上用掉的永远是先买的柠檬\"（否则会烂），**计价方式只存在于账面上**\n- **第7章 现金流量表诞生**：第三张表——**凳子的第三条腿**。只记录现金的真实流入流出；固定资产、资本化（大额长期支出进资产负债表）vs 费用化（当期消耗直接抵利润）；折旧是非付现费用\n- **第8章 利润 vs 现金（本书灵魂）**：买了一辆20美元的推车后，账上盈利52美元却**连30美元的柠檬汁都买不起**——因为盈利藏在存货、设备、应收里，**\"我们只收现金\"**。折旧方法（直线法 vs 双倍余额递减法/加速折旧）与税金。**结论：现金是企业的血脉，利润只是账面数字**\n- **第9章 税金、清算**：计提所得税、**存货核销（烂掉的柠檬要从账上减记，同时减利润、减税）**、资产清查、最终清算。会计末期要\"清理干净\"，别让虚增的存货和利润留在表上\n- **第10章 最后分析——增加利润**：**用比率（而非绝对数）做趋势分析**：成本/收入比率、费用/收入比率、净利率；对比①竞争对手 ②自己的历史——**趋势比单点更重要**（公牛队一场输赢说明不了什么）\n- **学后测验**：同一份测验学前学后各做一遍，检验掌握\n\n## 提炼出的知识\n- 会计恒等式与三表勾稽——本篇书卡主提炼：用\"柠檬汁摊\"场景把三表关系讲成人人能懂的记账直觉（资产=负债+权益、利润≠现金、权责发生制）\n- 关联已有卡：读财报看景气（本书是\"看得懂表\"的地基，那张卡是\"用表验证景气\"的用法）· 读财报看景气（肖星同主题，更偏分析与好公司标准）· 财报排雷清单（唐朝，反向排除视角）\n\n## 我的感受 / 行动\n1. **这本书的价值是\"建立手感\"而不是\"学到知识\"**：三张表的定义你在别处都见过，但只有亲手把一笔\"赊购柠檬\"记进去、亲眼看到报表怎么平，才会真正记住。对 ETF 玩家，读它最快的收益是**看到年报三张表不再发怵**。\n2. 最该刻进本能的三个直觉：①**资产 = 负债 + 所有者权益**，任何一笔交易都同时动至少两个科目；②**利润 ≠ 现金**，赚钱的公司可能因为现金周转不过来而倒下；③**权责发生制**让收入和费用在\"赚得/发生\"时入表，而不是\"收付现金\"时——所以报表和真实收付款之间永远有时间差。\n3. **对 ETF 实战的直接启发**：读财报看景气 里\"经营现金流 ÷ 净利润\"这个含金量指标，本质就是本书第8章那句\"我们只收现金\"——**净利润是意见，现金流是事实**。看赛道龙头时，利润漂亮但经营现金流常年跟不上，就该警觉。\n4. **存货计价方法（FIFO/LIFO）是理解\"毛利率变化\"的关键**：同样的经营，换个计价方法毛利率就变了。所以看到龙头毛利率异动，先查它有没有**变更会计政策**（财务诡计 第19章\"对变更要十分警惕\"）。\n5. 读完本书的定位：它是\"财报三本\"里**最入门、最该先读**的一本；读完再读肖星（学着分析好公司），最后读唐朝/财务诡计（学着排雷）。**先会记账，再看报表，最后才谈排雷。**\n\n## 本书提炼的知识卡\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 会计恒等式与三表勾稽 | 方法 | 1. 看年报顺序：先看资产负债表（家底厚不厚、安不安全）→ 再看利润表（赚没赚钱、在哪赚的）→  |",

   "body": "# 《以交易为生》\n\n> 一句话：交易者的\"生存手册\"——先用心理关认清自己（赢家 vs 输家的区别不在智商），再用三重滤网解决\"多周期信号打架\"，最后用 2%/6% 法则把情绪翻译成数学规则。全书就讲三件事：**心理 → 方法 → 风控**。\n\n## 基本信息\n- 作者：亚历山大·埃尔德，精神科医生转行交易者（\"博士交易员\"），著有《以交易为生》《走进我的交易室》\n- 主题领域：交易心理 + 技术分析 + 资金管理（短线/波段）\n- 读它的目的：补齐\"业余 vs 专业\"的分水岭——纪律如何从外约束变成内化；风险怎么用数字管住\n\n## 全书脉络（原书第2版，11 章 59 节）\n- **第1章 个体心理**：为什么交易、现实与幻觉、自我毁灭、\"匿名戒酒会\"给交易者的启示、胜利者与失败者的差别（纪律/风险观，而非智商）\n- **第2章 群体心理**：价格是什么（\"价格=边际买卖者愿意支付的钱\"）、市场是群体、趋势的心理学根源\n- **第3章 经典图表分析**：支撑阻力、趋势与交易区间、袋鼠尾（影线陷阱）\n- **第4章 计算机化技术分析**：均线、MACD 线与柱状线、趋向系统、震荡指标、随机指标、RSI——指标是\"体温计\"不是\"水晶球\"\n- **第5章 成交量与时间**：强力指数指标、持仓量、时间周期（5 倍法则的来源）\n- **第6章 市场指标**：新高-新低指数、50 日均线上股票占比等大盘宽度指标\n- **第7章 交易系统**：系统要写下来、手工测试胜过回测、**三重滤网**、动力系统、通道交易系统\n- **第8章 交易工具**：股票 / ETF / 期权 / 期货 / 外汇的适用与风险\n- **第9章 风险管理**：情绪与概率、**2% 法则**（防鲨鱼）、**6% 法则**（防食人鱼）、从连亏中恢复的\"阶梯减仓\"、交易经理=外在纪律\n- **第10章 实践细节**：盈利目标要\"够\"、止损不能异想天开、\"这是 A 级交易吗\"\n- **第11章 记录习惯**：每日功课、交易计划、交易日志\n\n## 提炼出的知识\n- 三重滤网交易系统——长周期定方向、中期找回调、短线定入场，多时间周期过滤信号\n- 2%与6%法则——单笔亏 ≤2%、当月总亏 ≤6%，用铁三角算仓位、连亏后阶梯恢复\n\n## 我的感受 / 行动\n1. 埃尔德是\"把心理书的话翻成可执行数字\"的那层：《交易心理分析》讲要概率思维，这里直接给 2%/6% 两个数，账户敢不敢下这一单不用问情绪，问数学。\n2. 与海龟互补：海龟给\"突破入场 + 2N 止损 + 1% 风险\"的机械系统，埃尔德给\"顺势 + 回调入场\"的多周期系统与账户层红线——两套都要求**交易前写下入场/止盈/止损三个价**，没有三个数的交易就是赌博。\n3. 行动：短线纪律核对表\"下单前定 1% 风险\"升级为铁三角公式；三重滤网可作为 A 股 ETF 波段（路线B）的入场筛选器（周线定方向 + 日线等回调）。\n\n## 本书提炼的知识卡\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 2%与6%法则 | 方法 | 账户毁灭只有两种方式：一次巨亏（鲨鱼式）或一串连亏（食人鱼式）。业余者亏 25% 后要赚 33% |\n| 三重滤网交易系统 | 方法 | 趋势指标（均线/MACD）和震荡指标（RSI/随机）常给出相反信号：趋势向上时震荡指标说\"超买快 |\n| 止损触发三问 | 方法 | 止损线是买入前写好的\"最大可承受亏损\"兑现点，它只回答\"风险预算用完了\"，不回答\"该不该离场\"。 |",

   "oneliner": "价值投资鼻祖格雷厄姆教你逐科目读懂资产负债表、用比率解剖利润表的老派硬功夫——核心不是\"公司赚不赚钱\"，而是先问\"这家公司安不安全\"：营运资金够不够、流动比率/速动比率健不健康、利息与优先股股息的保障倍数够不够、账面净值与清算价值几何；安全第一，收益第二。",
   "source": "02-来源卡/像格雷厄姆一样读财报.md",
   "body": "# 《像格雷厄姆一样读财报》\n\n> 一句话：价值投资鼻祖格雷厄姆教你**逐科目读懂资产负债表、用比率解剖利润表**的老派硬功夫——核心不是\"公司赚不赚钱\"，而是**先问\"这家公司安不安全\"**：营运资金够不够、流动比率/速动比率健不健康、利息与优先股股息的保障倍数够不够、账面净值与清算价值几何；**安全第一，收益第二**。\n\n## 基本信息\n- 作者：本杰明·格雷厄姆（《证券分析》《聪明的投资者》作者，价值投资奠基人）；本书（原书 The Interpretation of Financial Statements, 1937）是他写给普通投资者的财报阅读入门\n- 主题领域：财务报表阅读（偏资产负债表、偏防守视角）——经典的\"安全边际\"读表法\n- 读它的目的：**补上\"防守视角\"这块**。肖星/唐朝教你\"公司好不好、有没有造假\"，格雷厄姆教你先问\"公司会不会倒、我的本金安不安全\"——与你的路线A（宽基定投、追求长期安全）气质最合；也是理解价值投资底层语言的必经一本\n- 版本特色：**每一章后附\"专业解读\"**，把 1935 年美国准则对应到**中国现行企业会计准则（CAS）**的科目与实务，本土化做得很好，读美国老书不怕水土不服\n- 结构：34 章逐科目精讲（资产负债表 → 利润表）+ 第二部分\"用比率方法分析\"（伯利恒钢铁公司 1928 年报实例）+ 第三部分\"财务术语\"词典\n\n## 全书脉络\n\n**第一部分 逐章精读资产负债表**\n- 第1-2章：资产负债表总览与**复式记账**——借方/贷方，资产=负债+权益，盈余账户是收入费用结转的终点\n- 第3-5章：总资产/总负债（**表上数字会高估或低估，需跳出表外看**，与同行横向比）；资本与盈余（股本/实收资本、资本公积）；财产账户（固定资产，重估与\"注水\"问题）\n- 第6章：**折旧与折耗**——折旧率经验值（建筑2-5%、机器7-20%、汽车20-25%）；警惕**故意把设备账面做小以\"节省\"折旧、虚增利润**\n- 第7-10章：长期投资、无形资产（**商誉最不可信，多数公司已核销至1美元**）、预付费用、递延费用\n- 第11-12章：流动资产/流动负债逐项分类（现金、应收、存货 / 应付、应计、税金）\n- **第13章 营运资金**：流动资产 − 流动负债 = 营运资金，是**衡量工业公司财务实力的极重要指标**——能否维持运作、能否扩张、能否扛突发亏损；**速动资产 = 流动资产 − 存货**，正常应远超流动负债\n- **第14章 流动比率**：流动资产 ÷ 流动负债，工业公司**最低标准约2:1**；要求更严就看速动比率（≥1:1）\n- 第15-17章：存货（**存货周转率 = 销售 ÷ 存货**，异常高或异常多都要警惕）、应收账款（对比销售收入逐年变化，异常高=宽松信贷=坏账风险）、现金（**缺现金常表现为大量银行贷款**）\n- 第18-19章：应付票据（**银行贷款超过现金+应收之和 = 财务不稳健的信号**）、准备金三分类（负债性/备抵资产/真盈余，**看清是\"已发生\"还是\"防未来\"**）\n- **第20-24章 账面价值系列**：账面价值 ≠ 清算能拿到的钱（**资产清算价值通常远低于账面**）；**有形资产净值 = 账面价值 − 无形资产**；债券/优先股/普通股分别算账面净值；流动资产净值可作工业公司**清算价值的粗略标准**——**股价低于每股流动资产净值 = 值得关注**\n\n**第二部分 逐科目精读利润表**\n- 第25章：**盈利能力** = 未来可持续盈利的合理预期；**多年平均收益比单年更能说明问题**\n- 第26-28章：公用事业/工业/铁路三类典型利润表结构\n- **第29章 计算收益**：**利息保障倍数 = 可供支付固定支出的收益 ÷ 利息支出**（工业债一般≥2.5倍，高信用债≥3倍）；优先股看\"固定支出+优先股股息保障倍数\"；**别把高级债券和次级债券分开算保障倍数**（会得出荒谬结论）\n- 第30章：**维修和折旧比率**（铁路维修费占总利润32-36%为正常；公用事业折旧占总收入8-12%为合适）——**大幅偏离就要调整报告收益**\n- 第31章：利息和优先股股息的**安全保障程度**——评判投资级债券/优先股的核心标准\n- **第32章 趋势**：一致变化的方向就是趋势；**不利趋势的证券不值得买（哪怕保障倍数还很高），有利趋势也别过早支付高价**——买前问两个问题：①我多大信心趋势会持续？②我为这个预期提前付了多高价格？\n- 第33章：**普通股价格与价值**——价格由**大众对未来的预期**决定，而非过去/现在收益；P/E 高低反映市场对增长的定价\n\n**第三部分 比率工具箱（伯利恒钢铁公司实例，15个比率全带公式）**\n- 利润率、投资资本收益率、利息保障倍数、普通股每股收益\n- 折旧/设备成本比、折旧/销售额比、**盈余留存比例**（应占可分配利润30-40%）\n- **存货周转率**、**应收账款平均周转天数**、资本化比率（债券/优先股/普通股的资产构成）\n- **流动比率**、**速动比率**、普通股账面价值、**市盈率（P/E）**\n\n**结论（第34章）**：资产价值、盈利能力、行业比较、收益趋势、适应能力都有意义；但**行业前景、市场条件、大众偏好**这些无法用比率测量的因素同样重要。格雷厄姆的落点务实：**按\"价格便宜时买、价格贵时卖\"操作，未必能赚超额利润，但能避免巨额或频繁的损失——这正是明智投资者追求的主要目标。**\n\n## 提炼出的知识\n- 安全边际读表法——本篇书卡主提炼：以\"公司安不安全\"为第一问的逐科目+比率读表框架（营运资金三铁律 + 保障倍数 + 账面/清算价值）\n- 关联已有卡：读财报看景气（肖星，正向看景气）· 财报排雷清单（唐朝，反向排雷）· 防御型投资者纪律（格雷厄姆《聪明的投资者》，本卡是其\"读表版\"基础）· 读财报看景气（同主题现代版）\n\n## 我的感受 / 行动\n1. **这本书和你的路线A天然契合**：宽基 ETF 长期定投、越跌越买、追求安全——而格雷厄姆读表法的第一性问题就是\"**这家公司安不安全**\"，而不是\"能涨多少\"。它给的是**防守者的语言**。\n2. 最该记住的\"安全三铁律\"（工业公司）：①**营运资金为正且充裕**（流动资产>流动负债）；②**流动比率≥2、速动比率≥1**；③**利息保障倍数≥2.5~3倍**。任一显著不达标，先降档。\n3. **\"账面价值≠真金白银\"是价值投资的第一盆冷水**：格雷厄姆反复强调清算价值可能远低于账面（存货打折、固定资产缩水），商誉更是常常一文不值。**看到\"市净率低\"先别兴奋，先扣掉无形资产、再想清算能剩多少。**\n4. 对 ETF 玩家的用法：**这套比率是\"行业体检表\"**——不必对个股逐项深挖，但可用\"流动比率/速动比率/利息保障倍数\"的**行业平均**来判断某个赛道（尤其重资产/高负债行业）的整体财务健康度；龙头毛利率高但利息保障倍数低 = 高杠杆扩张 = 周期下行时的风险点。\n5. **和现代财报书配合读**：本书的\"科目怎么读\"+\"比率怎么算\"是**骨架**，肖星给你\"好公司的定义（经济利润>0）\"，唐朝给你\"A股年报实操+排雷清单\"，财务诡计给你\"这些数字会怎么被骗\"。**格雷厄姆打底，后三本各补一块。**\n6. 最后一章那句要抄下来当座右铭：**\"价格便宜时买、价格贵时卖，未必能赚超额利润，但能避免巨额或频繁的损失。\"**——这正是定投+纪律的全部意义。\n\n## 本书提炼的知识卡\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 安全边际读表法 | 方法 | 市面上的财报书多数教你\"公司好不好、有没有造假\"；格雷厄姆教你先问\"公司会不会倒、我的本金安不安 |",

   "body": "# 《思考，快与慢》\n\n> 一句话：诺贝尔经济学奖得主写给所有人的\"大脑使用说明书\"——**人脑有两套系统：系统1 自动、快速、靠直觉与联想（默认开启、关不掉）；系统2 费力、缓慢、靠逻辑与计算（懒惰、能偷懒就偷懒）**。绝大多数判断错误，都来自\"系统1 越权拍板 + 系统2 懒得复核\"；而且事后我们还会用后见之明给自己编一个\"我早就知道\"的故事。\n\n## 基本信息\n- 作者：丹尼尔·卡尼曼，普林斯顿大学心理学教授，因\"前景理论\"获 2002 年诺贝尔经济学奖；合作者阿莫斯·特沃斯基（1996 年去世，未及领奖）\n- 主题领域：认知心理学 + 行为经济学——判断与决策的系统性偏差（非投资操作书，但它是交易认知偏差、第二层次思维、钟摆与周期的\"神经科学底层\"）\n- 读它的目的：第四批\"认知收尾\"第三本——给整条投资链路装上\"认知刹车\"：为什么再平衡/止损/低估定投这些好纪律执行起来那么难（系统1 在捣乱），以及为什么复盘时总觉得自己\"早就知道\"（后见之明）\n- 一句话结构：双系统原理（1-9章）→ 判断启发法与偏见（10-18章）→ 过度自信与\"知道\"的错觉（19-24章）→ 前景理论与选择（25-34章）→ 经验自我与记忆自我（35-38章）\n\n## 全书脉络\n\n**第一部分 系统1，系统2（第1-9章）**\n- **第1章 一张愤怒的脸和一道乘法题**：系统1（自动快速：认出愤怒的脸）vs 系统2（费力有序：算 17×24）；两个系统都对注意力有控制权，但**系统1 才是主角**——它不断给系统2 提供印象、直觉、意向，系统2 通常照单全收（\"懒惰的掌控者\"）。\n- **第2章 电影的主角与配角**：注意力是稀缺资源——同时做两件费脑力的事会互相干扰（\"看不见的大猩猩\"实验：专注数传球的人看不见捶胸走过的大猩猩，且事后不信自己会错过）。\n- **第3章 惰性思维与延迟满足的矛盾**：系统2 需要\"自我控制能量\"，用多了会耗尽（自我损耗）——所以做重大判断要在精力好时，别在连续决策后。\n- **第4章 联想的神奇力量**：系统1 靠**联想记忆**运作，自动把相关概念互相激活（启动效应），形成对世界的\"连贯解释\"。\n- **第5-6章 认知放松 / 意料之外与情理之中**：系统1 喜欢\"认知放松\"（熟悉、好读、押韵的话更容易被信以为真）；惊讶会激活系统2 查错——但多数时候系统1 的流畅解释直接通过了。\n- **第7章 字母\"B\"与数字\"13\"**：启动效应会无意识地影响后续判断（看到\"老年\"字样的人走路变慢）。\n- **第8-9章 判断的机制**：面对难题时，系统1 常把**难问题偷偷替换成容易的问题**来回答——你问\"这笔投资该不该买\"（难），系统1 答的是\"我喜欢这家公司吗\"（易）。启发法=偷换问题。\n\n**第二部分 判断启发法与偏见（第10-18章）**\n- **第10章 大数法则与小数定律**：人脑天生不擅长统计——**小样本照样下结论**（交易认知偏差里的\"小数定律\"出处）。\n- **第11章 锚定效应**：任何先出现的数字都会成为判断的锚（谈判先出价、成本价执念的机制）。\n- **第12-13章 可得性启发**：**想起的容易程度被当成发生概率**——媒体反复报道的事显得更常见（飞机失事 vs 车祸）；情绪性/生动性事件被高估。\n- **第14-16章 代表性启发**：按\"像不像\"判断概率——汤姆的图书管理员问题（忽视农民:图书管理员=20:1 的基础比率）；琳达问题（合取谬误：越具体的描述反而越像真的）；**因果关系比统计信息更有说服力**——给数据编一个故事，人们才愿意信。\n- **第17章 均值回归**：极端表现后自然回归平均——**\"成功后会失败、失败后会成功\"很多只是统计回归，不是因果**（均值回归 卡的理论源头，也是别惩罚/奖励运气的依据）。\n- **第18章 让直觉预测更有效**：用\"基准预测 + 按证据强弱向均值回归调整\"代替直接拍脑袋。\n\n**第三部分 过度自信（第19-24章）—— 对投资最致命的一段**\n- **第19章 \"知道\"的错觉**：大脑是\"意义构建器官\"——事后给一切编因果故事（叙事谬误），把运气讲成技能（谷歌故事）；**后见之明**让我们重构记忆、高估自己当初的预测（尼克松访华实验）；**结果偏见**：用结果好坏评判决策质量（\"隐形墨水写的字\"——只有事后才看得清）。CEO 对公司业绩的影响相关系数仅 0.30（胜率只从 50% 提到 60%），商业书籍却把它讲成英雄史诗。\n- **第20章 未来是不可预测的**：专家对长期宏观/股价的预测不比掷骰子好（直接呼应投资中的宏观不可知）。\n- **第21章 直觉判断与公式运算，孰优孰劣**：米尔 50 年研究结论——**约 60% 的研究显示简单公式胜过专家判断，40% 打平，没有一项证明专家更好**；专家败在\"想显得聪明\"（复杂化）和\"判断不一致\"（同一信息两次评估结果不同）。阿普加新生儿评分（5 变量 3 分制）拯救千万婴儿；道斯\"做爱频率−争吵频率=婚姻稳定\"；结论：**重要决策尽量用公式/清单，别信\"深刻直觉\"**。\n- **第22章 什么时候可以相信专家的直觉**：只有\"高有效性环境\"（有大量重复练习+即时反馈，如消防员、麻醉师、象棋大师）才可信；股票预测、长期政治预测属\"低有效性环境\"，专家直觉≈掷骰子。\n- **第23章 努力养成采纳外部意见的决策习惯**：全书最实操的一章。以色列课程教材案例：团队内部估计 2 年完成，参考同类项目（外部意见）却显示**失败率 40%、成功者平均 7-10 年**——这就是**规划谬误**。解法=**参考类别预测**三步：①识别参考类别；②用该类别统计做基准预测；③有充分特殊理由才上调/下调。\n- **第24章 乐观主义是一柄双刃剑**：乐观让人愿承担风险（创业、开战、打官司），但**低估风险/高估收益是规划谬误之源**——组织要奖励\"计划精准\"而非\"计划乐观\"。\n\n**第四部分 选择（第25-34章）—— 前景理论**\n- **第25-26章 前景理论**：颠覆期望效用理论。核心三特征（都属系统1）：①**参照点依赖**——盈亏是相对\"参照点\"（现状/期望）而非绝对财富（问题3/4：同样 1500 美元结局，因参照点不同，一个被当盈利一个被当亏损）；②**敏感度递减**；③**损失厌恶**——亏的痛约为赚的乐的 2 倍（系数 1.5~2.5）。\n- **第27章 禀赋效应**：拥有即高估——\"我手里的就是比别人的值钱\"，导致不肯卖出/不肯止损（处置效应的根源之一）。\n- **第28-29章 公平性/可能性权重**：人对\"可能性\"的感知非线性——极度小概率被高估（彩票）、高概率被低估。\n- **第30章 被过分关注的罕见事件**：小概率大灾难被高估（因为情绪化、生动、媒体渲染），导致过度保险或过度恐惧。\n- **第31-32章 风险政策 / 心理账户**：人把盈亏分门别类记账（\"生活费\"\"投资钱\"\"意外之财\"），违反金钱的可替代性；赌场赢来的钱花得更大方。\n- **第33-34章 框架效应**：**同一事实，表述方式不同（\"存活率90%\"vs\"死亡率10%\"）选择就不同**——语言能操纵决策。\n\n**第五部分 两个自我（第35-38章）**\n- **第35-36章 经验自我 vs 记忆自我**：体验时的快乐（经验自我）与回忆时的评价（记忆自我）不一致——**峰终定律**：记忆 = 最强烈时刻与结束时刻的平均，**过程时长几乎被忽略**（冷手实验：更长但结尾更缓的痛苦反而被记忆为更轻）。\n- **第37-38章 你有多幸福 / 思考生活**：聚焦错觉——问\"你多幸福\"时，人们会盯着当前最突出的因素（收入/天气/婚姻），高估它对整体幸福的影响；追求幸福要分清\"让经验自我满意\"还是\"让记忆自我满意\"。\n\n## 本书提炼的知识卡\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 系统1与系统2 | 概念 | 双系统模型：系统1 自动默认、系统2 懒惰复核；投资纪律难执行与判断出错的共同根源（第1–9章） |\n| 外部意见预测法 | 方法 | 用\"参考类别统计\"对抗规划谬误与过度自信：先基准预测，再特殊调整（第21/22/23章精华） |\n| 前景理论 | 概念 | 参照点依赖 + **损失厌恶（约 2 倍）** + 敏感度递减——成本价执念、处置效应、小赚大亏的理论源头（第25–26章） |\n| 心理账户 | 概念 | 钱被分门别类装进不同\"账户\"，违反可替代性——分红当白来的钱、沉没成本、窄框架（第31–32章） |\n| 后见之明与结果偏见 | 概念 | 事后编\"我早就知道\"的故事，并用**结果**而非**过程**评判决策——**复盘最大的污染源**（第19章） |\n\n> **2026-09-10 补拆（\"去同存异\"批次）**：原书 2 张卡。本轮补 3 张独有卡（前景理论 第25–26章 · 心理账户 第31–32章 · 后见之明与结果偏见 第19章），**三张都直接对应交易行为**（成本价执念 / 分红漏损 / 复盘污染）。\n> 第2–18 章（注意力、联想、启发法与偏见）、第27–30 章（禀赋效应、罕见事件）、第33–38 章（框架效应、两个自我）**已分别并入上述 5 张卡与 交易认知偏差**，按去同存异原则不重复造卡。\n\n## 我的感受 / 行动\n1. 这本书和投资的关系是\"病理学\"：交易认知偏差、钟摆与周期、第二层次思维说的所有群体愚蠢，机制全在这里——**系统1 偷换问题（把\"该不该买\"换成\"我喜不喜欢\"）、可得性（媒体渲染的热点）、后见之明（复盘时觉得自己早看出来了）、损失厌恶（该止损时下不去手）**。读懂机制后，对抗手段不再是\"更努力思考\"，而是\"用规则绕开系统1\"——这正是 机械交易系统、防御型投资者纪律、条件单存在的意义。\n2. 第 21-23 章对我冲击最大：**专家公式预测>直觉判断，且没有例外**。推论：我对市场的任何\"感觉/预判\"都应按低有效性环境处理——**定投/再平衡这类公式化纪律天然优于我临场的聪明**；要给某个计划估时/估收益时，先查\"同类项目实际结果\"，而不是拍脑袋。\n3. 后见之明 + 结果偏见是复盘的最大污染源：赚了别急着夸自己英明、亏了别急着骂自己愚蠢——**用决策质量而非结果评判**（这正是交割单复盘要按\"决策对错\"而非\"盈亏\"打分的依据，呼应 为结果负责）。\n4. 损失厌恶系数 2 倍这条，直接解释了我的交割单：盈利单 +2% 就跑、亏损单 −8% 死扛。对策不是\"下次勇敢点\"，而是**把止损位提前写成条件单、把止盈规则量化**——让规则代替情绪做决定。",

   "body": "# 《手把手教你读财报》\n\n> 一句话：A 股年报实操排雷手册——以**贵州茅台 2013 年年报**为范本逐行拆解，教你看懂中国上市公司年报里每个科目的\"投资含义\"和\"陷阱高发地\"。核心立场是序言那句\"**财报是用来证伪的，不是用来证实的**\"：不指望财报证明一家公司多好，只求它能帮你**排除**问题企业。老唐自设选股过滤规则：先排除 ROE<15% 的企业，再排除上市未满五年的企业。\n\n## 基本信息\n- 作者：唐朝，雪球知名投资者（笔名\"老唐\"），非财会科班出身，读了 30+ 本财会书后自己写书讲财报，风格是\"把每个角落打上灯光，不留死角\"\n- 主题领域：A 股上市公司年报阅读（资产负债表/利润表/现金流量表逐科目 + 财报综合阅读 + 管理层汇报读法 + 欺诈识别）\n- 读它的目的：一本书读懂财报（肖星）搭好\"看得懂三张表\"的地基后，这本给\"**看得出鬼**\"的排雷视角——研究赛道（新赛道研究五步法 第二步）拿龙头财报验证景气时，先确认这份财报本身可不可信\n- 方法学背景：全程用茅台 2013 年财报做范本（作者给出六大理由：主业单一好理解/子公司少/产销可相互印证/先收钱后发货无坏账/研究资料多/A股绕不开它）；教\"搜索大法\"——对报表任何疑问在财报 PDF 里搜科目名找附注解释\n\n## 全书脉络\n\n**序（小小辛巴）**：老唐开篇立场\"财报是用来排除企业的\"三重含义——取舍在我（不别人说好就好）、财报只是工具（框定范围不包打天下）、证伪思维（反复证伪把真相框到更小的范围，不是证明到 100%）。\n\n**第一章 你必须学会读财报**\n- 三个暖场造假故事（白纸两沓扭亏为盈 / 四年 60 倍纯造假牛股 / 空壳公司 5 年虚增利润 2.2 亿）→ 结论两条：**只看 F10 很容易上当；财报可以用来排除造假企业**\n- 财务大框架：权责发生制（没收到的钱可算收入、没付的钱可记成本）；**营业利润=一家公司的核心利润**（持续竞争力的体现），营业外收支占比大的公司要警惕；归母净利润 ÷ 总股本 = 每股收益；PE = 股价 ÷ 每股收益 = 投资回报率的倒数（20PE = 回报率 5%）\n- 现金流量表：经营/投资/筹资三分类；表里**最准确的数字是期初/期末现金**（中间科目是按利润表倒推调整的）；经营现金流净额为负的企业日子不好过（银行除外）\n- 读前准备：老唐的缩小关注圈规则（先排除 ROE<15%、再排除上市未满五年）；选定要看的企业后，**董事会报告和重要事项必须细读，且董事会报告最好多年连读**；对三张表的疑问全在附注里找解释\n\n**第二章 资产负债表（投资高手关心的表）**\n- **货币资金**：要与短期债务及经营需要匹配；四种\"事反必妖\"要排除——①资金比短债小很多（偿债危机）②资金充裕却借高息债 ③定存多活期少 ④其他货币资金巨大无解释（后三者 = 资金可能虚构/冻结/被大股东占用，报表日前几天才回来）\n- **应收票据/应收账款**：收现金 > 银行承兑汇票 > 商业承兑汇票 > 应收账款（公司地位从优到劣）；应收陷阱——增幅超收入增幅（放宽赊销/提前确认/虚构收入）、一年以上应收占三成（收入真实性存疑）、知名先款后货企业却几乎无应收 = 收入造假（蓝田案）；**造假常见伴生手段：应收账款藏进在建工程/长期股权投资\"毁尸灭迹\"**\n- **预付账款**：经常大额预付 = 生态链地位低；长期挂账预付款 ≈ 资金被挪用\n- **其他应收款 = 垃圾筐**：优秀公司此项几乎为零；越大越可疑（大股东占款/私设小金库/隐藏利润）\n- **存货**：**加大生产可以虚增利润**（案例：产量翻倍后固定成本摊薄，单位成本 200→150，毛利率 50%→62.5%，实际只卖了同样多的货）——毛利率提升要问：真涨价/真降本，还是只是产成品库存增加？；**生物资产 = 造假高发区**（蓝田案：湖底王八）；**造假高危行业共性：税收优惠多 + 产品不易核查**（农林牧渔、软件、集成电路、生物科技）\n- **固定资产/在建工程**：优秀公司倾向快速折旧（递延纳税 = 免息贷款）；**在建工程迟迟不转固定资产 = 有鬼**（避折旧美化利润 / 资金出口）\n- **商誉**：收购溢价才记录；**不摊销只做减值测试** → 收购型公司喜欢做高商誉（少折旧多利润、需要时再减值，进可攻退可守）；商誉减值不可转回\n- **长期待摊费用 = 费用资本化伪装**：已花掉的钱冒充资产，数字越大资产质量越差\n- **递延所得税**：对股东有利的是递延所得税**负债**（推迟纳税 = 税务局无息贷款），不是资产\n- 快速阅读资产负债表四看：总资产结构、应收占比（过半应收有问题）、是否有巨变、货币资金能否覆盖有息负债\n\n**第三章 利润表（资本市场追捧的表）**\n- **P = PE × E**（股价=市盈率×每股收益）：一条看 PE 变化（市场情绪）、一条看 E 变化（企业成长）、集大成者 = 戴维斯双击（低 PE + 高增长）\n- 母公司利润表净利没有观察价值（子公司分红可由母公司随意安排），**只看合并报表的归母净利润**\n- 收入确认原则：第一次读某公司财报必看（大部分造假 = 把不符合确认条件的收入确认为当期收入）；完工百分比法操作空间大\n- **毛利率**：与同行比，\"比同行高很多的企业，要么业内强者，要么造假骗子\"；利润高低三模式——茅台模式（高毛利靠产品力）、沃尔玛模式（高周转靠运营）、银行模式（高杠杆靠风险）\n- 营业总成本：销售+管理费用变化趋势应与营收一致，异动去附注找原因；**资产减值损失 = 操纵利润主要手段**（不提/多提再转回/一次性计提）\n- 营业外收支大 = 不靠谱（偶发不可持续），直接按\"营业利润 ×75%\"看待当年净利\n- **净利润 ≠ 挣到的钱**：用\"经营现金流净额 ÷ 净利润\"衡量含金量，**连续数年 >1 = 印钞机概率大**；纸面利润累积几年就要穿帮（税收只认现金）\n\n**第四章 现金流量表（事关存亡的表）**\n- **企业现金流八肖像**（经营/投资/筹资正负组合）：+++妖精型（不投资不还债却筹资=有鬼）、++−老母鸡型（收获期，低 PE 高股息可持有）、+−+蛮牛型（借钱扩张，看项目前景+资金链）、+−−奶牛型（经营现金流养投资+还债分红，**最健康**）；经营现金流为负的四类更危险（大出血/赌徒/混吃等死/骗吃骗喝）——**A 股经营现金流为负 ≈ 衰退期**（A股不许未盈利初创上市）\n- 速读异常信号：经营现金流长期为负 / 靠应付账款票据撑正 / **远低于净利润（利润造假提示）**；投资支出持续高于经营现金流（借钱维持投资=造假的资金源头）；筹资异常（还钱远多于借到=银行抽贷征兆）\n- **寻找优质企业 5 组数据**：①经营现金流>净利润>0 ②销售收到现金≥营业收入 ③投资现金流出主要用于新项目 ④现金净增加额>0 ⑤期末现金≥有息负债；**须数年持续如此，不认一年**\n\n**第五章 财报综合阅读及分析**\n- 三表总关系：**资产=负债+权益+收入−费用** → 想虚增利润必虚增资产或虚减负债，虚减负债需债权人配合，**所以造假 90% 选择虚增资产**\n- **财务分析四步走**：①浏览三表找异常科目（资产端看应收/其他应收/长期待摊，负债端看应付/短借，利润表看营业利润率与三项投资收益占比）②历史分析（业绩看满 5 年以上才可信；上市当年 ROE 通常较上市前三年均值跌超 50%）③利润 vs 现金流趋势对比（利润没变现金 = 问\"为什么\"，能躲过绝大多数造假）④与竞争对手/行业比（企业 +20% 但行业 +50% = 鸭子没随水面上升，出问题了）\n- 关键指标：ROE=净利÷平均净资产（衡量盈利能力最重要指标，巴菲特口径）；总资产收益率（剔除杠杆后的真实盈利）\n- 估值三法：现金流折现（只适用产品稳定/需求可预测的持续竞争优势企业）、清算价值法（格雷厄姆，市价低于有形资产账面值）、股市价值法（找可比公司比 PE/PB/收入倍数）\n\n**第六章 所有者权益变动表与财报附注**：变动表 = 前面内容的整理，极少细看；**附注 = 企业必须披露却不太想让你明白的东西都在这里**——别人不读的你要读，逐字细读一遍，之后一眼瞄过\n\n**第七章 管理层的汇报**\n- **董事会报告是最重要的部分，且要\"几年连起来读 + 同行的拿来对比读\"**：茅台案例——2011~2013 白酒行业巨变前夜，茅台董事会\"危机感十足\"（产能泡沫/重新洗牌/政策性因素增加），五粮液/泸州老窖/洋河却普遍乐观 → 结果 2012-2014 调整期茅台一枝独秀；**管理层都在说好话时最危险**\n- 重要事项 11 项逐条看；**改聘会计师事务所要格外警惕**（很可能对财报分歧太大，往往是财报有问题的先兆）\n\n**第八章 欺诈与反欺诈**\n- 操纵利润 = 操纵收入 + 操纵费用（+少数操纵现金流）：虚增收入（虚构交易/一次性行为夸大/提前确认收入——后两者介于合法与非法之间的灰色状态）；虚减费用（推至未来/掩盖成本/洗大澡——注销资产、大额计提减值、费用归入一次性，动机=毁尸灭迹或让未来报表好看）\n- **财报被操纵的痕迹清单**（任何一项异常都要去附注找解释，解释不充分就排除）：应收账款增幅超收入增幅；其他应收款数额大；预付账款大增或挂账超一年；存货增幅超营业成本；**存货周转率明显下降 + 毛利率显著上升 = 基本可按造假对待**；在建工程迟迟不转固/反复追加资金/刚转固就大修；长期待摊费用大增；无形资产大额采购（专利技术是转移资金常见手段）；商誉大（还原折旧看负债率）；坏账计提比例显著低于同行；应付职工薪酬波动大 + 递延所得税资产增加（平滑利润）\n- **财报外的警惕信号**：无法按时发布财报；更换甚至再次更换会计师事务所；独立董事集体辞职；大股东持续大量减持；财务总监更换频繁；供应商/销售商可疑（执照没年审/注册地居民楼）；经常跨行业收购且主要靠发股票支付\n\n## 提炼出的知识\n- 财报排雷清单——本篇书卡主提炼：把\"排除法\"变成可打勾的反向清单（财报外信号 → 科目异常 → 操纵识别 → 董事会报告连读），与 读财报看景气（正向三步）配成姊妹篇\n- 关联已有卡：一本书读懂财报（先读：三表框架地基）· 读财报看景气（正向景气验证）· CANSLIM选股法（C/A 盈利加速）· 高估五类（题材 vs 基本面）· 新赛道研究五步法（本卡的直接服务对象）\n\n## 我的感受 / 行动\n1. **肖星和唐朝的分工**：肖星（一本书读懂财报）教\"看得懂\"——三表长什么样、勾稽逻辑；唐朝教\"看得出鬼\"——A 股年报哪个科目是陷阱高发地、财报被操纵会留下什么痕迹。**先看得懂、再看得出鬼，两个能力都要**。\n2. 最该带走的一句话：**\"事反必妖\"**——突然出奇得好或出奇得坏，都要去找背后的解释；找不到可信解释，就从收入、费用、现金流角度怀疑。这与 交易认知偏差 里的\"叙事陷阱\"一脉相承：财报数据是用来挑刺的，不是用来讲故事的。\n3. **对 ETF 玩家的现实意义**：你路线B 关注方向（云计算/软件/半导体）正是老唐点名的**造假高危行业**（税收优惠多+产品不易核查）——但买 ETF 已把\"单股造假暴雷\"分散掉了，排雷清单的用途是**验证赛道景气时确认\"龙头财报可信、行业增长是真的\"**，以及识别\"靠并购吹出来的增长\"（商誉减值雷）。不必用它对单只个股做深度排雷。\n4. 董事会报告\"多年连读 + 同行对比\"的读法值得直接用：研究赛道时把龙头近 3 年董事会报告拉出来，看管理层对行业的判断前后一致吗、危机感足不足——**管理层都乐观时往往是最危险的时候**。\n5. 本书实践入口：观察池里要深入研究一只赛道龙头时，先跑 财报排雷清单 的 A/B 两段（财报外信号 + 科目扫雷），再回 读财报看景气 三步验证景气。\n\n## 本书提炼的知识卡\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 财报排雷清单 | 方法 | 对 ETF 玩家的用途（同上卡）： |",
