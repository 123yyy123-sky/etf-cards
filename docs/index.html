<html lang="zh-CN">
<head>

<title>ETF 知识卡</title>
<style>
:root{
  --bg:#f7f7f5; --card:#fff; --fg:#1c1c1e; --fg2:#6b6b70; --fg3:#9a9aa0;
  --line:rgba(0,0,0,.09); --accent:#185fa5; --accent-bg:#e6f1fb; --ok:#0f6e56; --ok-bg:#e1f5ee;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#111113; --card:#1c1c1f; --fg:#f2f2f4; --fg2:#a0a0a8; --fg3:#6e6e76;
    --line:rgba(255,255,255,.12); --accent:#85b7eb; --accent-bg:#12293f; --ok:#5dcaa5; --ok-bg:#0d2b23; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
body{padding-bottom:64px}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px 18px 10px;
  border-bottom:.5px solid var(--line)}
header h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.2px}
header .sub{font-size:12px;color:var(--fg2);margin-top:2px}
main{padding:16px 18px 24px;max-width:680px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;
  background:var(--card);border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:11px 0 12px;font:inherit;font-size:12px;
  color:var(--fg3);cursor:pointer}
nav button.on{color:var(--accent);font-weight:600}
.card{background:var(--card);border:.5px solid var(--line);border-radius:14px;padding:18px 18px 16px}
.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:6px;
  background:var(--accent-bg);color:var(--accent);letter-spacing:.2px}
.card h2{font-size:20px;margin:12px 0 10px;font-weight:600;letter-spacing:.2px}
.card .one{font-size:14.5px;color:var(--fg2);margin:0}
.acts{display:flex;gap:9px;margin-top:16px}
.acts button{flex:1;font:inherit;font-size:14px;padding:10px 0;border-radius:10px;cursor:pointer;
  border:.5px solid var(--line);background:transparent;color:var(--fg)}
.acts button.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:500}
.acts button.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent;font-weight:500}
.detail{margin-top:18px;padding-top:16px;border-top:.5px solid var(--line);font-size:14.5px;
  display:none;overflow-wrap:break-word}
.detail.show{display:block}
.detail h1,.detail h2,.detail h3{font-size:15px;font-weight:600;margin:18px 0 8px}
.detail h1:first-child,.detail h2:first-child{margin-top:0}
.detail p{margin:9px 0}
.detail ul,.detail ol{margin:9px 0;padding-left:22px}
.detail li{margin:5px 0}
.detail blockquote{margin:10px 0;padding:8px 12px;border-left:2px solid var(--line);
  color:var(--fg2);font-size:13.5px}
.detail table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13px;display:block;overflow-x:auto}
.detail th,.detail td{border:.5px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.detail th{background:var(--bg);font-weight:600;white-space:nowrap}
.detail code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:13px}
.detail hr{border:0;border-top:.5px solid var(--line);margin:16px 0}
.detail strong{font-weight:600}
.sec{margin:22px 0 8px;font-size:13px;color:var(--fg3);letter-spacing:.4px}
.grp{background:var(--card);border:.5px solid var(--line);border-radius:14px;
  margin-bottom:10px;overflow:hidden}
.grp>summary{padding:14px 16px;cursor:pointer;list-style:none;display:flex;
  justify-content:space-between;align-items:center;font-size:15px;font-weight:500}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .n{font-size:12px;color:var(--fg3);font-weight:400}
.sub2{padding:2px 16px 6px}
.sub2 h4{margin:12px 0 6px;font-size:12px;color:var(--fg3);font-weight:500;letter-spacing:.3px}
.row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:.5px solid var(--line);
  cursor:pointer;font-size:14.5px}
.row:last-child{border-bottom:0}
.row .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.row.done .dot{background:var(--ok)}
.row.done span{color:var(--fg2)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 4px}
.stat div{background:var(--card);border:.5px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-weight:600;letter-spacing:-.3px}
.stat span{font-size:12px;color:var(--fg2)}
.g2{margin-bottom:14px}
.g2 .t{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:2px}
.g2 .t em{font-style:normal;color:var(--fg3);font-size:12px}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;
  padding:0 18px 40px;display:none}
.overlay.show{display:block}
.overlay .top{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;
  border-bottom:.5px solid var(--line);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.overlay .top button{font:inherit;font-size:14px;background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
.wrap{max-width:680px;margin:0 auto}
.empty{text-align:center;color:var(--fg3);font-size:13.5px;padding:40px 0}
</style>
</head>

   "oneliner": "人脑出厂自带八种\"亏钱开关\"——它们让人做与利润相反的事，而且本人毫无察觉。",
   "source": "03-知识/概念/交易认知偏差.md",
   "body": "# 交易认知偏差\n\n> 一句话：人脑出厂自带八种\"亏钱开关\"——**它们让人做与利润相反的事，而且本人毫无察觉。**\n\n## 是什么（说人话）\n海龟教材里点名的八大偏差，全部来自行为金融学。它们不是\"知识不够\"，是大脑的出厂设置——知道也会犯，所以要用规则（机械交易系统）绕开。\n\n## 八大偏差清单\n1. **损失厌恶**：怕亏远大于想赚（亏 100 的痛苦 ≈ 赚 200 的快乐）→ 该止损时下不去手\n2. **沉没成本效应**：为\"已经亏掉的钱\"做决策，而不是为\"未来\" → 套牢了死等回本\n3. **处置效应**：急着兑现小盈利、放任亏损变大 → \"赚 2% 就跑、亏了死扛\"的本尊\n4. **结果偏好**：用\"赚没赚\"评判决策对错，不看决策质量 → 亏了就怀疑方法、赚了就忘形\n5. **近期偏好**：最近几笔输赢被放大成\"系统好坏\" → 连亏几次就放弃正期望系统\n6. **锚定效应**：死盯一个参考价（如买入价/最高价）比来比去 → \"回到成本价我就卖\"式执念\n7. **潮流效应**：别人都买所以我也买 → 追热点、接盘侠\n8. **小数定律**：用太少样本下结论 → 试 3 次就判定\"这方法不行\"\n\n## 能举的例子\n- 处置效应 + 损失厌恶 = 你交割单的完美写照：盈利单平均 +2.11 元就跑，亏损单平均 −8.52 元死扛\n- 锚定效应 = \"等它涨回我成本价 1.43 我就卖\"，结果一路扛到割肉\n- 近期偏好 = 连续亏 3 笔就怀疑整套纪律，又开始凭感觉乱来\n\n## 为什么重要 / 常在哪出现\n几乎所有散户亏损都是这八条的组合拳。它们解释了：为什么\"知道\"和\"做到\"之间隔着天堑。应对不是靠意志力，而是**预先写好规则、让执行自动化**（条件单、止损单、突破信号），把决策从\"盘中情绪\"搬到\"盘前清单\"。\n\n## 来源\n海龟交易法则（第二章 揭秘海龟思维 —— 情绪陷阱与八大认知偏差）\n\n## 相关概念 / 方法\n机械交易系统 —— 唯一可靠的解药；期望值 —— 对抗结果偏好；R乘数 —— 用统一标尺记账，避免近期偏好误判",
   "id": "03-知识/概念/交易认知偏差.md"
  },

   "type": "概念",
   "status": "未学",
   "oneliner": "卡尼曼 & 特沃斯基的诺奖理论——人评估结果不看绝对财富，只看相对于\"参照点\"的变化；而且亏损的痛苦约为同等收益快乐的 2~2.5 倍。同一笔钱，被定义成\"亏\"还是\"赚\"，会让同一个人做出完全相反的选择。",
   "source": "03-知识/概念/前景理论.md",
   "body": "# 前景理论\n\n> 一句话：卡尼曼 & 特沃斯基的诺奖理论——人评估结果**不看绝对财富，只看相对于\"参照点\"的变化**；而且**亏损的痛苦约为同等收益快乐的 2~2.5 倍**。**同一笔钱，被定义成\"亏\"还是\"赚\"，会让同一个人做出完全相反的选择。**\n\n## 三大特征（第25–26章）\n\n### ① 参照点依赖\n\n盈亏是相对**参照点**（现状 / 期望 / 买入成本）而非绝对水平。\n\n**原文例（2835 / 2873 行）**：杰克财富 100 万美元、吉尔 900 万美元，两人拿到同样的薪水，**满意度却不同——\"因为他们俩的参照点是不同的\"**。\n\n> \"在判断一张纸上的灰点是深还是浅时，你也需要知道这张纸的颜色如何。**在预测一笔财富的效用之前，你同样需要了解其参考值。**\"\n\n同一组\"问题3 / 问题4\"实验（原文 2911 行）：同样的 1500 美元结局，因参照点（1000 还是 2000）不同，**一个被当成盈利、一个被当成亏损**，选择随之反转。这是对期望效用理论的直接反例。\n\n### ② 损失厌恶\n\n原文 1085 行明确列为系统 1 的特征：\"**对损失的反应比获得更强烈**\"。\n\n> \"你想得到 100 美元而不想失去 100 美元……你只是喜欢得到，不喜欢失去——**几乎可以肯定地说，你对失去的厌恶程度远大于你对得到的喜欢程度。**\"\n\n**系数约 1.5~2.5**（常用 2）。书中经典赌局：\"投硬币正面得 130 美元、背面输 100 美元，你愿意打这个赌吗？\"——大多数人**拒绝**，尽管期望值为正 +15 美元。**要让人们肯赌，赌注大约得开到 2 倍。**\n\n### ③ 敏感度递减\n\n从 0 到 100 的快乐 > 从 100 到 200 的快乐（得失曲线的斜率随幅度递减）。**所以\"再多赚一点\"的边际快感递减，而\"再多亏一点\"的边际痛苦也递减**——后者解释了为什么深度套牢后反而\"麻木不割\"。\n\n## 在投资里长什么样（本卡的价值）\n\n### ① 成本价执念 = 参照点选错了\n\n以**买入价**为参照点，账面涨了叫\"赚\"、跌了叫\"亏\"——**但市场不知道你的成本**。\n\n→ 参照点应该是**内在价值 / 估值**，不是你的成交价（市场先生）。\n\n### ② 处置效应 = 损失厌恶 + 心理账户\n\n原文第32章明说：\"**处置效应是窄框架的一个例子。投资者为她买的每一只股票都开设了账户，并想在关闭每一个账户时都能获利。**\"\n\n→ 于是**卖出赚钱的**（锁定\"获得\"的快感）、**死扛亏钱的**（拒绝\"损失\"的实现）。\n\n**原文算了一笔账**：\"预计卖掉蒂芙尼股（亏损股）而非蓝莓股（盈利股）的**税后额外回报率在第二年是 3.4%**。\"\n\n> \"**在赢利的情况下关闭心理账户会令人心情愉悦，但这种愉悦是你花钱买来的。**\"\n\n### ③ 小赚就跑 + 大亏死扛 → 期望值为负\n\n数学后果：**胜率可以很高，但盈亏比 < 1**（期望值）。用户交割单里\"+2% 就跑、−8% 死扛\"正是标准样本。\n\n### ④ 框架效应\n\n同一事实换个说法（\"存活率 90%\" / \"死亡率 10%\"）选择就变——**语言能操纵决策**。所以**把规则提前写死（止损位、止盈档），比\"每天重新判断\"可靠得多**。\n\n## 对抗手段（不是\"更努力\"，而是\"绕开系统 1\"）\n\n1. **提前写死规则**：止损位 / 止盈档在买入时确定，交给条件单（机械交易系统、离场三闸门）。\n2. **换参照点**：把\"相对我的成本\"换成\"相对我的目标 / 相对估值\"——问\"**以当前价格我会买入吗？**\"，而不是\"我赚了还是亏了？\"\n3. **账户合并看总额**：别给每只股票开心理账户（心理账户）。\n4. **把损失厌恶当工具而非敌人**：正因为亏的痛是赚的 2 倍，**硬止损的执行成本其实远低于死扛的长期痛苦**——这是劝自己动手的最强理由。\n\n## ⚠️ 边界\n\n- 损失厌恶系数（1.5~2.5）是**实验均值**，个体差异大；别拿它当精确参数用。\n- 前景理论**是描述性的，不是规范性的**——它解释人\"实际怎么选\"，不说人\"应该怎么选\"。**知道它不能免疫它**，只能靠规则。\n- **参照点可以被主动选择**：把参照点从\"成本价\"换成\"长期目标\"，是**成本最低的一次认知干预**。\n\n## 来源\n思考快与慢（第25章 事关风险与财富的抉择；第26章 更人性化的前景理论；第27章 禀赋效应；第32章 心理账户）\n\n## 相关概念 / 方法\n系统1与系统2 —— 前景理论三特征都属系统1；心理账户 —— 处置效应的另一半机制；交易认知偏差 —— 系统性偏差的总览；损失数 —— 交易系统里对损失的量化处理；期望值 —— 用数学对冲感受；离场三闸门、机械交易系统 —— 用规则替代临场判断；市场先生 —— 参照点该锚在哪里",
   "id": "03-知识/概念/前景理论.md"
  },
  {

   "status": "未学",
   "oneliner": "事情发生后，大脑会自动编一个\"我早就知道\"的故事（后见之明），并且用结果好坏而不是决策过程好坏来评判决策（结果偏见）。这是复盘最大的污染源——它让运气好的人被当成天才，让决策正确但结果不佳的人被骂。",
   "source": "03-知识/概念/后见之明与结果偏见.md",
   "body": "# 后见之明与结果偏见\n\n> 一句话：事情发生后，大脑会自动编一个\"我早就知道\"的故事（**后见之明**），并且用**结果好坏**而不是**决策过程好坏**来评判决策（**结果偏见**）。**这是复盘最大的污染源——它让运气好的人被当成天才，让决策正确但结果不佳的人被骂。**\n\n## 是什么（第19章 \"知道\"的错觉）\n\n### ① 叙事谬误（塔勒布）\n\n原文 2161 行：用来描述\"**存有缺憾的往事是如何影响我们的世界观和我们对未来的预期的**\"。\n\n> \"能够吸引人们眼球的那些说法往往很通俗易懂……它们认为**天资、愚蠢和意图的作用都要超过运气的作用**，它们关注的是**少数几件已经发生的重大事件，而不是无数件并没有发生的事**。\"\n\n→ 我们只看到\"发生了的那一条路径\"，看不到无数条没发生的路径。**这使一切历史都显得比它实际更有因果、更可解释。**\n\n### ② 后见之明（费斯科霍夫 & 贝斯）\n\n**尼克松访华实验（原文 2187 行）**：在尼克松 1972 年访华 / 访苏**之前**，让受试者评估 15 种结果的可能性；**事后**再问他们\"当初觉得多可能\"——答案被结果系统性改写（发生过的被认为\"当初就该预见到\"）。\n\n> \"**你无法重构过去的想法，这种情况会不可避免地导致你低估自己受往事影响的程度。**\"\n\n### ③ 结果偏见——原文最锋利的一段（2191 行）\n\n> \"后见之明的偏见对决策者的评估行为有着恶劣影响，它导致观察者**不是根据判断过程的合理性来评估一个判断的好坏，而是以结果的好坏作为判断标准**。\"\n>\n> \"若结果很糟糕，客户常会责备代理人没有看清墙上的笔迹——**却忘了这笔迹原是用隐形墨水写成的，只有在事后才能变得清晰可辨。**\"\n\n**实证（德卢斯洪水监控器实验）**：只看决策时材料的一组 **24%** 认为该买；被告知\"果然发了洪水\"的一组 **56%** 认为该买——**即使明确提醒别受后见之明影响**。\n\n> \"**结果越糟糕，后见之明的偏见就越严重。**\"\n\n### ④ 后果\n\n- **决策者变得不愿冒险**：医生\"要求患者作更多检查，请教专家更多病例，采用保守疗法，即使这些方法未必奏效也要用。**这些行为与其说对病人有益，倒不如说是保护了医生**。\"\n- **幸运的冒险者获得不该得的光环**：\"几次幸运的冒险便会给一个不顾后果的领导人罩上耀眼的光环：**极富远见、英勇果敢**。\"\n- **光环效应 + 结果偏见** = 为什么\"成功企业之道\"类书籍有吸引力（只研究活下来的公司，倒推它们的\"共同特质\"——《基业长青》即被点名）。\n\n## 对用户最直接的价值（复盘纪律）\n\n### ① 打分打\"决策质量\"，不打\"盈亏\"\n\n这是交割单复盘的正确姿势（呼应 为结果负责）：\n\n- 一笔**按规则买、按规则止损**的单子，**即使亏钱也是正确的决策**；\n- 一笔**凭感觉追高、侥幸赚钱**的单子，**是错误决策**——**奖励它会让你下次真正亏钱**。\n\n### ② 复盘时刻意隔离结果\n\n**先写下\"当时的依据\"**（消息面 / 技术位 / 纪律条款），**再**看结果。\n\n> **顺序错了，记忆会自动篡改依据。**（这就是尼克松实验在日常里的版本）\n\n### ③ 区分\"运气\"与\"技术\"\n\n一次成功不构成证据——马克斯也引了那句：\"**硬币即使连续抛出了 10 次正面，第 11 次出现正面的概率仍然是 50%。**\"\n\n→ 只有**跨越周期的重复表现**才有信息量（偶然性与实力判断、增值的不对称性）。\n\n### ④ 警惕\"事后复盘出的规律\"\n\n任何从\"少数几件已发生的事\"里总结的规律，都可能只是叙事谬误。\n\n> **先问一句：\"那些没发生的情况呢？\"** —— 这一问能过滤掉大半的\"悟道\"。\n\n## ⚠️ 边界\n\n- **不是\"结果不重要\"**：结果当然要记录、要统计——**只是不能用单次结果评价单次决策**。长期结果分布才是技术的证据。\n- **也不是\"错了也不能说\"**：如果决策**过程本身**就有缺陷（没看纪律、没设止损、凭情绪下单），**那本身就是低质量决策**，与结果无关。**本卡反对的是\"以果论因\"，不是反对复盘。**\n\n## 来源\n思考快与慢（第19章 \"知道\"的错觉）\n\n## 相关概念 / 方法\n系统1与系统2 —— 系统1 的意义构建本能；交易认知偏差 —— 偏差总览；为结果负责 —— 决策质量导向的复盘；偶然性与实力判断 —— 怎么区分运气与技术；增值的不对称性 —— 用长期分布而非单次结果评判；概率思维 —— 用概率而非故事理解结果；外部意见预测法 —— 对抗\"我的判断很准\"的错觉",

   "source": "03-知识/方法/外部意见预测法.md",
   "body": "# 外部意见预测法\n\n> 一句话：预测任何事（项目工期、投资收益、减肥成果）时，**先别管你自己这件事的特殊细节，去查\"和它同类的那些事，历史上到底结果如何\"，用那组统计数字做基准预测，再调整**。这一招专治\"规划谬误\"——人对自己项目的估计总是乐观到离谱，因为只看内部、不看同类。\n\n## 具体怎么做（步骤化）\n卡尼曼在以色列教育部课程教材案例中发现了两种预测：\n- **内部意见**（人人天然会用）：盯着自己项目的细节做计划，外推当前进度 → 他们估计 2 年写完\n- **外部意见**（几乎没人主动用）：问\"和我们类似的团队，实际用了多久？失败率多少？\" → 同类项目失败率 40%、成功者平均 7~10 年（实际 8 年才写完，且从未被采用）\n\n正确的预测流程（参考类别预测，三步）：\n\n**Step 1 识别参考类别**：找到\"和我这件事同类\"的一组案例。关键是找对类别——\n- 估一本书写完时间 → 参考类别=\"同类教材编写项目\"\n- 估一笔投资回报 → 参考类别=\"同类型资产/策略的历史长期回报区间\"\n- 估一个学习计划达标 → 参考类别=\"有同样起点的人实际达成率\"\n- 原则：**类别要足够大、足够像**；案例独特性说得越玄，越该警惕（\"每一个案例都是独特的\"往往是拒绝外部意见的借口）。\n\n**Step 2 用该类别的基础比率做基准预测**：\n- 查这组同类案例的实际分布：成功/失败比例、典型耗时、典型收益、典型超支幅度（如全球铁路项目平均成本超支 45%、乘客量高估 106%；厨房改造预算超支约 1 倍；课程项目 40% 失败、成功者 7-10 年）\n- 如果你的信息只有\"它属于这个类别\"，基准预测就是该类别的平均值/中位数\n- 这一步不需要任何关于你项目的细节——这正是它反直觉但有效的关键。\n\n**Step 3 有充分理由才偏离基准**：\n- 只有当你**能指出本项目与参考类别有实质、可验证的差异**时，才在基准上调整（例如：\"我的方法已被 3 个同类项目验证过提速 40%\"）\n- 调整幅度要克制；**\"我们更努力/我们更聪明/我们情况特殊\"不是调整理由**（这正是当年课程团队的错觉）\n- 警惕两种反向污染：①乐观偏差（为让计划获批而故意报低）；②一旦开工，沉没成本会让团队\"非理性坚持\"（明知该放弃却继续加注）。\n\n**配套心法**：\n- 采纳外部意见**永远不是自然而然发生的**——需要主动问\"同类案例数据在哪\"；就算听到了，人也倾向于\"注意到但立刻忽略\"（基础比率忽视）。\n- 组织层面：奖励\"计划精准现实\"的规划者，惩罚\"只报喜\"的乐观计划；重大决策由审批方强制索取外部意见，而不是由执行方自报。\n\n## 能举的例子\n- 例 1（本书）：课程教材项目——内部估计 2 年（区间 1.5~2.5 年），外部基准=40% 失败、成功者 7-10 年。卡尼曼承认：理性上当天就该放弃。\n- 例 2（投资）：定投预期——内部意见：\"现在低估，未来 3 年翻倍\"；外部意见：宽基指数长期年化约 8-10%，**历史上任何 3 年既可能 +50% 也可能 −30%**。用外部基准做预期，就不会因短期不达预期而破坏纪律（呼应 盈利收益率定投法 的\"用估值买、不预测涨幅\"）。\n- 例 3（学习/人生计划）：想\"3 个月学会 Python 并做出项目\"——参考类别=\"零基础成年人自学编程的 3 个月完成率\"（大概率远低于想象），再决定要不要把目标/时间调现实。\n- 例 4（复盘）：一只股票\"我觉得它会涨所以买了\"——参考类别=\"凭感觉买入的胜率\"（散户追涨杀跌长期亏），外部意见会告诉你这不是好决策，无论这次赚没赚。\n\n## 为什么重要 / 常在哪出现\n- **规划谬误无处不在**：90% 的铁路项目高估客流、厨房改造普遍超支一倍、新苏格兰议会大厦预算从 4000 万英镑涨到 4.31 亿。个人版本：计划永远完不成、预算永远不够花、投资预期永远太乐观。\n- 它把 系统1与系统2 的处方落地：内部意见=系统1 的流畅故事（我看到了清晰的路径），外部意见=系统2 该查的统计（同类真实分布）——**用统计逼系统2 上岗**。\n- 它与\"承认无法预测宏观\"一脉相承：单点预测不可靠，**分布/基准才可靠**——这正是投资里\"不猜点位、按估值区间和纪律行动\"的认知基础。\n\n## 来源\n思考快与慢（第21章 直觉判断与公式运算孰优孰劣 + 第22章 何时相信专家直觉 + 第23章 努力养成采纳外部意见的决策习惯——教材课程案例、参考类别预测三步法）\n\n## 相关概念 / 方法\n系统1与系统2 —— 内部意见是系统1 的产物；概率思维 —— 用分布代替点预测；均值回归 —— 基准预测的统计依据；为结果负责 —— 复盘用\"决策质量\"而非结果；盈利收益率定投法 —— 投资版的外部基准（估值分位替代拍脑袋目标）",

   "oneliner": "人会把同一笔钱分门别类装进不同\"账户\"（零花钱 / 生活费 / 投资钱 / 意外之财），并违反\"金钱可替代\"这条基本经济原理——同样 100 元，来源和标签不同，花起来的心理成本完全不同。",
   "source": "03-知识/概念/心理账户.md",
   "body": "# 心理账户\n\n> 一句话：人会把**同一笔钱分门别类装进不同\"账户\"**（零花钱 / 生活费 / 投资钱 / 意外之财），并违反\"金钱可替代\"这条基本经济原理——**同样 100 元，来源和标签不同，花起来的心理成本完全不同。**\n\n## 是什么（第31–32章）\n\n**定义（原文 3615 行）**：\n\n> \"心理账户是我们用于组织和经营生活的账户，它有弊也有利，并且有多种来源。现实生活中，我们可能会将自己的钱存在不同的银行账户里，而有时我们仅仅是将钱存在了**不同的心理账户**中。我们有零用钱和普通存款，也有支付孩子教育费用或急诊的预留存款。……\"\n\n**它为什么存在——为了自我控制（原文）**：\n\n> \"就像为家庭开支作预算、限制每天喝黑咖啡的数量或是增加锻炼时间一样，**存款也是为了自我控制**。通常我们会为了自我控制而付出代价，例如，**一面把钱存入储蓄账户，一面却透支信用卡**。\"\n\n**它是\"窄框架\"的一种形式**：\"对于人类来说，心理账户是窄框架的一种形式；他们通过有限的大脑使所有事情都得到掌控，易于管理。\"\n\n## 四个经典证据（原文）\n\n### ① 球赛门票实验（3621 行）\n\n自己**买票**的人比朋友**送票**的人更可能冒着暴风雪去看比赛。\n\n原因：错过比赛等于\"**关闭账户**\"；买票的人账户里还有已支付的票款，**待在家里更糟**。\n\n> \"在标准的经济学理论中……经济人可能会意识到这张票已经付了钱，而且已经不能退换。**票的成本已经'沉没'了**……但只有积极的、受过相关训练的大脑才会想到提出这个难题。\"\n\n### ② 处置效应（3629 行）\n\n投资者给每只股票开一个账户，\"**想在关闭每一个账户时都能获利**\"→ 卖赚的、扛亏的。\n\n**代价（原文）**：因税收与动量效应，**卖亏不卖盈的第二年税后额外回报率约 3.4%**。\n\n> \"**在赢利的情况下关闭心理账户会令人心情愉悦，但这种愉悦是你花钱买来的。**\"\n\n### ③ 沉没成本与代理问题（3637 行）\n\n公司高管不愿撤销失败项目——\"撤销这个项目会给高管的履历上留下难以抹掉的污点\"，于是继续投入。\n\n**董事会视角的关键句**：换 CEO 的实际理由常常不是能力，而是——\"**新的总裁不会有与原总裁一样的心理账户**，在评估当前机会的选择时，他也就更容易忽视过去投资的沉没成本。\"\n\n→ **换人，本质上是换掉一套心理账户。** 这对个人投资者的启示：**\"换个身份重新看\"**（问\"如果我今天空仓，我会买入它吗？\"）就是给自己换账户。\n\n### ④ 赌场 / 意外之财\n\n赌场赢来的钱花得更大方；\"钱就是钱，并没有多大区别\"（原文 3713 行）。\n\n## 在投资里的四种表现（本卡价值）\n\n| 表现 | 机制 | 对策 |\n|---|---|---|\n| **分红 / 利息当\"白来的钱\"花掉** | 分红其实是净值的减少（分红再投入与填权） | **默认再投入**，不设为可支配收入 |\n| **\"本金不能动，收益可以花\"** | 收益被归入另一个账户 | 对长期复利是重大漏损（复利三来源 第三条） |\n| **止损时说\"我先把这只的回本，再动别的\"** | 把组合当若干独立账户，而非一个总仓位 | **合并看总额与总风险**（资金管理四上限 是账户级红线） |\n| **\"逆回购 / 打新赚的零钱随便花\"** | 同源 | 归入总资产 |\n\n## 怎么对抗（可执行）\n\n1. **一个总账户视角**：只看**总资产 + 总风险敞口**。\n2. **不区分钱来源**：分红、利息、意外之财、工资 → **同一张资产负债表**。\n3. **买前问一句**：\"**我会用我全部的钱做这笔交易吗？**\"（把决策放到总账户里评估）\n4. **反过来利用它**：给\"投机 / 玩乐\"的钱**提前设一个明确上限的账户**（马尔基尔的\"输得起的钱\"、余钱投资三原则）——因为心理账户对**约束消费**是有用的（原文也承认\"**有弊也有利**\"）。\n\n> **用它的自律功能，不用它的自欺功能。** 这是本卡的操作要旨。\n\n## ⚠️ 边界\n\n- 心理账户**不全是坏事**：原文明确说它可以\"为了自我控制\"服务。**强制储蓄、专款专用、给投机封顶**都是它的正面用法。\n- **别走向另一个极端**：把\"金钱完全可替代\"教条化，会导致**没有预算、没有边界**——那又是另一种失控。\n- 与 前景理论 的关系：**前景理论是引擎（参照点 + 损失厌恶），心理账户是它的记账方式**。\n\n## 来源\n思考快与慢（第31章 能带来长远收益的风险政策；第32章 心理账户是如何影响我们的选择的？）\n\n## 相关概念 / 方法\n前景理论 —— 损失厌恶是心理账户的动力；系统1与系统2 —— 窄框架的认知根源；交易认知偏差 —— 偏差总览；资金管理四上限 —— 用总账户取代分散小账户；分红再投入与填权、复利三来源 —— 被心理账户漏掉的复利；余钱投资三原则 —— 心理账户的正面用法",
   "id": "03-知识/概念/心理账户.md"

   "oneliner": "人脑有两套决策系统——系统1（快）自动、无意识、靠直觉和联想，默认开启、永远关不掉；系统2（慢）费力、需专注、靠逻辑与计算，又懒又容易偷懒。绝大多数判断失误不是\"知识不够\"，而是系统1 越权拍板、系统2 懒得复核。对策：重大决策不跟直觉走，用清单/公式/规则逼系统2 上岗。",
   "source": "03-知识/概念/系统1与系统2.md",
   "body": "# 系统1与系统2\n\n> 一句话：人脑有两套决策系统——**系统1（快）自动、无意识、靠直觉和联想，默认开启、永远关不掉；系统2（慢）费力、需专注、靠逻辑与计算，又懒又容易偷懒**。绝大多数判断失误不是\"知识不够\"，而是**系统1 越权拍板、系统2 懒得复核**。对策：重大决策不跟直觉走，用清单/公式/规则逼系统2 上岗。\n\n## 是什么（说人话）\n卡尼曼用\"两个角色\"描述大脑（第1-3章）：\n\n**系统1 —— 自动导航**（愤怒的脸：一眼看出她在生气）\n- 运行特征：快、无意识、不费力、自主运行（2+2=?、读出广告牌的字、察觉语气不友善、躲避突然的障碍）\n- 工作机制：靠**联想记忆**把相关概念互相激活，自动给眼前的事编一个\"连贯的解释\"；喜欢**认知放松**（熟悉/好读/有押韵的东西更容易被它当真）\n- 拿手好戏：专家级直觉——象棋大师看一眼棋局、消防队长感到\"不对劲\"（**前提：大量重复练习 + 即时反馈的高有效性环境**）\n- 致命弱点：**遇难题时偷换问题**（把\"该不该买这只股票\"换成\"我喜欢这家公司吗\"）；迷信小样本、因果关系、生动故事；关不掉——看到认识的字就会读出来\n\n**系统2 —— 理性驾驶**（17×24：要动笔算）\n- 运行特征：慢、费力、需集中注意力、能做复杂运算和逻辑推理（系统2 一运转，瞳孔放大、心跳加快）\n- 运行条件：**注意力是稀缺资源**——同时做两件费脑力的事会互相干扰甚至失败；用多了会\"自我损耗\"（连续做艰难决定后，自控力下降）\n- 真实地位：**懒惰的掌控者**——它通常只是给系统1 的建议盖个章（\"你一般会相信自己的最初印象\"），只在遇到惊讶/困难/违反预期时才真正接管\n\n## 能举的例子\n- 例 1（偷换问题）：那位买福特千万美元股票的首席投资官——他面对的真问题是\"福特股票值不值得买\"（难），系统1 秒答的是\"我喜欢福特车吗\"（易），他就以为自己回答了前者。\n- 例 2（看不见的大猩猩）：专心数传球的人，看不见捶胸走过的大猩猩——**专注=屏蔽**，系统2 忙时，系统1 照常漏报关键信息。\n- 例 3（懒惰复核）：琳达问题——\"琳达是银行出纳\" vs \"琳达是银行出纳且积极参与女权运动\"，多数人选后者（更\"像\"她），违反逻辑（合取的概率不可能更大）。系统2 没复核。\n- 例 4（投资）：牛市里\"这次不一样，还能涨\"是系统1 的流畅故事；\"按估值现在该减仓\"是系统2 的结论——但系统2 输给系统1 的舒适感。\n\n## 为什么重要 / 常在哪出现\n- **它解释了一切\"知行不合一\"**：知道止损重要（系统2 懂），盘中还是扛单（系统1 的损失厌恶 + 故事惯性更强）。\n- 交易认知偏差 的八大偏差、钟摆与周期 的群体疯狂、第二层次思维 要对抗的\"第一层次直觉\"，**病理机制全部在系统1**。\n- 系统2 的懒惰不是缺陷而是节能设计（多数场景系统1 够用且高效）——问题只出在**高 stakes 决策也交给系统1**。\n\n## 推论（决策上意味着什么）\n1. **重大决策前强制启动系统2**：用清单（买前核对估值/止损位/仓位上限）、用公式（外部意见预测法）、用纸笔（写下来=逼系统2 上线），别在脑内凭感觉定。\n2. **识别\"偷换问题\"**：问自己\"我正在回答的是原来那个问题吗？\"——把\"我喜欢它吗/它最近涨得好吗\"和\"它值这个价吗\"分开。\n3. **别在精力枯竭时做决定**：连续盯盘/连续决策后系统2 自我损耗，此时做的判断会退回系统1——重要决定放精力好的时段。\n4. **对\"专家直觉\"分级**：只有高有效性环境（短线高频+即时反馈的领域）才信直觉；长期预测、选股、宏观判断属低有效性环境，**用公式和纪律代替直觉**（机械交易系统、防御型投资者纪律、定投规则）。\n5. **复盘警惕后见之明**：事后大脑会自动重写记忆，让你觉得\"我早就知道会跌\"——复盘只认当时的记录与决策依据，不认现在的记忆。\n\n## 来源\n思考快与慢（第一部分 系统1，系统2：第1-3章 双系统定义与注意力、第4-5章 联想与认知放松、第8-9章 启发法与问题替换）\n\n## 相关概念 / 方法\n交易认知偏差 —— 系统1 八大亏钱开关的清单化；外部意见预测法 —— 用基准统计强制系统2 上岗；机械交易系统 —— 把决策从系统1 手里拿走；安全边际 / 防御型投资者纪律 —— \"按纪律而非感觉\"的价值投资版系统2",

   "oneliner": "马尔基尔把\"普通人怎么投资\"分成三条路——省心省力（买指数基金）/ 亲力亲为（自己选股，附四条规则）/ 雇个替身（找投资经理）。他的建议很明确：核心必须省心省力；想玩就另拨一小笔钱去亲力亲为；雇替身基本不划算。",
   "source": "03-知识/方法/三种漫步步伐.md",
   "body": "# 三种漫步步伐\n\n> 一句话：马尔基尔把\"普通人怎么投资\"分成三条路——**省心省力**（买指数基金）/ **亲力亲为**（自己选股，附四条规则）/ **雇个替身**（找投资经理）。他的建议很明确：**核心必须省心省力；想玩就另拨一小笔钱去亲力亲为；雇替身基本不划算。**\n\n## 三条路（第15章 三种步伐漫步华尔街）\n\n原文 5351 行：\"大致说来，有三种方式，我称之为'**省心省力漫步法**''**亲力亲为漫步法**'和'**使用替身漫步法**'。\"\n\n### 一、省心省力漫步法：投资指数基金\n\n**原文 5408 行**：\n\n> \"若想省心省力、支付最低费用就得到市场回报率，投资指数基金正是一种明智而有效的方法。\"\n\n**好处（原文）**：\n- 极广泛的多样化——**少量资金也能覆盖全市场**；\n- 减少经纪费用；\n- 基金替你处理股利派发与再投资。\n\n**作者立场**：\"至少**每一个投资组合的核心部分**应该做到指数化。\"\n\n**A 股落地**：宽基 ETF（沪深300 ＋ 中证500 / 中证1000，或中证全指），别只押一个（见 指数化投资 与本书\"别只买标普500\"的提醒）。\n\n### 二、亲力亲为漫步法：可资使用的选股四条规则\n\n原文 5512–5539 行。作者说这是 **45 年前在第1版提出**的规则，\"我发现这些规则**今天依然适用**\"。\n\n| 规则 | 原文要点 |\n|---|---|\n| **规则1** | 所购股票限于**盈利增长看起来至少能够连续五年超过平均水平**的公司。\"持续不断的成长不仅会提高其盈利和股利，而且还可能提升市场愿意赋予其股票的市盈率\"——**双重潜在好处**。 |\n| **规则2** | **绝不能为一只股票支付超过其坚实基础价值所能合理解释的价格**。买入\"市盈率与整个市场的市盈率持平或高出不多\"的股票；\"小心提防市盈率已很高、未来多年增长已在价格中折现的股票\"。作者特意注明：**这不是\"买低市盈率\"策略**，而是\"**经过调整的低市盈率**\"（即 GARP，\"以合理价格买入增长\"）——\"买入其市盈率相对于其增长前景比较低的股票\"。 |\n| **规则3** | **买入\"投资者可以在其预期增长故事之上建立空中楼阁\"的股票会有帮助。** 要扪心自问：\"你手里股票的故事是否能引起大众的喜爱？这个故事能生发出富有感染力的梦想吗？\" |\n| **规则4** | **尽可能少交易。** 赞成\"继续持有赚钱的股票，抛掉赔钱的股票\"——但**不是因为相信技术分析**；\"频繁换股只会让你贴补经纪人，并在实现资本利得时加重自己的税收负担\"。作者对自己的实操：\"只要我持有的股票已造成了损失，我总会在每个日历年的年底之前将它们卖掉\"（用亏损抵税）。**\"我对赔钱的股票毫不留情。\"** |\n\n**规则3 是把两套定价理论合体**：**基础要实**（规则1、2），**楼阁要有人盖**（规则3）——见 坚实基础理论与空中楼阁理论。\n\n**① 规则4 的本质是\"处盈置亏的反面\"**：教科书里散户的通病是\"卖赚的、扛亏的\"（前景理论 的处置效应）；马尔基尔要求**反着来**——这与 让利润奔跑、欧奈尔买卖纪律 同源。\n\n**② 并存的硬前提（原文 5548 行）**：\n\n> \"如果你的确想自己挑选股票，我强烈建议你采用**混合策略**：将你投资组合的**核心部分进行指数化投资**，将**能承担得起更大的风险的那部分钱**用于选股游戏。\"\n\n### 三、使用替身漫步法：雇请华尔街的专业漫步者\n\n作者在**第12版撤掉了原先推荐的明星经理名单**，两个理由（原文 5556–5560 行）：\n\n1. 除巴菲特外这些经理**都已退休**，而巴菲特本人近五年**也落后于标普500**，且现在强烈赞成指数化投资；\n2. **\"我越来越确信，共同基金经理以往的投资记录对于预测其未来能否成功，根本就毫无价值。\"** 他检验过多种\"买过去业绩最好的基金\"策略——**都不能持续跑赢市场**。\n\n**若非要选基金，唯二可用的预测变量（原文 5568 行）**：\n\n> \"有两个变量在预测基金未来表现方面最可靠，就是**管理费率**和**仓位周转率**。……表现最好的主动管理型基金，其管理费率和仓位周转率都很适中。\"\n\n引博格：**\"你所得到的，是你没有付出去的。\"**（→ 成本拖累）\n\n## 对用户的意义（本卡的直接用途）\n\n**用户的现状 = 省心省力（路线 A）+ 亲力亲为（路线 B）的混合策略**——这正是马尔基尔推荐的形态。本卡给出一条**判断边界**：\n\n- **路线 A 的资金 = 输不起的钱**（退休 / 长期）→ **必须指数化 + 省心**，不该拿来做判断游戏；\n- **路线 B 的资金 = 明确划出\"输得起\"的部分** → 允许亲力亲为，但**必须封顶比例**（资金管理四上限、余钱投资三原则）。\n\n**四条规则可直接当路线 B 的自检清单**：\n\n1. 标的有 ≥5 年超平均的盈利增长吗？——**题材股大多不满足**，那说明你在做规则 3（空中楼阁）的事，**必须用止损而不是死守**；\n2. 我买的价格有基础支撑吗？\n3. 我是不是在期待\"大众会喜欢这个故事\"？（如果是——这就是博傻，**止损纪律必须提前设死**）\n4. 我的交易频率是不是在给券商打工？（对照 成本口径与止损基准 算成本账）\n\n## ⚠️ 边界\n\n- 四条规则的**自评胜率极低**——作者本人说\"任何人想持续不断地战胜市场，其机会都是微乎其微的\"，并承认\"**在选股游戏中获得优胜的人可能主要还是得益于幸运女神的眷顾**\"。\n- \"雇替身\"不是完全不能做，而是**别用历史业绩做选择依据**，只能用**费率与换手率**这两个变量。\n\n## 来源\n漫步华尔街（第15章 三种步伐漫步华尔街）\n\n## 相关方法\n指数化投资 —— 第一条步伐的原理；成本拖累 —— 第三条步伐里\"唯二可用变量\"的根据；随机漫步 —— 三条步伐的共同理论前提；坚实基础理论与空中楼阁理论 —— 规则1–3 的思想来源；核心-卫星策略 —— 混合策略的组合化；资金管理四上限、余钱投资三原则 —— \"输得起的钱\"如何划界",

   "oneliner": "\"我们的目标不在于'买好的'，而在于'买得好'。\" 好公司 ≠ 好投资——因为好公司人人皆知、价格已经反映；回报主要来自你付的价格，而不是标的的品质。",
   "source": "03-知识/方法/买得好而不是买好的.md",
   "body": "# 买得好而不是买好的\n\n> 一句话：**\"我们的目标不在于'买好的'，而在于'买得好'。\"** 好公司 ≠ 好投资——因为好公司人人皆知、价格已经反映；**回报主要来自你付的价格，而不是标的的品质。**\n\n## 是什么（第4章 价格与价值的关系 / 第12章 寻找便宜货）\n\n**第4章的核心论断（原文 3852 行）**：\n\n> \"构成我们所寻找的杰出投资的要素是什么？正如我在第4章所提到的，**价格是主要因素**。我们的目标不在于'买好的'，而在于'**买得好**'。因此，**关键不在于你买什么，而在于你用多少钱买**。\"\n\n**译者导读的拆解（原文 88 / 94 行）**：\n\n> \"'买好的'说的是**价值**，'买的好'说的是**价格**。价值评估和价格判断，是价值投资的一体两面，**缺一不可**。\"\n>\n> \"股票价格的形成受三方面因素的约束：一是公司基本面因素，二是市场技术因素，三是人的心理因素。\"\n>\n> \"马克斯说：'**投资者心理几乎可以导致证券在短期内出现任何定价，而无论其基本面如何。**'\"\n\n**第12章 寻找便宜货（原文 6334 行）**：\n\n> \"导致资产低于价值出售的原因是什么？**买入机会存在的主要原因是对现实认识不足。** 高品质是显而易见的，发现便宜货则需要敏锐的洞察力。出于这个原因，**投资者往往把客观优点误以为是投资机会**。优秀的投资者却从未忘记，他们的目标是**买得好，而不是买好的**。\"\n\n**第18章 呼应**：\"成功的投资不在于'买好的'，而在于'买得好'。\"\n\n## 三条推论\n\n### 1. \"好公司\"的溢价是陷阱\n\n品质是**公开信息**，已经被定价。你为品质多付的钱，**不会带来超额回报**——它只是把别人的确定性转移给了你，代价是未来的收益空间。\n\n历史注脚：1970 年代的\"漂亮 50\"、2000 年的科技龙头、2021 年的核心资产——**公司都还是好公司，但价格让随后数年不赚钱**。\n\n### 2. 便宜货长在\"不受欢迎\"的地方\n\n因为便宜来自**认知缺口**（临时性利空、被冷落的行业、看不懂的新事物），而不是来自**品质缺陷**。\n\n> 这与 钟摆与周期 是同一枚硬币：**钟摆摆到悲观端时，好资产也会被当成坏资产卖。**\n\n### 3. \"买得好\"是可被检验的\n\n买入时能不能用一句话说出\"**我为什么比市场更懂它（或更有耐心）**\"？\n\n- 说不出 → 你只是**买了个好东西**，没买好价格 → 这笔的回报预期应该下调到\"跟随基本面增长\"，**不该指望超额**。\n- 说得出 → 你才可能在价格上占到了便宜。\n\n## 对用户双路线的映射\n\n| | 路线 A | 路线 B |\n|---|---|---|\n| 买的方式 | **低估定投**（盈利收益率定投法）——不择股，只择估值 | 通常是在买\"好故事 / 好赛道 / 好趋势\" |\n| 对应本卡 | **比路线 B 更接近马克斯的哲学** | 属于\"买好的\"，**必须靠别的机制赚钱** |\n\n**给路线 B 的自检句**（可贴进短线核对表）：\n\n> \"我买的是**好价格**，还是**好故事**？\"\n> ——如果是好故事，那这笔的盈利来源就是\"下一个人出更高价\"（坚实基础理论与空中楼阁理论），**止损必须提前设死**（离场三闸门）。\n\n## ⚠️ 边界与反例\n\n- **译者特别提醒（原文 94 行）**：\"我们**一定不要教条地认为，买入的价格低就是买的好**，上面的例子告诉我们，**有时候买的高也是可以买的好的**。\"\n  → 含义：如果未来增长足够高，**高 PE 买入依然可以是\"买得好\"**——但这要求你真的有**信息 / 认知优势**，而不是\"因为它涨了所以我觉得它还会涨\"。\n- **\"买得好\"不等于\"买最低\"**：是**低于价值**，不是低于昨天。等\"最低点\"是另一种择时陷阱（见 市场先生 的\"不要等到极低才买\"）。\n- **对指数而言，\"买得好\"就是\"买在低估区\"**：不需要精确点，见 低估是一个区域。\n\n## 来源\n投资最重要的事（第4章 价格与价值的关系；第12章 寻找便宜货）\n\n## 相关方法\n安全边际 —— \"买得好\"的量化标准；盈利收益率定投法 —— 路线 A 版的\"买得好\"；钟摆与周期 —— 便宜货为什么会出现；第二层次思维 —— 凭什么比市场更懂；低估是一个区域 —— 可操作的\"够便宜\"；坚实基础理论与空中楼阁理论 —— 我买的是价值还是故事",

   "oneliner": "博格用\"奥卡姆剃刀\"把长期股市回报拆成三块——初始股息率 + 盈利增长率 + 市盈率变化率。前两块是基本面（相对可靠），第三块是投机（会均值回归）。所以，长期回报在你买入的那一刻，就被你付的价格大致决定了。",
   "source": "03-知识/方法/回报三变量公式.md",
   "body": "# 回报三变量公式\n\n> 一句话：博格用\"奥卡姆剃刀\"把长期股市回报拆成**三块**——**初始股息率 + 盈利增长率 + 市盈率变化率**。前两块是基本面（相对可靠），第三块是投机（会均值回归）。**所以，长期回报在你买入的那一刻，就被你付的价格大致决定了。**\n\n## 是什么（第2章 回报的本质：奥卡姆剃刀原则）\n\n博格引 14 世纪英国哲学家威廉·奥卡姆\"**越简单的解释，越有可能正确**\"，把它搬进金融分析（原文 1354 行）：\n\n> \"我挥舞着威廉爵士的剃刀，修剪掉分析方法中所有的旁枝末节，并将投资回报率的来源归于三个必需的部分。\"\n\n**三个变量**：\n\n| 变量 | 性质 | 可靠性 |\n|---|---|---|\n| **① 初始投资时刻的股息率** | 买入当天就能观察到 | 最高（可观测） |\n| **② 随后的盈利增长率** | 由企业创造价值的能力决定 | 较高（长期稳定） |\n| **③ 投资期内市盈率的变化** | 纯粹的市场情绪/投机 | 最低（短期主导、长期趋零） |\n\n**核心论断（原文 1399 行）**：\n\n> \"当时间窗口从 1 年增至 25 年后，**投机的短期影响力消退了**，而投资回报率开始更紧密地、即便不是精确地遵从投资的基本面因素：**股息率和盈利增长率**，这两个要素共同构成了股票回报率的驱动力。\"\n\n**实证锚（原文 1402 行）**：1871—1997 年，经通胀调整后的**实际股息率与盈利增长率之和达到 6.7%**，而同期股市的实际长期回报约 7%——\n\n> \"换句话说，**这个长期实际回报率全部是来自股票的股利增长率和回报率**，它完全等于 7% 的股市自身的实际回报率。而所有其他的因素综合起来……几乎产生不了什么显著的影响。\"\n\n翻译成人话：**一百多年的长期回报，几乎全部来自基本面两项；市盈率变化合计贡献约为零。**\n\n## 五条推论（这是本卡的价值）\n\n1. **买入时的估值决定了长期回报的起点**。股息率（≈ E/P 的一部分）高 → 起始项高。这与 盈利收益率定投法 是**同一件事的两种表述**：螺丝钉用 E/P 阈值做操作，博格用三变量拆解做论证。\n2. **PE 变化是\"借来的\"，终要还**。买入时 PE 高于长期均值，这一项未来大概率为负——**这就是\"高估买入长期也可能不赚钱\"的数学原因**。\n3. **别指望预测，只做\"起点管理\"**。博格明说：\"单个证券的业绩不能预测；在短期，证券投资组合的业绩也无法预测。\"能做的只有——**在股息率/盈利增长占优时买，在估值极端时减**。\n4. **它给\"长期持有\"提供了严格理由**：不是\"长期就一定涨\"，而是**时间越长，第③项的噪音被稀释得越干净**（见 投资的第四维度）。\n5. **它必须与成本项合并看**：三变量算出的是**市场回报**；个人实际拿到的是 **市场回报 − 成本**（见 成本拖累）。**\"低估值买入 + 低成本持有\"是同一个公式的两端。**\n\n## 怎么算（可操作，不要求精确）\n\n**公式**（近似）：\n\n```\n年化回报 ≈ 初始股息率 D + 盈利增长率 g + (退出PE / 买入PE)^(1/N) − 1\n```\n\n**用法（关键）**：把 PE 变化项设成 **0 或负数**做保守估计——**如果即便如此预期回报仍满意，才是一笔好买入。**\n\n**A 股落地**：\n- 股息率：用指数当前股息率（沪深300 近年约 2.5%~3.5%）。\n- 盈利增长率：用**名义 GDP 增速的保守折价**（比如名义 GDP 6%，取企业盈利 5%）替代。\n- PE 变化：不做预测，直接用**估值位置**（低/中/高）做定性保守假设。\n\n## 数字例\n\n假设某宽基：买入股息率 3%、长期盈利增长 6%、持有 5 年。\n\n| 情景 | PE 变化 | 年化回报 |\n|---|---|---|\n| PE 从 15 回落到 12 | −4.4%/年 | ≈ **4.6%** |\n| PE 维持 15 | 0 | ≈ **9.0%** |\n| PE 从 15 升到 18 | +3.7%/年 | ≈ **12.7%** |\n\n**同一指数、同样的盈利增长，只因买入估值不同，长期年化回报差一倍以上。** 这就是\"低估买\"的全部数学依据。\n\n## ⚠️ 边界\n\n- 公式是**近似与解释框架，不是精确预测工具**——博格自己也说\"投资组合的长期业绩同样无法预测\"。\n- 它是**美股长期数据**得出的：系数关系（尤其是股息率与盈利增长的稳定性）在 A 股会打折，但**方向（估值起点决定长期回报）依然成立**。\n- 别把它和\"用 PE 择时\"混为一谈：三变量说的是**长期回报的构成**，不是短期涨跌的预测器。\n\n## 来源\n共同基金常识（第2章 回报的本质：奥卡姆剃刀原则）\n\n## 相关方法\n盈利收益率定投法 —— 同一思想的 A 股操作版；均值回归 —— 为什么第③项终会归零；成本拖累 —— 公式的另一端（市场回报 − 成本）；投资的第四维度 —— 为什么时间能稀释第③项；低估是一个区域 —— 起点管理的可操作区间；安全边际 —— 起点管理的保守化表述",
   "id": "03-知识/方法/回报三变量公式.md"

   "status": "未学",
   "oneliner": "\"涨太多会跌回来，跌太多会涨回去\"——明星基金、热门风格、泡沫板块的业绩，长期都会向平均水平回归。它是金融市场的万有引力，专治\"追热门\"和\"这次不一样\"。",
   "source": "03-知识/概念/均值回归.md",
   "body": "# 均值回归\n\n> 一句话：**\"涨太多会跌回来，跌太多会涨回去\"——明星基金、热门风格、泡沫板块的业绩，长期都会向平均水平回归。它是金融市场的万有引力，专治\"追热门\"和\"这次不一样\"。**\n\n## 是什么（说人话）\n牛顿第三定律：\"每一个力都有一个大小相等、方向相反的反作用力。\"博格认为这是金融市场最贴切的写照。表现形式有三层：\n\n1. **基金业绩回归**：过去业绩最好的基金，未来大概率回归平庸（戈茨曼—伊博森研究：历史领先的基金下个两年期继续领先的概率约 60%，连续 4 个两年期都领先的概率只有约 1/8）。夏普、卡哈特的研究一致：**靠历史业绩选基金，基本等于掷硬币**，而且业绩差的基金常常因为高成本而持续差。\n2. **风格/市场回归**：成长 vs 价值、大盘 vs 小盘、美国 vs 海外——轮番领先。72 年间价值型和成长型基金平均年回报几乎相等（都是 9.7%）；半个世纪里美股与海外股年回报几乎一样（9.1% vs 9.0%）。**没人能靠\"现在押哪个风格\"持续赢**。\n3. **整个股市长期回报回归基本面**：美股 200 多年，任何 25 年滚动期的真实回报 93% 的时间落在 4%~10%（均值 6.7%）。这个均值来自**股息 + 盈利增长**两个基本面，投机（市盈率涨跌）只造成短期偏离，迟早回归。\n\n## 推论（投资上意味着什么）\n1. **别买\"过去一年冠军\"**：追明星基金/热门板块 = 在高点接盘均值回归。你看到它好时，正是它离均值最远、最该回落时。\n2. **别信\"这次不一样\"**：1929、2000 年都有人说\"新时代来了，高估值合理了\"，结果都是均值回归的盛宴。市盈率 25 倍说翻到 100 倍合理？博格用数据告诉你：长期回报终归基本面。\n3. **好消息（对长期投资者）**：均值回归的另一面是\"坏到极致也会回来\"。低估的宽基（见 盈利收益率定投法）长期也会向价值回归——这正是低估定投能赚\"估值修复\"钱的理论基础。\n4. **方法上**：与其预测\"哪个风格/基金接下来会赢\"，不如买下整个市场（指数化投资），让均值回归去工作——你不需要选对，只需要在场。\n\n## 为什么重要 / 常在哪出现\n- 博格全书第 10 章核心，也是他反对主动基金、推崇指数基金的底层论据之一；\n- 直接回应散户最贵的两个教训：**追涨明星基金**、**在风格/板块间反复横跳**；\n- 与 成本拖累 合起来 = 指数基金长期胜出的完整逻辑（主动基金既被成本拖累，又逃不过均值回归）。\n\n## 来源\n共同基金常识（第10章 均值回归：牛顿对华尔街的报复）\n\n## 相关概念 / 方法\n指数化投资 —— 均值回归下的最优应对；成本拖累 —— 主动基金的另一个结构性劣势；金鹅与瘦鹅 —— 均值回归让\"便宜的瘦鹅\"终会恢复健康；交易认知偏差 —— 追热门背后的心理机制",

   "status": "未学",
   "oneliner": "给资产定价只有两条路——坚实基础理论说\"价格由内在价值决定，算出价值就能低买高卖\"（格雷厄姆 / 巴菲特）；空中楼阁理论说\"价格由别人的心理决定，你只要猜到大众会把楼盖到哪\"（凯恩斯 / 行为金融）。绝大多数亏钱，都发生在用第一条理论的话术做第二条理论的事。",
   "source": "03-知识/概念/坚实基础理论与空中楼阁理论.md",
   "body": "# 坚实基础理论与空中楼阁理论\n\n> 一句话：给资产定价只有两条路——**坚实基础理论**说\"价格由内在价值决定，算出价值就能低买高卖\"（格雷厄姆 / 巴菲特）；**空中楼阁理论**说\"价格由别人的心理决定，你只要猜到大众会把楼盖到哪\"（凯恩斯 / 行为金融）。**绝大多数亏钱，都发生在用第一条理论的话术做第二条理论的事。**\n\n## 是什么（第1章 坚实基础与空中楼阁）\n\n马尔基尔开篇指出（原文 771 行）：\n\n> \"传统上，投资界的专业人士一直使用以下两种方法中的一种来给资产估值：**坚实基础理论（firm foundation theory）**与**空中楼阁理论（castle-in-the-air theory）**。基于这两种理论，无数美元盈亏流转。有意思的是，这两种理论看起来相互排斥。如果你想做出明智的投资决策，了解这两种方法是必不可少的，同时，了解这两种方法也是避免铸成大错的前提条件。\"\n\n### 一、坚实基础理论\n\n**主张（原文 779 行）**：每一个投资工具都有一个被称为**内在价值（intrinsic value）**的坚实基础，通过细致分析其现状和前景可以确定它。当市价低于（高于）内在价值时，买入（卖出）的机会就出现了，因为价格波动终会被修正。\n\n**逻辑链**：股票价值 = 未来分配的盈利流的折现 → 必须估计**股利长期增长率 + 超常增长能维持多久**。\n\n**软肋（原文直击 788 行）**：\n\n> \"坚实基础理论依赖于对未来增长率和增长持续期进行棘手的预测，**这正是问题的关键所在。因此，内在价值这一坚实基础可能没有该理论声称的那么可靠。**\"\n\n**信徒**：格雷厄姆 & 多德的《证券分析》→ 华尔街整整一代分析师 → 沃伦·巴菲特（\"奥马哈圣人\"）。\n\n### 二、空中楼阁理论\n\n**主张**：**心理决定价格**。\"对买家来说，一项投资之所以值某一价钱，是因为他**预期会以更高的价钱卖给别人**。换句话说，投资是靠其自身来支撑的。新的买家同样又预期将来的买家愿意支付更高的价钱。\"\n\n**凯恩斯的实践**（原文 799 行）：他认为坚实基础理论\"工作量太大，该理论的价值也令人怀疑\"；自己\"只是每天早晨坐在床上操盘半个小时\"，赚了好几百万英镑，并让**剑桥大学国王学院捐赠基金增长了 10 倍**。\n\n**最著名的类比——报纸选美比赛**（原文 814 行）：你要赢，不是选你认为最美的，而是**猜别人会选谁**。\n\n**同道**：罗伯特·希勒《非理性繁荣》、丹尼尔·卡尼曼（行为金融）、奥斯卡·摩根斯坦（\"寻找股票的内在价值无异于水中捞月、缘木求鱼\"）。摩根斯坦的箴言：\"**任何资产的价值都取决于实际的或潜在的交易。**\"\n\n**软肋（原文 853 行）**：\n\n> \"尽管空中楼阁理论能很好地解释这样的投机狂欢，但要**猜透变化无常的大众的反应，却是极其危险的游戏**。……纯粹依靠心理支持而火箭般蹿升的市场行情，都已不可避免地屈服于金融万有引力定律。高不可攀的价格可能会维持数年之久，但最终总会掉头向下。价格反转下跌如地震般突如其来，而且**狂欢暴饮愈烈，宿醉愈深、愈沉**。\"\n\n## 为什么这张卡对用户特别重要（双路线映射）\n\n**这张卡是全库对\"为什么我走两条路线\"最干净的理论表述：**\n\n| | 路线 A（宽基定投） | 路线 B（题材/行业波段） |\n|---|---|---|\n| 对应理论 | **坚实基础理论** | **空中楼阁理论** |\n| 你赚的是谁的钱 | 价值修正（价格回归价值） | 下一个人出的更高价 |\n| 依据 | 估值（盈利收益率定投法）、安全边际 | 趋势、突破（杯柄突破买点）、情绪接力 |\n| 该配的纪律 | 不设止损、越跌越买 | **必须硬止损**（离场三闸门） |\n\n**两套理论对应两套纪律，绝不能混用：**\n\n- **用坚实基础的话术骗自己做题材股**（\"这公司技术很好/赛道很好\"）→ 亏了会死扛，**因为你以为自己在\"投资\"**，于是取消了止损。这是散户最贵的错误（投资与投机之分）。\n- **用空中楼阁的话术做宽基**（\"沪深300这波要涨\"）→ 涨了会跑、跌了不敢买，**因为你放弃了价值锚**，把长期定投做成了短线博弈。\n\n**自检句（买入前问一次）**：\n\n> \"我赚的是**价值修正**的钱，还是**下一个人出更高价**的钱？\"\n> ——答案决定止损规则：前者不止损，后者硬止损。\n\n## 第三种理论\n\n书里提到，到 20 世纪末学术界诞生了\"**新投资技术**\"（现代投资组合理论等第三种理论），并在华尔街流行——见 现代投资组合理论。\n\n## 来源\n漫步华尔街（第1章 坚实基础与空中楼阁）\n\n## 相关概念 / 方法\n安全边际 —— 坚实基础理论的量化工具；盈利收益率定投法 —— 它在 A 股的机械化实现；杯柄突破买点 —— 空中楼阁理论的图形化买点；随机漫步 —— 对\"两条理论都能被稳定利用\"的双重怀疑；第二层次思维 —— 选美比赛式思考的正名；离场三闸门、双轨并用决策 —— 两套纪律的落地",

   "source": "03-知识/概念/安全边际.md",
   "body": "# 安全边际\n\n> 一句话：**价格与\"指示价值\"之间的顺差（缓冲垫）**——买入价比你算出的价值低多少，你就抗得住多少\"算错 + 坏运气\"。它不只是价值投资的理念，更是唯一能区分\"投资\"与\"投机\"的**试金石**：没有安全边际的买入，本质是赌。\n\n## 是什么（说人话）\n格雷厄姆把成功投资浓缩成四个字：\"安全边际\"（第16章）。在不同标的上它长得不一样：\n\n1. **债券/优先股版（最原始形态）**：安全边际 = 盈利能力对利息的多倍覆盖 + 企业资产对债务的缓冲。\n   - 例：某铁路债券税前盈利须 ≥ 固定利息 5 倍才算\"投资级\"；企业总资产 1000 万、债务后价值 3000 万，则理论上价值先收缩 2/3 债券持有者才受损——这 2/3 就是缓冲。\n2. **普通股版**：安全边际 = 预期盈利能力**显著高于现行债券利率**的部分。\n   - 例：市盈率 9 倍 ≈ 盈利收益率 11%，而债券利率仅 4% → 购买者持有约 7% 的\"年边际\"。10 年周期里股票盈利率超过债券的典型超额量可达所付价格的 50%——这就是一个很实际的缓冲。\n3. **\"低价改造质量\"版**：**价格足够低时，能把原本的劣质/投机级证券变成好投资**。不动产债券在 20 年代按面值卖是投机，30 年代跌去 90% 后，背后真实价值是报价的 4-5 倍，反而安全且有大回报。\n4. **成长股版（反例警告）**：成长股用\"乐观预测的未来收益\"代替\"已实现的过去记录\"来算边际——**市场对热门股的定价，从来不会给保守预测留保护**。所以\"价格过高时，安全边际就小；再高，就没有了\"。成长股投资的死法：判断对了前景，却为期望的繁荣倾囊付出。\n\n## 能举的例子\n- 例 1（A&P，1938）：大西洋太平洋茶叶公司股价从 80 美元跌到 36 美元，市值 1.26 亿，而公司光现金就有 8500 万、净资产 1.34 亿——价格低于清算价值，安全边际厚到\"营业值比清理值还小\"。后来涨到 700 美元（等值）。\n- 例 2（指数定投语境）：上证 3000 点 vs 5000 点买同一只宽基，前者盈利收益率高出一截——**低估区定投本质是在\"安全边际厚\"的位置接货**（见 盈利收益率定投法）。\n- 例 3（反例）：热门成长股 PE 80 倍时买入，安全边际为负——你不是在投资，是在为别人的乐观付费。\n\n## 为什么重要 / 常在哪出现\n- 它是**投资与投机的分界线**：投机者总认为\"时间/技巧/系统对自己有利\"，那是主观判断；投资者靠的是\"统计数据 + 简单确定的算术推理\"——价格低于价值多少，可算、可证。\n- 它把\"预测正确\"从必要条件降级为可选：只要边际够厚、分散够广，**不需要高超的洞察也能赚钱**——\"在 20 种以上股票里都存在边际时，正常条件下获得理想结果的概率很大\"。\n- 主要亏损来源不是买贵了好公司，而是**在有利的商业条件下购买劣质股**（把一时好收益当成永久盈利能力）。\n\n## 推论（投资上意味着什么）\n1. **买入前先算\"价格比价值低多少、凭什么低\"**——说不出边际的买入，一律按投机记账（呼应 双轨并用决策：战术轨也只买\"低估到有边际\"的标的）。\n2. **分散化是安全边际的配套件**：单只证券有边际≠不会亏，只是\"赢的概率 > 输的概率\"；靠多只（如指数）把\"利润总和超过损失总和\"变成确定的事——两者是同一枚硬币（保险公司的经营基础）。\n3. **估值锚用保守数**：对未来收益的乐观估计，等于亲手拆掉自己的安全边际。定投语境里用\"盈利收益率 vs 债券利率\"这类可验证指标，而不是故事。\n4. **警惕\"优质所以贵\"**：再好的公司，价格高了就没有边际——第二层次思维 的\"人人都知道的好不是好\"，底层逻辑正是安全边际被价格吃掉了。\n\n## 来源\n聪明的投资者（第16章 安全边际——投资的核心概念；第2章 A&P 案例）\n\n## 相关概念 / 方法\n第二层次思维 —— 人人皆知的好 = 没有边际；盈利收益率定投法 —— 低估定投 = 在厚边际处接货；钟摆与周期 —— 恐慌端 = 边际最厚处；防御型投资者纪律 —— 用分散+不追高自动获得边际",

   "oneliner": "读财报的第一问是\"这家公司安不安全\"，而不是\"它能涨多少\"——先看营运资金够不够、流动比率/速动比率健不健康、利息保障倍数够不够，再看账面净值与清算价值几何；先保证不亏本，再谈赚钱。这是价值投资读表法的底色。",
   "source": "03-知识/方法/安全边际读表法.md",
   "body": "# 安全边际读表法（格雷厄姆防守三铁律）\n\n> 一句话：读财报的**第一问是\"这家公司安不安全\"，而不是\"它能涨多少\"**——先看营运资金够不够、流动比率/速动比率健不健康、利息保障倍数够不够，再看账面净值与清算价值几何；**先保证不亏本，再谈赚钱**。这是价值投资读表法的底色。\n\n## 是什么\n\n市面上的财报书多数教你\"公司好不好、有没有造假\"；格雷厄姆教你先问\"**公司会不会倒、我的本金安不安全**\"——这是**防守者的语言**，与你的路线A（宽基长期定投、追求安全）气质最合。\n\n**核心信念**：市场价格由大众对未来的预期决定（乐观时远超价值、悲观时远低于价值）；**安全的做法是在价格明显低于价值时买入，用\"安全边际\"吸收判断错误与坏运气**。\n\n## 防守三铁律（工业公司基准，任一显著不达标先降档）\n\n### 铁律一：营运资金必须为正且充裕\n- **营运资金 = 流动资产 − 流动负债**——衡量短期财务实力的**最重要指标**\n- 它回答：能否轻松维持运作？能否扩张而不用重新融资？能否扛住突发事件或暂时亏损？\n- 营运资金为负 = 随时可能因周转不灵而中断经营\n- **速动资产 = 流动资产 − 存货**；正常应**远超**流动负债（存货是最难变现的那块）\n\n### 铁律二：流动比率 ≥ 2:1，速动比率 ≥ 1:1\n- **流动比率 = 流动资产 ÷ 流动负债**（工业公司**最低标准约 2**；铁路/公用事业因存货少可放宽）\n- **速动比率 =（流动资产 − 存货）÷ 流动负债**（更严，**合理值 ≥ 1**）\n- ⚠️ 异常波动（非季节性公司）意味着销售出问题——产品滞销导致存货堆积，或大面积坏账导致应收暴增\n\n### 铁律三：利息保障倍数 ≥ 2.5~3 倍\n- **利息保障倍数 = 可供支付固定支出的收益 ÷ 利息支出**（工业债一般 ≥2.5；高信用等级工业债 ≥3）\n- 优先股看\"**固定支出 + 优先股股息保障倍数**\"（工业优先股建议≥4倍）\n- ⚠️ **绝不要**把高级债券和次级债券分开算保障倍数（会得出\"次级债更安全\"的荒谬结论）\n\n## 辅助判据：账面价值与清算价值\n\n| 概念 | 算法 | 用法 |\n|---|---|---|\n| 有形资产净值 | 账面价值 − 无形资产（商誉/专利等） | **算账面价值一律先扣无形资产**（商誉常一文不值） |\n| 每股账面净值 | 有形资产净值 ÷ 普通股股数 | 与市价比，显著偏离时值得研究 |\n| **流动资产净值** | 营运资金 − 高级证券索偿权 | 工业公司**清算价值的粗略标准** |\n| 清算价值 | 假设清算时资产折价变现后的可分配额 | 资产的实际清算价值**通常远低于账面** |\n\n**格雷厄姆式机会**：**股价低于每股流动资产净值**时值得关注（尽管不保证被低估）。\n\n## 使用要点\n\n1. **检查顺序**：①营运资金为正？②流动比率≥2、速动比率≥1？③利息保障倍数≥2.5~3？④账面价值扣掉无形资产还剩多少？——四条过完，先给这家公司一个\"安全等级\"。\n2. **趋势优先于单点**：格雷厄姆强调**多年平均 > 单年**；**不利趋势的证券不值得买（哪怕当前保障倍数还很高）；有利趋势也别为预期过早支付高价**。买前问两问：①我多大信心趋势会持续？②我为这个预期提前付了多高价格？\n3. **对 ETF 玩家的用法**：\n   - 这套比率是**\"行业体检表\"**——不必对个股逐项深挖，但可用**行业平均**判断某赛道（尤其重资产/高负债行业）的整体财务健康度\n   - 典型警报：**龙头毛利率高、增长快，但利息保障倍数低、流动比率差** = 高杠杆激进扩张 = 周期下行时的风险点\n   - 与 读财报看景气 配合：**看景气负责\"这行业值不值得下注\"，本卡负责\"这条赛道里的公司扛不扛得住\"**\n4. **别当成选股信号**：本卡只是**降档/排除工具**（同 财报排雷清单）——安全 ≠ 该买；买入仍走 ETF交易系统 3A 进场篇。\n\n## 边界与对照\n\n- **时代差异**：本书基于 1935 年美国准则，中国现行 CAS 科目与格式有变化；但**\"先问安全\"的思维完全适用**，且每章附\"专业解读\"已做本土化\n- **不同行业标准不同**：铁路/公用事业流动比率要求可放宽（存货少、应收快）；银行/保险完全不适用本卡\n- **格雷厄姆的落点**：**\"价格便宜时买、价格贵时卖，未必能赚超额利润，但能避免巨额或频繁的损失\"**——这正是定投+纪律的意义\n- 关联认知：防御型投资者纪律（《聪明的投资者》的纪律版）· 余钱投资三原则 · 生命周期资产配置\n\n## 相关链接\n\n像格雷厄姆一样读财报（本卡底层书，34章逐科目+15比率实例）· 读财报看景气（进攻·正向三步）· 财报排雷清单（排雷·反向找鬼）· 会计恒等式与三表勾稽（地基）· 防御型投资者纪律 · 聪明的投资者 · ETF书籍导读（财报区·格雷厄姆篇）",

   "source": "03-知识/概念/市场先生.md",
   "body": "# 市场先生\n\n> 一句话：格雷厄姆的寓言——把市场想成一个每天来给你报价的躁郁症合伙人「市场先生」：情绪好时报天价，情绪差时报地板价。**他的报价是提供给你的服务，不是下达给你的命令；你可以利用他，但绝不能被他的情绪牵着走。**\n\n## 是什么（原寓言）\n\n出处：《聪明的投资者》第2章「投资者与市场波动」末尾（原文 817–821 行）。\n\n- 假设你拥有某私营企业 1000 美元的小额股份。一个叫 **Market先生** 的同伴非常乐于助人，**每天**告诉你他认为你的股份值多少，并提出买你的股份、或卖给你一些。\n- 他有时说得对——\"有时根据你自己对该公司的发展前景的了解，他的想法好像是可行的、正确的\"。**但他经常过于兴奋和担心，有时你甚至觉得他的建议有些愚蠢。**\n- 格雷厄姆的两个关键追问：\n  1. \"如果你是一个自信的投资者和明智的商人，**你会让 Market 每天的意见来决定你对自己 1000 美元股份的看法吗？**\" → 不会。\n  2. 你会在他给\"高得不可思议的价格\"时乐意卖给他、在他给极低价时乐意从他手里买 → **会**。\n- 其余时候：\"你将更加明智地**根据公司关于其运营和经济状况的报告**来形成自己的判断。\"\n\n## 三条操作含义（原文）\n\n1. **真正的投资者的位置**：\"他既可从每天的市场价格中谋取利润，也可以此不予理会。\"\n2. **价格波动只有一个意义**：\"当价格大幅下跌后，提供给投资者购买机会；当价格大幅上涨后，提供给投资者出售机会。而其他时候，他如果忘记股票市场而把注意力放在**股息收入和公司运作状况**上，将会做得更好。\"\n3. **保命格言**：\"**股票剧涨后莫买，股票暴跌后莫卖。**\"\n\n同一小节的收尾一句同样重要：*\"投资者不应仅仅在等到市场价位跌到极低时才购入股票，因为这意味着可能要等较长的时间，从而损失大笔股息收入及大量投资机会。\"*\n\n## 为什么对路线 A 重要\n\n- 它把\"波动\"从**威胁**重新定义成**服务**。路线 A 的\"越跌越买\"在这张卡里就是——**接受市场先生报出的地板价**。\n- 它把\"恐惧\"的根因指了出来：**你把他的报价当成了事实，所以他的抑郁能吓到你**。与 钟摆与周期、均值回归 同源，与 前景理论（损失厌恶）互补。\n- 它给\"拿住\"提供了正当性：既不因上涨而买入，也不因下跌而卖出——**因为他的报价本来就只是报价**。\n\n## ⚠️ 前提与边界（别误用）\n\n- **寓言成立的前提是你对这家公司（或这个指数）有自己的价值判断**（看财报、看估值、看股息）。没有独立判断能力的人，市场先生的话就是**唯一的输入**——此时\"利用他\"就变成了\"被他利用\"。**所以这张卡必须与 盈利收益率定投法、安全边际 配套使用，不能单用。**\n- **与 有效市场假说 有张力**：马尔基尔说价格已折现信息、难以被击败；格雷厄姆说价格经常被情绪扭曲到\"愚蠢\"的程度。两者可以调和：**日常的价格大概率有效（别天天想着占便宜），极端时的价格几乎一定无效（那才是出手时机）**——这正是 双轨并用决策 里\"战术轨只在极端估值启动\"的依据。\n- **别把它当成\"无限抄底\"的许可证**：市场先生的低价可能是对的（公司真的变坏了）。区别在于**指数有均值回归的结构性保证，个股没有**。\n\n## 与其他卡的关系\n\n- 与 坚实基础理论与空中楼阁理论：市场先生对应后者（心理决定价格）——但格雷厄姆的用法是**用前者的价值判断去利用后者的情绪**，两者在他手里合一。\n- 与 第二层次思维：市场先生的情绪就是\"第一层次思维\"的集合体；利用他 = 第二层次。\n- 与 投资相对主义：天天盯着市场先生的报价跟别人比，就是相对主义的起点。\n\n## 来源\n聪明的投资者（第2章 投资者与市场波动 · 末尾寓言）\n\n## 相关概念 / 方法\n钟摆与周期 —— 市场先生的情绪就是钟摆；均值回归 —— 为什么他的极端报价终会回归；安全边际 —— 从他手里低价买的量化标准；第二层次思维 —— 利用他的思维方式；低估是一个区域 —— 他报价\"够便宜\"的可操作区间；前景理论 —— 为什么他的抑郁能吓到你",

   "body": "# 成本拖累\n\n> 一句话：**投资回报 = 市场回报 − 成本。市场能给你的（股息+盈利增长）人人一样，真正拉开差距的是你每年付了多少成本——成本是投资者唯一能完全控制的因素。**\n\n## 是什么（说人话）\n假设市场本身每年给你 10%（长期看主要来自公司盈利增长+分红），你实际拿到多少取决于中间被\"抽水\"多少。主动基金的抽水是层层叠加的：\n\n- **显性费率**：管理费+托管费等，平均约每年 1%；\n- **隐性换手成本**：频繁买卖股票的佣金与冲击成本，又加 0.5%~0.8%/年；\n- **销售费用**：申购费分摊到持有年限，再加 0.5%~1%/年。\n\n合计中值约 **每年 2.5%**。博格的算法很残酷：若股票风险溢价（股票相对债券的超额收益）历史约 3.5%，2.5% 的成本就吃掉了其中的 **71%**——你承担了股票的风险，收益大头却被成本拿走了。\n\n**对比指数基金**：不需要基金经理选股、几乎不换手，费率可低至 0.1%~0.2%，总成本不到主动基金的 1/10。\n\n成本还有个被低估的特性：**它是复利式的、每年都扣**。博格书中计算：10 年期里 2.5%/年 vs 0.2%/年的成本差，累积可达初始本金的 20%+；投资期越长差距越恐怖——不是差 2.3 个百分点，而是差一大截终值。\n\n## 推论（投资上意味着什么）\n1. **选基金先看费率，再看别的**：同类型基金业绩差异大部分可用成本解释（学术研究：费用率是预测基金未来回报最可靠的单一指标）。\n2. **高成本主动基金 = 结构性劣势**：基金经理要跑赢指数，必须先跑赢自己 2.5% 的成本劣势——长期看能做到的人凤毛麟角（见 指数化投资）。\n3. **别被\"收益高\"骗了**：基金广告展示的都是扣除成本前的业绩；你拿到的是扣完的。\n4. **A 股同样适用**：虽然 A 股费率结构不同（场内 ETF 交易费可低至万几），但\"少交成本就是多赚\"的机制完全一致——这也是为什么同是宽基指数基金，要选费率低的（指数基金投资从入门到精通 第4条\"费率是长期敌人\"的完整论证）。\n\n## 为什么重要 / 常在哪出现\n- 博格全书的第一主题，几乎每章都回到成本；\n- 是\"指数基金凭什么长期赢主动基金\"的最硬核论据（不是基金经理傻，是成本结构决定的）；\n- 专治\"主动基金收费高是因为它更厉害\"的错觉——收费高只代表它要先跑赢成本才能赢你。\n\n## 来源\n共同基金常识（第3章 资产配置 vs 成本；第4章 简单化；第5章 指数化）\n\n## 相关概念 / 方法\n指数化投资 —— 成本拖累的直接推论（低成本指数基金胜出）；均值回归 —— 主动基金靠运气赚的超额终会回归；盈利收益率定投法 —— A股落地时照样先看费率；指数基金投资指南 —— 螺丝钉书卡（\"低成本\"同样是他选品前提）",

   "oneliner": "\"投资操作是基于全面的分析，确保本金的安全和满意的投资回报。不符合这些要求的操作是投机性的。\"（《证券分析》）——区分二者的试金石是安全边际，不是标的物本身。",
   "source": "03-知识/概念/投资与投机之分.md",
   "body": "# 投资与投机之分\n\n> 一句话：**\"投资操作是基于全面的分析，确保本金的安全和满意的投资回报。不符合这些要求的操作是投机性的。\"**（《证券分析》）——区分二者的试金石是**安全边际**，不是标的物本身。\n\n## 是什么（原文定义）\n\n《聪明的投资者》第1章引《证券分析》原定义（原文 219 行）：\n\n> \"投资操作是基于全面的分析，确保本金的安全和满意的投资回报。不符合这些要求的操作是投机性的。\"\n\n格雷厄姆的立场（原文 4497 行）：有人认为投资与投机之间\"没有任何实际和可靠的差别\"，他明确反对——\n\n> \"我认为这种怀疑态度是不必要和有害的。它之所以有害，在于它**为许多乐于在证券市场寻找投机刺激的人提供了勇气**。\"\n\n**试金石**：\n\n> \"我建议，**安全边际概念可被用来作为试金石**，以助于区别投资操作与投机操作。\"\n\n判据的强弱差别（原文 4499–4503 行）：\n\n- 投机者也会说\"我对时机有把握、我的技巧优于大众、我的系统值得依赖\"——但\"这种观点是不可信的。**他们基于主观判断，而没有得到任何有利的根据或任何确定线索推论的支持**。\"\n- 反问：\"**一个根据他的股票正在上升或下降的观点而下赌注的人，在任何有价值的意义上，是否可以说成是受到了安全边际的保护？**\"\n- 投资者一侧：\"安全边际的概念……是基于**统计数据的简单和确定的算术推理**\"——\"为了进行真正的投资，必须有一个真正的安全边际。并且，真正的安全边际可以由**数据、有说服力的推理和很多实际经验**得到证明。\"\n\n## 反常识的三条推论\n\n### 1. 同一只证券，可以是投资也可以是投机——取决于价格\n\n> \"充分低的价格可以将劣质证券转变成为很好的投资机会。\"\n\n原书举的例子：20 年代几十亿美元的不动产债券按**面值**销售并被推荐为\"合理投资\"——实际上高度投机；30 年代大萧条中大量违约，价格跌到 1 美元以下 10 美分。\"但在事实上，当价格下降大约 90% 时，使得这些债券中的很大一部分**非常有吸引力，并且相当的安全**，因为在其后隐含的真实价值是市场报价的四五倍。\"\n\n→ **投机利润也可以被恰当地称作\"投资机会\"**，只要它是\"仔细的分析已经表明在价格之上的额外价值提供了一个大的安全边际\"。\n\n### 2. 区分在\"程度\"，不在\"品种\"\n\n普通股\"可能是炸药\"，也可以是投资——\"从普通股投资到普通股投机似乎也只有一步之遥\"；区别\"**来自持有者面对股市时的态度和行为**\"，不是股票本身。格雷厄姆并不把普通股排除在防御型投资者的组合之外。\n\n### 3. 投机不被禁止，但必须**另立账户、另立上限**\n\n格雷厄姆要求把投机资金与投资资金严格分开并限定比例（原书建议投机部分占小头，如不超过 10%）。**投机本身不是错误，\"把投机当投资、用投资的纪律管投机\"才是错误。**\n\n## 对用户双路线的映射（本卡最大价值）\n\n用户的持仓天然对应这套区分：\n\n| | 路线 A（宽基定投） | 路线 B（题材/行业波段） |\n|---|---|---|\n| 有统计安全边际吗 | 有（低估买入、指数有均值回归托底） | 通常没有（买的是趋势与情绪接力） |\n| 格雷厄姆的分类 | **投资** | **投机** |\n| 纪律 | 不设止损、越跌越买、估值止盈 | −5% 硬止损、不摊平、移动止损 |\n| 资金 | 输不起的钱 | 明确划出\"输得起\"的部分 |\n\n**结论不是\"别做路线 B\"，而是三条硬边界：**\n\n1. **资金隔离**：投机账户与投资账户不互相输血（不能让路线 B 的亏损吞掉路线 A 的本金）。\n2. **纪律隔离**：投机用投机的纪律（离场三闸门 硬止损 + 资金管理四上限 仓位上限），**绝不用\"反正是好公司会涨回来\"来死扛**。\n3. **比例封顶**：投机资金占总资产有明确上限（见 余钱投资三原则）。\n\n**检验句（可直接贴进交割单复盘）**：\n\n> \"我买它的时候，有**统计意义上的安全边际**吗？还是我在赌它**接下来会涨**？\"\n> ——答案决定这笔该归哪个账户、适用哪套纪律、亏了该不该止损。\n\n## 为什么这张卡对全库重要\n\n- 它是 防御型投资者纪律 的定义学基础：不懂区分，防御型纪律就无从谈起。\n- 它是 离场三闸门 的合法性来源：**路线 B 之所以必须止损，正是因为它是格雷厄姆意义上的投机**——投机没有价值锚，跌了不会自己回来。\n- 它是 风险是永久损失 的姊妹卡：**投资的波动不是永久损失（有基本面托底）；投机的下跌才可能是永久损失（没有托底）**。\n\n## 来源\n聪明的投资者（第1章 投资与投机：聪明投资者的预期收益；附录「区别投资与投机的若干标准」「投资概念的泛化」）\n\n## 相关概念 / 方法\n安全边际 —— 区分二者的试金石；防御型投资者纪律 —— 投资一侧的操作化；离场三闸门 —— 投机一侧的必配纪律；资金管理四上限、余钱投资三原则 —— 投机资金的封顶机制；风险是永久损失 —— 两路线共用同一句风险定义的证明；双轨并用决策 —— 两套纪律如何在同一账户内共存",

   "oneliner": "博格把回报、风险、成本看成投资空间的三个维度（长、宽、高），把时间称为第四维度——时间越长，基本面回报的确定性越高、投机成分占比越小；同时，时间也让成本的复利侵蚀放大到致命。时间既是魔法的放大器，也是成本的放大器。",
   "source": "03-知识/概念/投资的第四维度.md",
   "body": "# 投资的第四维度\n\n> 一句话：博格把回报、风险、成本看成投资空间的三个维度（长、宽、高），把**时间**称为第四维度——**时间越长，基本面回报的确定性越高、投机成分占比越小；同时，时间也让成本的复利侵蚀放大到致命。时间既是魔法的放大器，也是成本的放大器。**\n\n## 是什么（第14章 时间的作用：第四维度，魔法还是专制）\n\n几何隐喻（原文 7563 行）：\n\n> \"我曾用三角形来描述影响投资回报的回报、风险和成本三者之间的相互影响关系，但是，三角形只存在于一个平坦的二维平面上。……一个有着长、宽、高三个空间维度的延伸立方体是一个更为有用的几何图形。……如阿尔伯特·爱因斯坦曾指出的，**我们不仅生活在一个空间的世界里，也生活在一个时间的世界里。他将时间看作是第四维度，在投资世界中也是如此。**\"\n\n> \"这四个维度之间以一种复杂的方式相互联系……**精明的投资者不能忽略任何一个维度。挑战在于如何根据将要达到的投资目标，衡量每一个维度的重要性。**\"\n\n## 时间对三个维度分别做了什么\n\n### ① 对回报：复利的魔力（原文 7669–7700 行）\n\n- **单笔投资例子**：1 万美元，持有 40 年。股票（年 12%）→ **93.1 万美元**；储蓄（年 5%）→ **7.04 万美元**。\"用魔力（Magic）形容这一可怕的差异并不为过。\"\n- **定期投资例子**（目标 50 万美元，25 岁投到 65 岁）：\n  - 投股票：每月 **43 美元**，累计投入 2.06 万美元；\n  - 储蓄：每月 **328 美元**，累计投入 15.74 万美元。\n  - → **\"股票投资只需要 1/8 的投资就可以达到\"同样的目标。**\n\n### ② 对风险：时间稀释投机成分\n\n这是\"长期持有降低风险\"的**机制解释，不是安慰话**（原文 1399 行）：\n\n> \"当时间窗口从 1 年增至 25 年后，**投机的短期影响力消退了**，而投资回报率开始更紧密地遵从投资的基本面因素：股息率和盈利增长率。\"\n\n→ 换句话说：**1 年期的回报里，PE 变化（运气）可能占大头；25 年期的回报里，基本面（企业盈利）几乎占全部。** 时间把\"赌\"变成\"赚\"。（原理见 回报三变量公式）\n\n### ③ 对成本：时间放大侵蚀\n\n费率是**每年按比例抽走**的，时间越长，被成本吃掉的复利绝对额越大。博格全书的核心论证：低费率（0.2%）与高成本（2.5%）在 30–50 年后的终值差异是数量级的（见 成本拖累）。\n\n→ **这解释了为什么\"低成本\"在长期投资中不是省钱小技巧，而是决定项。**\n\n## 三条操作含义\n\n1. **期限匹配**：钱能放多久，决定该不该买股票。短期（1–3 年）要用的钱不该进股市——**不是因为怕波动，而是因为没给时间发挥\"确定性\"作用**。\n2. **越年轻越该承担股票风险**：不是因为年轻人\"心理承受力强\"，而是因为**时间长到足以让基本面战胜投机**（这是 生命周期资产配置 让年轻人高配股票的原理层依据）。\n3. **时间对成本是反向的**：正因为时间长，费率差异才致命。**长期投资者比短期交易者更需要低成本工具**——这与直觉相反但数学上必然。\n\n## 博格自己的警告（原文 7653 行）\n\n> \"在投资世界中，**时间对回报的作用，更多是在被违背而不是在被遵守中得到认识和尊重的**。时间的作用更多限于理论中而不是在实践中。我们在谈及长期投资的价值时，对长期投资者多有美言。但是当要列出长期投资的例子时，我们却难以指出第二个。\"\n\n→ **知道的人多，做到的人少。** 这张卡是一张\"守纪律的理由卡\"，不是一句鸡血。\n\n## ⚠️ 边界（必须写清）\n\n- **\"长期\"不等于\"一定赚\"**。博格说的是**确定性提高**，不是**保证**。日本股市 1989 年见顶后二十余年仍在原点附近——**时间是必要条件，不是充分条件；起点估值同样关键**（回报三变量公式 的第③项）。\n- **时间不能修复\"买错\"**：它修复的是\"买贵\"（通过基本面增长），不修复\"买了没有基本面的东西\"。所以路线 A 只买宽基（指数化投资），不把这条逻辑套到题材股上。\n- 别把\"长期\"当成拖延的借口：**\"长期持有\"指持有对的资产，不是持有错的资产等它回本**。\n\n## 来源\n共同基金常识（第14章 时间的作用：第四维度，魔法还是专制）\n\n## 相关概念 / 方法\n回报三变量公式 —— 时间是第③项的稀释剂；成本拖累 —— 时间是成本的放大器；指数化投资 —— 让时间发挥作用的载体；生命周期资产配置 —— 用年龄给时间定价；安全提款率 —— 时间在退休端的对应纪律；定投频率选择 —— 时间的下位问题（周期多长）",
   "id": "03-知识/概念/投资的第四维度.md"

   "oneliner": "当目标从\"赚到绝对回报\"换成\"别跑输标普500\"，行为就开始系统性变形——基金向指数靠拢（隐秘指数化）、集体追涨杀跌、牺牲长期绝对收益。博格称之为「投资相对主义：幸福还是不幸」。",
   "source": "03-知识/概念/投资相对主义.md",
   "body": "# 投资相对主义\n\n> 一句话：当目标从\"赚到**绝对**回报\"换成\"别跑输标普500\"，行为就开始系统性变形——基金向指数靠拢（隐秘指数化）、集体追涨杀跌、牺牲长期绝对收益。博格称之为「**投资相对主义：幸福还是不幸**」。\n\n## 是什么（第11章）\n\n**定义（原文 6581–6584 行）**：\n\n> \"与金融市场的任何历史时期相比……**当今投资者更加集中于寻求短期相对业绩的成功。我们已经进入了所谓的'投资相对主义时代'。** 所有人似乎都在集中精力进行比较：'**相对于标准普尔500指数，我的股票组合表现如何？**'这已经像股票市场中的每日波动一样，成为投资者生活中的一部分了。**我们的幸福和不幸似乎都建立在对这一问题的如何回答之上。**\"\n\n**四个成因（原文 6633 行明确列出）**：\n1. 信息超负荷（通信技术时代）；\n2. 自命不凡的机构客户对**频繁更换投资顾问**的兴趣；\n3. 共同基金投资者对**短期优胜者**的喜好；\n4. 基金**过度激进的市场营销**。\n\n## 三个后果（本卡的价值所在）\n\n### 后果一：隐秘指数化（closet indexing）\n\n大型基金因规模过大，把组合组织成\"接近市场平均\"的结构以增加回报的稳定性——\"**投资相对主义虽然是防范基金投资失败的一剂药方，但是成本高昂**\"。\n\n→ 翻译：**它保证了不输太多，也保证了赢不了。** 一只收费 1.5% 却紧贴指数的基金，是投资者能买到的最差产品之一。\n\n### 后果二：目标错位（原文 6661 行）\n\n> \"当今时代，投资相对主义的首要目标，似乎是**在短期避免回报率低于标准普尔500指数太多**，而不是获得更好的长期绝对回报率。\"\n\n→ 记分牌换了，行为必然跟着换：为了\"追回落后\"而加杠杆、买高 β、频繁交易。\n\n### 后果三：优秀者被系统淘汰（原文 6661 行）\n\n> \"如果这一行业曾经有机会产生另一个彼得·林奇或者沃伦·巴菲特，那么这样的机会正在迅速消失。\"\n\n## 对个人投资者的意义（这才是这张卡要解决的问题）\n\n**相对主义是\"别人的记分牌\"，不是你的。**\n\n- 你的目标是\"攒够钱养老 / 买房 / 覆盖某笔支出\"，**不是\"跑赢沪深300\"**。\n- 用别人的记分牌打分，会让你**在最该拿住时换仓、在该买时不敢买**——因为\"别人涨得比我多\"的痛感，与\"我亏了钱\"是同一种痛（见 前景理论：参照点决定感受）。\n- 它还会诱导**风险敞口的隐性上调**：基金经理为追回落后而加仓高风险资产；个人投资者的对应行为是**加仓题材股、上杠杆、提高交易频率**。\n\n**与 定投计划落纸面 的关系**：写下来的目标是**绝对目标（金额 / 年化）**，**天然免疫相对主义**——这是\"落纸面\"的隐藏收益。\n\n## 怎么自查（可执行）\n\n每次复盘**只问两个问题**：\n\n1. 我的**总资产绝对金额**比上期多了还是少了？\n2. 我的**纪律执行率**是多少（该买买了吗？该止损止了吗？）？\n\n——**不问\"跑赢指数了没\"。**\n\n看到\"某基金今年翻倍 / 某人今年赚了 3 倍\"的新闻时，把它归为**与我无关的信息**（均值回归 的实证：明年的冠军是别人）。\n\n## ⚠️ 边界（别过度解读）\n\n- **相对业绩不是永远无意义**：**评估基金经理**时它是有用的工具。但博格给出的证据是——**短期相对业绩对预测未来毫无价值**（随机漫步 第7章的 SPIVA 数据、均值回归 的戈茨曼—伊博森研究都支持这一点）。\n- 对个人，**唯一值得做的\"相对\"比较，是与自己过去的纪律执行率比**——而不是与市场比。\n- 不是叫你别看指数：指数是**参照系**（判断市场冷热用），不是**记分牌**（评判自己用）。这两者常被混为一谈。\n\n## 来源\n共同基金常识（第11章 投资相对主义：幸福还是不幸）\n\n## 相关概念 / 方法\n成本拖累 —— 相对主义的孪生问题（都在比\"相对\"而不看\"绝对净收益\"）；均值回归 —— 追相对冠军为什么必然失败；指数化投资 —— 抛弃相对主义的干净解法；定投计划落纸面 —— 用绝对目标免疫相对主义；金鹅与瘦鹅 —— 你的鹅养大了没，与别人的鹅无关",

   "oneliner": "别费劲挑基金经理、猜风格、赌板块——直接买一个覆盖整个市场的低成本指数基金，长期持有。你不可能跑赢市场，但可以\"成为\"市场，然后靠低成本赢过大多数试图跑赢市场的人。",
   "source": "03-知识/方法/指数化投资.md",
   "body": "# 指数化投资\n\n> 一句话：**别费劲挑基金经理、猜风格、赌板块——直接买一个覆盖整个市场的低成本指数基金，长期持有。你不可能跑赢市场，但可以\"成为\"市场，然后靠低成本赢过大多数试图跑赢市场的人。**\n\n## 是什么\n\"指数化\"指不依赖任何人的选股/择时判断，只买下某个指数的全部成分（或代表性样本），拿到与市场一致的回报。博格用一整章学术证据论证它是普通人的最优解：夏普研究（100只最大股票基金 10 年跑输指数年均 0.64%）、卡哈特（1962–1993 共 1892 只基金：费用几乎完整解释了业绩持续性）、戈茨曼—伊博森（持续胜利者≈掷硬币）——**没有可靠证据表明主动基金能持续跑赢指数，反面证据倒是一大堆**。而指数基金因为成本低到极致（见 成本拖累）、不用猜风格（见 均值回归），长期必然胜出。\n\n## 具体怎么做\n1. **选\"宽\"不选\"窄\"**：优先覆盖整个市场的宽基指数（A股：沪深300 + 中证500/1000 组合；美股：标普500或全市场指数）。**别买行业/主题指数当核心仓**——那等于在赌板块，又回到择时游戏里了。\n2. **选\"低费率\"不选\"明星\"**：同类指数基金费率差可达 0.1% vs 1%+。指数基金同质化程度高，**费率几乎就是全部差别**——选费率最低、跟踪误差小的那只。\n3. **一次性配置 or 定投，但都别停**：有闲钱可一次性投入（越早越好，时间是好盟友）；现金流稳定就定投（见 定投计划落纸面）。共同点是**长期持有、不因涨跌进出**。\n4. **不要做的事**（博格原话的讽刺清单）：像交易股票一样频繁换基金；看广告买\"有出色历史业绩\"的基金；在\"基金超市\"里换来换去——这些行为每一条都在增加成本、放大均值回归的杀伤。\n5. **每年做一次体检即可**：检查持有的基金费率是否仍最低、是否严重偏离指数；没有重大变化就继续拿着，把省下的精力干别的。\n\n> ⚠️ 指数化不是\"随便买只指数基金躺平\"——**\"宽基\"+\"低费率\"+\"长期\"三个前提缺一不可**。买高费率增强型指数、或频繁进出，都会把指数化的优势亲手送回去。\n\n## 什么时候用 / 什么时候别用\n- 适合：路线 A 核心仓位；不想/没时间研究个股的普通人；作为主动基金的\"基准锚\"对照自己的交易是否真的跑赢了市场（这对短线客尤其有用——先证明你跑得赢指数，再谈该不该做路线 B）\n- 不适合：路线 B 短线波段本身（那是另一套 机械交易系统 玩法）；认为自己确实有持续超额能力的极少数专业选手\n\n## 来源\n共同基金常识（第5章 指数化：经验对希望的胜利；第1章 长期投资）\n\n## 相关方法\n成本拖累 —— 指数化为什么能赢的原理；均值回归 —— 为什么不用赌风格/明星；盈利收益率定投法 —— 想在指数化基础上做低估增强的 A股玩法；定投计划落纸面 —— 落地执行",

   "oneliner": "市场把已知的信息（甚至内幕）都\"折现\"进价格里了，所以没人能可靠地靠信息优势持续战胜市场。真想赢的人该先回答：我凭什么比成千上万名全职专业选手更快、更聪明？",
   "source": "03-知识/概念/有效市场假说.md",
   "body": "# 有效市场假说\n\n> 一句话：**市场把已知的信息（甚至内幕）都\"折现\"进价格里了，所以没人能可靠地靠信息优势持续战胜市场。真想赢的人该先回答：我凭什么比成千上万名全职专业选手更快、更聪明？**\n\n## 是什么（说人话）\n有效市场假说（EMH）按\"哪些信息已反映在价格里\"分三档：\n\n1. **弱式有效**：历史价格信息无效 → 技术分析（看过去股价）没用——这就是 随机漫步。\n2. **半强式有效**：一切**公开**信息（财报、股利、宏观）都已反映在价格里 → 基本面分析也没用，专业人士反复分析这些数据纯属徒劳。\n3. **强式有效**：连\"内幕\"也没用——这一档显然夸大其词（罗斯柴尔德靠信鸽抢先知道滑铁卢战果赚大钱就是反例），但今天有公平披露规则 + 内幕交易违法，现实中靠内幕的通道基本被堵死。\n\n**两个常见误解必须澄清**（第7章原话）：\n- EMH **不是说\"股价总是正确\"**——事实上股价始终是错误的；它只是说**没人确切知道股价是过高还是过低**。\n- EMH **不是说价格漫无目的乱动**。恰恰相反：价格对信息反应快到来不及利用，而新信息本身是随机、不可预知的——所以研究过去的股价或公开基本面，都预测不了下一步。\n\n**市场的边界**：有效市场假说并不否认泡沫（郁金香、互联网、2008 住房市场），市场确实会整体犯错。但错误何时来、有多大，事前不可知，无法被稳定利用——\"百元大钞\"悖论：教授说街上的百元钞早被人捡走了，学生却怀疑偶尔真会有一张躺着没人捡；偶尔有，但靠捡它发不了财。\n\n## 能举的例子\n- 例子 1（掷硬币冠军）：1000 人比赛连抛正面，第 7 轮剩 8 人\"屡战屡胜\"，被媒体当天才写传记——其实是概率法则。基金经理里的\"明星\"同理：数量众多的参与者中必然有人靠运气连续跑赢几年，媒体只宣传活下来的那几位。\n- 例子 2（硕果仅存一颗）：截至 2007 年底有 14 只基金连续 9 年战胜标普500，2008 年只剩 1 只延续胜绩。历史业绩对预测未来毫无价值。\n- 例子 3（幸存者偏差）：1970 年的 358 只股票基金到 2017 年仅存 78 只（差的被悄悄并入好基金\"抹掉记录\"）；即便数据这样偏袒基金，跑赢指数 2 个百分点以上的仍用手数得过来，收益超 1% 的只有 11 只（3%）。\n\n## 为什么重要 / 常在哪出现\n- 第7章核心（\"基本面分析究竟有多出色和有效市场理论\"），也是第15章指数化推荐的逻辑支点。\n- 它从理论上堵死了\"更努力研究就能赢\"的幻想：你的对手是成千上万全职专业选手加算法，公开信息面前人人平等。\n\n## 推论（投资上意味着什么）\n1. **别按历史业绩买基金/基金经理**：业绩无连续性——20 世纪各年代的冠军基金，下个十年排名几乎垫底（昨日明星=今日灾星）。\n2. **别信\"研究更努力/消息更灵通就能赢\"**：半强式下公开信息无效；强式虽过头，但\"内幕\"现在违法、且你听到的\"内幕\"更可能是出货广告（内幕消息陷阱）。\n3. **买指数而不是买\"会赢的基金\"**：与其在干草堆里找针，不如买下整个干草堆（指数化投资）；而且即便市场无效，指数化靠低成本依然赢（所有股票必然被人持有 → 主动基金整体扣完 1% 费率必输）。\n4. **少数真赢家（如巴菲特）存在，但**：概率极低、事前无法识别，99% 的\"战胜者\"靠运气（第15章：\"战胜平均指数的人，可能 99% 的原因还是靠运气\"）。\n\n## 来源\n漫步华尔街（第7章 有效市场理论；第15章 指数化逻辑）\n\n## 相关概念 / 方法\n随机漫步 —— EMH 的弱式版本；指数化投资 —— 承认无法战胜市场后的最优解；成本拖累 —— 主动基金整体必输的另一个结构性原因；均值回归 —— 明星基金/风格终将回归平庸；内幕消息陷阱 —— 现实中\"内幕\"的另一面",

   "body": "# 现代投资组合理论\n\n> 一句话：**风险 = 收益率的离散度（波动）；分散能降低风险，但前提是资产之间\"不是完全正相关\"**——只要相关系数 < 1，加进来就能在**不降低预期收益**的前提下减少波动。**分散的关键是相关性低，不是数量多。**\n\n## 是什么（第8章 新款漫步鞋：现代投资组合理论）\n\n马尔基尔的引出（原文 2884 行）：\"本章主要阐述现代投资组合理论，该理论中一些独到见解，将使你在可能获得更高投资收益的同时，**能够降低投资风险**。\"\n\n### 风险的定义（学术版）\n\n**风险 = 收益率的离散度 / 波动性（标准差）**。\n\n> ⚠️ 注意：这与 风险是永久损失（马克斯）**正面冲突**——见下面\"两个风险观的张力\"。\n\n### 多样化的机制\n\n把两个不完全正相关的资产放在一起，组合的波动**小于**两者波动的加权平均。原文关键句（3022 行）：\n\n> \"这里真正关键的一点是，**相关系数为负数并非获得多样化带来的降低风险这一好处的必要条件**。马科维茨对投资者的钱包做出了伟大贡献，他证明**只要不是完全正相关，都可以潜在地降低风险**。如表8-4所示，增加一只证券或一个资产类别是否能降低风险，**相关系数起着至关重要的作用**。\"\n\n**相关系数决定分散效果**（原书表 8-4 的核心）：\n\n| 相关系数 | 分散效果 |\n|---|---|\n| +1.0（完全正相关） | **零**——组合波动 = 加权平均波动，白加 |\n| 0 | 明显（波动显著下降） |\n| −1.0（完全负相关） | 最大（理论上可降到零），但实操罕见 |\n\n**有效前沿**：给定风险下收益最高的组合集合；最优组合 = 在\"风险—收益\"直线上，按自己的风险偏好选点（加入无风险资产后成直线）。\n\n### 第9章的延伸\n\nβ、资本资产定价模型（CAPM）、套利定价、法玛—弗伦奇三因素——核心是区分：\n\n- **系统风险**（市场整体风险，**不可分散**，应获补偿 → 决定预期收益）；\n- **非系统风险**（个股/行业特有风险，**可分散**，不应获补偿 → 白承担）。\n\n## 对用户的意义（可直接落地）\n\n1. **为什么\"买 5 只云计算 ETF\"不叫分散**：它们相关系数接近 +1，**分散效果 ≈ 0**。分散要**跨资产类别**（股票 / 债券 / 黄金 / 现金），不是跨产品。\n2. **为什么 核心-卫星策略 成立**：核心（宽基）+ 卫星（行业）的相关性，低于纯行业之间——能在保留进攻性时压低总波动。\n3. **债在组合里不是\"收益来源\"而是\"分散工具\"**：股债长期相关性低（危机时更明显），所以 生命周期资产配置、股债50-50再平衡 才有效。\n4. **相关性会在危机中升高**（\"危机时所有相关性都趋近 1\"）——**分散在平时最有效，在最需要时最不可靠**。所以要留**现金**这一真正独立的资产（余钱投资三原则）。\n\n## ⚠️ 两个风险观的张力（本书 vs 马克斯）\n\n| | 马尔基尔 / MPT | 马克斯 |\n|---|---|---|\n| 风险定义 | **波动性**（可计算的离散度） | **永久损失的可能性** |\n| 为什么这么定 | \"需要一个可计算的、客观的、能够查明来龙去脉的数字\" | \"我从未听到任何人在橡树资本说过'我不买它因为它的价格可能大幅波动'\" |\n| 对长期定投者 | 波动是**可承受的代价**，靠分散与时间化解 | 波动**不是风险**，**在波动中卖出才是** |\n\n**合起来的用法**（这是本卡最实用的结论）：\n\n> **用 MPT 管结构（分散、相关性、再平衡），用马克斯管行为（别把波动当损失、别被迫卖出）。**\n> 两者不是二选一，而是分别解决\"组合长什么样\"和\"人在波动里会做什么\"。\n\n## 数字例\n\n两个资产，各预期年化 8%、波动率各 20%，**等权配置**：\n\n- 若相关系数 **+1.0** → 组合波动仍 **20%**（分散无效）；\n- 若相关系数 **0** → 组合波动 ≈ **14%**（20% × √0.5）；\n- 若相关系数 **−1.0** → 组合波动理论 ≈ **0%**。\n\n**预期收益在三种情形下都是 8%**——**分散是\"免费\"的风险削减**，这正是马科维茨被称\"对投资者的钱包做出了伟大贡献\"的原因。\n\n## ⚠️ 边界\n\n- MPT 的输入（预期收益、波动率、相关系数）**都是历史估计，未来会变**——所以\"最优组合\"是估计出来的最优，不是真实最优。\n- 它在**市场极端时失效**（相关性跳升），所以别把\"我的组合波动只有 8%\"当成硬承诺。\n- 马尔基尔本人对更花哨的衍生理论（随机漫步 第11章的\"聪明的 β\"、风险平价）持保留态度——**核心结论只有一条：广泛分散 + 低成本 + 长期持有**。\n\n## 来源\n漫步华尔街（第8章 新款漫步鞋：现代投资组合理论；第9章 不冒风险焉得财富）\n\n## 相关方法\n生命周期资产配置 —— MPT 在人生尺度上的应用；股债50-50再平衡 —— 用再平衡维持目标相关性结构；核心-卫星策略 —— 相关性思想的组合落地；风险是永久损失 —— 与本书正面冲突的另一种风险观（务必对照读）；随机漫步 —— MPT 的理论母体；资产与现金流 —— 为什么要跨资产分散",

   "oneliner": "第一层次问\"这东西好不好？好就买\"；第二层次多问三句——\"大家是不是都知道了？价格里已经装进了多少好预期？如果我与众不同，凭什么是我是对的？\" 战胜市场的前提不是更努力，是想得比别人深一层。",
   "source": "03-知识/概念/第二层次思维.md",
   "body": "# 第二层次思维\n\n> 一句话：第一层次问\"这东西好不好？好就买\"；**第二层次多问三句——\"大家是不是都知道了？价格里已经装进了多少好预期？如果我与众不同，凭什么是我是对的？\"** 战胜市场的前提不是更努力，是**想得比别人深一层**。\n\n## 是什么（说人话）\n霍华德·马克斯开篇立论：买指数人人能得平均收益，**想超越平均，你的思维必须高于平均水平**——而多数人的\"研究\"只停留在第一层次。\n\n- **第一层次思维**：单纯、肤浅、几乎人人能做。\"这是一家好公司，买进\"\"增长低迷要来了，卖出\"——只需对**未来有一个看法**。\n- **第二层次思维**：深邃、复杂、迂回。同样面对\"好公司\"，会继续想：*好* 是不是**人尽皆知**的好？若是，价格已反映、不再便宜——那\"好\"就不是买它的理由，甚至可能是卖出的理由。\n\n第二层次思维者要考虑的（原书列举）：\n1. 未来可能出现的结果范围是什么？\n2. 我认为哪种结果会出现？\n3. 我的看法正确概率有多高？\n4. 大家的共识是什么？\n5. 我的预期比共识高还是低？\n6. 资产当前价格反映了\"共识\"还是\"我的看法\"？\n7. 若我对而共识错，价格会怎样走？\n\n**三组对照（原书）**：\n- 一层：\"好公司，买。\" 二层：\"好公司，但人人都知道它好，价格已高估——卖。\"\n- 一层：\"前景糟糕，抛股票。\" 二层：\"前景糟糕透顶，但所有人都在恐慌抛售——买！\"\n- 一层：\"利润会跌，卖。\" 二层：\"利润会跌，但会跌得比大家预期少，有惊喜——买。\"\n\n## 能举的例子\n- 例 1（钟摆两端）：2008 恐慌中人人喊\"现金为王\"时，第二层次想的是\"别人都在卖，资产已低于价值，买\"——这正是 钟摆与周期 在极端位置的用法。\n- 例 2（热门股）：2020 年新能源最热时，一层思维\"赛道好，买\"；二层思维\"赛道好人人皆知，估值透支了几年增长，追高者是在为共识付溢价\"。\n- 例 3（日常 ETF 定投）：同样在低估区（盈利收益率定投法），一层\"还在跌，不敢买\"；二层\"低估 = 价格低于价值，别人恐惧正是便宜时\"。\n\n## 为什么重要 / 常在哪出现\n- 全书第1章即立论：**投资目标不是平均，是超越平均**；超越的前提不是更勤奋，是思维层次差异。\n- 它解释了一个残酷现实：训练洞察力\"几乎与训练身高一样难\"——不是人人学得会，但**提问框架可以学**（上面的 7 问）。\n\n## 推论（投资上意味着什么）\n1. **先问\"价格里已装进多少好预期\"再决定买卖**——好资产 + 贵价格 = 差投资；平庸资产 + 便宜价格 = 好投资（\"买得好 > 买好的\"）。\n2. **听到共识要警惕**：当\"人人看好/看坏\"成为新闻头条时，共识已反映在价格里，你的优势只能来自与共识不同且正确。\n3. **逆向必须有价值锚**：第二层次不是\"跟大众对着干\"就赢，而是\"大众错 + 我知道价值在哪\"才赢（钟摆与周期 的极端点 + 价值判断缺一不可）。\n\n## 来源\n投资最重要的事（第1章 学习第二层次思维；金句贯穿全书）\n\n## 相关概念 / 方法\n有效市场假说 —— 市场多数时候有效，无效处正是二层思维的机会；钟摆与周期 —— 极端价格从哪来、何时逆向；均值回归 —— 热门终回归平庸；双轨并用决策 —— 普通人战术层用估值定权重的落地方式",

   "oneliner": "投机市场里，钱是零和的，沿五条固定路径流动——新股民→老股民、散户→庄家、低技巧→高技巧、心态坏→心态好、小机构→大机构；唯一例外是投资上市公司：那是真创造财富的\"共同富裕\"。想不清钱从谁口袋来到你口袋，你的钱就会沿其中一条路径流走。",
   "source": "03-知识/概念/财富转移五路径.md",
   "body": "# 财富转移五路径\n\n> 一句话：**投机市场里，钱是零和的，沿五条固定路径流动——新股民→老股民、散户→庄家、低技巧→高技巧、心态坏→心态好、小机构→大机构；唯一例外是投资上市公司：那是真创造财富的\"共同富裕\"。想不清钱从谁口袋来到你口袋，你的钱就会沿其中一条路径流走。**\n\n## 是什么\n李大霄\"先想清楚挣谁的钱\"的框架。股市是财富再分配场所——**投机的每一分盈利都是别人的亏损**；而投资赚取的是上市公司创造的新财富。五条转移路径（投机盘）：\n\n1. **大机构 ← 小机构**：资金与信息实力碾压。\n2. **老股民 ← 新股民**：新股民阶段就是\"交学费\"阶段（老股民偶尔也会踏空让利，长期看是\"进贡\"）。\n3. **庄家 ← 散户**：坐庄成功则散户输；但坐庄失败（自拉自唱、无法出货）庄家反被瓜分——住友、巴林银行都是案例。散户的生存要点是\"不被庄家消灭\"。\n4. **高技巧 ← 低技巧**：知识面差一分，胜负差一截（只开沪市账户=机会少一半的早期案例）。\n5. **心态好/有耐心 ← 心态坏/没耐心**：主力反复在一个区间\"折腾\"，把耐心磨到极限——筹码大换手后（该卖的都卖了），股票开涨。\"谁挣谁的钱？心态好的人挣心态坏的人的钱。\"\n\n## 怎么用\n1. **每笔交易前问一句：我赚的是谁的钱？**赚企业成长与分红的（投资）→ 拿得住；赚对手盘情绪差价的（投机）→ 必须想清楚自己凭什么是五条路径里的\"强者\"那一侧（技巧/耐心/信息，至少占一样）。\n2. **对照自己最可能在哪条路径上当\"进贡方\"**：新手主要死在 2、3、5——尤其第 5 条：不是不懂，是熬不住（见 淡泊勇气坚持）。\n3. **认清自身生态位**：学生散户资金小、无信息优势、技巧积累中——正面硬刚路径 3、4 是送钱；能积累的是耐心（5）与\"买创造财富的资产\"（投资例外路径）。宽基指数基金把 1~4 条路径全部绕开：不赌对手，只吃企业成长。\n4. **概率底线**：一赚二平七亏——想在股市当赢家，\"必须考全班前 5 名\"；做期货要考第一。门槛低≠专业要求低（医生要学 10 年，入市却不用考试）——这就是为什么大部分新钱注定沿路径 2 流动。\n\n## 常见误读\n- \"零和所以都不能玩\"：**投资盘不是零和**——上市公司创造利润与分红，投资者与企业共同富裕（这正是李大霄\"把钱交给对社会有正面作用的公司\"的根基）。\n- \"技巧高就稳赢\"：技巧只解决路径 4；若心态差（路径 5）照样被收割——两件事要分开修炼。\n\n## 来源\n李大霄投资战略（第一部分 财富是如何转移的 / 市场的博弈 / 股市赚钱的概率）\n\n## 相关概念\n交易认知偏差 —— 心态路径上让你亏钱的具体机制；概率思维训练 —— \"考前 5 名\"意识的训练法；指数化投资 —— 制度性地站到\"投资例外\"路径上的方法",

   "source": "03-知识/概念/钟摆与周期.md",
   "body": "# 钟摆与周期\n\n> 一句话：市场不走直线走**钟摆**——群体心理在\"乐观↔悲观、贪婪↔恐惧、急于买进↔迫切卖出\"之间来回摆动，**摆到极端时价格脱离价值**，而极端正是逆向者的机会。你不需要预测摆到哪，但要**知道现在身处钟摆的哪一端**。\n\n## 是什么（说人话）\n霍华德·马克斯最核心的市场观（第8/9章）：\n\n1. **周期是必然的**：经济、市场、信贷都周期波动。上涨不会永远持续，下跌也不会。\"这次不同了\"（这次没有周期了）是最危险的一句话。\n2. **钟摆比喻**：投资者的群体心理像钟摆，不是在中间停留，而是**总在两端之间摆动**：\n   - 一端：乐观、轻信、贪婪、**唯恐错失良机（FOMO）**、急于买进\n   - 另一端：悲观、怀疑、恐惧、**害怕遭受损失**、迫切卖出\n   - 钟摆很少停在\"合理\"中间点，多数时间偏向某一端，**摆到极端才反转**。\n3. **风险规避本身也钟摆化**：风险规避过少 → 泡沫；风险规避过度 → 崩盘后的恐慌。适度风险规避是理性市场必需品，但人性让它时而过多时而过少。\n4. **为什么知道身处何方就够了**：我们不可能知道过热市场何时冷却、下跌何时停止——**但可以通过周边人的行为判断当前在周期哪个阶段**：\"当其他投资者无忧无虑时，我们应小心翼翼；当投资者恐慌时，我们应更加积极。\"\n\n## 能举的例子\n- 例 1（2007）：人人相信房价永远涨、风险已消失 → 钟摆到\"风险规避过少\"端 → 崩盘。\n- 例 2（2008 底-2009）：人人恐慌抛售、现金为王 → 钟摆到\"恐惧过度\"端 → 恰恰是历史性买点（\"智者始而愚者终\"）。\n- 例 3（A股/ETF 语境）：牛市顶部人人晒收益、新基金疯抢 → 钟摆过热端；熊市底部无人谈股票、低估区定投被嘲笑 → 钟摆恐慌端。盈利收益率定投法 的\"低估买\"本质就是在恐慌端接货。\n\n## 为什么重要 / 常在哪出现\n- 它把 均值回归 从\"统计规律\"升级为\"心理机制\"：**均值回归不是因为数字必然回归，而是因为群体心理钟摆必然摆过头再摆回来**。\n- 与 第二层次思维 联动：钟摆提供\"价格何时脱离价值\"的时机，二层思维提供\"此刻该不该逆向\"的判断——**极端位置 + 价值锚 = 逆向买入**。\n- 它解释了\"高买低卖\"为什么是群体宿命：钟摆让多数人在乐观端追高、恐慌端割肉。\n\n## 推论（投资上意味着什么）\n1. **不预测拐点，只定位当下**：别问\"还要跌多久/涨多久\"，问\"现在大家是无忧无虑还是恐慌？我在钟摆哪一端？\"（应对 > 预测）。\n2. **极端才行动，平时按纪律**：极端价格（钟摆两端）不会天天出现——大部分时间按 双轨并用决策 的常规轨执行，只有极端估值出现才用足战术轨。\n3. **恐慌是朋友的信号**：当身边人都割肉/不敢买且估值已低 → 钟摆恐慌端 → 对路线 A 是加码区而非离场区；**账面波动不是风险，恐慌中割肉才是永久损失**（风险定义见 第二层次思维/书卡）。\n4. **警惕\"这次不同\"**：每次泡沫都有\"新时代\"叙事（互联网、地产、AI），听到它 = 钟摆过热端的警告。\n\n## 来源\n投资最重要的事（第8章 关注周期、第9章 钟摆意识）\n\n## 相关概念 / 方法\n均值回归 —— 统计层：极端终回归；第二层次思维 —— 思维层：极端时敢逆向；双轨并用决策 —— 战术轨：低估区加码的落地；盈利收益率定投法 —— 用估值判断钟摆位置的操作化",
   "id": "03-知识/概念/钟摆与周期.md"

   "status": "未学",
   "oneliner": "股价的短期变动像醉酒汉的脚步——下一步往哪走，没法根据过去的步子猜。技术分析想从历史价格里找规律，但那些\"规律\"大多是统计幻觉，抛硬币也能画出一样的图。",
   "source": "03-知识/概念/随机漫步.md",
   "body": "# 随机漫步\n\n> 一句话：**股价的短期变动像醉酒汉的脚步——下一步往哪走，没法根据过去的步子猜。技术分析想从历史价格里找规律，但那些\"规律\"大多是统计幻觉，抛硬币也能画出一样的图。**\n\n## 是什么（说人话）\n随机漫步（random walk）指\"将来的步骤或方向无法根据历史进行预测\"；用到股市上，就是**股票价格的短期波动无法预测**——投资咨询服务、公司盈利预测、图表形态分析全无用处。极而言之：被蒙住眼睛的猴子朝股票列表掷飞镖选出的组合，也能和专家选的一样好（第1章）。\n\n为什么人眼总觉得股价有\"模式\"？马尔基尔在课堂上让学生用抛硬币画股价：股价从 50 美元起步，每交易日硬币正面就 +0.5 美元、反面就 −0.5 美元。画出来的图与真实股价走势几乎无法区分，甚至有\"头肩顶\"\"三重顶\"等经典形态——其中一张\"倒置头肩顶向上突破\"的完美看多图，被马尔基尔拿给一位技术分析师朋友看，对方狂喜：\"这是哪家公司？下周必涨 15 点！\"得知图是抛硬币画出来的后当场翻脸（第6章）。**人脑天生难以接受随机性，非要在噪声里看出规律。**\n\n注意：股市并不完全符合教科书式的随机漫步——利好消息常被投资者\"部分消化\"，会形成短期缓慢趋势；但这类趋势太微弱，扣掉交易成本和税后没有利用价值，还可能突然反转（反应过度）。**真正让股价长期向上的，是公司盈利与股利的长期增长（基本面），不是图表的\"趋势\"。**\n\n## 能举的例子\n- 例子 1（硬币股价图）：抛硬币连续 10 次正面后，第 11 次正面概率仍是 50%——股价\"已经连涨 3 天\"不构成\"明天还涨\"的理由。\n- 例子 2（对照剂检验）：技术策略常能赚钱，但\"买入持有\"大盘指数（过去 90 年年化约 10%）同样赚钱。只有当技术策略**跑赢买入持有**才算有效——至今没有一种技术策略能一贯通过这个检验。\"技术分析与占星术别无二致，两者都貌似科学。\"（理查德·匡特语）\n\n## 为什么重要 / 常在哪出现\n- 第1章提出定义，第6章系统论证（\"究竟何为随机漫步\"），是全书书名与核心论点，也是\"普通人别试图战胜市场\"的第一块基石。\n- 与 均值回归 是两码事，要分清：**随机漫步管\"短期\"**（明天涨跌猜不了，随机噪声）；**均值回归管\"长期\"**（涨太多/跌太多终会回到基本面）。短期随机漫步 + 长期基本面牵引，两者不矛盾。\n\n## 推论（投资上意味着什么）\n1. 别为\"连涨三天\"\"突破形态\"找买入理由——短期走势和抛硬币没有本质区别。\n2. 别买\"预测服务\"：股评、盈利预测、形态分析在随机漫步面前没有价值。\n3. 随机漫步恰恰是 指数化投资 的理由：短期既然猜不了，干脆放弃预测，用最低成本买下整个市场，长期搭基本面增长的便车。\n4. 对路线 B 短线客的拷问：你的入场信号如果建立在\"历史形态会重演\"上，先自问有没有扣除交易成本后仍跑赢买入持有的证据。海龟类趋势系统利用的是\"反应不足\"的弱趋势，靠概率与机械执行取胜（机械交易系统），不是靠\"看图\"。\n\n## 来源\n漫步华尔街（第1章 何为随机漫步；第6章 究竟何为随机漫步）\n\n## 相关概念 / 方法\n有效市场假说 —— 随机漫步就是它的\"弱式\"版本（历史价格信息无效）；指数化投资 —— 随机漫步下的最优应对；均值回归 —— 管长期回归基本面，与随机漫步互补；交易认知偏差 —— 人脑为何总在噪声里看出\"模式\"",

   "title": "增值的不对称性",

   "status": "未学",
   "oneliner": "技术的高低不能用\"赚了多少\"衡量，要用不对称性衡量——市场上涨时跟得上，市场下跌时亏得少。这种\"收益高于损失\"的不对称，是唯一能证明你有真本事（而不是运气好、风格对）的证据。",
   "source": "03-知识/方法/增值的不对称性.md",
   "body": "# 增值的不对称性\n\n> 一句话：技术的高低不能用\"赚了多少\"衡量，要用**不对称性**衡量——**市场上涨时跟得上，市场下跌时亏得少**。这种\"收益高于损失\"的不对称，是唯一能证明你有真本事（而不是运气好、风格对）的证据。\n\n## 是什么（第18–19章）\n\n**核心论断（原文 5962 / 6108 / 6111 行）**：\n\n> \"增值型投资者的表现是**不对称的**。他们获得的**市场收益率高于他们蒙受的损失率**……有技术的积极进取型投资者在牛市里表现良好，但是**不会在相应的熊市中把赚到的钱全赔回去**，而有技术的防御型投资者在**熊市中损失相对较少，在牛市中获利相对较多**。\"\n>\n> \"在投资中，一切都有利有弊并且是**对称的，只有卓越技术除外**。只有依靠技术才能保证在有利环境中的收益高于在不利环境中的损失。**这就是我们寻找的投资不对称性。卓越技术是获得不对称投资的先决条件。**\"\n>\n> \"不对称性——上涨时的收益高于下跌时的损失，并且超过单纯投资风格所致的结果——**应成为每一位投资者的目标**。\"（原文 6148 行）\n\n**怎么检验（原文 6439 行，这是本卡最实用的部分）**——看他在**与自己风格不符的环境**下的表现：\n\n- 积极进取型投资者**能否在市场下跌时减少损失**？\n- 保守型投资者**能否在市场上涨时积极参与**？\n- 制胜投资是否多于致败投资？**制胜的收益是否大于致败的损失**？\n- 繁荣期带来的利益是否高于衰退期带来的痛苦？\n- **长期结果是否好过\"单纯由投资者风格带来的结果\"**？\n\n**反例（原文 6105 行）**：没有技术的投资者赚到的收益\"**仅仅是市场收益以及他们的风格使然**\"——激进型双向大幅波动、防御型双向小幅波动，\"**这些投资者在他们的风格之外没有任何贡献**\"。\n\n**第18章配套结论**：**\"避免致败，制胜自来\"** / 全书第 16、17 条——\"最重要的不是**进攻**，而是**防守**\"、\"最重要的不是追求伟大成功，而是**避免重大错误**\"。\n\n## 对用户的意义（这是\"复盘打分的判据\"）\n\n### ① 别用盈亏评判自己，用不对称性评判\n\n- **路线 A**：把它和\"无脑定投沪深300\"比——你的**估值择时**（低估多买、高估少买 / 止盈）在**下跌年份是否少亏、上涨年份是否没落下**？如果两者差不多，说明择时没创造价值（这时该认真考虑回到更简单的方案）。\n- **路线 B**：统计你的**胜率与盈亏比**（R乘数 / 期望值）——**如果胜率 50% 但平均盈利 < 平均亏损，你就是在做不对称的反向**（这是大多数散户的死因）。\n\n### ② 它给\"少亏\"定了价值\n\n用户系统里路线 B 的 −5% 硬止损、路线 A 的不设止损，合起来就是在**控制下行**。\n\n> **不要因为\"止损后它反弹了\"就放弃止损**——不对称性要求的是**长期分布**，不是单次结果（这正好呼应 后见之明与结果偏见：用结果评判决策是本末倒置）。\n\n### ③ 判断\"运气还是技术\"需要样本\n\n至少看一个**完整周期（含一次熊市）**才算数（偶然性与实力判断）。单笔、单季的盈亏不构成证据——马克斯也引了那句：\"硬币即使连续抛出了 10 次正面，第 11 次出现正面的概率仍然是 50%。\"\n\n## ⚠️ 边界\n\n- **不对称性需要足够长的样本才能显现**——别用它给单次交易贴标签。\n- **不是\"每年都要跑赢\"**：马克斯说的是**长期**（衡量标准是\"长期结果是否好过风格本身\"）。\n- **防守不是永远趴着**：纯债券组合在熊市也\"少亏\"——但马克斯的要求是**在风格之外有贡献**（跌时少亏 **且** 涨时跟上），这才是技术。\n\n## 来源\n投资最重要的事（第18章 避免错误；第19章 增值的意义）\n\n## 相关方法\n防御型投资者纪律 —— \"防守优先\"的另一处表述；风险是永久损失 —— 不对称性控制的就是它；后见之明与结果偏见 —— 为什么不能用结果评判决策；为结果负责 —— 决策质量导向的复盘；R乘数、期望值 —— 路线 B 的不对称性怎么算；偶然性与实力判断 —— 样本多长才够",

   "body": "# 防御型投资者纪律\n\n> 一句话：**承认自己不想多费心、要安全，然后照一套固定动作执行**——股债 50:50 分配并定期再平衡、股票部分足够分散、设价格上限不追高、用定期定额买入。它的回报预期是\"轻松取得平均收益\"，代价是放弃\"战胜市场\"的幻想。对大多数人，这是最优解而非妥协。\n\n## 具体怎么做（步骤化）\n格雷厄姆在导言 + 第1、5、9章把\"防御型投资者\"定义为一套可执行的纪律，拆成五步：\n\n**Step 0 先确认自己是防御型**（诚实自检）：\n- 主要兴趣是\"安全 + 不烦恼\"，不愿经常做决定、没时间盯盘研究 → 防御型\n- 愿意花大量时间研究、能承受选错和波动、有超额欲望 → 进攻型\n- 判断错了代价很大：防御型用进攻型的方法（重仓个股/择时）会亏；进攻型气质被按进防御型框架会手痒乱动。\n\n**Step 1 股债分配守住 25%-75% 框，标准位 50:50**：\n- 普通股占比**不低于 25%、不高于 75%**（其余为高等级债券/类现金）\n- 标准配置 50:50；只有两种情况可偏离：①持久熊市出现\"廉价水平\"→ 加股票到接近 75%；②市场水平高得危险 → 减股票到接近 25%\n- 不用预测牛熊：框住上限，牛市再热你也最多 75% 在股票里（防贪婪）；熊市再惨你至少 25% 在股票里（保参与）。\n\n**Step 2 定期再平衡（50:50 公式）**：\n- 当股票涨到 55%（或跌到 45%）时动手：**卖掉 1/11 的股票**转入债券（或反向用 1/11 债券买股票），恢复 50:50\n- 机制价值：强制\"高抛低吸\"——涨多了自动卖一点、跌多了自动买一点，**不需要判断顶底**；在牛市爬到危险高度时，它会自动限制你往股票里追加的钱。\n\n**Step 3 股票部分买\"足够分散的优质组合\"**，三条可选路径：\n- 路径 A（最省事，≈指数化投资）：买一篮子龙头或指数基金——\"购买相同数量的道琼斯 30 种工业股票\"\n- 路径 B：**排除高价股**——价格超过\"过去 7 年平均收益的 25 倍\"或\"最近 12 个月收益的 20 倍\"的一律不买（价格上限 = 自动防投机）\n- 路径 C：只买\"相对不流行的一流大公司\"（冷门龙头，见第7章低市盈率股票长期跑赢的证据）\n- 选股质量标准（第9章表）：大型知名、财务保守、长期不间断分红记录（25 年以上为佳）。\n\n**Step 4 买入用\"美元成本平均法\"（定期定额）**：\n- 每月/每季投入等额资金于普通股组合 → 低价自动多买、高价自动少买，最终持有成本低于任何单一时点的均价\n- 这就是 盈利收益率定投法 / 定投计划落纸面 的原始出处。\n\n**Step 5 心理纪律：波动不当向导，只当指示计**：\n- 价格波动只用于\"衡量投资成败\"，不用于\"决定买卖时点\"\n- 下跌 ≠ 危险信号：先复查买入逻辑，逻辑没变 → 大跌是\"用资金和勇气买入的机会\"（A&P 案例），而不是割肉理由\n- 永不借钱/保证金买入（那会把防御型操作变成投机）。\n\n## 能举的例子\n- 例 1（机械执行）：2021 年抱团股疯涨，股票占比被顶到 70%+——按纪律应卖股买债压回 50%；2022-2024 熊市跌到 40% 以下——按纪律应卖债买股加回 50%。全程不用预测一次顶底。\n- 例 2（价格上限）：某\"好公司\"PE 从 25 倍涨到 60 倍——按路径 B 规则它早就被排除在买入清单外；已持有的可以继续拿，但绝不在高价区加仓。\n- 例 3（定投）：每月固定金额买沪深 300，3000 点自动买得多、5000 点自动买得少——就是美元成本平均法在 A 股的化身。\n\n## 为什么重要 / 常在哪出现\n- 格雷厄姆的实证（第10章）：专业基金经理十年都跑不赢标普 500 → **\"取得平均收益\"不是下限而是多数人的天花板**；防御型纪律是普通人能稳定够到天花板且不掉下来的唯一路径。\n- 它把\"投资\"从\"比谁聪明\"改写成\"比谁守纪律\"——精神态度比技巧更重要（全书反复强调）。\n- 与进攻型的分工：进攻型才有资格谈 安全边际 选股；防御型用\"分散 + 上限 + 再平衡\"**自动获得**安全边际，不需要选股能力。\n\n## 来源\n聪明的投资者（开篇《投资策略》导言 + 第1章 分类 + 第5章 通用组合策略 + 第9章 防御型投资者的证券选择 + 第10章 基金跑不赢指数的证据）\n\n## 相关概念 / 方法\n指数化投资 —— 路径 A 的现代实现；盈利收益率定投法 —— Step 4 升级版（用估值决定买多少）；安全边际 —— 防御型靠分散+上限自动获得的东西；双轨并用决策 —— 路线 A 与防御型纪律同源；钟摆与周期 —— 再平衡在恐慌/狂热端自动高抛低吸的心理依据",

   "status": "未学",
   "oneliner": "马克斯对\"风险 = 波动性\"的学术定义直接说不——\"我确信'风险'就是，首要的是，损失的可能性\"，而且是资本的永久性损失。波动是价格的事，永久损失是本金的事，两者不是一回事。",
   "source": "03-知识/概念/风险是永久损失.md",
   "body": "# 风险是永久损失\n\n> 一句话：马克斯对\"风险 = 波动性\"的学术定义直接说不——**\"我确信'风险'就是，首要的是，损失的可能性\"**，而且是**资本的永久性损失**。波动是价格的事，永久损失是本金的事，两者不是一回事。\n\n## 是什么（第5–7章，全书最重要的三章）\n\n### 一、第5章 理解风险：对\"波动性 = 风险\"的开火\n\n**定义之争（原文 1645–1659 行）**：\n\n> \"金融理论……却将风险明确地定义为**波动性**（或易变性、偏差）。这些词当中没有一个能够表达出'危险'的必然含义。……**我对这一定义不敢苟同。**\"\n>\n> \"我认为，**人们拒绝投资的主要原因是他们担心亏本或收益过低，而不是波动性**。在我看来，'我需要更多的上涨潜力，因为我怕赔钱'，比'我需要更多的上涨潜力，因为我怕价格会出现波动'要合理得多。是的，我确信'风险'就是——**首要的是——损失的可能性**。\"\n>\n> \"**永久性损失的概率是我、橡树资本管理公司以及我所认识的每一位实际投资者所担心的风险。**\"\n\n**学者为什么用波动性（原文 1653 行）**：\"他们**出于方便起见**，才选择了以波动性指代风险。他们需要一个**可计算的、客观的、能够查明来龙去脉的数字**。波动性符合他们的要求，而大多数风险类型不符合。\"\n\n**风险的多种形式（原文 1682 行起）**：\n- **不达目标**：退休高管需 4%、养老基金需 8%——**同一资产对二者风险不同**。\"显然风险是个体化和主观性的。……因此，它不可能是'市场'为要求更高预期收益补偿的那种风险。\"\n- **业绩不佳（基准风险）**：\"每一位不愿放弃优异表现、选择追求不同于指数投资目标的投资者，都会经历业绩欠佳的时候。\"（并指出 1999 年的巴菲特与朱利安·罗伯逊：\"**在那一年，业绩落后是一种勇气的象征**，因为它代表着对科技泡沫的拒绝。\"）\n- **职业风险**、流动性风险、杠杆风险（\"**杠杆不会使投资变得更好，也不会提高获利概率。它只是把可能实现的收益或损失扩大化，这个方法还引入了全盘覆灭的风险**\"）。\n\n### 二、第6章 识别风险：风险在乐观时滋生\n\n**核心论断**：**风险看不见——它在乐观时滋生，在\"人人都认为没有风险\"时最大。**\n\n风险最危险的时候恰恰看起来最安全：人们认为没有风险的东西，价格被推得最高；而\"风险\"这个词在那时几乎不会出现在任何人的讨论里。\n\n### 三、第7章 控制风险：防御型投资与\"错误边际\"\n\n**防御型投资两大要素（原文 5243 行）**：\n\n> \"第一要素是**排除投资组合中的致败因素**，最好的实现方法是：广泛而尽职地调查、提高入选标准、**要求低价和高错误边际**，不要轻易下注在没有把握的持续繁荣、乐观预测和发展上。\"\n\n**错误边际（原文 5277/5290/5295 行）**：\n\n> \"防御型投资的关键要素是沃伦·巴菲特所谓的'**安全边际**'或者'**错误边际**'（他在使用这两个短语时似乎是不加区别的）。\"\n>\n> \"如果未来不能如你所愿，你该如何应对？……**是什么保证了结果的可接受性（即使在未来未按预期发展的情况下）？答案就是'错误边际'。**\"\n>\n> \"如果我们不知道不确定性的存在，我们会坚持一个**大致的安全边际**，当出现不理想的结果时，尚能使你接受。\"\n\n## 对用户最直接的映射（本卡的核心价值）\n\n### ① 路线 A 的账面浮亏不是风险\n\nETF 定投的 −20% 是**波动**；只要没卖，本金没有永久损失。**在恐慌中割肉，才是把波动变成了永久损失。**\n\n→ 马克斯给了\"**越跌越买、不设止损**\"这条纪律的**哲学许可**。\n\n### ② 路线 B 的 −5% 硬止损不是\"认赔\"，而是\"阻止波动变成永久损失\"\n\n题材股一旦逻辑破坏 / 跌破关键位，其下跌不是波动而是**价值毁灭**（没有基本面托底）——这时候必须立刻止损（离场三闸门）。\n\n### ③ 两路线用同一句风险定义，却导出相反的止损纪律\n\n| | 路线 A | 路线 B |\n|---|---|---|\n| 标的 | 宽基指数 | 题材/行业 |\n| 有没有基本面托底 | **有**（长期盈利增长 + 均值回归） | **通常没有** |\n| 下跌的性质 | 波动（会回来） | **可能是永久损失**（可能回不来） |\n| 对应纪律 | 不止损、越跌越买 | **硬止损、不摊平** |\n\n> **这是全库对\"为什么 A 不止损、B 必须止损\"最干净的论证**——不是因为\"宽基安全、题材危险\"这种模糊说法，而是因为**两者下跌的性质不同**。\n\n### ④ 杠杆是永久损失的无条件制造机\n\n马克斯的原话直接命中：\"杠杆不会使投资变得更好，也不会提高获利概率……**还引入了全盘覆灭的风险**。\"——**只要不用杠杆，你就不可能被强制在最低点卖出**（资金管理四上限 的第四条上限即是此意）。\n\n## ⚠️ 边界\n\n- **波动也不是完全不用管**：如果波动会导致你**被迫卖出**（加杠杆、用短期资金、心态崩了），那它**确实会转化成永久损失**。区别不在于波动大小，而在于**你是否被迫离场**。\n- **\"不设止损\"只对\"有基本面托底 + 长期资金\"的标的成立**，别把它套到个股与题材股上（投资与投机之分 已划清边界）。\n\n## 来源\n投资最重要的事（第5章 理解风险；第6章 识别风险；第7章 控制风险）\n\n## 相关概念 / 方法\n安全边际 —— \"错误边际\"的同源概念；现代投资组合理论 —— 与本书正面冲突的\"风险 = 波动\"观（务必对照读）；离场三闸门 —— 路线 B 把波动止损在永久损失之前；钟摆与周期 —— 风险在乐观端积累；第二层次思维 —— 识别\"人人以为没有风险\"的时刻；资金管理四上限 —— 用规则消灭\"被迫卖出\"的可能；投资与投机之分 —— 谁有托底、谁没有",

   "body": "# 二八轮动策略\n\n> 一句话：**市场风格在\"大盘股（二）\"和\"中小盘股（八）\"之间来回切换，与其猜哪边会赢，不如让动量告诉你——定期比较两者近期涨幅，谁强持谁，两个都跌就切国债离场。**\n\n## 是什么\nA 股长期存在明显的**风格轮动**：2013–2015 创业板狂飙时沪深300 趴着不动；2017 年\"漂亮50\"行情时中证500 反而阴跌。这种大小盘之间的轮换俗称\"二八轮动\"（二=大盘蓝筹、八=中小盘成长）。\n\n老罗给的策略建立在**动量效应**上：过去一段时间涨得好的资产，短期内倾向于继续涨（学术上叫横截面动量）。所以不用判断\"哪边便宜/哪边合理\"，只需要**定期比较，机械跟随**：\n\n- 比较对象：**大盘指数**（如沪深300）vs **中小盘指数**（如中证500 / 创业板指）\n- 比较口径：**近 20 个交易日的涨跌幅**\n- 决策：\n  - 大盘涨幅 > 小盘 → **持有大盘指数**\n  - 小盘涨幅 > 大盘 → **持有小盘指数**\n  - **两个都是下跌的** → 两个都不持，**切换到国债/货币基金**（这步是策略的抗跌核心）\n\n## 具体怎么做\n1. **选两只代表指数**：一\"大\"一\"小\"。常用组合：沪深300 + 中证500，或 上证50 + 创业板指（后者风格差更大、轮动更剧烈）。\n2. **定调仓频率**：一般**每周或每两周**比较一次即可，不必每天看（频繁调仓会被手续费和噪音吃掉收益，且容易在转折点上反复打脸）。\n3. **执行调仓**：把上一个周期持有的指数换成当前动量更强的；若两者皆为负，则全部转入国债 ETF / 货基。\n4. **用 C 类份额**：这是本书最实用的一条实操建议——二八轮动需要**频繁申购赎回**，A 类份额的申购费（1.5% 左右）会在几次调仓后吃光利润；**C 类份额免申购费、按日计提销售服务费**，短周期持有成本远低于 A 类。**轮动/网格这类高频策略，优先选 C 类或场内 ETF。**\n5. **场内 ETF 更优**：如果能在券商账户交易，直接用两只对应 ETF 调仓——T+1 到账、佣金万分之几，比场外基金快得多也便宜得多。\n\n## 什么时候用 / 什么时候别用\n- **适合**：A 股明显的**风格分化阶段**；愿意每 1–2 周花几分钟做一次机械操作的人；作为路线 A 的\"增强策略\"（在宽基定投之外，用一部分资金做风格轮动）。\n- **不适合**：\n  - **震荡市里两边都不涨**——动量策略会在假信号之间反复横跳，白白付出摩擦成本（此时该做的是 网格交易法）；\n  - **单一风格的单边市**——比如大盘股独涨一年，轮动策略会一直持有大盘，跟\"简单持有沪深300\"比没有优势，却多了一堆操作；\n  - **路线 B 题材 ETF 仓位**——路线 B 有明确的 -5% 止损和赛道研究流程（见 ETF交易系统 §3A/§3B），二八轮动是**指数层面的风格切换**，不是赛道选择，两者不能混用。\n\n## 提醒（别把回测当承诺）\n- 动量策略的回测收益通常非常漂亮，但它**对起始时间、调仓频率、交易成本极度敏感**——把调仓周期从 20 日改成 15 日，回测曲线可能完全不同。**别拿书里的回测数据当预期收益。**\n- A 股 2016 年后\"二八\"的节奏和 2013–2015 已大不相同，风格切换的持续时间和幅度都在变。**先小资金试跑半年**，再决定是否放大。\n- 另一个相关的行业层轮动是**美林投资时钟**（衰退→债券 / 复苏→股票 / 过热→大宗 / 滞胀→现金），属于更宏观的资产轮动框架，与二八轮动是不同层级，不要混为一谈。\n\n## 来源\n指数基金投资从入门到精通（第9章 9.1 大小盘轮动 / 二八轮动；9.2 行业指数轮动——美林投资时钟）\n\n## 相关方法 / 概念\n网格交易法 —— 震荡市的对应策略（**轮动管趋势切换、网格管区间摆动**）；钟摆与周期 —— 更宏观的周期判断框架；ETF交易系统 —— 路线 B 的赛道研究流程（与本法层级不同）；成本拖累 —— 频繁调仓的成本是轮动策略最大的敌人（C 类份额/ETF 就是为此）",

   "source": "03-知识/方法/定投止盈三法.md",
   "body": "# 定投止盈三法\n\n> 一句话：**定投\"会买\"只是入场券，\"会卖\"才是把浮盈变成真钱的那一下。三套止盈法（市场情绪法 / 目标收益率法 / 估值法）各有适用场景，实战是组合着用，不是三选一。**\n\n## 是什么\n老罗在第 8 章开篇就点破：定投亏损的四大原因里，\"该止盈没止盈\"占一条——很多人不是买错，是**赚了不走，坐了过山车回到原点**。指数基金定投是**周期性**策略（一个微笑曲线走完就该落袋），不是买入后永远持有的\"信仰仓\"。止盈的价值在于：它把\"市场先生\"给的浮盈锁成账户里的现金，再开启下一轮定投，形成复利循环。\n\n三套方法（书中给全）：\n1. **市场情绪法**——不看数字，看人：全民谈股、券商开户剧增、新基金一日售罄百亿、融资余额飙升、身边\"人人股神\"时，就是该卖的信号。**最钝但最不会漏掉大顶。**\n2. **目标收益率法**——设定一个收益率目标（如 20%/30%），达到就分批赎回。目标的最小值用**机会成本**倒推：\n   **最小目标收益率 = (1 + 通胀率 + 理财年化收益率)^定投年限 − 1**\n   （例：通胀 3% + 理财 4%，定投 5 年 → 1.07^5 − 1 ≈ 40.3%；低于这个数，定投还不如存理财）\n3. **估值法（分批止盈，书中主力推荐）**——按指数 PE 的历史分位分批走。书里以中证500为例给了一套完整档位：\n\n| 中证500 PE | 动作 |\n|---|---|\n| PE = 60 | 赎回 **60%** |\n| PE = 70 | 再赎回 **30%**（累计 90%） |\n| PE = 80 | 赎回剩余 **10%**（清仓） |\n| 从最高点回落 60% | 全部赎回（防暴跌吞掉盈利） |\n\n## 具体怎么做\n1. **先定\"用哪套为主\"**：估值法为主（有客观刻度、可预期），市场情绪法为辅助刹车（估值还没到但市场已经疯了 → 提前卖一点），目标收益率法作为兜底（怕自己算不清估值时用）。\n2. **止盈必须分批，不许一把清**：书中三原则第一条就是\"**不奢求卖在最高点**\"。分批的意义是——卖飞了还有仓位、跌下来还有钱；一次性全清则是把择时压力全押在一个点上。\n3. **早期不止盈，中后期才用**：定投前 1–2 年积累的份额少、本金小，这时候止盈收益微乎其微，白交手续费；**至少走完一轮完整微笑曲线、本金规模显著之后**再启用止盈。\n4. **估值法要算\"分位\"不是\"绝对值\"**：PE=60 对中证500 是高位，对银行指数可能只是正常。**同一套数字阈值只对同一只指数有效**（书中档位是给中证500 的）。\n5. **止盈后钱不能闲**（书中 3 条路，作者更倾向第 3 条）：\n   - ① 继续按原方式定投同一只（最省心）；\n   - ② 对原指数加倍定投（看多但想摊薄成本）；\n   - ③ **增投另一只处于低估的指数**（作者最推荐——资金永远流向最便宜的地方，这是\"估值定投\"的延续）。\n\n## 什么时候用 / 什么时候别用\n- **适合**：路线 A 宽基/行业指数定投的**周期性止盈**；已经走完一轮微笑曲线、账户有明显浮盈时。\n- **不适合**：**路线 B 题材 ETF 短线**——那走的是 离场三闸门（-5% 硬止损 / 逻辑止损 / 最高价回撤 5% 移动止损），**路线 B 没有\"目标收益率止盈\"这回事，卖飞是止损税**。两套逻辑不能混用。\n- 也不适合：还在积累期的定投账户（本金太小，止盈不划算）；以及\"打算一辈子不卖、只靠分红\"的红利型策略（那是现金流逻辑，不是微笑曲线逻辑）。\n\n## 与螺丝钉的同名方法对比\n指数基金投资指南（螺丝钉）的止盈核心是 盈利收益率定投法 的**单一阈值**（盈利收益率 <6.4% 分批卖出）——刻度清晰、执行简单，但只适用于盈利稳定的宽基。\n老罗这本给的是**三套并列的工具箱**，覆盖面更广：市场情绪法可以捕捉\"估值还没到位但已经泡沫\"的情况，目标收益率法给了\"我不知道怎么看估值\"的人一条退路。**建议：以螺丝钉的估值阈值为日常主用，老罗的三法作为补充与交叉验证。**\n\n## 来源\n指数基金投资从入门到精通（第8章 8.1 如何止盈 / 8.4 两种止盈方法测算 / 8.5 止盈后盈利再投 / 8.6 止盈赎回金额的处理）\n\n## 相关方法 / 概念\n盈利收益率定投法 —— 螺丝钉版的估值止盈阈值（姊妹方法，可交叉验证）；离场三闸门 —— **路线 B 的离场逻辑**（与本法严格区分，别串用）；定投计划落纸面 —— 止盈规则必须写进那张计划表，否则临场一定会手软；高估五类 —— 李大霄版\"什么时候算高\"的判断（估值之外的情绪维度）",

   "source": "03-知识/方法/核心-卫星策略.md",
   "body": "# 核心-卫星策略\n\n> 一句话：**把资产分成两圈——\"核心\"（大比例、宽基、长期不动）保住基本盘，\"卫星\"（小比例、行业/主题、灵活调整）去搏超额收益。核心决定你能不能赚到市场的钱，卫星决定你能不能赚到更多。**\n\n## 是什么\n资产配置里最经典的结构之一，老罗在\"大类资产配置 ETF\"一节里作为第一种方法给出。它解决的矛盾是：**全部买宽基 → 稳健但平庸；全部买行业主题 → 弹性大但波动也大、择时要求高。** 核心-卫星的做法是\"两条腿走路\"：\n\n| 层次 | 比例（典型） | 内容 | 特征 |\n|---|---|---|---|\n| **核心（Core）** | **60%~80%** | 宽基指数 ETF（沪深300 / 中证500 / 创业板 / 标普500 等） | 长期持有、几乎不动、低成本、分散 |\n| **卫星（Satellite）** | **20%~40%** | 行业 / 主题 / 策略 ETF（医药、消费、科技、红利等） | 灵活调整、有机会才配、允许波段 |\n\n核心的作用是**\"不掉队\"**——它保证你长期能拿到市场平均回报（这已经能跑赢绝大多数人，见 指数化投资、成本拖累）。卫星的作用是**\"追超额\"**——在你看好的方向上加大暴露，做对了能显著抬高收益，做错了也不会伤到基本盘。\n\n## 具体怎么做\n1. **先定核心 / 卫星比例**：起手建议 **核心 70% / 卫星 30%**。判断标准是你的\"精力 + 认知 + 波动承受力\"——没时间研究行业的人，核心应到 80%~90%；能持续跟踪赛道的人，卫星才可到 30%~40%。\n2. **核心部分：选宽基、长期持有、不管涨跌**：核心不做择时、不做波段（真要加点增强，用 智能定投（定期不定额） 处理买点；止盈走 定投止盈三法）。**核心最大的纪律是\"不动\"**——一旦开始对核心做波段，策略就退化成\"全仓择时\"了。\n3. **卫星部分：必须有明确的入选理由**：不是\"听说这个行业要涨\"，而是走完 新赛道研究五步法（逻辑 → 验证 → 位置 → 右侧确认 → 小仓试错）后才进。**卫星部分适用路线 B 的离场纪律**（见 离场三闸门：逻辑破就撤，-5% 止损）。\n4. **定期再平衡**：每隔半年/一年，把偏离原定比例的部分调回（比如卫星涨到 45% → 卖出多余部分补回核心）。再平衡本身就是**机械化的\"高卖低买\"**，不依赖预测。\n5. **另两种配置法（书中同节并列给出，按需选用）**：\n   - **目标日期策略**——按\"距离用钱的年份\"自动调整股债比例（年轻时股票多、临近用钱年份逐步转债券），适合明确用途的钱（教育金、养老金）；\n   - **目标风险策略**——先定\"我能承受多大波动\"，再倒推股债比例并长期维持，适合风险偏好明确的人。\n\n## 什么时候用 / 什么时候别用\n- **适合**：有一定资金规模、想把长期底仓和进攻仓位分开管理的人；**路线 A + 路线 B 并行的账户结构框架**——核心 = 路线 A 宽基仓位，卫星 = 路线 B 题材仓位，**这套比例关系天然对应你现在的双路线体系**。\n- **不适合**：资金很小（核心都凑不齐一手时，分两圈只会增加管理成本）；没有区分能力的账户（把卫星当核心拿、或把核心当卫星炒，都会让策略失效）。\n- **风险测度提示**：书中同节给了三种风险衡量工具——**标准差**（波动幅度）、**VaR**（在给定置信度下最多亏多少）、**ES**（超过 VaR 之后的平均损失，也叫条件 VaR）。做配置时至少要有一个指标来量化\"这个组合能跌多少\"，别只凭感觉。\n\n## 与你现在双路线体系的对应关系\n| 你的体系 | 核心-卫星对应 |\n|---|---|\n| 路线 A（宽基定投，不止损、越跌越买） | **核心仓**（60%~80%）——不动、低估加仓、按估值止盈 |\n| 路线 B（题材 ETF 波段，-5% 硬止损、不摊平） | **卫星仓**（20%~40%）——按赛道研究进、按 离场三闸门 出 |\n\n> ⚠️ 这个映射的价值在于：**不要把路线 B 的仓位当成\"核心\"来扛**。卫星仓的核心纪律是\"错了就走\"，一旦用\"反正长期看会涨\"的心态对待卫星仓，就等于把 -5% 止损纪律废掉了（这是当前报告里反复提示的风险点）。\n\n## 来源\n指数基金投资从入门到精通（第9章 9.8 大类资产配置ETF——核心-卫星 / 目标日期 / 目标风险三法 + 风险测度）\n\n## 相关方法 / 概念\n生命周期资产配置 —— 目标日期策略的同源内容（漫步华尔街）；资产与现金流 —— 配置的前提是分清资产类型；新赛道研究五步法 —— 卫星仓的入选流程；离场三闸门 —— 卫星仓的离场纪律；成本拖累 —— 核心仓选低费率 ETF 的理由",

   "body": "# 网格交易法\n\n> 一句话：**震荡市专用——把价格划成等距的格子，跌一格买一份、涨一格卖一份，用机械化的\"低买高卖\"把上下摆动变成现金流。但它是\"区间策略\"：一旦走出区间（跌破最低价 / 突破最高价），策略立刻失效。**\n\n## 是什么\n网格交易解决一个具体问题：市场 70% 的时间在震荡（不涨不跌、来回摆），定投在这种行情里收益平庸，趋势策略又反复被假突破打脸。网格的解法是**放弃预测方向，只赚波动**：设定一个价格区间，在区间内画若干条等距水平线（网格线），价格每下穿一条线就买入一份，每上穿一条线就卖出之前买的那份。\n\n老罗给的三步操作：\n1. **制定网格计划**——定区间（最低价~最高价）、定格数（把区间切成 N 格）、每格投入金额；\n2. **下跌买入**——价格跌破某条网格线 → 按计划买入；\n3. **上涨卖出**——价格涨回上一条网格线 → 卖出对应份额，锁定这一格的利润。\n\n**核心收益来源不是\"涨\"，是\"摆动次数\"**：一个震荡了 10 次的区间，网格能赚 10 次的格差；而买入持有的收益是 0。\n\n## 具体怎么做\n1. **先确认标的在震荡**：这是前提中的前提。判断依据——观察近半年/一年是否在一个明显的高低区间内来回（如传媒、券商这类周期性行业在非趋势期常有这种形态）。**趋势市里用网格 = 系统性少赚（上涨时不断卖飞）或系统性深亏（下跌时不断接飞刀）。**\n2. **区间与格数**：区间上下界参考历史波动区间（别拍脑袋），格数决定格差——格太密 → 交易成本吃掉利润、资金耗光太快；格太疏 → 半天不成交一次。**格差至少要覆盖双边交易成本**（ETF 场内买卖约万分之几，但要注意最低佣金）。\n3. **选品五条件**（书中明确）：\n   - **震荡市**（不是趋势市）；\n   - **ETF 优于个股**（个股会退市/爆雷/停牌，网格最怕\"标的消失\"）；\n   - **低估值区域**（万一破网下跌，低估品种还有\"拿得住\"的底气）；\n   - **高波动**（波动小 = 格差赚不到钱）；\n   - **必须有底仓**——书中案例（传媒 ETF 512980）明确要求**留 20% 底仓**，用于防止\"突破最高价后手里没筹码、眼睁睁看它涨\"。\n4. **准备资金上限**：网格最坏的情况是\"一路跌破区间最低价\"，此时你手里全是套牢筹码。所以**网格资金必须独立核算、单独设上限**，且只用闲钱——不能因为\"再降一格该买了\"而动用生活费。\n\n## 四大问题（书中原话，必须逐条认领）\n1. **跌破最低价 → 全部套牢亏损**：网格的下界不是支撑，市场可以无限往下走。\n2. **突破最高价 → 空仓踏空**：格子卖完了，后面的大涨跟你无关（这就是\"底仓\"要留的原因）。\n3. **资金使用效率不高**：为了接下跌，你必须长期预留大量现金在账户里趴着——这部分钱的机会成本就是网格的隐性开销。\n4. **不适合上班族**：本质是**需要盯盘/挂单的短线操作**，跟\"上班族省心理财\"的初衷相悖（可以用条件单缓解，但不是零操作）。\n\n## 什么时候用 / 什么时候别用\n- **适合**：路线 A 体系里的**震荡市增强**——用一只已经低估的行业/宽基 ETF，拿一小部分资金独立做一个网格账户；周期股行业 ETF（券商、传媒、银行）在无明显趋势时可考虑。\n- **不适合**：\n  - **趋势市**（尤其单边下跌——网格会变成\"分批接飞刀\"，与 金字塔法买入策略 的纪律化加仓完全不同，网格是机械的、无估值停顿的）；\n  - **路线 B 题材 ETF 仓位**——路线 B 有 -5% 硬止损和移动止损（见 离场三闸门），网格的\"跌了继续买\"与止损纪律**直接冲突**，绝不能在同一笔仓位混用；\n  - 没时间盯盘/不会用条件单的上班族（书中明说不适合）；\n  - 资金规模很小（格差不够覆盖手续费时，网格是给券商打工）。\n\n## 实战验证（2026-10-01 实测 · 本库自有数据）\n\n> 起因：用户提出「震荡市或许可以采取另一种新的交易方式——区间交易法」。做了一轮**可信回测**检验它是否值得作为独立一条腿加入系统。\n>\n> **结论：33 个组合，正超额 0 个。不建议采用。**\n\n**回测设计**（为消除未来函数而刻意保守）：\n\n| 项 | 设定 |\n|---|---|\n| 区间 | **固定边界**：只用起点**之前** 250 日收盘价的 10~90 分位带，宽度夹在 8%~35%，之后**永不移动** |\n| 网格线 | **真等距网格线**（上穿卖、下穿买），非「从上次买入涨 g%」 |\n| 区间用分位带而非极值 | 极值会被单次股灾撑爆（实测 2016 起点用极值时区间宽达 **96.7%**，格差过大 → **一笔不成交**）|\n| 机会成本 | 闲置现金按 **1.5%/年** 计息；**基准同为 50% 仓位 + 50% 现金计息**（同风险敞口）|\n| 评价口径 | **超额 = 网格终值 − 基准终值**（「做网格」这份劳动的真实报酬）|\n| 参数 | 4 只宽基/行业 ETF × 3 个起点（2016-01 / 2019-01 / 2022-01）× 3 种格数（4/6/8）|\n\n**结果**：\n\n```\n正超额   0 / 33 （0.0%）\n中位    −8.3%      最好 −0.0%（仅打平）      最差 −35.7%\n```\n\n| 标的 | 超额中位 | 正超额 | | 格数 | 超额中位 |\n|---|---:|---:|---|---|---:|\n| 沪深300ETF | −3.8% | 0/9 | | 4 格 | −5.1% |\n| 证券ETF | −0.0% | 0/6 | | 6 格 | −8.3% |\n| 创业板ETF | −22.6% | 0/9 | | 8 格 | −9.9% |\n| 中证500ETF | **−25.5%** | 0/9 | | | |\n\n**2000 元本金实测（最刺眼的三行）**：\n\n| 起点 | 标的 | 交易数 | 网格终值 | 基准终值 | 超额 |\n|---|---|---:|---:|---:|---:|\n| 2022-01 | 沪深300ETF | 29 | 1,944 | 2,049 | −104 |\n| 2022-01 | 中证500ETF | 118 | 1,481 | 2,066 | **−585** |\n| 2016-01 | 中证500ETF | 196 | 1,580 | 2,459 | **−879** |\n\n→ **做了 196 次交易，比什么都不做少 879 元。**\n\n**机制解释（对应上面「四大问题」的哪几条）**：\n\n- 「破下界」在**几乎每个组合都发生** → 网格资金全部买光（满仓在区间底部），价格继续跌时**没有子弹**；而基准的 50% 现金还在。**四大问题第 1 条兑现。**\n- A股宽基**长期上行**，区间破了上界就开始「卖飞」，现金越攒越多、仓位越来越轻 → **四大问题第 2 条兑现**，且机会成本持续累积（成本拖累 的镜像）。\n- **格数越多越差**（−5.1% / −8.3% / −9.9%）：交易越频繁，**区间判错被放大**。\n\n**最关键的认识**：网格需要一个「区间」，而**区间边界只有事后才清楚**——它与路线B 的 ③线口径诊断 犯了**同一类错误**：都假设「过去的结构能框住未来」，只是形式不同（③线框突破点，网格框波动范围）。\n\n**未验证的两条（结论需保留余地）**：\n\n1. 本轮**区间永不更新**（为消除未来函数而做的保守选择）。若允许定期重估区间，结果可能改善——但「何时重估」本身变成新的择时问题，且**易过拟合**。\n2. **未加「震荡状态过滤」**（只在低波动期开网格）。这是网格理论上最该做的，但「实时判定是否处于震荡」正是待验证的东西，用它来筛选会**循环论证**。\n3. 用**收盘价**判成交（真源应用盘中触发/条件单）。收盘价确认**避免了假触发**，故真实网格**可能更差、不会更好**。\n\n**附带的有用发现（与网格无关，但可复用）**：\n\n- **波段幅度实测**：沪深300ETF 近 120 日振幅中位 **21.8%**、创业板ETF **35.1%**、中证500ETF **27.0%**、证券ETF **29.3%** —— **波动是够的，问题不在「有没有波动可赚」，而在「区间框不住」。**\n- **交易成本不是障碍**：用户实测佣金 ≤6,000 元收 **0.3 元固定**，40 次交易 = 24 元。故本卡「不适合」条件中「资金规模小 → 给券商打工」一条，**在当前佣金下不成立**。\n\n## 来源\n指数基金投资从入门到精通（第9章 9.6 网格交易法——含三步操作、四大问题、选品五条件与传媒 ETF 512980 案例）\n\n## 相关方法 / 概念\n金字塔法买入策略 —— 趋势下跌时的替代方案（**网格 vs 金字塔：震荡 vs 趋势，用错会亏**）；定投止盈三法 —— 网格的\"每格卖出\"是微观止盈，与整体止盈是两层；离场三闸门 —— 路线 B 的止损纪律（与网格互斥）；机械交易系统 —— 网格本质就是一种机械交易系统（规则化、无情绪），可对照阅读；等待最佳时机 —— **本次实测的最终落点**：震荡市「没有合适的交易方式」不是缺陷，而是系统正确识别出「现在不该交易」；③线口径诊断 · 路线B大样本回测 —— 同期的两条回测证据（**区间/结构框不住未来**的两种表现形式）",

   "source": "03-知识/方法/金字塔法买入策略.md",
   "body": "# 金字塔法买入策略\n\n> 一句话：**熊市专用加仓法——资金切成 10%/20%/30%/40% 四层，越跌买得越多（买得越便宜、仓位越重），把\"越跌越怕\"翻转成\"越跌越有料\"。**\n\n## 是什么\n老罗在第 9 章把买入方式按市场状态分成三种，这是最实用的一张对照表：\n\n| 市场状态 | 该用的买入法 | 逻辑 |\n|---|---|---|\n| **单边牛市** | 满仓（一次性买入） | 越等越贵，早买早赚 |\n| **震荡市** | 分批买入 / 网格交易法 | 上下摆动，靠区间赚差价 |\n| **熊市（下跌趋势）** | **金字塔法** | 越跌越便宜，分批加仓摊成本 |\n\n金字塔法的本质是**\"倒着摊\"**：普通\"越跌越买\"如果每次买一样多，成本下降很慢；金字塔法把资金按 **10% → 20% → 30% → 40%** 递增分配，**最后跌得最深的那一层下的注最大**——所以只要市场反弹到中位，整个仓位就已经回本甚至盈利。\n\n## 具体怎么做\n1. **资金切成 4 份**：10% / 20% / 30% / 40%（比例递增是关键，平均分就失去了金字塔的意义）。\n2. **确定\"每跌多少算一层\"——这个 X 值随估值高低调整**（书中给的三档，非常重要）：\n\n| 当前位置 | 触发加仓的跌幅 X | 含义 |\n|---|---|---|\n| **估值高位** | 每跌 **15%~20%** 加一层 | 高位下跌可能刚开始，等跌够了再出手 |\n| **估值中位** | 每跌 **8%~15%** 加一层 | 折中 |\n| **估值低位** | 每跌 **5%~8%** 加一层 | 已经很便宜，别等太久，跌一点就该接 |\n\n**逻辑**：估值越低，说明离底部越近，加仓间隔就该越密（怕错过），而不是死等一个固定的 20%。\n\n3. **只对\"敢拿 3 年\"的标的用**：金字塔法必然会经历\"买了还跌\"的阶段（这是它的设计前提）。用之前先问自己：这笔钱 3 年不用吗？标的不会退市/清盘吗？（宽基指数 ETF 满足；单只个股不满足）\n4. **配套的分批法（书中同章给的简化版）**：先买 30%，跌 15% 再补 30%，再跌 15% 补剩下的 40%——三层结构和金字塔同源，适合不想切四份的人。\n5. **和定投的关系**：金字塔法是**存量资金的一次性部署方法**（手里突然有一笔钱，怎么分批进场）；定投是**增量现金流的持续投入方法**。两者不冲突——定投打底，遇到大级别下跌时用金字塔法把闲置资金投进去。\n\n## 什么时候用 / 什么时候别用\n- **适合**：路线 A 宽基指数（尤其熊市/大幅回调阶段）；手里有一笔闲钱、不想一次性全投进去的人；已经算过估值、确认处于中低分位时。\n- **不适合**：**路线 B 题材 ETF——这是本法的绝对禁区**。路线 B 的纪律是 **-5% 硬止损、不摊平、破位全清**（见 离场三闸门 与 ETF交易系统 §3B）。在下跌趋势里对路线 B 仓位\"金字塔加仓\"，就是在做\"越跌越买亏损股\"，是最典型的爆仓路径。\n- 也不适合：没有估值判断能力就直接开投（**X 值的选择完全依赖估值分位**，不知道自己在哪里就会把高位下跌误判成\"低位\"）；标的可能归零/清盘的品种。\n\n## 来源\n指数基金投资从入门到精通（第9章 9.3 三种投资策略 / 9.4 金字塔法买入 / 9.5 分批买入策略）\n\n## 相关方法 / 概念\n智能定投（定期不定额） —— 同一\"越跌买越多\"思想的温和日常版（本法是极端版、一次性部署）；网格交易法 —— 震荡市的姊妹策略（一个管趋势下跌、一个管区间摆动，**用错场景都会亏**）；离场三闸门 —— **路线 B 的相反逻辑**（务必区分路线 A / B）；定投计划落纸面 —— X 值与层数必须事先写死",

   "body": "# 价格围绕价值波动\n\n> 一句话：**短期涨跌由供求决定，与估值几乎无关；估值只在 3~5 年的尺度上才起作用**——所以\"买了低估值却还跌\"是正常的，不代表判断错了。巴菲特的小狗比喻：股价像跟着主人散步的小狗，一会儿跑前一会儿落后，但主人到终点时，小狗也到了。\n\n## 是什么意思\n- **短期**：涨跌主要看供求关系（追涨杀跌会自我强化：越涨越惜售 → 供少求多 → 加速上涨；越跌越抢卖 → 供多求少 → 加速下跌）；\n- **长期**：内在价值不断上涨，**价格围绕价值上下波动**；\n- 举例（书中原例）：日本核泄漏谣言引发抢盐 → 盐价从几毛涨到十几块 → 涨跌由\"购买者的疯狂程度\"决定，与盐本身价值无关；\n- 所以：**低估 ≠ 马上涨，高估 ≠ 马上跌**。\n\n## 为什么重要 / 常在哪出现\n- 它回答定投者最常见的困惑：**\"我买的是低估品种，为什么还跌？\"** ——答案是\"你看的时间尺度不对\"；\n- 三层投资者对照（书中原话）：\n  - **普通散户**：判断不出价格与价值的关系 → 只看涨跌 → 追涨杀跌；\n  - **高手**：能判断价格与价值的关系 → 价格低于价值时投资 → 耐心等回归；\n  - **大师**：还能反向利用大众情绪 → \"恐慌时贪婪，贪婪时恐慌\"（巴菲特经典案例多发生在股灾最恐慌时）；\n- 与 均值回归 同源，但本卡强调**时间尺度**：短期无效、3~5 年才有效；\n- 与格雷厄姆的\"市场先生\"寓言（见 聪明的投资者 第二章）呼应：市场报价是情绪而非价值判断；\n- 对路线 A 的意义：**\"买入时估值越低，未来收益越好\"** 这条结论成立的前提，正是\"3~5 年尺度上价格会回归价值\"。\n\n## 能举的例子 / 反例\n- **例 1（小狗比喻）**：主人（价值）沿马路前进，小狗（价格）跑前跑后 → 最终同到终点。投资要找的就是\"落后于主人的小狗\"。\n- **例 2（短期不相关）**：股票内在价值短期变化不大（指数背后几十上百家公司，经营不会短期剧变）→ 短期波动几乎全是供求造成的。\n- **例 3（恐慌时的机会）**：巴菲特多数经典案例发生在市场最恐慌时 → 正是\"价格远低于价值\"的时刻。\n- **反例**：用\"低估了就该涨\"作为短线买入理由 → 时间尺度错配 → 短期继续跌就慌，往往割在最低点。\n\n## 相关概念 / 方法\n均值回归 —— 价格回归价值的统计表述；低估是一个区域 —— 估值的可操作区间；安全边际 —— 价值与价格差额的保护；第二层次思维 —— 超越大众情绪的判断；钟摆与周期 —— 情绪在贪婪与恐惧间摆动",

   "source": "03-知识/概念/低估是一个区域.md",
   "body": "# 低估是一个区域\n\n> 一句话：**\"低估\"不是一个精确的点，而是一个区间**——历史最低 5 倍 PE 不代表未来还能等到。一味等\"最便宜\"可能永远等不到，只要还在低估区域，就可以开始投；买到\"次便宜的\"完全可以接受。\n\n## 是什么意思\n- 指数基金的历史最低估值（如 5 倍市盈率）是**极端情况**，未来不一定会重现；\n- 但我们可以判断\"6~7 倍 PE 大概率处于低估区域\"——**这个判断就足够指导操作**；\n- 所以：**低估是一个区域（range），不是一个点（point）**。\n\n## 为什么重要 / 常在哪出现\n- 它解决的是定投中最常见的手软场景：**\"它还低估，但已经涨了，下不去手\"**；\n- 逻辑链条：低估是区域 → 区域内每一笔买入都在买\"便宜的股份\" → 只是便宜程度不同 → **不必等最便宜**；\n- 与 均值回归 配合：价格围绕价值波动，回归是方向，但**回归的幅度与时间都不确定**；\n- 与 盈利收益率定投法 配合：那卡给\"区域边界\"的量化（>10% 买 / 6.4%~10% 持有 / <6.4% 卖），本卡给\"区域性质\"的定性理解；\n- 对路线 A 的意义：**由\"等最低点\"改为\"在低估区域内持续买入\"**，才可能真正开始并坚持。\n\n## 能举的例子 / 反例\n- **例 1**：某指数历史最低 5 倍 PE。若死等 5 倍 → 可能永远等不到 → 错失整轮行情；若判断\"6~7 倍属低估区域\"并按计划买入 → 拿到的是\"便宜股份\"。\n- **例 2**：定投品种已经涨了一波但仍在低估区 → 主观\"下不去手\" → 解决方式是明白\"低估是区域\"，按计划继续投。\n- **反例**：把\"低估区域\"当成\"随便买都行\"——如果估值已回到正常区间（盈利收益率 6.4%~10%），就不该定投而应持有。\n\n## 相关概念 / 方法\n盈利收益率定投法 —— 低估区域的量化边界；均值回归 —— 价格围绕价值波动；定投频率选择 —— 区域内\"下不去手\"的另一解法；定投计划落纸面 —— 用纸面计划对抗手软；系统1与系统2 —— 主观感觉越权的机制",

   "type": "方法",
   "status": "未学",
   "oneliner": "指数基金的复利有三个来源，而且有两个不需要你买卖就能拿到——①低买高卖的价差 ②公司盈利再投入 ③分红再投入。不理解这一层，就会误以为\"不涨就没收益\"，从而拿不住。",
   "source": "03-知识/方法/复利三来源.md",
   "body": "# 复利三来源\n\n> 一句话：**指数基金的复利有三个来源，而且有两个不需要你买卖就能拿到**——①低买高卖的价差 ②公司盈利再投入 ③分红再投入。不理解这一层，就会误以为\"不涨就没收益\"，从而拿不住。\n\n## 具体怎么做（步骤化）\n\n**来源一：低买高卖（唯一需要买卖的）**\n- 低估时定投、正常或高估时卖出 → 赚\"价值上涨 + 价格追上价值\"两段；\n- 多来几轮，价差本身产生复利；\n- 这在 A 股尤其重要：**A 股波动率居世界前列，\"暴涨暴跌带来的复利目前最高\"**。\n\n**来源二：公司盈利再投入（持有即享有）**\n- 公司把每年赚的钱再投进新业务 → 下一年赚更多 → 股价随盈利长期上涨；\n- **不需要你买卖，只要持有就在发生**；\n- 例：恒生指数从 100 点 → 26000 多点（260 倍），**这 260 倍主要就是盈利再投入的复利**。\n\n**来源三：分红再投入（持有即享有）**\n- 成熟公司再投入没有好回报 → 把利润分给股东 → 你拿分红再买基金 → 买到更多公司股份；\n- **同样不需要买卖，但需要主动把分红再投**（见 分红再投入与填权）；\n- 例：恒指从 100 点 → 若计入分红再投，可涨到 68000 多点（680 倍）——**多出的 420 倍就是分红再投的威力**。\n\n**关键取舍：后两种复利通常不可兼得**\n- **盈利再投入复利高** → 经济景气周期、估值通常偏高 → 分红再投效果差；\n- **分红再投效果好** → 市场整体较差、估值偏低 → 盈利再投复利少；\n- 所以对定投者而言，**\"盼着低估时间长一些\"是对的**：同样多的钱能买更多便宜股份。\n\n**操作口诀**\n> **高筑墙**（价格大大低于价值时买入）、**广积粮**（低估区域不断定投积累股份）、**缓称王**（定投时间越长，牛市收益越高）。\n\n## 能举的例子\n- **例 1（恒指 260 vs 680 倍）**：点数默认不含分红再投 → 260 倍 = 盈利再投入的复利；计入分红再投 → 680 倍，**差额即分红复利**。\n- **例 2（王大爷包子铺）**：\n  - 阶段一：每年赚 2 万 → 全投回包子铺扩大生产 → 第二年赚 3 万 → **盈利再投入复利**；\n  - 阶段二：规模到顶，再投也不增长 → 把利润拿出来做其他投资 → **分红再投入复利**。\n- **例 3（红利指数算术）**：买 1000 万元红利指数 → 背后公司年赚约 120 万净利润 → 其中 30%~40% 现金分红（即 36~48 万），剩余留存再投入 → **一笔钱同时吃两种复利**。\n- **例 4（股息率的构成）**：**股息率 = 盈利收益率 × 分红比例** → 美股盈利收益率只有 5%~6%，但分红比例高（50%~60%），股息率仍可达 3%~4%，与国内相当。\n\n## 为什么重要 / 常在哪出现\n- 它解释了**\"为什么长期持有本身就是一种收益来源\"**——很多人以为指数基金只有\"低买高卖\"一条路，于是拿不住；\n- 与 分红再投入与填权 互补：那卡讲**分红怎么处理**（操作），本卡讲**复利的完整地图**（原理）；\n- 与 资产与现金流 呼应：盈利再投入 = 资产自我增值，分红再投入 = 现金流转化为更多资产；\n- 对路线 A 的意义：**\"盼低估、拿得住\"有了理论依据**——低估时买入的份额会在未来同时贡献三种复利。\n\n## 反例 / 注意\n- **别只盯价差**：如果只认\"低买高卖\"，长期持有的两种复利就被浪费了；\n- **分红再投必须主动做**：默认现金分红 = 放弃第三种复利；\n- **两种复利不可兼得是规律不是缺陷**：不要试图在同一时间点同时最大化两者；\n- **复利速度受估值影响**：越低估，分红再投效果越好（本质仍是\"低估买入\"）。\n\n## 来源\n指数基金投资指南（第8章 投资指数基金，复利从哪里来）\n\n## 相关概念 / 方法\n分红再投入与填权 —— 第三种复利的具体操作；金鹅与瘦鹅 —— 金蛋（分红）与鹅（资产）；资产与现金流 —— 能生钱的才是资产；盈利收益率定投法 —— 低估买入的阈值工具；定投收益放大器 —— 提升复利速度的金额公式",
