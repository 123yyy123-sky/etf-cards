   "status": "使用中",
   "oneliner": "开盘只执行，盘中不动手，收盘做判断。",
   "source": "07-复盘笔记/ETF/交易手册-人读/04-每日动作清单.md",
   "body": "# 每日动作清单\n\n> 一句话：**开盘只执行，盘中不动手，收盘做判断。**\n\n## 一、开盘 9:30~9:45\n\n**只做一件事：执行昨天收盘定好的动作。**\n\n- [ ] 昨天有没有触发止损？→ 有，开盘卖，不看价格\n- [ ] 昨天有没有触发加仓？→ 有，按 9:30~9:45 限价买\n- [ ] 两者都没有 → **什么都不做**\n\n**开盘绝对不能做的事**：\n\n- 看到低开就恐慌卖\n- 看到高开就追买\n- 临时改主意\n\n**为什么？** 开盘 15 分钟的价格最不真实，情绪最重。你的规则是收盘定的，就别在开盘改。\n\n## 二、盘中（9:45~14:45）\n\n**原则上不看盘。**\n\n真要看，只看三件事：\n\n- [ ] 有没有跌破止损价（**只看，不操作**，等收盘确认）\n- [ ] 有没有涨到需要抬止损线（同样等收盘）\n- [ ] 大盘是不是突然暴跌（超过 2%）\n\n**盘中跌破止损不算触发。** 收盘拉回来就没事。这是规则，不是自我安慰。\n\n## 三、午盘 11:30（看报告）\n\n自动化会推午盘报告。你只需要看四行：\n\n- [ ] **红线检查**：有没有持仓触发止损\n- [ ] **大盘下午预判**：下午偏强还是偏弱\n- [ ] **持仓下午预判**：我的票下午怎么看\n- [ ] **深跌反弹机会**：弱势+急跌态时，有没有标的 20 日乖离 ≤ −12%（见 02 篇第三节）\n\n其余都是背景信息，不用逐字看。\n\n## 四、收盘 15:00（做判断）\n\n**这是全天唯一需要动脑子的时间。**\n\n### 第一步：看持仓有没有触发\n\n- [ ] 收盘价 ≤ 止损价？→ **明天开盘清仓**\n- [ ] 逻辑破了？→ **明天开盘清仓**\n- [ ] 浮盈 ≥15%？→ 算新的移动止损线\n- [ ] 曾经到过 20%？→ 止损抬到成本价\n\n### 第二步：看有没有新机会\n\n- [ ] 大盘档位是哪档：✅强势 / ⚠️贴线震荡 / ❌分歧态 / ❌弱势（分歧态=空仓等，弱势只做深跌反弹）\n- [ ] **本档硬性进场条件齐了？**（强势=创60日新高+乖离≤10%+vol20≤2.0；贴线震荡=距60日高≤3%+vol20≤1.5；量比只看不拦）\n- [ ] 主线雷达 focus 判据（三条全齐才算 focus）：创 60 日新高 + 距 MA20 ≤ 10% + vol20 ≤ 2.0（大盘须强势档；量比不作硬性要求）\n\n### 第三步：写下明天的动作\n\n**写不出来就是没有动作。**\n\n格式：`明天 9:30，XXX 若开盘 ≤ X.XXX 则买入 400 元，止损 X.XXX`\n\n## 五、周末（做生产，不做交易）\n\n四件事：\n\n1. **周复盘**：这周赚了还是亏了，执行率多少\n2. **消化**：把本周的复盘笔记看一遍，提炼一条教训\n3. **梳理观察池**：哪些标的该出池，哪些该进\n4. **关闭仪式**：明确告诉自己「这周结束了」\n\n**周末不预测下周。** 预测是给自己挖坑。\n\n## 六、一张速查卡\n\n| 时间 | 做什么 | 不做什么 |\n|---|---|---|\n| 9:30~9:45 | 执行昨晚定好的动作 | 临时改主意 |\n| 9:45~14:45 | 原则上不看 | 盘中追涨杀跌 |\n| 11:30 | 看午盘报告四行 | 据此下单 |\n| 15:00 | 判断 + 写下明天动作 | 凭感觉决定 |\n| 周末 | 复盘 + 消化 | 预测下周 |\n\n---\n\n_真源：ETF交易系统 §五（每日工作流）、§八（非交易日）。模板：周复盘模板。_",

   "title": "踩过的坑——实盘教训清单",

   "status": "使用中",
   "oneliner": "这些都是你真金白银踩出来的。来源：[[判断台账]] 15 条记录 + 交割单 36 笔已平仓。",
   "source": "07-复盘笔记/ETF/交易手册-人读/05-踩过的坑.md",
   "body": "# 踩过的坑\n\n> 这些都是你真金白银踩出来的。来源：判断台账 15 条记录 + 交割单 36 笔已平仓。\n\n## 坑 1：把「一个条件」当成「全部条件」\n\n**当时怎么想的**：09-16 看到 159583 站上 20 日线，就说「右侧条件已到」。\n**实际情况**：右侧要三个条件全齐（大盘 + 板块 + 创新高），当时只满足一个。\n**结果**：没买，标的后来跌了 6%。**但这不是因为判断对，是因为运气好。**\n**怎么防**：说「条件到了」之前，逐条报数。三缺一就是没到。\n\n## 坑 2：把盘中的价格当成收盘价\n\n**当时怎么想的**：09-22 上午 10:00 看到 159995 涨到 1.195，越过加仓线了，想加。\n**实际情况**：当天收盘 1.167，跌回线下。盘中越线不算。\n**结果**：没加，躲过一次 −7.5% 的下跌。\n**怎么防**：**规则写「收盘判定」，就是收盘判定。** 盘中看到的都不算数。\n\n## 坑 3：尾盘追买（最贵的一次）\n\n**当时怎么想的**：10-12 下午 14:49，512980 涨得不错，怕错过，直接买了 500 份。\n**实际情况**：当天是突破确认日，但**前 10 日振幅 9.9%（不算窄）、当天收盘不在高位、结构很快走完**——三条都不支持追。\n**结果**：这笔从 0.818 一路跌到 0.786，**距止损只剩 1.15%**，当时是组合里唯一的风险敞口。\n**怎么防**：追之前先算两个数——**前 10 日振幅** 和 **当天收盘位置**。\n\n| 前 10 日振幅 | 当天收盘位置 | 怎么办 |\n|---|---|---|\n| <8%（窄幅整理） | ≥0.8（收在高位、近光头） | 可以追 |\n| ≥15%（大波动） | 任何位置 | **禁追**（十年数据：追进去平均亏 4.83%，胜率 13%） |\n| 当日涨幅 ≥6%（大阳线） | 任何位置 | **禁追** |\n| 8~15% 之间 | 任何位置 | **等回踩** |\n\n**完整判定方法**见 02-B线-题材波段「二、追还是等」。\n\n## 坑 4：问而不动，反而躲过亏损\n\n**当时怎么想的**：09-22 问「芯片ETF快到达加仓点了，要加吗」。\n**实际情况**：三个条件差一个（浮盈不到 3%），没加。\n**结果**：4 天后这只跌了 7.54%，还破了止损线。**问而不动救了一次。**\n**这说明什么**：不是「犹豫是对的」，而是**规则替你挡住了冲动**。规则的价值就在这里。\n\n## 坑 5：系统太滞后，踏空强势股\n\n**当时怎么想的**：09-18 说「昨天就认为有机会，一直等信号，结果踏空」。\n**实际情况**：大盘横盘时，强势题材确实会被大盘闸门否决。\n**结果**：这条批评是**对的**，规则确实有缺陷。9-18 已经加了「弱势相对强度豁免通道」来补。\n**后续（2026-10-19）**：豁免通道本身被 14 年回测判了死刑——收益 0.00%、胜率 28%，跟闭眼买没区别，实盘 36 笔胜率 36.1%。已撤销，弱市唯一例外换成「深跌反弹」。\n**教训**：用「放宽条件」去修「错过机会」，修出来的多半是负期望。缺机会的解法是**换一种进场逻辑**（深跌反弹），不是把闸门拆了。\n\n## 坑 6：浮亏时想加仓摊平\n\n**当时怎么想的**：跌了就补，成本拉低就能早点回本。\n**实际情况**：这是最经典的亏钱方式。题材 ETF 跌下去可能再也不回来。\n**结果**：规则里写死了「浮亏绝不加仓」，一次没破。\n**怎么防**：加仓只有一个前提——**已经赚钱了**。\n\n## 七个通用错误（来自《笑傲股市》第 8 章）\n\n对照自查：\n\n1. 追高买入，买在情绪最高点\n2. 亏损时向下摊平\n3. 买入时没定止损\n4. 只买低价股/低价 ETF，觉得「便宜」\n5. 听消息买，不看书\n6. 赚一点就跑，亏了死扛\n7. 不记录，不复盘，重复同样的错\n\n**中了几条？** 中 3 条以上，先别开新仓。\n\n## 一句话总结\n\n> **你亏的钱，几乎都不是因为「不知道」，而是因为「知道但没做」。**\n\n---\n\n_来源：判断台账（15 条对账）· 交割单 36 笔已平仓 · 投资错误清单。_",

   "body": "# 06 · 主线雷达（人读版）\n\n> **一句话**：每天收盘后 16:00，脚本帮你扫一遍全市场。有值得研究的方向才给你发消息，没有就安静。\n>\n> 它只是**提醒器**，不替你做决定。真买不买，永远走你自己的纪律。\n\n**规则有冲突时**：以真源 ETF交易系统 为准。脚本细节看 主线雷达操作手册（AI 读版）。\n\n---\n\n## 一、它每天做什么\n\n1. **看大盘**：上证、沪深300、创业板指，三个里有几个站在 20 日线上。\n2. **找方向**：扫你的观察池 + 全市场，看哪些方向够强、够稳。\n3. **看情绪**：数涨停、跌停、炸板，看市场热还是冷。\n\n三条里只要有一条有话说，就在 16:00 后给你发一条飞书消息。全都平静 → 不发。\n\n## 二、大盘四档（记住这个）\n\n| 档位 | 什么意思 | 你能做什么 |\n|---|---|---|\n| **A 强势** | 3 个指数全站上 20 日线 | 正常找机会 |\n| **B 贴线震荡** | 沪深300 离 20 日线很近（±1.5%） | 只碰最稳的方向，小仓试，不追涨得最猛的 |\n| **C 分歧** | 恰好 2 个站上 | 不开新仓 |\n| **D 弱势** | 只有 1 个或 0 个站上 | 不开新仓。**唯一例外**：跌得特别惨、跌得特别急的反抽机会 |\n\n「跌得惨的反抽」长这样：方向 20 日均线偏离 −12% 到 −18% 之间 + 大盘 5 天跌够 2%（急跌，不是慢慢阴跌）。小仓试，亏了认。\n\n## 三、收到「focus 命中」怎么办\n\n消息里会给几个方向 + 参考价格。别急着买，按顺序过：\n\n1. **进场三问**（3A.4）：逻辑还在吗？位置合适吗？大盘档位允许吗？\n2. **写定止损价**：普通仓 = 买进价 − 1×N（N 是它的日均波动，消息里直接给了数字）。深跌反抽仓同算法。\n3. **只用试探仓**：400~500 元。\n4. **出场**：回到 20 日线 / 跌破止损价 / 拿满 15 个交易日——哪个先到走哪个。\n\n**注意**：只有 1 个方向命中时不会有「focus」推送（孤军新高多为假突破），别自己偷偷买。\n\n## 四、情绪档位（读位置，不猜未来）\n\n| 市场 | 你做什么 |\n|---|---|\n| 极冷 / 偏冷 | 不开仓 |\n| 中性 | 按大盘四档来 |\n| 偏热 | 可以开仓，但不追高 |\n| 过热（涨停超 100 家或炸板超四成） | 宁可不进 |\n\n情绪和大盘档位，**哪个更严听哪个**。\n\n## 五、三条底线\n\n1. 雷达只提醒，**永远不自动下单**。下单是你自己在券商 App 点的。\n2. 路线 A 宽基定投**不归雷达管**，雷达说的是路线 B。\n3. 提醒不构成买卖建议，**不覆盖你自己的止损和定投纪律**。",

   "source": "07-复盘笔记/短线/短线手册-人读/短线-00-先看这里.md",
   "body": "# 先看这里\n\n> 这套手册是给你看的。规则真源在 `短线系统/短线交易系统.md`，那份给 AI 解析。两边冲突，以真源为准。\n>\n> 你只要记住一句话：**短线不是「快」，是「准」。做错一次，没有时间等你回来。**\n\n## 一、短线和你原来的 ETF 不是一回事\n\n你原来做 ETF，有两套脑子：A 线越跌越买，B 线破线就清。\n\n**短线是第三套脑子，而且是三套里最狠的一套。**\n\n| | ETF · A 线 | ETF · B 线 | **短线** |\n|---|---|---|---|\n| 买什么 | 宽基 ETF | 题材 ETF | **个股** |\n| 涨跌停 | 没有 | 没有 | **有（10% / 20%）** |\n| 有没有龙头 | 没有 | 没有 | **有，而且是命脉** |\n| 持仓 | 长期 | 3~15 天 | **1~3 天** |\n| 亏了 | 越跌越买 | 清仓 | **清仓，没有别的选项** |\n| 能不能加仓 | 一直买 | 盈利后可加 | **原则上不加** |\n\n**最重要的一条**：ETF 亏了是「波动」，早晚会回来。短线亏了是**真亏**，因为它是个股，题材凉了就再也不回来。\n\n所以：**ETF 可以扛，短线不能扛。** 这两个字搞反了，短线必死。\n\n## 二、短线要过五道关，少一道都不做\n\n```\n① 今天能不能做\n② 做哪一只\n③ 这个位置能不能买\n④ 什么时候下手\n⑤ 买多少、怎么卖\n```\n\n**五道全过才下单。过了四道，就是不做。**\n\n为什么这么严？因为短线亏起来比你想象的快。你不是在跟市场斗，是在跟「手痒」斗。\n\n## 三、现在该看哪一篇\n\n| 你想干什么 | 看这篇 |\n|---|---|\n| 今天到底该不该做 | 短线-01-什么时候能做 |\n| 想买一只票，选哪个 | 短线-02-买哪一只 |\n| 这只涨了不少了，还能追吗 | 短线-02-买哪一只「三、位置」 |\n| 看好了，什么时候按下去 | 短线-03-什么时候下手 |\n| 止损放哪、买多少 | 短线-04-怎么买怎么卖 |\n| 今天开盘/收盘各干什么 | 短线-05-每日动作清单 |\n| 我又犯错了 | 短线-06-踩过的坑 |\n\n## 四、四道不能破的底线\n\n1. **一天最多 1 笔，一周最多 3 笔。** 做多了不是勤奋，是给券商打工。\n2. **止损价下单前写死，盘中不许改。** 改了就等于换了一套系统。\n3. **浮亏绝不加仓。** 加仓只有一个前提：已经在赚钱。\n4. **睡不着就减仓。** 减到睡得着为止，这是唯一标准。\n\n破了这四条，别的做得再对也没用。\n\n## 五、最重要的一句实话\n\n**这套系统还没验证过。**（一句话不准确了，2026-10-20 补了第一轮回测，见下）\n\n里面的规则是从四本书里读来的：\n- 缠论（结构）\n- 香象渡河（选股与位置）\n- 股票大作手操盘术（什么时候下手）\n- 炒股养家心法（什么时候不做）\n\n**没有一笔实盘记录。**\n\n所以现阶段：**用模拟盘，或者最多 300 元真钱。**目的不是赚钱，是把流程走通。\n\n想直接上大仓？可以。先看 短线-06-踩过的坑 里那条「一次亏掉三个月」。\n\n### 2026-10-20 补：两轮回测跑完了，结论比「不好看」更狠\n\n先说一件我算错的事：**第一轮我算收益的方式违规了。**\n\n我按「今天开盘买、今天收盘卖」算的——**A 股 T+1，当天买的当天卖不了**。所以第一轮那些数字全作废，第二轮按能真正做到的方式重算。\n\n重算之后，有一条结论**反了**：我原来写「高开超 7% 一律不接」，实际是「高开超 7% 是唯一赚钱的一组」。你看这页的旧版本可能已经被误导了，对不起。\n\n**现在的结论（十年、5576 只股票、2429 个交易日）：**\n\n| 跑了什么 | 结果 |\n|---|---|\n| **「今天环境好不好」那三档** | **反的。** 我标「可做」的 A 档 **−0.65%**、胜率 41%；标「停手」的 C 档 −0.07%、胜率 46%。**11 年只有 1 年我对** |\n| **「涨停第二天追进去」** | **负期望。** 平均 −0.20%、胜率 44.3%，持越久越亏（4 天 −0.65%） |\n| **「打板」（封板时买）** | 理论 **+1.65%**、胜率 56.6%（已剔掉买不到的一字板）。封板排队还要再打折 |\n| **「整数关口」（50 元、100 元）** | **没用。** 6 个价格档比下来，关口突破一个都没赢过普通新高 |\n| **「突破后没立刻走强就走」** | **这条真有用。** 守住的持到第 3 天 +2.88%；失守的一路跌到 −2.86%，没回来过 |\n\n**一句话总结**：**打板赚的钱全在「隔夜跳空」那一段里，而那段属于能封住板的人。** 你在第二天开盘追进去，等于把这 1.85 个百分点付给了卖给你的人。\n\n**所以这套手册现在只有一条规则是数据验证过的**——「突破后该走强而没走强，就走」。其余全是读书读来的推论，包括那些看起来很有体系的阈值。\n\n完整数据见 短线回测_02_战法胜率。第一轮的报告留着当反面教材（短线回测_01_环境三档）。\n\n## 六、想深入看什么\n\n| 你想搞明白 | 看这几张卡 |\n|---|---|\n| 什么算「最强」 | 龙头即求极值 · 三独立系统乘法 |\n| 位置怎么算 | 龙头空间三段 · 先手 |\n| 结构怎么看 | 走势中枢 · 三类买卖点 · 分型笔线段 |\n| 什么时候扣扳机 | 关键点战法 |\n| 什么时候必须走 | 关键点战法「危险信号」· 忘记成本 |\n| 今天做不做 | 赚钱效应循环 · 群体博弈 |\n| 为什么我总是做太多 | 少与0 · 跟随者策略 |\n| 仓位怎么定 | 赢面与满仓条件 · 情绪与仓位上限 |\n\n**不建议一次全读。** 先看这五篇手册，遇到具体问题再查卡。\n\n---\n\n_本手册是 `短线系统/` 的派生版，只做提炼不改规则。改规则先改真源 短线交易系统，再回来同步这里。_",

   "source": "07-复盘笔记/短线/短线手册-人读/短线-01-什么时候能做.md",
   "body": "# 什么时候能做\n\n> 一句话：**先看天气，再决定出不出门。**短线最大的亏损，不是选错股，是在最烂的天气里做对了一次，然后以为能复制。\n\n## 一、三档开关\n\n| 档 | 怎么看 | 做什么 |\n|---|---|---|\n| **A 能做** | 大盘在 20 日线上方，而且今天涨停的股票比前几天多 | 正常做，但还是一天最多 1 笔 |\n| **B 谨慎** | 大盘在 20 日线附近晃（上下 2%），涨停家数跟前几天差不多 | 只做最强的那一种形态，仓位减半 |\n| **C 停手** | 大盘在 20 日线下面，或者涨停家数连着三四天在减少 | **一笔都不做** |\n\n**这三条线是我自己拟的，不是书上抄的。** 书里都讲「环境决定成败」，但没有一本给出数字。所以这一关最不可靠，后面要改。\n\n## 二、怎么数「涨停家数」\n\n不用精确到个位。用眼睛看就行：\n\n1. 打开涨停板列表\n2. 看**第一页有多少只**（大多数软件一页 20~30 只）\n3. 和昨天、前天比\n\n具体判断：\n\n| 现象 | 说明什么 |\n|---|---|\n| 涨停板两页以上，且连板的一堆 | 赚钱效应好，资金在进场 |\n| 涨停一页都凑不满，还没连板 | 赚钱效应差，别做 |\n| 涨停很多，但**炸板**也多（涨上去又掉下来） | 表面热闹，实际在出货，**别碰** |\n| 昨天涨停的今天大面积绿 | 追涨的人在亏钱，**马上停手** |\n\n## 三、为什么要看「追涨的人赚不赚钱」\n\n这是 赚钱效应循环 的核心，也是最好用的一条：\n\n- **追涨的人赚钱了** → 他们有信心，明天还会追 → 热点能持续 → **可以做**\n- **追涨的人开始亏钱** → 他们减少操作 → 强势股没人接 → **补跌在即**\n\n说白了：**市场是靠「接力」活着的。接力的钱断了，龙头就倒了。**\n\n## 四、崩溃是有前兆的（别等崩了才跑）\n\n原文的说法很土但很准：\n\n> 看看天气，如果觉得要下雨了，就早点回家，不要贪玩。\n\n具体的前兆：\n\n| 前兆 | 你现在该做的 |\n|---|---|\n| 高位龙头开始炸板，反复打开 | 减仓，不加新仓 |\n| 涨停的票第二天开盘就绿 | 停手 |\n| 抄底的人变少，股票一有卖单就砸下来 | **立刻空仓** |\n| 大盘跌超 1.5% | 当天不开新仓（硬规定） |\n\n## 五、「0」是默认状态\n\n这一节最重要。\n\n**一周没有符合条件的机会，就是一周 0 笔。这叫正常，不叫失败。**\n\n很多人的毛病是把「没交易」当成「没干活」。然后为了「干点活」，随便找个票买进去。\n\n书上的话说得更狠：做得好的，往往是做得少的。真正的好机会非常少。\n\n所以：\n\n| 情况 | 正确动作 |\n|---|---|\n| 今天环境 C 档 | 0 笔，收盘看一眼就够了 |\n| 环境 A 档但没找到最强的 | 0 笔 |\n| 找到了但位置太高 | 0 笔 |\n| 找到了但结构不明 | 0 笔 |\n\n**0 不是「放弃」，0 是「今天最好的选择」。**\n\n## 六、硬性禁止（不管环境多好）\n\n| 禁止 | 为什么 |\n|---|---|\n| 大盘跌超 1.5% 时开新仓 | 逆水行舟，短线没时间等修复 |\n| 手里有亏损仓时开新仓 | 两笔会互相干扰，你会为了救第一笔而乱做第二笔 |\n| 一天开第 2 笔 | 一周 3 笔的上限，一天就吃掉 2 笔，剩下的日子只能干看 |\n| 亏了立刻反手再做一笔 | 这叫报复性交易，是亏钱最快的方式 |\n\n## 七、一句话总结\n\n**环境不对，什么都不做。环境对了，也只做一只。**\n\n---\n\n_规则真源：短线交易系统 §三。依据：赚钱效应循环 · 群体博弈 · 少与0。_",

   "body": "# 买哪一只\n\n> 一句话：**先问「它是不是最强那个」，再问「它现在这个高度还能不能买」。**两个问题都过，才轮到研究什么时候下手。\n\n## 一、「最强」不是形容词，是要算出来的\n\n书里给的说法很硬：**龙头不是一类股票，是一个位置——全市场最强或人气最旺的那个点。**\n\n所以别问「这只好不好」，要问：**它凭什么算是当前最强的那一个？**\n\n答不出这句话，就换票。\n\n### 常见的「假最强」\n\n| 你以为的强 | 其实不是 |\n|---|---|\n| 它涨得最多 | 可能是跌得最惨后的反弹 |\n| 它是行业龙头 | 行业龙头 ≠ 市场龙头。市场只认现在最热的那条线 |\n| 它业绩好 | 短线不看业绩，看有没有人接 |\n| 它技术形态漂亮 | 漂亮的形态最容易被主力伪造（见 涨停板质量分级） |\n\n## 二、三个格子，全过才做\n\n这是 三独立系统乘法 的用处：三个互不相关的判断，同时说「可以」。\n\n| 格子 | 你要回答的问题 | 过关标准 |\n|---|---|---|\n| **技术** | 结构对不对？有没有中枢，现在是不是离开中枢后的回抽？ | 见 短线-03-什么时候下手 |\n| **比价** | 它在这条线里排第几？ | **前 2 名**。第 3 名开外不做 |\n| **基本面** | 这个消息会让别人怎么动？ | 能一句话说清，而不是「利好很大」 |\n\n**三格全过才下单。过两格 = 不做。**\n\n### 第三个格子最容易搞错\n\n它**不是**让你看财报。\n\n书里的例子是：某个有背景的公司，不会让自己的股票长期跌破发行价——这是揣测**人心**，不是算利润。\n\n所以正确问法：**「这条消息出来，场外的人会急着买，还是觉得是最后的机会跑？」**\n\n## 三、题材要分级\n\n| 级别 | 长什么样 | 能不能做 |\n|---|---|---|\n| **国家级 / 产业级** | 政策级的产业方向，一说大家都懂 | 能做，位置容忍度最高 |\n| **行业级** | 单一行业景气（涨价、订单） | 能做，但要求位置更低 |\n| **个股级** | 只有这一家公司有事 | **不做**（没有板块效应，没人接力） |\n\n**为什么个股级不做**：短线靠接力活着。只有一只票涨，没有第二只跟上，说明没人认这条线，那它涨上去也没人接。\n\n## 四、位置：涨了多少，还能不能追\n\n### 怎么算（先粗算就行）\n\n```\n位置 = (现在价 − 起涨点) ÷ (预期最高能到多少 − 起涨点)\n```\n\n| 算出来 | 在哪 | 怎么办 |\n|---|---|---|\n| 0 ~ 33% | 低位区 | 可以试，容错最高 |\n| 33 ~ 66% | 腰位区 | 必须结构也确认了才能做 |\n| 66 ~ 100% | 高位区 | **只做加速，不做回踩** |\n\n**「预期最高能到多少」现在还没统计数据**（书里说 90% 以上的龙头有常见高度，但没给数字）。\n\n所以现阶段用两个粗条件先筛：\n\n1. **已经翻倍了？** → 当高位处理\n2. **已经连续 3 个板以上？** → 当高位处理\n\n### 位置否决权（这条不可协商）\n\n> **不在正确的位置，再强也不买。**\n\n这是全书对我最有用的一句。\n\n意思是：前面四个格子全过，只要位置在高位区又不满足「加速」条件，**就是不做**。\n\n**为什么**：最强的票一定已经涨了很多。所以「买最强」和「追高」只隔一条线，这条线就是位置。\n\n### 位置为什么这么要紧\n\n书里有一个说法很形象：\n\n- **普通股票是爬行动物**，节奏最重要\n- **龙头股是飞行动物**，空间最重要\n\n飞起来的东西，高度决定生死。\n\n还有一句更狠：\n\n> 三板、四板做是对的，但六板、七板做就是错的。哪怕只相差一天，昨天买是对的，今天买就是错的。\n\n因为 **T+1**：今天买进明天才能卖。所以「今天对不对」和「明天对不对」是两个问题。\n\n## 五、买龙头还是买跟风\n\n这条要小心，很多人搞反了。\n\n书里的原话是：\n\n- **买龙头**，不是因为胆子大，是因为**龙头的溢价还没被股价反映**\n- **买跟风**，不是因为胆子小，是因为**龙头已经太贵，而跟风还在低位**\n\n所以判断标准不是「谁更强」，是**「谁的溢价还没体现」**。\n\n**但有一条必须先接受**：纯看 K 线追龙头的统计胜率只有 **45%** 左右，跟赌场差不多。\n\n意思是：**这个游戏不是靠猜对赢的，是靠「错的时候亏得少、对的时候拿得住」赢的。**\n\n## 六、一句话总结\n\n**最强 + 位置不高 + 这条线有人接力 = 可以研究什么时候下手。**\n\n三样缺一样，回到 短线-01-什么时候能做 的「今天不做」。\n\n---\n\n_规则真源：短线交易系统 §四、§五。依据：龙头即求极值 · 龙头空间三段 · 三独立系统乘法 · 先手 · 跟随者策略。_",

   "body": "# 什么时候下手\n\n> 一句话：**在「关键价位」被突破的那一瞬间买。**买完它该往上冲；没冲，就是错了。\n\n## 一、什么是「关键价位」\n\n两个来源，只用这两个：\n\n| 来源 | 怎么找 |\n|---|---|\n| **整数关口** | 10 元、20 元、30 元、50 元、100 元 |\n| **前面的高点** | 最近一两年这只票冲到过、然后掉下来的那个价 |\n\n书里给的原话是：股票在 50、100、200、300 这类价位徘徊，**一旦突破，往往会出现一波快速行情，中途不回调**。\n\n## 二、为什么是「突破的瞬间」，不是「回踩确认」\n\n这是本书和缠论最大的分歧，你要知道自己在选哪一边：\n\n| | 关键点（利弗莫尔） | 三买（缠论） |\n|---|---|---|\n| 什么时候买 | **突破的那一刻** | 突破后**回抽不跌回去** |\n| 好处 | 买得早，成本低 | 已经证明是真突破 |\n| 坏处 | 假突破多 | 可能等不到回抽，也可能回抽太深 |\n\n**我这套系统现在主用「关键点」。** 理由很现实：它不需要画图，能机械执行。\n\n**但加了一条否决**：如果突破的时候，价格还在一个震荡区间（中枢）里面，这次突破**不算**。\n\n为什么？因为在区间里往上捅一下，根本不算「离开」。真正的突破是：**先离开那个区间，再回来没跌进去。**\n\n## 三、结构怎么粗看（不用画图也看得出）\n\n| 你要判断 | 用眼睛怎么看 |\n|---|---|\n| 有没有在震荡 | 最近一两个月，价格是不是在一个上下箱子里来回？ |\n| 箱子的上下沿 | 上沿＝最近几次冲上去都掉下来的价；下沿＝最近几次砸下去都弹起来的价 |\n| 算不算「离开」 | 收盘价**明显站在上沿之上**，不是盘中捅一下 |\n| 回抽有没有回来 | 涨上去之后回调，**没跌回上沿以下** |\n\n**这就是中枢的粗略版本。** 精确的画法在 走势中枢 和 分型笔线段，那些要对着图练，现在先不用。\n\n## 四、买完必须验证：危险信号\n\n这是全书最值钱的四个字。\n\n买完不是结束，是开始观察。看它的表现，跟**上一次突破**比：\n\n| 买完之后的走势 | 判定 | 动作 |\n|---|---|---|\n| 1~3 天内快速离开突破位，越走越远 | 对了 | 拿着 |\n| 1~3 天还在突破位附近磨来磨去 | **危险** | 走 |\n| 反而跌回突破位下方 | **危险 + 假突破** | **立刻走** |\n\n书里的原案例特别干脆：\n\n一只票突破 100 美元，一路涨到突破 200 美元都顺利。突破 **300 美元**的时候，最高只到 **302.75**，然后停住了。\n\n作者的原话是：「很明显，这是一个危险信号。」**然后就清空了。**\n\n**注意判据**：不是跌了多少，是**该涨没涨**。突破了 300 这么大的关口，只多走 2.75 美元，跟前面两次完全不一样。**对比就是判据。**\n\n## 五、下手之前必须确认：板块对不对\n\n这条是硬规定，优先于一切形态。\n\n| 情况 | 做不做 |\n|---|---|\n| 个股突破了，同板块的其他票也在涨 | 可以做 |\n| 个股突破了，同板块的票在跌 | **不做** |\n| 板块方向看不清 | **不做** |\n\n为什么：个股突破在板块向下的环境里，大概率是主力借势出货。一个人顶不住一个板块。\n\n## 六、最容易被骗的一种「完美突破」\n\n这里必须提醒一件事：\n\n**涨停板看起来「技术完美」的那种，恰恰可能是主力做出来给你看的。**\n\n书里点了两种名声很臭的手法（佛山无影脚、成都一日游）：专门做「谁先涨停谁最强、分时图特别猛」的形态，等你追进去就砸。\n\n反而有一种「烂板」，盘中反复打开、看着很丑，往往是主力在洗盘收筹码，后面走得更远。\n\n**所以不要用「它涨停得干不干净」当买入理由。** 理由应该是：关键价位 + 板块向上 + 位置不高。\n\n## 七、一句话总结\n\n**在关键价位被突破的那一刻买，买完看它冲不冲。冲了拿着，不冲就走。**\n\n不要等回踩，也不要追「好看的板」。\n\n---\n\n_规则真源：短线交易系统 §六。依据：关键点战法 · 走势中枢 · 三类买卖点 · 涨停板质量分级 · 2B法则。_",

   "body": "# 怎么买怎么卖\n\n> 一句话：**止损位在下单前写死，仓位由「能睡着」和「亏得起」两个数取小的那个，走的时候不讲理由。**\n\n## 一、止损放哪（只有三种情况）\n\n| 你是怎么进的 | 止损就放这 |\n|---|---|\n| **突破关键价位**进的 | **那个突破位**。跌回它下面，就是错了 |\n| **回踩震荡上沿**进的 | **那个上沿**。跌进去，说明没突破成功 |\n| **一字板打开**后进的 | **打开当天的最低价** |\n\n**为什么不用「亏 5%」当止损**：因为 5% 跟结构没关系。跌 5% 可能刚好在支撑上，也可能刚破位。**短线用位置，不用百分比。**\n\n**执行方式**：碰到止损 → **第二天开盘卖掉**。\n\n为什么是第二天？因为 A 股 T+1，当天买的当天卖不掉。所以下单的时候就要想到：万一明天一开盘就要卖，我认不认？\n\n## 二、买多少（两个数取小的）\n\n```\n第一步：写下「能睡着的最大金额」    ← 这是硬上限\n第二步：账户 × 1% ÷ 止损距离%      ← 这是理论上能买多少\n第三步：两个数取小的\n```\n\n**举个例**（金额自己替换）：\n\n- 账户 10000 元，能睡着的最大金额 = 2000 元\n- 这笔止损距离 5%\n- 理论仓位 = 10000 × 1% ÷ 5% = 2000 元\n- 取小的：2000 元\n\n如果止损距离是 10%，理论仓位 = 1000 元，那就只买 1000。\n\n**为什么不用「满仓」「半仓」这种说法**：因为短线的止损距离差别很大，同样是半仓，风险可能差三倍。\n\n## 三、什么时候走（四种情况，一种都不用想）\n\n| 触发 | 动作 |\n|---|---|\n| 碰到止损价 | **第二天开盘清仓**，不看理由 |\n| 出现危险信号（见 短线-03-什么时候下手） | 当天或第二天走 |\n| **持满 3 个交易日**，还没走到目标的一半 | **收盘走**（时间止损） |\n| 到目标价了 | 至少卖掉一半 |\n\n**第三条是短线特有的**。ETF 可以熬，短线不能。时间就是成本——三天不动，说明这波不成立。\n\n## 四、频率（这条最容易破）\n\n| 限制 | 数字 |\n|---|---|\n| 一天开仓 | **最多 1 笔** |\n| 一周开仓 | **最多 3 笔** |\n| 同时持有 | **最多 2 只** |\n\n**为什么要限频率**，说三个理由：\n\n1. **钱**：一笔来回手续费虽然少，但一天做 3 笔，一个月 60 笔，就是白送给券商\n2. **注意力**：短线要盯，同时 3 只根本看不过来，T+1 又跑不掉\n3. **最重要的一条**：好机会本来就少。做多了，买的必然是垃圾机会\n\n书上说得更直接：真正做得好的，往往是做得少的。\n\n## 五、赚了要往外出（这条反人性）\n\n每笔成功后，**把这笔赚的一半取出来**，转到一个不炒股用的账户。\n\n书里的理由不是财务规划，是心理：\n\n> 钱在账户里，你会觉得那是本钱，敢拿它冒险。\n> 钱在手里，你会觉得那是你的，不愿意再拿出去。\n\n作者自己每次赚了都取 20~30 万美元出来，「把钱取出来数一数」。\n\n**我资金小，一次可能只有几十块。但动作要一样。** 因为要练的是「收手」这个肌肉，不是金额。\n\n## 六、卖出决策：假设自己现在是空仓\n\n这一条能治「舍不得割」。\n\n**问自己三个问题**（忘记成本）：\n\n1. 如果我今天空仓，我还会买这只票吗？**会 → 拿着**\n2. 我会买别的票吗？**会 → 换股**\n3. 我会选择什么都不买吗？**会 → 卖出**\n\n**关键是忘掉你买它的价格。** 你亏了 8% 这件事，跟它明天会不会涨，一点关系都没有。\n\n书里还点了名：高点买入后死拿不动，「说好听点是不愿意认输，说不好听点是虚荣心在作怪」。\n\n## 七、关于「永不止损」的说法（必须说清楚）\n\n养家心法里有一句话流传很广：**「我从来没有止损这两个字，不看好了就卖出。」**\n\n这句话**不能照抄**。\n\n| | 他的做法 | 你该做的 |\n|---|---|---|\n| 什么时候卖 | 判断变了 | **价格到止损位** |\n| 需要什么 | 极强的判断力 + 极强自控 | 只需要纪律 |\n| 用错的下场 | 他自己不会让亏损扩大 | **你会拖成大亏** |\n\n**正确的叠加方式**是两层：\n\n```\n第一层（硬线）：碰到止损价 → 无条件走。这是兜底，不许讨论。\n第二层（软线）：没碰止损，但「当初买的理由不在了」→ 也走。\n```\n\n**第一层必须有。第二层慢慢学。**\n\n## 八、一句话总结\n\n**止损写在纸上，仓位算两个数取小的，时间到了就走，赚了取一半出来。**\n\n---\n\n_规则真源：短线交易系统 §七、§八。依据：情绪与仓位上限 · 赢面与满仓条件 · 忘记成本 · 攥紧手里的钱 · 分段操作法。_",

   "body": "# 每日动作清单\n\n> 一句话：**短线 90% 的活是在盘前和盘后，盘中只是扣扳机。**\n\n## 一、盘前（08:50 ~ 09:20）\n\n### 第 1 步：看天气，定档（5 分钟）\n\n- [ ] 大盘在 20 日线上方还是下方？\n- [ ] 昨天涨停家数多少？今天有没有明显变化？\n- [ ] 昨天涨停的票，今天开盘是红是绿？\n- [ ] 昨天有没有大面积炸板？\n\n**写下一行的结论**：今天 **A 能做 / B 谨慎 / C 停手**。\n\n> C 档 → 直接跳过后面所有步骤，今天不做。\n\n### 第 2 步：列候选（10 分钟）\n\n从这几个地方找：\n\n- [ ] 昨天涨停板里，最强的 3 只\n- [ ] 昨天炸板但今天有承接的\n- [ ] 自己跟踪的、正在接近关键价位的\n\n**最多写 3 只。写多了说明没在选，在凑数。**\n\n### 第 3 步：给每只填一张小卡（10 分钟）\n\n每只票必须能填满下面这五格，填不满就划掉：\n\n| 项 | 内容 |\n|---|---|\n| 它凭什么最强 | |\n| 位置（低位/腰位/高位） | |\n| **关键价位是多少** | |\n| 板块方向向不向上 | |\n| 止损放哪 | |\n\n**⚠️ 关键价位这一格最重要。** 它决定今天到底买不买、买在哪个价。\n\n### 第 4 步：定好动作\n\n- [ ] 今天做不做（做几只）\n- [ ] 做的话，买哪只、什么价格买、买多少\n- [ ] 挂条件单或写下价格提醒\n\n**写完就去干别的，不要提前盯盘。**\n\n## 二、盘中（09:30 ~ 15:00）\n\n### 唯一要做的事\n\n**等预设的价格被触发，然后执行。**\n\n不是「看情况」，是「到价就动」。\n\n### 三条不许\n\n| 不许 | 为什么 |\n|---|---|\n| 不许临场加票 | 盘前没研究过的，盘中看不出东西，只会看出情绪 |\n| 不许改止损 | 改了等于换系统 |\n| 不许因为「差一点没到」就手动买 | 那一点就是纪律 |\n\n### 一个例外\n\n如果**盘中出现明显的危险信号**（比如板块整体跳水、龙头炸板），可以提前走。**但只能是「提前走」，不能是「提前买」。**\n\n## 三、盘后（15:00 ~ 15:30）\n\n### 第 1 步：记一笔（不管做没做）\n\n**做了的记**：\n\n- [ ] 为什么买（哪五层过的）\n- [ ] 止损价是多少\n- [ ] 实际怎么走的\n- [ ] 赚了还是亏了\n\n**没做的也记**：\n\n- [ ] 今天为什么没做（哪一层没过）\n- [ ] 那几只候选后来涨了还是跌了\n\n> 没做的记录**比做了的更重要**。它是唯一能校准「我是不是太保守 / 太激进」的证据。\n\n### 第 2 步：问三句话\n\n- [ ] 今天有没有违反四条底线？\n- [ ] 如果今天空仓，我会买手里这只吗？\n- [ ] 今晚能不能睡好？\n\n**第三问如果答案是「不能」→ 明天开盘减仓。**\n\n### 第 3 步：填台账\n\n打开 `短线系统/短线判断台账.md`，把今天的一行填进去。\n\n## 四、周末（一次，30 分钟）\n\n- [ ] 数本周一共做了几笔（上限 3 笔，超了要写下原因）\n- [ ] 算胜率、平均盈亏比\n- [ ] 数违反底线几次\n- [ ] **回看「没做」的那几只，后来走势如何**\n\n> 最后一条是关键。如果「没做」的票大部分涨了，说明规则太严；大部分跌了，说明规则有用。\n\n## 五、每天要打开的三个文件\n\n| 文件 | 什么时候看 |\n|---|---|\n| 短线交易系统速查卡 | 盘前扫一眼 |\n| `短线系统/短线判断台账.md` | 盘后填一行 |\n| 短线-04-怎么买怎么卖 | 犹豫的时候看 |\n\n**不要每天读手册。** 手册是出问题时查的，不是每天念的。\n\n## 六、一句话总结\n\n**盘前定好，盘中执行，盘后记账。**盘中一秒钟的临场决定，等于盘前二十分钟白做。\n\n---\n\n_规则真源：短线交易系统 §九。_",

   "oneliner": "先说清楚：短线还没实盘。这一页大部分不是「我踩过的」，是「书里别人踩过的」和「我从 ETF 带过来的」。  每次真踩了新坑，加一条到最前面。",
   "source": "07-复盘笔记/短线/短线手册-人读/短线-06-踩过的坑.md",
   "body": "# 踩过的坑\n\n> **先说清楚**：短线还没实盘。这一页大部分不是「我踩过的」，是「书里别人踩过的」和「我从 ETF 带过来的」。\n>\n> 每次真踩了新坑，加一条到最前面。\n\n## 零、还没开始就先记住的一条\n\n### 坑 0：一次亏掉三个月\n\n**来源**：三本书都在讲同一件事，只是换了说法。\n\n- 利弗莫尔的方法是对的，他 1929 年赚了一亿美元。**1940 年他破产自杀。**\n- 香象渡河讲「一寸山河一寸血」，讲空间每高一个板需要的逻辑是几何级数增加。\n- 养家给了数字：**纯看 K 线打板的胜率只有 45%**。\n\n**这条坑的意思**：短线的容错极低。一次重仓做错，可能直接把你打回三个月前。\n\n**防法**：系统没验证之前，最多 300 元真钱，或者干脆模拟盘。\n\n---\n\n## 一、从 ETF 带过来的（已经踩过）\n\n### 坑 1：追了一个没确认的突破（512980，2026-10-12）\n\n**当时怎么想的**：「突破了，赶紧上，不然就来不及了。」\n\n**实际发生**：当天尾盘追买，当晚三项判据全不达标（振幅 9.9%、非光头、快结构）。买在了箱体假突破的那一天。\n\n**书上的诊断**：\n\n- 做市商陷阱：箱体 10~15 天，突破后 1~3 天跌回＝假突破。生死线是突破日最低价。**那笔是教科书级的否决信号，而我买在那天。**\n- 2B法则：创新高没站住、跌回前高之下＝反转信号。\n- 均线缠绕三吻：「先湿吻 → 再冲一把 → 转折」这个形态，就是专门埋人的。\n\n**这条坑移植到短线会变成什么**：在 短线-03-什么时候下手 里，我把它写成了硬规定——**危险信号出现就走，不等回本。**\n\n### 坑 2：把「没交易」当成「没干活」\n\n**当时怎么想的**：一天不操作，就觉得自己白过了。\n\n**实际发生**：为了「干点活」随便下单，胜率惨不忍睹。ETF 的 B 线实盘胜率 **36.1%**（36 笔，−214 元）。\n\n**书上的诊断**：\n\n- 少与0：做得好的人做得少。真正的好机会非常少。\n- 不做的四个原因，第二条就是「闲不住，闲着心里发慌」。\n\n**移植到短线**：写成了频率上限（一天 1 笔、一周 3 笔）。\n\n### 坑 3：浮亏加仓摊平\n\n**当时怎么想的**：「跌了就多买点，成本拉下来，回本更快。」\n\n**实际发生**：把小亏拖成大亏。\n\n**书上的诊断**：\n\n- 鳄鱼原则：禁止摊平、对冲、换标的、等反弹。500 美元被做成 6000 美元的教训。\n- 养家：最大的忌讳就是买卖受损时赌徒式加码。\n\n**移植到短线**：写成了红线第一条——浮亏绝不加仓。\n\n---\n\n## 二、书里别人踩过的（我没踩，但一定会遇到）\n\n### 坑 4：以为「看准了龙头」就能买\n\n**书上怎么说**：\n\n- 龙头即求极值：「不是买龙头就赚钱，是在**正确的股票 + 正确的位置 + 正确的事儿**三者同时成立才赚钱。」\n- 大部分人只做了第一件。\n- 而且「只要被市场确定为龙头，卖给谁就不再是问题」——这句话的另一面是：**等你确定的时候，大家都在确定，也就是最贵的时候。**\n\n**防法**：位置否决权。位置不对，最强也不买。\n\n### 坑 5：追「技术完美」的涨停板\n\n**书上怎么说**：大家公认的好板（先涨停、分时猛、跳空、缩量、不开板）**恰恰是主力专门做出来坑人的**。书里直接点了两种手法。\n\n反而是「烂板」出龙头。\n\n**防法**：买入理由不能是「它涨停得干净」。必须是：关键价位 + 板块向上 + 位置不高。\n\n### 坑 6：赚一点就跑，然后看着它继续涨\n\n**书上怎么说**：利弗莫尔自己做小麦，每蒲式耳赚 25 美分就清仓，结果接下来几天市场又涨了 20 美分。他自己的话是「**我意识到自己犯了一个大错误**」。\n\n**防法**：到目标价时**至少卖掉一半**，剩下按危险信号决定。\n\n### 坑 7：等「上下上都走完」才卖\n\n**书上怎么说**（缠论 107 篇）：大级别反弹里，**最后一段的高点不一定比第一段高**。如果你一定要等整段走完，可能等到一个「连手续费都不够、稍纵即逝」的卖点。\n\n**防法**：分段操作。进场级别定 30 分钟，出场按 5 分钟节奏执行。第一段走完就可以走。\n\n### 坑 8：听了别人的话\n\n**书上怎么说**：利弗莫尔的儿子回忆，父亲说「**每一次他真正亏大钱的时候，就是他听了别人的意见的时候**」。\n\n**防法**：任何「听说」都不构成下单理由。必须过 短线-02-买哪一只 的三个格子。\n\n---\n\n## 三、我能预判自己会踩的（提前写下来）\n\n### 坑 9：我会高估自己的「盘感」\n\n**症状**：看到一只票，心里说「这个要涨」，然后找理由去满足三个格子。\n\n**为什么一定会犯**：因为找理由比承认「我不懂」容易。\n\n**防法**：三个格子必须**盘前填在纸上**。盘中临时填的，一律作废。\n\n### 坑 10：我会在亏钱的日子里多做\n\n**症状**：亏了一笔，想立刻做一笔赚回来。\n\n**书上怎么说**：这叫报复性交易，是亏钱最快的方式。\n\n**防法**：**亏损当天禁止开新仓。** 这条要加进硬规定。\n\n### 坑 11：我会嫌「3 天时间止损」太短\n\n**症状**：持了 3 天没动，但「感觉快了」，想再拿两天。\n\n**为什么一定会犯**：因为卖了就承认看错了。\n\n**防法**：时间止损是机械规则，没有「感觉」的位置。到了就走。\n\n---\n\n## 四、这一页怎么用\n\n1. **每次真踩了新坑，加一条到最前面**，写清「当时怎么想 → 实际发生 → 书上怎么诊断 → 写成了哪条规则」\n2. **每条坑都要落到一条规则上**。落不到规则的坑，等于白踩\n3. **没有规则的坑，写进待办**，等下一版系统补\n\n---\n\n_依据：短线交易系统 §八（纪律红线）· 鳄鱼原则 · 少与0 · 做市商陷阱 · 2B法则 · 均线缠绕三吻 · 涨停板质量分级 · 关键点战法 · 分段操作法 · 跟随者策略。_",
   "id": "07-复盘笔记/短线/短线手册-人读/短线-06-踩过的坑.md"
  },

   "oneliner": "本页管什么：短线域该读什么、读到什么程度、哪本改了规则。不重复书卡内容，只做取舍。  与 [[ETF书籍导读]] 的关系：两个域各自一份，不合并。同一本书可以出现在两边，但用途不同——在 ETF 域只借「形态与量价」，在短线域才借「打板与情绪」。",
   "source": "07-复盘笔记/短线/短线系统/短线书籍导读.md",
   "body": "# 短线书籍导读\n\n> **本页管什么**：短线域该读什么、读到什么程度、哪本改了规则。**不重复书卡内容**，只做取舍。\n>\n> **与 ETF书籍导读 的关系**：两个域各自一份，**不合并**。同一本书可以出现在两边，但用途不同——在 ETF 域只借「形态与量价」，在短线域才借「打板与情绪」。\n\n## 一、已读并拆完（4 本，共 24 张卡）\n\n| 书 | 定位 | 卡数 | 它改了什么 |\n|---|---|---|---|\n| 缠论 | **结构层地基** | 10 | 把「支撑压力」换成中枢；把「突破确认」换成三类买卖点；把「涨没劲了」换成背驰 |\n| 香象渡河 | **选股与位置层** | 5 | 加了两条硬条款：求极值选股 + 位置否决权 |\n| 股票大作手操盘术 | **扳机层** | 4 | 进场判据从「回踩确认」改成「突破关键价位的瞬间」；加了「危险信号」离场 |\n| 炒股养家心法 | **总开关层** | 5 | 环境判断有了循环判据；仓位有了「赢面」口径；打板被标了 45% 概率 |\n\n### 四本书怎么分工（一张图）\n\n```\n养家：今天能不能做（赚钱效应循环）\n   ↓\n香象渡河：做哪一只（求极值）+ 这个位置能不能买（位置否决）\n   ↓\n缠论：结构在哪（中枢 / 三类买卖点）\n   ↓\n利弗莫尔：什么时候扣扳机（关键点）+ 错了怎么认（危险信号）\n```\n\n**注意顺序**：这个顺序不是书里写的，是我按「先环境后个股、先位置后结构」的原则排的。**正确性待验证。**\n\n## 二、四本书之间的三处冲突（必须自己裁决）\n\n| 冲突 | 一方 | 另一方 | 我的裁决 |\n|---|---|---|---|\n| **买点定义** | 三类买卖点：回抽不进中枢 | 关键点战法：突破整数关口瞬间 | **主用关键点**（可机械执行），三买做否决（在中枢里的突破不算） |\n| **止损制度** | 忘记成本：「永不止损」，不看好了就走 | 2%与6%法则：价格触发，无条件执行 | **硬止损保留为兜底**，软判据作为第二层。「永不止损」思想移植、制度不移植 |\n| **龙头能不能做** | 香象渡河：龙头战法可操作，位置对了就上 | 跟随者策略：纯 K 线打板胜率≈45% | **承认 45%**，因此靠盈亏比和频率控制活着，不靠胜率 |\n\n**这三处裁决都写进了 短线交易系统。改动须先改那边。**\n\n## 三、跨域可参考的卡（来自 ETF 域，`domain: etf`）\n\n这些卡**不入短线规则**，但值得看。**引用时必须自己重新验证，因为它们的原始语境是 ETF。**\n\n| 卡 | 为什么短线也值得看 | 不能直接用的地方 |\n|---|---|---|\n| 2B法则 | 假突破反转的定义，与「关键点突破失败」是同一形态 | 原文的三种时间窗口基于美股，A 股 T+1 需重算 |\n| 做市商陷阱 | 「箱体突破后 1~3 天跌回」＝危险信号的具体形态 | 原文用窄箱（10~15 天），A 股涨停板结构不同 |\n| 波动性突破 | 我原来 1N 止损的出处 | 那是 ETF 的 ATR 口径，短线用结构位 |\n| 努力与结果 | 量价判真假，可用来看「烂板」的真伪 | 威科夫原始语境是大资金吸筹 |\n| 止损触发三问 | 止损前的自检清单 | 三问的判据偏 ETF，需改写 |\n| 交易认知偏差 · 鳄鱼原则 · 期望值 | 通用纪律层，两边都可用 | 无（已在 短线交易系统 §1.3 列为允许引用） |\n\n## 四、不读的书（明确排除）\n\n| 类型 | 代表 | 为什么 |\n|---|---|---|\n| 江恩 / 波浪 | — | 不可量化、不可回测。缠论 第 19 篇对这两套有直接批评 |\n| 「一招鲜」式指标书 | — | 见 三独立系统乘法：单一指标误判率不可能低于 10% |\n| 纯心态鸡汤 | — | 心态不能替代规则。情绪与仓位上限 已给出可执行判据（睡眠） |\n| 已读过的 ETF 工具书 | 威科夫操盘法、量价分析、我如何从股市赚了200万、止损赚钱、短线交易秘诀、专业投机原理 | 已在 ETF 域拆完，卡池可查，**不重读** |\n\n## 五、还缺什么（下一轮书单方向）\n\n拆完 24 张卡之后，暴露的缺口是这些：\n\n| 缺口 | 该找什么书／材料 | 优先级 |\n|---|---|---|\n| **A 股短线数据的量化口径** | 涨停家数、炸板率、连板高度的历史统计（不是书，是数据） | **最高** |\n| **龙头空间高度的统计** | 近 3 年连板股「起涨→最高」的涨幅分布 | **最高** |\n| 分时图与盘口 | 三本书都提到但都无法用文字讲清的部分 | 中 |\n| 集合竞价 | 短线进场的最后一公里 | 中 |\n| 注册制后的生态变化 | 2019 年后 A 股短线生态的实证研究 | 中 |\n\n**注意：前两项不是「读书」能解决的，是自己统计数据。** 见 短线交易系统 §十的未验证清单。\n\n## 六、更新记录\n\n| 日期 | 变更 |\n|---|---|\n| 2026-10-20 | 建页。4 本书拆完（24 卡）：缠论 10 · 香象渡河 5 · 股票大作手操盘术 4 · 炒股养家心法 5。记录三处书间冲突与裁决、跨域可参考卡 6 张、不读书单、下轮缺口 5 项 |",

   "oneliner": "做 A 股个股短线，持仓 1~3 天。只在市场环境允许、标的够强、位置不高、结构确认这四件事同时成立时开仓。其余情况默认空仓。  本文作用：短线域的唯一规则真源。规则只在这里改，改完再派生给人读版。  🤖 本目录（`短线/短线系统/`）= AI 读版（全量口径、精确边界、版本记录、台账，供自动化与脚本解析）。人读请看 `短线/短线手册-人读/`（[[短线-00-先看这里]] 起读）。  ⚠️ 状态说明：本系统 v0.1 草案，未经过任何实盘验证。所有规则来自三本书的提炼（[[缠论]]、[[香象渡河]]、[[股票大作手操盘术]]），没有一条经过回测。第一条纪律：未验证之前不许上真仓。",
   "source": "07-复盘笔记/短线/短线系统/短线交易系统.md",
   "body": "# 短线交易系统 v0.1\n\n> **一句话**：做 A 股个股短线，持仓 1~3 天。只在市场环境允许、标的够强、位置不高、结构确认这四件事同时成立时开仓。其余情况默认空仓。\n>\n> **本文作用**：短线域的唯一规则真源。**规则只在这里改，改完再派生给人读版**。\n>\n> 🤖 **本目录（`短线/短线系统/`）= AI 读版**（全量口径、精确边界、版本记录、台账，供自动化与脚本解析）。**人读请看 `短线/短线手册-人读/`**（短线-00-先看这里 起读）。\n>\n> ⚠️ **状态说明**：本系统 **v0.1 草案，未经过任何实盘验证**。所有规则来自三本书的提炼（缠论、香象渡河、股票大作手操盘术），**没有一条经过回测**。第一条纪律：**未验证之前不许上真仓**。\n\n---\n\n## 一、系统边界（为什么必须与 ETF 分开）\n\n### 1.1 两套系统是两种生意\n\n| 维度 | **ETF 域**（ETF交易系统） | **短线域**（本文） |\n|---|---|---|\n| 标的 | 场内 ETF（宽基 + 题材） | **A 股个股** |\n| 交易制度 | T+1，无涨跌停板 | T+1，**有涨跌停（10%／20%）** |\n| 有没有「龙头」 | **没有**（指数里没有龙头生态） | **有**，而且是核心 |\n| 有没有「打板」 | **完全不能** | 是主要生态之一 |\n| 持仓周期 | A 线长期 / B 线 3~15 天 | **1~3 天** |\n| 判断依据 | 量价 + 支撑压力 + 均线 | **结构（缠论）＋强弱（龙头）＋关键点（利弗莫尔）** |\n| 容错 | 高（B 线可熬几天） | **极低**（没有时间等） |\n\n**结论：两套系统不能共用一个规则集。** ETF 那套的「-5% 止损」「突破三验证」搬到个股短线会直接失效；个股短线那套的「中枢」「打板」搬到 ETF 无处使用。\n\n### 1.2 三条不互污染的红线\n\n1. **规则不互套**。ETF 的止损线、加仓条件、离场闸门，**一律不用于个股**。反之亦然。\n2. **知识卡不混引**。ETF 卡池（`domain: etf`）里的操作类卡，短线域的规则**不引用它们作为判据**。只允许引用纪律层的通用卡（见 1.3）。\n3. **账户分开记**。短线仓位单独记账，不与 ETF 底仓混算胜率。混算会掩盖短线真实表现。\n\n### 1.3 允许互相参考的「通用纪律层」\n\n这一层的卡两边都可引用，因为它们讲的是人，不是标的：\n\n| 通用卡 | 讲什么 |\n|---|---|\n| 风险是永久损失 | 为什么必须有止损 |\n| 鳄鱼原则 | 认错就平仓，禁止摊平／对冲／换标的／等反弹 |\n| 2%与6%法则 | 单笔亏 ≤ 账户 2%，月度 ≤ 6% |\n| 交易认知偏差 | 人为什么会自己作死 |\n| 期望值（无独立卡） | 胜率 × 盈亏比 |\n| 概率思维 | 单笔不重要，样本才重要 |\n\n**这些卡的内容不在本文重复。** 短线域直接引用。\n\n---\n\n## 二、五层决策链（总览）\n\n开一仓必须依次通过五层。**任何一层不过，回到 0（空仓）**。\n\n```\n① 环境：今天能不能做\n      ↓ 过\n② 选股：做哪一只\n      ↓ 过\n③ 位置：这个位置能不能买\n      ↓ 过\n④ 结构：什么时候买\n      ↓ 过\n⑤ 执行：买多少 / 怎么卖\n```\n\n**为什么要有第①层**：短线最大的亏损来源不是选错股，是**在最差的环境里做对了一次**，然后以为可复制。\n\n**为什么顺序不能乱**：先结构后环境＝在退潮里找形态；先位置后选股＝在弱票里挑位置。\n\n---\n\n## 三、第①层：市场环境（做不做）\n\n### 3.1 三档开关（草案，待回测）\n\n| 档 | 判据（草案） | 动作 |\n|---|---|---|\n| **A 可做** | 指数在 20 日线上方，且近 5 日涨停家数 ≥ 前 5 日的 1.2 倍 | 正常开仓 |\n| **B 谨慎** | 指数在 20 日线附近（±2%），涨停家数持平 | **只做最强的一种形态**，仓位减半 |\n| **C 停手** | 指数在 20 日线下方，或涨停家数连续 3 日下降 | **一律 0 笔** |\n\n> **判据的理论根据**：赚钱效应循环（追涨的人赚钱→热点有持续性；开始亏钱→强势股补跌）与 群体博弈（场外想买的钱 vs 场内想卖的筹码）。**但书里没有给出可量化阈值**——这组数字是我自己的设定，**不是书里的**。因此这一层是**全套系统里最不可靠的一层**，必须首先回测。\n\n### 3.1a 🔴 回测结果：这组阈值被证伪（T+1 合规口径复核）\n\n> **结论：A 档最差、C 档最好，方向是反的。**\n> 全文见 短线回测_02_战法胜率（数字以此为准）与 短线回测_01_环境三档（口径已作废，方法论保留）。\n> **规则暂未改动，等拍板（见 §十 第 0 条）。**\n\n| 检验 | 结果（合规口径：T+1 开盘买 → T+2 收盘卖） |\n|---|---|\n| 数据 | 全市场 5,576 只 × 2,429 交易日，前复权日K，109,324 笔可买样本 |\n| A 档（我标「可做」） | **−0.651% / 胜率 41.4%**（n=22,046） |\n| B 档（谨慎） | −0.094% / 胜率 44.2%（n=53,752） |\n| C 档（我标「停手」） | **−0.074% / 胜率 46.4%**（n=33,455） |\n| A − C 差值 | **−0.246pp，Welch t = −1.24** |\n| 分年稳定性 | **A 优于 C 的只有 1/11 年** |\n\n**为什么会反**：「近 5 日涨停家数 ≥ 前 5 日 1.2 倍」这个条件，在牛市里等于**「情绪最热时进场」**——而短线最热的时候，正是接力最贵的时候。A 档的真实含义不是「可做」，是**「最贵」**。\n\n**为什么三档全是负的**：这不是阈值定得不好，是**接力这个动作本身负期望**（见 3.1c）。三档只能决定「亏多亏少」，救不回来。\n\n**只有一层仍然成立**：§3.3 硬性禁止（大盘跌超 1.5% 当天不开新仓）。这一条两轮回测都没有推翻。\n\n### 3.1b 曾经以为的替代判据：也不成立\n\n第 1 轮以为「次日高开幅度」可以替代环境档位（当时报的是 11/11 年稳定）。\n\n**合规口径重算后，方向反了，而且 2022 年之后失效**：\n\n| 期段 | 高开 >7% 持 1 日 | 开 ≤3% |\n|---|---:|---:|\n| 2016~2021 | **+6.85% ~ +0.15%（全正）** | −0.49% ~ +0.13% |\n| 2022~2026 | **−1.05% ~ −0.37%（全负）** | −0.45% ~ −0.00% |\n\n→ 涨停次日高开幅度 已改为「**已复核-不可作规则**」。**它不进决策链，只当「打板生态 2022 年断裂」的证据。**\n\n### 3.1c 基线（任何短线策略的及格线）\n\n**「涨停次日开盘无脑接力，持 1 日」= −0.198%，胜率 44.3%，扣成本后 −0.35%。**\n\n**这条是负的，意味着「基准动作」本身就在亏钱。** 所以任何短线策略要回答的不是「能不能超过基线」，而是「**能不能翻正**」。\n\n它同时复现了 跟随者策略 里「纯 K 线打板胜率约 45%」那条经验值（实测 44.3%）。\n\n### 3.2 「0」是默认状态\n\n引用 少与0：**做得好的人做得少。** 一周没有符合条件的机会，就是一周 0 笔，这是正常，不是失败。\n\n### 3.3 硬性禁止\n\n| 禁止 | 原因 |\n|---|---|\n| 大盘跌超 1.5% 当天开新仓 | 逆水行舟，短线没有时间修复 |\n| 手里已有亏损仓时开新仓 | 两笔会互相干扰决策 |\n| 一天开第 2 笔 | 见 5.4 频率上限 |\n\n---\n\n## 四、第②层：选股（做哪一只）\n\n### 4.1 求极值\n\n引用 龙头即求极值：**龙头是求出来的极值点，不是挑出来的好公司。**\n\n每只候选必须能回答一句话：**它凭什么算是当前市场里最强或最旺的那一个？**\n\n答不出 → 淘汰。\n\n### 4.2 三个独立系统（引用 三独立系统乘法）\n\n| 格 | 本域的具体内容 | 通过标准（草案） |\n|---|---|---|\n| **技术** | 缠论结构（走势中枢、三类买卖点） | 有中枢，且当前是离开中枢后的回抽 |\n| **比价** | 它在所属题材里的地位（龙头即求极值） | 属于该题材的前 2 名 |\n| **基本面** | 事件对市场心理的影响，不是财务指标 | 能说清「这个信息会让别人怎么动」 |\n\n**三格全过才下单。两格过 → 回到 0。**\n\n### 4.3 题材级别（引用 涨停板质量分级）\n\n题材必须分级。级别越高，容错越高：\n\n| 级别 | 例 | 本域处理 |\n|---|---|---|\n| 国家级／产业级 | 政策级产业方向 | 可做，位置容忍度最高 |\n| 行业级 | 单一行业景气 | 可做，需位置更低 |\n| 个股级 | 单只票的利好 | **不做**（无法形成板块效应） |\n\n---\n\n## 五、第③层：位置（能不能买）\n\n### 5.1 位置三段（引用 龙头空间三段）\n\n```\n位置 = (当前价 − 起涨点) ÷ (预期终值 − 起涨点)\n```\n\n| 区间 | 区域 | 动作（草案） |\n|---|---|---|\n| 0–33% | 低位区 | 可试仓，容错最高 |\n| 33–66% | 腰位区 | 必须同时满足结构确认 |\n| 66–100% | 高位区 | **只做加速，不做回踩** |\n\n### 5.2 位置否决权（龙头即求极值）\n\n> **不在正确的位置，再强也不买。**\n\n这是本层唯一不可协商的条款。位置不合格时，其余四层全部通过也不开仓。\n\n### 5.3 未完成项（必须承认）\n\n「预期终值」目前**没有统计数据**。龙头空间三段 指出「90% 以上龙头股都有常见的空间高度」，但书里没给数值。\n\n**在统计完成前，本层降级为「粗判」**：只用「是否已翻倍」「是否已连续 3 板以上」两个粗条件筛掉明显高位。\n\n---\n\n## 六、第④层：结构（什么时候买）\n\n### 6.1 必须做一次取舍（本系统最大的未决问题）\n\n三本书给了三个不同的「买点」，逻辑互相冲突：\n\n| 方案 | 出处 | 买点定义 | 优点 | 缺点 |\n|---|---|---|---|---|\n| **A · 三买** | 三类买卖点 | 离开中枢后回抽不跌破 ZG | 结构最硬，止损天然 | 需要画中枢，无图难练 |\n| **B · 关键点** | 关键点战法 | 突破整数关口／前高的瞬间 | 有明确触发，可机械执行 | 假突破多 |\n| **C · 双响／反包** | 涨停板质量分级 | 洗盘后再涨停 | 作者说实战价值高 | 需盯盘，需分时判断 |\n\n**本系统 v0.1 的选择：主用 B（关键点），用 A 做否决。**\n\n理由：\n- B 可以机械执行，不依赖画图 → 现阶段的我能做到\n- A 作为否决条件：突破时如果**处于中枢内部**，则该突破不算（因为那不是离开中枢）\n\n**这条选择必须由实盘检验，不许凭喜好改。**\n\n#### 🔴 回测结果：B 方案被劈成两半（2026-10-20，短线回测_02_战法胜率）\n\n| B 方案的组成部分 | 回测结论 |\n|---|---|\n| **「整数关口」有额外价值** | ❌ **不成立**。6 个价格带里，关口突破 **0/6 优于**普通新高。扣费后 −0.05%，还不如随机新高（+0.06%） |\n| **「突破后该马上走强」** | ✅ **成立**。突破后 T+1 守住关口的那一半，持到 T+3 是 **+2.884%**；失守那一半一路跌到 **−2.858%**，没有回升 |\n\n**所以 B 方案要拆开用**：**「关键点」这个价位概念可以留，「整数」这个特殊性要扔掉**——真正有用的不是价格是不是整数，是**突破之后有没有立刻走强**。\n\n**这一改动待拍板，暂不动规则（见 §十 第 0 条）。**\n\n**另一条硬数字**：关键点突破是「彩票型」。均值 +0.102%，**中位数 −0.565%**，P10 −8.79% / P90 +10.00%。**多数笔亏钱，靠少数大涨拉平均。** 盈亏比必须 > 1.2 才活得下去，实测 1.23，扣费后归零。\n\n### 6.2 危险信号（关键点战法）\n\n突破后的行为必须与前一次突破对比：\n\n| 现象 | 判定 |\n|---|---|\n| 突破后 1~3 天内快速离开突破位 | 正常 |\n| 突破后 1~3 天仍在突破位附近磨 | **危险** |\n| 突破后跌回突破位下方 | **危险 + 假突破**（2B法则） |\n\n**回测证据（2026-10-20，74,541 笔关口突破）**：这条是**全套系统里目前唯一被数据正面证实的规则**。\n\n| 组 | n | T+1 | T+3 累计 |\n|---|---:|---:|---:|\n| 突破后守住关口 | 37,639 | +2.418% | **+2.884%** |\n| 突破后失守关口 | 36,902 | −2.227% | **−2.858%** |\n\n**关键点**：失守那一组**没有回升**，一路跌到 −2.86%。说明「失守」不是洗盘，是真跌。所以「该强不强就走」不是感觉，是有统计支持的。\n\n规则价值：**+0.354% vs 无条件持有 +0.042%，改善 +0.312pp。**\n\n### 6.3 板块确认（关键点战法 第八章）\n\n个股突破前，必须确认所属板块方向向上。\n\n**板块方向不明 → 不开仓。** 这条优先于一切形态。\n\n---\n\n## 七、第⑤层：执行（买多少 / 怎么卖）\n\n### 7.1 止损（写在下单前，不许事后改）\n\n| 进场方式 | 止损位 |\n|---|---|\n| 关键点突破 | **突破位本身**（跌回突破位下方即错） |\n| 回踩买（三买） | **中枢上沿 ZG** |\n| 一字板打开后进 | 打开当日最低价 |\n\n**执行方式**：触及止损 → **次日开盘无条件清仓**（T+1 限制，当天可能卖不掉）。\n\n> 这一条与 ETF 的「结构位 − 0.5N」不同。**ETF 用 ATR，短线用结构位**。两套不混用。\n\n### 7.2 仓位\n\n**先由睡眠定上限**，再用风险反算（引用 情绪与仓位上限）：\n\n```\n第 1 步：写下「能睡着的最大金额」= 硬上限\n第 2 步：仓位金额 = 账户 × 1% ÷ 止损距离%\n第 3 步：取两者较小值\n```\n\n**为什么两步都要**：风险反算会算出「理论上能买多少」，睡眠上限会算出「实际敢买多少」。取小。\n\n### 7.3 离场\n\n| 触发 | 动作 |\n|---|---|\n| 触及止损位 | 次日开盘清仓 |\n| 危险信号（6.2） | 当日或次日清仓 |\n| 持满 3 个交易日仍未达到目标的 50% | 收盘离场（时间止损） |\n| 达到目标位 | 分批走，至少走一半 |\n\n**时间止损是本域特有的**。ETF 可以熬，短线不能。\n\n### 7.4 频率上限（少与0）\n\n| 限制 | 数值（草案） |\n|---|---|\n| 单日开仓 | **最多 1 笔** |\n| 单周开仓 | **最多 3 笔** |\n| 同时持仓 | **最多 2 只** |\n\n**不设上限的结果**：手续费吃掉利润（见 成本拖累），且无法归因。\n\n### 7.5 出金（攥紧手里的钱）\n\n每笔成功后，**取出该笔盈利的一半**，转到不用于交易的账户。\n\n---\n\n## 八、纪律红线（破一条，停手一周）\n\n1. **浮亏绝不加仓。** 加仓的唯一前提是已经赚钱（金字塔加仓）\n2. **止损位下单前写定，盘中不许改。** 改止损＝换系统\n3. **一天最多 1 笔，一周最多 3 笔。**\n4. **睡不着就减仓。**\n5. **不听消息下单。** 任何「听说」都必须过三个格子\n6. **不追「技术完美」的涨停板。**（涨停板质量分级：那可能正是主力伪造的形态）\n7. **不在系统未验证前上真仓。**\n\n---\n\n## 九、每日工作流（待建）\n\n| 时段 | 动作 | 产出 |\n|---|---|---|\n| 盘前 08:50 | 判环境三档；列今日候选（≤3 只）；写下每只的关键价位 | `每日复盘/YYYY-MM-DD-盘前.md` |\n| 盘中 | 只在预设关键价位挂单；不做临场决定 | — |\n| 收盘后 | 记一笔：为什么买、止损多少、实际怎么走、结果 | `交易记录/YYYY-MM.md` |\n| 周末 | 统计本周胜率、盈亏比、违反红线次数 | `每日复盘/周复盘-YYYY-Www.md` |\n\n> 自动化（定时推送、脚本）**尚未建立**。ETF 域已有成熟的三时段推送，本域先手工作业，跑出 20 笔样本再谈自动化。\n\n---\n\n## 十、未验证清单（本系统的诚实账）\n\n> **2026-10-20 更新**：第 1、5 项已做第 1 轮（短线回测_01_环境三档）。结果不是「验证通过」，是**证伪**。\n\n### 第 0 条 · 待拍板（不拍板就不动手）\n\n**（2026-10-20 第 2 轮回测后重写，共 4 案）**\n\n| # | 事项 | 回测结论 | 候选做法 | 倾向 |\n|---|---|---|---|---|\n| 1 | §3.1 环境三档 | 方向反了（A −0.651% 最差、C −0.074% 最好；A 优于 C 仅 1/11 年；t=−1.24） | ①废掉，只留 §3.3 硬禁止 ②改用途 ③降级为观察指标 | **①**。三档全负，救不回来 |\n| 2 | 打板一族 | 理论 **+1.647%/56.6%**（已剔买不到的一字板），但封板排队成功率仍远低于 100% | ①规则里写「不做打板」 ②承认只有能封板的人能做，散户侧不写 ③只看不做 | **②**。这是成交位置问题，不是能力问题，写进规则也没用 |\n| 3 | 接力一族 | **−0.198% / 44.3%**，持越久越亏（2 日 −0.39%、4 日 −0.65%） | ①全禁 ②只留「龙头 + 持 1 日」极窄窗口 ③降级「不做」 | **①**。负期望没有优化空间 |\n| 4 | 第 5 板接力为正（+1.584%/57.5%） | 与「高位不做」冲突，样本仅 3,275 笔 | ①当噪声 ②写进规则 ③单独立项查幸存者偏差 | **③**，查清前按 ① 处理 |\n\n**已可确定、不必拍板的一条**：§6.2 危险信号离场**有效**（+0.312pp，失守组持续下跌无回升），直接写进系统。\n\n### 清单\n\n| # | 未落地的事 | 影响 | 优先级 | 状态 |\n|---|---|---|---|---|\n| 1 | ~~环境三档阈值无依据~~ | 第①层不可靠 | 最高 | ✅ **已回测：被证伪**（A 优于 C 仅 1/11 年）。待第 0 条第 1 案 |\n| 2 | **龙头空间高度的统计缺失** | 第③层只能粗判 | 高 | 🟡 **部分**：已测「第几板」分布（打板口径 3 板最强、5 板衰减），但「起涨→终值」的空间统计未做 |\n| 3 | **关键点 vs 三买的取舍未验证** | 第④层可能选错 | 高 | 🟡 **部分**：关键点的「整数关口」被否（0/6 价格带占优），「危险信号」被证实。三买仍未测 |\n| 4 | **止损距离未统计** | 第⑤层仓位算不准 | 中 | 未动 |\n| 5 | ~~无任何回测~~ | 全套系统是「读来的」不是「验过的」 | 最高 | ✅ **两轮已跑**（1,034 万行日K）。基线改：无脑接力 **−0.198% / 44.3%**（合规口径） |\n| 6 | **无自动化** | 只能手工执行 | 低 | 刻意不做 |\n| 7 | **打板成交概率无法建模** | 打板口径 +1.647% 仍只是上限 | 高 | ❌ 数据层面无解，只能定性说明 |\n\n**在这 7 项完成之前，本系统只能用于模拟盘或极小仓位（不超过 300 元）。**\n\n---\n\n## 附录 A：本域知识卡索引（25 张，全部 `domain: shortline`）\n\n**概念 6**：走势终完美 · 走势中枢 · 持股与持币 · 少与0 · 情绪与仓位上限 · 群体博弈\n\n**方法 19**：三类买卖点 · 趋势力度与背驰 · 均线缠绕三吻 · 分型笔线段 · 中枢震荡监视器 · 三独立系统乘法 · 分段操作法 · 龙头即求极值 · 龙头空间三段 · 先手 · 涨停板质量分级 · 关键点战法 · 金字塔加仓 · 攥紧手里的钱 · 赚钱效应循环 · 忘记成本 · 赢面与满仓条件 · 跟随者策略 · **涨停次日高开幅度**（唯一非书本来源，自研回测）\n\n**书源 4**：缠论 · 香象渡河 · 股票大作手操盘术 · 炒股养家心法\n\n## 附录 B：与 ETF 域的对照速查\n\n| 问题 | ETF 域的答案 | 短线域的答案 |\n|---|---|---|\n| 止损放哪 | 结构位 − 0.5N（N = ATR） | **突破位 / 中枢上沿** |\n| 能不能加仓 | 盈利后满足三条件可加 | **原则上不加**（时间窗太窄） |\n| 亏了怎么办 | A 线越跌越买；B 线清仓 | **一律清仓**（没有 A 线） |\n| 持仓多久 | A 线长期；B 线 3~15 天 | **1~3 天，最多 3 天** |\n| 什么时候不做 | 大盘 C/D 档不开仓 | **环境 C 档 0 笔；位置高位不做** |\n| 靠什么选标的 | 主线归属 + 量价 | **求极值（最强／最旺）** |\n\n## 附录 C：本域载体清单（谁来记、记在哪）\n\n| 载体 | 文件 | 作用 | 谁写 |\n|---|---|---|---|\n| 规则真源 | 本文（短线交易系统） | 唯一规则来源，纪律判定照此 | 人改，改前备份 |\n| 速查卡 | 短线交易系统速查卡 | 下单前 30 秒扫一遍 | 随真源同步 |\n| 判断台账 | 短线判断台账 | 每笔判断留痕 + 逐条对账；**未开仓的也要记** | 盘后手填 |\n| 版本记录 | 短线版本记录 | 每次改规则的理由与当时口径 | 随真源同步 |\n| 书籍导读 | 短线书籍导读 | 4 本书 + 三处冲突裁决 + 跨域参考 | 读完/复读时更新 |\n| 回测报告 | 短线回测_01_环境三档（口径作废，方法论留）· 短线回测_02_战法胜率（七种战法）· 短线回测_03_早盘选股赌涨停（三动作拆分 + 盈亏平衡线） | 每轮回测一份；含数据口径、限界、待裁决项 | 跑完即写 |\n| 人读版入口 | 短线-00-先看这里 | 手机可读的 7 篇 | 真源变更后同步 |\n\n> **命名硬规矩**：本域文件名一律带「短线」前缀。ETF 域已有 `判断台账.md` 与 `_版本记录.md`，同名会让 Obsidian 双链串域——这属于「互相污染」，已踩过一次。\n\n---\n\n_本文 v0.2，2026-10-20 两轮回测后修订。规则改动一律先改本文，再同步 短线-00-先看这里 与 `domains/shortline.json`。_\n\n> **回测改变了本文的三处**：§3.1a 环境三档数字（合规口径）、§6.1 关键点拆成「整数无效／危险信号有效」、§十 待拍板重写为 4 案。**原条文未删，只加结论。**",

   "body": "# 短线交易系统 · 速查卡\n\n> 真源：短线交易系统。冲突以真源为准。**下单前扫一眼这页。**\n\n## 一、五层，任何一层不过就 0\n\n```\n① 环境 → ② 选股 → ③ 位置 → ④ 结构 → ⑤ 执行\n```\n\n| 层 | 一句话问自己 | 不过怎么办 |\n|---|---|---|\n| ① 环境 | 今天涨停家数在增还是在减？指数在 20 日线上吗？ | **0 笔** |\n| ② 选股 | 它凭什么是最强／最旺的那一个？ | 换票或不做 |\n| ③ 位置 | 起涨到现在走了多少？过了三分之二没有？ | **不做** |\n| ④ 结构 | 突破了没有？**突破后有没有立刻走强？** | 等 / 走 |\n| ⑤ 执行 | 止损写了吗？买多少算过了吗？ | 不下单 |\n\n## 二、四条硬数字\n\n| 项 | 数字 |\n|---|---|\n| 单日开仓 | ≤ **1** 笔 |\n| 单周开仓 | ≤ **3** 笔 |\n| 同时持仓 | ≤ **2** 只 |\n| 持仓上限 | **3 个交易日**（到点没动就走） |\n\n## 三、止损（下单前写定）\n\n| 怎么进的 | 止损在哪 |\n|---|---|\n| 突破关键价位 | **突破位**（跌回下方即错） |\n| 回踩中枢上沿 | **ZG**（中枢上沿） |\n| 一字板打开后 | 打开当日最低价 |\n\n触及 → **次日开盘无条件清仓**。\n\n## 四、仓位\n\n```\n仓位 = min( 账户 × 1% ÷ 止损距离% , 能睡着的最大金额 )\n```\n\n## 五、必走的三件事\n\n1. **危险信号**：突破后 1~3 天还在突破位附近磨 → 走\n2. **板块不对**：个股突破但板块向下 → 不开\n3. **睡不着**：减到睡得着为止\n\n## 六、七条红线（破一条停手一周）\n\n1. 浮亏不加仓\n2. 止损位盘中不改\n3. 一天不超 1 笔\n4. 睡不着就减仓\n5. 不听消息下单\n6. 不追「技术完美」的涨停板\n7. **系统未验证不上真仓**（当前 ≤300 元或模拟）\n\n## 七、每笔必记四样\n\n```\n进场理由（哪一层过的）\n止损价\n实际走势\n结果 + 归因（是对的还是蒙的）\n```\n\n## 八、回测已经告诉我的（2026-10-21 更新）\n\n| 结论 | 数字 |\n|---|---|\n| **无脑打板是亏的** | 封住 +2.26%（64.4%）／炸板 **−5.18%**（35.6%）→ 真实期望 **−0.39%**，十年 9 年亏 |\n| **唯一翻正的单一条件：量比 <1** | 缩量板炸板率 38%→10.5%，期望 −0.54%→**+2.33%**，完全单调无例外 |\n| **缩量 + 开盘涨 3~9%** | **+4.10%，胜率 81.9%，10/10 年为正**。但均值从 2018 的 +5.29% 降到 2026 的 +2.91% |\n| **钱全在隔夜跳空里** | 次日跳空 **+2.146%**；次日日内 **−0.283%**（胜率 43.7%）→ 开盘就走 |\n| **连板越打越亏** | 昨日 2 板炸板亏 −9.68%、3 板 −11.04%，而封住只多赚 0.5pp |\n| **接力是负期望** | 次日开盘买、T+2 收盘卖 −0.198%，胜率 44.3%，持越久越亏 |\n| **「整数关口」没有特殊价值** | 6 个价格带，关口突破 0/6 优于普通新高 |\n| **「该强不强就走」有真价值** | 突破后守住 +2.88%；失守 −2.86%，且不回升 |\n\n> ⚠️ 旧的「打板 +1.65%／56.6%」已作废 —— 那是幸存者偏差（只取封住的样本）。见 短线回测_04_打板操作手册。\n\n## 九、时点（2026-10-21 补）\n\n| 时点 | 动作 |\n|---|---|\n| **09:18** | 推「今天要卖的票 + 各自跌停价」→ 9:15 起可挂单 |\n| **09:25** | 集合竞价撮合，**跌停价卖单一次清光** |\n| **09:35** | 首轮选股扫描（9:31-9:34 数据太短，量比噪音大） |\n| 10:15 / 11:00 / 13:30 / 14:15 | 复扫 4 轮 |\n| 14:30 | **停止接新单**（尾盘封板胜率仅 60.7%，全场最低） |\n| 15:05 | 收盘归档、算次日基准 |\n\n完整时点、脚本位置、怎么改 → 短线自动化。\n\n**盘中量比 <1 ≠ 全天量比 <1**：10:00 时正常票量比已到 2.1，直接筛 <1 等于全天 <0.46，会砍掉大半。详见 短线回测_04_打板操作手册 §七点五。\n\n**要在同花顺 / 问财里复现这套条件**：按时点换算好的量比阈值 + 现成的一句话，见 短线选股条件_问财版。\n\n---\n\n_速查卡不存规则细节。要看理由，回 短线交易系统 或对应知识卡。数据见 短线回测_02_战法胜率 / 短线回测_04_打板操作手册。_",

   "oneliner": "🔴 本报告口径违规，数字全部作废。请读 [[短线回测_02_战法胜率]]。  错在哪：本报告用「T+1 开盘买 → T+1 收盘卖」算收益。A 股 T+1，当天买的当天不能卖。这个动作做不出来。  后果有多严重： - 「无脑接力 +0.049% / 胜率 46.7%」→ 合规口径下是 −0.198% / 44.3% - 「高开 >7% 十年每年都负」→ 合规口径下方向反了，是 +0.206% / 51.5% - 环境三档「A 最差」，方向仍然成立，但 t 值从 −2.92 降到 −1.24  保留下来的东西：方法论（按日聚合避免同日相关、设对照组、分年稳定性）是对的；「环境三档方向反了」这个结论也仍然成立。只有收益数字要换成 02 的。",

   "body": "# 短线回测 01 · 环境三档与隔日接力\n\n> 🔴 **本报告口径违规，数字全部作废。请读 短线回测_02_战法胜率。**\n>\n> **错在哪**：本报告用「T+1 开盘买 → **T+1 收盘**卖」算收益。A 股 T+1，当天买的当天不能卖。这个动作**做不出来**。\n>\n> **后果有多严重**：\n> - 「无脑接力 +0.049% / 胜率 46.7%」→ 合规口径下是 **−0.198% / 44.3%**\n> - 「高开 >7% 十年每年都负」→ 合规口径下**方向反了**，是 +0.206% / 51.5%\n> - 环境三档「A 最差」，**方向仍然成立**，但 t 值从 −2.92 降到 −1.24\n>\n> **保留下来的东西**：方法论（按日聚合避免同日相关、设对照组、分年稳定性）是对的；「环境三档方向反了」这个结论也仍然成立。只有收益数字要换成 02 的。\n\n> ⚠️ **本报告不改规则。** 结论只作为裁决依据，改成什么由人拍板（见 §六）。\n\n---\n\n## 一、数据与口径\n\n| 项 | 值 |\n|---|---|\n| 数据源 | 同花顺 CLI 本地 DuckDB（`data init --db` 产物，754 MB） |\n| 导出方式 | `market panel --start --end --file-format parquet` |\n| 面板 | `data/panel_10y.parquet`，**1,034.3 万行**（439 MB） |\n| 覆盖 | **5,576 只 × 2,429 交易日**，2016-10-17 → 2026-10-16 |\n| 价格 | **前复权**（面板直接给前复权，已核对：000001.SZ 2016-10-17 收 6.679，与 `market history --adjust forward` 一致） |\n| 字段 | `thscode / date / open / high / low / close / volume / amount` |\n\n**涨停判定**（自建，因为面板不含涨跌停价）：\n\n```\n涨停价 = round(前收盘 × (1 + 限制), 2)\n涨停   = 收盘 ≥ 涨停价 − 0.001  且  收盘 ≥ 最高价 − 0.001\n炸板   = 最高 ≥ 涨停价 − 0.001  且  收盘 < 涨停价 − 0.001\n限制   = 688/689 与 30 开头 → 20% ｜ 8/4 开头 → 30% ｜ 其余 → 10%\n```\n\n**被回测的动作**（不选股、不设止损，只看这一个动作本身）：\n\n> **t 日涨停 → t+1 日开盘买入 → t+1 日收盘卖出**（隔日接力）\n\n剔除 t+1 一字开盘（开盘价=当日涨停价，真实买不进）。\n\n---\n\n## 二、样本量\n\n| 项 | 数 |\n|---|---:|\n| 涨停事件（十年累计） | **113,887** |\n| 其中 t+1 一字开盘、买不进 | 14,772（**13.0%**） |\n| **可交易样本** | **99,115** |\n\n全样本「次日开盘买、收盘卖」：\n\n| 均值 | 中位数 | 胜率 |\n|---:|---:|---:|\n| **+0.049%** | −0.091% | **46.7%** |\n\n> **无脑接力是零期望。** 这个数字与 跟随者策略 里那条「纯 K 线打板胜率约 45%」几乎完全对上——书里的经验值，在十年全市场数据上复现了。\n\n---\n\n## 三、主要发现 1：决定盈亏的是「次日高开幅度」\n\n`gap = 次日开盘价 ÷ 今日涨停价 − 1`\n\n| 次日高开 | 样本 | 均值 | 胜率 | 持 2 日均值 |\n|---|---:|---:|---:|---:|\n| **≤ +3%**（含低开） | 66,917 | **+0.394%** | **48.6%** | −0.011% |\n| +3% ~ +7% | 20,666 | −0.410% | 48.1% | −0.127% |\n| **> +7%** | 11,532 | **−1.128%** | **33.4%** | +1.203% |\n\n**两极差 1.52 个百分点，胜率差 15 个百分点。**\n\n再拆细一点（五档）：\n\n| gap | 样本 | 均值 | 胜率 |\n|---|---:|---:|---:|\n| < −3% | 8,077 | **+1.341%** | 49.5% |\n| −3% ~ 0 | 22,191 | +0.204% | 46.7% |\n| 0 ~ +3% | 36,649 | +0.300% | 49.5% |\n| +3% ~ +7% | 20,666 | −0.410% | 48.1% |\n| **> +7%** | 11,532 | **−1.128%** | **33.4%** |\n\n**分年检验（关键）**：高开 >7% 这一档，**11 年全部为负**\n\n| 年 | 高开>7% 均值 | n | 开≤3% 均值 | n |\n|---|---:|---:|---:|---:|\n| 2016 | −0.37% | 298 | +0.81% | 597 |\n| 2017 | −0.48% | 1,066 | +0.66% | 2,440 |\n| 2018 | −1.49% | 588 | +0.41% | 3,512 |\n| 2019 | −1.46% | 850 | +0.27% | 4,492 |\n| 2020 | −1.42% | 1,195 | +0.56% | 6,224 |\n| 2021 | −1.12% | 1,117 | +0.40% | 8,665 |\n| 2022 | −1.69% | 1,131 | +0.44% | 8,685 |\n| 2023 | −0.34% | 870 | +0.39% | 5,044 |\n| 2024 | −1.25% | 2,138 | +0.32% | 9,212 |\n| 2025 | −1.19% | 1,432 | +0.35% | 9,085 |\n| 2026 | −0.85% | 847 | +0.31% | 8,961 |\n\n**11/11 年为负；而「开 ≤3%」11/11 年为正。** 这是本轮回测里唯一一条每一年都成立的规律。\n\n> **必须同时说的限定**：高开 >7% 的**胜率**在逐年上升（2016 年 4.7% → 2026 年 50.1%）。胜率上去了、均值还是负 → 结构是「小赚多次、大亏几次」。所以不能说「永远不能接」，只能说**靠这个动作赚不到均值，靠盈亏比也不行，除非有额外筛选**。\n\n---\n\n## 四、主要发现 2：环境三档被证伪（反向）\n\n按 §3.1 原文实现（原文 A/B/C 判据有重叠，这里显式定序并留痕：**先判 C，再判 A，其余 B**）：\n\n```\nC：等权指数 < MA20×0.98    或  涨停家数连续 3 日下降\nA：等权指数 > MA20×0.98    且  近 5 日涨停家数均值 ≥ 1.2 × 前 5 日\nB：其余\n```\n\n> 指数替代说明：库内无指数日线（本地 0 行、远程 `count=0`），**用全市场等权指数**（每日全股收益均值累乘）代替沪深300。对短线而言等权口径其实更贴。\n\n**① 十年分布**\n\n| 档 | 交易日 | 占比 | 当日涨停家数均值 | 最大连板均值 |\n|---|---:|---:|---:|---:|\n| A 可做 | 373 | 15.4% | 63.2 | 7.0 |\n| B 谨慎 | 1,155 | 47.6% | 48.2 | 6.2 |\n| C 停手 | 896 | 37.0% | 38.6 | 5.9 |\n\n**② 分档后「次日全市场平均涨幅」——方向是对的**\n\n| 档 | 次日全股均值涨幅 | 胜率 |\n|---|---:|---:|\n| A | **+0.116%** | 52.0% |\n| B | +0.038% | 54.6% |\n| C | +0.003% | 54.6% |\n\nA > B > C，单调。**所以这组阈值不是完全没用——它确实抓到了「情绪温度」。**\n\n**③ 但对「隔日接力」完全反过来**（按日聚合，每日一个观测）\n\n| 档 | 交易日 | 接力日均收益 | 标准差 |\n|---|---:|---:|---:|\n| A | 373 | **−0.101%** | 1.76% |\n| B | 1,155 | +0.165% | 1.63% |\n| C | 894 | **+0.229%** | 2.03% |\n\n**A − C = −0.331 个百分点，Welch t = −2.92**（1% 显著性水平）。\n\n**④ 分年检验：8/11 年 A 档劣于 C 档**\n\n| 年 | A 档 | C 档 | A−C |\n|---|---:|---:|---:|\n| 2016 | −0.19 | +0.31 | −0.50 |\n| 2017 | −0.05 | +0.59 | −0.64 |\n| 2018 | −0.48 | +0.38 | −0.86 |\n| 2019 | −0.53 | +0.26 | −0.79 |\n| **2020** | +0.15 | −0.11 | **+0.26** |\n| **2021** | +0.23 | −0.15 | **+0.38** |\n| 2022 | −0.54 | +0.33 | −0.87 |\n| 2023 | +0.27 | +0.32 | −0.05 |\n| **2024** | +0.18 | −0.09 | **+0.27** |\n| 2025 | −0.25 | +0.36 | −0.61 |\n| 2026 | −0.16 | +0.27 | −0.43 |\n\n**反转的三年（2020 / 2021 / 2024）都是成长风格牛市年。** 说明 A 档判据混进了「追涨」成分：涨停家数放大 1.2 倍这个条件，在牛市里等于是「情绪最热时进场」，而短线最热的时候正是接力最贵的时候。\n\n**⑤ 分档内部再按高开分桶——高开规律在每一档都成立**\n\n| 档 | 低开 | 0~3% | 3~7% | >7% |\n|---|---:|---:|---:|---:|\n| A | −0.203% / 42.6% | +0.123% / 47.8% | −0.601% / 46.3% | **−1.050% / 32.6%** |\n| B | +0.600% / 47.7% | +0.293% / 48.6% | −0.321% / 48.3% | **−1.117% / 34.7%** |\n| C | +0.766% / 49.8% | +0.422% / 51.9% | −0.432% / 49.1% | **−1.224% / 32.2%** |\n\n（格式：均值 / 胜率）\n\n**无论环境好坏，高开 >7% 都是胜率 32~35%、均值 −1.0~−1.2%。高开幅度这个变量的解释力，远大于环境档位。**\n\n---\n\n## 五、限界（必须一起读）\n\n| # | 限界 | 影响方向 | 严重度 |\n|---|---|---|---|\n| 1 | **数据库不含退市股**（实测 600485 信威 / 002450 康得新 / 000418 小天鹅 / 600001 邯郸钢铁，全部 0 行） | 接力策略天然偏「买快要死的票」，缺退市股会**高估**收益 | 🔴 高 |\n| 2 | 指数用等权替代 | 与原文「指数 20 日线」口径不同 | 🟡 中 |\n| 3 | 无 ST 标记 → ST 的 5% 涨停被漏判 | 只漏样本，不造假样本 | 🟡 中 |\n| 4 | 未扣成本。双边约 0.10~0.15% | +0.394% 毛收益 → 约 +0.25~0.30% 净 | 🟡 中 |\n| 5 | 按日聚合仍有自相关（涨停成串） | t=−2.92 的实际显著度低于表面 | 🟡 中 |\n| 6 | 前复权价在除权日附近可能误判涨停 | 占比极低 | 🟢 低 |\n| 7 | 只测「隔日接力」一个动作，未测选股 / 位置 / 止损 | 不能据此否定其它层 | 🟢 低 |\n\n---\n\n## 六、结论与待裁决的三件事\n\n### 已确立\n\n1. **「涨停次日开盘无脑接力」= 零期望**（+0.049%，胜率 46.7%，扣成本后为负）。这条要写进系统当**基线**：任何短线策略必须能证明自己**优于这条基线**，否则不如不做。\n2. **次日高开幅度是目前找到的最强单一变量**，且 11/11 年稳定。→ 已提炼成卡 涨停次日高开幅度。\n3. **环境三档对「接力」反向**，t=−2.92，8/11 年。A 档的真正含义不是「可做」，而是**「最贵」**。\n\n### 待你拍板（三条，我不自己改规则）\n\n| # | 候选改法 | 代价 |\n|---|---|---|\n| A | **废掉 §3.1 三档**，环境层只留「硬性禁止」（大盘跌超 1.5% 不开仓） | 失去一个心理开关，但去掉一个反向信号 |\n| B | **保留三档但改用途**：A 档不禁做，改成「A 档只接低开、绝不接高开」 | 规则更复杂，需要重写 §3.1 与速查卡 |\n| C | **三档降级为观察指标**，不参与开仓判定；开仓只看「高开 ≤3%」 | 最简洁，但等于承认环境层没做出来 |\n\n我的倾向：**C**。理由：一个 t 值 −2.92 的反向信号，留着当过滤器只会帮倒忙；而高开幅度那条规律每年都成立，可以直接用。\n\n### 下一步（第 2 轮回测，按价值排序）\n\n1. **位置三段**（一波高度三等分）——它决定「追不追」，是第二个未验证层\n2. **止损距离**（0.5N / 1N / 固定 %）在个股上的最优值\n3. **高开 ≤3% 组内再筛**：换手、连板数、昨日是否炸板、市值分桶——看能不能把 +0.394% 做厚\n\n---\n\n## 七、复现\n\n```bash\n# 1. 导出十年全市场前复权日K（约 8 秒）\nhithink-finance --db <你的>.duckdb --source local market panel \\\n  --start 2016-10-01 --end 2026-10-20 \\\n  --output data/panel_10y.parquet --file-format parquet\n\n# 2. 建每日情绪面板 → data/daily_env.csv\npython env_build.py\n\n# 3. 环境分档 + 隔日接力（本报告 §三 §四）\npython env_test.py && python env_test2.py\n```\n\n脚本与数据在工作区：`F:/Ai/workbuddy/2026-10-20-21-21-44/`（`env_build.py` / `env_test.py` / `env_test2.py` / `data/`）。\n\n---\n\n_建 2026-10-20。第 1 轮，只测了第①层与一个动作。结论未落地为规则。_",

   "oneliner": "🔴 本报告的「打板」数字已作废，见 [[短线回测_04_打板操作手册]]。 这里的 +1.65%/胜率 56.6% 是幸存者偏差——样本只取了「T 日收盘涨停」的票，等于「我知道它封住才买」。 真实打板是在封板瞬间下单，当时不知道会不会炸。把 35.6% 的炸板样本算进来后，真实期望是 −0.39%，十年 9 年亏。 本报告的其余部分（接力、关键点、龙头、双响炮、危险信号）不受影响，仍然有效。",
   "source": "07-复盘笔记/短线/短线系统/短线回测_02_战法胜率.md",
   "body": "# 短线回测 02 · 七种战法胜率\n\n> 🔴 **本报告的「打板」数字已作废，见 短线回测_04_打板操作手册。**\n> 这里的 +1.65%/胜率 56.6% 是**幸存者偏差**——样本只取了「T 日收盘涨停」的票，等于「我知道它封住才买」。\n> 真实打板是在封板瞬间下单，当时不知道会不会炸。**把 35.6% 的炸板样本算进来后，真实期望是 −0.39%，十年 9 年亏。**\n> 本报告的其余部分（接力、关键点、龙头、双响炮、危险信号）不受影响，仍然有效。\n\n> **一句话**：**打板的期望是 +1.65%，接力是 −0.20%。差的 1.85 个百分点全部在「隔夜跳空」里——而跳空属于能封住板的人。散户在 T+1 开盘追进去，等于把这 1.85pp 付给了卖给他的人。**\n> ⚠️ 上面这句里的「+1.65%」已作废，正确值为 −0.39%，见顶部红字。\n\n## 开头必须先认一个错\n\n第 1 轮回测（短线回测_01_环境三档）用了 **「T+1 开盘买 → T+1 收盘卖」** 的口径算收益。\n\n这个口径 **违反 A 股 T+1 制度**。T+1 当天买入的股票当天不能卖。所以那一轮报出的「无脑接力 +0.049% / 胜率 46.7%」**不可执行，作废**。\n\n本轮全部改合规口径，两个版本分开算：\n\n| 口径 | 买入 | 卖出 | 谁在做 |\n|---|---|---|---|\n| **打板** | T 日封涨停时买（买价＝涨停价） | T+1 开盘或收盘 | 有席位、能抢封板的人 |\n| **接力** | T+1 开盘买 | T+2 收盘（持 1 日） | **散户唯一能做的** |\n\n**受益人为负的那张卡 涨停次日高开幅度 也一并重算，结论反了。见第六节。**\n\n---\n\n## 一、总表：七种战法\n\n单元格式 = **均值% / 胜率%**。全部未扣成本。\n\n| 战法 | 口径 | n | 均值 | 胜率 | 扣费后 |\n|---|---|---:|---:|---:|---:|\n| **打板·可买合计**（剔一字） | 封板买→**T+1 收盘卖** | 107,629 | **+1.647** | **56.6%** | +1.50% |\n| 　└ 普通板 | 同上 | 51,463 | +1.886 | 58.7% | +1.74% |\n| 　└ 烂板（盘中翻绿） | 同上 | 50,655 | +1.436 | 54.7% | +1.29% |\n| 　└ T 字板 | 同上 | 5,511 | +1.362 | 54.8% | +1.21% |\n| 　└ **一字板** | 同上 | 13,695 | **+7.310** | **86.6%** | — **买不到，不计入** |\n| **接力·全部可买** | T+1 开盘买→T+2 收盘 | 109,324 | **−0.198** | **44.3%** | **−0.35%** |\n| **关键点突破（整数关口）** | T+1 开盘买→T+2 收盘 | 74,541 | +0.102 | 45.6% | **−0.05%** |\n| **关键点突破（普通新高）** | 同上 | 407,214 | +0.208 | 46.3% | +0.06% |\n| **龙头（当日最高板）** | 接力 | 1,737 | +0.251 | 50.5% | +0.10% |\n| **环境 A 档内接力** | 接力 | 22,046 | **−0.651** | 41.4% | **−0.80%** |\n\n**七种里，扣费后为正的只有打板一族。** 但注意：打板的 +1.647% 建立在「封板瞬间能成交」这个乐观假设上（见第九节限界 2）。\n\n> 打板若抢 T+1 **开盘**卖，可买口径下是 **+1.946% / 胜率 65.4%**，比收盘卖高 0.3pp。开盘卖要盯盘，收盘卖不用。\n\n---\n\n## 二、核心发现一：钱全在隔夜跳空里\n\n同一个信号（T 日涨停），两种做法的差距：\n\n| | 买入价 | 卖出 | 收益 | 胜率 |\n|---|---|---|---:|---:|\n| 打板（剔买不到的一字板） | T 日涨停价 | T+1 收盘 | **+1.647%** | 56.6% |\n| 接力 | T+1 开盘价 | T+2 收盘 | **−0.198%** | 44.3% |\n| **差** | | | **+1.845pp** | **12.3pp** |\n\n这 1.85 个百分点，就是 **「T 日收盘 → T+1 开盘」那段隔夜跳空的净额**。\n\n机制很直白：\n\n1. 涨停板把当天的买盘全部堵在门外\n2. 门一开（次日开盘），积压的买盘一次性释放，价格跳空\n3. 谁在封板时买到了，谁就白拿这段跳空\n4. 你在开盘追进去，**等于按跳空后的价格接盘**——把这段钱付给了卖你的人\n\n**这条解释了为什么「看别人打板赚钱，自己追进去就亏」。** 不是手法问题，是**成交位置**问题。\n\n> **为什么只有 1.85pp 而不是 10%？** 因为打板要承担 T+1 当天的下跌风险，接力省掉了这段风险但也放弃了跳空。两者相抵后，净差就是这 1.85pp。\n\n---\n\n## 三、核心发现二：接力是负期望，且持越久越亏\n\n| 持有 | 均值 | 胜率 | 扣费后 |\n|---|---:|---:|---:|\n| 1 日 | −0.198% | 44.3% | −0.35% |\n| 2 日 | −0.393% | 42.4% | −0.54% |\n| 4 日 | −0.651% | 39.6% | −0.80% |\n\n**单调递减，没有拐点。** 说明涨停后的动量在日线级别**没有延续性**，只有均值回复。\n\n这条对系统的意义：**「买涨停股然后等它继续涨」这个思路，在日线上是错的。** 本书单里所有「追进去等溢价」的说法，都要按这条打折。\n\n**分板型再切一刀**（接力口径，持 1 日）：\n\n| 板型 | n | 均值 | 胜率 |\n|---|---:|---:|---:|\n| 烂板（盘中翻绿又封回） | 48,913 | **−0.190** | 43.5% |\n| 普通板 | 48,274 | −0.348 | 43.8% |\n| T 字板 | 4,983 | **−1.204** | **39.6%** |\n\n**「烂板出龙头」这一条在接力口径下有微弱支持**——烂板是三种里最好的，比普通板好 0.16pp，比 T 字板好 1.01pp。\n\n但注意：**这只是「相对不那么差」，不是「能赚钱」。** 三种全负。\n\n---\n\n## 四、核心发现三：龙头有效，但只值 1 个百分点\n\n| 组 | 打板均值/胜率 | 接力均值/胜率 |\n|---|---|---|\n| 龙头（当日最高板） | +2.353% / 64.9% | **+0.251% / 50.5%** |\n| 非龙头连板 | +2.313% / 63.7% | **−0.785% / 43.0%** |\n| 差 | +0.04pp | **+1.04pp** |\n\n**打板口径下，龙头和非龙头几乎没有区别**（+0.04pp）——这与 龙头即求极值 的「必须龙大」说法**不一致**。\n\n**接力口径下龙头确实好 1.04pp**，是全场唯一稳定的结构差异。\n\n但扣费后龙头只剩 **+0.10%**。这个数字的意思是：**「只做龙头」能把负期望拉到盈亏平衡线附近，但不能变成稳定盈利。**\n\n---\n\n## 五、位置（第几板）：书的说法被推翻一半\n\n| 第几板 | 打板 均值/胜率 | 接力 均值/胜率 |\n|---|---|---|\n| 第 1 板 | +1.860% / 65.8% | −0.196% / 43.8% |\n| 第 2 板 | +2.353% / 64.3% | −0.623% / 42.8% |\n| 第 3 板 | **+2.479% / 64.2%** | −0.322% / 46.9% |\n| 第 4 板 | +2.268% / 62.6% | −0.060% / 48.7% |\n| 第 5 板及以上 | +1.818% / 60.4% | **+1.584% / 57.5%** |\n\n**打板口径：第 3 板最强，第 5 板后衰减。** 与 龙头空间三段 的「高位区不能做」方向一致——板数越高，收益越低。\n\n**接力口径：只有第 5 板以上为正（+1.58%）**。这与「高位不能碰」**直接冲突**。\n\n我不打算美化这个冲突。第 5 板以上接力为正，最可能的解释是：\n1. 样本只有 3,275 笔 / 1,576 天，不稳\n2. **能走到第 5 板的票本身是极端强势股，存在幸存者偏差**\n3. 高位股波动大，正尾更长\n\n**在搞清这三点之前，第 5 板接力这一条不许写进规则。** 见下方待拍板第 3 条。\n\n---\n\n## 六、整数关口：没有额外效应（这条最意外）\n\n利弗莫尔的 关键点战法 说，整数关口（50/100/200…）的突破最值得做。\n\n我设了对照组才敢下结论：\n\n- **A 组** = 首次突破整数关口，且创 60 日新高（74,541 笔）\n- **B 组** = 同样创 60 日新高，但突破位置不在整数关口（407,214 笔）\n\n| 价格带 | A 关口 | B 非关口 | A−B |\n|---|---:|---:|---:|\n| <10 元 | +0.075% | +0.220% | **−0.145** |\n| 10~20 元 | +0.057% | +0.179% | **−0.122** |\n| 20~30 元 | +0.109% | +0.148% | **−0.039** |\n| 30~50 元 | +0.058% | +0.197% | **−0.139** |\n| 50~100 元 | +0.243% | +0.347% | **−0.104** |\n| ≥100 元 | +0.304% | +0.410% | **−0.106** |\n\n**6 个价格带，A 组 0 个占优。** 整数关口不但没用，还略差。\n\n**为什么高位关口（100 元、150 元）看起来收益高？** 那是**高价股效应**，不是关口效应。同价位一比就没了。\n\n**但同一份数据里，利弗莫尔的另一半说法被证实了。**\n\n### 危险信号离场：+0.312pp，且失守是真的跌\n\n规则：突破后 T+1 收盘没守住关口 → 认为「该强不强」，T+1 收盘就走；守住了 → 持到 T+3。\n\n| 组 | n | T+1 | T+2 | T+3 累计 |\n|---|---:|---:|---:|---:|\n| 守住关口 | 37,639 | +2.418% | +2.749% | **+2.884%** |\n| 失守关口 | 36,902 | −2.227% | −2.598% | **−2.858%** |\n\n**失守组没有回升，一路跌到 −2.86%。所以「失守」不是洗盘，是真跌。**\n\n规则价值：**+0.354% vs 无条件持有 +0.042%，改善 +0.312pp**。\n\n这条可以用。但要说清它的性质：**它本质是止损，不是选股。** 失守组的 −2.23% 已经发生了，规则只是不让它继续亏。\n\n### 关键点突破是「彩票型」策略\n\n| 指标 | 值 |\n|---|---|\n| 均值 | +0.102% |\n| **中位数** | **−0.565%** |\n| P10 / P90 | −8.79% / +10.00% |\n| P1 / P99 | −18.48% / +24.33% |\n\n**均值正、中位数负。** 意思很明确：**多数笔是亏的，靠少数大涨把平均拉回来。**\n\n这种策略必须盈亏比 > 1.2 才活得下去。实测盈亏比 1.23，扣费后**归零**。\n\n---\n\n## 七、上一轮的两张卡：一张维持，一张要改\n\n### 环境三档：维持「方向反了」，但显著性变弱\n\n| 档 | n | 均值 | 胜率 |\n|---|---:|---:|---:|\n| A（我标「可做」） | 22,046 | **−0.651%** | **41.4%** |\n| B（谨慎） | 53,752 | −0.094% | 44.2% |\n| C（停手） | 33,455 | −0.074% | **46.4%** |\n\nA−C = **−0.246pp，t = −1.24**（上一轮算的是 t = −2.92）。\n\n**分年：A 优于 C 的只有 1/11 年。**\n\n口径改了之后显著性下降（t 从 −2.92 到 −1.24），但**方向没变**：我标「可做」的那一档，是最差的一档。\n\n### 高开幅度：**结论反了，必须改卡**\n\n| 次日高开 | n | 持 1 日均值 | 胜率 |\n|---|---:|---:|---:|\n| 低开 < −3% | 9,096 | −0.181% | 44.3% |\n| 低开 −3~0 | 22,438 | −0.186% | 44.4% |\n| 平开 0~3% | 42,677 | −0.134% | 43.6% |\n| 高开 3~7% | 23,200 | −0.542% | 41.8% |\n| **高开 > 7%** | 11,913 | **+0.206%** | **51.5%** |\n\n第 1 轮我说「高开 > 7% 一律不接，十年每年都是负的」。**在合规口径下，高开 > 7% 是唯一正期望的一组，胜率 51.5%。**\n\n为什么反了？因为两轮测的是**不同的事**：\n\n- 第 1 轮测的是**日内**（T+1 开 → T+1 收）→ 高开之后**当天会回落**\n- 本轮测的是**隔日**（T+1 开 → T+2 收）→ 高开的票**第二天继续走强**\n\n**正确结论应该是**：高开 > 7% 的票，**当天冲高回落，但趋势还在**。所以不是「不能买」，而是「不能当天卖」。\n\n**但有个致命的时效问题**：分年看，这个效应 **2022 年之后消失**。\n\n| 年份 | 高开>7% | 开≤3% |\n|---|---:|---:|\n| 2016 | +6.85% | +0.13% |\n| 2017 | +5.91% | −0.11% |\n| 2018 | +0.92% | −0.49% |\n| 2019 | +0.66% | −0.41% |\n| 2020 | +0.72% | −0.01% |\n| 2021 | +0.15% | +0.06% |\n| 2022 | **−1.05%** | −0.14% |\n| 2023 | −0.85% | −0.17% |\n| 2024 | **−2.12%** | −0.45% |\n| 2025 | −1.19% | −0.00% |\n| 2026 | −0.37% | −0.09% |\n\n**2016~2021 强正（打板黄金期），2022 后转负（注册制 + 量化上位）。**\n\n所以这条不能当规则用，只能当**「生态已变」的证据**。上一轮的卡要改成这个说法。\n\n---\n\n## 八、还有一条：双响炮不如首板\n\n书里说「双响炮实战价值超过连板」（涨停板质量分级）。数据不支持。\n\n| 形态 | n | 打板均值 | 胜率 |\n|---|---:|---:|---:|\n| 首板 | 87,304 | **+1.860%** | **65.8%** |\n| 反包（昨跌 ≥7%） | 4,151 | +1.507% | 66.6% |\n| 双响炮 | 8,760 | **+1.206%** | 57.8% |\n| 连板 ≥2 | 20,325 | +2.317% | 63.8% |\n\n**双响炮的均值和胜率都低于首板。** 反包胜率略高但均值更低。\n\n**这三条都没有稳定优势。** 但注意：双响炮/反包的样本只覆盖 1,180~2,071 天，不是全样本。\n\n---\n\n## 九、限界（读这张表前必须知道）\n\n| # | 限界 | 影响方向 |\n|---|---|---|\n| 1 | **数据库不含退市股**（600485/002450/000418/600001 实测全 0 行） | 系统性**高估** |\n| 2 | **打板的成交概率无法建模**。一字板 13,695 笔占 11.3%，实际 0% 成交，**已从打板口径剔除**；但剩余 T 字板/烂板/普通板封板后的排队成功率也远低于 100% | 打板口径的 +1.647% 仍是**理论上限**，真实可达收益更低 |\n| 3 | **未扣成本**。表中「扣费后」按双边 0.15% 估算（佣金 0.05% + 印花税 0.05% + 滑点 0.05%） | 实际更低 |\n| 4 | **T+1 跌停卖不出未剔除**。假设任何价位都能卖出 | 高估 |\n| 5 | **前复权价与真实涨停价有分位误差**。用「涨幅 ≥ 限制−0.4pp」+「收盘=最高」双判据容忍 | 少量误判 |\n| 6 | **未区分 ST、新股、次新**。这些票的涨跌幅规则不同 | 混杂 |\n| 7 | **环境分档用全市场等权指数代替大盘**（库内无指数日线） | 阈值含义偏移 |\n\n---\n\n## 十、待拍板（三条，我不擅自改规则）\n\n| # | 事项 | 候选做法 | 我的倾向 |\n|---|---|---|---|\n| 1 | **打板一族怎么写** | ①认输，规则里写「不做打板」②承认只有能封板的人能做，散户侧不写 ③写「打板只看不做」 | **②**。这不是能力问题，是成交位置问题，写进规则也没用 |\n| 2 | **接力一族怎么写** | ①全禁 ②只留「龙头 + 持 1 日 + 扣费后约 0」的极窄窗口 ③降级成「不做」 | **①**。负期望没有优化空间，只有放弃 |\n| 3 | **第 5 板接力为正怎么处理** | ①当噪声忽略 ②当规则写进去 ③单独立项查清（是否幸存者偏差） | **③**，但在查清前按 ① 处理 |\n| 4 | **危险信号离场** | 唯一被证实的正面结论，+0.312pp | **写进系统**，作为关键点的配套离场 |\n\n---\n\n## 十一、可复现\n\n| 项 | 路径 |\n|---|---|\n| 原始面板 | `data/panel_10y.parquet`（439MB，10,342,990 行） |\n| 涨停事件表 | `data/bt_limit.parquet`（121,324 笔） |\n| 突破事件表 | `data/bt_break.parquet`（481,755 笔） |\n| 脚本 | `bt_plays.py`（板型/位置/龙头）· `bt_break.py`（关口）· `bt_break2.py`（价格对照）· `bt_break3.py`（危险信号）· `bt_gap.py`（高开）· `bt_env2.py`（环境） |\n\n运行环境：Python 3.13 + duckdb 1.5.6，全流程约 20 秒。\n\n---\n\n_2026-10-20 建。所有数字可用上表脚本一键复算。规则改动须先改 短线交易系统。_",

   "oneliner": "一句话结论：「早上开盘买入、赌当天涨停、次日卖出」这个动作，期望是负的，而且负得很有规律——你的涨停命中率每提高一档，市场要求你的赔率就下降一档，两者精确对冲，永远差 1~17 个百分点。这不是技术不行，是股价已经把「要涨停」这件事定过价了。",

   "body": "# 短线回测 03 · 「早盘选股赌涨停」到底行不行\n\n> **一句话结论**：**「早上开盘买入、赌当天涨停、次日卖出」这个动作，期望是负的，而且负得很有规律——你的涨停命中率每提高一档，市场要求你的赔率就下降一档，两者精确对冲，永远差 1~17 个百分点。这不是技术不行，是股价已经把「要涨停」这件事定过价了。**\n\n> 📌 **本报告起因**：用户说「我了解的打板是早上开盘选股，通过技术层面的数据预测股会不会涨停，然后买入等第二天溢价卖出」。这说明**「打板」这个词在民间被用成了另一个动作**，而这两个动作的期望差 1.845pp。本报告把三个动作拆开分别量化。\n\n---\n\n## 一、先把三个动作分开（这是全部混乱的根源）\n\n| 动作 | 叫什么 | 买入价 | 买入那一刻，涨停了吗 |\n|---|---|---|---|\n| ① 早上开盘买，赌今天涨停 | **半路 / 抢跑**（用户理解的做法） | 开盘价，或盘中某价 | **没有** |\n| ② 等它涨停了，在涨停价上排队买 | **打板**（真正的打板） | 涨停价 | **已经涨停** |\n| ③ 今天涨停了，明天开盘买 | **接力** | 次日开盘价 | 昨天涨停，今天不确定 |\n\n三个动作看起来只差「买早一点还是晚一点」，但**买在那 10% 里的位置不同，期望完全不同**。\n\n---\n\n## 二、三个动作的十年期望（严格 T+1 口径）\n\n| 动作 | 样本 | 均值 | 胜率 | 扣双边 0.15% |\n|---|---:|---:|---:|---:|\n| **② 打板**（T 日封板价买→T+1 收盘卖，已剔买不到的一字板） | 107,629 | **+1.647%** | 56.6% | +1.50% |\n| **① 半路**（T 日开盘价买→T+1 收盘卖，昨涨停池） | 101,943 | **−0.198%** | 44.3% | −0.35% |\n| **③ 接力**（T+1 开盘买→T+2 收盘卖） | 109,324 | **−0.198%** | 44.3% | −0.35% |\n\n> ①与③数值相同是巧合同源（都买在「涨停之外」），但样本与风险不同，不可互推。\n\n**三个动作的差别，全部落在「你有没有买在那 10% 里面」。** 买在涨停之前的每一分钱、买在涨停之后的每一分钱，都是负期望；只有买在涨停上（封板价）是正的。\n\n---\n\n## 三、核心表：「预测涨停」的真实盈亏结构\n\n样本 = 昨天涨停的票，今天按开盘涨幅分桶，全部按 **T 日开盘价买入 → T+1 收盘卖出**。\n\n| 今日开盘涨幅 | n | **实际命中率** | 命中时赚 | 未命中时亏 | **期望** | **盈亏平衡需要** | **缺口** |\n|---|---:|---:|---:|---:|---:|---:|---:|\n| 低开 | 29,602 | 5.44% | +14.71% | −0.85% | **−0.002%** | 5.45% | −0.01pp |\n| 0~3% | 42,007 | 10.04% | +10.33% | −1.28% | **−0.116%** | 11.04% | −1.00pp |\n| 3~6% | 19,531 | 24.89% | +7.45% | −2.96% | **−0.371%** | 28.46% | −3.57pp |\n| 6~9% | 7,554 | 39.40% | +5.45% | −5.62% | **−1.257%** | 50.75% | −11.35pp |\n| >9% | 3,249 | 33.76% | +4.67% | −4.80% | **−1.600%** | 50.67% | −16.91pp |\n\n**这张表读完只需要记住三件事**：\n\n1. **命中率确实能提上去**——从 5.44% 一路提到 39.40%，涨了 7 倍。\n2. **但赔率同步塌掉**——命中时赚的从 +14.71% 掉到 +4.67%，未命中时亏的从 −0.85% 扩到 −5.62%。\n3. **而且每一档都差一截，缺口随命中率升高而扩大**。\n\n> **这就是「股价已经把涨停预期定价了」的直接证据。** 你看到「今天它特别像要涨停」（高开 6~9%），市场同时也看到了，于是把买入价抬到那个位置。你以为你在预测，其实你在**为一则人尽皆知的预期付钱**。\n\n**「低开」那一档（期望 −0.002%）是唯一打平的**，因为那时还没有人为涨停预期付溢价。代价是命中率只有 5.44%——接近于彩票。\n\n---\n\n## 四、最反直觉的一条：越像要涨停的，越亏\n\n| | 命中率 | 期望 |\n|---|---:|---:|\n| 高开 6~9%（看起来马上要封板） | **39.40%** | **−1.257%** |\n| 高开 >9%（已经贴着涨停） | 33.76% | **−1.600%** |\n| 低开（看起来要死了） | 5.44% | −0.002% |\n\n**「我看着它要涨停了」这个感觉越强烈，期望越负。** 因为那个感觉不是你的信息优势，是价格本身在喊。\n\n---\n\n## 五、追高 1%，就吃掉 1%（这条最要命）\n\n他的实际成交价**一定高于开盘价**——因为他是「早上开盘选股」然后在盘中某点下单，那时票已经在拉了。日K 只能给开盘价，所以下表是**乐观**估计：\n\n| 成交价相对开盘价 | 期望（昨涨停 + 今日开盘涨幅 ≤3%） |\n|---|---:|\n| 按开盘价买（做不到） | −0.069% |\n| 贵 1% 买 | **−1.069%** |\n| 贵 2% 买 | **−2.069%** |\n| 贵 3% 买 | **−3.069%** |\n\n**线性、1:1、无缓冲。** 这一条单独就足以解释「为什么我一买就跌」——不是因为买错了票，是因为买入位置本身就自带 −1%~−3% 的入场折扣。\n\n---\n\n## 六、要赚钱，命中率得做到多少\n\n在「昨涨停 + 今日开盘涨幅 0~3%」池子里（命中时 +11.54%、未命中时 −1.10%，已扣双边 0.15%）：\n\n| 预测命中率 | 期望 |\n|---:|---:|\n| 5% | −0.615% |\n| 10%（≈当前可达上限） | **+0.017%** |\n| 20% | **+1.281%** |\n| 30% | **+2.544%** |\n| 50% | **+5.072%** |\n| 70% | **+7.600%** |\n\n**盈亏平衡点在 10% 附近。** 而「昨涨停 + 开盘涨幅 0~3%」这一档的实际命中率正好是 10.04%——**卡在零上，一分不多**。\n\n> 换句话说：**用日K能看到的全部信息，刚好只够把你送到「不亏不赚」这条线上。** 想赚钱，你需要日K之外的东西（盘口挂单、资金流向、板块联动、消息），而这些东西**回测不了**，也就**无法验证**。\n\n---\n\n## 七、上限检验：如果预测 100% 准\n\n| 假设 | n | 当天开盘→收盘 | 到 T+1 收盘 | 中位 | 胜率 |\n|---|---:|---:|---:|---:|---:|\n| 只买当天真涨停的（按开盘价买） | 99,872 | **+9.45%** | **+11.32%** | +10.55% | **94.0%** |\n\n**空间是真实存在的。** 问题从头到尾只有一个：**能不能在开盘那 25 分钟里，把 1% 的基准命中率提到 20% 以上。**\n\n日K给不了。这不是数据不够，是这件事的性质：**涨停是盘中行为，决定它的是盘口，不是昨天的K线。**\n\n---\n\n## 八、分年稳定性（昨涨停 + 今低开）\n\n| 年 | n | 命中率 | 期望 | 胜率 |\n|---|---:|---:|---:|---:|\n| 2017 | 901 | 3.44% | +0.009% | 43.3% |\n| 2018 | 1,956 | 5.11% | −0.064% | 43.9% |\n| 2019 | 2,584 | 5.84% | −0.161% | 44.3% |\n| 2020 | 3,031 | 6.20% | +0.415% | 48.9% |\n| 2021 | 3,095 | 4.75% | +0.405% | 47.2% |\n| 2022 | 3,462 | 6.85% | +0.291% | 47.4% |\n| 2023 | 2,158 | 5.70% | −0.178% | 43.5% |\n| 2024 | 4,177 | 6.39% | −0.717% | 40.7% |\n| 2025 | 4,109 | 5.23% | +0.174% | 45.6% |\n| 2026 | 4,129 | 3.66% | −0.090% | 45.7% |\n\n**5 年正 / 5 年负，最大 +0.415%、最差 −0.717%。** 完全随机，没有任何可依赖的结构。这一档不能当策略，只能当彩票。\n\n---\n\n## 九、那到底该怎么做\n\n数据只支持一条正的路径，就是第二节那张表里的 **② 打板**。但它有硬门槛：\n\n| 门槛 | 数据 |\n|---|---|\n| 一字板买不到 | 占打板样本 11.3%，收益 +7.31%，**成交率 0%** |\n| 其余封板要排队 | 无法建模，实际成交率远低于 100% → +1.647% 是**上限** |\n| 买在涨停前（半路） | −0.198% |\n| 买在涨停后（接力） | −0.198% |\n\n**结论：这条 10% 只能买在「涨停价上」，买早或买晚都是负的。** 这就是「打板」这个词的全部技术含义，也是它和个人理解的「早盘预测」最根本的分歧。\n\n### 可执行的三条（不涉及打板排队）\n\n1. **禁止追高开 >5% 的票**。数据：6~9% 期望 −1.257%、>9% 期望 −1.600%，两档合计 10,803 笔、10 年无一年为正。这条可以直接写成硬规则，因为它**只否决、不选股**。\n2. **想赌涨停，只在「低开」时赌**。期望 −0.002%≈0，靠右尾（P95 +14.0%）。但必须承认这是彩票：5.44% 命中率、10 年 5 正 5 负。仓位按彩票给。\n3. **成交价差 1% = 收益差 1%**。限价单，不追。宁可错过。\n\n---\n\n## 十、限界（必须读）\n\n| # | 限界 | 影响 |\n|---|---|---|\n| 1 | **日K只有开盘价**。他实际是盘中某点买，成交价高于开盘价 | 本报告所有「半路」数字都是**乐观上限**，真实更差（见第五节） |\n| 2 | **数据库不含退市股** | 涨停/接力类样本系统性高估 |\n| 3 | **打板成交概率无法建模** | +1.647% 是上限，不是可达值 |\n| 4 | 未扣印花税与滑点（表内已注明扣双边 0.15% 的列） | 实盘再降 0.05~0.1% |\n| 5 | 未区分 ST / 新股 / 北交所 | 混合样本，极值已用分位数检查（P5 −11.02%、P95 +14.0%） |\n| 6 | 涨跌幅限制按板块+日期分段（创业板 2020-08-24 起 20%），但未处理 2023 年主板新股前 5 日无限制 | 少量样本的涨停判定有偏 |\n| 7 | **无法测「技术层面预测」本身**。盘口、资金流、板块联动在日K里不存在 | 若这些信息真能提高命中率，本报告测不出；但也意味着**它无法被回测验证** |\n\n---\n\n## 十一、待裁决（不拍板不改规则）\n\n| # | 议题 | 倾向 |\n|---|---|---|\n| 1 | 是否把「禁止追高开 >5%」写成 §七 硬性红线 | ★ 支持，这是唯一纯否决型、零选股要求的规则 |\n| 2 | 「赌涨停」是否在系统里明确声明为**不做**（而非「暂不做」） | ★ 支持声明不做——盈亏平衡命中率 10.04% 卡在零上，没有安全边际 |\n| 3 | 是否把本节「盈亏平衡命中率」作为**任何新战法的准入校验**（未达平衡线一律不写进规则） | ★ 支持，这条比任何具体战法都值钱 |\n\n---\n\n_2026-10-20 · 第 3 轮回测 · 脚本 `bt_yours.py` / `bt_yours2.py` · 数据 `data/panel_10y.parquet`（1,034.3 万行 / 5,576 只 / 2,429 日）_",

   "oneliner": "一句话结论：打板整体是负期望 −0.39%，十年 9 年亏。唯一能翻正的单一条件是「量比 <1」——缩量涨停的炸板率从 38% 降到 10.5%，期望从 −0.54% 变成 +2.33%。加上「开盘涨 3~9%」这道筛，十年 10/10 年为正，均值 +4.10%、胜率 81.9%。",
   "source": "07-复盘笔记/短线/短线系统/短线回测_04_打板操作手册.md",
   "body": "# 短线回测 04 · 打板操作手册（含对第 2 轮的重大更正）\n\n> **一句话结论**：**打板整体是负期望 −0.39%，十年 9 年亏。唯一能翻正的单一条件是「量比 <1」——缩量涨停的炸板率从 38% 降到 10.5%，期望从 −0.54% 变成 +2.33%。加上「开盘涨 3~9%」这道筛，十年 10/10 年为正，均值 +4.10%、胜率 81.9%。**\n\n> 🔴 **本报告更正第 2 轮的结论**：短线回测_02_战法胜率 里「打板 +1.647%/56.6%」是**幸存者偏差**——那个样本只取了「T 日收盘涨停」的票，等于「我知道它封住才买」。真实打板是在封板瞬间下单，**当时并不知道会不会炸**。把炸板样本算进来后，期望是 **−0.39%**。\n\n---\n\n## 一、先更正：打板的真实全貌\n\n**打板 = 以涨停价买入。买入那一刻，只有两种结局：**\n\n| 结局 | 占比 | 当天收盘相对涨停价 | T+1 开盘卖 | 胜率 |\n|---|---:|---:|---:|---:|\n| **封住** | 64.4% | +0.31% | **+2.26%** | 69.4% |\n| **炸板** | 35.6% | −3.99% | **−5.18%** | 5.5% |\n| **加权（真实期望）** | 100% | −1.22% | **−0.39%** | 46.6% |\n\n**样本 161,516 笔（十年，开盘即封的一字板已剔除）。**\n\n分年看更清楚：\n\n| 年 | n | 炸板率 | 期望 |\n|---|---:|---:|---:|\n| 2017 | 5,571 | 39.2% | −0.693% |\n| 2018 | 11,034 | 40.1% | −1.035% |\n| 2019 | 14,327 | 37.0% | −0.615% |\n| 2020 | 16,913 | 33.6% | −0.144% |\n| 2021 | 17,519 | 31.8% | −0.275% |\n| 2022 | 18,289 | 34.7% | −0.682% |\n| 2023 | 12,311 | 36.3% | −0.393% |\n| 2024 | 25,677 | 39.2% | **+0.205%** |\n| 2025 | 21,673 | 35.5% | −0.578% |\n| 2026 | 18,202 | 31.6% | −0.388% |\n\n**9/10 年负，唯一正的那年只有 +0.205%。**\n\n> **所以「无脑打板」这件事，十年下来是亏的。** 之前那个 +1.647% 看着诱人，是因为它偷偷排除了所有炸板的票。\n\n---\n\n## 二、翻正的那个条件：量比 <1\n\n把打板样本按「当日成交量 / 前 5 日均量」分组：\n\n| 量比 | n | 炸板率 | 封住时赚 | 炸板时亏 | **真实期望** | 胜率 |\n|---|---:|---:|---:|---:|---:|---:|\n| **<0.5** | 695 | **0.4%** | +5.63% | — | **+5.626%** | 89.4% |\n| **0.5~0.7** | 1,037 | 1.4% | +4.79% | — | **+4.791%** | 86.6% |\n| **0.7~0.9** | 1,431 | 6.4% | +3.57% | — | **+3.565%** | 79.6% |\n| 0.9~1.2 | 2,817 | 16.0% | +2.22% | — | +2.220% | 67.6% |\n| 1.2~2 | 8,197 | 32.9% | +0.05% | — | +0.045% | 51.3% |\n| **≥2** | 17,802 | **42.7%** | −1.23% | — | **−1.228%** | 39.2% |\n\n**完全单调，没有一个例外。** 量比越小 → 炸板率越低 → 期望越高。\n\n**为什么**：缩量涨停意味着**没人卖**。封板只需要很少的买盘就能压住，自然不容易炸。放量涨停意味着**大量换手**，筹码在松动，一封就有人砸。\n\n> 这条规律解释了「一字板最强」——一字板就是极致缩量。但一字板你买不到，所以退一步找「缩量但开盘没封」的票。\n\n**这不是连板造成的偏差**：缩量组与非缩量组的「昨日涨停占比」是 13.5% vs 14.5%，「平均开盘涨幅」1.77% vs 1.36%，几乎一样。\n\n---\n\n## 三、连板越高越不能打（这条也反直觉）\n\n| 昨日状态 | n | 炸板率 | 封住时赚 | 炸板时亏 | 真实期望 |\n|---|---:|---:|---:|---:|---:|\n| **昨日未涨停（平地起板）** | 138,196 | 35.5% | +2.18% | **−4.65%** | **−0.242%** |\n| 昨日首板（今日冲 2 板） | 16,497 | 37.2% | +2.65% | −7.52% | −1.134% |\n| 昨日 2 板 | 4,124 | 36.4% | +2.72% | −9.68% | **−1.799%** |\n| 昨日 3 板 | 1,504 | 31.1% | +3.00% | **−11.04%** | −1.372% |\n| 昨日 4~5 板 | 913 | 30.7% | +2.68% | −10.96% | −1.501% |\n| 昨日 6 板以上 | 282 | 21.3% | +2.89% | −10.01% | +0.145% |\n\n**连板股炸板的代价是平地起板的两倍多**（−10% vs −4.65%），而封住时只多赚 0.5pp。**用翻倍的亏损去换 0.5 个点的收益，不值。**\n\n**但有一个例外**：缩量连板。缩量 + 昨连板 2 板以上，炸板率只有 **0.8%**，期望 +5.903%、胜率 88.4%（n=753）。这实际上就是「接近一字板但开盘没封死」的那批。\n\n---\n\n## 四、完整筛选：缩量 + 开盘涨 3~9%\n\n**两个条件叠加，十年 4,019 笔：**\n\n| 卖点 | n | 均值 | 中位 | 胜率 |\n|---|---:|---:|---:|---:|\n| **T+1 开盘卖** | 4,019 | **+4.103%** | +4.071% | **81.9%** |\n| T+1 收盘卖 | 4,019 | +2.601% | +2.889% | 65.5% |\n\n### 分年（这是第一次出现 10/10 全正）\n\n| 年 | n | 炸板率 | 期望 | 胜率 |\n|---|---:|---:|---:|---:|\n| 2017 | 63 | 3.2% | +4.713% | 93.7% |\n| 2018 | 181 | 2.8% | **+5.294%** | 89.5% |\n| 2019 | 317 | 1.9% | +5.125% | 88.3% |\n| 2020 | 510 | 5.5% | +5.046% | 88.0% |\n| 2021 | 446 | 3.6% | +4.105% | 85.9% |\n| 2022 | 373 | 1.3% | +4.470% | 85.5% |\n| 2023 | 208 | 6.3% | +4.087% | 79.8% |\n| 2024 | 643 | 12.1% | +4.003% | 77.4% |\n| 2025 | 548 | 4.6% | +3.632% | 79.0% |\n| 2026 | 730 | 4.2% | **+2.912%** | 74.2% |\n\n**⚠️ 但要看到衰减**：均值从 +5.29% 降到 +2.91%，胜率从 93.7% 降到 74.2%，炸板率从 1.3% 升到 12.1%。**这套东西在变差。** 可能是参与者变多（策略拥挤），也可能是我的样本后期更全。\n\n---\n\n## 五、卖出：T+1 开盘，9:25 集合竞价\n\n| 卖点 | 均值 | 中位 | 胜率 |\n|---|---:|---:|---:|\n| **T+1 开盘卖** | **+2.146%** | +1.471% | **69.2%** |\n| T+1 收盘卖 | +1.823% | +1.129% | 57.6% |\n| T+2 收盘卖 | +1.876% | +0.425% | 52.3% |\n| T+3 收盘卖 | +1.617% | −0.001% | 49.8% |\n| T+1 最高（不可达） | +6.443% | — | 90.5% |\n\n（上表为全部打板样本，含炸板。）\n\n**关键拆解**：\n\n| | 数值 |\n|---|---:|\n| 次日跳空（涨停价 → 次日开盘） | **+2.146%** |\n| 次日日内（次日开盘 → 次日收盘） | **−0.283%**（胜率 43.7%） |\n\n**钱全在开盘那一刻，之后是净流出。** 所以卖出时点不是「盘中找高点」，是**开盘就走**。\n\n**要不要看「次日一字涨停就继续持」？** 数据说不用：次日一字涨停占 6.0%，持到 T+2 收益 11.386% vs 开盘卖 11.05%，**只多 0.34pp**，却要承担继续持有的风险。不值得加这条规则。\n\n**具体操作**：T+1 9:25 集合竞价，用跌停价挂卖单，保证成交。\n\n---\n\n## 六、买不进怎么办：不办\n\n| 类型 | n | T+1 开盘卖 | 胜率 |\n|---|---:|---:|---:|\n| 一字板（开盘即封，买不到） | 19,720 | +1.91% | 60.3% |\n| 非一字（能打） | 162,498 | **−0.47%** | 46.4% |\n\n**买不到的那批反而更好（+1.91% vs −0.47%）。这就是逆向选择：能让你买到的板，都是不够强的板。**\n\n**买不到占比 10.8%。但机会一点不缺：2,369 个交易日里有 162,615 个可打样本，平均每天 68.6 个。**\n\n### 三条替代路径的对照\n\n| 做法 | 可执行 | n | 期望 | 胜率 |\n|---|---|---|---:|---:|\n| 涨停价买（打板，含炸板） | ✅ | 161,516 | **−0.39%** | 46.6% |\n| 当日均价买（没抢到，盘中追） | ❌ 收盘才知道均价 | 106,859 | +1.945% | 62.8% |\n| **次日开盘买（接力）** | ✅ | 161,464 | +0.070% | 45.5% |\n| **买不进就空仓** | ✅ | — | **0** | — |\n\n**结论**：\n- **硬追（次日买）= +0.07%，等于白干**\n- **空仓 = 0，比打板（−0.39%）还好一点**\n- **每天 68.6 个机会，买不进这一个不是损失**\n\n> **所以「买不进怎么办」的正确答案是：不办，等下一个。** 追进去才是把 0 变成负数。\n\n---\n\n## 七、具体怎么做（可执行版）\n\n### 盘前（9:00-9:25）\n\n1. **不选股、不预测。** 打板不是「猜谁会封」，是「谁封了、且封得干净，才买」。\n2. 只看两样：\n   - 昨日涨停名单（用来**排除**连板，或识别「缩量连板」）\n   - 自选池不需要\n\n### 盘中（9:30-14:57）\n\n**筛三步，缺一不可：**\n\n| 步 | 条件 | 怎么看 |\n|---|---|---|\n| 1 | 涨幅 **7% 以上** | 涨幅榜 |\n| 2 | **量比 < 1**（软件实时量比） | 分时图右侧「量比」字段 |\n| 3 | 开盘涨幅 **3~9%**（相对昨收） | 昨日收盘价 ×1.03 ~ ×1.09 |\n\n**优先级**：\n- ① 缩量 + 平地起板（昨日未涨停）→ 期望 +2.33%\n- ② 缩量 + 昨日已涨停（连板股）→ 期望 +4.64%~+5.90%（但样本少）\n\n**下单**：等它**真的封在涨停价**，在涨停价挂买单排队。\n\n**盘口要看的两样**（日K测不出，只能靠眼睛）：\n- **封单量 / 流通盘**：越大越难炸\n- **封板后有没有大单砸出来**：有就先撤\n\n**绝对不做**：\n- 不追高开 >9%（期望 −0.81%）\n- 不打放量板（量比 ≥2，期望 −1.23%）\n- 不打连板（除非缩量）\n\n### 次日（T+1 9:25）\n\n**集合竞价挂跌停价卖出，一次清光。** 不看盘、不等高点、不因为「感觉还能涨」而持有。\n\n---\n\n## 七点五、自动化定在几点（2026-10-21 补）\n\n> 已落地：5 个定时任务 + 4 个脚本。维护方式见 短线自动化。\n\n### A. 能定死的只有卖出，选股定不了单一时点\n\n| 时点 | 动作 | 依据 |\n|---|---|---|\n| **09:18** | 推「今天要卖的票 + 各自跌停价」 | 9:15 起可挂单，9:25 撮合 |\n| **09:25** | 集合竞价撮合，卖单在此成交 | §五 |\n| **09:35** | 首轮选股扫描 | 9:31-9:34 只有 1~4 分钟数据，量比噪音极大 |\n| 10:15 / 11:00 / 13:30 / 14:15 | 复扫（共 5 轮） | 见 B |\n| 14:30 | 停止接新单 | 见 D |\n| 15:05 | 收盘归档、算次日基准 | — |\n\n**选股定不了单一时点，因为买点是「封板瞬间」，不是一个钟点。** 定 10:00 扫一次，10:05 封板的票就漏了。\n\n### B. 不用盯盘：一天只有 2.6 只\n\n| 筛法 | n（十年） | 每天只数 | T+1 开盘卖 | 胜率 | 中位 |\n|---|---:|---:|---:|---:|---:|\n| 缩量 + 开盘涨 3~9% | 3,805 | **2.64** | +4.10% | 81.9% | +4.07% |\n| 再加「收盘不高于均价 1%」+「最低点距涨停 <4%」 | 715 | **0.31（三天一只）** | **+5.03%** | **86.2%** | +5.37% |\n\n> 口径注：本轮 n=3,805，与 §四 的 4,019 差 5%，来自一字板剔除与涨跌幅分段细节，不影响排序。\n\n**一天 2.6 只，所以 5 轮扫描足够，不需要每 5 分钟跑一次。**\n\n### C. 最大的坑：盘中量比 ≠ 全天量比，阈值不能直接用 1\n\n同花顺量比 = 当日每分钟均量 ÷ 前 5 日每分钟均量。盘中分子用的是**已过去那几分钟**，不是全天。\n\n茅台 5 个交易日实测（10/14–10/20，仅作量级参考）：\n\n| 扫描时点 | 累计成交量占全天 | 该时点正常量比 | 折算成全天量比 |\n|---|---:|---:|---:|\n| 09:45 | 14%~19% | **≈2.5** | 盘中值 × 0.40 |\n| 10:00 | 23%~37%（中位 27%） | **≈2.1** | 盘中值 × 0.46 |\n| 11:30 | ≈50% | **≈1.0** | 盘中值 × 1.0 |\n\n**所以：**\n- 09:35–10:30 直接筛「量比 <1」，等于要求**全天量比 <0.46**，比回测口径严一倍，会把目标池砍掉大半\n- 想复现「全天量比 <1」，10:00 时要放宽到 **量比 <2.1**\n- 11:30 时点口径最接近，但那时该封的已经封了\n\n**正解不是调阈值，是换指标**：用「**时段量比**」= 到 t 时刻累计成交量 ÷ 前 5 日同一时段累计成交量均值。它和全天量比同量纲，不需要假设日内分布形状。\n\n**代价**：市场软件没这个字段，必须自己算 —— 前提是每天收盘存下全市场分时（1 分钟够）。这是这套自动化的**前置工程**，到现在还没建。\n\n### D. 14:30 后不接新单\n\n| 证据 | 数值 |\n|---|---|\n| 收盘价比当日均价高 >7%（尾盘急拉） | 胜率 **60.7%**，全场最低（n=2,674） |\n| 最低点距涨停 >9%（盘中砸过深坑） | T+1 开盘卖仅 **+1.83%**（vs 早封 +4.96%） |\n| 早封（最低点距涨停 <2%）占比 | 仅 **0.7%** |\n\n**这条是「间接数据 + 逻辑」，不是直接实测。** 日K 测不出封板时刻，只能测「下探深度」和「收盘离均价多远」。逻辑依据：隔夜溢价靠封板后资金认可累积，尾盘才封的积累时间短，次日 9:25 就要卖，没有缓冲。\n\n---\n\n## 八、限界（比结论更重要）\n\n| # | 限界 | 影响 |\n|---|---|---|\n| 1 | **「量比」在日K里是全天值，盘中只能看实时量比** | 换算已量化（§七点五 C）：10:00 盘中量比 ≈ 2.1 才是「正常」，直接筛 <1 等于全天 <0.46。**但正解「时段量比」需要每天存全市场分时，这个库还没建** |\n| 2 | **打板成交概率无法建模** | 封板后排队成功率未知；「缩量板」恰恰封单厚、更难成交——**策略越好，越买不进**（这是结构性的） |\n| 3 | 数据库不含退市股 | 系统性高估 |\n| 4 | 未扣成本 | 双边约 0.15%，缩量组 +4.10% 扣完约 +3.95% |\n| 5 | 未区分 ST / 新股（仅按上市 60 日过滤） | 少量异常样本 |\n| 6 | 涨跌幅限制按板块+日期分段，但 2023 年主板新股前 5 日无限制未处理 | 少量涨停判定偏差 |\n| 7 | **策略在衰减** | 从 +5.29%（2018）降到 +2.91%（2026），炸板率从 1.3% 升到 12.1% |\n| 8 | **样本 4,019 笔 / 10 年 = 每年约 400 次**，扣掉买不进的折扣后更少 | 不足以构成高频策略，只能做偶尔的机会 |\n\n---\n\n## 九、待裁决\n\n| # | 议题 | 倾向 |\n|---|---|---|\n| 1 | 「禁止追高开 >5%」「禁止打放量板（量比≥2）」写进 §七 红线 | ★ 支持，两条都是纯否决 |\n| 2 | 「打板只用缩量」写进第④层结构条件 | ★ 支持，这是唯一 10/10 年成立的条件 |\n| 3 | 卖出规则定死「T+1 集合竞价卖」 | ★ 支持，简单且最优 |\n| 4 | 「买不进就空仓」写成明文纪律 | ★ 支持，防的就是「追一下」 |\n| 5 | 是否把「缩量打板」列为**唯一允许的短线开仓方式** | 需讨论——它要求盘中盯盘 + 盘口判断，与现有 ETF 自动化的形态完全不同 |\n| 6 | 要不要建「分时基线库」（每日存全市场 1 分钟数据，用于算时段量比） | ★ 支持 —— 不建这条，§七点五 C 的换算只能靠茅台 5 天硬估，实盘仍缺一块 |\n| 7 | 自动化定时任务：09:18 卖出提醒 + 09:35/10:15/11:00/13:30/14:15 五轮扫描 + 15:05 归档 | 需你确认时段与轮次 |\n\n---\n\n_2026-10-20 · 第 4 轮回测 · 脚本 `bt_howto.py` / `bt_howto2.py` / `bt_howto3.py` · 数据 1,034.3 万行 / 5,576 只 / 2,369 日_\n_2026-10-21 补 §七点五「自动化定在几点」· 脚本 `bt_when.py` · 封住样本 100,200 笔 / 目标池 3,805 笔 / 1,439 交易日_",

   "body": "# 短线交易系统 · 版本记录\n\n> 规则改动的唯一账本。**只记「改了什么、为什么改」，不重复规则内容。**\n\n## v0.1 —— 2026-10-20（建系统）\n\n**状态**：草案，未实盘验证。\n\n### 建了什么\n\n- 短线域从 ETF 域**独立出来**，成为平级体系\n- 目录：`短线/短线系统/`（AI 读版）+ `短线/短线手册-人读/`（人读版）+ `每日复盘/` + `交易记录/`\n- 五层决策链：① 环境 → ② 选股 → ③ 位置 → ④ 结构 → ⑤ 执行\n- 三份配套：短线交易系统速查卡 · 短线书籍导读 · 本文\n\n### 为什么独立（不含糊地写下来）\n\n原来的短线内容是 `ETF/交易手册-人读/03-短线超短.md`。那份明确写着「ETF 做不了真短线：没有涨跌停、T+1、没有龙头」。**这不是短线的限制，是 ETF 的限制。**\n\n拆完缠论、香象渡河、利弗莫尔之后，发现这些书全是**个股短线**的货，ETF 一个字都用不上。继续挂在 ETF 下面，只会让两边互相污染：\n\n- ETF 侧被迫吸收「中枢」「打板」「先手」——用不上\n- 短线侧被迫遵守「-5% 硬止损」「越跌越买的 A 线」——是错的\n\n所以拆成两个域。\n\n### 关键裁决（本版最重要的三条）\n\n| # | 争点 | 裁决 | 依据 |\n|---|---|---|---|\n| 1 | 买点用「三买」还是「关键点」 | **主用关键点**，三买做否决 | 关键点可机械执行；三买需画图 |\n| 2 | 「永不止损」还是「硬止损」 | **硬止损保留**，永不止损思想移植制度不移植 | 硬止损不依赖判断力 |\n| 3 | 龙头能做吗（45% 胜率） | **能做，但靠盈亏比与频率控制，不靠胜率** | 跟随者策略 |\n\n### 承认的缺陷（6 项，见正文 §十）\n\n环境阈值无据、空间高度无统计、买点取舍未验证、止损距离未统计、无回测、无自动化。\n\n**在上表完成前，本系统只能用于模拟盘或 ≤300 元的极小仓位。**\n\n### 未做的事\n\n- 没有建立自动化（ETF 域的三时段推送**未复制过来**）\n- 没有建立 短线判断台账 的初始记录（新建了模板，空表）\n- 没有回测任何一条规则\n\n### v0.1 补丁（同日，登记阶段发现并修掉）\n\n| # | 问题 | 处理 |\n|---|---|---|\n| 1 | `判断台账.md` / `_版本记录.md` 与 ETF 域**同名**，Obsidian 双链会串域（= 变相污染） | 改名为 短线判断台账 / 短线版本记录，人读版 `短线-05` 里的路径同步；`domains/shortline.json` 的 `ledger` 字段改正，并加 `naming_rule` 写死前缀规矩 |\n| 2 | 正文没有指向自己的台账、版本记录、速查卡 | 新增 附录 C「本域载体清单」6 行 |\n| 3 | ETF 侧 03-短线超短 声称书单已迁走但正文还在 | §七 正文删除，改为指针 stub；尾部「真源尚无短线章节」的错误说明改正 |\n\n---\n\n## v0.1.1 —— 2026-10-20（第 1 轮回测，规则未改）\n\n**只加内容，不改规则。** 触发：用户问「短线是做个股的，可以回测吗」。\n\n| 项 | 内容 |\n|---|---|\n| 做了什么 | 打通个股回测通路：同花顺本地 DuckDB → `market panel` 导出**十年全市场前复权日K**（1,034.3 万行 / 5,576 只 / 2,429 交易日 / 439MB / 8 秒） |\n| 建了什么 | 每日情绪面板 `daily_env.csv`（涨停家数·跌停家数·炸板家数·最大连板·≥2/3/4 板家数·炸板率） |\n| 跑了什么 | 第①层环境三档 + 「涨停次日开盘买、收盘卖」单一动作，样本 99,115 笔 |\n| **关键结论 1** | **§3.1 环境三档对「接力」方向是反的**：A −0.101%/日、C +0.229%/日，A−C = −0.331pp、**t = −2.92**，**8/11 年成立** |\n| **关键结论 2** | **次日高开幅度是更强变量，且 11/11 年稳定**：高开>7% 均值 −1.128%/胜率 33.4%；开≤3% 均值 +0.394%/胜率 48.6% |\n| **关键结论 3** | **无脑接力 = 零期望**（+0.049%，胜率 46.7%），扣成本后为负。复现了 跟随者策略 的「45% 胜率」经验值。→ 立为**基线** |\n| 新增文件 | 短线回测_01_环境三档（回测报告）· 涨停次日高开幅度（方法卡，唯一非书本来源） |\n| 改了哪里 | §3.1a/3.1b/3.1c（只加回测结论，**原三档条文一字未动**）· §十 加「第 0 条 待拍板」+ 更新 1/5 项状态 · 附录A 24→25 张 · 附录C 加回测报告行 |\n| 未做 | 不改规则（第 0 条三条候选改法待拍板）· 未测位置/止损/选股 · 未扣滑点成本 |\n\n**新发现的限界**：数据库**不含退市股**（实测 4 只已退市股票全部 0 行），接力类策略回测会**系统性高估**收益。这条比统计细节更要紧，已写进报告的限界表第 1 行。\n\n---\n\n## v0.2 —— 2026-10-20（第 2 轮回测：七种战法胜率 + 口径纠错）\n\n**触发**：用户「用数据回测一下胜率」。目标是把四本书里的战法逐个量化。\n\n### 🔴 先认错：v0.1.1 的口径违规\n\nv0.1.1 用「T+1 开盘买 → **T+1 收盘**卖」算收益。**A 股 T+1，当天买入当天不能卖**，这个动作做不出来。\n\n**后果**：\n- 「无脑接力 +0.049%/46.7%」→ 合规口径为 **−0.198%/44.3%**\n- 「高开>7% 十年每年都负」→ **方向反了**，合规口径为 +0.206%/51.5%\n- 环境三档「A 最差」方向仍成立，但 t 从 −2.92 降到 **−1.24**\n\n### 跑了什么\n\n统一两个口径，全部合规：\n\n| 口径 | 买入 | 卖出 | 谁在做 |\n|---|---|---|---|\n| **打板** | T 日封涨停价 | T+1 开盘/收盘 | 能抢封板的人 |\n| **接力** | T+1 开盘 | T+2 收盘 | **散户唯一能做的** |\n\n覆盖：涨停事件 121,324 笔（板型/位置/龙头）· 突破事件 481,755 笔（整数关口含对照组）· 高开分桶 109,324 笔 · 环境分档 109,324 笔。\n\n### 四个核心结论\n\n| # | 结论 | 关键数字 |\n|---|---|---|\n| 1 | **钱全在隔夜跳空里** | 打板 **+1.647%/56.6%**（已剔买不到的一字板）vs 接力 −0.198%/44.3%，**差 1.845pp** |\n| 2 | **接力是负期望，持越久越亏** | 1日 −0.198% / 2日 −0.393% / 4日 −0.651%，无拐点 |\n| 3 | **整数关口没有额外效应** | 6 个价格带，A 占优 **0/6**；扣费后 −0.05% |\n| 4 | **危险信号离场有效** | 守住 +2.884% / 失守 −2.858%（不回升），规则改善 **+0.312pp** |\n\n### 改了哪里\n\n| 文件 | 改法 |\n|---|---|\n| §3.1a | 数字换成合规口径；补「三档全负，救不回来」 |\n| §3.1b | 高开条从「替代判据」降级为「已失效」 |\n| §3.1c | 基线从 +0.049%/46.7% → **−0.198%/44.3%** |\n| §6.1 | 新增：关键点被**劈成两半**——「整数」无效、「立即走强」有效 |\n| §6.2 | 新增回测证据表（唯一被正面证实的规则） |\n| §十 第 0 条 | 三条候选 → **4 案**（加打板/接力/第5板三案） |\n| §十 清单 | 6 项 → **7 项**；补第 7 项「打板成交概率无法建模」 |\n| 附录 C | 回测报告改为两份，注明「数字以 02 为准」 |\n| 短线交易系统速查卡 | 第④层判据改为「突破后有没有立刻走强」；新增 §八 四条硬结论 |\n| 涨停次日高开幅度 | **整卡重写**，状态改「已复核-不可作规则」 |\n| 短线回测_01_环境三档 | 顶部加红色「口径违规，数字作废」块，方法论保留 |\n| 短线-00-先看这里 | §五 整节重写，含向读者承认上一版结论错了 |\n\n### 新增\n\n短线回测_02_战法胜率（报告，11 节，含 7 条限界 + 4 案待拍板）· 脚本 6 个（`bt_plays/bt_break/bt_break2/bt_break3/bt_gap/bt_env2.py`）· 中间数据 `bt_limit.parquet`（12 万笔）+ `bt_break.parquet`（48 万笔）\n\n### 仍未做\n\n不改规则（4 案待拍板）· 三买未测 · 止损距离未统计 · 空间高度未统计 · 打板成交概率无解\n\n---\n\n_后续版本按 `## vX.Y —— YYYY-MM-DD` 追加。改动规则必须先改 短线交易系统，再回来记一行。_",

   "source": "07-复盘笔记/短线/短线系统/短线自动化.md",
   "body": "# 短线自动化（已上线）\n\n> **一句话**：卖出能定时，选股定不了单一时点。所以拆成「1 个卖出提醒 + 3 个扫描点 + 1 个收盘归档 + 1 个本地钉盘」。\n\n## 一、五个定时任务\n\n| 任务 | 时间（交易日） | 做什么 | ID |\n|---|---|---|---|\n| 短线·卖出提醒 | **09:18** | 算持仓票的跌停价，9:20 前挂出去 | `4a495dc3` |\n| 短线·扫描 | **09:40** | 全市场快照 + 涨停池，筛符合条件的 | `8a6e8b97` |\n| 短线·扫描 | **10:50** | 同上 | `18bc1b0a` |\n| 短线·扫描 | **13:50** | 同上 | `5f2feb0c` |\n| 短线·收盘归档 | **15:05** | 存涨停池/天梯/炸板池 + 同步日K | `1457dc80` |\n\n全部推到飞书群 **「短线」**（`oc_505aa99d8c1f7f466d21a15cb2518d9e`），与 ETF 群互不干扰。\n\n## 二、为什么是这三个扫描点\n\n10/20 实测涨停池 50 只的首封时间分布：\n\n| 时段 | 只数 | 占比 |\n|---|---:|---:|\n| 09:25（一字板，买不到） | 5 | 10% |\n| 09:30–09:39 | **13** | **26%** |\n| 09:40–09:59 | 3 | 6% |\n| 10:00–10:59 | 14 | 28% |\n| 11:00–11:29 | 4 | 8% |\n| 13:00–13:49 | 5 | 10% |\n| 14:00–14:20 | 3 | 6% |\n\n**76% 在 11:00 前封板。** 所以 09:40 这一轮最要紧（吃掉最大的一波），10:50 补上午后半段，13:50 收下午。\n\n⚠️ **RRULE 限制**：一个定时任务只能有一个 `BYHOUR`，没法写成「9/10/13/14 点的 35 分」。所以只能拆成三个任务。\n\n## 三、四个脚本\n\n位置 `F:\\Ai\\workbuddy\\2026-10-20-21-21-44\\scripts\\`\n\n| 脚本 | 作用 |\n|---|---|\n| `shortline_scan.py` | 盘中扫描：全市场快照（5,568 只 / 12 批 / 22 秒）+ 涨停池 → 筛条件 |\n| `shortline_sell.py` | 卖出提醒：读持仓 → 算跌停价 |\n| `shortline_watch.py` | **本地钉盘**：20 秒一轮查涨停池，命中响铃（见 §五） |\n| `push.py` | 跑上面任一脚本 + 推到飞书。定时任务只调它 |\n\n## 四、筛选条件（来自回测）\n\n```\n涨幅 ≥7%  +  开盘涨 3~9%  +  预估全天量比 <1  +  首板  +  非 ST  +  非北交所\n```\n\n输出分三块：表格全量 → **已封板 + 全条件**（可打）→ **盯着但还没封**（不许提前买）。\n\n### 预估全天量比怎么算\n\n```\n推进率 = 当日累计成交量 ÷ 前 5 日日均量\n预估全天量比 = 推进率 ÷ 曲线占比(当前时刻)\n```\n\n曲线占比在 `shortline_scan.py` 的 `SHARE` 常量里，来源是茅台 5 个交易日分时实测（取中位数偏上，宁可放宽不筛空）。\n\n**⚠️ 这是全套里最粗的一环**：样本只有 1 只票，且日内分布逐日波动极大（10:00 占比实测 23%~37%）。实盘跑两周后要用真实数据回校。\n\n### 在别处复现这套条件\n\n要拿到同花顺 / 问财里用，看 短线选股条件_问财版。里面有按时点换算好的量比阈值、逐项说法对照、以及把结果导回同花顺自选股的命令。\n\n## 五、本地钉盘：为什么还要它\n\n定时任务最快也隔一小时，打板等不起。`shortline_watch.py` 是**本地常驻**的：\n\n```bash\npython F:\\Ai\\workbuddy\\2026-10-20-21-21-44\\scripts\\shortline_watch.py\n```\n\n- 每 20 秒查一次涨停池（1 秒开销）\n- 发现**新封板**的票才去核对条件\n- 全部通过 → 响三声 + 打印代码、首封时间、封单额、涨停原因\n\n交易时段打开它，收盘关掉。这是唯一能做到\"封板后 20 秒内知道\"的形态。\n\n## 六、限界（比功能重要）\n\n| # | 限界 | 影响 |\n|---|---|---|\n| 1 | **定时任务延迟 1 小时级** | 只适合\"知道今天有什么\"，抢板必须用 `shortline_watch.py` |\n| 2 | **曲线占比未校准** | 样本 1 只票 5 天；量比判定可能有 ±30% 误差 |\n| 3 | **面板滞后** | 收盘归档 15:05 才同步日K；若哪天没跑，次日量比基准会缺一天 |\n| 4 | **名称缺失** | 非涨停池的票只有代码没名称（`dim_symbol` 的 name 字段是空的） |\n| 5 | **持仓要手工维护** | `data/shortline_holdings.json`，不自动读券商 |\n| 6 | **买不进照旧** | 缩量板封单厚，越符合条件越难成交，这是结构性的 |\n\n## 七、怎么改\n\n- **加/减扫描时点**：新建或删除定时任务，`BYHOUR` 一个任务只能一个值\n- **改量比阈值**：`shortline_scan.py` 里 `vr < 1` 两处（`ok` 和 `watch` 的过滤）\n- **改曲线**：`SHARE` 常量\n- **持仓**：`data/shortline_holdings.json`\n  ```json\n  [{\"code\":\"002479.SZ\",\"name\":\"富春环保\",\"buy_price\":5.51,\"buy_date\":\"2026-10-20\",\"shares\":100}]\n  ```\n- **停掉全部**：把 5 个定时任务设为 PAUSED\n\n## 八、数据依赖\n\n| 依赖 | 位置 | 更新方式 |\n|---|---|---|\n| 本地日K | `F:\\Ai\\workbuddy\\2026-09-02-15-22-29\\trading\\hithink_market.duckdb` | 每日 15:05 自动 `data sync` |\n| 十年面板 | `data\\panel_10y.parquet` | 同步后手工/脚本重导（8 秒） |\n| 全市场代码表 | `data\\codes_all.txt` | 新股上市后要补 |\n| 涨停池存档 | `data\\shortline_archive\\` | 每日 15:05 自动 |\n\n> **注意**：C 盘 `C:\\Users\\35313\\AppData\\Local\\hithink-finance\\data\\market.duckdb` 还有一个 760MB 的旧库（数据停在 2026-09-30）。CLI 默认读它，所以调 CLI 时必须带 `--db` 指向 F 盘那个。想省 C 盘空间可以删，但要确认 CLI 配置改过。\n\n## 九、软件版（2026-10-21 上线）\n\n上面这套是「脚本 + 定时任务」，只能在这台机器上跑。另外做了一个**带界面的软件版**，已经公开：\n\n> **https://github.com/123yyy123-sky/shortline-radar**\n\n| 项目 | 说明 |\n|---|---|\n| 形态 | 本地网页版。双击 `run.bat` 起服务，浏览器打开 `127.0.0.1:8848` |\n| 代码位置 | `F:\\Ai\\workbuddy\\2026-10-20-21-21-44\\shortline-radar\\`（独立 git 仓库） |\n| 依赖 | 零第三方库（标准库 `http.server`）。只有重建基准数据要 `duckdb` |\n| 三层结构 | `rules.py` 管规则 / `datasource.py` 管数据源 / `web/` 管界面，互不影响 |\n\n**跟脚本版的三个实质差别**：\n\n1. **不再需要 439MB 行情库** —— 扫描只要「前 5 日均量」一个数，把它压成 163KB 的 `benchmark.json` 就够。这是能开源的前提。\n2. **能看到为什么被剔除** —— 每个票写明差在哪一步，脚本版是直接 `continue` 掉的。\n3. **未封板的票也有名字** —— 用 `symbol list` 拉了 5,579 只名称，解决了原来「非涨停池的票显示代码」的问题。\n\n**顺带修正的一个口径错误**：原 `shortline_scan.py` 的「前 5 日均量」取的是 T-2~T-6，而回测口径是 T-1~T-5，**差了一天**。软件版已按回测口径改正。\n\n**推送方式的坑（以后改版会再遇到）**：这台机器到 `github.com` 的 HTTPS 完全被阻断（直连超时、代理 502），但 `api.github.com` 通。所以不能用 `git push`，只能走 REST API 逐个 blob 上传（脚本 `_publish.py`，在 workspace 根目录）。另外空仓库不能直接用 Git Data API（409），要先提交一个文件把 `main` 立起来。\n\n**已知会撞上的问题**：实测 09:57 全市场 5,574 只里「涨幅≥7% + 开盘3~9% + 量比<1」通过 **0 只**。早盘是全天最活跃的时段，量比普遍 1.3~1.6，而「缩量」是事后特征。**这条策略的真实执行窗口在午盘之后，不在开盘。**\n\n---\n\n## 十、桌面快捷方式（2026-10-21，v1.0.4 改为无窗口）\n\n桌面上有**两个**图标：\n\n| 图标 | 动作 |\n|---|---|\n| **短线雷达** | 双击启动，浏览器自动打开，**不弹黑窗口** |\n| **停止短线雷达** | 双击把后台服务关掉 |\n\n| 项 | 值 |\n|---|---|\n| 位置 | `C:\\Users\\35313\\OneDrive\\Desktop\\短线雷达.lnk` |\n| 目标 | `Python311\\pythonw.exe`，参数 `app.py` |\n| 工作目录 | `F:\\Ai\\workbuddy\\2026-10-20-21-21-44\\shortline-radar` |\n| 图标 | `assets\\icon.ico`（十档尺寸，16~256） |\n\n**重建方式**（换机器、改名、图标丢了都这样重来）：\n\n```\npython tools/install_shortcut.py --force --pythonw \"C:\\Users\\35313\\AppData\\Local\\Programs\\Python\\Python311\\pythonw.exe\"\npython tools/install_shortcut.py --console          # 想保留黑窗口看日志\n```\n\n`--pythonw` 指到哪个解释器就用哪个，不写就依次找环境变量 `SHORTLINE_PYTHONW`、当前解释器同级、PATH。这台机器必须显式指 Python311 —— 因为 agent 环境的 PATH 里排前面的是 3.13，用户双击时走的是 3.11，两边不一致会埋坑。\n\n**为什么不弹黑窗口**：有窗口时那个黑框就是服务本体，关掉窗口服务就停、不关就一直占着任务栏和内存。现在 `pythonw.exe` 启动，进程静默跑，日志写 `data/app.log`。\n\n**它什么时候停**（三种，任选）：\n\n| 方式 | 说明 |\n|---|---|\n| 关掉所有浏览器标签页 | 约 2 分钟后自己退出（`web.idle_exit_seconds`，默认 120） |\n| 双击「停止短线雷达」 | 立即关，走 `stop.bat` 按端口找进程 |\n| 想常驻 | `python app.py --idle-exit 0`，或者配置里改成 0 |\n\n心跳机制：前端每 5 秒打一次 `/api/ping`，切回标签页立刻补一次。后端 5 秒扫一遍，超过阈值且不在扫描中就 `srv.shutdown()`。\n\n**三个设计细节，别改动**：\n\n1. **桌面路径用 `SpecialFolders(\"Desktop\")` 取**，不是拼 `USERPROFILE\\Desktop`。这台机器的桌面被 OneDrive 重定向了，拼路径会写到空壳目录里。\n2. **`run.bat` 查 Python 用的是「跑一次版本检查」而不是 `where python`**。因为 Microsoft Store 会装一个假 `python.exe` 桩，`where` 能找到它，但双击只会弹商店。\n3. **建完立刻回读 `.lnk` 逐项校验**（目标、参数、工作目录、图标），任何一项不对就报错退出，不留半成品。\n\n**不再需要 pywin32**：v1.0.4 起改用 Windows 自带的脚本宿主建快捷方式，`tools/install_shortcut.py` 变成零依赖。原来两个 Python 环境都没装 pywin32，改成自带方案反而更省事。VBS 里 `Option Explicit` 必须在第一行，所以拼接常量时要插到 `Dim` 之后 —— 这个坑踩过一次。\n\n**无窗口的代价**：出错看不到。兜底是 `data/app.log`（`pythonw` 下 `sys.stdout` 是 `None`，`print` 会直接崩，所以启动时先把输出重定向进日志文件）。另外 `stop.bat` 里的 `timeout` 要用全路径 `%SystemRoot%\\System32\\timeout.exe` —— 否则 PATH 里 git 的 GNU `timeout` 会抢走，`/t` 参数不认。\n\n**图标重生成**：`python tools/make_icon.py`（要 Pillow）。画的是三根递增的红 K 线加一个琥珀色封板标记，纯代码绘制，无外部素材。\n\n---\n\n## 十一、双击后不能扫描（2026-10-21 实修）\n\n**现象**：双击图标，页面能开，点「开始扫描」报 `找不到 hithink-finance`。\n但同样一条命令在终端里手动跑却能出结果。\n\n**根因**：两条路径看到的 PATH 不是同一个。\n\n| 启动方式 | 拿到的 PATH |\n|---|---|\n| 终端手跑 | 当前会话 PATH，含 node 目录 |\n| 资源管理器双击 | 注册表里**持久化**的 PATH |\n\n这台机器的持久化 PATH 里既没有 node，也没有 hithink-finance。\nCLI 只装在 `C:\\Users\\35313\\.workbuddy\\binaries\\node\\versions\\22.22.2-6\\`，\n这个目录从来没进过 PATH。所以双击 → 找不到 CLI → 扫描直接失败。\n\n**修法：在 `vendor/` 放转发脚本**（软件查找顺序是 cli_path → vendor/ → PATH）。\n\n```\npython tools/make_vendor_shim.py\n```\n\n它自动探测 node 和 CLI 入口，试跑一次 `--version` 确认可用，再把两个绝对路径写进 `vendor/hithink-finance.cmd`。之后不管 PATH 里有什么都能跑。**node 升级换目录后重跑一次。**\n\n`vendor/` 已进 `.gitignore`，里面写死本机路径，绝不推到公开仓库。\n\n**自检工具**：扫描跑不起来先跑这个，它逐环报告。\n\n```\npython tools/doctor.py\n```\n\n正常输出：Python OK → config OK → CLI 路径 OK（来源写 vendor/ 转发脚本）→ CLI 回话 rc=0 → 基准 OK。`[WARN]`（PATH 里没有 node）可以不管，`[FAIL]` 才是问题。\n\n**同时改掉的一个坑**：端口 8848 上已有实例在跑时，旧版会打印「已经有服务在跑」然后退出，用户看到黑窗口一闪，以为软件坏了。现在改成**接管并打开浏览器** —— 双击图标就是「打开软件」，看到的永远是页面。\n\n**版本**：v1.0.3，commit `2254e53`（排障修复）；v1.0.4，commit `ec3cb3b`（无窗口 + 空闲自停）；v1.0.5，commit `3307d1b`（黑窗根因修复）https://github.com/123yyy123-sky/shortline-radar\n\n## 十二、无窗口启动后一直弹黑窗（2026-10-21，v1.0.5 修）\n\n**现象**：双击桌面图标，浏览器没起来，桌面上却不停冒出黑色小窗口，软件没法用。命令行里跑 `run.bat` 一切正常。\n\n**根因**：`pythonw.exe` 启动的进程**没有控制台**。这时每次调用一个控制台程序（行情工具 `hithink-finance` 是 `.cmd`，会再拉起 `cmd.exe` 和 `node.exe`），Windows 都会给它**新建一个控制台窗口**。前端每 30 秒轮询一次状态，每次轮询都调一次 `CLI --version`，于是黑窗反复弹。\n\n| 前提 | 结果 |\n|---|---|\n| 有控制台（终端里跑） | 子进程复用父进程的控制台，看不到任何窗口 |\n| 无控制台（pythonw） | 子进程各自新建控制台 → 黑窗 |\n\n这就是为什么终端里一切正常、双击后满地黑窗。\n\n**修法**：所有子进程调用加 `creationflags=CREATE_NO_WINDOW`（`0x08000000`），见 `shortline/datasource.py` 的 `SPAWN_KW`。\n\n**对照实测**（同一个探针脚本，父进程都用 pythonw）：\n\n| 条件 | 子进程拿到的控制台 |\n|---|---|\n| 不带标志 | `hwnd=332390 visible=True` → 弹窗 |\n| 带 `CREATE_NO_WINDOW` | `hwnd=0 visible=False` → 不弹 |\n\n**顺手改的两处**：\n\n1. `health()` 加 60 秒缓存 —— 状态轮询不再每次都起一个进程，既避免弹窗也省时间。\n2. 无窗口启动出错时弹系统对话框 —— 原来异常被静默吞掉，用户只看到「双击没反应」。\n\n**给以后的自己**：无窗口模式下**任何**子进程调用都要带这个标志，包括自己新写的脚本。`tools/stop.py` 里的 `netstat` / `taskkill` 同样处理了。\n\n**自检命令**：`python tools/selftest.py` —— 一条命令跑完 状态 → 触发扫描 → 轮询 → 打印漏斗。\n\n## 十三、问财对照工具（2026-10-21）\n\n问财筛不出票时，先跑这个，判断是「市场本来就没有」还是「口径不同」：\n\n```\npython tools/diag_wencai.py            # 用当前时间\npython tools/diag_wencai.py --at 10:00 # 指定时点回放\n```\n\n它打三张表：单条件命中数、累积漏斗、两种量比口径下的名单差异。\n\n**11:26 实测的读数方式**：`涨幅≥7%` 81 → 加竞价涨幅 3~9% 剩 18 → 加量比<1 剩 2。\n哪一行直接从几十跳成 0，就是那个词问财没认出来，不是市场没有。\n\n**别指望它和问财名单逐只相同**：每天只有 2~3 只（十年均值 2.64），基数这么小，错一只就是 50% 差异。\n要精确就对不齐——**用 `--codes` 导出代码贴进同花顺自选股**，那一步不重算，零误差。\n\n---\n\n_2026-10-21 建立 · 同日补排障节、无窗口改造、黑窗根因修复 · 规则一条未改，仍在验证期（≤300 元或模拟）_",
