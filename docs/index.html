   "source": "03-知识/方法/定投双核制.md",
   "body": "# 定投双核制\n\n> 一句话：**个人投资者最大的优势不是信息、不是技术，而是\"有场外现金流\"**——用工资/租金创造稳定现金流（防御核），把现金流定投到低估指数基金（进攻核）。基金经理做不到这一点：他们业绩回撤会被赎回，等于\"在低估时被迫卖出\"。\n\n## 具体怎么做（步骤化）\n\n**第 1 步：认清\"双核\"结构**\n- **防御核 = 场外现金流**：工资、租金、公司盈利 → 稳定、可预期、不受股市波动影响；\n- **进攻核 = 低估指数基金定投**：用防御核产生的现金流去买入低估资产，放大收益；\n- 两者缺一不可：只有进攻核 → 低估时没钱加仓；只有防御核 → 钱被通胀稀释。\n\n**第 2 步：把自己当成一只\"债券型资产\"来经营**\n- 认真工作 → 收入提升快（前几年翻番不难）→ 等于持有一只**现金流稳定、增长快、且不受股市影响**的债券；\n- 所以**手里没什么资产时，重心应放在工作上**，不是放在研究投资上。\n\n**第 3 步：用\"没有业绩压力\"这个优势反向操作**\n- 基金经理面对回撤 → 客户赎回 → **被迫在低估时卖出**；\n- 个人投资者 → 有稳定现金流 → **可以从容地在低估时加仓**；\n- 这是个人投资者**独有的结构性优势**，要用起来。\n\n**第 4 步：保护好防御核（常被忽略）**\n- 现金流稳定的前提是**身体健康**：作息规律、经常锻炼；\n- 巴菲特能成为投资大师，与他的长寿有很大关系 → **投资是长跑，身体是本金的一部分**。\n\n## 能举的例子\n- **例 1（基金经理的困境）**：基金业绩大幅回撤 → 被大幅赎回 → 被迫在最低点卖出；个人投资者同样时点 → 用工资继续定投加仓 → **同样的市场，结果相反**。\n- **例 2（自己就是债券）**：一个稳定工作的人 = 持有\"定期产生现金流、且现金流会增长\"的债券资产 → 这是最完美的防御资产。\n- **例 3（双核的最终形态）**：认真工作赚钱（防御）→ 定投低估指数基金（进攻）→ 实现财务自由\"只是时间问题\"。\n\n## 为什么重要 / 常在哪出现\n- 它给\"为什么要用闲钱投资、为什么要有稳定收入\"提供了**结构性理由**——不是道德劝诫，是策略优势；\n- 与 资产与现金流 呼应：**你自己也可以是一个资产**（能产生现金流）；\n- 与 余钱投资三原则 呼应：用闲钱、不用杠杆，正是因为要保住防御核不被破坏；\n- 与 定投计划落纸面 配套：双核制提供\"钱从哪来\"，计划表提供\"钱怎么投\"；\n- 对路线 A 的意义：**越跌越买的底气来自\"场外还有现金流\"**，而不是来自\"心态好\"。\n\n## 反例 / 注意\n- **别用杠杆或借贷去投资**：会破坏防御核的稳定性（一旦现金流断裂，双重打击）；\n- **别为投资荒废主业**：年轻阶段\"提高收入\"的边际收益远大于\"提高收益率\"；\n- **别忽略身体**：长期投资靠复利，复利靠时间，时间靠健康；\n- **别把双核理解成\"可以无脑加仓\"**：加仓仍需遵守估值纪律与该标的的规则。\n\n## 来源\n指数基金投资指南（第8章 定投的\"双核制\"）\n\n## 相关概念 / 方法\n资产与现金流 —— 能生钱的才是资产，你自己也是资产；余钱投资三原则 —— 闲钱原则保护防御核；定投计划落纸面 —— 现金流如何落成计划；三类定投计划模板 —— 不同人生阶段的计划形态；安全提款率 —— 从进攻核取钱的规则",

   "body": "# 盈利收益率定投法\n\n> 一句话：**用\"盈利收益率\"这把尺子决定买/持/卖——便宜到一定程度就买，贵到一定程度就卖，中间拿着不动。** 把\"估值定投\"从口号变成可执行的数字规则。\n\n## 是什么\n盈利收益率 = 市盈率的倒数（E/P）。它回答一个问题：**假设我把这个指数背后所有公司整体买下来，每年盈利能给我多少回报率？** 数值越高 = 买得越便宜 = 越值得买。格雷厄姆在《聪明的投资者》里用这套方法管了几十年，被验证在全球主要股市（含 A股、港股）都有效——是螺丝钉这本书里\"判断指数贵不贵\"的第一武器。\n\n作者的 A 股回测（上证50/红利指数，2004–2015）：无脑每月定投年复合约 12–13%；**只在盈利收益率>10%时定投**，年复合约 29%——同样是指数基金，买入时机不同收益差一倍以上。\n\n## 具体怎么做\n1. **查当前盈利收益率**：用估值工具/公众号/指数官网（中证指数官网、天天基金等）查目标宽基指数的 PE，盈利收益率 ≈ 1÷PE。PE=10 → 盈利收益率 10%。\n2. **对照阈值做决策**（数值随无风险利率走，作者时代 ≈ 10 年期国债 3.5%，阈值可平移）：\n   - **盈利收益率 > 10% → 分批定投买入**（估值便宜，越便宜越买）\n   - **6.4% < 盈利收益率 < 10% → 停止买入，坚定持有**（不便宜了，但也不贵；已买份额拿住，可把资金投向其他仍>10%的品种）\n   - **盈利收益率 < 6.4% → 分批卖出**（比债券长期收益(约6.4%)还低，不如换债券基金；分 10 批卖，别一把清）\n3. **每月定投日检查一次即可**：盈利收益率短期变化不快，不用天天盯——每月发工资后定投那天看一次，落在哪个区间就做哪个动作。\n4. **只对\"对的人\"用**：适用于盈利稳定、流动性好的宽基（A股：上证红利/中证红利/上证50/基本面50等；港股：恒生/恒生国企——内地投资者有分红税+换汇成本，盈利收益率**打9折**再比）。\n5. 周期/成长类品种（证券、钢铁、创业板等盈利波动大）**禁用**此法，改用博格公式法（股息率+市盈率变化+盈利增长率三因素，低估特征通常同时出现：股息率高 + PE/PB 处于历史低位）。\n\n> ⚠️ 阈值不是拍脑袋的：10% 对应\"便宜到值得买\"，6.4% 对应债券基金的长期平均收益（\"买指数还不如买债，就别买\"）。利率环境变了数字跟着变，**方法不变**。\n\n## 什么时候用 / 什么时候别用\n- 适合：路线 A 长期定投选时；手里有闲钱想判断\"现在这个宽基值不值得开始投\"\n- 不适合：短线波段（路线 B，见 海龟交易法则 系，那是另一套触发逻辑）；成长型/周期型/亏损中的行业指数（盈利不稳定，E/P 失真）；盈利收益率常年不达标时（别硬等一只，A股+港股+美股宽基轮流看，总有低估的）\n\n## 来源\n指数基金投资指南（第4章 盈利收益率法挑选指数基金；第5章 结合估值的懒人定投法）\n\n## 相关方法\n指数基金投资从入门到精通 —— 老罗版\"估值定买卖\"总览（本书是其 A股实操细化）；第3章 指数基金入门知识 —— 博格公式（不适配盈利收益率的品种用它）；资产与现金流 —— 为什么要买\"能生钱\"的资产；定投收益放大器 —— **本卡的金额升级版**（判断\"能买\"之后，用公式算出\"该买多少\"）；低估是一个区域 —— 阈值附近的手软怎么处理",
   "id": "03-知识/方法/盈利收益率定投法.md"

   "oneliner": "能\"钱生钱\"的才是资产；现金不是资产，长期持有现金是慢性贬值。 富人和普通人的分水岭，是把钱换成\"会下蛋的资产\"还是花掉/存死。",
   "source": "03-知识/概念/资产与现金流.md",
   "body": "# 资产与现金流\n\n> 一句话：**能\"钱生钱\"的才是资产；现金不是资产，长期持有现金是慢性贬值。** 富人和普通人的分水岭，是把钱换成\"会下蛋的资产\"还是花掉/存死。\n\n## 是什么（说人话）\n分两类东西：\n- **能产生现金流的资产**：股票、债券、指数基金、收租的房产、能分红的公司股权——持有它们就持续给你送钱，价格主要由**现金流的大小和稳定性**驱动。\n- **不能产生现金流的资产**：黄金、古董、字画、纪念币——持有 100 年还是那块东西，价格只由**供求关系**驱动。\n\n**能产生现金流的资产，长期收益率普遍高于不能产生现金流的**；能产生现金流的里面，现金流越高长期收益越好。西格尔教授对美国 200 年统计：1 美元投股票 → 70 万美元；投债券 → 1778 美元；投短期债 → 281 美元；投黄金 → **只剩 4.52 美元**。只有股票类资产能长期跑赢通胀。\n\n\"现金不是资产\"是反直觉重点：钱存在银行/压在手里不会自己增值，而社会上的钱越印越多，你手里现金占总财富的份额被不断稀释——80年代的\"万元户\"藏 1 万元到今天，购买力已不值一提。\n\n## 推论（投资上意味着什么）\n1. **攒钱只是第一步，买资产才是目的**：第一桶金靠工资省出来（记账、省下\"面子消费\"），但省下的钱必须换成资产，否则白省。\n2. **区分消费和投资**：1000 元奖金买烟=消费（抽完归零）；转入货基/买指数=买资产（钱生钱）。\n3. **用钱的时间决定放哪类资产**：3年内要用的钱别碰股票类资产（波动大），放货基/债基；能放 3 年以上的闲钱才适合定投指数。\n4. **财务自由的本质**：不是\"工资高\"，而是\"手里的资产不用你工作也源源不断产生现金流\"——鹅够多，金蛋够花。\n\n## 为什么重要 / 常在哪出现\n- 全书第1章的立论地基，后面所有\"定投指数基金\"的操作都建立在这个观念上；\n- 专治\"存够几十万就安心\"的错觉——存款是死的，会贬值；\n- 和 指数基金投资指南 的定投体系配套：先想通\"我要买资产\"，再学\"怎么挑怎么买\"。\n\n## 来源\n指数基金投资指南（第1章 投资新手的建议）\n\n## 相关概念 / 方法\n盈利收益率定投法 —— \"买资产\"的具体买入规则；金鹅与瘦鹅 —— 资产就是那只\"下金蛋的鹅\"",

   "oneliner": "你手里的优质资产是\"下金蛋的鹅\"，别因短期波动把它杀掉；而市场悲观时没人要的便宜货，往往是未来会长胖的\"瘦鹅\"。 两句话合起来就是长期投资的核心姿态：养好鹅、捡瘦鹅。",
   "source": "03-知识/概念/金鹅与瘦鹅.md",
   "body": "# 金鹅与瘦鹅\n\n> 一句话：**你手里的优质资产是\"下金蛋的鹅\"，别因短期波动把它杀掉；而市场悲观时没人要的便宜货，往往是未来会长胖的\"瘦鹅\"。** 两句话合起来就是长期投资的核心姿态：养好鹅、捡瘦鹅。\n\n## 是什么（说人话）\n两个来自故事/经营史的比喻，讲的都是\"长期持有资产\"的道理：\n\n**金鹅（《小狗钱钱》里的农夫）**：农夫有一只每天下一个金蛋的鹅，却嫌它下得慢，怒而劈成两半——从此一无所有。投资里，能持续产生现金流的资产就是你的鹅（指数基金/股票/收租房/公司股权），金蛋是它每年产出的现金流（分红+盈利增长）。**很多人做的事和农夫一样**：低估时买到好资产，稍微一涨就拿不住卖掉，等于为了一两个金蛋杀掉下蛋的鹅。\n\n**瘦鹅（王永庆的养鹅经历）**：台湾经营之神王永庆\"二战\"时收购别人不要的骨瘦如柴的鹅，用米糠烂菜叶喂，结果瘦鹅长得很好。他悟出：**在极不景气环境中艰难活下来的企业/资产，一旦环境好转就会迅速腾飞。** 映射到投资：市场悲观时没人要的低估值指数基金就是\"瘦鹅\"——买得便宜 + 它作为一篮子股票\"不会死\"，总能撑到恢复健康的那天。\n\n## 推论（投资上意味着什么）\n1. **卖出前先问三个问题**（巴菲特卖鹅三原则）：①基本面恶化了吗（鹅不下蛋了）？②过于昂贵了吗（有人出价远超它一辈子能下的蛋）？③有更好的鹅吗（卖掉能换一只能下更多蛋的鹅）？三问都否 → 别卖。\n2. **买鹅也有讲究**：羽毛光鲜的肥鹅（热门优质资产）通常贵得离谱；**瘦鹅 + 够便宜 + 不会饿死**（低估值宽基指数，天然\"长生不老\"）才是普通人的机会。\n3. **复利靠\"攒鹅\"不靠\"炒鹅\"**：鹅下的金蛋（分红/盈利）再买新鹅 → 鹅越来越多、蛋越来越大。指数基金的复利三来源：低买高卖、公司盈利再投入、分红再投入——后两种躺着持有就有。\n4. 和\"涨一点就跑\"的散户本能正相反——这是路线 A 长期定投的心法支柱。\n\n## 为什么重要 / 常在哪出现\n- 全书第8章\"长期投资的心理建设\"——整章都在治\"拿不住\"这个病；\n- 直接对应散户最大的亏损来源之一：**好资产拿不住 + 坏时机乱割肉**；\n- 可与短线思维对照：路线 B 短线靠\"纪律止损\"（该走就走），路线 A 长期靠\"养鹅不杀\"（该拿就拿）——**先分清自己在走哪条路，别把杀鹅动作用在养鹅仓上**。\n\n## 来源\n指数基金投资指南（第8章 长期投资的心理建设）\n\n## 相关概念 / 方法\n资产与现金流 —— 鹅=能产生现金流的资产；盈利收益率定投法 —— 怎么捡\"瘦鹅\"（低估才买）；为结果负责、概率思维 —— 长期持有的心理配套",
   "id": "03-知识/概念/金鹅与瘦鹅.md"

   "oneliner": "不管什么需求，\"买什么、怎么买、卖什么、怎么卖\"四点不变，变的只是\"卖出条件的松紧\"——养老计划可以慢慢等估值，教育金计划必须保证到点有钱。三种最有代表性的需求：为父母养老、为自己加薪、为子女教育。",
   "source": "03-知识/方法/三类定投计划模板.md",
   "body": "# 三类定投计划模板\n\n> 一句话：**不管什么需求，\"买什么、怎么买、卖什么、怎么卖\"四点不变，变的只是\"卖出条件的松紧\"**——养老计划可以慢慢等估值，教育金计划必须保证到点有钱。三种最有代表性的需求：为父母养老、为自己加薪、为子女教育。\n\n## 具体怎么做（步骤化）\n\n### 模板一：养老定投计划（前期只进不出）\n\n**资金特征**：退休前不断投入、**长期只进不出**；积累够多后，每年取用不超过总市值 **4%**，就不影响长期取用（例：持有 25 万，每年取不超 1 万）。\n\n**四步**：\n1. 确定每月投入金额；\n2. **挑选高股息率品种（如红利指数基金）**——后期靠每年的现金分红支付生活开支，分红不受股价涨跌影响；\n3. 确定定投日、渠道、年限（距退休还有多少年）；\n4. 低估时启动定投。\n\n**若基金不分红** → 每次卖出不超过 4% 的份额换现金。\n\n### 模板二：加薪定投计划（年轻上班族）\n\n**前提认知**：年轻上班族**认真工作才是资产变多的最佳途径**，不是靠投资致富（工作几年薪水翻两三倍不难，靠投资翻两三倍没人能保证）。\n\n**三原则**：① 钱少也要存，节流为先（聚沙成塔）② 区分\"想要\"和\"必需\" ③ **越早开始越好**（复利游戏）。\n\n**四步**：\n1. **每月可将支配收入的 60% 用于定投**（年轻人风险承受力更强）；\n2. 挑选盈利收益率较高的指数基金；\n3. 确定定投日、渠道；\n4. **盈利收益率 >10% → 每月定投；10%~6.4% → 停止定投，钱转货基/债基；<6.4% → 把手持份额分 10 份，每月卖 1 份**。\n\n**注意**：结婚、买房首付、生育等**短期确定性开支不适合投指数基金**。\n\n### 模板三：教育定投计划（为子女）\n\n**特点**：**可预见性最强**——孩子几岁上什么学、何时必须用钱，从出生就能确定；且资金往往需要在**某个确定时间点一次性支出**。\n\n**优先级**：**先保证到时是现金、能拿出来，其次才是收益**。\n\n**四步**：\n1. 确定每月定投金额；\n2. 挑选高盈利收益率指数基金；\n3. 确定定投日、渠道、年限（按孩子用钱时间倒推）；\n4. 按盈利收益率法策略定投。\n\n**关键差异**：**卖出条件要放宽** → 能等到更多卖出机会；卖出后转为保本理财，虽然收益低，但换来\"到点有钱\"。\n\n## 能举的例子\n- **例 1（养老 4% 取用率）**：25 万市值 → 每年取 ≤1 万 → 可长期取用；因指数基金自身会升值，不超过限额就能源源不断。\n- **例 2（加薪计划的止盈档位）**：盈利收益率 8%（在 6.4%~10% 区间）→ 停止定投，本月定投的钱转投货基/债基（不买入，也不卖出）。\n- **例 3（教育金的时间硬约束）**：孩子 15 年后上大学 → 定投年限 15 年；若第 14 年遇到熊市高估无卖出机会 → 放宽卖出条件保证钱能取出，宁可少赚也不能没现金。\n\n## 为什么重要 / 常在哪出现\n- 它是 定投计划落纸面 的**场景化展开**：那张卡给通用四步表格，本卡给三种真实场景的**差异点**（尤其\"卖出条件的松紧\"）；\n- 与 安全提款率 同源：养老计划的\"每年取 ≤4%\"就是安全提款率在定投计划里的应用；\n- 与 分批投入存量资金 的年龄公式呼应：**年龄决定配置比例，需求决定计划档位**；\n- 对路线 A 的意义：**同一个方法（低估定投）可以服务三种完全不同的人生目标，区别只在\"取钱的时间压力\"**。\n\n## 反例 / 注意\n- **别把短期要用的钱放进定投计划**（买房首付/生育开支）——教育金是例外，但必须放宽卖出条件；\n- **养老计划别用低分红品种**：高股息率是关键（分红不受股价影响，适合当\"工资\"用）；\n- **年轻人别本末倒置**：把精力放在\"提高收入\"而非\"研究投资技巧\"上；\n- **年限要倒推**：先定\"何时要用钱\"，再定\"投多少年、每月投多少\"。\n\n## 来源\n指数基金投资指南（第6章 三个定投计划实例）\n\n## 相关概念 / 方法\n定投计划落纸面 —— 通用四步与计划表；安全提款率 —— 4% 取用规则的原理；分批投入存量资金 —— 存量资金如何进场；盈利收益率定投法 —— 计划里的买卖阈值；生命周期资产配置 —— 年龄与配置比例",
   "id": "03-知识/方法/三类定投计划模板.md"

   "source": "03-知识/方法/分批投入存量资金.md",
   "body": "# 分批投入存量资金\n\n> 一句话：**手里已经有一大笔钱时，最忌一次性全砸进去**——不是因为择时，而是因为\"没经历过波动就拿不住\"。正确做法：先用「100 − 年龄」算出该投指数基金的比例，再把这笔钱**拆成 20 份，每月投 1 份**，剩下的先放货币基金/债券基金，边投边观察自己扛不扛得住。\n\n## 具体怎么做（步骤化）\n\n**第 1 步：先算\"该有多少钱投指数基金\"（年龄公式）**\n- 公式：**指数基金配置比例 = (100 − 年龄) %**\n- 例：35 岁 → 65%；家庭按**成员平均年龄**算（平均 40 岁 → 60%）；\n- 硬底线：**股票类资产占家庭资产比例不低于 30%**，低于 30% 对总收益提升不明显；\n- 依据：年轻人风险承受力更强可多投，中年/退休者应更稳。\n\n**第 2 步：把资金拆成 20 份**\n- 例：100 万可投指数基金 → 拆成 **20 份 × 5 万**；\n- 第 1 份 5 万，定投到当前低估的指数基金；\n- 剩下 19 份共 95 万，**先放货币基金或债券基金**（吃利息、随时可取）。\n\n**第 3 步：逐月转换，直到配置完成**\n- 之后 19 个月，每月从货基/债基里取 5 万，定投到指数基金；\n- 估值越低可加快（配合 定投收益放大器），但**不改变\"分批\"这个骨架**；\n- 一年半左右完成建仓，同时被市场教育了一年半。\n\n**第 4 步：先想清楚这笔钱的使用期限**\n- **未来 1 年内要用的钱 → 不能投股票类资产**；\n- 指数基金等股票资产，**要做好投资 3 年以上的心理准备**；\n- 资金以股票基金形式存在的时间越长，增值越快。\n\n## 能举的例子\n- **例 1（年龄公式）**：35 岁，流动资产 100 万 → 100 − 35 = 65 → 65 万投指数基金，余 35 万配债基/货基。\n- **例 2（家庭口径）**：家庭平均年龄 40 岁，总流动资产 200 万 → 60% = 120 万投指数基金。\n- **例 3（20 份分批）**：100 万 → 20 份 × 5 万，首月投 1 份，95 万先放债基，之后每月转 5 万；期间若遇低估加深可加速（但仍是分批）。\n- **反例（一次性全投）**：没有定投经验的人一次性买入，遇到 20~30% 波动极易恐慌卖出 → **真正的问题不是买贵了，是扛不住**。\n\n## 为什么重要 / 常在哪出现\n- 它把\"该不该梭哈\"这个新手最纠结的问题，**从\"择时判断\"转成\"心理可行性判断\"**——分批不是为了买得更便宜，是为了**买得下去、拿得住**；\n- 与 生命周期资产配置（股债配比随年龄走）同源，但本卡更具体：**给出\"存量资金怎么落地\"的操作序列**；\n- 与 定投收益放大器 配套：**分批是骨架**（先把钱投进去），**放大器是加速器**（低估时多投）；\n- 对路线 A 的意义：记账 → 算比例 → 拆 20 份 → 逐月转，**把\"配置\"这件事也变成可执行清单**。\n\n## 反例 / 注意\n- **切忌\"剩的钱闲着也不投\"**：分批期间剩下的钱要放货基/债基吃利息，不能躺活期；\n- **年龄公式是上限不是目标**：如果心理承受力差，实际配置可以低于公式值；\n- **牛市里不要用这个公式加仓**：牛市高估时应减仓而非按比例配满；\n- **短期确定性开支（买房首付、生育）不适用**：这些钱不该进指数基金。\n\n## 来源\n指数基金投资指南（第5章 手里有一笔资金，该不该一次性买入低估的指数基金？ + 第6章 构建定投计划 · 第7章 做好家庭资产配置）\n\n## 相关概念 / 方法\n生命周期资产配置 —— 股债比例随年龄的经典框架；定投收益放大器 —— 分批期间的加速手段；定投止盈三法 —— 卖出端工具；资产与现金流 —— \"钱要变成能生钱的资产\"的底层观念；定投计划落纸面 —— 把比例、份数、日期写进计划表",

   "source": "03-知识/方法/分红再投入与填权.md",
   "body": "# 分红再投入与填权\n\n> 一句话：**分红不是\"左口袋进右口袋\"，因为除权后一定会填权**——只要基金长期稳定分红，除权跌下去的净值必然被补回来，所以分红是**真收益**。处理原则只有一句：**低估时把分红再投入，不低估时把分红投到别的低估品种上**。\n\n## 具体怎么做（步骤化）\n\n**第 1 步：先搞懂分红从哪来**\n- 指数基金复制指数 → 持有几十上百只成份股 → 收到这些股票的现金股息 → 积累到一定程度就发基金分红；\n- 若基金不主动分红，收到的股息也**直接并入净值，不会丢失**；\n- 所以**成份股分红 = 基金分红的唯一来源**。\n\n**第 2 步：认识分红的两个特点**\n1. **每年都会长出新的**：公司每年赚新利润，拿出 30%~50% 现金分红；\n2. **随公司利润长期上涨**：宽基/优秀行业指数背后的公司利润长期增长 → 分红水涨船高。\n\n**第 3 步：理解除权与填权（关键）**\n- **除权**：分红后净值 = 分红前净值 − 分红额（例：1.6 元分红 0.2 元 → 净值变 1.4 元 + 0.2 元现金）；\n- **填权**：只要基金能长期稳定分红，净值必然被补回来——**否则连续分红 9 年后净值会变成 0，而这不可能发生**；\n- 结论：**除权不可怕，长期分红必然会填权**；盈利稳定的指数基金大概率长期分红。\n\n**第 4 步：按估值决定分红去向（操作原则）**\n- **低估区域 → 分红再投入**（买回同一只，成本最低时加仓）；\n- **不低估 → 分红投到其他低估品种**（换到更便宜的标的，而不是留在贵的地方）；\n- 场外基金可设\"现金分红\"或\"分红再投\"，可自由切换；场内基金分红以现金进入账户，需手动再投。\n\n## 能举的例子\n- **例 1（除权算术）**：5 月底买 100 份 × 1.6 元 = 160 元 → 6/1 每份分红 0.2 元 → 手里变成 140 元基金 + 20 元现金，净值降到 1.4 元。**总额没变，但股价基数降低了**。\n- **例 2（填权必然性）**：某基金净值 1.6 元、每年稳定分红 0.2 元 → 若永不填权，第 9 年净值归零。**现实中不可能**，所以除权后必然填权。\n- **例 3（分红再投入的复利威力）**：\n  - 西格尔《投资者的未来》：1871 年投 1 万美元美股，到 2003 年剔除通胀约 250 万美元；**若每年分红再投入 → 8000 万美元**（32 倍差距）；\n  - 中国香港：70 年代投 1 万港元恒指成份股 → 今天约 200 万港元（200 倍）；**分红再投入 → 600 万港元（600 倍）**。\n- **例 4（盈富基金分红成长）**：2003 年两次分红合计 0.41 港元 → 2016 年 0.78 港元，**翻近一倍**（因恒指公司盈利长期上涨）。\n\n## 为什么重要 / 常在哪出现\n- 它补上了指数基金收益来源里**最容易被忽略的一块**：股价上涨（盈利增长）+ 分红，**分红再投入是复利的第二大来源**（见 复利三来源）；\n- 与 金鹅与瘦鹅 呼应：分红就是\"金蛋\"，而**分红再投入 = 用金蛋买更多的鹅**；\n- 对路线 A 的意义：**低估时收到的分红要主动再投**（很多人默认设成现金分红，白白错过复利）；对路线 B 意义较小（持有期短，通常拿不到分红）；\n- 与 定投收益放大器 同属\"提升长期收益的小技巧\"，但机制不同：放大器管**买入金额**，本卡管**分红去向**。\n\n## 反例 / 注意\n- **不是所有指数基金都分红**：一般**股息率高的指数**（如红利指数）对应的基金才分红；\n- **分红时间不固定**：内地基金看公司安排，分红前会公告，登记日持有即可拿到；\n- **别把分红当\"白赚的钱\"而忽略净值**：分红后净值下降是同步的，真正收益来自**填权 + 再投入**；\n- **填权的前提是\"长期稳定分红\"**：如果公司盈利恶化、分红中断，填权逻辑就不成立。\n\n## 来源\n指数基金投资指南（第5章 提高定投收益的5个小技巧 · 2.正确处理基金分红，能让长期收益上一个台阶）\n\n## 相关概念 / 方法\n金鹅与瘦鹅 —— \"金蛋\"（分红）与\"鹅\"（资产）的比喻；复利三来源 —— 分红再投入是复利的核心来源之一；定投收益放大器 —— 另一项提升长期收益的技巧；指数基金费用清单 —— 分红税的成本视角；成本拖累 —— 费用与净值的长期关系",

   "source": "03-知识/方法/定投收益放大器.md",
   "body": "# 定投收益放大器\n\n> 一句话：**定期定额只是平均成本，定期\"不定额\"才能放大收益**——同样一笔钱、同样一只基金，只要把\"每月固定买 1000 元\"改成\"越低估买越多\"，收益率就能再上一个台阶。做法：以首次进入低估时的金额为基准，本月投入 = 基准 × (1 + 档位参数 × n 级差)，**n 就是那个放大器**。\n\n## 具体怎么做（步骤化）\n\n**第 0 步：先明确\"定额\"本身就是错的**\n- 长期看定投金额必须递增（货币贬值：90 年代定投 200 元很多，今天 200 元太少）；\n- 短期看指数一年内可能有 ±30% 波动，估值高低不同 → **同一个金额买\"贵\"和买\"便宜\"价值天差地别**；\n- 所以\"定投应该是定额\"是个误解，**定投的金额本就该随估值浮动**。\n\n**第 1 步：确定基准金额与基准估值**\n- 基准 = **盈利收益率首次达到低估标准（10%）那一次投的金额**（例如每月 1000 元）；\n- 这个基准金额就是后面所有月份的锚。\n\n**第 2 步：套公式算出本月该投多少**\n\n| 估值方法 | 公式（图示原文） | 直觉 |\n|---|---|---|\n| 盈利收益率法 | 本月金额 = 基准 × (1 + (当前盈利收益率 − 10%) 的档位级差)^n | 盈利收益率越高（越低估）→ 投越多 |\n| 博格公式法（PE） | 本月金额 = 基准 × (1 + (当前PE 偏离程度的档位级差))^n | 市盈率越低 → 投越多 |\n| 博格公式变种（PB） | 同上，把 PE 换成 PB | 市净率越低 → 投越多 |\n\n> 三套公式结构一致，只是\"用什么指标衡量低估\"不同；**n 是统一放在指数位置上的放大器**。\n\n**第 3 步：设定 n 的取值（量力而行）**\n- n 越大收益越高，但**对资金的需求是几何级数增长**（越低估要投的钱越多）；\n- 作者经验：**n = 1 效果就不错；资金多的话 n = 2 也足够了**；\n- 别贪心设大 n，否则低估来临时拿不出那么多钱，计划会崩。\n\n## 能举的例子\n\n**例 1（盈利收益率法，直接算）**：从盈利收益率 10% 开始定投，基准每月 1000 元（n=1）。第二个月盈利收益率升到 12.5% → 本月金额 = 1000 × (1 + 2.5%) = **1250 元**（比基准多投 250 元）。盈利收益率越高买得越多，估值稍高时则自动买得少。\n\n**例 2（H股ETF 回测，n 的作用）**：2016 年 1–11 月定投 H股ETF，本金同为按月投入：\n| n 取值 | 共投入本金 | 持有市值 | 收益率 |\n|---|---|---|---|\n| n = 0（等同定额） | 11 000 元 | 12 123 元 | **约 10.2%** |\n| n = 1 | 15 865 元 | 17 826 元 | **约 12.0%**（+2%） |\n| n = 2 | 23 038 元 | 26 055 元 | **约 13.1%**（+3%） |\n\n结论：n 越大越能在低估时买更多份额，收益率递增——**但投入本金也递增，必须量力而行**。\n\n**例 3（长期收益率阶梯）**：\n- 无脑等额定投，不择估值 → A股约 10%~13%、美股 8%~9%；\n- 只在低估时定投 → A股/港股长期 **15%+** 可实现；\n- 再加定期不定额（越低估买越多）→ **15%~20% 有希望**。\n\n## 为什么重要 / 常在哪出现\n- 它是 盈利收益率定投法 的**执行升级版**：那卡回答\"什么时候能买\"（阈值），本卡回答\"能买的时候该买多少\"（金额公式）——两卡合起来才是完整的估值定投；\n- 与 智能定投（定期不定额） 是同一思想的两种表述（老罗 vs 螺丝钉）：**老罗**给\"实际扣款 = 基础金额 × (1 + 档位参数 × 级差)、偏离度 5% 一档\"的简化版，**螺丝钉**给带指数 n 的公式版 + 回测数据；实操选一套即可，别混；\n- 对路线 A 的意义：**越跌越买**这件事从\"感觉\"变回了\"算出来的数字\"——金字塔法买入策略 管下跌分层的档位、本卡管每档的金额放大。\n\n## 反例 / 注意\n- **别把 n 设大**：n 的代价是几何级增长的资金需求，设 n=3 以上很可能在最低估时反而没钱投，等于自废武功；\n- **放大器只在\"普通定投本身是盈利的\"前提下有效**：如果定投标的基本面长期下行（如买错行业指数），放大只会放大亏损；\n- **公式依赖估值数据准确**：估值分位取错 → 放大方向就反了；\n- 手里有一笔存量资金时，**别一次性全投**（见 分批投入存量资金），仍应拆成 20 份按月投入。\n\n## 来源\n指数基金投资指南（第5章 提高定投收益的5个小技巧 · 定期不定额：盈利收益率法 / 博格公式法）\n\n## 相关概念 / 方法\n盈利收益率定投法 —— 本卡的估值前提（何时可买）；智能定投（定期不定额） —— 老罗版同一方法（简化档位表）；金字塔法买入策略 —— 下跌分层加仓的档位设计；定投止盈三法 —— 卖出端的对应工具；分批投入存量资金 —— 存量资金的处理方式；定投计划落纸面 —— 把 n 与公式写进计划表",

   "body": "# 定投计划落纸面\n\n> 一句话：**把\"每月投多少、买什么、什么条件买/卖\"写成一张纸贴起来——投资成功的最大敌人不是不懂方法，是情绪，而纸面计划是情绪的解药。**\n\n## 是什么\n螺丝钉在书里强调：定投策略极其简单（低估买、正常持、高估卖），但**为什么大多数人执行不了？因为心理因素**——恐慌时不敢买、贪婪时乱追高。他的解法不是\"练心态\"，而是**工程化的：把计划写下来**。\"让任何一个拿到这份计划的人，都能执行出相同的效果\"，计划才算完成。这是全书最关键的一步，比\"看懂方法\"重要得多。\n\n## 具体怎么做（四步）\n1. **梳理现金流（回答\"投多少\"）**\n   - 记账 1–3 个月（大账马上记、小账汇总记、收入也记、留好凭证），搞清楚每月真实盈余；\n   - 定投金额 = 月收入 − 月必要开支后**剩余的一半左右**（留一半当备用金，别 All in）；\n   - 原则：这笔钱**3 年内不能动**——要用就放货基，别放进股票类资产。\n2. **挑低估品种（回答\"买什么\"）**\n   - 用 盈利收益率定投法 或博格公式（股息率高 + PE/PB 处历史低位）筛出当前低估的 1–3 只宽基；\n   - 月定投额 <1000 元 → 选 1 只就够；1000–3000 元 → 2–3 只分散。\n3. **写计划表（回答\"何时买卖\"）**\n   - 渠道（场内/场外）、每月定投日（建议发薪后第一个交易日）、每只金额、**买/持/卖三档触发条件**全部写清楚；\n   - 打印出来贴在显眼处，每月定投日对照执行，不临时拍脑袋。\n4. **定期记录 + 检查优化**\n   - 每次定投记一行：日期、品种、买卖、金额、份额、**当时估值**；\n   - 定期回看：估值更低了 → 可加大当月金额（越低估买越多）；计划不适配生活变化（收入/用钱计划变了）→ 更新计划表，但**更新要重写成文，不是当场改主意**。\n\n> ⚠️ 反直觉重点：**\"我懂了，心里有数就行\"是最常见的失败借口。** 作者原话——把计划落在纸面上，\"长期坚持定投的成功率会大大提升\"。写下来 = 给自己一个不需要意志力的外部约束。\n\n## 什么时候用 / 什么时候别用\n- 适合：路线 A 一切定投（宽基、教育金/养老金）；现金流稳定（上班族/月生活费有结余）的人；刚开始投资、怕自己乱操作的新手\n- 不适合：路线 B 短线波段（那是 机械交易系统 / 海龟交易法则 的触发式系统，逻辑完全不同）；没有稳定结余时（先解决现金流，别借钱定投）\n\n## 来源\n指数基金投资指南（第5章 如何买卖指数基金；第6章 构建属于自己的定投计划）\n\n## 相关方法\n盈利收益率定投法 —— 计划表里\"买/持/卖\"三档的触发规则来源；资产与现金流、金鹅与瘦鹅 —— 想通\"为什么要攒鹅\"，计划才立得住；机械交易系统 —— 把规则写成清单这件事，路线 A 和 B 是同一个道理；三类定投计划模板 —— 养老/加薪/教育三种场景的模板（含卖出条件松紧的差异）；定投频率选择、定投收益放大器 —— 计划表里\"频率\"与\"金额公式\"两栏的填法；分批投入存量资金 —— 有存量资金时的进场节奏",

   "source": "03-知识/方法/定投频率选择.md",
   "body": "# 定投频率选择\n\n> 一句话：**按周还是按月，对长期收益几乎没差别（5~7 年后差距不到 1%）**——所以选择的依据不是\"哪个收益高\"，而是**哪个你更能坚持**。手上闲不住、看到下跌就想加仓的人 → 按周；发工资后定投、投完就不管的人 → 按月。\n\n## 具体怎么做（步骤化）\n\n**第 1 步：先接受结论——频率对收益影响很小**\n- 回测上证红利/中证红利/基本面50：定投时间越长，周投与月投的收益差距越小；\n- **定投 5~7 年时，两者差距不到 1%，几乎可忽略**；\n- 原因：定投时间短时，若正好赶上大涨大跌，频率影响被放大；时间拉长后被平滑掉。\n\n**第 2 步：从心理角度选频率（真正的决策依据）**\n- **按月**：贴合工资收入节奏，发了工资就买，省心省力 → 适合\"投完能安心不管\"的人；\n- **按周**：等待时间短，适合对下跌敏感、容易忍不住提前加仓的人 → **给急性子一个\"等一周就能再投\"的出口**。\n\n**第 3 步：自查自己是哪类人**\n- 定投后看到下跌就\"买买买\"，把下一次的钱提前投完 → **提高频率，改按周**；\n- 每月投完心安理得、不再惦记 → **按月即可**。\n\n**第 4 步：绝不凭感觉决定买入时机**\n- 主观择时容易受波动影响（大跌不敢投、大涨提前投），效果反而不如定期；\n- 心理学依据：**同样数量的损失带来的痛苦是等量盈利喜悦的 2~2.5 倍**（赚 200 元的喜悦才抵得上亏 100 元的痛苦）→ 情绪会不知不觉扭曲判断；\n- 结论：**定期投，不凭感觉投**。\n\n## 能举的例子\n- **例 1（差距可忽略）**：红利/基本面50 类基金，按月 vs 按周，短周期（1–2 年）差距明显，5–7 年后差距 <1% → **长期投资者不必纠结**。\n- **例 2（急性子的自查）**：某人月中就把下个月的钱投完了 → 说明等待一个月太难熬 → 改按周，每周投一次。\n- **例 3（损失厌恶的量化）**：亏 100 元的痛 ≈ 赚 200 元的喜 → 所以大跌时人本能想停投，这正是需要纸面计划约束的地方。\n\n## 为什么重要 / 常在哪出现\n- 它把\"周投 vs 月投\"这个高频新手问题**从收益问题转化为纪律问题**——和 定投计划落纸面 的核心逻辑一致：**能坚持的方案才是好方案**；\n- 与 定投收益放大器 形成对比：**频率（周/月）几乎不影响收益，方法（定额/不定额）才真正影响收益**——别在频率上纠结，要在金额公式上下功夫；\n- 对路线 A 的意义：**按周定投是\"防手痒\"的纪律工具**，不是收益工具。\n\n## 反例 / 注意\n- **别每天定投**：太频繁，操作成本上升（见 指数基金费用清单），收益并无改善；\n- **别\"随心所欲\"投**：没有固定节奏 = 变相择时，容易在暴跌时停投、暴涨时追投；\n- **频率不是收益的来源**：指望靠\"改成周投\"提升收益是找错了方向。\n\n## 来源\n指数基金投资指南（第5章 提高定投收益的5个小技巧 · 3.定投的频率选择）\n\n## 相关概念 / 方法\n定投计划落纸面 —— 把频率与日期写进计划表；定投收益放大器 —— 真正影响收益的变量（金额公式）；指数基金费用清单 —— 频率过高的成本代价；盈利收益率定投法 —— 定投主流程；系统1与系统2 —— 损失厌恶的认知机制",

   "source": "03-知识/方法/指数基金费用清单.md",
   "body": "# 指数基金费用清单\n\n> 一句话：**省下的费用等于多赚的收益**——同样的指数基金，用更低的费率交易，长期就是纯赚。交易环节一共 6 类费用：申购赎回费、买卖佣金、销售服务费、印花税、分红税、所得税；记住三条铁律：**选低费率渠道、别频繁交易、优先成立 1 年以上的老基金**。\n\n## 具体怎么做（步骤化）\n\n**认识 6 类费用（哪些能省、哪些省不掉）**\n\n| 费用 | 适用 | 费率 | 能否优化 |\n|---|---|---|---|\n| **申购赎回费** | 场外基金 | 申购 1%~1.5%；赎回 0.5%（<1年）/0.3%（1–2年）/**0（≥2年）** | ✅ 换成**1折平台**申购 → 0.1~0.15%；持有满 2 年免赎回费 |\n| **买卖佣金** | 场内（ETF/LOF） | 约 0.03%，双向收 | ✅ 网络开户、资金大可谈费率、货比三家 |\n| **销售服务费** | C 类基金 | 每年 0.4%~0.6%（固定） | ⚠️ 免申赎费但年费固定——**长期持有反而更贵**，不适合定投 |\n| **印花税** | 股票要，**场内基金免** | 股票 0.1% 单边 | ✅ 指数基金的\"小福利\" |\n| **分红税** | 基金收到成份股分红时 | <1月 20% / 1月–1年 10% / **≥1年 5%（减按50%×20%）** | ⚠️ 前台看不到，**成立 1 年以上的老基金更有优势** |\n| **所得税** | 国内基金交易**暂免** | — | — （美股有所得税，这才是巴菲特偏爱长期持有的原因之一） |\n\n**三条省钱铁律**\n1. **选费率低的场外/场内渠道**——1 折平台 vs 银行不打折，差 10 倍；\n2. **不要频繁交易**——费率按次收，操作越多成本越高（这也是\"长期持有优于波段\"的算术理由之一）；\n3. **成立 1 年以上的指数基金在分红税上更有优势**（持股时间长，税率更低）。\n\n**赎回费的隐藏规则**\n- 分批定投的份额，赎回时**按每份的具体申购日期单独计算持有时间**；\n- 定投满 2 年后大部分份额自动免赎回费 → 长期定投天然省赎回费。\n\n**C 类份额的取舍**\n- C 类免申赎费、持有 1 个月以上免赎回费，但固定收 0.4%~0.6%/年销售服务费；\n- **定投场景（持有 1 年以上）→ 选 1 折申购的 A 类更划算**；\n- **只有频繁进出的短线需求**，C 类才划算（这条对路线 B 波段有参考价值）。\n\n## 能举的例子\n- **例 1（申购渠道差 10 倍）**：申购 1 万元 → 银行不打折 ~100~150 元；1 折平台 ~10~15 元。同样的基金，省 90~135 元/次。\n- **例 2（赎回费随年限归零）**：持有 <1 年 0.5%、1–2 年 0.3%、≥2 年 0 → 定投满 2 年后赎回基本免费。\n- **例 3（分红税的老基金优势）**：某基金持成份股分红 1000 万 → 持股<1月扣 200 万、1月–1年扣 100 万、≥1年只扣 50 万 → **老基金税负天然更低**。\n- **例 4（C 类的算术）**：定投持有 3 年 → A 类成本 ≈ 0.1%（申购）+ 0（赎回）= 0.1%；C 类 = 0.4%~0.6%×3 ≈ 1.2%~1.8% → **A 类完胜**。\n\n## 为什么重要 / 常在哪出现\n- 它是 成本拖累 概念卡的**操作落地面**：那卡讲\"费率为什么吃掉长期收益\"（原理），本卡讲\"具体哪几笔费、怎么省\"（清单）——**指数基金同质化严重，费率就成了少数能主动优化的一环**；\n- 对路线 A（长期持有）→ **重点在申购 1 折 + 拿满 2 年**；对路线 B（短线波段）→ **重点在 C 类份额与佣金的取舍**（若波段频繁，C 类反而可能划算）；\n- 与 指数化投资 呼应：低成本是被动投资的核心优势之一，**如果费率没管好，等于把指数的优势还回去了**。\n\n## 反例 / 注意\n- **别只看\"免申赎费\"就选 C 类**：年费是固定的，持有越久越亏；\n- **ETF 场内申购有百万门槛**：普通人走\"场内买卖\"（付佣金）而非\"场内申赎\"；\n- **费率数据会变**：本卡的费率是书出版时（2017 前后）的，**实际以当前券商/平台公告为准**；折扣、免佣政策经常调整；\n- **别为省几分钱佣金去做频繁交易**：省下的佣金远不及多做几次错的成本。\n\n## 来源\n指数基金投资指南（第5章 提高定投收益的5个小技巧 · 1.省下就是赚到：降低交易基金的费用）\n\n## 相关概念 / 方法\n成本拖累 —— 费率如何长期侵蚀收益（原理层）；指数化投资 —— 低成本是被动投资的核心优势；定投止盈三法 —— 卖出端的费率影响；盈利收益率定投法 —— 定投主流程",

   "body": "# 智能定投（定期不定额）\n\n> 一句话：**把\"定期定额\"升级成\"定期不定额\"——时间不变、金额可变：指数跌得多就多买，涨得多就少买甚至不买。用同一笔预算，买在更便宜的均价上。**\n\n## 是什么\n普通定投的缺陷很直白：**它不管贵贱，一律投同样的钱**。在 PE=50 的高位和你 PE=12 的低位买一样多，等于主动放弃\"便宜时多买\"的机会。智能定投（也叫\"价值平均定投\"\"估值定投\"）就是给定投加一个**调节旋钮**：仍然是每月/每周固定时间扣款，但扣多少由当期指数相对某个基准的**偏离程度**决定。\n\n老罗给的三类判断指标：\n1. **N 日指数均线法**——指数低于 N 日均线（如 MA180/MA250）越多，说明越\"便宜\"，扣款越多；高于则减少。\n2. **指数 PE 法**——直接用市盈率相对历史区间的分位定档（更贴近价值投资，推荐）。\n3. **投资成本法**——以自己持仓的平均成本为基准：现价低于成本 → 加码；高于 → 减码。\n\n核心算式：\n> **实际扣款金额 = 基础金额 × (1 + 档位参数 × 级差)**\n\n- **档位参数**：由偏离度决定，通常**每偏离 5% 记一档**（跌 5% 一级、跌 10% 两级……）\n- **级差**：每档增减的幅度（如 10%），你自己设定，也可以设成非对称（跌了多加、涨了少减）\n\n## 具体怎么做\n1. **先定基础金额**：还是那句老话——（月收入 − 月支出）÷ 2 左右，且是 3 年内用不到的闲钱（见 定投计划落纸面）。\n2. **选一个判据，不要三个混用**：日常执行建议用 **PE 分位**（客观、每月查一次就够）；嫌算分位麻烦就用**均线法**（看指数与 250 日均线的关系，一眼可判）。\n3. **设偏离度与级差**：偏离度 5% 一档是书中的中庸值（太密会频繁调仓、太疏则失去意义）；级差 10%~20% 之间自选——**保守的人设小级差（如 10%）**，激进的人设大级差但要注意\"高位减到 0 之后市场继续涨\"的心理落差。\n4. **设上下限，别让公式跑飞**：低位的极端档位可能算出\"这个月要投 5 倍基础金额\"——**必须设单月上限**（例如不超过基础金额的 2~3 倍），否则遇到持续暴跌会把你所有弹药打光，后面真底来了却没子弹。\n5. **高位可以不买，但不必卖**：智能定投只负责\"买多少\"，**卖出仍走 定投止盈三法**——两件事分开，不要用买入公式兼职做卖出决策。\n\n## 什么时候用 / 什么时候别用\n- **适合**：路线 A 宽基定投的进阶版本；指数波动大（中证500/创业板）时效果比大盘指数更明显；有稳定现金流、能承受\"这个月多投一点\"的人。\n- **不适合**：刚开始定投、还没建立纪律的人（**先用普通定额定投跑满 6 个月，能坚持住再上智能版**——公式越复杂越容易在执行环节放弃）；现金流不稳定的人（这个月加 2 倍、下个月生活就紧张，那说明基础金额本身定高了）。\n- **路线 B 不适用**：路线 B 是触发式系统（见 ETF交易系统 §3A），\"越跌越买\"在路线 B 是**禁忌**（不摊平、-5% 硬止损）。智能定投的\"跌多买多\"**只属于路线 A 的宽基**。\n\n## 来源\n指数基金投资从入门到精通（第8章 8.2 智能定投 / 8.3 大额定投中证500 / 8.4 两种止盈方法测算）\n\n## 相关方法 / 概念\n盈利收益率定投法 —— 同一逻辑的\"刻度化\"版本（螺丝钉用固定阈值，老罗用动态档位）；金字塔法买入策略 —— 熊市里\"越跌买越多\"的极端形态（本法是它的温和日常版）；定投计划落纸面 —— 公式必须写进计划表才执行得下去；定投止盈三法 —— 智能定投管买、止盈三法管卖，各司其职",
   "id": "03-知识/方法/智能定投（定期不定额）.md"

   "source": "03-知识/方法/余钱投资三原则.md",
   "body": "# 余钱投资三原则\n\n> 一句话：**入场之前先过三道门——只投 30~50 年不用的余钱、量力而为（亏光也不影响生活）、远离一切杠杆。李大霄把这组原则放在全书最后一段反复念叨：它是其他所有策略生效的前提，\"乱理财，还不如不理财\"。**\n\n## 是什么\n不是收益方法，是**资格筛选**：三原则决定你有没有资格留在牌桌上。股市是\"专门针对人性弱点设计的游戏\"，而生活费用压力是心态崩溃的第一诱因——\"股市上的钱和生活上的钱不能相连\"；杠杆则把\"错了可以等\"变成\"错了就出局\"，直接剥夺改错机会。\n\n## 具体怎么做\n1. **余钱投资**：投入资金必须是扣除必要生活费用后的剩余资金，且有充足后备。后备充足的人对市场起落\"不是非常在乎\"——这是心态优势的根源。**后备力量的多少直接决定策略**：只有一笔钱、没有\"援兵\"→ 只能选低风险品种；后续资金充足 → 才谈得上越跌越买。\n2. **量力而为**：按风险承受能力选品种分级（极高风险：期货外汇权证；高风险：小票/题材；中风险：蓝筹/指数基金；低风险：债券；极低：货基存款）。时间也是资源——退休人员的钱是 70 年积累，千万不要用激进方法。家庭支持在股票低迷时尤为重要：顺境不忘记形，逆境不失意。\n3. **远离杠杆**：普通人别碰融资融券、股指期货、期货外汇（外汇杠杆最高 400 倍——\"当你的财富是 1，你需要有能力管理 400 倍的财富\"）。2008 年金融危机的本质就是杠杆（美 20~30 倍、欧 40~50 倍）。股指期货亏损不封底，\"补仓\"经验在杠杆品上根本行不通——这是一条红线。\n\n## 什么时候用 / 什么时候别用\n- 适合：**每次加仓前自查**（这笔钱亏 30% 影响生活吗？我加了杠杆吗？后续还有弹药吗？）；也适用于给家人做投资者教育。\n- 不适合：没有\"不适合\"的场景——它是所有策略的前置条件。唯一例外：确实能管理杠杆的专业人士（李大霄的原话是\"这个领域仅仅是专业人士的专利\"）。\n\n## 来源\n李大霄投资战略（第一部分 不差钱/风险偏好；第四部分 用血汗钱别做股指期货；后记）\n\n## 相关方法\n安全提款率 —— 余钱原则在提款维度的量化；李大霄底部五判据 —— 三原则是判据生效的前提（没有余钱，等到大底也没子弹）；交易心理分析 —— 生活压力如何摧毁交易心态的完整论证",

   "source": "03-知识/方法/双轨并用决策.md",
   "body": "# 双轨并用决策\n\n> 一句话：路线 A 内部的两套玩法（螺丝钉\"低估才买\"＋马尔基尔\"按年龄配置\"）**不二选一、双轨并用**——但两轨不叠加、也不各管一半，而是分工：**马尔基尔轨管\"总盘子该有哪些、各占多少\"，螺丝钉轨管\"眼前这笔钱当下怎么投\"。** 每次触发买入时按\"具体标的是不是真便宜\"逐标的评估两轨权重。\n\n## 是什么\n路线 A 长期存在两种玩法，过去纠结\"该选哪个\"。已定论：双轨并用——关键是**别给全组合设一个固定比例**，而是在每次触发 A 线路动作时（有新钱入池、某只 ETF 到买点/卖点、年度再平衡），**对具体那只标的**评估\"这一笔走哪条轨、下多重\"：\n\n- **马尔基尔轨（战略 · 管总量）**：用 生命周期资产配置 定一辈子的盘子——股债总比例、每个核心标的目标仓位、每年再平衡一次。它回答\"长期我该有哪些、各占多少\"，是**锚和上限**。\n- **螺丝钉轨（战术 · 管时机）**：用 盈利收益率定投法 判断\"现在买值不值\"——低估档才加码/超配，合理档只被动跟基准，高估档分批减。它回答\"这笔钱当下怎么投\"，是**油门**。\n\n## 具体怎么做（逐 ETF 评估权重的五步）\n\n1. **先给标的定位份**（判断它属于哪个池）\n   - 长钱核心池（宽基：沪深300/中证500/恒生等）→ 默认跟着年龄盘子走，马尔基尔轨为主；\n   - 增强卫星池（行业/主题 ETF）→ 盘子之外的机动仓，才适合纯螺丝钉轨去博弈低估。\n   - 定位错了，后面权重全错：别拿卫星仓的逻辑去重仓核心池，也别拿核心池的\"长期主义\"去给行业 ETF 扛单。\n\n2. **算它\"按年龄该有的基准仓位 B\"**\n   - 从年龄盘子读出该资产类别的目标比例，折算成这只标的的基准仓位 B（战略轨给的锚）。\n   - **任何情况下，总仓位不超过 B（核心池）或卫星预算上限**——再看好也受盘子约束。\n\n3. **对触发买入的具体 ETF 做估值体检**（螺丝钉轨参数）\n   - 宽基看：盈利收益率 E/P、市盈率历史分位、股息率；\n   - 行业/主题看：估值分位 + 景气位置（盈利不稳定时 E/P 会失真，改用 PB 分位）；\n   - 分档：**低估**（如 E/P>10%，或估值 0~30% 分位）/ **合理**（中段）/ **高估**（如 E/P<6.4%，或 >70% 分位）。\n\n4. **用决策矩阵定本期资金走哪条轨**\n\n| 该标的估值档 | 主要执行轨 | 本期资金动作 | 两轨权重（本期资金） |\n|---|---|---|---|\n| **低估** | 螺丝钉轨为主，马尔基尔轨只兜总量 | 按定投节奏买入，可超基准逐步加到 B（或卫星预算）上限 | 战术轨（低估加仓）7~10 成 / 战略轨 0~3 成 |\n| **合理** | 马尔基尔轨 | 只按年龄比例/再平衡买入，不额外加码 | 战略轨 10 成 / 战术轨 0 |\n| **高估** | 马尔基尔轨管再平衡，螺丝钉轨触发卖出 | 新钱不追；已有仓位按 E/P<6.4% 分批卖 | 战术轨执行\"分批减\"，战略轨照常再平衡 |\n\n5. **落计划 + 定期复核**\n   - 买入后把\"标的、估值档、两轨权重、仓位上限 B\"记一行进 定投计划落纸面 的计划表，下次不重复纠结；\n   - 每年复查年龄盘子、每季重看估值档；某标的跨档（低估↔合理↔高估）只调战术仓，不动战略基准；\n   - **两道硬约束**：① 总仓位不破年龄盘子上限；② 用来\"低估加仓\"的钱必须是长钱/可承受波动——短线资金（海龟头寸规模 管的那种）绝不挪用。\n\n## 什么时候用 / 什么时候别用\n- 用：路线 A 里每一次\"某只 ETF 要不要买、买多少\"的决策；新增资金入池时；年度再平衡时。\n- 别用：路线 B（短线波段）的触发不归它管——短线走 机械交易系统、海龟止损。**同一只标的若两条路线都做，先分清现在这笔是哪个仓位的钱**，别把这里的\"越跌越买\"和短线的\"2N 止损\"混在同一笔里。\n\n## 来源\n双轨并用 = 指数基金投资指南（低估定投玩法）× 漫步华尔街（生命周期配置玩法）的合并决策；底层原理各自见两书书卡。\n\n## 相关方法\n生命周期资产配置（战略轨）、盈利收益率定投法（战术轨）、定投计划落纸面（把决策写死）、指数化投资（为什么别在合理/高估档追）",
   "id": "03-知识/方法/双轨并用决策.md"

   "body": "# 安全提款率\n\n> 一句话：**退休后每年只花\"退休储蓄初始值\"的 3.5%~4%，之后提款额每年只随通胀小幅上调——大概率你活到 100 岁钱也花不完。把\"钱会不会花光\"的焦虑，换成一条可执行的纪律。**\n\n## 是什么\n马尔基尔在退休章节给出的\"4%解决方案\"：假设退休资产是股债平衡组合（长期年化约 5.5%：股票约 7%、债券约 4%），通胀每年约 1.5%~2%——那么**每年花掉初始储蓄的 4% 左右，剩余收益足以让本金购买力不缩水**（组合实际增长 1.5%，下一年提款额也上调 1.5%，购买力不变）。\n\n为什么要定得低于组合收益率？两个原因（第14章）：\n1. **支出要随通胀逐年增长**——第一年花 4%，第二年要花 4%×1.04，本金还得继续长；\n2. **要熬过股市萧条期**——如果每年按当年市值的 7% 提款，碰上 2008 式熊市（跌约 50%），储蓄不到 10 年就可能枯竭；按 3.5%~4% 提，活到 100 岁也基本花不光。**保守的提款率，是\"永远不会把钱花光\"的概率最大化工具。**\n\n反推需要多少钱：想退休后每月花 1500 美元（每年 1.8 万），约需 45 万美元储蓄。**反过来用**：想每月花 X 元，就攒 X×12 ÷（3.5%~4%）。\n\n数字会变，原则不变：第9版推荐 4.5%（当时债券收益率高），第12版（2018 低利率时代）降到 4%，更保守可用 3.5%。**债券收益率/无风险利率越低，安全提款率就该越低**——A 股做退休或\"财务自由\"规划建议取保守值。\n\n## 具体怎么做\n1. **退休当年定\"初始本金\"**：取退休第一天的组合总值（如 100 万）。\n2. **第一年花初始值的 3.5%~4%**（保守取 3.5%）：100 万 → 第一年花 3.5~4 万。\n3. **之后每年提款额 = 上年提款额 ×（1 + 通胀率约 1.5%~2%）**。⚠️ **不要**每年按当年市值的 3.5%~4% 重算——否则市场一跌你的生活费跟着暴跌，一涨又过度消费。\n4. **提款时先卖\"超配\"的资产，顺带再平衡**：假设目标是股债 50:50，股票大涨后变成 60:40——从股票部分提款，让比例回到 50:50。既拿到生活费，又把组合风险压回目标线。**即便当年不缺钱，也每年再平衡一次。**\n5. **按\"税后效率\"决定动用顺序**（美国税制，思路可平移）：先花应税账户的钱（已缴过税、闲着也白闲）→ 再花递延税账户（401k/IRA，有法定最低提取）→ **最后花能免税传承的账户**（罗斯 IRA），把免税资产留给继承人。\n6. **每年体检**：如果 80 岁了组合还在增值，要么你深信会长命百岁，要么该提高消费、把钱袋松一松了。\n7. **怕\"活太久没钱\"的补充方案——年金**：把部分储蓄换成低成本年金（\"长寿保险\"，活着就一直发钱，先锋等提供免佣产品），适合厌恶风险、无遗赠需求的人。**但别全买年金**：它有四个缺点——与\"想留遗产\"冲突、消费路径不灵活（突发大额需求无法变通）、成本可能很高（销售佣金）、税收上未必占优。\n\n> ⚠️ 4% 是\"退休起点纪律\"，不是常数也不是万能公式。大病、房子翻新这类一次性大额支出要单独预留，不能硬套 4% 往出挤。\n\n## 什么时候用 / 什么时候别用\n- 适合：已退休、靠本金生活的人；做\"财务自由/攒够多少钱才能躺平\"的**反推计算**（用 3.5%~4% 当除数）。\n- 不适合：还在积累期的人（此时该用 定投计划落纸面 + 生命周期资产配置 攒本金）；没有股债组合、all-in 单一资产的人——没有组合的长期收益做支撑，提款率无从谈起。\n\n## 来源\n漫步华尔街（第14章 继续持有退休前的投资组合，如何过好退休生活：4%解决方案）\n\n## 相关方法\n生命周期资产配置 —— 上游：先配好一辈子不散的股债组合，才有\"初始本金\"可提；指数化投资 —— 组合最好用低成本宽基实现，别让高费率偷走你的 4%；均值回归/成本拖累 —— 主动基金与高成本会提前击穿安全提款率",
   "id": "03-知识/方法/安全提款率.md"
  },

   "status": "未学",
   "oneliner": "不用自己预测顶底——盯着市场上最有钱、最懂政策、历史上几乎没失手过的四类资金在做什么：上市公司买不买自家股票、中石油、汇金、社保基金。它们在买=底部区域，它们在撤=顶部区域。",
   "source": "03-知识/方法/李大霄四大风向标.md",
   "body": "# 李大霄四大风向标\n\n> 一句话：**不用自己预测顶底——盯着市场上最有钱、最懂政策、历史上几乎没失手过的四类资金在做什么：上市公司买不买自家股票、中石油、汇金、社保基金。它们在买=底部区域，它们在撤=顶部区域。**\n\n## 是什么\n李大霄判断 A 股大势的核心方法：大资金的**行动**比任何人的**言论**可信。四类主体的共同点是：资金量巨大、信息与政策判断能力远超散户、操作周期长、历史上几乎每次都买在低位卖在高位（社保基金\"还没有失手过\"，6124 点悄然撤退、1664 点后无声进场百亿）。\n\n## 具体怎么做\n1. **风向标一：上市公司买卖自家股票**——上市公司大量**增持/回购**自家股票时，说明股价已跌到产业资本满意的位置（1664 点的判断依据之一）；大面积减持时是顶部信号。这是每天可查的公开数据。\n2. **风向标二：中石油**——A 股第一大权重+产业资本代表，其增持/减持节奏直接指示管理层与大股东对当前股价的态度。\n3. **风向标三：汇金公司**（\"金融国资委\"）——出手增持银行/ETF = 政策底信号（2013、2015、2024 年 2 月多次验证）；\"平准基金有额度限制，汇金没有\"。\n4. **风向标四：社保基金**——最特殊的\"养命钱\"，对政策把握能力最强：**入市=低位区域**（它选区域不选时点），**退出=顶部临近**（6124 点时它悄然反退，而市场还在喊 8000 点）。\n5. **配套看三样**：① 其他市场联动（港币强弱、澳元/资源、原油与粮价）；② **政策动向**——学《人民日报》、新华社社论，\"站在国家高度上看问题\"（A 股政策市，赌经济不如赌政策时先看政策）；③ **重大历史事件要有 8~12 个月提前量**——\"没有奥运行情\"，想在事件日兑现的人会被提前埋伏的人一网打尽。\n\n## 什么时候用 / 什么时候别用\n- 适合：判断**大周期位置**（当前处于低估区还是高估区），给路线 A 定投档位、止盈时机做参考；ETF 复盘时可把\"汇金/社保/上市公司增持动向\"列入观察项。\n- 不适合：**短线择时**——风向标是月级/年级信号，不回答\"明天涨跌\"；也别当唯一依据（要用就和 李大霄底部五判据 的估值/股债差合起来用）。\n\n## 来源\n李大霄投资战略（第二部分 判断大势的风向标）\n\n## 相关方法\n李大霄底部五判据 —— 把风向标信号落成底部确认清单；股债差择时 —— 另一个独立的低位信号；盈利收益率定投法 —— 指数层面的低估档位（与风向标互补）",

   "oneliner": "判断 A 股大底不看 K 线看五件事——估值进历史低位区、救市政策组合拳、产业资本转增持、杠杆出清、情绪极致悲观。五样凑齐=大底区域；顶部反过来读。李大霄用它判断了 1664/1849/2440/2689，也用它提前点破了 6124 之后的\"地球顶\"。",
   "source": "03-知识/方法/李大霄底部五判据.md",
   "body": "# 李大霄底部五判据\n\n> 一句话：**判断 A 股大底不看 K 线看五件事——估值进历史低位区、救市政策组合拳、产业资本转增持、杠杆出清、情绪极致悲观。五样凑齐=大底区域；顶部反过来读。李大霄用它判断了 1664/1849/2440/2689，也用它提前点破了 6124 之后的\"地球顶\"。**\n\n## 是什么\n从 325、998、1664、1849、2440 五个历史大底中提炼的共同特征清单。核心思想：**底部不是一个点，是一组条件的组合**；\"区域判断远比点位判断可靠\"（他自己点位预测有对有错，但估值区间判断命中率显著更高）。\n\n## 具体怎么做\n1. **估值判据**：沪指 PE 进入 10.8~14.6 倍历史底部区间、大盘蓝筹股息率 > 一年存款利率（1664 点、1849 点、2022 年 3000 点下、2024 年 2689 点均满足）。**顶部反向**：主板 PE 中位数 86 倍、创业板 150 倍、\"股息率 370 年回本\"= 摘熟苹果（6124/5178）。\n2. **政策判据**：救市组合拳出现——汇金/社保/养老金入市、IPO 减速或暂停、指数基金重启发行（6000 点停发指数基金=压泡沫信号，一年后重启=护盘信号）、限制减持、降低税费。\n3. **资金判据**：**产业资本（大股东）由减持转为增持**——\"从单方面减持转变为双向增减持，有助于促使市场稳定\"，这是比任何专家言论都硬的信号；配合外资抄底、长期资金入市。\n4. **杠杆判据**：场内杠杆出清（2015 年融资余额从 2.27 万亿降到 1.1 万亿=婴儿底成立理由之二）。**顶部反向**：两融狂热+场外配资蔓延+万亿巨量 22 天不涨（\"自己拔自己头发升空\"）。\n5. **情绪判据**：舆论一边倒看空、基金发行遇冷、散户绝望离场、\"基金经理在公共汽车上挨打\"的段子出现=市场见底。**散户情绪极限与大型底部相对应**（2023-2024 年他的反复论据）。\n6. **顶部专项**（\"地球顶\"五逻辑，反着用）：估值极端偏高 + 新股供应放量（注册制提速）+ 双向交易工具完善（做空力量合法化）+ 产业资本巨额减持（2015 上半年近 5000 亿）+ 去杠杆政策收紧。\n\n## 什么时候用 / 什么时候别用\n- 适合：给路线 A 宽基定投做**档位参考**（五判据越多满足，越接近\"越跌越买\"的加仓档；反向条件越多，越要警惕止盈）；写周复盘/月度复盘时的大盘位置评估。\n- 不适合：路线 B 短线进出场（那是 机械交易系统 的领域）；**不要把判据凑齐当成\"明天必涨\"**——它是区域确认，不是择时发令枪。判据之间要互相验证，单一信号（尤其情绪）会骗人。\n\n## 来源\n李大霄投资战略（第五部分 1849 五大理由 / 婴儿底五理由 / 2440 第五大底 / 地球顶五逻辑 / 万亿巨量风险；第二部分 估值水平）\n\n## 相关方法\n李大霄四大风向标 —— 资金面的活信号；股债差择时 —— 判据之一的量化版；指数化投资 / 盈利收益率定投法 —— 判据落到宽基 ETF 上的执行层；钟摆与周期 —— 底部判据背后的周期原理",

   "oneliner": "李大霄的情绪周期口诀——6124 点需淡泊（别人狂热你要舍得卖）、1664 点需勇气（别人绝望你要敢买）、3000 点需坚持（不好不坏时拿得住）。三个词对应牛市的顶部、底部、中部，是\"在什么时候该做什么情绪\"的定位表。",
   "source": "03-知识/概念/淡泊勇气坚持.md",
   "body": "# 淡泊勇气坚持\n\n> 一句话：**李大霄的情绪周期口诀——6124 点需淡泊（别人狂热你要舍得卖）、1664 点需勇气（别人绝望你要敢买）、3000 点需坚持（不好不坏时拿得住）。三个词对应牛市的顶部、底部、中部，是\"在什么时候该做什么情绪\"的定位表。**\n\n## 是什么\n情绪不是均匀的——**不同市况需要的是完全相反的品质**，用错品质比没有品质更糟（在底部用\"淡泊\"=错过，在顶部用\"勇气\"=站岗）。配套的人性观察：\n\n- **舆论一边倒定律**：当所有人都看多（6124/中石油上市日），牛市到头；当所有人都没兴趣（998/1664），熊市结束。\"当舆论一边倒的情况出现之后，事情往往朝相反的方向转化。\"——群体效应（从众=安全感）是机制根源。\n- **恐惧的错位**：6124 点大家\"恐惧踏空\"→ 结果套牢；1664 点大家\"恐惧套牢\"→ 结果踏空。**该怕的与实际怕的，永远错位。**\n- **墨菲定律**：正确的信息往往不被选择——1664 点\"需要勇气\"的声音没人听，8000 点的声音人人传。克服办法之一：\"和成功者站在一起\"。\n- **孤独必修课**：人是需要认同的动物（答案跟同学一样才踏实），但股市里\"999 个人往东你往西\"才是常态。可行的独立训练：夫妻账户都分开、买卖不互相讨论（\"一场战役只能有一个司令\"）；问周围 10 个人，9 个买了→ 你该考虑卖，9 个不买了→ 悄悄买一点。\n- **折腾的考验**：最难坚持的不是漫长下跌，而是**下跌后刚开始回升时**——熬了多年的人在这里心理崩溃+利益诱惑双杀，交出筹码后股票起飞（\"乌龟变兔子\"）。耐心是高风险投资者的必修课，\"这门课不达标，财富之门未开\"。\n\n## 怎么用\n1. **先定位，再选品质**：用 李大霄底部五判据/李大霄四大风向标 判断当前大概在口诀的哪一段——定位错，情绪选择必错。\n2. **顶部段（狂热）**：练淡泊——\"留一点给别人，不要挣完\"（巴菲特 1 元买中石油 13 元卖，13 和 20 卖没有大区别）；不跟风、不贪婪（巴菲特三不：不贪婪、不跟风、不投机）。\n3. **底部段（绝望）**：练勇气——用余钱+低位分批播种子，\"不要因为恐惧而丢失了宝藏\"。\n4. **中部段（震荡磨人）**：练坚持——预先接受\"3000 点需要时间\"，把\"等待\"写进计划（见 定投计划落纸面），用计划对抗心魔；\"最大的心魔来自自身\"。\n5. **环境管理**：熊市远离\"话题回避\"的聚会氛围、牛市警惕\"席地而坐的股评大会\"——牛市熊市在话题/电话/电视栏目/招聘上的反差（书中对照表），本身就是情绪温度计。\n\n## 常见误读\n- \"勇气=抄底梭哈\"：口诀的前提是 余钱投资三原则——勇气指的是敢用余钱分批买便宜的好资产，不是杠杆赌点位。\n- \"淡泊=不赚了就跑\"：淡泊是顶部不贪最后一截，不是底部割肉\"佛系\"。\n\n## 来源\n李大霄投资战略（第三部分全篇；第四部分 恐惧踏空还是恐惧套牢/牛市和熊市的回忆）\n\n## 相关概念\n钟摆与周期 —— 情绪钟摆的理论底座；情绪风险 —— 情绪如何直接变成亏损；交易认知偏差 —— 从众/损失厌恶的心理学机制；第二层次思维 —— \"舆论一边倒\"的反向思考训练",

   "source": "03-知识/方法/生命周期资产配置.md",
   "body": "# 生命周期资产配置\n\n> 一句话：**把\"股票/债券配多少\"交给人生阶段决定——年轻时多股票、年长时转保守、但别全退；配比与再平衡比选什么股票重要得多（决定 90% 以上的收益）。**\n\n## 是什么\n伊博森研究：投资者获得的总收益中，**90% 以上取决于选择了哪些资产类别以及各自的比例**，具体选哪些股票或基金决定的收益不到 10%。所以人生中最重要的投资决策不是\"买哪只\"，而是\"股票、债券、房地产、现金各配多少\"。\n\n作者给出资产配置五原则（第14章）：\n1. **风险与收益相关**：想多赚只能多担风险——1926～2017 大盘股年化约 10%，但每 10 年约有 3 年亏钱，\"天下没有免费的午餐\"；\n2. **实际风险取决于持有期**：持有 1 年，股票可能 +52% 也可能 −37%；持有 25 年，即使赶上最差的 25 年时段也只比平均低约 4 个百分点。**能拿得越久，股票占比越该高**；\n3. **定期定额（DCA）能降低择时风险**：巴菲特的\"汉堡测验\"——未来 5 年你是净储蓄者，就该盼着股价跌才对（跌了同样的钱买更多份额）；DCA 让你不会在错误时点一次性满仓；\n4. **再平衡降风险、还可能增收益**：60:40 每年调回一次，22 年实测年化从 7.71% 提到 7.83% 且波动更小——\"低买高卖的小精灵\"；\n5. **风险态度 ≠ 风险承受能力**：前者是\"你晚上睡得着吗\"（主观），后者是\"你的财务状况扛得住吗\"（客观：收入类型、收入来源、年龄），两者要分开算。\n\n## 具体怎么做\n1. **特定需求用专用资产，期限匹配**：一年后要付的首付 → 存 1 年期存单/货币基金；3～6 年后要付的学费 → 到期日匹配的零息债券/定存。**\"要用的钱\"绝不放进股市**——它没有时间等波动过去。\n2. **先做两道风险体检**：①财务上：收入稳不稳？这钱几年内会不会动？失业/大病有无兜底？②心理上：想象组合跌 50%（2008 年式熊市），你睡得着吗？睡不着就调低股票比例。别人推荐的比例必须按你的\"安睡线\"再改一版——这是艺术，不是科学。\n3. **先强制储蓄，再谈配置**：还没有可配置的资产？用固定账户每周/每月存固定金额（哪怕每月 100 元），复利 + 时间会滚成巨款；优先放进有税收优惠或雇主配比的账户，用免佣低成本基金——小额投资最怕被费用吃光（第12章还强调：先备好现金储备与保险，再谈投资）。\n4. **按年龄定股债配比（作者的分龄建议）**：\n   - 20 多岁：**激进型**——股票权重很高，且含大比例外国股（含风险较高的新兴市场），年轻人来日方长，能穿越牛熊、能用工资弥补亏损；\n   - 随年龄渐长：逐步削减高风险资产，增持债券、股利增长型股票、REITs；\n   - 约 55 岁：开始向退休过渡，组合转向**收入导向**（债券比例增加、股票更保守）；\n   - 退休后：偏重债券与债券替代品，**但即便年近七旬，也至少保留约 40% 股票 + 15% 房地产权益（REITs 指数基金）**以抗通胀——作者已推翻\"债券比例≈年龄\"的老经验法则（人活得更长了，股票比例应相应提高）。\n   - 工具：用覆盖整个市场的低成本宽基指数基金搭建（多样化 + 股利再投资 + 小额可投），别用个股自己拼。\n5. **每年再平衡一次**：涨多的类别卖一点、跌多的买一点，让配比回到目标（如 60:40）。机械执行=自动\"低买高卖\"，还能把风险压回你的承受线内；**即便当年不缺钱也照做**。嫌麻烦可用\"生命周期基金\"（目标日期基金）让它自动调。\n6. **别让\"收入\"和\"投资\"押在同一处**：通用汽车工长卡尔把薪资储蓄全买通用股票，2009 年通用破产——工作与投资同时归零（安然员工同理）。**永远不要承担与主要收入来源相同的风险。**\n\n> ⚠️ 这条必须有。配置的顺序是：**先应急现金+保险 → 再用\"期限匹配\"处理要用的钱 → 剩余长期资金按年龄分股债 → 每年再平衡**。跳过前三步直接抄年龄配比表，等于没穿鞋就上路。\n\n## 什么时候用 / 什么时候别用\n- 适合：路线 A 的长期资金（养老、教育、财务自由本金）；有明确\"用钱时间表\"的目标（首付、学费）——这类钱恰恰要用\"期限匹配\"而非年龄配比。\n- 不适合：路线 B 短线波段的钱（随时要动的资金，见 机械交易系统）；没留应急现金、没买保险就全仓股市的人。\n\n## 来源\n漫步华尔街（第14章 生命周期投资指南：资产配置五原则、三条一般准则、生命周期投资指南、退休后的投资管理）\n\n## 相关方法\n指数化投资 —— 配置的执行工具就是低成本宽基指数基金；安全提款率 —— 退休期把这份组合\"花到生命结束\"的纪律（本方法的下游）；定投计划落纸面 —— DCA/强制储蓄的落地写法；盈利收益率定投法 —— 想在配置之上叠加\"低估才买\"的估值增强时并存使用（用配置定比例，用估值定节奏）；资产与现金流 —— 为什么要持有能\"生钱\"的股权类资产",

   "category": "路线A · 定投",

   "status": "未学",
   "oneliner": "把资金分成债券 + 股票两部分，让股票部分长期维持在一个固定比例（经典是 50:50）；当涨跌把它推出区间（如 55/45）时，机械地调回 50%。这套\"什么都不预测\"的规则，是格雷厄姆给防御型投资者定的标准动作。",
   "source": "03-知识/方法/股债50-50再平衡.md",
   "body": "# 股债50-50再平衡\n\n> 一句话：把资金分成**债券 + 股票两部分**，让股票部分**长期维持在一个固定比例（经典是 50:50）**；当涨跌把它推出区间（如 55/45）时，机械地调回 50%。**这套\"什么都不预测\"的规则，是格雷厄姆给防御型投资者定的标准动作。**\n\n## 是什么（原文机制）\n\n《聪明的投资者》给防御型投资者的定义与方案（原文 303、279 行）：\n\n> \"我们已把防御型投资者定义为那些主要感兴趣于**投资的安全性和不愿烦恼**的投资者。他应该遵循一个简单的把证券划分成两部分的投资规划，一部分是**合适的债券**，另一部分是**多样化的主要普通股**。\"\n\n两种执行方式（原文明确给出，格雷厄姆更倾向第一种）：\n\n| | 做法 | 评价 |\n|---|---|---|\n| **① 固定比例法**（推荐） | **永远 50%**；当市场大幅上升或下降使比例变成 **55% 或 45%** 时，做**不经常的调整**恢复到 50% | 不需要任何判断，只执行规则 |\n| ② 择时调整法 | 感觉市场危险时把股票**降到 25%**；觉得股票有吸引力时**升到 75%** | 依赖\"感觉\"，可靠性差 |\n\n**比例边界**（原文 279 行）：股票部分\"最低限为 **25%** 而最高限为 **75%** 以内\"——即**任何时候都不全仓股票、也不清空股票**。\n\n## 为什么有效（机制，不是玄学）\n\n1. **它把\"预测\"换成了\"规则\"**。你不需要判断市场高低——规则会在**涨后自动减仓、跌后自动加仓**，这就是**强制性的高抛低吸**。\n2. **它天然对抗两个最大的行为偏差**：牛市末期的 FOMO 加仓（再平衡强制你卖）、熊市末期的恐慌清仓（再平衡强制你买）。这与 系统1与系统2、前景理论 描述的机制**正面对撞——规则绕开系统 1**。\n3. **它的收益来源可以解释**：股票长期收益高于债券（回报三变量公式），保持一定股票比例吃到这个溢价；同时在股票估值极端时被动降低权重，避开 均值回归 的回落。\n\n## 与 生命周期资产配置 的分工（别混同）\n\n| | 格雷厄姆 50:50 | 马尔基尔 生命周期 |\n|---|---|---|\n| 股票比例 | **恒定**（一生 50:50 也活得很舒服） | **随年龄滑行**（年轻时高、临近退休降） |\n| 调整依据 | 偏离阈值（客观） | 年龄与人生阶段（客观） |\n| 核心动作 | **再平衡** | **换挡 + 再平衡** |\n\n**两者不冲突，可组合**：用生命周期确定\"目标比例\"，用 50-50 的**偏离阈值（±5 个百分点）**决定\"何时动手调回\"。用户当前路线 A 属长期积累期，目标比例可偏股票端（如 60:40 或 70:30），但**再平衡阈值同样适用**。\n\n## 怎么用（可执行版）\n\n1. **定目标比例**：保守取 50:50；年轻/长期资金可 60:40 ~ 70:30（但股票部分**别超 75%**）。\n2. **设触发阈值**：**偏离目标 5 个百分点**时动手（55/45、75/25 之类），**不必每月调**——原文强调\"不经常的调整\"。\n3. **股票侧用宽基**：A 股场内可用沪深300 / 中证500 / 中证全指 ETF（别只押一个，见 三种漫步步伐 的\"买下整个市场\"）；债券侧用国债 ETF、政金债 ETF 或货币基金。\n4. **一次调回目标比例**（不是调一半），只做\"卖出超配、买入低配\"这一个动作。\n5. **至少每年体检一次**，即便没触发也看一眼（防惰性）。\n\n**数字例**：100 万，目标 50:50（股 50 万 / 债 50 万）。\n- 股票涨 40% → 股 70 万 / 债 50 万 = **58:42**，超阈值 → 卖出 10 万股票、买入 10 万债券 → 回到 60 万 / 60 万（50:50）。\n- 股票跌 30% → 股 35 万 / 债 50 万 = **41:59**，超阈值 → 卖出约 7.5 万债券、买入约 7.5 万股票 → 回到 42.5 万 / 42.5 万。\n\n## ⚠️ 代价与边界\n\n- **再平衡会牺牲一点收益**（把上涨中的资产卖早了），换来的是**更小的波动与更可信的\"拿得住\"**。**这是费用，不是收益**——不要用\"再平衡后它又涨了\"来否定规则（那是 后见之明与结果偏见）。\n- **与\"越跌越买\"不矛盾，但要协调**：路线 A 的宽基定投本身就是把现金流按周期投入股票侧，**可以视为持续的小额再平衡**。当比例已严重超配债券时，\"越跌越买\"的动作就是再平衡动作——两套语言说的是同一件事。\n- **它不能解决\"买什么\"**：50:50 只解决\"怎么配、怎么调\"，股票侧该买宽基还是个股由 三种漫步步伐 / 指数化投资 决定。\n\n## 来源\n聪明的投资者（第1章 防御型投资者的划分与比例；第5章 防御型投资者与普通股）\n\n## 相关方法\n生命周期资产配置 —— 上游：目标比例怎么定；防御型投资者纪律 —— 同一本书的操作总纲；机械交易系统 —— \"用规则绕开情绪\"的同一种思路；安全提款率 —— 退休后从这套组合里提钱；定投计划落纸面 —— 把比例与阈值写进计划表",
   "id": "03-知识/方法/股债50-50再平衡.md"

   "oneliner": "股票和债券的收益差走到历史极端时，就是该换仓的信号——股债差历史高位（股票极度便宜、债被抢疯）=配置股票的最佳时机；历史低位（股票狂热、债被嫌弃）=该往债里退。绝大多数人永远做反。",
   "source": "03-知识/方法/股债差择时.md",
   "body": "# 股债差择时\n\n> 一句话：**股票和债券的收益差走到历史极端时，就是该换仓的信号——股债差历史高位（股票极度便宜、债被抢疯）=配置股票的最佳时机；历史低位（股票狂热、债被嫌弃）=该往债里退。绝大多数人永远做反。**\n\n## 是什么\n李大霄 2024 年提出的核心配置指标。2024 年 2 月 5 日：10 年期国债收益率创 2.40% 历史新低、28 万亿公募基金里股票基金只占 2.6 万亿（重债轻股到极致）、上证 2635 点——此时\"股债差已达历史高位区，继续弃股追债往往是错误的\"。一周后市场 V 型反转。逻辑本质：**全市场的资金在股债之间的错配程度，本身就是估值情绪的镜像**——钱疯抢什么，什么就贵；被抛弃的，就是便宜的。\n\n## 具体怎么做\n1. **看两头**：股票端看主要宽基/红利指数的股息率与 PE（如上证50、沪深300、红利、央企指数）；债券端看 10 年期国债收益率。股息率远高于国债收益率=股债差处于高位（股票便宜）。\n2. **看资金结构佐证**：股债配置是否到极端（货基/债基规模暴涨、股基规模萎缩=重债轻股到极致；反之 2021 年\"基民疯抢股票基金\"=重股轻债到极致）。\n3. **极端=行动区**：股债差历史高位 → 分批把余钱向股票资产（宽基/红利 ETF）倾斜；历史低位 → 逐步兑现、向债/现金回撤。**注意是\"倾斜配置比例\"，不是全进全出。**\n4. **与个人承受力对齐**：股票配置上限只能是余钱；先基金后个股；配置比例必须与自身风险承受能力相适应——择时信号再好，也不改变\"余钱+量力\"前提。\n\n## 什么时候用 / 什么时候别用\n- 适合：年度/季度级别的大类资产再平衡决策；给路线 A 定投的\"加仓档/减仓档\"提供独立于估值的第二确认（估值+股债差双信号共振时可靠性最高）。\n- 不适合：短线择时；债券收益率短期波动受政策/流动性影响大，别用\"几天\"的变化当信号——看的是**历史分位**，不是绝对值。\n\n## 来源\n李大霄投资战略（2024-02-05/07《股债配置比例纠偏或已开始》；2023-08-08 股债差历史高位）\n\n## 相关方法\n李大霄底部五判据 —— 股债差是其中估值与资金判据的量化体现；李大霄四大风向标 —— 另一独立信号源；安全边际 —— 背后共通的\"买被抛弃的好资产\"原理",

   "body": "# 高估五类\n\n> 一句话：**小、新、差、题材、伪成长——五类最容易被高估的股票，也是散户财富消灭效率最高的五个坑。\"很多人用毕生积累的财富，就因为缺乏知识购买了高估五类股票而消耗掉了。\"**\n\n## 是什么\n李大霄给 A 股高估值重灾区起的总名，与之对立的是\"最低估最优质最核心的蓝筹龙头\"：\n\n| 类别 | 为什么总被高估 |\n|---|---|\n| **小**（小盘股） | 盘子小易拉抬，\"重组神话\"温床；产业资本减持主要发生在这一层 |\n| **新**（新股/次新股） | 打新炒新的\"击鼓传花\"：打新一族→吹新→炒新→追新→**接新一族（韭菜）**；注册制破发常态化后，\"前四族割第五族\"的游戏终结 |\n| **差**（差公司） | 无分红、不创造回报、从上市起就在毁灭财富的公司，靠壳价值与炒作维持股价 |\n| **题材** | 概念/热点/故事驱动，脱离基本面——\"美其名曰长期投资其实都是幌子\" |\n| **伪成长** | 讲成长故事但兑现不了利润的公司，用\"未来\"给当下高估值辩护 |\n\n中石油 48.6 元上市首日是\"高估五类\"的教科书案例：媒体一边倒\"亚洲最赚钱公司\"，负责人答\"对股价非常满意\"（= 远超其预期）→ 之后十年套牢一代散户。\n\n## 怎么用\n1. **买入前先做排除法**：这只股票/基金是不是五类之一？是 → 按李大霄的标准直接出局（除非你能证明市场错估了它——那是专业投资者的活）。\n2. **识别它什么时候最危险**：高估五类在**牛市狂热期**涨得最凶、\"最动听最潮流最吸引人\"——恰恰是该警惕的时刻（5178 地球顶、2021 万亿巨量炒板块）。\n3. **反向定位**：五类的镜像=低位蓝筹龙头。选股顺序要**正着选**：低位先选全球最好的公司→全国第一→全国第二，\"绝大部分人是倒着选的\"（贪便宜买差的、小的）。\n4. **与纪律框架对照**：路线 B 题材 ETF 短线不代表认可\"题材股高估合理\"——做题材波段赚的是情绪差价，必须配 -5% 硬止损（见 止损触发三问）；把题材当长期投资拿住，正是李大霄批判的误区。\n\n## 常见误读\n- \"小而美=成长\"：小不等于成长，多数小公司生命周期只有 6~7 年（企业生命周期规律），给小公司蓝筹估值才是风险。\n- \"新股稀缺\"：新股供应其实无限（股票数量没有上限、审批节奏可松可紧），\"稀缺\"只是发行管制的错觉。\n\n## 来源\n李大霄投资战略（后记；第五部分 新股破发预示市场转弱；第一部分 企业生命周期）\n\n## 相关概念\n安全边际 —— 高估五类的反面：只在价格远低于价值时动手；均值回归 —— 高估终将回归的机制；最小阻力线 —— 题材为什么短期能涨（它是阻力最小的方向，但不是价值）",
   "id": "03-知识/概念/高估五类.md"

   "oneliner": "从内心深处承认——账户里每一分盈亏都是你自己造成的，市场不欠你任何东西。 停止责怪市场、运气、消息，这是交易心理成熟的第一道门。",
   "source": "03-知识/方法/为结果负责.md",
   "body": "# 为结果负责\n\n> 一句话：从内心深处承认——**账户里每一分盈亏都是你自己造成的，市场不欠你任何东西。** 停止责怪市场、运气、消息，这是交易心理成熟的第一道门。\n\n## 是什么\n人从小习得\"外部归因\"：玩具被抢走、被强迫做不喜欢的事——痛苦都是别人造成的。交易时这套本能会复活：亏了怪市场\"耍我\"、怪庄家、怪消息，于是陷入愤怒、报复性交易、或干脆瘫痪。而事实是：**市场是零和游戏，它的唯一目的就是从你身上赚钱；它不负责满足你的期望。** 你的每一笔交易决策、仓位、止损都是自己按的按钮——接受这一点，你才可能改进。\n\n## 具体怎么做\n1. **区分\"可控\"与\"不可控\"**：行情不可控、消息不可控、他人行为不可控；**你的入场规则、仓位大小、止损执行、是否复盘**完全可控。把注意力 100% 放到可控项上。\n2. **亏了先问自己，不先怪市场**：止损触发 = 系统在正常工作（这笔的\"成本\"付掉了）；唯一要复盘的是\"我有没有按系统做\"。若按系统做仍亏 → 正常，继续下一笔。\n3. **写交易日志归因**：每笔结束记一行——进/出场是否违反规则？仓位是否符合 海龟头寸规模？情绪是否有波动？**只归因于自己的决策，不写\"市场不好\"。**\n4. **警惕\"报复市场\"念头**：因为一笔亏损而想\"我偏要赚回来\"、手动乱动——这是在跟市场怄气，把童年\"被夺走\"的情绪投射到市场。发现即停手，关软件。\n5. **把\"等回本\"改成\"认了\"**：沉没成本（交易认知偏差）让人等回本价才卖。为结果负责 = 这笔亏了就亏了，只按规则决定现在去留。\n\n> ⚠️ 这是\"知道但做不到\"的典型：你以为自己负责了，但行为（扛单、怪消息、报复交易）会暴露真相。**用日志和行为自检，不用感觉自检。**\n\n## 什么时候用 / 什么时候别用\n- 适合：每次亏损后、每次想\"再等等\"时、每次复盘时\n- 不适合：用它自我攻击（负责 ≠ 自责，自责是另一种情绪化，见 赢家态度）\n\n## 来源\n交易心理分析（第 3 章 自己承担责任）\n\n## 相关方法\n赢家态度 —— 负责而不自责的心态；概率思维 —— 亏损是概率游戏的成本；机械交易系统 —— 把负责落到规则执行上",
   "id": "03-知识/方法/为结果负责.md"

   "oneliner": "你听到的\"内幕消息\"，常常是别人设计好、等着你接盘的出货广告。 消息不是不劳而获的捷径，而是散户亏钱最快的通道。",
   "source": "03-知识/概念/内幕消息陷阱.md",
   "body": "# 内幕消息陷阱\n\n> 一句话：**你听到的\"内幕消息\"，常常是别人设计好、等着你接盘的出货广告。** 消息不是不劳而获的捷径，而是散户亏钱最快的通道。\n\n## 是什么（说人话）\n机构/内线要高价卖掉手里的股票，靠谁接盘？靠散户。他们不会举着喇叭喊\"我要出货了\"，而是用\"匿名内部人士\"\"重要董事\"\"可靠消息\"当喇叭。利弗莫尔花了两章（23、24）专门解剖这套流程，核心就是一句：**当利好消息传到你耳朵里时，问问自己——谁需要你知道这件事？**\n\n他不是说所有消息都假，而是说：一个对自己有利的真相，持有者通常沉默地买、沉默地卖（\"他们对外不撒谎，他们只是闭口不言\"）。反过来，需要铺天盖地\"解释\"给你听的上涨/下跌，往往是为了让你做出接盘或扛单的行为。\n\n## 能举的例子\n- 书中套路全流程：公司好转 → 内线悄悄吸筹、股价上涨、对外说\"不知道为何涨\" → 吸够了 → 匿名利好开始见报：\"重要董事表示前景鼓舞\" → 公众抢进、股价被推高 → 内线顺势出货。等出货结束，曾经的\"利空解释\"（如\"下跌只是空头打压\"）又开始出现，劝你别卖。（第二十三章）\n- 纽黑文铁路：股价 255 美元一路阴跌到 12 美元，全程都有\"内部人士\"坚称一切正常、是空头在打压——结果抄底的全是接盘侠。（第二十三章）\n- 利弗莫尔自己的教训（第六章）：因听信经纪人转述的\"内幕人士都在抛\"，卖掉了本该持有的联合太平洋多单，错过随后的大涨。\"如果我靠某人的消息买股票，就必须按他的消息卖——那我就是在依赖他，而不是依赖自己的判断。\"\n- A 股映射：题材股连板后\"利好公告+研报吹票\"密集出现，通常对应主力借利好出货；利好出尽变利空。\n\n## 为什么重要 / 常在哪出现\n- 它和 交易认知偏差 里的\"潮流偏差\"互为表里：大众跟风买消息，正是消息制造者想要的行为。\n- 它把\"听消息\"从道德问题还原成**利益结构问题**——不是消息假不假，是消息背后站着谁。\n- 对应到我的操作：买一只 ETF/题材前先问\"如果我听到的是真的，主力为什么告诉我？\"——答案通常是\"因为他想让我接盘\"。\n\n## 来源\n股票大作手回忆录（第六章、第二十三章、第二十四章）\n\n## 相关概念 / 方法\n最小阻力线 —— 用价格行为代替消息做判断；为结果负责 —— 不听消息，才能为自己的判断负责；交易认知偏差 —— 潮流偏差/权威偏误是消息能骗到人的心理基础",
   "id": "03-知识/概念/内幕消息陷阱.md"

   "oneliner": "市场本身不带情绪，让你痛苦的不是亏损，是你\"把亏损解读成威胁/背叛\"的心理机制——这个机制才是交易中最大的风险。",
   "source": "03-知识/概念/情绪风险.md",
   "body": "# 情绪风险\n\n> 一句话：市场本身不带情绪，**让你痛苦的不是亏损，是你\"把亏损解读成威胁/背叛\"的心理机制**——这个机制才是交易中最大的风险。\n\n## 是什么（说人话）\n看别人做交易的行情你毫无感觉，轮到自己持仓就心跳加速——差别不在市场，在\"有没有东西 at stake（押上了期望）\"。当你带着\"这笔必须赚\"的期望进场，市场一旦不配合，大脑的\"痛苦回避机制\"就会自动启动：扭曲信息、找理由、犹豫、骗自己\"再等等\"。（见 交易认知偏差）**情绪风险 = 因期望落空而产生的非理性行为风险**，它比市场风险更能毁掉账户。\n\n## 能举的例子\n- 你扛单不止损：不是\"没看到风险\"，是不愿面对\"我错了\"的痛苦，于是大脑自动屏蔽了卖出信号\n- 鲍伯（书中案例）：价格回到进场点他手动平仓\"惩罚市场\"——因为市场居然先让他浮亏了一点，伤了他的自尊\n- 看别人账户亏 50% 你无感；自己亏 5% 就睡不着——at stake 的东西不同\n\n## 为什么重要 / 常在哪出现\n- 消灭情绪风险的唯一办法：**进场前定义好最大亏损（止损），并真心接受它**（见 为结果负责）\n- 接受风险 → 不把信息解读为威胁 → 不扭曲、不犹豫 → 执行不变形\n- 关键心法：**对规则死板，对期望灵活**——规则不可商量，期望（行情怎么走）随它去\n\n## 来源\n交易心理分析（第 2、4、7 章，尤其\"消灭情绪风险\"一节）\n\n## 相关概念 / 方法\n交易认知偏差 —— 情绪风险的具体表现；概率思维 —— 其信念系统能中和情绪风险；为结果负责 —— 接受风险是它的前提",

   "source": "03-知识/概念/最小阻力线.md",
   "body": "# 最小阻力线\n\n> 一句话：**价格不是随机乱走，而是沿着阻力最小的方向运动**——就像水往低处流。交易不是预测涨跌，而是先看清\"哪个方向更省力\"，再顺着它站队。\n\n## 是什么（说人话）\n把市场想成一块倾斜的地面：往上推需要买盘用力（阻力大），往下砸需要卖盘用力（阻力也大），价格最终走的是**推起来最省力**的那条路。利弗莫尔的原话是：\"价格上涨和下跌，是沿着它所遇到的阻力方向波动。怎么走比较省力，它们就怎么走。如果上涨的阻力比下跌的小，它们就往上走，反之亦然。\"\n\n所以看盘的第一目的不是猜顶底，而是**确定方向**：当上涨比下跌省力 → 最小阻力线向上 → 只做多；反之只做空或空仓。等趋势自己露出方向再动手，而不是抢先预测。\n\n## 能举的例子\n- 利弗莫尔研究小麦：价格几个月在 1.1～1.2 美元之间横盘，他不动。直到价格突破 1.2 美元关口、阻力线确立向上，他才买进——此后一路上涨（第十章）。\n- 反向例子（他的教训）：棉花在 12 美分附近窄幅震荡，方向未明。他等不及，\"想自己推它一把\"，结果一买就涨、一停就跌，反复四五次烧掉约 20 万美元，随后真正的涨势才来——**在没有方向时强行预测，是给市场送钱**（第十章）。\n- A 股 ETF 的\"最小阻力线\"白话版：一只题材 ETF 放量突破长期横盘箱体上沿，说明向上的阻力被买盘消化、方向确立——这比我\"看着跌得多就抄底\"靠谱。\n\n## 为什么重要 / 常在哪出现\n- 它解释了 唐奇安突破入场 为什么有效：海龟的\"突破 N 日新高\"本质是在等最小阻力线由下转上那一刻。\n- 它和\"下跌补仓摊平\"是死对头：下跌中价格沿阻力最小的方向（向下）运动，接飞刀是逆着最小阻力线赌反弹。\n- 它是\"顺势而为\"四个字背后的力学原理，也是 等待最佳时机 的理论依据——方向不明 = 没有可交易的最小阻力线，此时该等。\n\n## 来源\n股票大作手回忆录（第十章 试水商品期货市场）\n\n## 相关概念 / 方法\n等待最佳时机 —— 等阻力线明确再进场；唐奇安突破入场 —— 把\"最小阻力向上\"变成机械信号；海龟止损 —— 站错队时的认错机制",
   "id": "03-知识/概念/最小阻力线.md"
  },

   "source": "03-知识/概念/概率思维.md",
   "body": "# 概率思维\n\n> 一句话：把交易当成赌场游戏——**每笔单次的结果无法预测，但重复足够多次后，正优势必然赢钱。** 这是持续赢家与散户最根本的思维差异。\n\n## 是什么（说人话）\n赌场每天面对随机结果却年年稳定赚钱，靠的不是预测哪把会赢，而是\"规则（优势）在自己这边 + 玩得够多\"。交易同理：你不需要预测对每一笔，只需要（1）有一套正期望的系统（见 期望值），（2）每一笔都执行、（3）次数够多。单笔输赢是随机的，长期结果却是确定的。\n\n## 5 个基本事实（必须背下来）\n1. **任何事都会发生** —— 再像的机会也可能失败\n2. **为了赚钱，你不必知道下一步会如何** —— 预测不是盈利的前提\n3. **任何被定义为优势的信号，输赢分布都是随机的** —— 连续亏 5 笔不说明系统坏了\n4. **优势 = 较高的概率，仅此而已** —— 不是\"保证\"\n5. **市场的每个时刻都是独一无二的** —— 别拿过去刻舟求剑\n\n## 能举的例子\n- 你的 29 笔交割单：胜率 44.8% 却亏钱，因为单笔平均亏 8.5 元 > 赚 2.1 元 → 优势在别人那边，次数越多越亏\n- 赌场 21 点只有 4.5% 优势，靠海量牌局稳赚；你有优势时，10 笔、20 笔连亏都只是\"生意成本\"\n- 鲍伯案例：注册交易顾问也\"以为\"自己在用概率思维，直到价格回踩进场点他手动平仓——行为暴露了他其实想\"每把都对\"\n\n## 为什么重要 / 常在哪出现\n- 是\"结果偏好、近期偏好\"（交易认知偏差）的解药：不再因单笔输赢怀疑系统\n- 是坚持 机械交易系统 的心理前提：信概率，才扛得过连亏期\n- 全书第 7 章核心，第 11 章给出训练法（见 概率思维训练）\n\n## 来源\n交易心理分析（第 7 章 交易者的优势：考虑概率）\n\n## 相关概念 / 方法\n期望值 —— 概率思维的数理基础；交易认知偏差 —— 它阻碍概率思维；概率思维训练、机械交易系统",
   "id": "03-知识/概念/概率思维.md"

   "source": "03-知识/方法/概率思维训练.md",
   "body": "# 概率思维训练\n\n> 一句话：像练肌肉一样练\"概率脑\"——先机械执行小系统攒信任，再逐步把\"单笔输赢不重要\"内化成信念。**知道概率 ≠ 用概率思考，行为才算数。**\n\n## 是什么\n很多人\"懂了\"概率思维却做不到（书中鲍伯案例：30 年老手仍手动干预系统）。因为知道是理性层，做到是信念层。训练的目的：把\"我不需要预测对每笔\"从一句口号，变成**亏损时手不抖、连胜时不飘**的身体反应。作者给了三个阶段 + 一套练习。\n\n## 具体怎么做\n**第一步：进入\"机械阶段\"（1~3 个月，最关键）**\n1. **选一个极简单的系统**：就用 海龟交易法则 的突破入场 + 2N 止损 + 10 日退出，或你已有的 机械交易系统。越简单越好，别叠加多个策略。\n2. **缩小到\"不会伤到情绪\"的仓位**：把每单风险降到亏了也完全无感的水平（如账户 0.5%~1%，见 海龟头寸规模）——桥够宽才练得了走钢丝（书中大峡谷桥的比喻）。\n3. **只做一件事：完美执行**：每一笔都按规则进出，一笔不落、一笔不改。此阶段**不考核盈亏，只考核执行率**。\n\n**第二步：观察自己（贯穿全程）**\n4. **捕捉内心对话**：当你想\"再等等\"\"这次不一样\"\"手动改一下止损\"时，当场识别它——这是旧信念（需要知道/需要正确）在抵抗。\n5. **客观记录，不评判**：把每次违规/冲动记下来，不骂自己（自责会激活痛苦回避，见 赢家态度），只当数据看。\n\n**第三步：植入 5 个基本事实**\n6. 把 5 条事实（见 概率思维）写下来放屏幕边，每次下单前默读一遍：\n   ①任何事都会发生 ②不必知道下一步 ③输赢随机分布 ④优势只是概率高 ⑤每刻独一无二\n7. **用行为反证**：连续执行 20~30 笔不手动干预后，你会\"体验\"到——偶尔连亏、随后连赚，总和为正。这种亲身体验比任何道理都更能改写信念。\n\n**进阶（自觉→直觉阶段）**：机械阶段执行率连续达标后，才逐步放开选股自由度；直觉是机械熟练后的副产品，**不可跳过机械阶段直接\"凭感觉\"。**\n\n> ⚠️ 执行率（而非盈亏）是唯一 KPI：哪怕系统连亏 5 笔，只要每笔都按规则走，训练就是成功的；哪怕赚了钱但手动干预了，训练就是失败的。\n\n## 什么时候用 / 什么时候别用\n- 适合：懂了止损/系统但执行不了的人；连续亏损开始怀疑系统的人；想建立\"机械执行\"肌肉记忆的人\n- 不适合：还没有任何系统的人（先读 海龟交易法则 建系统）；已经能稳定执行的人（可直接自觉阶段）\n\n## 来源\n交易心理分析（第 11 章 像交易者一样思考 —— 机械阶段与交易练习）\n\n## 相关方法\n机械交易系统 —— 训练载体；概率思维 —— 训练目标；为结果负责 —— 训练前提；赢家态度 —— 保护训练不中断",

   "category": "路线B · 波段",

   "type": "方法",
   "status": "未学",
   "oneliner": "空仓也是一种仓位——时机不对时，最大的本事是\"不动\"。 等关键信号出现才出手，宁可错过，不要做错。专治\"手痒、怕踏空、乱进场\"。",
   "source": "03-知识/方法/等待最佳时机.md",
   "body": "# 等待最佳时机\n\n> 一句话：**空仓也是一种仓位——时机不对时，最大的本事是\"不动\"。** 等关键信号出现才出手，宁可错过，不要做错。专治\"手痒、怕踏空、乱进场\"。\n\n## 是什么\n利弗莫尔一生最精彩的一战（第十四章）：破产负债后，朋友只给他 500 股伯利恒钢铁的额度，他必须\"第一笔就赢\"。牛市谁都看得见，但他没有立刻冲进去，而是**盯了六个星期**：股价一路上涨他也忍着不买——因为他知道，没有足够本钱时容不得一次失误，必须等到\"最能达到预期效果\"的时机。他刻意不去交易大厅，防止自己手痒乱下单。最后等到价格逼近 100 点的整数关口（他的经验：股票首次突破 100/200/300 整数关口后，几乎总会再涨 30～50 点），在 98～99 点进场，当天收盘 114 点，一夜翻身。\n\n配套的哲学（第十章）：**方向不明时预测涨跌毫无意义**——\"如果市场走不出明确方向、只是窄幅震荡，你要做的是观察，确定区间，在价格没有突破边线之前不要轻举妄动。\" 他的小麦交易也是同理：横盘几个月不动手，直到突破 1.2 美元关口、方向确立才买。\n\n等待的本质不是\"懒\"，而是**把\"怕踏空\"换成\"怕做错\"**：错过一次机会只损失可能利润，做错一次却损失本金 + 心态（可能引发报复性交易）。\n\n## 具体怎么做\n1. **先定义\"什么时机才算对\"**：进场前写下触发条件——方向确立（突破关键位/最小阻力线转向上）、量能配合等。**条件没满足 = 不是机会。**（ETF 可套用：突破箱体上沿放量 → 才算\"关键点到了\"）\n2. **方向不明时强制空仓观察**：震荡、横盘、看不懂时，允许自己不交易。把\"空仓等待\"当成正常状态，而不是\"没干活\"。\n3. **管住手痒的具体技巧**：像利弗莫尔那样物理隔离——自选股不看、行情软件不开，只等触发条件出现再看盘；或给自己设\"当天最多看盘 N 次\"。\n4. **等待期做功课，不做单**：等待不是发呆——研究板块、复盘历史关键位的量价特征、准备好\"信号出现时立刻能执行\"的计划（方向、仓位、止损提前写好）。\n5. **信号出现才执行，不犹豫也不追高**：关键位被有效突破（放量、站稳）→ 按计划进场；没等到信号就涨上去了 → 认，等下一个机会，**不追已远离关键点的行情**。\n6. **每次手痒时问自己一句**：\"我现在进场，依据的是计划里的触发信号，还是怕错过？\" —— 后者就停手。\n\n> ⚠️ 等待 ≠ 永远不动。它的前提是**有一个明确等待的目标（触发条件）**。没有目标地\"等等看\"会退化成犹豫不决、错过真信号。\n\n## 什么时候用 / 什么时候别用\n- 适合：趋势不明/震荡市；亏损后心态不稳时（此时最该等，见 概率思维训练）；大机会出现前保存本金时\n- 不适合：方向已明确、信号已出现却因\"等更低价格\"而不敢进（那是犹豫，不是等待）；定投等长期策略（本就该定时买入，不需择时）\n\n## 来源\n股票大作手回忆录（第十章、第十四章 在股票和小麦期货中东山再起）\n\n## 相关方法\n最小阻力线 —— \"方向确立\"的判断标准；唐奇安突破入场 —— 把\"关键点到了\"变成机械信号；让利润奔跑 —— 等来的好仓位要拿得住；概率思维训练 —— 亏损后管住手、等心态恢复",
   "id": "03-知识/方法/等待最佳时机.md"

   "status": "未学",
   "oneliner": "大钱不是靠频繁买卖赚的，是靠\"坐得住\"赚的——看对大方向之后，拿住仓位，直到趋势自己结束。 专治\"赚一点就跑\"。",
   "source": "03-知识/方法/让利润奔跑.md",
   "body": "# 让利润奔跑\n\n> 一句话：**大钱不是靠频繁买卖赚的，是靠\"坐得住\"赚的——看对大方向之后，拿住仓位，直到趋势自己结束。** 专治\"赚一点就跑\"。\n\n## 是什么\n利弗莫尔最出名的一段自白（第五章）：\"我能赚到大钱，从来不是因为我的思考，而是因为我的坚守。对市场判断正确的人多的是，但既能看对、又能拿住的人极少——这是最难学的事。\" 他早年反复犯的错是：看对了牛市，却在涨了 4 个点时就\"落袋为安\"，等回调再买回，结果眼睁睁看股票涨 10 个点、大趋势走完。\"落袋为安不会让你变穷——但在牛市中，只赚 4 个点你也发不了财。\"（老火鸡的版本：\"如果我现在卖掉，就会失去我的仓位。任何人、哪怕是洛克菲勒，也承受不起丢掉仓位的代价。\"）\n\n赚大钱的公式不是\"胜率高\"，而是：**少数几次大赚，覆盖多次小亏**。而大赚的前提，就是让盈利单跑得足够远——这跟 海龟交易法则 里\"让利润自己奔跑\"的退出哲学完全一致，只是本书把它讲成了\"人为什么拿不住\"。\n\n## 具体怎么做\n1. **进场前先定\"大方向\"**：只在大趋势（最小阻力线方向）明确时进场（见 最小阻力线）。方向不对的仓位谈不上\"拿住\"，先止损。\n2. **建仓后把盈利目标从脑子里删掉**：不预设\"赚 5% 就走\"。大趋势没结束，就不因\"已经赚了不少\"而手痒。老火鸡的做法：拿住，别的什么都不做。\n3. **用\"退出信号\"代替\"盈利目标\"**：什么时候走？不是涨到某个数，而是**趋势被破坏的信号出现**（海龟用反向 10/20 日突破，见 海龟退出）。信号没来，就一直拿着；信号一来，无条件走。\n4. **只让利润奔跑，不让亏损奔跑**：这是配套动作——亏损单要第一时间截断（见 海龟止损），盈利单才允许奔跑。把\"截断亏损\"和\"让利润奔跑\"当成一条规则的两半。\n5. **用日志对抗\"想跑\"的冲动**：每次想提前止盈时，写下\"现在离场是依据退出信号，还是依据恐惧/贪婪？\"——不是退出信号就不动。\n\n> ⚠️ 注意：这是\"坐住\"，不是\"扛单\"。**区分标准 = 有没有退出信号。** 盈利单没有信号 → 坐住；亏损单没有信号 → 更要用规则离场，两者不可混淆。\n\n## 什么时候用 / 什么时候别用\n- 适合：趋势行情（大级别上涨/下跌延续时）；已经持有盈利仓、正纠结\"要不要先跑\"时\n- 不适合：震荡市里\"让利润奔跑\"会坐电梯（利润来回吐）；没有明确趋势、只是搏反弹的单子，不该用\"拿住\"逻辑，而该快进快出\n\n## 来源\n股票大作手回忆录（第五章 \"老火鸡\"的至理名言）\n\n## 相关方法\n海龟退出 —— 系统化的\"让利润奔跑\"退出机制（信号驱动）；海龟止损 —— 另一条腿：截断亏损；概率思维 —— 为什么单笔大赚不重要、整体期望才重要；为结果负责 —— 拿不住时先别怪市场，问自己为什么慌",
   "id": "03-知识/方法/让利润奔跑.md"

   "body": "# 试探建仓与加码\n\n> 一句话：**别一次性重仓押注，先用小仓位\"试水\"验证方向对不对——对了才加码，错了立刻走。** 专治\"一把梭哈\"和\"下跌补仓摊平\"两个极端。\n\n## 是什么\n利弗莫尔从不\"感觉要涨就满仓\"。他的做法（第十章）：先研究行情走势确定最小阻力线方向，然后**先买入计划仓位的 1/5（试探仓）**。买完后看市场反应：\n- **浮盈** → 方向被验证 → 继续加码（金字塔式：越涨越加，加仓量可递增）\n- **浮亏** → 说明\"暂时错了\" → 立刻平掉试探仓，绝不在亏损上补仓摊平\n\n他的原话：\"我只在赚钱的时候才重仓操作，赔钱的时候只亏一点探测性的赌注而已。\" 他自己每轮大行情前都会先\"亏掉五六万美元去试探市场反应\"，看起来贵，但\"真正的行情开始时，这点亏损立即就能赚回来\"。\n\n这跟\"下跌补仓\"（越跌越买、摊低成本）是相反的哲学：**补仓是在亏损上加注，赌它反弹；加码是在盈利上加注，顺势乘胜追击。** 一个逆势赌运气，一个顺势加确定性。\n\n## 具体怎么做\n1. **先定方向和计划仓位**：确认最小阻力线方向后，规划\"这笔交易最多想上多大仓\"（如总资金的 X%）。\n2. **只拿 1/5～1/4 试探**：第一笔只买计划仓位的 1/5～1/4，明确告诉自己\"这是试水，不是全部\"。\n3. **观察反应，用浮盈/浮亏投票**：\n   - 浮亏 → 说明暂时错了 → **按纪律离场**，不补仓、不摊平、不\"再等等\"。错了就认，成本很小。\n   - 浮盈 → 方向被验证 → 进入第 4 步。\n4. **只在浮盈上加码**：价格沿有利方向继续走（如每涨一档/突破更高点），分批加仓，加仓总量不超过计划仓位上限。**加仓的唯一前提 = 已有浮盈。**\n5. **加仓后同样设好总仓位的止损**：仓位变大，风险同步放大，止损线要覆盖全部持仓（可用 海龟头寸规模 的思路统一算）。\n6. **记下每次\"试探失败\"的离场**：试探仓止损是小亏，属正常成本，不叫失败；真正的失败是试探对了却不敢加、或试探错了却补仓。\n\n> ⚠️ 本方法假设你有能力判断\"方向对不对\"——前提是先有 最小阻力线 这类方向依据，而不是随机开仓再靠加码\"救\"。**没有方向的试探 = 赌博。**\n\n## 什么时候用 / 什么时候别用\n- 适合：对方向有初步判断、但不确定的波段/趋势机会；想控制单笔风险时；新标的第一次做、还没摸清脾气时\n- 不适合：已经明确重仓持有的长线定投仓（那是定投的摊低逻辑，见 指数基金投资从入门到精通）；资金极小、连试探仓都低于手续费性价比时；震荡市里\"浮盈加码\"容易被假突破反复扫\n\n## 来源\n股票大作手回忆录（第十章 试水商品期货市场：在试错中寻找市场的方向）\n\n## 相关方法\n海龟加仓 —— 把\"只朝盈利方向加仓\"变成机械规则（每 1/2N 加一单位）；海龟止损 —— 试探失败的离场工具；最小阻力线 —— 加码前必须有的方向依据；海龟头寸规模 —— 总仓位风险怎么算",
   "id": "03-知识/方法/试探建仓与加码.md"

   "source": "03-知识/概念/赢家态度.md",
   "body": "# 赢家态度\n\n> 一句话：**对努力的结果抱有积极期待，同时对任何结果都坦然接受**——因为每个结果都是你当前水平的真实成绩单，指给你该补哪里。\n\n## 是什么（说人话）\n运动员里能进\"状态（zone）\"的，都是不怕犯错的人。不是他们不会错，而是他们不把错误看成\"我很差\"的证据，只把它看成\"我还需要练这里\"的路标。交易同理：赢家态度 = 期待这笔按系统走会有正期望，但如果亏了，接受它——因为亏损不是惩罚，是\"我为参与这个概率游戏付的成本\"，也是暴露我哪个环节还不过关的反馈。\n\n## 能举的例子\n- 餐厅老板不会因为\"今天要买食材\"而痛苦——那是生意成本。交易者该用同样心态看待止损\n- 新手连赢几把就以为自己\"会交易了\"，其实只是没遇到亏损（没付过成本）；赢家态度是**先相信系统，再在亏损中检验自己**，而不是靠连胜建立虚假自信\n- 你复盘后把 108 元当\"学费\"——这就是赢家态度的雏形：接受沉没成本，只提取教训（区别：学费要换来系统升级，不是白交）\n\n## 为什么重要 / 常在哪出现\n- 连胜后的\"过度自信/轻率\"和连亏后的\"自我怀疑\"一样危险，赢家态度能两头对冲\n- 与 情绪风险 相对：赢家态度让亏损不产生情绪伤害 → 不触发扭曲机制\n- 书中定义：赢家态度 = 期待自己努力会有积极结果 + 接受\"无论什么结果，都是我当前发展水平的完美反映，告诉我下一步该学什么\"\n\n## 来源\n交易心理分析（第 3 章 对亏损的反应；第 4 章 持续一致性是一种思想状态）\n\n## 相关概念 / 方法\n情绪风险 —— 赢家态度消除它；为结果负责 —— 态度的行动版；概率思维 —— 态度的信念基础",

   "type": "方法",
   "status": "未学",
   "oneliner": "挂 -5% 止损前先回答「成本用哪个口径」——路线B 的止损基准 = 该批买入成本（FIFO 单笔）× 0.95，不是同花顺/券商默认显示的「摊薄成本」。口径没统一，止损线会系统性偏高、更容易被插针扫掉。",
   "source": "03-知识/方法/成本口径与止损基准.md",
   "body": "# 成本口径与止损基准\n\n> 一句话：挂 -5% 止损前先回答「成本用哪个口径」——路线B 的止损基准 = **该批买入成本（FIFO 单笔）× 0.95**，不是同花顺/券商默认显示的「摊薄成本」。口径没统一，止损线会系统性偏高、更容易被插针扫掉。\n\n## 是什么：三种成本，三个意思\n\n| 口径 | 算法 | 用来干嘛 | 能否当 -5% 基准 |\n|---|---|---|---|\n| **摊薄成本**（同花顺默认「持仓成本」） | 把历史多笔买入加权；部分软件卖出时还把已实现盈亏摊入剩余持仓 | 看账户整体浮盈浮亏 | ❌ 不行——含历史高价单/补仓痕迹，不是任何一笔真实买价 |\n| **保本价** | 摊薄成本 + 手续费摊入 | 看涨到多少不亏不赚 | ❌ 只宜看浮盈 |\n| **FIFO 单笔成本**（analyze.py 用） | 卖出优先抵最早买入批，每批独立核算 | **路线B 每笔建仓独立止损** | ✅ 用这笔：该批成本 × 0.95 |\n\n## 为什么不能拿摊薄成本当止损基准\n\n多批买入被摊薄后，「成本」变成一笔**历史上不存在的加权价**——用它定 -5%，止损触发位置取决于你过去其它买卖的长相，与「**这一笔交易有没有做错**」脱钩。两个直接后果：\n1. 摊薄成本含**历史追高的高价单** → 成本偏高 → -5% 止损线系统性偏高，正好悬在支撑插针区，回踩即被扫；\n2. 摊薄后你会**在单笔几乎不亏的位置被扫出场**（见下案例），却以为是「-5% 纪律」执行的，复盘结论全错。\n\n## 怎么算（正确算成本价五步）\n\n1. 交割单（或交易记录）找出该标的历史**全部买卖**（日期/方向/数量/价格/手续费）。\n2. 按时间 **FIFO 配对**：卖出数量优先抵最早那批买入。\n3. 看当前持仓由哪批买入构成 → 每批**单笔成本 = 该笔成交金额 ÷ 数量**（想把佣金也算进去更保守：把该笔佣金摊入成本）。\n4. **止损 = 该批成本 × 0.95**；分批建仓时各批分开记、分开设止损（每笔独立决策），或对当前持仓批次取加权并在笔记里写明用的是哪批口径。\n5. 挂单前把「成本基准 + 止损价 + 依据的支撑位」写进交易系统/当日计划，**盘中不改**。\n\n## 案例：159583（2026-09-07 裁决）\n\n- 交易链：08-18 买 200@1.786 → 08-25 买 400@1.590 → 08-27 卖 400@1.647 → 09-04 卖 200@1.581。\n- 摊薄成本 ≈1.66 → -5% ≈1.577~1.585：09-04 盘中最低 1.564 触及 → 用户按同花顺口径「止损触发」离场（成交 1.581）。\n- FIFO 单笔：09-04 卖出的 200 股匹配 08-25 @1.590 → 止损 1.5105 根本没到，**实际只亏 -0.57%**。\n- 同一笔卖出，选不同口径得出「触发」与「未触发」两个相反结论——**先定基准，再谈执行与复盘**。\n\n## 关联\n\n止损触发三问 · 海龟止损（止损放哪：结构失效位而非随意比例）· 短线纪律核对表 · 交易认知偏差（锚定/口径依赖）· 复盘笔记_2026-09-07（已删 2026-10-20） · ETF交易系统 3B.2（闸门①价格硬止损，v1.6 起）",
   "id": "03-知识/方法/成本口径与止损基准.md"

   "oneliner": "三问是②逻辑止损的归因工具，不是①价格硬止损的赦免工具——硬止损收盘确认即无条件清仓，无讨论空间。",
   "source": "03-知识/方法/止损触发三问.md",
   "body": "# 止损触发三问\n\n> 一句话：三问是②**逻辑止损的归因工具**，不是①价格硬止损的**赦免工具**——硬止损收盘确认即无条件清仓，无讨论空间。\n\n## 是什么\n\n止损线触发 ≠ \"该不该离场\"的自由讨论时间。本人系统（ETF交易系统 3B）里两条线分工明确：\n\n| 线 | 触发标准 | 触发后 |\n|---|---|---|\n| **① 价格硬止损** | **收盘价 ≤ 该批成本（FIFO 单笔）× 0.95**（盘中插针不算触发） | **次日开盘无条件清仓**，不摊平、不再看 |\n| **② 逻辑止损** | 买入逻辑被证伪（景气/政策/趋势破坏，非大盘噪音） | 盘中直接走，不等价格 |\n\n三问只服务于②：给「盘中破线但收盘未确认」或「没破线但逻辑在动摇」的情形做归因分类——**逻辑破坏 or 价格噪音**。它**不能**用来在①触发后讨论\"要不要留一部分\"。\n\n> ⚠️ **修正记录（2026-09-12）**：本卡旧版写\"触发止损先降档不清仓、以收盘确认+放量为准\"——那是书里针对主观中仓的通用方法，与本人系统冲突。按真源（ETF交易系统 3B.1/3B.2）修正为：**本人系统触发即清仓；触发标准只看收盘价**（放量是三问②的归因参考，**不是触发条件**）；\"先降档保留观察权\"不适用于本系统的小资金试探仓模式——留仓 = 死扛的起点。\n\n## 具体怎么做\n\n**盘中跌破止损线（收盘未到）的三情形**：\n\n| 盘中形态 | 判断 | 动作 |\n|---|---|---|\n| 放量急跌、逻辑线动摇 | ②逻辑止损嫌疑 | 直接走，不等收盘；**拿不准就按①提前执行**（止损可以错一次最多亏 5%，纪律不能破一次） |\n| 缩量阴跌、震荡磨线 | 价格噪音 | 不动，等收盘确认：收盘破 → 次日开盘清；收盘没破 → 持有 |\n| 插针急跌拉回 | 噪音（插针不算触发） | 不动；若连续多日插针逼近止损位，收盘后重估进场位质量（3A.4） |\n\n**收盘确认破线后**：没有三问，次日开盘清仓。要问的只剩一句：\"这笔进场的位置当初设计得舒服吗\"（回 止损触发三问 上游的 3A.4 进场三问）。\n\n**三问本身（盘中决策 / 收盘后归因通用）**：\n1. **利空归因**：是**它自己的事**（成分股暴雷、监管直接打击模式、清盘风险）还是**别人的事**（宏观利率、地缘、板块轮动、外围情绪传导）？\n2. **量价配合**：**放量**（≥2 倍均量）破位？还是**缩量**阴跌 / 插针急跌？资金在跑吗（近几日申赎/流入）？\n3. **逻辑检验**：当初的买入理由还在吗？下跌改变的是\"价格\"还是\"价值\"？\n4. **止损位质量（2026-10-17 v1.18 补）**：扫损价与入场价的距离是否 ≥ 1N（N = 20 日 ATR，见 N值）？且跳空击穿（收盘守得住、次日低开破位）≠ 止损设计错——跳空只能靠仓位公式（3A.4 v1.18）压伤害。**距离 < 1N 被扫 → 是止损位选近了，改公式；距离足 1N 仍被扫 → 正常保费**（记入 判断台账 止损卖飞跟踪，5 日后回看是否新高）。\n\n→ **逻辑破坏**（自己事 + 放量 + 理由没了）→ 清仓不犹豫，这是**认错**，不是止损，认错越早成本越低；\n→ **价格噪音**（别人事 + 缩量 + 理由还在）→ 不构成留仓理由（价格线说话），但影响**下次进场位与仓位设计**；\n→ **灰色** → 收盘后重估，不盘中拍板。\n\n## 什么时候用 / 什么时候别用\n\n- 适合：②逻辑止损的归因判断；盘中破线未确认时的分类；止损后的复盘归因（卖飞 vs 认错）。\n- 不适合：\n  - ①价格硬止损收盘已确认后，用它讨论\"要不要留\"——系统规定无条件清仓，此处无自由度；\n  - A 线定投宽基——越跌越买本来就不设短线止损，别拿这张卡去割定投仓；\n  - 还没触发止损就天天预演\"要不要跑\"——提前焦虑 = 系统1 越权，不是风险控制。\n\n## 来源\n\n海龟止损（入场价−2N 无条件走）给\"线怎么设\"；2%与6%法则 给\"单笔亏多少封顶\"；资金管理四上限 给\"止损宽度由风险预算倒推\"；蜡烛图三原则 给\"止损放形态外侧 + 先算盈亏比\"。本卡补它们没讲的一环：**触发之后怎么办**。实战沉淀自 2026-09-03 监控 159273 缩量回调 + 韩股半导体急跌情绪传导场景；2026-09-12 按系统真源修正触发标准与执行动作。\n\n## 相关方法\n\n- 离场三闸门 —— 本卡的母规则，冲突时以它和 ETF交易系统 3B 为准\n- 交易认知偏差 —— 处置效应/损失厌恶正是\"破位想跑又不敢跑\"的心理根源，机械执行就是对治\n- 系统1与系统2 —— 触发瞬间是系统1 接管时刻，三问就是逼系统2 上岗的清单\n- 钟摆与周期 —— 恐慌端是买点区不是卖点区，别在钟摆极端做清仓决定\n- 外部意见预测法 —— 判断\"这次利空多严重\"，先查同类利空历史怎么走，别信\"这次不一样\"",
   "id": "03-知识/方法/止损触发三问.md"

   "body": "# 海龟止损\n\n> 一句话：入场价下方 2N 处无条件离场——**亏损额度提前锁定，不允许\"再等等、说不定反弹\"。**\n\n## 是什么\n海龟把止损定在\"入场价 ± 2N\"：N 是该品种一天的平均波动幅度（ATR），2N ≈ 两天的平均波动。也就是说，海龟允许市场\"正常抖动两天\"，但超出这个范围就说明判断错了，立刻认错。因为仓位按 1% 风险倒推（见 海龟头寸规模），2N 止损意味着单笔实际亏损 ≈ 账户的 2%，是\"可预期、可承受\"的。\n\n## 具体怎么做\n1. **入场同时挂止损**：做多 → 止损价 = 入场价 − 2N；做空 → 止损价 = 入场价 + 2N。**没有止损就不入场。**\n2. **止损触发就全平**：价格触及止损 → 无条件清仓该标的所有头寸，不商量、不摊平、不\"再看看\"。\n3. **加仓后止损上移**：每加一个单位（间隔 1/2N），把整个头寸的止损同步上移 1/2N，始终让\"最新加仓价 − 2N\"作为统一离场点——保护已有浮盈。\n4. **亏损单绝不下移止损**：止损只能朝有利方向（盈利方向）移动，绝不因\"跌了\"往下挪。\n5. **用条件单执行**：没时间盯盘就把止损价挂成条件单/止损单，让券商系统替你执行。\n\n> ⚠️ 和你现有纪律的关系：你现在用\"成本 −5%\"固定止损，海龟用的是\"入场价 − 2N\"波动止损。两者精神一致（提前锁定最大亏损、不摊平），N 法更科学——波动大的品种止损放宽些不被洗出去，波动小的品种收紧些少亏钱。可逐步把 -5% 升级成 2N。\n\n## 什么时候用 / 什么时候别用\n- 适合：短线波段（题材 ETF、个股）；任何\"这单错了要认\"的交易\n- 不适合：长期定投宽基（路线 A 逻辑是越跌越买，不设止损，别混用）\n\n## 来源\n海龟交易法则（第三章、附：原版海龟止损法则——2N 止损与头寸整体止损调整）\n\n## 相关方法\n海龟头寸规模 —— 仓位与止损成对设计；海龟退出 —— 止损是\"错了立刻走\"，退出是\"赚了让利润跑\"；海龟加仓 —— 加仓时止损同步上移",

   "source": "03-知识/方法/海龟退出.md",
   "body": "# 海龟退出\n\n> 一句话：价格反向跌破过去 10 日（或 20 日）低点时全部清仓——**用一条客观规则让利润奔跑，治\"赚一点就手痒跑\"。**\n\n## 是什么\n海龟有两套退出规则，本质都是\"移动止盈的系统化版本\"：\n- 系统 1：价格反向突破过去 **10 日**低点（做多）→ 清仓\n- 系统 2：价格反向突破过去 **20 日**低点 → 清仓\n\n价格只要还在创新高/不破近期低点就一直持有，一旦跌破近期 N 日低点，说明上升趋势被破坏，无条件全部离场。**不用预测顶部，让市场告诉你趋势结束了。**\n\n## 具体怎么做\n1. **持有期跟踪**：每天收盘后记录\"过去 10 日最低价\"（系统1退出位）。\n2. **跌破就全卖**：当日价格跌破过去 10 日最低点 → 卖出全部头寸（含加仓的单位），一次清干净。\n3. **两种节奏**：交易频繁用 10 日（退得快、锁利润快、但容易被震出）；想抓大趋势用 20 日（退得慢、扛得住回调、利润更大但回吐也多）。\n4. **止损规则仍然生效**：若在退出信号出现前先跌破 2N 止损，按 海龟止损 先走——止损管\"错\"，退出管\"赚\"。\n5. **机械执行**：退出信号出现就执行，不因为\"昨天还涨得好好的\"而犹豫。\n\n> ⚠️ 和你现有纪律的关系：你已经学了我的\"最高价回撤 5% 移动止损\"，海龟的\"反向 10/20 日突破\"是它的近亲——都是**被动离场、不猜顶**。差异在口径：回撤 5% 看价格幅度，10日突破看时间结构。两者选一个练熟即可，别同时纠结。\n\n## 什么时候用 / 什么时候别用\n- 适合：趋势波段；\"拿不住盈利单\"是主要毛病的人\n- 不适合：定投长持（宽基止盈看估值/目标收益，不用短线退出位）\n\n## 来源\n海龟交易法则（第三章、附：原版海龟退出法则——系统1用10日反向突破、系统2用20日反向突破）\n\n## 相关方法\n海龟止损 —— 止损管错、退出管赚；唐奇安突破入场 —— 与退出规则互为镜像（N日新高进、N日新低出）；海龟加仓 —— 加满后靠退出一次性清仓",

   "status": "未学",
   "oneliner": "进场靠\"等\"（右侧确认），离场靠\"触发即执行\"——路线B 没有\"猜顶/猜底\"的离场信号，只有三道事前写死的闸门，触发哪道走哪道：① 价格硬止损（-5%）→ 清仓；② 逻辑止损（逻辑被证伪）→ 不看价格直接走；③ 移动止损（盈利后）→ 锁利让利润奔跑。",
   "source": "03-知识/方法/离场三闸门.md",
   "body": "# 离场三闸门\n\n> 一句话：**进场靠\"等\"（右侧确认），离场靠\"触发即执行\"**——路线B 没有\"猜顶/猜底\"的离场信号，只有三道事前写死的闸门，触发哪道走哪道：① 价格硬止损（-5%）→ 清仓；② 逻辑止损（逻辑被证伪）→ 不看价格直接走；③ 移动止损（盈利后）→ 锁利让利润奔跑。\n\n## 是什么：为什么离场和进场是两套相反逻辑\n\n- **进场怕买早**（接飞刀）→ 所以要\"等证据\"（右侧三信号，见 止跌企稳三信号）；\n- **离场怕犹豫**（扛单深套）→ 所以不能\"等信号确认\"，只能**触发即执行**。想把离场做成进场那样\"再判断判断\"——就是死扛的开始（对应 复盘笔记_2026-09-09（已删 2026-10-20） 23:06 阴跌想放宽止损的冲动）。\n\n## 三道闸门（全部在买入时写好，盘中只执行）\n\n| 闸门 | 何时生效 | 触发条件 | 动作 |\n|---|---|---|---|\n| **① 价格硬止损** | 建仓起一直生效 | 收盘 ≤ 该批成本 × 0.95（成本口径与止损基准：FIFO 单笔，不用摊薄） | **次日开盘无条件清仓**，不摊平、不再看 |\n| **② 逻辑止损** | 建仓起一直生效 | 买入逻辑被证伪（景气/政策/趋势破坏，非大盘噪音） | **不等价格，直接走** |\n| **③ 移动止损** | 浮盈后自动替代① | 自持仓期间最高价回撤 **5%** | 卖出锁利，让利润奔跑 |\n\n**优先级与配合**：\n1. 盘中先看①破没破；拿不准时用 止损触发三问 分类——逻辑破坏走 / 价格噪音可等反抽，但**收盘仍破价格线 → 先离场**；\n2. 判断放盘前盘后，盘中是情绪接管时刻（交易认知偏差：损失厌恶/结果偏好最容易在盘中发作）；\n3. 盈利单绝不允许变亏损单：进入浮盈后立即启用③，止损线随新高上移，每创新高抬一次。\n\n## 关键认知（对照着记）\n\n- **路线B 没有\"到目标价就卖\"**：不知道顶在哪，但\"自最高点回撤 5%\"是确定可执行的，这就是让利润奔跑 + 锁死回撤的原因；\n- **卖飞是常态**：10 次止损约 3 次卖飞是正常价格，是看住另外 7 次大亏的\"税\"；不因单次卖飞否定纪律（交易认知偏差 结果偏好）——真正该审的是**进场位与执行**，不是规则本身；\n- **止损可以错一次（最多亏 5% 试错成本），纪律不能破一次（破了就回到死扛深套）**；\n- 被止损的是**标的**（高位破位分支）≠ 否定**赛道**（软件/云计算景气逻辑可能没变）——止损后想再进，走 止跌企稳三信号 右侧流程重新计划，不扛单、不等回本。\n\n## 路线A 例外\n\n宽基（沪深300/综指等）**不设任何离场闸门**——路线A 只有止盈（估值分位/目标收益率分批兑现），没有止损；两线不许互相污染（ETF交易系统 §一）。\n\n## 与进场配对的一句话记忆\n\n**进场：① 放量收阳 → ② 缩量回踩不破 → ③ 放量突破，买在③；离场：价格破 → 走，逻辑破 → 走，回撤5% → 走。进场最忌追高，离场最忌侥幸。**\n\n> 免责：离场规则服务于\"用纪律代替预测\"，止损触发可能卖飞属正常成本；AI 内容仅供学习参考，不构成投资建议。",

   "oneliner": "衡量一只标的\"一天平均会波动多少\"的尺子，海龟叫它 N，江湖人称 ATR（平均真实波幅）。",
   "source": "03-知识/概念/N值.md",
   "body": "# N值\n\n> 一句话：衡量一只标的\"一天平均会波动多少\"的尺子，海龟叫它 N，江湖人称 ATR（平均真实波幅）。\n\n## 是什么（说人话）\nN = 该品种近 20 个交易日\"平均每天的真实波动幅度\"，单位是价格点数。它回答一个问题：**这只票一天正常会晃多少钱？** 波动大的（如题材 ETF）N 大，波动小的（如沪深300ETF）N 小。海龟用这把尺子统一量所有市场——仓位大小、止损距离、加仓间隔全部用 N 作单位，不同标的就有了可比性。\n\n## 能举的例子\n- 某通信ETF 的 N = 0.03 元 → 它一天平均波动 3 分钱，跌 3 分属于\"日常抖动\"\n- 沪深300ETF 的 N = 0.02 元 → 波动更小，同样的 3 分跌幅对它就偏大了\n- 海龟止损 = 入场价 − 2N：对 N=0.03 的票就是 −0.06 元；止损距离随波动自动缩放\n\n## 为什么重要 / 常在哪出现\n它是海龟整个系统的\"度量衡\"：\n- 海龟头寸规模 用 N 定仓位（1N = 账户1%）\n- 海龟止损 用 2N 定离场点\n- 海龟加仓 用 1/2N 定加仓间隔\n- 技术分析里更常见的名字是 ATR（真实波动幅度均值），由怀尔德提出；海龟的 N 即 20 日 ATR\n\n## 来源\n海龟交易法则（第三章、附：波动性 N 的定义与计算）\n\n## 在本人系统的落点（2026-10-17 v1.18）\n- ETF交易系统 3B.2：止损价首选 `结构位下沿 − 0.5×N`（写不出支撑退回成本×0.95 兜底）\n- ETF交易系统 3A.4：距离三档（<1N 不进 / 1~2.5N 正常 / >2.5N 等回踩）+ 仓位公式 `仓位 = 账户1% ÷ 止损距离%`（治隔夜跳空）\n- 止损触发三问 第 4 问：扫损距离 ≥1N 吗？否 → 止损位选近了\n\n## 相关概念 / 方法\n海龟头寸规模、海龟止损、海龟加仓、止损触发三问",
   "id": "03-知识/概念/N值.md"
  },

   "source": "03-知识/概念/R乘数.md",
   "body": "# R乘数\n\n> 一句话：把每笔盈亏换成\"初始风险的几倍\"来记账——**让不同大小的交易可以放在一起比好坏。**\n\n## 是什么（说人话）\nR = 这笔交易一开始准备承担的风险金额（= 入场价与止损价的差 × 数量）。R乘数 = 实际盈亏 ÷ 初始风险 R。\n- 赚了 1 个 R → 记 +1R\n- 亏了 1 个 R（正好打到止损）→ 记 −1R\n- 赚了 3 个 R → 记 +3R\n\n用 R 记账后，一笔 1000 元赚 50 元和一笔 100 元赚 5 元是同一笔好交易（都是 +0.5R 左右），交易质量不再被本金大小掩盖。\n\n## 能举的例子\n- 你买 1000 股@1.40，止损设 1.33（止损距 0.07）→ 初始风险 R = 0.07 × 1000 = 70 元\n- 若在 1.50 卖出：赚 (1.50−1.40)×1000 = 100 元 → R乘数 = 100 ÷ 70 ≈ **+1.4R**\n- 若在 1.33 止损：亏 70 元 → **−1R**（标准止损单）\n\n## 为什么重要 / 常在哪出现\n- 用来算系统的 期望值：把所有交易的 R 乘数加起来取平均，就知道系统长期赚不赚\n- 帮你看清\"盈亏比\"：连续记录 R 乘数，若平均盈利远小于平均亏损（如你的 +2元 vs −8元），说明赢利单被截断——问题一目了然\n- 由查克·布兰斯科姆发明，范·撒普在《通向金融王国的自由之路》中推广\n\n## 来源\n海龟交易法则（第四章 像海龟一样思考 —— R乘数分布图）\n\n## 相关概念 / 方法\n期望值 —— 由 R 乘数分布算出；海龟止损 —— R 的定义依赖止损价",

   "source": "03-知识/方法/三重滤网交易系统.md",
   "body": "# 三重滤网交易系统\n\n> 一句话：看**三张图**才下单——长周期图只定\"能不能做这个方向\"（第一重），中期图等\"顺大势的逆势回调\"（第二重），短线图挑精确买价（第三重）。三个过滤都通过才出手，否则宁可空仓。\n\n## 是什么\n趋势指标（均线/MACD）和震荡指标（RSI/随机）常给出相反信号：趋势向上时震荡指标说\"超买快跑\"，震荡市里趋势指标被反复打脸。埃尔德不争论谁对，而是**把两类指标分到不同时间周期**：趋势判断看大周期（只回答方向），入场时机看小周期（只回答点位）。\n\n核心规则：相邻时间周期约呈 **5 倍关系**（日线 ←→ 周线 ←→ 月线；5 分钟 ←→ 25/30 分钟）。选定你想交易的中期周期后，决策顺序永远是\"先看大一个级别的图，再回中期图，最后用短线技术进场\"。\n\n## 具体怎么做\n1. **定周期**：选出你的中期周期（想持仓几天→日线；做日内→5 分钟线）。大 5 倍的是\"长期周期\"，小 5 倍的是\"短期周期\"。\n2. **第一重滤网（市场潮流）**：先看长期图（如周线），用趋势指标判牛/熊——**只许顺大方向**。周线向上 → 只允许\"买入或观望\"；周线向下 → 只允许\"卖出或观望\"。方向反了直接出局，这一重就把三分之一的错误选项删掉。\n3. **第二重滤网（市场波浪）**：回中期图（如日线），用震荡指标等**逆着中期小波动、顺着长期大趋势**的机会：周线升 + 日线随机指标跌到 30 以下（超卖回调）= 买点；周线降 + 日线随机升到 70 以上（超买反弹）= 卖点。\n4. **第三重滤网（浪花/入场）**：用短线技术定精确买价——传统做法是\"日线向上突破前一交易日高点买入\"；改进做法是**平均 EMA 穿透挂单**（估算明日 EMA − 平均穿透深度，把限价单挂在回调深处等成交，避免追高）。\n5. **止损止盈配套**：入场前写下三个价：**买入价、止盈价、止损价**，盈亏比 ≥ 2:1。止盈用长期图定（周线的 EMA 价值区间/通道上沿），止损用中期图定（保守、给回调留的空间小）。\n6. **执行纪律**：买入用限价单；只有止损触发才用市价单（没时间计较价格）。每笔交易都必须是某一套系统的信号，\"我看它不错\"不是入场理由。\n\n> ⚠️ 这条必须有。AI 排计划靠的就是这些步骤，不许只剩口号。\n> ⚠️ 别多周期混看：波段者中途切日内图找点可以，但别盯着实时行情动摇持仓；入场信号没触发就每天顺着更新挂单价，直到成交或大方向反转作废。\n\n## 什么时候用 / 什么时候别用\n- 适合：路线 B 的短线/波段（个股、题材 ETF）；信号打架（日线多头 vs 周线空头）时的裁决工具\n- 不适合：路线 A 的长期低估定投（宽基越跌越买不需要\"顺势\"）；市场无趋势（周线横盘、动力系统蓝色）时应减少出手\n\n## 来源\n以交易为生（第 7 章 39 节，正文行 4774–5031）\n\n## 相关方法\n机械交易系统 —— 系统要写下来、信号不可商量；唐奇安突破入场 —— 另一种顺势入场（海龟，突破 20/55 日高点）；2%与6%法则 —— 入场前用铁三角算好这笔允许亏多少",

   "source": "03-知识/方法/唐奇安突破入场.md",
   "body": "# 唐奇安突破入场\n\n> 一句话：价格突破过去 N 日的最高点时买入——**只在\"创新高\"时进场，而不是\"看到涨了\"就追。**\n\n## 是什么\n海龟用唐奇安通道（Donchian channel）找入场点：盯住过去一段时间的最高价/最低价，价格向上突破过去 20 日最高点 → 买；跌破过去 20 日最低点 → 卖。突破的本质是\"市场已经用价格证明了买方的力量\"，比凭感觉追高可靠得多。\n\n## 具体怎么做\n海龟用两套系统，新手先从系统 1 开始：\n\n1. **算突破位**：每天收盘后，记下\"过去 20 日的最高价\"（20日突破位）和\"过去 55 日的最高价\"（55日突破位）。\n2. **系统 1（20 日突破）**：价格突破过去 20 日最高点 → 买入 1 个单位。这是主入场。\n3. **特殊过滤（可选）**：如果上一次 20 日突破是**盈利的**（上次靠它赚到钱），则放弃本次 20 日信号，等价格突破 55 日最高点才入场——避免在震荡市反复被假突破打脸。\n4. **系统 2（55 日突破）**：价格突破过去 55 日最高点 → 买入 1 个单位。过滤更少、趋势更大，用来抓大行情。\n5. **突破确认**：用\"当日价格超越前 N 日最高点\"判断，不预测、不抄底、不接飞刀。\n\n> ⚠️ 对 ETF 的落地：把\"20日突破位\"当你的**扳机**——价格没突破前 N 日高点，就不买。这直接治\"追高\"：追高是买在情绪顶，突破是买在趋势确认起点。\n\n## 什么时候用 / 什么时候别用\n- 适合：有明显趋势的标的（宽基指数、行业 ETF 主升浪）；想戒掉\"手痒乱买\"的交易者\n- 不适合：长期定投（那是按时间+金额，不按突破）；箱体震荡市（假突破多，需要过滤器）\n\n## 来源\n海龟交易法则（第三章、第六章、附：原版海龟交易法则——系统1/系统2 入场法则）\n\n## 相关方法\n海龟止损 —— 突破买入后立刻挂止损，二者必须成对出现；N值 —— 突破位也可用\"均线+N倍ATR\"表达",
   "id": "03-知识/方法/唐奇安突破入场.md"
  },

   "oneliner": "问\"如果我重复做这件事一万次，平均每次赚多少？\"——正期望的系统才值得坚持，单次输赢说明不了任何问题。",
   "source": "03-知识/概念/期望值.md",
   "body": "# 期望值\n\n> 一句话：问\"如果我重复做这件事一万次，平均每次赚多少？\"——**正期望的系统才值得坚持，单次输赢说明不了任何问题。**\n\n## 是什么（说人话）\n期望值 = 平均每次交易的净收益。赌场永远赢钱，不是它每把都赢，而是它每把的期望值为正（哪怕只高几个百分点），重复足够多次就稳赚。交易同理：一个系统的期望值 = 所有交易的平均 R 乘数（见 R乘数）。只要为正，就算经常连亏，长期也一定赚；为负，偶尔大赚也救不回来。\n\n## 能举的例子\n- 你的交割单：29 笔平均每笔 −3.75 元 → **负期望系统**，越做越亏，和你\"再努力一点就能回本\"的感觉相反\n- 一个系统赢 40% 的交易，但赢时平均 +2R、输时平均 −1R → 期望 = 0.4×2 − 0.6×1 = **+0.2R**，值得坚持\n- 胜率 90% 但亏一次亏光所有 → 期望为负，照样破产（交易认知偏差 之结果偏好会骗你以为它好）\n\n## 为什么重要 / 常在哪出现\n- 是\"结果偏好\"的解药：单笔亏钱 ≠ 决策错，单笔赚钱 ≠ 决策对，只看期望\n- 支撑你**机械执行**：正因为相信长期期望为正，才能扛过连亏期不放弃（机械交易系统）\n- 海龟培训第一课：只玩正期望的游戏；用\"平均盈利 ÷ 平均风险\"估算系统的期望\n\n## 来源\n海龟交易法则（第三章 海龟培训课程、第四章 像海龟一样思考）\n\n## 相关概念 / 方法\nR乘数 —— 期望值由 R 乘数平均而来；交易认知偏差 —— 结果偏好是理解期望值的最大障碍；机械交易系统 —— 有信心才执行得下去",
   "id": "03-知识/概念/期望值.md"

   "source": "03-知识/方法/机械交易系统.md",
   "body": "# 机械交易系统\n\n> 一句话：把交易规则写成\"如果 A 就做 B\"的清单，信号出现就执行、不掺情绪——**用系统代替冲动。**\n\n## 是什么\n海龟们 10 个人学同一套规则，结果天差地别，差别不在系统而在执行。机械交易系统 = 把入场、仓位、止损、退出全部预先写成客观规则，交易时只做两件事：等信号、执行信号。它的价值不是\"预测更准\"，而是**强迫你在情绪上头时依然按计划行动**（对抗 交易认知偏差）。\n\n## 具体怎么做\n1. **先写规则，后开账户**：把四个环节都写成带数字的清单——\n   - 入场：突破 20 日新高买入（唐奇安突破入场）\n   - 仓位：每单位风险 = 账户 1%（海龟头寸规模）\n   - 止损：入场价 − 2N 无条件走（海龟止损）\n   - 退出：跌破 10 日低点清仓（海龟退出）\n2. **交易只做匹配**：每笔交易前对照清单问\"现在触发哪条规则？\"触发了就做，没触发就不做——**不触发不做也是操作。**\n3. **禁止盘中改规则**：亏损、浮盈、恐慌、贪婪时一律不改规则；想改，收盘后冷静了再改，且先小仓位测试。\n4. **记录每笔交易**：为什么进、为什么出、是否遵守规则。连续违反 3 次 → 暂停交易，只做模拟。\n5. **先模拟后实盘**：新系统先纸面跑 10~20 笔，验证自己能执行再上真钱。\n\n> ⚠️ 对你的落地：你的问题从来不是\"不知道止损\"，是\"跌到止损位时下不去手\"。机械系统的意义就是把这层\"下不去手\"提前消灭——把止损挂成条件单，让券商执行，你只管事后看记录。**先有系统，再谈预测。**\n\n## 什么时候用 / 什么时候别用\n- 适合：纪律弱、容易情绪化交易的人（最该用）；趋势型策略\n- 不适合：把它当\"稳赚神器\"——机械系统依然会连亏，它的优势在长期期望为正（期望值）\n\n## 来源\n海龟交易法则（第四章 像海龟一样思考、第十章 海龟式交易系统、第十四章 掌控自己的心魔）\n\n## 相关方法\n期望值 —— 系统的底层信心来源；交易认知偏差 —— 机械执行正是为了绕开这些偏差",
   "id": "03-知识/方法/机械交易系统.md"

   "source": "03-知识/方法/海龟加仓.md",
   "body": "# 海龟加仓\n\n> 一句话：只在**盈利方向**每涨 1/2N 加一单位，最多 4 单位——**金字塔式顺势加仓，与\"套牢后补仓摊成本\"完全相反。**\n\n## 是什么\n海龟不一次性满仓，而是分批建仓，但批次只在价格**朝有利方向**移动时加：价格每上涨 1/2N（半个 N）就加 1 个单位，最多加到 4 个单位。这样：对了才加码，越加越赚；错了第一单就被 2N 止损扫出场，不会越亏越多。这是\"让利润奔跑\"的仓位版。\n\n## 具体怎么做\n1. **起步 1 个单位**：突破入场时先买 1 个单位（仓位算法见 海龟头寸规模）。\n2. **盈利才加**：价格每上涨 1/2N，加 1 个单位（做多为例）。例如 N=0.03 → 每涨 0.015 元加一次。\n3. **上限 4 个单位**：任何标的最多持有 4 个单位（原版法则：加满即停，不再追）。\n4. **加仓即上移止损**：每次加仓后，把整体止损上移到\"最新加仓价 − 2N\"，锁住已实现浮盈（见 海龟止损）。\n5. **绝不向下补仓**：亏损单不加仓、不摊平。价格朝不利方向走 → 那是止损的事，不是加仓的事。\n\n> ⚠️ 这就是你云计算TF那笔的反面教材：你一路下跌一路补（1.481→1.462→1.452），是\"向下摊平\"；海龟只在上涨时加（涨了才加码）。记住一句话：**补仓的方向错了，跌了补叫自我安慰，涨了加才叫顺势。**\n\n## 什么时候用 / 什么时候别用\n- 适合：趋势明确的波段交易，想放大盈利时\n- 不适合：新手/纪律未成形阶段（先练好\"1 个单位 + 2N 止损\"，再学加仓）；箱体震荡（加仓容易加在假突破上）\n\n## 来源\n海龟交易法则（附：原版海龟加仓法则——1/2N 间隔、最多 4 单位）\n\n## 相关方法\n海龟止损 —— 每次加仓止损同步上移；唐奇安突破入场 —— 入场扳机；海龟退出 —— 加满后靠退出规则离场",

   "body": "# 短线纪律核对表\n\n> 一句话：三本短线书——海龟交易法则 的数字规则、交易心理分析 的执行心理、股票大作手回忆录 的方向与持仓心法——**合并成一张能打勾的核对表**。每笔交易照表过一遍，用\"流程\"代替\"意志力\"。\n\n## 是什么\n三本书各管一段：海龟给**规则数字**（入场/仓位/止损/退出），心理书给**让规则执行得下去的自检问句**，大作手给**方向判断和拿住仓位的心法**。合成下面 0~5 段共 22 条。用法：每次想交易就逐条过；**任何一条答\"否 / 没有\"，就停手。**\n\n## 核对表\n\n### 0 · 地基（做一次，先写下来）\n| # | 检查项 | 出处 |\n|---|---|---|\n| 0.1 | 我交易的是一套**正期望**系统（平均每笔 >0R），不是\"这次感觉会涨\" | 期望值 |\n| 0.2 | 规则已写成\"如果 A 就做 B\"清单；我承诺盘中不改 | 机械交易系统 |\n| 0.3 | 默诵 5 个基本事实：任何事都会发生 / 不必知道下一步 / 输赢随机分布 / 优势只是概率高一点 / 每个时刻独一无二 | 概率思维 |\n\n### 1 · 盘前：先定方向，再谈买卖\n| # | 检查项 | 出处 |\n|---|---|---|\n| 1.1 | **方向**：最小阻力线向上吗？（突破关键位/箱体上沿放量，或创新高）——方向不明 = 空仓等待 | 最小阻力线 等待最佳时机 |\n| 1.2 | **触发**：现在触发了清单里哪条信号（如突破 20 日新高）？没触发就不做——**不交易也是操作** | 唐奇安突破入场 |\n| 1.3 | **消息排查**：耳边最近有什么\"利好/内幕\"？**谁需要我知道这件事？** 只认价格，不认消息 | 内幕消息陷阱 |\n| 1.4 | **手痒自检**：我现在想买，是因为怕踏空 / 想回本 / 想报复，还是因为信号？后者就停手 | 为结果负责 等待最佳时机 |\n\n### 2 · 下单：先定亏多少，再定买多少\n| # | 检查项 | 出处 |\n|---|---|---|\n| 2.1 | **仓位**：单笔风险 ≤ 账户 1%，用 N 倒推股数/金额 | 海龟头寸规模 |\n| 2.2 | **试探**：首笔只上计划仓位的 1/5~1/4，明确告诉自己\"这是试水\" | 试探建仓与加码 |\n| 2.3 | **止损**：入场同时挂好止损单（入场价 −2N，≈账户 −2%）——**没有止损不进场** | 海龟止损 |\n| 2.4 | **落纸**：方向 / 触发信号 / 股数 / 止损价 / 退出规则写一行，贴屏幕边 | 机械交易系统 |\n\n### 3 · 持仓：让利润奔跑，不让亏损奔跑\n| # | 检查项 | 出处 |\n|---|---|---|\n| 3.1 | **退出位**：每天收盘记\"过去 10 日（或 20 日）最低点\" | 海龟退出 |\n| 3.2 | **加仓**：只朝盈利方向每涨 1/2N 加一单位（上限 4 单位）；亏损单**绝不补仓、不摊平** | 海龟加仓 试探建仓与加码 |\n| 3.3 | **止损移动**：加仓后整体止损上移到\"最新加仓价 −2N\"；止损只准朝盈利方向移动 | 海龟止损 |\n| 3.4 | 想提前止盈时问一句：\"现在走，依据是退出信号，还是恐惧/贪婪？\"——不是信号就不动 | 让利润奔跑 |\n\n### 4 · 离场：两种走法，都无条件执行\n| # | 检查项 | 出处 |\n|---|---|---|\n| 4.1 | **错了立刻走**：跌破 2N 止损 → 无条件全部平仓，不商量、不\"再看看\" | 海龟止损 |\n| 4.2 | **赚了让规则走**：跌破 10/20 日低点 → 全部清仓，不猜顶、不手痒 | 海龟退出 |\n| 4.3 | **离场不是失败**：止损/退出触发 = 系统正常工作，这笔\"成本\"付掉了 | 赢家态度 为结果负责 |\n\n### 5 · 复盘：只归因自己，只看执行率\n| # | 检查项 | 出处 |\n|---|---|---|\n| 5.1 | **归因**：日志只写\"我遵守/违反了哪条规则\"，不写\"市场不好/消息坑我\" | 为结果负责 |\n| 5.2 | **沉没成本**：不许\"等回本再卖\"；亏了就认，去留只按规则 | 交易认知偏差 |\n| 5.3 | **单笔不评价**：赚了不等于对，亏了不等于错；记 R，看长期期望 | R乘数 期望值 |\n| 5.4 | **KPI 是执行率不是盈亏**：连亏 5 笔但都按规则 = 成功；赚了钱但手动干预 = 失败 | 概率思维训练 |\n| 5.5 | **连续违规 3 次 → 停实盘**，转模拟 20~30 笔，执行率达标再回来 | 概率思维训练 |\n\n## 三本书各管哪一段\n- 数字规则（入场/仓位/止损/退出）→ 机械交易系统 及海龟五个分卡\n- 执行心理（想得通、敢负责、练得成）→ 概率思维、为结果负责、概率思维训练、赢家态度\n- 方向与持仓（站对队、拿得住、等得起）→ 最小阻力线、让利润奔跑、试探建仓与加码、等待最佳时机、内幕消息陷阱\n\n## 什么时候用 / 什么时候别用\n- 用：任何短线波段的开仓前、持仓中、离场后；手痒、扛单、想听消息的那一刻，打开它逐条过。\n- 别用：路线 A 长期定投——那是\"越跌越买、不设止损\"的另一套逻辑（定投计划落纸面、双轨并用决策），别拿短线的 2N 止损去砍定投仓，也别拿定投的\"越跌越买\"去补短线亏损单。\n\n## 来源\n海龟交易法则（规则）＋ 交易心理分析（心理）＋ 股票大作手回忆录（方向/持仓）——三书合并，原书卡各自的\"行动\"栏都指向这张表。\n\n## 相关方法\n机械交易系统 —— 本表的总纲；落地时可把 0~5 段做成一张实体卡片/便签贴在屏幕边，逐笔打勾。",

   "oneliner": "把「③线口径」这一个变量放进完整规则里，跑 299 只 ETF × 14 年（2012–2026）——现行浮动③线 0 笔交易；改法固定③线 722 笔、胜率 27.6%、盈亏比 3.35:1、每笔期望 +1.14%、累计 +38,115 元。  ⚠️ 本文是回测实测，不是投资建议，也不是收益承诺。 它证明的是「现行③线在数学上不可触发」这一结构问题及其量级，不是「改了就一定能赚钱」——分年度数据显示 15 年里 6 年负期望。2026-10-01 立，配套 [[③线口径诊断]]（结构诊断）与 [[行情数据源可用性]]（取数规矩）。",
   "source": "03-知识/概念/路线B大样本回测.md",
   "body": "# 路线B大样本回测\n\n> 一句话：把「③线口径」这一个变量放进完整规则里，跑 **299 只 ETF × 14 年（2012–2026）**——**现行浮动③线 0 笔交易；改法固定③线 722 笔、胜率 27.6%、盈亏比 3.35:1、每笔期望 +1.14%、累计 +38,115 元**。\n>\n> ⚠️ **本文是回测实测，不是投资建议，也不是收益承诺。** 它证明的是「**现行③线在数学上不可触发**」这一结构问题及其量级，**不是**「改了就一定能赚钱」——分年度数据显示 **15 年里 6 年负期望**。2026-10-01 立，配套 ③线口径诊断（结构诊断）与 行情数据源可用性（取数规矩）。\n\n## 是什么\n\n对 ③线口径诊断 发现的结构问题做**大样本量化**：把 ①②③ 与完整离场规则一起模拟，在 299 只 ETF、2012–2026 全历史上比较两种 ③ 线口径。\n\n**回测设定**（口径严格对齐 ETF交易系统 v1.16）：\n\n| 环节 | 设定 |\n|---|---|\n| 三信号 ① | 收盘 > 前收 且 量 ≥ 近5日均量 × 1.5；前低 = ① 当日日内低；收盘破前低即作废 |\n| 三信号 ② | ① 之后未被收盘破前低（含弱等价） |\n| 三信号 ③ | 收盘站上 ③线 且 量 ≥ 近5日均量 × 1.5。**③线口径 = 本回测唯一变量**：现行＝①之后各日 high 的最大值；改法＝①当日 high（固定） |\n| 大盘闸门 | 沪深300ETF（510300）收盘 > MA20（**单指数代理**，缺三指数对齐数据） |\n| 仓位 | 试探仓 500 元 → 3A.6 一次补齐到 2,000 元（浮盈 ≥+3% 且收盘站上 MA5） |\n| 离场① | 收盘 ≤ 成本 × 0.95 → 次日按结算价清仓 |\n| 离场③ | 浮盈 ≥15% 启用 `max(成本×0.95, 期间最高×0.95)`；曾达 +20% 抬到成本价 |\n| 价格 | 新浪日K（**不复权**）+ 2%/年分红补偿；**在单位跳变处截断**（见 行情数据源可用性 坑1） |\n\n## 主结果\n\n| 口径 | 笔数 | 胜率 | 平均盈 | 平均亏 | 盈亏比 | 每笔期望 | 累计盈亏 |\n|---|---:|---:|---:|---:|---:|---:|---:|\n| **现行·浮动③线** | **0** | — | — | — | — | — | **0 元** |\n| **改法·固定③线** | **722** | 27.6% | +19.16% | −5.72% | **3.35 : 1** | **+1.14%** | **+38,115 元** |\n\n出场分布：①硬止损 514 笔 / ③回撤 187 笔 / 未平 21 笔。\n\n> **「现行口径 0 笔」在 299 只标的、14 年上复现**——把 ③线口径诊断 的「数学恒等式」从 3 只标的的推导，升级为跨样本实证。\n\n## 安全边际（比期望值更重要）\n\n```\n实际胜率   27.6%\n保本胜率   23.0%     ← 盈亏比 3.35:1 对应的保本线\n安全边际   +4.6pp    ← 只有 4.6 个百分点\n```\n\n**所以必须做成本敏感性**：\n\n| 硬止损 | 阶梯 | 回撤 | 单边成本 | 胜率 | 盈亏比 | 每笔期望 | 安全边际 |\n|---|---:|---:|---:|---:|---:|---:|---:|\n| **5%（现行）** | 15% | **5%（现行）** | 0.0% | 27.6% | 3.35 | **+1.14%** | +4.6pp |\n| 5% | 15% | 5% | 0.1% | 26.7% | 3.27 | +0.84% | +3.3pp |\n| 5% | 15% | 5% | 0.3% | 24.9% | 3.33 | +0.47% | **+1.8pp** |\n| 5% | 15% | **8%** | 0.3% | 23.9% | 3.93 | +1.05% | +3.6pp |\n| **9%** | 15% | **8%** | 0.3% | 33.0% | 2.48 | **+1.44%** | **+4.2pp** |\n| 9% | 15% | 8% | 0.0% | 35.4% | 2.51 | **+2.28%** | +6.9pp |\n\n**36 组网格中 33 组正期望**；翻负的 3 组都是「硬止损 5~9% + 回撤 5% + 成本 0.3%」。→ **结论不是靠零成本假设撑起来的**：按 0.3% 单边成本（对 ETF 已偏高，见 指数基金费用清单 实测），现行参数仍为 **+0.47%**。\n\n> 实测佣金参考：大同证券单笔 ≤6,000 元收 0.3 元固定、>6,000 元按万 0.5（ETF交易系统 §四）——**真实成本远低于 0.3%**，故上表 0.3% 列是**压力测试**而非实际值。\n\n## ⚠️ 致命弱点：市场状态依赖极强\n\n**分年度结果（改法·固定③线）**\n\n| 年 | 笔数 | 胜率 | 平均 | 判定 |\n|---|---:|---:|---:|---|\n| 2012 | 3 | 66.7% | +7.13% | ✅ |\n| 2013 | 13 | 0.0% | −5.01% | ❌ |\n| **2014** | 14 | 57.1% | **+13.46%** | ✅ 趋势市 |\n| 2015 | 15 | 13.3% | −3.07% | ❌ |\n| **2016** | 14 | 64.3% | **+13.13%** | ✅ |\n| 2017 | 8 | 50.0% | +4.81% | ✅ |\n| 2018 | 9 | 22.2% | −0.98% | ❌ |\n| 2019 | 19 | 26.3% | +0.99% | ➖ |\n| **2020** | 37 | 45.9% | **+6.39%** | ✅ 趋势市 |\n| 2021 | 42 | 14.3% | −1.95% | ❌ |\n| 2022 | 52 | 19.2% | −0.64% | ❌ |\n| 2023 | 63 | 17.5% | −1.38% | ❌ |\n| **2024** | **132** | **21.2%** | −0.29% | ❌ **交易最频繁却低于保本线** |\n| **2025** | 238 | 37.0% | **+3.04%** | ✅ |\n| 2026 | 63 | **11.1%** | −3.67% | ❌ |\n\n**15 年里 6 年负期望，2021–2024 连续四年不赚钱。**\n\n**结论：系统在趋势市赚钱（2014 / 2016 / 2020 / 2025），在震荡市持续失血。** 这解释了 2025-10 ~ 2026-09 的体感——那段时间沪深300 十年 PE 分位长期在 71%~93%（见 定投加档速查），市场在横盘消化，**恰是系统最不该交易的环境**。\n\n## 什么时候用\n\n- **改规则前**：本文与 ③线口径诊断 是 v1.17 修订的证据基础。\n- **评估「要不要交易」时**：先看当前市场状态——连续震荡期应降低路线B 出手频率（这是本文暴露的最大缺口）。\n- **复核时**：回测脚本在工作区（`bt_B_big.py` / `bt_B_sens.py`），换参数可直接重跑。\n\n## 限制（必读，8 条）\n\n| # | 限制 | 影响 |\n|---|---|---|\n| 1 | **标的池随时间变化**（2012 年仅几只 → 2025 年 238 笔）| 晚近年份权重更大，而晚近年份恰是负期望年 → **结果可能比真实长期表现更乐观** |\n| 2 | 大盘闸门用**沪深300 单指数代理** | 与真源「三指数较弱者」口径不同；未含 R1/R2 弱势豁免通道 |\n| 3 | 未含真实摩擦（涨停无法成交 / 整数手 / 流动性） | 偏乐观 |\n| 4 | 离场用**次日收盘价**近似真源的「次日开盘无条件清仓」 | 有偏差 |\n| 5 | 闸门②（逻辑止损）**未实现**（本轮未启用） | 与人工三问有偏差 |\n| 6 | 价格不复权 + 2%/年分红补偿（近似） | 长期收益略有偏差 |\n| 7 | **未做样本外/滚动验证**；参数网格是在同一段历史上选的 | ⚠️ 有过拟合风险——第五节的最优参数组（9%/15%/8%）**不能直接采用** |\n| 8 | 胜率 27.6% 仅比保本线 23.0% 高 4.6pp | **系统边际薄**，任何未建模的摩擦都可能翻负 |\n\n## 相关\n\n- 结构诊断（先读）：③线口径诊断 —— 为什么现行③线恒不成立\n- 取数规矩：行情数据源可用性 —— 单位跳变截断、point-in-time 分位、股叉叉用法\n- 规则真源与载体：ETF交易系统（§3A.3 / §3B / §四）· ETF交易系统速查卡 · 建仓日志 · 周复盘模板\n- 方法卡：止跌企稳三信号 · 离场三闸门 · 海龟止损 · 让利润奔跑 · 趋势持股与卖出信号清单\n- 心态：概率思维（单次对错 ≠ 系统正确）· 交易认知偏差（结果偏好）\n- 路线A 对照：投资 MOC「路线 A · 定投回测层」节（加档增益小、分红影响大、换标的是风险偏好选择）",

   "body": "# 震荡状态识别检验\n\n> 一句话：为了给 路线B大样本回测 暴露的「震荡年失血」问题找一个开关，试了**三种方案**（震荡暂停 / 震荡减半 / 震荡反向加档），**全部被数据否决**。\n> **核心价值不在结论，而在过程**——它是一次完整的**过拟合识别案例**，并沉淀出一条可复用的判据（见 §五）。\n>\n> ⚠️ **本文是负面结果的留痕，防止以后重复踩坑。不是投资建议。** 2026-10-01 立。\n\n## 是什么\n\n路线B大样本回测 发现系统**在趋势市赚钱、震荡市失血**（15 年里 6 年负期望，2021–2024 连续四年不赚钱）。自然的问题是：**能不能实时识别「震荡」，然后在震荡期降档或暂停？**\n\n本文记录三轮尝试及其检验结果。**三轮全部否决。**\n\n## 三轮尝试与结果\n\n### 第一轮：方案A 震荡暂停新仓 / 方案B 震荡试探仓减半\n\n**震荡判定**（只用当日及之前数据，无未来函数）：\n```\n① 近 20 日振幅 = (max(high) − min(low)) / 中位价 < X     振幅够窄\n② |MA20 近 5 日斜率| < S                                 均线够平\n两条同时成立 → 当日为「震荡日」\n```\n\n**网格**：X ∈ {8%, 10%, 12%, 15%} × S ∈ {0.5%, 1.0%, 2.0%}，共 24 组\n\n| 方案 | 结果 |\n|---|---|\n| **A 震荡暂停新仓** | **24 组阈值全部为负**，Δ每笔期望 **−0.10 ~ −2.28pp**（对比基线 +1.69%）；最差组期望转负（−0.59%） |\n| **B 震荡试探仓减半** | 每笔期望 **±0.00pp**（不改交易、只改金额）；累计金额从 44,591 元降到 23,781~38,455 元 |\n\n**反直觉的关键发现**：把交易按「进场时是否震荡」分组，**震荡期的交易质量反而更高**——\n\n| 阈值 振幅10%/斜率1.0% | 笔数 | 胜率 | 每笔期望 |\n|---|---:|---:|---:|\n| 震荡期进场 | 337 | **28.8%** | **+2.89%** |\n| 非震荡期进场 | 362 | 23.8% | **+0.57%** |\n\n> **机制假说**：③线是「放量突破 ① 结构确立位」的**结构突破**信号。横盘里结构位清晰、假突破少、突破后有反弹空间 → **均值回归友好**；趋势/高波动里结构位频繁被穿透 → 信号失效。\n> 这与市场共识「趋势市用突破、震荡市用网格」**正好相反**。这也解释了方案A 为何越过滤越差：**它挡住的恰是好交易**。\n\n### 第二轮：方案D（反向）—— 震荡加档、非震荡降档\n\n既然震荡期期望是非震荡期的 5 倍，那反过来做：震荡期满仓、非震荡期降档。\n\n**三项检验（关键）**：\n\n**检验① 时间三分**（阈值固定 振幅10%/斜率1.0%）\n\n| 时间段 | 震荡期 | 非震荡期 | 差值 |\n|---|---|---|---|\n| 前半 2012–2018 | n=34 · +6.29% | n=45 · +6.50% | **−0.20pp** |\n| 中段 2019–2022 | n=71 · +1.89% | n=93 · +3.02% | **−1.14pp** |\n| 后半 2023–2026 | n=235 · +3.09% | n=276 · −0.01% | **+3.10pp** |\n| 全样本 | n=329 · +2.78% | n=407 · +1.28% | +1.50pp |\n\n**前三段两段是反的。** 且样本权重严重失衡：前半 80 笔（10.4%）/ 中段 171 笔（22.2%）/ **后半 519 笔（67.4%）** —— **全样本结论基本由最后一段决定**。\n\n**检验② 统计显著性**\n\n```\n均值差 +1.50pp   bootstrap 95% CI [−0.75, +3.68]   含 0 → 不显著\n置换检验 p = 0.176                                  p ≥ 0.05 → 不显著\n```\n\n**检验③ 样本外**（新抓 49 只 ETF，未参与阈值扫描；参数未重新调）\n\n| | 震荡期 | 非震荡期 | 差值 | p 值 |\n|---|---|---|---|---|\n| 样本内（296 只） | 29.2% / +2.53% | 23.3% / +0.85% | +1.68pp | 0.137 |\n| **样本外（新 49 只）** | 27.3% / **+2.60%** | 28.9% / **+2.44%** | **+0.16pp** | **0.943** |\n\n**效应在样本外完全消失。**\n\n## 结论\n\n**修订③「震荡市降档」整体否决**（三种形态全部否决）：\n\n| 方案 | 判定 | 原因 |\n|---|---|---|\n| A 震荡暂停新仓 | ❌ **有害** | 24 组阈值全负，挡住的恰是好交易 |\n| B 震荡试探仓减半 | ❌ **无效** | 期望不变，只减少下注（且减的是最好的那批） |\n| D 震荡反向加档 | ❌ **过拟合** | 时间三分两段为负、p=0.176、样本外消失 |\n\n**v1.17 定稿 = 只含修订①（③线固定口径）+ 修订②（回撤 8%）。修订③ 不做。**\n\n## 五、可复用的判据（本文最重要的产出）\n\n对照 **被采纳的修订①** 与 **被否决的修订③**，可以提炼出一条判据：\n\n| 维度 | 修订①（③线，采纳） | 修订③（震荡降档，否决） |\n|---|---|---|\n| **依据性质** | **数学恒等式**（收盘永远 ≤ 当日最高价）——不依赖样本 | **扫参数扫出来的局部最优**（16 组里挑 1 组） |\n| **实证差距量级** | 299 只 × 14 年：**0 笔 vs 722 笔** | +1.5pp，同量级内 |\n| **方向一致性** | 三只标的 / 全窗口 / 各年度**方向一致** | 时间三分两段为负 |\n| **改动幅度** | **最小**（只改参照物，①②③ 三道关一条未松） | 新增一层状态判断 |\n| **检验结果** | 无需检验（恒等式） | 时间切分 ✗ / 显著性 ✗ / 样本外 ✗ |\n\n> **判据**：\n> **基于「恒等式 / 机制」的改动 + 巨大且方向一致的实证差距 = 可信，可直接落。**\n> **基于「扫参数扫出的局部最优」= 必须过三关：时间切分（且各段方向一致）+ 显著性（p<0.05）+ 样本外（效应不消失）。**\n> 三关缺一不可——本轮检验中，**只做时间切分或只做显著性，都不足以定案；是样本外那一关把它彻底否掉的。**\n\n## 六、仍未被解决的问题（诚实记录）\n\n**「震荡市失血」是真问题，但三轮尝试都没找到可靠的实时识别方法。**\n\n- 网格/区间交易 —— 33 组合正超额 0 个（见 网格交易法 实测节）\n- 震荡降档（A/B） —— 无效或有害\n- 震荡反向加档（D） —— 过拟合\n\n**可能的解释**：**在实时中区分「震荡」与「趋势」的难度，可能高于它带来的收益。** 与此相关的现象：路线B大样本回测 里 2024 年交易最频繁（132 笔）却胜率最低（21.2%）——**系统会在最不该交易的环境里给出最多信号**，而这个「不该」在事前不可判。\n\n**当前采用的态度**：接受 等待最佳时机 的答案——**没有信号就不交易，错过成本 = 0**。这本来就是系统已有的规则，且已被实战验证有效（09-18 → 09-28 期间「等信号」避免了 159995 的 −6.34%）。\n\n## 相关\n\n- 证据链：路线B大样本回测（发现状态依赖）· ③线口径诊断（同期的结构诊断）· 网格交易法 实测节（区间交易否决）· 行情数据源可用性（取数规矩）\n- 规则与草案：ETF交易系统 v1.17 · v1.17修订草案（修订③ 裁决栏已标 ❌）\n- 方法论：概率思维（单次对错 ≠ 系统正确）· 交易认知偏差（结果偏好 / 小数定律）· 等待最佳时机（错过成本 = 0）\n- 学习科学对照：合意困难 / 熟练度错觉 的同类机制——**「看着有规律」不等于「有规律」**",

   "source": "03-知识/方法/2%与6%法则.md",
   "body": "# 2%与6%法则\n\n> 一句话：**单笔最多亏账户的 2%（防\"鲨鱼\"一口咬死），一个月累计最多亏 6%（防\"食人鱼\"群连续吃光）**——把\"我该不该止损、该不该停手\"从情绪问题变成两道数学红线，同时让你当自己的\"交易经理\"。\n\n## 是什么\n账户毁灭只有两种方式：一次巨亏（鲨鱼式）或一串连亏（食人鱼式）。业余者亏 25% 后要赚 33% 才回本，往往就此出局。2% 法则把单笔风险锁死在账户 2% 以内，任何一笔错了也伤不到筋骨；6% 法则给账户设\"月度总回撤上限\"，一旦本月亏损 + 持仓风险达到 6% 就强制停手——这是把\"连败后越赌越大\"的本能硬掰回来。\n\n为什么有用：机构交易员比个人强，不是因为聪明，而是**经理在外面盯着纪律**（超限就开除、月内回撤到线就停）。个人没有经理，就必须自己扮演：2%/6% 就是写进合同的\"经理条款\"。\n\n## 具体怎么做\n1. **每月 1 号记账**：记下账户净资产 → 算出当月红线：单笔上限 = 净资产 ×2%；月度总限 = 净资产 ×6%。\n2. **下单前用\"风险铁三角\"算股数**：\n   - A = 这笔允许的最大风险额（**不超过** 2% 那条线；实际可用 1%，专业者甚至 0.5%）；\n   - B = 每股风险 = 入场价 − 止损价（每股可能亏多少）；\n   - C = A ÷ B = 最大可买股数——**可以少买，绝不超买**。\n3. **合约/期货换算**：把\"每股风险 × 合约乘数 × 手数\"换算成合约总风险，总风险 ≤ A 才做；算出来连 1 手都扛不起就**不做这笔**（选波动与账户匹配的品种，别碰\"抓不住尾巴的老虎\"）。\n4. **6% 月度监控**：月中随时算\"本月已实现亏损 + 所有持仓当前的剩余风险额\"，≥ 6% 就**本月不再开新仓**（已盈利且止损已上移到成本线的持仓不算占用额度）。\n5. **额度不够还想要机会**：平掉一个盈利仓释放额度，或把持仓止损收紧到成本线上方，腾出风险给新仓。\n6. **加仓 = 新交易**：任何加仓单独过一遍 2%/6% 检查，别让同一个标的偷偷堆满额度。\n7. **连亏后的恢复阶梯**：把单笔规模降到平时的 1/5~1/10（如 500 股 → 100 股），**连续两周整体盈利**才允许加一档；只要某周又亏，退回上一档。先活下来，再谈赚钱。\n8. **持仓中不算账**：持仓期只盯管理和止损，别把浮盈浮亏换算成钱（月末/季度末才统计总盈亏）。\n\n> ⚠️ 这条必须有。AI 排计划靠的就是这些步骤，不许只剩口号。\n> ⚠️ 别和\"路线 A 定投越跌越买\"混用：2%/6% 只管带止损的短线单（路线 B）；定投宽基没有单笔止损，逻辑不同。\n\n## 什么时候用 / 什么时候别用\n- 适合：任何有明确入场点+止损点的交易（个股/ETF 波段、期货合约）；连亏后想回本、手痒加码的时刻（用它强制降档）\n- 不适合：路线 A 长期定投；无止损位的\"死扛\"逻辑本身就不该存在\n\n## 来源\n以交易为生（第 9 章 48–52 节，正文行 6048–6525：2%法则 6219、6%法则 6383、恢复阶梯 6466）\n\n## 相关方法\n海龟头寸规模 —— 海龟用\"1% 风险 ÷ N\"倒推股数，埃尔德红线是 2%、建议更小，两套同源互补；海龟止损 —— 2N 止损负责\"单笔错多远算错\"，2%/6% 负责\"账户还能错几次\"；短线纪律核对表 —— 下单段的 1% 风险项可升级为铁三角公式",

   "body": "# 海龟头寸规模\n\n> 一句话：先定\"这笔最多亏多少钱\"（账户的 1%），再倒推买多少股——**仓位由风险决定，不由感觉决定。**\n\n## 是什么\n海龟资金管理的核心发明：**用波动性 N 来定仓位大小**，让每笔交易对账户的伤害是\"预先可知、恒定\"的。原则：任何一笔交易，若价格反向波动 1 个 N（一天的平均波动幅度），账户损失约等于 1%。这样高波动的标的自动少买，低波动的自动多买，账户不会被单笔击穿。\n\n## 具体怎么做\n1. **算 N**：N = 过去 20 日真实波幅的指数移动平均（即 20 日 ATR，算法见 N值）。\n2. **定每单位风险**：账户总资金 × 1% = 每个头寸单位愿意承担的风险金额。例：本金 4000 元 → 1% = 40 元。\n3. **算每单位股数**：1 单位股数 = (账户 × 1%) ÷ (N × 每股价格系数)。对 ETF 简化为：先算\"1N 相当于多少元/股\"，再用 40 元 ÷ 它。\n4. **举例（ETF 简化版）**：本金 4000 元，某 ETF 现价 1.40，N=0.03（一天平均波动 3 分）。1N 的波动 = 0.03 元。1 单位可买 ≈ 40 ÷ 0.03 ≈ 1333 元市值 → 约 950 股，取整 900~1000 股。\n5. **上限控制**：单只标的 ≤ 4 个单位；高度相关的同方向头寸合计 ≤ 6 个单位；总暴露 ≤ 10~12 个单位（原版法则，防止相关性风险一次打穿）。\n\n> ⚠️ 对你（小资金 4000 元）的落地：单笔 1% 风险 × 2N 止损 ≈ 单笔最大亏 80 元（账户 2%），符合我之前给你的\"单笔 1000~1500 元、止损 -5%\"量级。**先有\"这单最多亏多少\"，再决定买多少。**\n\n## 什么时候用 / 什么时候别用\n- 适合：短线波段、任何主动交易；本金小更要用（防几次连亏就出局）\n- 不适合：长期定投宽基（定投是\"越跌越买摊成本\"，与单笔风险无关）\n\n## 来源\n海龟交易法则（第三章 资金管理、第八章 风险与资金管理、附：头寸单位规模法则）\n\n## 相关方法\nN值 —— 一切仓位计算的基础；海龟止损 —— 止损 2N 与仓位 1% 搭配，单笔实际最大亏约 2%",

   "body": "# 资金管理四上限\n\n> 一句话：墨菲给\"一笔钱在多个市场怎么分\"的四条硬上限——**总投入≤50%、单市场保证金≤10-15%、单市场最大亏损≤5%、同群类市场合计≤20-25%**；再配\"4~6 个不相干市场分散 + 报偿-风险比≥3:1 + 复合头寸\"，跟 2%与6%法则 正好一个管多场、一个管单场，拼成完整资金管理。\n\n## 是什么\n期货市场技术分析 第16章给的资金管理要领。埃尔德（2%与6%法则）解决\"单个账户里，这一笔最多亏多少、当月最多亏多少\"；墨菲解决更高一层——**假如账户同时做几个市场/标的，钱怎么分，才不会在同一个坑里反复挨打**。核心思想一句话：**不要在任何单独市场或市场群类中卷入太深，以免接二连三吃亏赔本，招致灭顶之灾。**\n\n## 具体怎么做\n\n### 第一步：记住四条资金上限（以总资本为分母）\n| # | 上限 | 含义 | 例：10 万账户 |\n|---|---|---|---|\n| 1 | **总投入 ≤ 50%** | 任何时候投入市场的钱不超总资本一半，另一半做储备（可放短期债券），防不顺手时被清零 | 最多 5 万在场内 |\n| 2 | **单市场保证金 ≤ 10~15%** | 防\"在一棵树上吊死\"，单个标的别押太多本金 | 单个市场保证金 ≤ 1~1.5 万 |\n| 3 | **单市场最大亏损 ≤ 5%** | 单个标的全军覆没也只亏总资本 5%——**算合约/股数、定止损远近的出发点** | 单个市场最多冒险 5000 元 |\n| 4 | **同群类合计 ≤ 20~25%** | 同一类市场（如多个贵金属、多个科技 ETF）步调一致，同押等于没分散 | 同一板块保证金合计 ≤ 2~2.5 万 |\n\n> 用法：不是四选一，是**四条同时成立**——每笔新仓先问\"这四条超没超\"，任何一条要破线就减仓或放弃。\n\n### 第二步：分散到\"不相干\"的标的，4~6 个为度\n- 分散要真分散：只买 4 个不同的科技 ETF 不算分散（同涨同跌）。\n- 中庸之道：**同时在 4~6 个不相干市场持头寸**；太少=押注太集中，太多=盈利被大量亏损冲抵（\"过犹不及\"，见原书 21 条清单第 8 条）。\n\n### 第三步：报偿-风险比 ≥ 3:1 才动手\n- 定义：每笔交易的**利润目标 ÷ 止损风险**。比例不足 3:1 的信号直接放弃。\n- 为什么：最成功的交易商也只有约 40% 交易盈利——多数交易以小亏收场，唯一希望是\"盈利的额 > 亏损的额\"。风险 1 赔 3，胜率 40% 仍可长期为正。\n- 例（原书）：金价 300 买、止损 290（风险 10 元），则目标至少要到 330（赚 30）；若两度止损后第三次 305 买中、涨到 500，三笔合计 195-20=175 净赢——**小亏几次没关系，赢的那次要够大**。\n\n### 第四步：用复合头寸解决\"让利润跑 vs 怕回吐\"\n- 把同一标的的头寸分成两份：**跟势头寸**（图长期，止损放远，吃大趋势）+ **交易头寸**（图短线，到目标/超买/近阻挡就先平或收紧止损锁定利润，趋势恢复再补回）。\n- 效果：不用在\"平仓获利\"和\"忍过调整\"之间二选一——一份保利润、一份博趋势。\n\n### 第五步：警惕\"赚了立即加码\"的时机陷阱\n- **刚大赚之后立刻放大投入，是最糟糕的时机**（好比上升趋势超买时追买）。\n- 资本金**小有亏损时开始增加投入**，反而让重头投入落在资金低谷而非顶峰——逆人性，但正确（墨菲原文：交易成绩像价格图一样是峰谷序列）。\n\n## 何时用 / 何时不用\n- 用：账户同时持有多标的（ETF 组合、多板块、期货）时，开每笔新仓前过一遍四上限 + 3:1。\n- 不用：单标的、单笔已由 2%与6%法则 或 海龟头寸规模 管住风险时不重复算——墨菲管\"多场分配\"，埃尔德/海龟管\"单场单笔\"，两层都过才下单。\n\n## 关联\n- 上层互补：2%与6%法则（单账户单笔/月度红线）、海龟头寸规模（用波动率定单笔 1%）\n- 执行合并进：短线纪律核对表（下单段）\n- 同书姊妹卡：突破真假三验证（入场信号质量）",
