   "body": "# 《投资最重要的事》\n\n> 一句话：橡树资本掌门人把投资哲学浓缩成一本\"风险 + 周期 + 第二层次思维\"的备忘录合集——**买得好 > 买好的（价格与价值）→ 风险是永久损失不是波动 → 群体心理像钟摆（高买低卖）→ 承认无法预测宏观，靠\"错误边际 + 防御\"活下来**。核心一句：市场不知道将去向哪里，但你要知道自己身处何方。\n\n## 基本信息\n- 作者：霍华德·马克斯，橡树资本（Oaktree）联合创始人，擅长困境债务/高收益债的\"防御型投资\"；巴菲特读了两遍并推荐的书\n- 主题领域：价值投资哲学 + 风险控制 + 周期/心理（认知层，非技术操作）\n- 读它的目的：第四批\"认知收尾\"第一本——给路线 A（长期定投）补上**为什么必须在低估/悲观时买**的完整哲学与心理防线；路线 A 已有的工具（盈利收益率定投法）在这里找到\"敢在恐慌中买入\"的依据\n\n## 全书脉络（21 章备忘录合集，环环相扣）\n**思维地基**\n- **第1章 学习第二层次思维**：人人能得平均收益（买指数即可），**战胜市场必须想人所未想**——第一层次\"好公司就买\"，第二层次\"好公司人人皆知所以不便宜，卖\"\n- **第2章 理解市场有效性及局限性**：有效市场假说部分成立——它让\"廉价货\"少，但**无效才是超额收益的来源**（人犯错、情绪化、信息不对称时）\n\n**价值核心**\n- **第3章 准确估计价值**：价值=资产/现金流/增值潜力；内在价值是锚\n- **第4章 价格与价值的关系**：**低于价值买是最可靠盈利途径**；价格受心理与技术（短期）主导，可脱离基本面\n\n**风险三章（本书最重要的部分）**\n- **第5章 理解风险**：**风险≠波动，风险=永久损失的可能性**；高风险≠高收益，只是结果范围更广\n- **第6章 识别风险**：风险看不见——**在乐观时滋生、在所有人都认为\"没有风险\"时最大**；识别风险靠洞察（过度乐观/为收益承担过高风险）\n- **第7章 控制风险**：防御型投资的核心=不做错事；**错误边际（安全边际）**让你在意外中存活\n\n**周期与心理**\n- **第8章 关注周期**：经济/市场/信贷周期必然波动，\"这次不同\"最危险\n- **第9章 钟摆意识**：群体心理在乐观-悲观间钟摆，**摆到极端时逆向**\n- **第10章 抵御消极影响**：贪婪/恐惧/盲从/嫉妒/自负——识别并对抗，理性必须战胜情感\n\n**行为策略**\n- **第11章 逆向投资**：杰出投资来自\"别人卖出时买进\"；但逆向 ≠ 永远有效，需结合价值\n- **第12章 寻找便宜货**：便宜来自\"对现实认识不足\"，**买得好而不是买好的**\n- **第13章 耐心等待机会**：极端价格不会天天出现——等待、埋伏（联系 等待最佳时机）\n\n**自我认知**\n- **第14章 认识预测的局限性**：**宏观不可预测**；把时间花在\"可知\"的微观（行业/公司）上\n- **第15章 正确认识自身**：知道自己几斤几两，别在高估自己时下重注\n- **第16章 重视运气**：结果≠技术；用长期表现区分运气与能力\n\n**组合与收束**\n- **第17章 多元化投资**：多元有效的关键是**相关性低**，不是数量多\n- **第18章 避免错误**：制胜投资 vs 致败投资；\"避免致败，制胜自来\"\n- **第19章 增值的意义**：α 来自不对称——跌时少亏、涨时跟上\n- **第20章 合理预期**：别想要不切实际的收益\n- **第21章 最重要的事**：全书浓缩（价值→价格→风险→周期→逆向→错误边际→不预测宏观）\n\n## 本书提炼的知识卡\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 第二层次思维 | 概念 | 想人所未想：第一层问\"好不好\"，第二层问\"大家怎么看、价格里装了什么\"（第1章） |\n| 钟摆与周期 | 概念 | 群体心理在乐观-悲观间摆动，位置决定风险收益比，极端时逆向（第8–9章） |\n| 风险是永久损失 | 概念 | **风险 ≠ 波动，风险 = 永久损失的可能性**；风险在乐观时滋生、在\"人人认为没风险\"时最大；防御 = 错误边际（第5–7章） |\n| 买得好而不是买好的 | 方法 | **\"我们的目标不在于'买好的'，而在于'买得好'\"**——好公司人人皆知、价格已反映；便宜来自\"对现实认识不足\"（第4/12章） |\n| 增值的不对称性 | 方法 | α 来自不对称：**涨时跟得上、跌时少亏**——这是区分\"技术\"与\"运气/风格\"的唯一判据（第18–19章） |\n\n> **2026-09-10 补拆（\"去同存异\"批次）**：原书 2 张卡。本轮补 3 张独有卡（风险是永久损失 第5–7章三章连读 · 买得好而不是买好的 第4/12章 · 增值的不对称性 第18–19章）。\n> 第10/14/15/16/17/20/21 章（抵御消极影响、预测的局限、认识自身、重视运气、多元化、合理预期、收束章）**均已并入 钟摆与周期、第二层次思维 与上述 3 张卡**，按去同存异原则不重复造卡；其中\"多元化\"一章（相关性低才是关键）已由 现代投资组合理论 承担。\n\n## 我的感受 / 行动\n1. 这本书和路线 A 是\"哲学配套\"：螺丝钉（盈利收益率定投法）说\"低估才买\"，这里解释**为什么能做到**——因为钟摆摆到恐慌端时，群体在最低价卖出，而价值投资者靠\"价值锚 + 错误边际\"敢接。恐慌不是风险，是机会。\n2. 与 有效市场假说、随机漫步（马尔基尔）形成张力：马尔基尔说\"别想赢市场\"，马克斯说\"无效处就是超额收益来源\"——合起来的答案：**普通人别试图频繁战胜市场（路线 A 宽基定投），但要在极端估值时用战术仓位逆向**（这正是 双轨并用决策 里战术轨的依据）。\n3. 金句三连（都进 MOC）：\"智者始而愚者终\"\"过于超前与犯错没有区别\"\"6英尺高的人可能淹死在平均5英尺深的小河里\"。\n4. 行动：把\"风险=永久损失，不是波动\"写进持仓心理——ETF 定投的账面波动（路线 A）不是风险，**在恐慌中割肉才是永久损失**。",
   "id": "02-来源卡/投资最重要的事.md"

   "oneliner": "把 K 线从\"看涨看跌的图形\"升级成带使用纪律的信号语言——形态只告诉你\"这里可能反转/持续\"，真正的功夫在三条：位置比形状重要（同一根线高位是吊颈、低位是锤子）→ 顺着趋势用信号（牛市的多头信号才买）→ 止损定在形态外侧、动手前先算风险收益比。K 线发信号，西方工具定目标价。",
   "source": "02-来源卡/日本蜡烛图技术新解.md",
   "body": "# 《日本蜡烛图技术新解》\n\n> 一句话：把 K 线从\"看涨看跌的图形\"升级成**带使用纪律的信号语言**——形态只告诉你\"这里可能反转/持续\"，真正的功夫在三条：**位置比形状重要（同一根线高位是吊颈、低位是锤子）→ 顺着趋势用信号（牛市的多头信号才买）→ 止损定在形态外侧、动手前先算风险收益比**。K 线发信号，西方工具定目标价。\n\n## 基本信息\n- 作者：史蒂夫·尼森，第一个把日本蜡烛图系统介绍到西方的美国人（\"蜡烛图之父\"），前作《日本蜡烛图技术》，本书是其\"新解\"\n- 主题领域：K 线（蜡烛图）形态学 + 日本式技术分析（下篇还讲日本人用均线/新价图的方法）\n- 读它的目的：给路线 B（短线）补\"具体到每根 K 线的信号语言\"——海龟/墨菲讲规则与理论，这本讲**入场那一瞬间图形长什么样**；同时纠正\"见形态就下单\"的新手冲动\n\n## 全书脉络（上篇：蜡烛图；下篇：差异指数与新价图）\n- **第1章 概述**：蜡烛图已从日本走向全球，与西方技术分析结合的背景\n- **第2章 基本知识**：蜡烛图结构（实体/上下影线/开盘收盘价）、**长白实体**（低价区=吸筹、突破阻力后变支撑、构成支撑要回抽确认）、长黑实体（镜像）、实体大小/颜色/频率的意义、开盘价与前一实体比较、纺锤线、十字星（多空平衡）、**筹码积聚与派发**、高浪线\n- **第3章 蜡烛图组合形态**（形态库，按根数排列，**位置>形状是核心心法**）：\n  - 单根反转：**锤子线**（长下影小实体，须在大跌/超卖后；先小注试水→回抽验证支撑→加码；止损=锤子线低点下方）、**吊颈线**（与锤子同形，但在高位=卖出）、**流星线**（长上影，顶部反转）\n  - 双蜡烛：**乌云盖顶**（阳线后高开低走收进阳线实体）、刺穿形态（乌云盖顶镜像）、**吞噬形态**（后线实体包住前线实体，多头/空头吞噬）、最后吞噬、包孕形态（前线包后线=犹豫）\n  - 窗口（=西方跳空缺口）：**上升窗口=多头中继、下降窗口=空头中继**；\"反向走势遇窗口而止\"（回调在窗口获支撑）；**收盘价封闭窗口=原趋势结束**（盘中刺穿不算，须等收盘确认）；奔驰窗口（长白实体开启）\n  - 三根以上：**黄昏星**（顶）/ **启明星**（底）——星线组合、迭创新高/低\n- **第4章 蜡烛图与市场的整体技术面**（方法论最重的一章）：\n  - **止损**：定在形态极值外侧（放空→乌云盖顶最高点上方；做多→锤子/启明星低点下方）；\"贯彻止损=控制风险\"，一厢情愿等回本是\"倚靠白云的梯子\"\n  - **风险与收益权衡**：**形态出现≠最佳入场时机**；动手前先算止损到目标的风险收益比，不诱人就放弃（\"全办公室喊十字星\"是危险的）；蜡烛图不发目标价 → **和西方工具配合**（支撑阻力/趋势线/回调位定目标）\n  - **趋势**：**顺着趋势下单、反转信号冲销既有头寸**——上升趋势中的多头信号=买入/加仓机会；熊市里的多头信号只用来平空，不做新多\n  - 做一个市场变色龙、计算机与蜡烛图\n- **第5章 日本人如何使用移动平均线**：黄金交叉/死亡交叉、差异指数、13 周差异指数\n- **第6章 三线反向突破图**：日本式反转图（只在反向穿越三线时画），画法+交易技巧\n- **第7章 砖形图**：忽略时间只记价格的砖块图、交易技巧\n- **第8章 钥匙图**：见阳买入见阴卖出的日本式图表、百分比钥匙图\n- 术语解释（全书名词速查）\n\n## 提炼出的知识\n- 蜡烛图三原则——位置>形状、顺趋势用信号、止损在外侧+先算风险收益比\n\n## 我的感受 / 行动\n1. 这本书跟埃尔德/墨菲是\"分工关系\"：埃尔德讲账户风险、墨菲讲趋势和突破理论，**尼森把镜头推到\"入场那一刻的 K 线形状\"**——短线纪律核对表里\"触发信号\"这一格，终于有了具体的图形长相。\n2. \"收盘确认\"原则与墨菲的 突破真假三验证 完全同构（收盘价穿越才算数、盘中刺穿不算）——两本书在不同尺度上反复确认同一纪律：**别被盘中瞬间骗到**。\n3. 最重要的纠偏：**K 线形态是\"信号\"不是\"圣旨\"**——同是长下影，低位锤子要买、高位吊颈要跑；牛市里空头信号只让你平多、不让你反手做空。这跟 三重滤网交易系统 的\"先看大势再谈信号\"是同一逻辑。\n4. 行动：把\"先算风险收益比再下单\"这一条与 资金管理四上限 的 3:1 门槛合并执行——蜡烛图给信号、墨菲给门槛，**信号不足 3 倍盈亏比就放弃**。\n\n## 本书提炼的知识卡\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 止损触发三问 | 方法 | 止损线是买入前写好的\"最大可承受亏损\"兑现点，它只回答\"风险预算用完了\"，不回答\"该不该离场\"。 |\n| 蜡烛图三原则 | 方法 | 下单前先回答：这个形态出现在趋势的什么位置？ |",

   "body": "# 《期货市场技术分析》\n\n> 一句话：技术分析的\"教科书级百科全书\"——把图表分析从\"看图形猜涨跌\"讲成一套**有心理学根基、有确认规则、有资金管理**的完整学科。短线体系缺的\"假突破怎么滤掉、趋势怎么确认、钱怎么在多个市场分配\"都在这本里补全。**三大基石：趋势(顺)→形态(辨)→资金(管)。**\n\n## 基本信息\n- 作者：约翰·墨菲，技术分析界公认权威，曾任 CNBC 技术分析师；本书 1986 年初版即成为期货/股票技术分析的经典教材\n- 主题领域：技术分析全学科（理论 → 趋势/形态 → 指标 → 交易系统 → 资金管理），期货为主、股票通用\n- 读它的目的：短线路线（路线B）缺的\"技术层\"系统补课——海龟给了规则，这本给规则的**理论依据和反例过滤**；同时补上资金在多个市场的分配法则（埃尔德只讲单个账户）\n\n## 全书脉络（16 章，从理论到实战的教科书顺序）\n- **第1章 技术分析的理论基础**：三大前提（市场行为包容消化一切 / 价格以趋势方式演变 / 历史会重演）；技术 vs 基础之辨（基础问前因、技术看后果，价格是经济基础的超前指标）；杠杆使\"时机抉择\"成为期货生死线——**入市时机只能靠技术分析**；对\"预言自我应验 / 随机行走\"的逐条反驳\n- **第2章 道氏理论**：技术分析的鼻祖——主要/次要/短暂趋势三分法、相互验证原则，及对它的批评\n- **第3章 图表简介**：线图/对数刻度、交易量与持仓兴趣的画法、周线月线图\n- **第4章 趋势的基本概念**：趋势定义（依次上升/下降的峰谷）、三种方向（横向延伸占 1/3 时间=顺应趋势系统最怕的阶段）、三种规模；**支撑与阻挡及其角色互换**、穿越确认标准；趋势线（两点成线、第三点验证、45°最有意义、突破=预警）；管道线；**百分比回撤（33/50/66%，越过 2/3 则反转概率大于调整）**；反转日（顶/底、扩张日、双日、周/月反转远重于日反转）；跳空四类型（普通/突破/中继/衰竭）；岛形反转\n- **第5章 主要反转形态**：头肩形（含倒头肩）、三重顶底、双重顶底、圆顶底、V形——反转形态共有要领、测算技术、过滤器、\"双重顶\"术语被滥用\n- **第6章 持续形态**：三角形（对称/上升/下降）、喇叭形、钻石、旗形三角旗、楔形、对等运动——持续形态出现时**趋势未完、可顺原方向操作**\n- **第7章 交易量和持仓兴趣**：量价配合规则（趋势需放量确认、背离是警告）、持仓兴趣的解释、胀爆/抛售高潮\n- **第8章 长期图表和商品指数**：**\"从长期图表到短期图表\"的看图顺序**（先月/周线定大方向，再日线找时机）、连续图表构造、CRB 商品指数\n- **第9章 移动平均线**：简单/加权/指数均线、单/双/三线交叉法、**4/9/18 天（期货）vs 30周/200天（股票）**、四周规则\n- **第10章 摆动指数和相反意见理论**：动力指数、RSI、随机指标的研读规则、摆动指数何时最有效、看涨意见一致数字（相反意见=看\"余力\"）\n- **第11章 日内点数图**：点数图原理与画法、与线图互补\n- **第12章 三点转向和优化点数图**：三点转向图的趋势线/管道线/测算、金字塔法、优化需不断随市调整\n- **第13章 艾略特波浪理论**：5浪推动+3浪调整、浪的延长、菲波纳奇数列为基、**与道氏理论的联系、须与其他工具协同使用（不可单独用）**\n- **第14章 时间周期**：周期概念、康德拉蒂耶夫长波、季节性周期、波峰左移/右移判趋势强弱\n- **第15章 计算机和交易系统**：王尔德方向性运动系统（ADX）与抛物线系统、自动交易系统的正反面、**\"系统信号作警报、人工综合决策\"的折中用法**\n- **第16章 资金管理和交易策略**：成功交易三要素（**价格预测=做什么 / 时机抉择=何时 / 资金管理=做多少**）；资金管理四要领；头寸大小由止损距离倒推；复合头寸=跟势头寸+交易头寸；保守/大胆两种风格；**报偿-风险比 ≥3:1**；21 条资金+策略清单；从日间到日内图的聚焦\n\n## 提炼出的知识\n- 资金管理四上限——总投入≤50%、单市场保证金≤10-15%、单市场亏损≤5%、相关群≤20-25%；配 3:1 盈亏比门槛 + 复合头寸\n- 突破真假三验证——3% 价格过滤、2 天时间过滤、支撑阻挡互换确认；配合跳空类型辨假突破\n\n## 我的感受 / 行动\n1. 这本书是\"地图册\"不是\"小说\"：16 章各自独立成工具，第4章（趋势/支撑阻力）和第16章（资金管理）是短线最该先吃透的两章，其余按需查阅——所以状态标\"在读\"，先把两章化成的卡片用起来。\n2. 与埃尔德 2%与6%法则 的互补关系清楚了：**埃尔德管\"单个账户的单笔/月度风险上限\"，墨菲管\"一笔钱在多个市场怎么分、每笔至少博多大的盈亏比\"**——一个管单场，一个管多场，合起来才是完整资金管理。\n3. 对路线 B 的升级价值：海龟的突破入场最怕假突破，墨菲给了滤网（3%价格 + 2天时间 + 突破后原阻力变支撑的回踩确认）；均线周期、形态学进一步武装 短线纪律核对表。\n4. 行动：把\"报偿-风险比≥3:1\"加进短线纪律表下单段——入场前先量好止损到目标的距离，不足 3 倍盈亏比的信号直接放弃。\n\n## 本书提炼的知识卡\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 止损触发三问 | 方法 | 止损线是买入前写好的\"最大可承受亏损\"兑现点，它只回答\"风险预算用完了\"，不回答\"该不该离场\"。 |\n| 突破真假三验证 | 方法 | 1. 先画线：标出关键支撑/阻挡、趋势线（两点成线，第三点回踩确认后才算有效趋势线）。 |\n| 资金管理四上限 | 方法 | — |",

   "source": "02-来源卡/笑傲股市.md",
   "body": "# 《笑傲股市》\n\n> 一句话：成长股趋势投资的完整操作系统——**只用一套选股公式（CAN SLIM）锁定季度盈利暴增、创新高的市场领导股，在精确的图表买点（杯柄突破）入场，然后用\"8%止损 + 20%止盈\"的机械纪律把亏损锁死、让利润奔跑**。全书立论：股市里真正能赚大钱的只有少数领涨股，与其分散买入一堆\"不错\"的股票，不如集中持有 1-2 支能翻倍的赢家。\n\n## 基本信息\n- 作者：威廉·欧奈尔，华尔街资深投资人，21 岁白手起家、30 岁买下纽交所席位；创办《投资者商业日报》（IBD）与威廉·欧奈尔公司，曾为全球 600 位基金经理做投资顾问\n- 主题领域：成长股选股 + 图表技术 + 买卖纪律（CAN SLIM 基本面/技术面混合体系）\n- 读它的目的：第三批\"技术进阶\"最后一本（笑傲股市）——它是\"如何找到并拿住大牛股\"的实操派手册，与 海龟交易法则（机械趋势跟踪）、以交易为生（心理+风控）形成互补：海龟管\"跟随趋势的框架\"，欧奈尔管\"在 600 个候选里挑出真正会涨的那一支并精确择时\"\n- 方法学背景：全书基于对 1952-2001 年**每一年涨幅最大的股票**的复盘（\"飙股典范册\"，600+ 只），归纳它们启动前的共同特征 → CAN SLIM。核心信念：**历史会重演，因为人性不变**——牛股启动前的形态与基本面模式会一而再地重复\n\n## 全书脉络\n\n**引言 向伟大的赢家学习**：立论——大多数股票平庸，只有少数领涨股能赚大钱；CAN SLIM 的 C/A/N/S/L/I/M 七要素是飙股\"发迹前\"的共同特征。关键心态铺垫：**股价创新高≠危险，创新高正是买入信号**（反直觉，全书的命门）。\n\n**第一部 选股系统（第1-7章）= CAN SLIM 逐字母拆解**\n- **C = 当季每股收益**：选股第一硬指标。要求当季 EPS 同比大增（第4版标准：比去年同期高 25-30% 起步，最好 40-500%）；**当季业绩是股价最直接的燃料**，但单季暴涨不足以选股，还要看 A。\n- **A = 每股收益年度增长率**：过去 3 年每年 EPS 增长 25%+（最好 100%+），且近两季度加速。C+A 合起来 = \"盈利持续且加速增长\"的成长股画像。\n- **N = 新产品 / 新管理 / 股价新高**：N 代表\"新\"——公司要有新产品、新管理层、或股价创出新高。**真正的大牛股总在创新高时启动，而不是在跌深后反弹**（反\"抄底\"直觉，与 安全边际 的价值派视角截然相反，两派在此分野）。\n- **S = 供给与需求**：流通盘适中（小盘更易涨），且突破时**成交量放大（比均量高 40-50%+，常高达 500-1000%）**——量是机构吸筹的脚印。\n- **L = 领导股还是落后股**：只买行业龙头/相对强度最高的股（RS 排名前 20-40%），**不买\"便宜的二流股\"**——二流股在牛市里涨得慢、熊市里跌得狠。用相对价格强度(RS)过滤。\n- **I = 机构投资者的认同**：要有聪明的钱（共同基金/养老基金）在买——机构是推动股价上涨的主力资金；但别买\"机构已过度持有\"的（利好出尽）。\n- **M = 市场方向**：最重要的一个字母——**大盘下跌时七成个股跟着跌，再好的选股也白搭**。必须判断大盘是牛是熊：跟踪每日大盘指数（标普500/道指/纳指），学会识别顶部（放量滞涨的\"倒货日\"）与底部（缩量企稳后的\"跟进日\"），大盘转弱就持币等待，不逆势硬扛。\n\n**第一部分总结 牢记并运用 CAN SLIM**：七要素必须同时满足而不是挑几个——C/A 管\"公司好不好\"，N/S 管\"时机对不对\"，L/I 管\"市场认不认\"，M 管\"大环境允不允许\"。\n\n**第二部 实战纪律（第8-12章）**\n- **第8章 投资人常犯的 19 种错误**：全库高频被引清单。最有价值的几条：①亏损时固执持有不认赔（犯得最多的错）；②买跌势中的股票（接飞刀）；③向下摊平（越跌越买，把好钱砸向坏决定）；④一有小赚就获利退场、却死守亏损股（做反了）；⑤听小道消息/电视专家选股；⑥因为股息或低市盈率买二流股。\n- **第9章 卖出止损时机**：防守章。铁律 = **每支股票最大亏损限制在买入价的 7-8%**，毫不犹豫执行（大盘转弱时收紧到 3-4%）。止损如买保险。心理要点：卖出的动作不造成损失，损失在股价下跌时已经发生；卖出后才涨不说明卖错（保护了本金就是对的）。赢利后（用市场的钱在玩）可放宽到 10-15% 正常波动，**但亏损仓永远 7-8% 铁限**。\n- **第10章 卖出获利时机**：进攻章。欧奈尔式止盈 = **从精确买点上涨 20-25% 考虑卖出**；若 8 周内就涨 20% 说明是超强股，可持有更久。配套\"金字塔加仓\"：只在**股价上涨 2-3% 后追加**（向上摊平），绝不向下摊平。3:1 盈亏比自动成立：8% 止损 × 20% 止盈 = 对一次抵错两次多。**历史教训（1961 自省）**：光会买不会卖、赚了又吐回去 = 白干——必须把\"何时卖\"也写成规则。\n- **第11章 是否应该分散投资**：反直觉章——**反对过度分散**。资金 2-10 万美元的投资者，集中持有 4-5 支就够（资金越少越该集中：5 千-2 万持 3 支，3 千持 2 支）。分散太多导致反应慢、照顾不过来。支持在盈利仓上加码、把弱股换成强股。\n- **第12章 如何看图提高选股能力**：技术形态章。核心形态 = **杯柄形态**（cup with handle）：股价经 7-8 周以上回调形成\"杯\"，随后小回调形成\"柄\"，**突破柄的上沿（买点/中心点）时是精确买点**，突破需放量 50%+。其他要点：窄幅整理 2-3 周 + 成交量萎缩 = 健康形态；形态松散/第三四次底部 = 失败率高。熊市不买突破（大多数形态在熊市失败）。\n\n**第三部 佐证与扩展（第13-20章）**\n- **第13章 股市大赢家的模式（1952-2001）**：CAN SLIM 的实证检验——从追踪 850 美元小账户 25 年变 5 万美元（50 倍税后收益），到全美投资大赛 CAN SLIM 使用者年收益 279% 拿亚军；再以半个世纪真实牛股（得州仪器、施乐、思科等）展示\"赢家形态一再重复\"。\n- **第14-15章**：网页版缺正文（《投资者日报》使用指南 + 行业板块选择，偏作者广告性质，非核心）。\n- **第16章 看盘的艺术——对新闻的分析和反应**：学会\"看盘\"而非\"听新闻\"——对消息的反应（价量行为）比消息本身更重要。\n- **第17章 审慎选择投资工具——期权**：期权投机风险极大，多数人应回避（呼应第8章错误16）。\n- **第18章 买共同基金，做百万富翁**：不会选股的普通人，用纪律买优秀成长基金也能致富。\n- **第19章 改善养老基金投资组合**：机构如何应用这些原则（略）。\n- **第20章 股票投资备忘录：投资重要准则**：全书浓缩成 20 条准则（如：不买细价股、买增长型股票、EPS 连续两季大增、ROE 17%+、别根据红利/低 PE 选股、跌 7-8% 立即止损、写下卖出准则、机构认同、新美国企业、别向下摊平、别和市场争论）。**《笑傲股市》的最短可用版，适合做成检查清单**。\n\n## 提炼出的知识\n- CANSLIM选股法——七要素选股公式：当季盈利(C)+年度增长(A)+创新高(N)+供需量能(S)+领导股(L)+机构认同(I)+市场方向(M)；七关全过才是一支值得下重注的领涨股\n- 欧奈尔买卖纪律——\"8%止损 + 20%止盈 + 只在创新高时买 + 金字塔向上加仓\"的机械交易纪律；核心是 3:1 盈亏比与\"赔钱股快砍、赚钱股多拿\"的反人性规则\n- 杯柄突破买点——把\"创新高买入\"落成可执行图形：识别杯柄形态，等放量突破柄上沿的精确买点再入场\n- 趋势持股与卖出信号清单——第10章图形层卖点全谱（高潮型顶点10条/量能衰竭7条/跌破支撑区5条/其他指示点6条）+ 何时该耐心持股；回答\"什么时候该卖\"这个最难的问题\n- 投资错误清单——第8章 19 种错误的反向自检表（头号杀手4条/选股标准错误6条/信息与心态错误9条），用于买入前与亏损后对照排查\n- 欧奈尔成长股准则20条——第20章全书浓缩的最小可用版：选股硬条件8条 + 时机技术3条 + 持仓市场6条 + 心态禁忌3条，可照单打勾\n\n## 本书提炼的知识卡\n\n| 卡（类型） | 内容 | 对应章节 |\n|---|---|---|\n| CANSLIM选股法（方法） | 七字母选股公式（C/A/N/S/L/I/M） | 第1-7章 + 第一部分总结 |\n| 欧奈尔买卖纪律（方法） | 8%止损 / 20%止盈 / 只买创新高 / 金字塔加仓 / 集中持仓 | 第8-11章 |\n| 杯柄突破买点（概念） | 杯柄形态识别 + 放量突破柄上沿的精确买点 | 第12章 |\n| 趋势持股与卖出信号清单（方法） | 技术性卖出信号全谱 + 何时耐心持股 | 第10章 |\n| 投资错误清单（方法） | 19 种错误的买入前/亏损后反向自检表 | 第8章 |\n| 欧奈尔成长股准则20条（方法） | 全书 20 条准则的最小可用清单 | 第20章 |\n\n> 六张卡的分工：**选股**看 CANSLIM（挑哪支）→ **择时**看杯柄突破买点（何时进）→ **持有/卖出**看趋势持股与卖出信号清单（何时出）→ **纪律**看欧奈尔买卖纪律（怎么砍怎么拿）→ **自检**看投资错误清单 + 准则20条（事前事后各扫一遍）。\n\n## 我的感受 / 行动\n1. 这本书和路线 A 是**两种相反哲学**的极端样本，正好用来互相校准：欧奈尔买\"创新高的贵股票\"（动量/趋势），格雷厄姆-马克斯买\"跌出安全边际的便宜货\"（价值/逆向）。读完最大的收获不是要倒向哪边，而是**看清楚自己选的是哪条路**——双轨并用决策 里路线 B（战术短线）若要做成长股，欧奈尔这套是最完整的操作系统；路线 A（低估定投）则继续用 盈利收益率定投法，不必混用。\n2. 最该内化的三条（全部反人性，需写成检查单）：①**止损 7-8% 铁限，不找借口**（与 止损触发三问 互补：先砍再判）；②**绝不向下摊平**（与 海龟止损、第8章错误3 完全一致，是全库反复出现的最高频禁忌）；③**买创新高而非抄底**（对治自己\"跌了想接\"的本能）。\n3. C+A（盈利加速）+ N（创新高）+ M（大盘向上）四关若同时满足，胜率最高；实操时先用 M 过滤大盘、再用 L 锁定龙头，最后才看 C/A 的基本面确认——顺序很重要，避免在熊市里做无用功。\n4. 第 20 章 20 条准则是全库少见的\"可直接抄成清单\"的材料，适合将来做一张交易前核对卡（类似 短线纪律核对表），贴在复盘流程里用。**2026-09-10 已落地** → 欧奈尔成长股准则20条（选股硬条件8 / 时机技术3 / 持仓市场6 / 心态禁忌3，与 短线纪律核对表 分工：20条筛标的、核对表管执行）。\n5. 这次补拆（2026-09-10）补齐了全书最缺的一块——**\"什么时候卖\"**。此前只有 8%/20% 两个百分比，现在有 趋势持股与卖出信号清单 的图形层信号（高潮型顶点/量能衰竭/跌破支撑），以及 投资错误清单 的反向自检。对路线 B 的意义：百分比止损管\"下限\"，信号清单管\"上限与主动离场\"，两者合起来才是完整的 3B 离场篇。\n\n## 状态\n**读完 ✅（2026-09-10 补齐第8/10/20章）**——全书脉络已完整覆盖，提炼 6 张知识卡（3 方法 + 2 方法 + 1 概念，见「本书提炼的知识卡」表）。第14-15章网页版缺正文（《投资者日报》使用指南，偏工具介绍），不影响主体。**无需续读。**",

   "body": "# 《聪明的投资者》\n\n> 一句话：价值投资的开山操作手册——**先分清\"投资\"与\"投机\"、认清自己是\"防御型\"还是\"进攻型\"；防御型用\"股债 50:50 + 分散 + 不追高\"守住平均收益，进攻型只在\"价格远低于价值（安全边际）\"时才出手**。全书落点一句话：投资操作是以深入分析为基础、确保本金安全并获得满意回报的行为，做不到这一条的都是投机。\n\n## 基本信息\n- 作者：本杰明·格雷厄姆，\"证券分析之父\"、巴菲特在哥伦比亚大学的老师；本书 1949 年首版，本提取稿为第 4 版（1965 年前后）全本\n- 主题领域：投资原理 + 投资者分类 + 组合策略 + 证券选择（哲学/纪律层，几乎不讲 K 线技术）\n- 读它的目的：第四批\"认知收尾\"第二本——它是整条价值投资链的**源头定义层**：指数化投资、盈利收益率定投法这些路线 A 工具，追根溯源都来自这里的\"防御型投资者纪律\"；\"安全边际\"则是判断一切买点真伪的试金石\n- 一句话结构：第 1-7 章（分类+两类投资者的策略）→ 第 8-13 章（选股技术，结论却是\"大多数人不该靠选股赢\"）→ 第 14-15 章（股东权利/股利）→ 第 16 章（安全边际=全书核心）\n\n## 全书脉络\n\n**开篇《投资策略》导言**\n三条跨世纪仍有效的格言：①如果投机，最终你将（可能）失去钱；②当大多数人（包括专家）悲观时买，相当乐观时卖；③调查，然后投资。并给全书定调：**与证券类型相联系的准则会过时，与人性相联系的准则才长存**。\n\n**第一篇 投资的一般方法（第1-7章）**\n- **第1章 聪明的投资者将获得什么**：给出贯穿全书的定义——\"投资操作基于全面分析，确保本金安全与满意回报，不符合这些要求的操作是投机性的\"；把读者分成两类：**防御型**（要安全、不愿多费心）与**进攻型**（愿花时间精力、追求超额）。理智=性格多于脑力。\n- **第2章 投资者与股市波动**：价格波动只该当\"投资效益的指示计\"，不该当\"决策的向导\"；用预测/择时入场的人最终都会滑向投机。A&P 案例：绩优股 1938 年跌到现金都覆盖不了的价格——真正的投资者应把暴跌当\"用资金和勇气买入的机会\"，而不是恐慌源。\n- **第3章 1964年股市行情**：历史背景章（\"新时代\"叙事的警示），说明牛市后期追高的危险。\n- **第4章 投资者和投资顾问**：忠告来源的价值排序——金融服务/经纪行/分析师都只能参考，**最后的决定和判断必须自己做**（否则就是把钱交给别人的代理人问题）。\n- **第5章 通用组合策略：防御型投资者**：最实用的纪律章。股债分配基本法则：普通股占比**不低于 25%、不高于 75%**，标准为 **50:50**；涨到 55% 就卖掉 1/11 的股票恢复平衡，跌到 45% 就反向操作（**再平衡公式**）。另有\"普通股投资四原则\"与\"何谓风险\"（风险=必须卖出时的损失可能，与价格波动不是一回事）。\n- **第6章 进攻型投资者的组合策略：负面方法**：先学会不做什么——避开二等债券/优先股、外国政府债券、新发行的证券、新股炒作（\"一个可怕的案例\"）。**多数亏损来自在有利条件下买劣质货**。\n- **第7章 进攻型投资者的组合策略：正面方法**：进攻型四条活动特征=低价买高价卖/谨慎选成长股/买廉价衍生证券/买\"特别地位\"；核心推荐三个领域之一：**关注\"正经历不引人注意时期的大公司\"**（道琼斯最便宜的 10 只长期跑赢最贵的 10 只，1936-1962 实证）；并对成长股泼冷水——23 只成长股 10 年表现并不优于普通股，**为期望的繁荣倾囊付出是成长股投资最常见的死法**。\n\n**第二篇 股票选择的原则（第8-13章）**\n- **第8章 非专业投资者如何分析证券：一般方法**：债券分析（收益覆盖倍数、7年平均与\"最差年份\"双检验）、普通股分析框架；结论性的提醒：**预测未来收益极不可靠，成组/分散的预测比个别预测可靠得多**。\n- **第9章 防御型投资者的证券选择**：给防御型的三条可选路径——①买\"一篮子\"龙头（等于是指数化）；②**排除高价股**（价格超过 7 年平均收益 25 倍或最近 12 个月收益 20 倍的一律不碰）；③只买\"相对不流行的一流股\"。\n- **第10章 进攻型投资者的证券选择：评估方法**：标准评估=估未来 7-10 年平均每股收益 × 反映品质的倍数；但全书最清醒的证据在这里——**大量专业基金十年业绩跑不赢标准普尔 500**（表24：1954-1963 标普综合收益 278%，多数增长基金 270% 上下甚至更低）。\"想在选股上赢过全国最优秀分析师\"几乎不可能，聪明投资者只能从**过低估价**中获利。\n- **第11章 应用股票分析技术发现贬值的题材**：六个历史案例教学（略，方法已提炼进第10章框架）。\n- **第12章 股票收益和价格的变动模式**：四种模式（稳定收益型/收益起伏型/极端兴衰型/成长股型）——**长期价格由收益决定，短期价格被情绪放大**。\n- **第13章 收益和价格变化的组合分析**：长期持有股票的总回报最终贴近企业盈利增长；个别高增长难持续、大规模更难。\n\n**第三篇 作为公司所有者的投资者（第14-15章）**\n- **第14章 股东与管理层**：股东是所有者不是顾客——警惕管理层损害股东利益（代理问题早期论述）。\n- **第15章 股东与股利政策**：股利是股东回报的重要组成，长期分红记录是公司质量的重要证据（也是第9章选股标准之一）。\n\n**第四篇 结论（第16章）**\n- **第16章 安全边际——投资的核心概念**：全书唯一的核心思想。债券的安全边际=盈利能力对利息的多倍覆盖+资产缓冲；普通股的安全边际=预期盈利能力显著高于债券利率+靠分散化兜底；**足够低的价格可以把\"劣质证券\"变成好投资**（不动产债券跌 90% 后反而安全）。安全边际同时是\"投资 vs 投机\"的试金石。结尾四条商业原理：①知道你在做什么；②别让不能理解/不能控制的人替你经营钱；③没有可靠计算表明能赚钱就别动手，远离\"小收益大损失\"；④有知识、经验和勇气后，按判断行动。\n\n## 本书提炼的知识卡\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 安全边际 | 概念 | 价格与指示价值之间的\"顺差\"；**唯一能把投资与投机区分开的试金石**，也是价值投资的全部秘密（第16章=全书核心） |\n| 投资与投机之分 | 概念 | 投资 = 全面分析 + 本金安全 + 满意回报（《证券分析》原定义）；试金石是**安全边际**，不是标的物——同一只证券可随价格变身份 |\n| 市场先生 | 概念 | 市场报价是**提供给你的服务，不是下达给你的命令**——利用他的情绪，别被他的情绪牵着走（第2章末寓言） |\n| 防御型投资者纪律 | 方法 | 不想多费心就承认自己是防御型：分散化、设价格上限、定期定额买入；纪律地拿平均收益 > 聪明地追逐超额 |\n| 股债50-50再平衡 | 方法 | 股债固定比例（50:50；股票 **25%~75%**）+ 偏离 **5 个百分点**就调回——用规则替代预测 |\n\n> **2026-09-10 补拆（\"去同存异\"批次）**：原书只有 2 张卡。本轮补 3 张**全书独有、原卡未覆盖**的卡——投资与投机之分（第1章 + 附录\"区别投资与投机的若干标准\"）、市场先生（第2章末寓言）、股债50-50再平衡（第1章/第5章）。\n> 第 3/4/6/7/8–16 章的结论（\"新时代\"叙事警示、进攻型负面方法、三个推荐领域、专业基金跑不赢指数、股利与股东权利）**均已并入 防御型投资者纪律 与 安全边际**，按去同存异原则不重复造卡。\n\n## 我的感受 / 行动\n1. 这本书是路线 A 的\"出生证明\"：指数化投资、盈利收益率定投法、双轨并用决策里的定投与再平衡，都能在第 5 章找到原始表述。读它不是为了学新招，而是**确认自己正在做的定投，正是格雷厄姆为\"防御型投资者\"设计的标准动作**——这让我在下跌时更有底气。\n2. 最扎心的一页在第 10 章：专业基金十年都跑不赢指数。推论对路线 A 极重要——**别用战术仓位去\"精选个股/择时\"，那是在跟全国最优秀的人抢食**；普通人能赢的唯一位置是\"用纪律在别人恐惧时买指数\"，即 安全边际 + 盈利收益率定投法。\n3. \"投资与投机的区别消失，正是人们该关切的事\"——给自己立一条检查线：任何一笔买入，能说出\"价格比价值低多少、凭什么低\"才是投资；只凭\"它会涨\"就是投机，投机可以，但要用亏得起的钱、单独记账（呼应 双轨并用决策 的战术轨）。**⚠️ 这条已落地为独立卡 投资与投机之分——路线 B 在格雷厄姆的定义下就是投机，所以它必须配硬止损。**\n4. 波动的正确用法：A&P 案例提醒我——**大跌时先检查\"当初买入的逻辑变没变\"，没变就是加码信号而非割肉信号**（与 蜡烛图三原则 的\"止损在逻辑破坏处\"同构）。",

   "source": "02-来源卡/财务诡计.md",
   "body": "# 《财务诡计》（原书第4版）\n\n> 一句话：一本**会计舞弊的\"作案手法大全\"**——把上市公司操纵财报的手法拆成四大类（盈余操纵/现金流量/关键指标/并购会计），逐条给出**诡计怎么玩 + 危险信号长什么样 + 真实案例**；最后一章提炼出\"**法证式思维模式**\"十招，教你不是去算数字，而是**带着怀疑去问\"为什么\"和\"为什么是现在\"**。\n\n## 基本信息\n- 作者：霍华德·M. 施利特等，法务会计（forensic accounting）领域的权威；本书是 25 周年纪念版（第4版），历经多次重大财务丑闻（安然、世通→威朗制药、赫兹……）持续更新\n- 主题领域：**财报舞弊识别 / 财务诡计侦测**——不是\"如何读表\"，而是\"如何识破被做过手脚的表\"\n- 读它的目的：**给排雷能力装上\"最硬的那块装甲\"**。财报排雷清单（唐朝）教的是\"A股年报常见雷点\"，本书教的是**全球范围的完整诡计图谱 + 系统化识破方法**；两本合起来，你就有了\"排雷清单 + 舞弊原理\"的完整武器\n- 结构：四大类诡计（盈余操纵7种 + 现金流量3种 + 关键指标2种 + 并购会计3种）→ 三家著名公司复合案例 → **第19章\"法证式思维模式\"十招（全书精华）**\n\n## 全书脉络\n\n**第1-2章 背景与土壤**\n- 第1章\"财务诡计25年\"：从安然、世通到近年的案例，说明**诡计层出不穷、只换不灭**\n- 第2章\"就改改X光片吧\"：诡计滋生的**公司文化温床**——薄弱的制衡、独裁的 CEO、\"为达目标不惜代价\"的企业文化；激励错位（高管薪酬挂钩的指标被人为拔高）\n\n**第3-9章 盈余操纵诡计七种（分成两大类）**\n- **虚增当期利润**：①过早确认收入（未完成合同就确认/超工作量确认/买方验收前确认/付款能力存疑时确认）②确认虚假收入（虚构交易/回旋镖交易/关联方对倒）③用一次性或非持续活动推高利润（卖资产化妆成收入、互换贸易）④把当期费用推迟到以后期间（费用资本化、藏进资产负债表）⑤用其他方法隐瞒费用或损失\n- **虚增未来利润**：⑥把当期利润推迟到以后确认（\"利润蓄水池\"平滑业绩）⑦把未来费用提前确认在当期（**\"洗大澡\"**——一次亏够，为次年转回做铺垫）\n- 核心机制：**只要把不属于本期的收入/利得确认在本期，或把属于本期的费用/损失不确认在本期，当期利润就虚增了**；反之则虚减，为未来腾挪空间\n\n**第10-12章 现金流量诡计三种**\n- ①把**筹资活动**现金流入伪装成**经营活动**现金流入（让\"造血能力\"看起来更强）\n- ②把**经营活动**现金流出归类到其他活动（掩盖经营失血）\n- ③用非持续性活动抬高经营现金流\n- 要点：现金流量表被认为\"最难操纵\"，但其实是**分类**可以被操纵——**看清每一笔现金的真实来源，而非只看\"经营现金流\"这个总数**\n\n**第13-14章 关键指标诡计**\n- ①用**高估业绩的误导性指标**（\"调整后利润\"\"EBITDA\"\"每股现金利润\"——把真实成本剔出去）\n- ②通过歪曲资产负债表指标避免暴露财务恶化（如粉饰营运资金、隐藏债务）\n\n**第15-17章 并购会计诡计三种**：虚增收入利润 / 虚增现金流量 / 操纵关键指标——并购是**藏污纳垢的重灾区**（商誉、重组费用、并表时间点都可做手脚）\n\n**第18章 分崩离析**：三家著名公司的复合案例（同时用多种诡计愚弄投资者）\n\n**第19章 法证式思维模式（全书精华·十招）**\n1. **适度怀疑是一种竞争优势**（市场有利于好消息传播，能保持客观怀疑的人才赚钱）\n2. **对变更要十分警惕——一定要问\"为什么\"以及\"为什么是现在\"**（会计政策/披露/资产负债表趋势/关键指标/客户支付条款/高管离职/审计师变更，都是红灯）\n3. **调查过去的\"会计问题\"**，判断是否已真正补救（别只当\"技术问题\"，要想\"这些不当操作掩盖了多大问题\"）\n4. **关注公司文化**，看是否存在培育坏行为的温床\n5. **绝对不要盲目相信公司宣传的盈利模式**（非 GAAP 指标往往剔掉了重要的成本）\n6. **密切关注高管薪酬**（考核哪个指标，管理层就围猎哪个指标）\n7. **披露的位置、位置、位置**（坏消息藏在小字体、藏在无聊章节里——**完整地读，把怀疑伸向最枯燥的部分**）\n8. **就像打高尔夫，每一击都算数**（不允许\"加击\"——那些让你忽略某些费用/现金流出的说法，等于作弊）\n9. **行为模式是一种可靠的信号**（激进 CFO 会把习惯带到下家；过去激进压货，之后常伴随收入骤降）\n10. **保持谦虚，永远好奇，不断学习**\n\n**总结**：**\"发生过的将再次发生\"**——不诚实的管理层靠欺骗不善怀疑的投资者为生；**假设管理层夸大正面消息、隐瞒负面消息的冲动永远不会消失。**\n\n## 提炼出的知识\n- 财务诡计识别框架——本篇书卡主提炼：四大类诡计图谱 + 法证式十招查证法（面向 ETF 玩家的精简版）\n- 关联已有卡：财报排雷清单（唐朝，A股实操版；本卡是其\"底层原理\"）· 读财报看景气（正向验证）· 离场三闸门（闸门②逻辑止损：一旦发现财务逻辑被证伪即走）· 高估五类（不碰财报就炒的题材股，本卡不适用）\n\n## 我的感受 / 行动\n1. **这本书的价值在\"心理武装\"不在\"技术细节\"**：作为 ETF 玩家，你不需要掌握全部 15 种诡计的操作细节（那是审计师/做空机构的功课），但你必须建立**\"默认怀疑\"的心智**——看到任何一家公司业绩\"又超预期\"，第一反应不是兴奋，而是\"**这数字怎么来的？**\"\n2. **最实用的那一招是第7招\"披露的位置\"**：好消息在业绩快报和新闻稿里反复说，坏消息藏在年报附注的犄角旮旯、小字体、无聊章节里。**读财报要专门去读那些\"公司不想让你读\"的部分**——这与你知识库里\"排雷清单 D 段董事会报告连读\"完全同源。\n3. **第2招\"为什么是现在\"是最高频的红灯**：变更会计政策、变更审计师、高管突然离职——**问\"为什么\"往往得到官话，问\"为什么是现在\"才能逼出真相**。用在 A 股：某赛道龙头突然改收入确认时点，往往正是在增长放缓的节点。\n4. **对 ETF 玩家的边界（重要）**：**你买的是 ETF，单股暴雷已被分散**。本书的正确用法不是每天排查持仓个股，而是：①**研究新赛道时**，用\"四大类诡计图谱\"扫描赛道龙头有没有系统性造假嫌疑（软件/半导体/云计算正是高危行业）；②**看到某赛道被质疑造假**时，用\"法证十招\"判断传闻是否站得住；③**理解\"为什么财报不能全信\"**，从而更重视现金流和交叉验证。\n5. **和第18章\"复合案例\"对照A股**：A股历史上很多财务造假案（蓝田、康美、康得新……）几乎都能在本书四大类里找到原型——**\"发生过的将再次发生\"**，这本书实际上是给你一份\"未来还会重演\"的剧本。\n6. 一句话记住全书：**\"管理层夸大好消息、隐瞒坏消息的冲动永远不会消失——所以，适度怀疑是你唯一的护城河。\"**\n\n## 本书提炼的知识卡\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 财务诡计识别框架 | 方法 | 1. 过早确认收入——未完成合同就确认 / 超工作量确认 / 买方验收前确认 / 付款能力存疑时 |",

   "oneliner": "市场是概率游戏，而人脑天生不适合玩概率——赢家和输家的差别不在技术，在\"把亏损当成本、把每笔当独立事件\"的思维方式。这是继 [[海龟交易法则]] 之后，补齐\"执行系统\"那一环的心理教材。",
   "source": "02-来源卡/交易心理分析.md",
   "body": "# 交易心理分析\n\n> 一句话：市场是概率游戏，而人脑天生不适合玩概率——赢家和输家的差别不在技术，在**\"把亏损当成本、把每笔当独立事件\"的思维方式**。这是继 海龟交易法则 之后，补齐\"执行系统\"那一环的心理教材。\n\n## 基本信息\n- 作者：马克·道格拉斯（Mark Douglas），交易心理教练，17 年研究交易心理，曾自己亏光后转型教学\n- 主题领域：交易心理 · 概率思维 · 信念系统\n- 读它的目的：海龟书给了\"规则\"，这本给\"守规则的心理\"——我明明知道要止损，为什么做不到\n\n## 全书脉络\n1. 第1章 成功之路：基本面/技术面/心理面 —— 三者哪个决定成败\n2. 第2章 交易的诱惑与危险 —— 为什么大部分人注定亏\n3. 第3章 自己承担责任 —— 市场不欠你，盈亏全在自己\n4. 第4章 持续一致性是一种思想状态\n5. 第5章 认知的动力 —— 大脑如何联想、扭曲信息\n6. 第6章 市场的视角 —— 把自我期望从市场中抽离\n7. 第7章 交易者的优势：考虑概率 —— 5 个基本事实（全书核心）\n8. 第8章 和信念一起工作\n9. 第9章 信念的本质\n10. 第10章 信念对交易的影响\n11. 第11章 像交易者一样思考 —— 机械阶段→自觉阶段→直觉阶段 + 训练练习\n\n## 提炼出的知识\n\n### 概念（\"怎么想\"）\n- 概率思维 —— 5 个基本事实：任何事都会发生 / 不必知道下一步 / 输赢随机分布 / 优势只是概率高一点 / 每个时刻独一无二\n- 情绪风险 —— 真正的风险不是市场波动，是\"解读成威胁\"的心理机制\n- 赢家态度 —— 期待好结果 + 坦然接受任何结果\n\n### 方法（\"怎么做\"）\n- 为结果负责 —— 把盈亏全部归因于自己，阻断\"责怪市场/找借口\"\n- 概率思维训练 —— 用机械阶段练习把概率思维装进脑子（观察自己 + 逐条核对）\n\n## 我的感受 / 行动\n\n- 第 3 章像在写我：亏了之后\"等回到成本价再卖\"、割肉后怪市场——全是把责任推给市场、把单笔输赢看得比系统还重。\n- 最扎心一句：**\"你越是以为自己知道下一步，就越会亏钱。\"** 我追高、扛单，本质都是\"想证明自己这次是对的\"。\n- 行动：把 5 个基本事实抄在交易笔记本第一页，每次下单前默读；练习\"先定义风险再进场\"，把 机械交易系统 的执行力补上。\n\n## 本书提炼的知识卡\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 为结果负责 | 方法 | 人从小习得\"外部归因\"：玩具被抢走、被强迫做不喜欢的事——痛苦都是别人造成的。交易时这套本能会复 |\n| 概率思维训练 | 方法 | 很多人\"懂了\"概率思维却做不到（书中鲍伯案例：30 年老手仍手动干预系统）。因为知道是理性层，做 |\n| 短线纪律核对表 | 方法 | 三本书各管一段：海龟给规则数字（入场/仓位/止损/退出），心理书给让规则执行得下去的自检问句，大 |\n| 情绪风险 | 概念 | 看别人做交易的行情你毫无感觉，轮到自己持仓就心跳加速——差别不在市场，在\"有没有东西 at st |\n| 概率思维 | 概念 | 赌场每天面对随机结果却年年稳定赚钱，靠的不是预测哪把会赢，而是\"规则（优势）在自己这边 + 玩得 |\n| 赢家态度 | 概念 | 运动员里能进\"状态（zone）\"的，都是不怕犯错的人。不是他们不会错，而是他们不把错误看成\"我很 |",

   "oneliner": "《共同基金常识》（10周年纪念版），[美] 约翰·博格著（巴曙松等译），北京联合出版公司。作者是全球第一只指数基金的发明者、先锋集团（Vanguard）创始人，被称为\"指数基金之父\"，与巴菲特、格雷厄姆、彼得·林奇并称\"20世纪四大投资巨人\"。全书用统计数据和亲身经营经验论证一个朴素主张：买低成本、覆盖整个市场的指数基金并长期持有，是普通投资者战胜绝大多数专业投资者的唯一可靠路径。",

   "body": "# 共同基金常识\n\n> 《共同基金常识》（10周年纪念版），[美] 约翰·博格著（巴曙松等译），北京联合出版公司。作者是**全球第一只指数基金的发明者、先锋集团（Vanguard）创始人**，被称为\"指数基金之父\"，与巴菲特、格雷厄姆、彼得·林奇并称\"20世纪四大投资巨人\"。全书用统计数据和亲身经营经验论证一个朴素主张：**买低成本、覆盖整个市场的指数基金并长期持有，是普通投资者战胜绝大多数专业投资者的唯一可靠路径。**\n\n## 这本书适合谁\n\n- 已被\"定投指数基金\"说服、但**内心仍怀疑\"真的能赢过基金经理吗\"**的人——本书给出学术级证据链；\n- 想搞懂\"为什么主动基金收费高却长期跑不赢指数\"的投资者；\n- 路线 A 长期投资者（本书是\"费率是长期敌人\"这句口号的完整出处与论证）。\n\n## 一句话核心\n\n**投资回报 = 市场回报 − 成本。长期来看，市场本身提供的回报（股息+盈利增长）是稳定的，投资者之间真正的差别在于各自付了多少成本——成本最低的指数基金，因此必然长期战胜成本高昂的主动基金。成本是你唯一能完全控制的因素，简单化是财务成功的要旨。**\n\n## 全书脉络（五大部分 22 章）\n\n1. **投资策略**（第1–4章）：长期投资的本质（强斯与花园）；**回报的本质 = 初始股息率 + 盈利增长率 + 市盈率变化**（奥卡姆剃刀三变量）；资产配置 vs 成本谁更重要（结论：成本是个人投资者最重要的因素）；**简单化**——世界越复杂，投资越要简单\n2. **投资选择**（第5–9章）：**指数化：经验对希望的胜利**（全书最硬核章节，学术证据证明极少有基金能持续跑赢指数）；股票风格（井字游戏）；债券投资；全球投资；选基金如找圣杯（结果：圣杯就是指数基金）\n3. **投资业绩**（第10–14章）：**均值回归：牛顿对华尔街的报复**（明星基金/热门风格终会回归平庸）；别做\"相对主义\"攀比；基金规模是业绩杀手；税收的影响；**时间的作用**（第四维度——时间越长，基本面回报越确定）\n4. **基金管理**（第15–19章）：投资原则不可动摇；基金营销（信息即媒介）；科技的作用；基金董事与治理（警惕利益冲突）\n5. **基金精神**（第20–22章）：企业家精神、领导力、人性化——博格对金融业\"受托人责任\"的呼吁\n\n## 全书最关键的 5 个结论\n\n1. **成本决定一切**：主动股票基金全部成本（费率+换手成本+销售费）中值约 **每年 2.5%**——会吃掉股票风险溢价的 3/4（71%）；而指数基金费率可低至 0.1%~0.2%。同样的市场，扣完成本后谁是赢家毫无悬念\n2. **指数化是经验对希望的胜利**：夏普、卡哈特、戈茨曼—伊博森等多组学术研究一致证明：**几乎没有基金能持续跑赢指数**（持续胜利者概率≈掷硬币，且常输给指数）；买收费最少的指数基金，长期必超越大多数投资专家\n3. **均值回归是金融市场的万有引力**：明星基金/成长价值风格/大小盘/国内外市场，长期回报都回归平均水平；美股 25 年滚动实际回报 93% 的时间落在 4%~10%（均值 6.7%）——别追热门、别信\"这次不一样\"\n4. **回报的三变量公式**（奥卡姆剃刀）：长期股市回报 ≈ 初始股息率 + 盈利增长率 + 市盈率变化；其中前两项是基本面（可靠），市盈率变化是投机（会回归）\n5. **简单化 + 时间是你最好的朋友**：不要复杂策略、不要频繁换手（像交易股票一样交易基金会显著降低收益）；投资期越长，基本面回报的确定性越高\n\n## 本书提炼的知识卡\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 成本拖累 | 概念 | 投资回报 = 市场回报 − 成本；2.5%/年 的成本会吃掉股票风险溢价的 71%——**成本是唯一能完全控制的因素** |\n| 均值回归 | 概念 | 明星基金/热门风格/泡沫板块的业绩，长期都回归平均——金融市场的万有引力，专治\"这次不一样\"（第10章） |\n| 回报三变量公式 | 方法 | 长期回报 ≈ **初始股息率 + 盈利增长率 + 市盈率变化**；前两项是基本面、第三项是投机——**买入估值决定长期回报起点**（第2章 奥卡姆剃刀） |\n| 投资的第四维度 | 概念 | 回报/风险/成本是三个空间维度，**时间是第四维度**——时间提高基本面确定性、同时放大成本侵蚀（第14章） |\n| 投资相对主义 | 概念 | 把目标从\"绝对回报\"换成\"别跑输指数\"，行为就系统性变形（隐秘指数化、追涨杀跌）——**相对主义是别人的记分牌**（第11章） |\n| 指数化投资 | 方法 | 指数化：经验对希望的胜利——为什么低成本宽基长期必赢（本书第 5 章的操作化） |\n\n> **2026-09-10 补拆（\"去同存异\"批次）**：原书 2 张卡。本轮补 3 张独有卡（回报三变量公式 第2章 · 投资的第四维度 第14章 · 投资相对主义 第11章），并把原本挂空的 均值回归（第10章）纳入本表认领。\n> 第 3/4/6–9 章（资产配置 vs 成本之争、债券、全球投资、选基金如找圣杯）与第 15–22 章（基金治理/营销/精神）为行业视角或已被 指数化投资/成本拖累 覆盖，**按去同存异原则不另建卡**。\n\n## 与螺丝钉《指数基金投资指南》的关系\n\n- 螺丝钉书（指数基金投资指南）= **中国实操版**：具体到 A 股哪个指数低估、盈利收益率阈值多少、定投计划怎么写；\n- 本书 = **美国原理版**：为什么\"低成本宽基+长期持有\"这个策略在逻辑上必然成立——博格给了底层证据（成本、均值回归、学术研究）。\n- 两条路线可以闭环：**原理上信服（博格）→ A 股落地执行（螺丝钉）→ 长期心态（金鹅与瘦鹅）**。\n\n## 提醒\n\n- 书里数据以美股/美基为主（费率、换手率、税制），**具体数字别照搬 A 股**；但\"成本拖累、均值回归、指数化胜出\"的机制在 A 股同样成立（且 A 股散户占比高，主动基金超额更不稳定）。\n- 博格推崇\"买入并持有整个市场\"的宽基指数；这与螺丝钉\"低估才买\"不完全相同——前者更简单（随时可买长期持有），后者想赚低估回归的额外收益。**选哪种取决于你愿不愿意做估值判断**，MOC 路线 A 里两者并存。\n- 第 15–22 章涉及美国基金业治理/营销，偏行业视角，入门者可略读，重点读第 1–14 章。\n\n## 来源\n\n- 原文（epub 提取）：`01-原料/书籍/我的书架/投资与经济/共同基金常识/共同基金常识-全文提取.md`",

   "source": "02-来源卡/威科夫操盘法.md",
   "body": "# 威科夫操盘法\n\n> 一句话：**不画线、不算指标，只看「成交量（努力）和价格进展（结果）配不配」**——放量不涨说明有人在出货，放量不跌说明有人在收货。全书只教这一个判断，然后把它套进「吸筹—拉升—派发—下跌」四段结构里。\n\n## 这本书的立场（先看它反对什么）\n\n作者开篇就把技术指标归为「表象」：\n\n> 表象就是走势图和大家常用的技术指标，比如很多人在交易中无法割舍的 MACD 或均线……所有这些指标和图形都属于表象，都是市场信息的**第一层面**。\n\n> 支撑和阻力**与图上的线没有关系**。无论是均线，或者黄金分割百分比线，或者其他指标产生的线，都不能单独代表支撑和阻力。因为**市场对这些线一无所知**。\n\n它要讲的是「第二层面」：**这个价位上，买单流入多还是卖单流入多**。\n\n## 三条公理（第 1 章第二节，全书地基）\n\n| 原则 | 原文 |\n|---|---|\n| **供求关系** | 趋势的动力来自于供求关系的不平衡 |\n| **因果关系** | 趋势形成之前需要准备过程（吸筹/派发）；「没有这个过程，接下来形成的趋势不会持续太久」 |\n| **努力和结果** | 成交量的增长没有使价格大幅增长，这是走势停止行为 |\n\n## 全书脉络（6 章）\n\n| 章 | 讲什么 | 对我 |\n|---|---|---|\n| 1 | 聪明钱看盘顺序、供求关系、公众对支撑阻力的误解 | **核心** |\n| 2 | 熊市终止的判据、停止行为、吸筹四阶段、震仓 | **核心** |\n| 3 | 派发：牛市到顶的现象、UT 上冲回落、抢购高潮 | 用 |\n| 4 | 弹簧效应（Spring）交易法 | **核心** |\n| 5-6 | 综合分析案例（进场、危机管理、结果） | 略（案例教学） |\n\n## 本书提炼的知识卡（6 张）\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 努力与结果 | 方法 | 高量 + 小蜡烛 = 努力没结果 = 停止行为；这是全书唯一的核心判据 |\n| Spring弹簧效应 | 方法 | 快速跌破支撑又快速收回；分三种，只有「突破无量」那种可直接进 |\n| 停止行为 | 方法 | 两种形态：长影线 + 放量；或振幅骤缩 + 放量 |\n| 聪明钱看盘顺序 | 方法 | 背景 → 价量形态 → 性质 → 结论 → 行动，五步不许跳 |\n| 支撑阻力即供求 | 概念 | 支撑不是一条线，是「这个价位买单量 > 卖单量」；验证方法看回测时的反弹力度 |\n| 吸筹四阶段 | 方法 | 恐慌抛售 → 二次测试 → 疲劳震荡 → 终极震仓/JOC；只在右手边进场 |\n\n## 看过但不建卡的（写明为什么）\n\n| 内容 | 为什么不建卡 |\n|---|---|\n| UT（上冲回落） | 已并入 Spring弹簧效应 的「镜像」一节——UT 是 Spring 的倒影，机理相同，拆成两张会割裂 |\n| JOC / SOS / 垂直需求柱 / 冰线 / 超卖线 | 术语层，已在 吸筹四阶段 里定义，单独建卡只增加查找成本 |\n| 疲劳战术、震仓的心理学设计 | 属于「CM 为什么要这么干」的叙事，理解即可，不产生新判据 |\n| 第 5-6 章的案例 | 教学案例，读完即用，不抽卡 |\n| 「CM 操纵市场」的框架 | 作者自己也说「不认为做市商操纵了价格」；只需保留「有人比你更早知道供求变化」这个弱版本 |\n\n## 与库内已有卡的关系（避免混用）\n\n| 已有卡 | 关系 |\n|---|---|\n| 强度盒信号（Arms） | 同族：都是量价位置工具。强度盒给**一个盒子里的量价对比**，本卡给**逐根蜡烛的买卖力对比** |\n| 等量图Equivolume（Arms） | 同族：都主张「量是价格的一维」，威科夫用蜡烛长度 vs 柱高 |\n| 简易波动指标EMV | 不同源：EMV 是数理化的「容易移动程度」，威科夫是完全不看指标 |\n| 突破真假三验证（墨菲） | 墨菲用**幅度/时间/角色**验真；威科夫用**突破时的量能**验真。同一问题的两套尺子，可互证 |\n\n## 与《量价分析》（安娜·库林）的分工\n\n两本都讲威科夫，但是两条路：\n- **本书（孟洪涛）**：讲**判断**——怎么看一根蜡烛的供求含义；\n- **库林那本**：讲**规则**——把威科夫提炼成几条可执行的量价法则。\n\n我先把判断层（本书）拆完，再拆规则层。\n\n## 局限\n\n- **严重依赖「CM（聪明钱）」这个人格化主体**，但作者没有给出任何识别 CM 身份的客观方法；「CM 想干什么」是不可证伪的叙述；\n- 案例全是**事后标注**的图（「蜡烛 9 是非常关键的 Spring」）——**幸存者偏差风险高**，书中没有一个带胜率的统计；\n- 期货与美股小时图为主，A 股 ETF 的成交量含集合竞价与做市商报价，量能含义有差异；\n- 「右手边」「幅度很小」「长蜡烛」这些词**没有数值定义**，落到自动化里必须自己定阈值。\n\n## 来源\n\n原书 epub 已归位 `我的书架/投资与经济/威科夫操盘法/`，全文提取件 `威科夫操盘法-全文提取.md`（11.5 万字符）。本卡引用第 1、2、4 章。\n\n> 免责：技术形态是概率不是保证。AI 内容仅供学习参考，不覆盖个人止损与定投纪律。",

   "body": "# 我如何从股市赚了 200 万\n\n> 一句话：**一只股票要涨，就必须一层一层往上爬「箱体」**；价格在箱子里怎么跳都行，**跌破箱子底就出局**——作者是个职业舞蹈演员，用这套方法在 18 个月里把 1 万做成 200 万。\n\n## 作者的荒唐处，正是这本书的价值\n\n达瓦斯不是金融从业者，是**巡回演出的舞蹈演员**。他在 1950 年代靠**电报**和《巴伦周刊》交易，一天看不了几次报价。\n\n所以这本书的结论对「不能盯盘的人」特别有用：\n- 他不看基本面（「没必要再去关心股价上涨背后的原因」）；\n- 他不看盘口（没条件）；\n- 他只做一件事：**判断箱体，然后挂好单，等电报**。\n\n## 他的三次转变（书的骨架）\n\n| 阶段 | 用什么 | 结果 |\n|---|---|---|\n| 第一部分「赌徒」 | 听消息、凭感觉 | 亏 |\n| 第二部分「基本面分析」 | 读报表、看盈利 | **亏**（他自己说「错误的思路」） |\n| 第三部分「技术分析」 | 只看价与量 | 赚 |\n| 第四部分「技术+基本面」 | 仍然以技术为主 | 200 万美元 |\n\n**关键转折**：他买 M&M 木制品公司，对这家公司「一无所知」，只因走势与之前赚钱的那只像，结果正好赶上一桩他不知道的并购。他的推论：\n\n> 如果公司的某些基本面出现了好的变化，就会有很多人急着去买它，结果是，这种利好消息很快会反映在公司股价上涨和成交量放大上。\n\n## 箱体理论（第 4 章，全书核心）\n\n### 定义\n> 股价会在高低点之间不断波动。围绕这一涨跌波动区间画出的区域就代表一个**箱体**。\n\n### 买入条件\n> 当我感兴趣的某只股票的股价波动箱体，**像金字塔一样层层叠加**，且当时股价正处在最上面的一个箱体里时，我开始关注这只股票。\n> 当我时刻关注的走势是，**向上突破到下一个股价更高的箱体**时，我就会买进。\n\n### 卖出条件\n> 如果它跌到 44½ 美元，我就会卖出，以免股价跌破本箱体进入一个更低的箱体。\n> 因为一旦跌破本箱体的下轨 45 美元，就意味着股价正在跌回一个更低的箱体里，**那么一切都不对头**——我需要的是股价不断进入更高箱体的股票。\n\n### 箱体宽度\n> 有些股票的波动范围很窄，可能每次不超过 10%。而另一些宽幅波动的股票的波动范围在 **15%～20%** 之间。**我的任务是准确判断箱体的范围**。\n\n### 箱体内的回调不是坏事\n> 舞蹈演员在腾空跳起前，都要先下蹲以便获得腾跳的冲力。\n> 股价在创出 50 美元的高点后回调到 45 美元的走势，还有另外一个重要好处，即通过这种回调**将那些不坚定的、动摇的持筹者震出去**。\n\n## 他总结的四条原则（第 4 章末）\n\n1. **快速止损**：25 美元买入，跌到 24 就卖（约 −4%）；「如果某只股票跌到了我认为它们应该跌到的价位以下……自动帮我止损售出」；\n2. **不让手续费吃掉本金**：10 000 美元本金、每次来回 250 美元手续费，**40 次交易就亏光**；\n3. **止损随股价上移**：「持有一只正在上涨的股票，但同时保证止损卖出单的止损价与股价一起同步上提……我永远只会损失小部分利润，从而保住大部分利润」；\n4. **箱体金字塔开始向下就卖**：用百老汇比喻——只要剧院满座就一直演，出现空座才停演。\n\n## 本书提炼的知识卡（2 张）\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 箱体理论 | 方法 | 箱体层层上移才做，跌破下轨就出；箱体宽度 10%~20% 视标的而定 |\n| 移动止损 | 方法 | 止损价随价格上移，差价要容得下正常波动；只损小部分利润，保住大部分 |\n\n## 看过但不建卡的（写明为什么）\n\n| 内容 | 为什么不建卡 |\n|---|---|\n| 「快速止损」 | 与 海龟止损、止损触发三问 重叠；且他的 −4% 是 1950 年代美股口径，不能直接搬 |\n| 手续费损耗（40 次交易亏光） | 库内已有 成本拖累，同一结论 |\n| 「停损买单自动进场」 | 库内已有 止损单两用（Arms 讲得更细：止损单可以当买入委托用），本文只是同一个用法 |\n| 电报/《巴伦周刊》获取行情的方式 | 历史细节，读着有趣，无迁移价值 |\n| 第 8~10 章的交易流水 | 案例，不抽卡 |\n\n## 与我的体系对位（最强的一处）\n\n| 我的 | 达瓦斯 |\n|---|---|\n| 形态二：突破 + 次日确认 | **突破箱体上轨 = 进**，且要求「箱体层层上移」 |\n| v1.18a 破位止损 | **跌破箱体下轨 = 出**，他的止损位就是下轨 |\n| 1N 止损 | **箱体宽度 ≈ 1 个 N**（10%~20% 的箱子，等于说「一个箱子的高度就是止损距离」） |\n| 「拿不住盈利单」 | **止损随股价上移**：不预测顶部，让止损替你做决定 |\n\n**这本书最值得我抄的一句话**：\n> 只有上涨的股票和下跌的股票——而我应该持有上涨的股票，并卖出下跌的股票。\n\n**最值得警惕的一处**：他靠「箱体层层叠加」判断，而**A 股 ETF 的箱体常常是横向的**（宽基指数长期横盘），没有金字塔。所以「层层上移」这个前提在我的标的上经常不成立。\n\n## 局限\n\n- **幸存者偏差极强**：这是一本成功者的自述，没有失败的年份细账（他自己也写过亏光的时候，但那是「学习阶段」）；\n- 「箱体」的上下轨**没有客观算法**——他是看图目测的，「任务就是准确判断箱体的范围」，不可复制；\n- 1950 年代美股：无涨跌停、T+0、手续费按笔收，与 A 股 ETF 完全不同；\n- 「有一半时间判断正确」是他自己的估计，实际可能更低；\n- 书中大量具体价位（44½、59¾）已无意义。\n\n## 来源\n\n原书 epub 已归位 `我的书架/投资与经济/我如何从股市赚了200万/`，全文提取件 `我如何从股市赚了200万-全文提取.md`（9.1 万字符）。核心在第 4 章「发展箱体理论」。\n\n> 免责：技术形态是概率不是保证。AI 内容仅供学习参考，不覆盖个人止损与定投纪律。",

   "oneliner": "《指数基金投资从入门到精通》，老罗（广发基金指数投资部负责人）著，电子工业出版社。一本面向普通上班族的指数基金实战入门书——从\"指数是什么\"讲到\"不同市场用哪种策略\"，是目前库里最全的一本\"指数基金地图 + 操作手册\"。  2026-09-10 补齐全书拆解：此前只有 10 篇章节笔记（概述级），本次通读全文（19.4 万字 / 70 个内容文件）后补齐 6 张知识卡，全书正式收官。",
   "source": "02-来源卡/指数基金投资从入门到精通/指数基金投资从入门到精通.md",
   "body": "# 指数基金投资从入门到精通\n\n> 《指数基金投资从入门到精通》，老罗（广发基金指数投资部负责人）著，电子工业出版社。一本面向普通上班族的指数基金实战入门书——**从\"指数是什么\"讲到\"不同市场用哪种策略\"，是目前库里最全的一本\"指数基金地图 + 操作手册\"。**\n>\n> **2026-09-10 补齐全书拆解**：此前只有 10 篇章节笔记（概述级），本次通读全文（19.4 万字 / 70 个内容文件）后补齐 6 张知识卡，全书正式收官。\n\n## 这本书适合谁\n\n- 想理财但没时间研究股票、基金的**上班族、月光族**；\n- 想靠定投强制储蓄、做长期投资（教育金、养老金）的人；\n- 已经会\"无脑定投\"、想知道**不同市场该换什么打法**（牛/熊/震荡各有策略）的人；\n- 路线 A 定投者想补 ETF 实操细节（场内场外、A/C 份额、分级基金历史）的。\n\n## 一句话核心\n\n普通人最靠谱的理财方式 = **定投指数基金**；但\"傻傻地买\"只是起点，真正拉开差距的是三件事——**用估值判断贵贱（买什么、何时买）、按市场状态切换策略（牛满仓 / 熊金字塔 / 震荡网格）、按纪律止盈落袋（会卖才是自己的钱）。**\n\n## 学习路径（建议按顺序读）\n\n1. 先懂「为什么」→ 第1章 指数基金的魅力\n2. 再懂「买什么」→ 第2章 指数的介绍 + 第3章 指数基金入门知识\n3. 实操「怎么买」→ 第4章 指数基金技巧 + 第5章 ETF基金\n4. 核心「定投」→ 第7章 基金定投入门 + 第8章 基金定投高级\n5. 进阶「策略」→ 第9章 指数基金投资策略\n\n## 全书最关键的 5 个结论\n\n1. **定投微笑曲线**：下跌时摊低成本，涨回来就赚，越跌越该坚持（不是越跌越怕）。\n2. **估值定买卖**：PE/PB 处历史低位买、高位卖；周期行业要**反向**（高PE低PB买、低PE高PB卖）。\n3. **博格公式**：长期收益 ≈ 股息率 + 市盈率变化 + 盈利增长——判断指数贵不贵的通用尺子。\n4. **费用省一点，长期赚很多**：指数基金费率低，是长期跑赢主动基金的关键。\n5. **策略分市场**：牛市满仓、震荡分批/网格、熊市金字塔越跌越买——**用错市场比用错品种更致命**。\n\n## 本书提炼的知识卡（2026-09-10 补齐）\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 定投止盈三法 | 方法 | 会买只是第一步，**会卖**才落袋——市场情绪法 / 目标收益率法 / 估值分批法三套组合用 |\n| 智能定投（定期不定额） | 方法 | 把\"定期定额\"升级为\"跌多买多、涨多买少\"：偏离度 5% 一档 × 级差 |\n| 金字塔法买入策略 | 方法 | 熊市专用：资金 10%/20%/30%/40% 四层，跌得越多补得越多，加仓幅度随估值调 |\n| 网格交易法 | 方法 | 震荡市专用：跌一格买、涨一格卖；四大风险 + 选品五条件 + 底仓防踏空 |\n| 二八轮动策略 | 方法 | 大小盘动量轮动：比 20 日涨幅持强指数，双跌切国债；C 类份额是最佳工具 |\n| 核心-卫星策略 | 方法 | 大类资产配置 ETF：核心宽基打底（60%~80%）+ 卫星行业/主题搏弹性 |\n\n> 本书第 7 章「为什么坚持不到牛市」的 5 个故事，是 定投计划落纸面（螺丝钉）的**姊妹论证**：一个讲\"计划怎么落纸面\"，一个讲\"不落纸面会怎么死\"。\n> 成本拖累（共同基金常识）与本卡第 4 条\"费用省一点\"是同一条底层逻辑；股债差择时（李大霄投资战略）给\"估值定买卖\"提供了第二个独立信号。\n\n## 快速查表\n\n| 想干什么 | 看哪篇 |\n|---------|--------|\n| 搞清楚该不该买指数基金 | 第1章 指数基金的魅力 |\n| 认识沪深300 / 中证500 等指数 | 第2章 指数的介绍 |\n| 搞懂场内/场外、A/C 份额 | 第3章 指数基金入门知识 |\n| 学会算指数贵不贵 | 第3章 指数基金入门知识（博格公式）|\n| 选一只合适的 ETF | 第5章 ETF基金 |\n| 开始定投 | 第7章 基金定投入门 |\n| 定投赚了怎么卖（止盈）| 第8章 基金定投高级 → 定投止盈三法 |\n| 想让定投\"跌多买多\" | 第8章 基金定投高级 → 智能定投（定期不定额） |\n| 震荡市想赚波段 | 第9章 指数基金投资策略 → 网格交易法 |\n| 熊市该不该加仓、怎么加 | 第9章 指数基金投资策略 → 金字塔法买入策略 |\n| 想在大盘/小盘之间切换 | 第9章 指数基金投资策略 → 二八轮动策略 |\n| 想做资产配置打底 | 第9章 指数基金投资策略 → 核心-卫星策略 |\n\n## 提醒\n\n- 本书数据截止 2017/2018 年，具体数字（费率、产品、规模）以当前市场为准。\n- 第 6 章「分级基金」已于 2020 年前后清盘/转型退出 A 股，作历史知识了解即可，无需实操。\n- **与 指数基金投资指南（螺丝钉）的分工**：老罗书是\"地图 + 多策略工具箱\"（品种全、策略多、适合打底），螺丝钉书是\"低估定投单一策略的深挖\"（把\"估值定买卖\"做成具体阈值）。两本配合读，路线 A 才算闭环。\n- 本书的策略类章节（网格 / 二八 / 金字塔）属于路线 A 的**操作增强**，**不是路线 B 的短线系统**——路线 B 仍走 ETF交易系统 §三。\n\n## 来源\n\n- 原文（全文提取）：`01-原料/书籍/我的书架/投资与经济/指数基金投资从入门到精通/指数基金投资从入门到精通-全文提取.md`（70 文件 / 19.4 万字）\n- 原书 epub：`01-原料/书籍/我的书架/投资与经济/指数基金投资从入门到精通/指数基金投资从入门到精通.epub`\n- 章节笔记（10 篇）：本目录 `笔记/`",

   "body": "# 指数基金投资指南\n\n> 《指数基金投资指南》，银行螺丝钉著，中信出版社。国内最系统的「低估定投指数基金」实操书——把格雷厄姆的价值投资 + 博格的低成本指数化，落成一套普通人能照做的买卖规则。作者自述全书核心就一句：**用价值投资理念挑出被低估的指数基金，再用定投的方式买它。**\n\n## 这本书适合谁\n\n- 想用定投做长期理财（教育金/养老金）的上班族——本书就是给\"每月有稳定工资、没时间盯盘\"的人写的；\n- 已在路线 A 定投、但只会\"无脑定期买\"，想知道**怎么判断贵贱、什么时候该卖**的人；\n- 注意：它讲的是**低估买入 + 长期持有**（路线 A），不是短线波段（路线 B），别混用。\n\n## 一句话核心\n\n**现金不是资产，能\"钱生钱\"的才是资产；长期看股票类资产收益最高，指数基金是普通人买股票的最优载体；只在指数低估时定投、正常时持有、高估时分批卖——比无脑定投收益高出一倍以上，风险还更低。**\n\n## 全书脉络（8 章）\n\n1. **观念层**（第1章）：攒资产而不是攒现金；分清能/不能产生现金流的资产；看收益更要看风险——先立\"买资产\"的底层观念\n2. **工具层**（第2–3章）：什么是指数、指数基金怎么来的；宽基 vs 行业指数、常见品种盘点（上证50/沪深300/中证500/红利等）\n3. **估值层**（第4章，全书最核心）：格雷厄姆价值投资三块（价格与价值/能力圈/安全边际）→ 四个估值指标（市盈率/盈利收益率/市净率/股息率）→ **盈利收益率法**和**博格公式法**两套\"判断贵贱\"的武器\n4. **执行层**（第5–6章）：懒人定投法（怎么买怎么卖）+ 构建属于自己的定投计划（四步落纸面）\n5. **配置层**（第7章）：货币基金/债券基金怎么用——短钱放货基，家庭资产怎么搭\n6. **心理层**（第8章）：下金蛋的鹅（别杀鹅）、复利从哪来、买入低估品种为何还会跌——长期持有的心理建设\n\n## 全书最关键的 5 个结论\n\n1. **现金不是资产**：长期持有现金必被通胀稀释（80年代1万元≈今天2个月收入）；钱要换成能\"生钱\"的资产\n2. **股票长期收益最高**：西格尔统计美国200年，1美元股票→70万美元、债券→1778美元、黄金→4.52美元；**只有股票能长期跑赢通胀**\n3. **低估才值得定投**：无脑定投年化12%上下；只在低估时买，年化可到29%（上证50/红利2004–2015回测）——同样买指数，\"贵了买\"和\"便宜买\"收益差一倍以上\n4. **盈利收益率是散户最好用的尺子**：>10%开始定投、6.4%~10%持有、<6.4%分批卖出（数值随无风险利率调整）\n5. **计划必须落在纸面上**：把每月定投额、买入条件、卖出条件写成表贴在眼前——这是对抗情绪、坚持3年以上牛熊周期的关键\n\n## 本书提炼的知识卡\n\n> 共 **14 张**（方法 10 + 概念 4）。**2026-09-10 补齐**：原只有 4 张（2 方法 + 2 概念），本轮补拆第5–8章的实操技法、费用、分红、复利、心理五块，**新增 10 张**。\n\n### 第一层 · 估值与买什么（第1–4章）\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 盈利收益率定投法 | 方法 | 用 E/P 当尺子：>10% 买、6.4%~10% 持有、<6.4% 分批卖（阈值随无风险利率平移） |\n| 低估是一个区域 | 概念 | 低估是区间不是点，不必等历史最低，回到正常估值就该停投 |\n| 资产与现金流 | 概念 | 现金不是资产，能\"钱生钱\"的才是资产（第1章观念层） |\n| 金鹅与瘦鹅 | 概念 | 好资产是下蛋的鹅别杀；低估便宜货是会胖的瘦鹅（第8章心理层） |\n\n### 第二层 · 怎么买、买多少（第5章）\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 定投收益放大器 | 方法 | 定期不定额：本月金额 = 基准 × (1+档位级差)^n，n=1 效果已不错、n=2 足够（H股ETF 回测 10.2%→12%→13.1%） |\n| 分批投入存量资金 | 方法 | 有一笔钱时按「100−年龄」定比例，拆 20 份逐月投，余钱先放货基/债基 |\n| 定投频率选择 | 方法 | 周投/月投长期差距 <1%，按\"哪个更能坚持\"选——急性子按周，省心者按月 |\n| 指数基金费用清单 | 方法 | 6 类费用 + 三条铁律（低费率渠道 / 别频繁交易 / 优先老基金）；A 类 vs C 类算术 |\n| 分红再投入与填权 | 方法 | 除权必填权，分红是真收益；低估再投入、不低估换其他低估品种（分红再投复利：恒指 260→680 倍） |\n\n### 第三层 · 计划与配置（第6–7章）\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 定投计划落纸面 | 方法 | 四步写成表贴起来：现金流 → 选品 → 计划表（买卖条件）→ 记录优化；**\"心里有数\"是最常见的失败借口** |\n| 三类定投计划模板 | 方法 | 养老（只进不出+4%取用+高股息）/ 加薪（收入60%+阈值操作）/ 教育（放宽卖出保现金） |\n\n### 第四层 · 为什么拿得住（第8章）\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 定投双核制 | 方法 | 防御核=场外现金流（工资），进攻核=低估指数基金；个人投资者\"不怕赎回\"是结构优势 |\n| 复利三来源 | 方法 | 低买高卖 + 盈利再投入 + 分红再投入；后两种持有即享有，但通常不可兼得 |\n| 价格围绕价值波动 | 概念 | 短期看供求、3~5 年才看估值；\"买了低估还跌\"是时间尺度问题不是判断错误 |\n\n> 全书逻辑链：**为什么买（观念）→ 买什么（估值）→ 买多少（放大器/分批）→ 怎么省（费用/分红）→ 怎么坚持（计划/双核/心理）**。原 4 张（盈利收益率定投法/定投计划落纸面/资产与现金流/金鹅与瘦鹅）是骨干，本轮新增 10 张是各环节的实操细化。\n\n**补录（认领覆盖核查 2026-09-10）**\n- 双轨并用决策（方法）—— 路线 A 长期存在两种玩法，过去纠结\"该选哪个\"。已定论：双轨并用——关键是别给全组合设一个固定\n\n## 与老罗《指数基金投资从入门到精通》的关系\n\n- 老罗书（指数基金投资从入门到精通）= 指数基金**科普地图**：品种、费用、场内场外、定投入门，走\"逐章笔记\"路线，适合先读打底；\n- 本书 = 低估定投的**进阶执行手册**：把\"估值定买卖\"从口号变成具体阈值（盈利收益率 10%/6.4%），补足了老罗书里\"怎么算贵、贵了怎么办\"的实操细节。\n- 学完老罗打底 → 再学本书的估值与执行，路线 A 就闭环了。同一主题在 MOC 中互为补充，不冲突。\n\n## 提醒\n\n- 书内估值阈值（10%/6.4%）基于 2017 年前后的无风险利率（约3.5%），**数值要随十年期国债收益率调整**；方法不变，数字可平移。\n- 盈利收益率法只适用于**盈利稳定、流动性好的宽基**（红利/上证50/恒生等）；成长型、周期型品种要用博格公式法（股息率+市盈率变化+盈利增长三因素）或看 PE/PB 历史分位。\n- 港股类品种（恒生/H股）内地投资者有分红税与换汇成本，盈利收益率要**打9折**再比。\n- 书中回测收益含中国经济高速增长红利，未来大概率没有 29% 那么高，作者自己也说\"15%~20% 更现实\"——别拿历史收益当承诺。\n\n## 来源\n\n- 原文（epub 提取）：`01-原料/书籍/我的书架/投资与经济/指数基金投资指南/指数基金投资指南-全文提取.md`\n\n## 状态\n\n**读完 ✅（2026-09-10 补齐第5–8章）**——全书 8 章完整覆盖，提炼 15 张知识卡（方法 13 + 概念 2）。至此**路线 A 的三本支柱（指南/老罗/共同基金常识）中，指南与老罗均已收官**。\n\n## 与其他书的互补\n\n- 与老罗《指数基金投资从入门到精通》：**螺丝钉给阈值（简单可执行），老罗给三法并列（覆盖面广）**；两书在估值止盈上互为补充，不冲突；\n- 与 定投止盈三法：本卡的 6.4% 单阈值 vs 老罗的\"市场情绪/目标收益率/估值分批\"三法并用——实操可组合。见 定投止盈三法。",

   "oneliner": "《李大霄投资战略》（第三版，经济日报出版社），李大霄著。作者是英大证券首席经济学家、A 股最知名的\"网红\"分析师之一，以给底部/顶部起名著称（钻石底、地球顶、婴儿底、地平线）。第三版收录 2007—2024 十七年的大势观点原文摘录，是罕见的\"观点+事后验证\"完整样本。全书核心主张：余钱投资、理性投资、价值投资——在悲观中拥抱最低估最优质的蓝筹龙头，远离高估五类（小、新、差、题材、伪成长）与一切杠杆。",
   "source": "02-来源卡/李大霄投资战略.md",
   "body": "# 李大霄投资战略\n\n> 《李大霄投资战略》（第三版，经济日报出版社），李大霄著。作者是英大证券首席经济学家、A 股最知名的\"网红\"分析师之一，以给底部/顶部起名著称（钻石底、地球顶、婴儿底、地平线）。第三版收录 **2007—2024 十七年的大势观点原文摘录**，是罕见的\"观点+事后验证\"完整样本。全书核心主张：**余钱投资、理性投资、价值投资——在悲观中拥抱最低估最优质的蓝筹龙头，远离高估五类（小、新、差、题材、伪成长）与一切杠杆。**\n\n## 这本书适合谁\n\n- 想知道\"**怎么判断现在是贵还是便宜、该贪婪还是该恐惧**\"的人——李大霄给了一整套 A 股土生土长的风向标与底部判据（与博格的\"别择时\"是互补关系：不信择时就读博格，要择时就必须学李大霄怎么择）；\n- 容易**追涨杀跌、扛不住孤独、被舆论一边倒带着走**的人——第三部分的人性篇是全书最普适的部分；\n- 路线 A 宽基投资者：他的底部/顶部判据（估值、股息率、股债差、政策风向）可以直接给**定投节奏与止盈时机**做参考。\n\n## 一句话核心\n\n**投资赚的是上市公司创造财富的钱（共同富裕），投机赚的是对手口袋里的钱（财富转移）。普通人想成为赢家，只有：用 30~50 年不用的余钱、远离杠杆、买最低估最优质的好公司（好基金）、在别人绝望时敢买（1664点需勇气）、在别人狂热时肯卖（6124点需淡泊）、中间拿得住（3000点需坚持）——并且第一时间认错。**\n\n## 全书脉络（五部分）\n\n1. **投资哲学**（第一部分）：风险偏好与品种分级（杠杆越高越要远离）；\"不差钱\"（余钱+后备资金决定策略与心态）；投资 vs 投机；\"坐轿子\"与\"抬轿子\"；**财富转移五路径**；交易的最高境界是少交易；**股市赚钱概率=考全班前 5 名**（一赚二平七亏）；股票市场生命周期三大规律（长期持有 / 第一时间认错 / 企业生命周期）；巴菲特与李嘉诚案例\n2. **大势研判**（第二部分）：**四大风向标**（上市公司增减持、中石油、汇金、社保基金）+ 其他市场联动（货币/资源/商品）+ **政策动向要站国家高度** + **估值水平\"摘荔枝/摘熟苹果\"** + 重大历史事件要有 8~12 个月提前量\n3. **心态与人性**（第三部分）：6124点需淡泊、1664点需勇气、3000点需坚持；警惕舆论一边倒；承受不被认同的孤独（夫妻账户都要分开）；经得住折腾；股市墨菲定律；追涨杀跌；乐观者胜出；把钱交给对社会有正面作用的公司\n4. **股市杂谈**（第四部分）：怎么正确看待股评（七条——看多声音天然占优的机制原因）；赌经济还是赌政策（中国要看重政策）；加大分红是利好；恐惧踏空 vs 恐惧套牢；抓大放小；普通人别碰股指期货/融资融券\n5. **大势实战 2007—2024**（第五部分）：全部观点按年月原文摘录——2245\"摘荔枝\"、6124\"摘熟苹果\"、1664 底部、1849 五大理由、5178\"地球顶\"五大逻辑、2850\"婴儿底\"、2440 第五个历史大底、万亿巨量不涨风险、美股百年第四顶、3000 点之下珍惜时光、核心资产牛市、股债差历史高位、2024 年 9 月 2689 点收尾\n\n## 全书最关键的 6 个结论\n\n1. **余钱三原则是入场券**：余钱投资（30~50 年不用的钱）、量力而为、远离杠杆——杠杆（期货 400 倍、股指期货 6~12 倍、2008 年美欧金融机构 20~50 倍）是普通人唯一不能碰的东西，\"管理好自己现有的财富已是艰巨任务\"\n2. **财富转移五路径 + 投资例外**：投机市场里钱从 新股民→老股民、散户→庄家、低技巧→高技巧、心态坏→心态好、小机构→大机构 流动；**唯有投资上市公司是共同富裕**——支持创造财富的好公司，赚企业成长的钱\n3. **四大风向标判断大势**：上市公司增持/回购（买自家股票=价格到满意低位）、中石油、汇金、社保基金——**它们买入是底部区域信号，退出是顶部信号**；辅以政策风向、估值水平、股债差。核心逻辑：最有钱、最懂政策、几乎没有失手过的资金在做什么\n4. **底部五判据**（1664/1849/2440 反复验证）：估值历史低位区（沪指 PE 10.8~14.6 倍、大盘股息率>存款利率）+ 救市政策组合拳（汇金社保入场、IPO 减速、指数基金重启）+ 产业资本由减持转增持 + 杠杆出清（融资余额腰斩）+ 情绪极致悲观（舆论一边倒看空）。顶部反向同理（地球顶：主板 PE 86 倍、创业板 150 倍+产业资本巨额减持+万亿巨量不涨）\n5. **人性定律**：正确信息往往不被选择（墨菲定律）；舆论一边倒时更要警惕（998/1664 看空一边倒=底，6124 狂热=顶）；最难坚持的不是漫长下跌而是下跌后刚开始回升时；6124 恐惧踏空→套牢，1664 恐惧套牢→踏空；**克服从众、承受孤独是成功的关键突破点**\n6. **高估五类是财富粉碎机**：小、新、差、题材、伪成长——\"很多人用毕生积累的财富，就因为缺乏知识购买了高估五类股票而消耗掉了\"；买股票要**正着选**：低位先选全球最好的公司→全国第一→全国第二，绝大部分人是倒着选的\n\n## 本书提炼的知识卡\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 李大霄四大风向标 | 方法 | 看\"最有钱、最懂政策、几乎没失手过\"的资金在做什么（增持回购/中石油/汇金/社保） |\n| 李大霄底部五判据 | 方法 | 估值低位 + 政策组合拳 + 产业资本增持 + 杠杆出清 + 情绪极致悲观 |\n| 股债差择时 | 方法 | 股债收益差到历史极端时，就是该换仓的信号（2024-02 案例：一周后 V 型反转） |\n| 余钱投资三原则 | 方法 | 余钱投资（30~50 年不用）、量力而为、远离杠杆——入场券级别的门槛 |\n| 高估五类 | 概念 | 小、新、差、题材、伪成长——财富粉碎机；买股票要\"正着选\" |\n| 财富转移五路径 | 概念 | 投机市场里钱的五条流动路径；唯有投资上市公司是共同富裕 |\n| 淡泊勇气坚持 | 概念 | 克服从众、承受孤独是成功的关键突破点 |\n\n## 对本库双路线的映射\n\n- **路线 A（宽基定投）**：李大霄的底部/顶部判据与\"越跌越买\"完全同向——估值+股债差低位对应加大定投的\"加仓档\"，估值极端高位（摘熟苹果信号）对应止盈/减档参考。他的风向标（汇金/社保/产业资本）可进 ETF 复盘观察池。\n- **路线 B（题材短线）**：李大霄是\"题材\"的坚定反对者（高估五类含题材），其体系**不支持路线 B 的选股逻辑**；但\"第一时间认错\"（规律二）与路线 B 硬止损完全一致，\"追踪涨杀跌\"可作短线心法纠偏。\n- **注意立场差异**：李大霄坚持蓝筹核心资产、反对题材投机——与博格\"买下整个市场\"（不挑个股）、欧奈尔/海龟（趋势+成长股）构成三种不同的流派。本库 MOC 里三者并存，**用哪派取决于你要不要做个股判断**；对纯 ETF 用户，博格+李大霄的组合（指数化+大周期择时档位）最贴近实际操作。\n\n## 提醒\n\n- 书中大量**点位预测**（婴儿底/地球顶/钻石底）事后有对有错，李大霄自己也写\"我也有过于乐观的时候\"——**学他的框架与纪律，不要抄他的点位结论**。区域判断（低估区/高估区）比点位判断可靠得多，这正是他\"估值水平\"一节的要义。\n- 第五部分是观点摘录（带明显个人风格与重复），入门者重点读第一~四部分；第五部分当\"A 股 2007—2024 牛熊案例库\"查阅。\n- 书成于 2024 年 9 月末（后记），彼时判断\"核心资产或迎缓慢悠长慢牛，仅限余钱好股\"。\n\n## 来源\n\n- 原文（epub 提取）：`01-原料/书籍/我的书架/投资与经济/李大霄投资战略/李大霄投资战略(第三版)-全文提取.md`",

   "body": "# 海龟交易法则\n\n> 一句话：理查德·丹尼斯培养\"海龟\"交易员的真实亲历者，把一套完整的趋势跟踪系统（入场→仓位→止损→退出）和交易者心理讲透——**决定交易成败的不是系统，是执行系统的人。**\n\n## 基本信息\n- 作者：柯蒂斯·费思（Curtis Faith），海龟中最成功者之一，曾为丹尼斯赚 3100 万美元\n- 主题领域：交易系统设计 · 资金管理 · 交易心理\n- 读它的目的：把我\"追高、死扛、截断利润\"的毛病，换成一套**有明确数字、可机械执行**的规则\n\n## 全书脉络\n1. 第一章 玩风险游戏的交易者 —— 市场参与者与流动性风险\n2. 第二章 揭秘海龟思维 —— 情绪陷阱 + 海龟交易策略概述\n3. 第三章 海龟培训课程 —— 破产风险 / 资金管理 / 优势 / 趋势跟踪\n4. 第四章 像海龟一样思考 —— 避免结果偏好 / 概率思维 / 为自己负责\n5. 第五章 发现系统优势 —— 优势三大要素 / 优势比率\n6. 第六章 寻找交易时机 —— 支撑阻力 / 突破 / 价格不稳定点\n7. 第七章 如何衡量风险 —— 四大风险 / 风险回报量化\n8. 第八章 风险与资金管理 —— 头寸单位 / 生存第一 / 风险衡量\n9. 第九章 海龟式积木 —— 趋势跟踪系统模块\n10. 第十章 海龟式交易系统 —— 六个系统与测试\n11. 第十一章 历史测试的谎言 —— 交易者效应 / 随机效应\n12. 第十二章 历史测试的统计学基础\n13. 第十三章 防卫系统 —— 应对黑天鹅\n14. 第十四章 掌控自己的心魔\n15. 附 原版海龟交易法则 —— 完整规则原文\n\n## 提炼出的知识\n\n### 方法（可执行规则）\n- 唐奇安突破入场 —— 突破 20/55 日新高才买，代替\"看到涨就追\"\n- 海龟头寸规模 —— 按波动率 N 定仓位：让每单位头寸的 1N 波动 = 账户的 1%\n- 海龟止损 —— 入场价下方 2N 无条件离场（≈账户 -2%），杜绝死扛\n- 海龟加仓 —— 只朝盈利方向每 1/2N 加一单位，最多 4 单位（顺势金字塔，绝不摊平）\n- 海龟退出 —— 反向 10/20 日突破清仓，让利润自己奔跑（系统化移动止盈）\n- 机械交易系统 —— 规则写死、信号驱动、执行不掺情绪\n\n### 概念\n- N值 —— 波动性标尺（20 日 ATR），仓位、止损、加仓都以它为单位\n- R乘数 —— 用\"初始风险的倍数\"衡量每笔盈亏，跨系统可比\n- 期望值 —— 正期望才是赢家系统；单笔结果无意义，看长期\n- 交易认知偏差 —— 八大偏差：损失厌恶 / 沉没成本 / 处置效应 / 结果偏好 / 近期偏好 / 锚定 / 潮流 / 小数定律\n\n## 我的感受 / 行动\n\n- 我交割单的三大毛病，书里逐条命中：追高 → 该用突破入场；死扛 → 该用 2N 止损；赚 2% 就跑 → 该用 10/20 日反向退出。\n- 最颠覆认知的一句：**胜率不重要，重要的是\"赚时赚多少、亏时亏多少\"**（期望值）。这正好解释了我胜率 44.8% 却亏钱。\n- 行动：把本书规则浓缩为一张\"海龟纪律卡\"，对照我已有的 ETF 操作指南使用；下一本《交易心理分析》继续深化\"执行系统\"的部分。\n\n## 本书提炼的知识卡\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 唐奇安突破入场 | 方法 | 海龟用唐奇安通道（Donchian channel）找入场点：盯住过去一段时间的最高价/最低价， |\n| 机械交易系统 | 方法 | 海龟们 10 个人学同一套规则，结果天差地别，差别不在系统而在执行。机械交易系统 = 把入场、仓 |\n| 止损触发三问 | 方法 | 止损线是买入前写好的\"最大可承受亏损\"兑现点，它只回答\"风险预算用完了\"，不回答\"该不该离场\"。 |\n| 止跌企稳三信号 | 方法 | \"等企稳再进场\"（ETF交易系统 3B.5 离场后重进、3A.1 不接飞刀）经常因三个词 |\n| 海龟加仓 | 方法 | 海龟不一次性满仓，而是分批建仓，但批次只在价格朝有利方向移动时加：价格每上涨 1/2N（半个 N |\n| 海龟头寸规模 | 方法 | 海龟资金管理的核心发明：用波动性 N 来定仓位大小，让每笔交易对账户的伤害是\"预先可知、恒定\"的 |\n| 海龟止损 | 方法 | 海龟把止损定在\"入场价 ± 2N\"：N 是该品种一天的平均波动幅度（ATR），2N ≈ 两天的平 |\n| 海龟退出 | 方法 | 海龟有两套退出规则，本质都是\"移动止盈的系统化版本\"： |\n| 短线纪律核对表 | 方法 | 三本书各管一段：海龟给规则数字（入场/仓位/止损/退出），心理书给让规则执行得下去的自检问句，大 |\n| 离场三闸门 | 方法 | 1. 盘中先看①破没破；拿不准时用 止损触发三问 分类——逻辑破坏走 / 价格噪音可等反 |\n| N值 | 概念 | N = 该品种近 20 个交易日\"平均每天的真实波动幅度\"，单位是价格点数。它回答一个问题：这只 |\n| R乘数 | 概念 | R = 这笔交易一开始准备承担的风险金额（= 入场价与止损价的差 × 数量）。R乘数 = 实际盈 |\n| 交易认知偏差 | 概念 | 海龟教材里点名的八大偏差，全部来自行为金融学。它们不是\"知识不够\"，是大脑的出厂设置——知道也会 |\n| 期望值 | 概念 | 期望值 = 平均每次交易的净收益。赌场永远赢钱，不是它每把都赢，而是它每把的期望值为正（哪怕只高 |",

   "oneliner": "《漫步华尔街》（原书第12版），[美] 伯顿·G.马尔基尔著，张伟译，机械工业出版社。作者兼有学者与专业投资者双重身份（哈佛本科+商学院出身，先在华尔街投行史密斯巴尼起步，后长期担任先锋集团、保德信金融集团等多家大公司董事）。自 1973 年第1版起四十多年反复论证同一件事：股票短期走势像\"随机漫步\"一样不可预测，技术分析、基本面预测、明星基金经理都无法可靠战胜市场；普通人的最优解是买下整个市场——低成本宽基指数基金，长期持有，并按人生阶段做好资产配置与退休提款计划。",

   "body": "# 漫步华尔街\n\n> 《漫步华尔街》（原书第12版），[美] 伯顿·G.马尔基尔著，张伟译，机械工业出版社。作者兼有学者与专业投资者双重身份（哈佛本科+商学院出身，先在华尔街投行史密斯巴尼起步，后长期担任先锋集团、保德信金融集团等多家大公司董事）。自 1973 年第1版起四十多年反复论证同一件事：**股票短期走势像\"随机漫步\"一样不可预测，技术分析、基本面预测、明星基金经理都无法可靠战胜市场；普通人的最优解是买下整个市场——低成本宽基指数基金，长期持有，并按人生阶段做好资产配置与退休提款计划。**\n\n## 这本书适合谁\n\n- 路线 A 长期投资者：想要\"为什么普通人赢不了市场、所以干脆别试\"的理论根基，以及**从 20 岁到退休后\"一辈子该怎么配、退休后每年能花多少\"**的完整框架；\n- 会手痒、想频繁交易/追热点/信\"这次不一样\"的人：第2–4章的投机泡沫史 + 第6–7章的学术证据，专治\"我能跑赢市场\"的幻觉；\n- 已经懂低估定投（指数基金投资指南）、知道指数必胜的原理（共同基金常识）之后，想补**生命周期资产配置 + 退休提款纪律**的人。\n\n## 一句话核心\n\n**股价短期无法预测（随机漫步），所以与其费劲找\"下一匹快马\"，不如以最低成本买下整个市场并长期持有；真正决定你收益的是资产配置（90%以上）而不是选股，配置要跟着人生阶段走——年轻时多股票、年长时转保守但别全退，退休后用\"安全提款率\"把储蓄花到生命结束。**\n\n## 全书脉络（第12版 · 四部分 15 章 + 附录）\n\n1. **第一部分 股票及其价值**（第1–4章）：第1章提出两大定价理论——坚实基础理论（价值决定价格）与空中楼阁理论（心理决定价格），并给出随机漫步的定义；第2章大众疯狂（郁金香、南海泡沫、华尔街1929溃败）；第3章 20世纪60～90年代投机泡沫（新股热、集团企业、概念股、\"漂亮50\"、日本泡沫）；第4章 21世纪初超级泡沫（互联网泡沫、2008住房市场、加密货币）——**投机史证明市场会整体发疯**\n2. **第二部分 专业人士如何参与**（第5–7章）：第5章技术分析与基本面分析各自的技法与软肋；第6章技术分析与随机漫步（课堂抛硬币画出的\"标准股价图\"、弱式有效、\"技术分析与占星术别无二致\"）；第7章基本面分析与有效市场理论（分析师不是天眼通、共同基金长期跑不赢指数、掷硬币冠军与幸存者偏差、弱式/半强式/强式三档）——**主动管理整体无法战胜市场**\n3. **第三部分 新投资技术**（第8–11章）：第8章现代投资组合理论（风险=收益率的离散度、多样化、相关系数）；第9章不冒风险焉得财富（β、资本资产定价模型、套利定价、法玛—弗伦奇三因素）；第10章行为金融学（过度自信、判断偏差、羊群效应、损失厌恶、自豪与悔恨——个人投资者非理性全景；给投资者的教训：避免跟风、避免过度交易、要卖就卖赔钱的股票）；第11章\"聪明的β\"与风险平价——**作者对\"新款漫步鞋\"的保留态度**（价值/小盘/动量/低β溢价会失效、风险平价会出纰漏）\n4. **第四部分 实务指南**（第12–15章，全书对普通人最有用的部分）：第12章健身手册（现金储备、保险、避税账户、债券、黄金与收藏品、费用）；第13章理解与预测股票债券收益（决定收益的因素、金融市场的四个时代、未来收益预期——放低预期）；第14章**生命周期投资指南**（资产配置五原则→生命周期三准则→分龄配置→退休后的4%安全提款率与年金取舍）；第15章**三种步伐漫步华尔街**（省心省力=指数基金／亲力亲为=自选股四规则／雇替身=投资顾问）\n5. **附录**：A 衍生品基础知识、B 期货期权定价、C 指数基金/ETF参考清单；后记回应\"如果人人都指数化会怎样\"（搭便车者无害论，指数化没有杀死市场效率）。\n\n## 本书提炼的知识卡\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 随机漫步 | 概念 | 股价短期不可预测——被蒙住眼睛的猴子掷飞镖选出的组合，也能与专家选的一样好（第1、6章） |\n| 有效市场假说 | 概念 | 信息已折现进价格，主动管理难胜；弱式/半强式/强式三档（第7章） |\n| 坚实基础理论与空中楼阁理论 | 概念 | 定价只有两条路：价值决定价格（格雷厄姆）or 心理决定价格（凯恩斯）——**正对应你的路线 A / 路线 B**（第1章） |\n| 现代投资组合理论 | 方法 | 风险 = 波动率；**分散的关键是相关性低，不是数量多**——只要相关系数 <1 就能免费降风险（第8–9章） |\n| 生命周期资产配置 | 方法 | 股债配比随年龄走 + 每年再平衡——90% 以上的收益来自资产配置而非选股（第14章） |\n| 安全提款率 | 方法 | 退休后每年花初始储蓄的 3.5%~4%，提款额只随通胀微调（第14章） |\n| 三种漫步步伐 | 方法 | 省心省力（指数基金）/ 亲力亲为（选股四规则）/ 雇替身（只看费率与换手率）——**核心必须指数化**（第15章） |\n\n> **2026-09-10 补拆（\"去同存异\"批次）**：原书 4 张卡。本轮补 3 张独有卡（坚实基础理论与空中楼阁理论 第1章 · 现代投资组合理论 第8–9章 · 三种漫步步伐 第15章）。\n> 第 2–4 章（投机泡沫史）、第 5–7 章（技术/基本面分析之软肋）、第 10 章（行为金融）、第 11 章（聪明的 β）、第 12–13 章（健身手册/收益预期）、附录（衍生品）**均为上述 7 张卡的论据或属工具性内容**，按去同存异原则不另建卡。\n\n**补录（认领覆盖核查 2026-09-10）**\n- 双轨并用决策（方法）—— 路线 A 长期存在两种玩法，过去纠结\"该选哪个\"。已定论：双轨并用——关键是别给全组合设一个固定\n\n## 全书最关键的 6 个结论\n\n1. **股价短期不可预测（随机漫步）**：被蒙住眼睛的猴子朝股票列表掷飞镖选出的组合，也能与专家选的一样好；\"弱式有效\"的含义是——你无法从股价历史中找到一贯战胜\"买入持有\"的有用信息（第1、6章）\n2. **主动管理整体跑不赢指数**：1970 年的 358 只股票基金到 2017 年仅存 78 只（这还是幸存者偏差偏袒基金的结果），跑赢指数 2 个百分点以上的用手数得过来；SPIVA 报告 5 年期超过 3/4 的主动基金输给基准；连续 9 年跑赢的 14 只基金在 2008 年仅剩 1 只——**业绩没有连续性，昨日明星=今日灾星**（第7章）\n3. **市场并非完全有效，但你依然赢不了它**：有效市场假说不是说\"股价总是对的\"——股价始终是错的；它只是说没人确切知道股价过高还是过低、价格对信息反应快到来不及利用。泡沫证明市场会犯错，但错误何时来、多大，事前不可知，无法被稳定利用（第4、7章）\n4. **即使市场无效，指数化照样赢**：这是纯逻辑——所有股票必然被人持有，全体投资者平均只能拿到市场回报；主动基金平均多收约 1% 费率、周转率近 100%，整体必然输给低成本指数（第15章）\n5. **90% 以上的收益来自资产配置，不是选股**：伊博森研究——选择哪些具体股票/基金决定的收益不到 10%；资产类别配比、多样化、持有期、再平衡才是决定性因素（第14章）\n6. **资产配置随生命周期走 + 退休用 4% 法则**：年轻时激进（重股票+外国股含新兴市场），55 岁转收入导向，退休后即便年近七旬也至少保留约 40% 股票 + 15% 房地产权益（REITs）抗通胀——作者已推翻\"债券比例≈年龄\"的老经验法则；退休后每年花初始储蓄的 3.5%~4%，提款额每年只按 1.5%~2% 通胀上调，活到 100 岁钱也基本花不光（第14章）\n\n## 与前几本书的关系\n\n- **阅读链条**：老罗《指数基金投资从入门到精通》（指数基金投资从入门到精通）= 品种科普地图 → 螺丝钉（指数基金投资指南）= A股低估定投怎么买怎么卖 → 博格（共同基金常识）= 为什么低成本宽基必胜的统计证据 → **马尔基尔（本书）= 为什么\"别想战胜市场\"的理论+投机史根基，以及从 20 岁到退休后\"怎么配一辈子\"的框架**。\n- **马尔基尔 vs 博格**：结论几乎一致（低成本宽基指数、长期持有），马尔基尔多给了**生命周期资产配置与 4% 提款**的可操作框架；博格胜在成本/均值回归的严密数据，马尔基尔胜在随机漫步理论与泡沫史的可读性。\n- **马尔基尔 vs 螺丝钉（重要差异，两条流派并存）**：螺丝钉要求你主动做估值判断——低估才买、高估分批卖（盈利收益率定投法）；马尔基尔建议你别做判断——按年龄定好股债比例，买入持有+每年再平衡即可。马尔基尔也承认便宜估值（周期调整市盈率）能预测长期收益、建议新兴市场便宜时加仓，但他把\"配置纪律\"放在\"择时\"之上。**想做估值增强用螺丝钉，想省心省力用马尔基尔**，二者都是路线 A 的合法玩法。\n- **对路线 B 的提醒**：随机漫步/有效市场假说等于釜底抽薪地问短线客一句——先证明你扣掉成本后跑得赢买入持有，再谈要不要做 机械交易系统。海龟式趋势系统利用的是\"反应不足\"的弱趋势，靠的是概率+机械执行，而不是\"看图找规律\"。\n\n## 提醒\n\n- 书中账户制度（401k、IRA、罗斯、529、税收损失收割 TLH）是**美制**，中国对应个人养老金账户、公积金、场内 ETF，制度细节别照搬，但\"先花已缴税的、后花递延税的、免税的留到最后\"的思路可平移。\n- 第2–4章投机史较长，可当故事读；附录 A/B 衍生品内容入门者可跳过；**精读第1、6、7、14、15章**。\n- 4% 是从 4.5%（第9版）下调来的，作者明说低利率时代更保守可用 3.5%——**安全提款率随无风险利率与通胀调整，A 股做退休规划建议取保守值**。\n- 标普500只覆盖全市场约 75%~80% 市值，作者建议用更宽的\"整体股市指数\"（罗素3000/威尔希尔全市场）；对应 A 股即别只买沪深300，用沪深300+中证500/1000 或中证全指。\n\n## 来源\n\n- 原文（epub 提取）：`01-原料/书籍/我的书架/投资与经济/漫步华尔街/漫步华尔街-全文提取.md`",

   "body": "# 短线交易秘诀（原书第 2 版）\n\n> 一句话：**短线赚钱不靠频繁进出，靠「抓宽幅振荡日 + 拿住到收盘」**；作者用同一套系统只改持仓天数（1 天 / 2 天 / 6 天），收益从 12 837 → 30 000 → 71 600 美元，把「时间是朋友」变成了数字。\n\n## 这本书给谁写\n\n给**想做日内、又总赚不到钱**的人。作者自己的立场是反日内的——第 3 章整章在论证「你选择的时间周期越短，赚的钱越少」。\n\n对位我：**路线 B 是波段不是日内**，所以这本书的价值不在「教我做 T」，而在三件事：\n1. 突破的**量化触发**（用前日波幅定进场价，N值 的祖宗）；\n2. **假突破的形态语言**（攻击日、做市商陷阱）——512980 那笔的病因图谱；\n3. **持仓天数的收益杠杆**——治我「拿不住盈利单」。\n\n## 全书脉络（16 章）\n\n| 章 | 讲什么 | 对我有用吗 |\n|---|---|---|\n| 1 | 从短期混沌中理出头绪：市场结构、做空形态、目标时间与跟踪止损 | 半用（结构语言） |\n| 2 | 价格与时间的问题：周期、顺势 | 半用 |\n| **3** | **短线交易的真正诀窍：时间是朋友，持有到收盘** | **核心** |\n| **4** | **波动性突破：开盘价 ± 前日波幅 × 系数** | **核心** |\n| 5 | 短线交易原理：信息时代的谬误 | 略 |\n| 6 | 月度交易日（TDOM）路线图 | 不用（期货/美股节律） |\n| **7** | **获利形态：攻击日、做市商陷阱、「哎呀」** | **核心** |\n| 8 | 识别买方和卖方：最大振荡值 GSV | 可用（改造成振幅工具） |\n| 9 | 盯盘、摆动点、三根线高低点、威尔差价 | 略 |\n| 10 | 月末交易日、债券月末 | 不用 |\n| 11 | 何时结束交易：止损与退出 | 用（与已有卡重叠） |\n| 12 | 对投机的思考 | 用（心态层） |\n| **13** | **资金管理：账户风险比例 ÷ 最大亏损** | **对照用** |\n| 14 | 50 年交易生涯的思考（含「亏本交易的启示」） | 用（心态层） |\n| 15 | 到底是什么让股市上涨 | 略 |\n| 16 | 结语 | 略 |\n\n## 本书提炼的知识卡（6 张）\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 波动性突破 | 方法 | 次日开盘价 ± 前日波幅 × 系数（40%~100%）= 进场触发，作者称「所有机械入场里最稳的」 |\n| 攻击日形态 | 方法 | 突出收盘价（收破前 3~8 日最低）后，次日反向越过攻击日极端 = 反转进场 |\n| 做市商陷阱 | 方法 | 窄箱 10~15 天后突破，若 1~3 天内跌回突破日最低价之下 = 假突破，反向做 |\n| 最大振荡值GSV | 方法 | 量「失败的振荡」——4 日均值 × 1.8 作触发，× 2.25 作止损 |\n| 时间创造利润 | 概念 | 同一系统只改持仓天数，6 天收益是 1 天的 5.6 倍 |\n| 盈亏对称的几何必亏 | 概念 | 50% 胜率、1:1 盈亏比，长期必亏——百分比亏损的几何效应 |\n\n## 看过但不建卡的（写明为什么）\n\n| 内容 | 为什么不建卡 |\n|---|---|\n| 「哎呀」(Oops) 形态 | 靠**16~18 小时不交易的订单堆积**造出大跳空；作者自己在第 2 版说电子盘后「这个系统已经失效」（他靠它赚过 100 万美元）。A 股 ETF 隔夜跳空幅度小，前置条件不成立。**记住原理即可**：开盘越过前日极值后回补到前日极值 = 情绪反转确认 |\n| 周交易日（TWD）/ 月度交易日（TDOM） | 期货与美股的季节节律，A 股 ETF 无对应样本，不搬 |\n| 第 13 章资金管理公式（账户×10~15% ÷ 最大亏损） | 与 2%与6%法则、资金管理四上限 冲突：「暴露 10~15% 账户」意味着单笔可亏 10% 以上，那是**无杠杆期货**口径；ETF + T+1 + 1% 风险仓位更适合我。**只取一句话**：风险比例超过 25% 后，风险上升快过利润 |\n| 第 11 章止损与退出 | 与 止损单两用、鳄鱼原则 重叠，不重复建卡 |\n| 威尔差价、三根线高低点 | 需盘中 tick 级数据，我的日线 ETF 体系用不上 |\n\n## 对体系的直接对应\n\n| 我现有的 | 这本书怎么说 | 差在哪 |\n|---|---|---|\n| 形态二：突破 + 次日确认 | 波动性突破：**开盘价 + 前日波幅×系数** | 我是「看形态」，它是「给价格定数」，可量化。**前日波幅 × 0.5 与我的 1N 同源** |\n| v1.18a 突破式止损 = 进场价 − 1N | 波动性突破止损 = 进场价 − 前日波幅 × 50% | 完全同构。**这本书是我止损锚的原始出处** |\n| 512980：突破日尾盘追买被套 | 做市商陷阱：突破后 1~3 天跌回突破日最低 = 假突破 | 我的教训它给了名字和判定窗口 |\n| 「拿不住盈利单」 | 时间创造利润：持有 6 天 vs 1 天，收益差 5.6 倍 | 给我一个**不早卖的理由**，且是回测数字不是口号 |\n\n## 局限（作者自己承认的）\n\n- 第 4 章的测试结果**高度依赖参数优化**（同一概念换参照点，最佳系数从 20% 到 200% 都有），作者原话：「没有一种优化能尽善尽美」「没有证据证明它们将来还能这么有效」；\n- 全书的样本是**期货**（债券、标普、黄金、猪腩），结算与杠杆结构跟 A 股 ETF 不同；\n- 第 3 章的结论建立在「宽幅振荡日收在极值」这个观察上，作者自己说这是「通常」不是「必然」。\n\n## 来源\n\n原书 PDF（440 页）已归位 `我的书架/投资与经济/短线交易秘诀/`，全文提取件 `短线交易秘诀-全文提取.md`（19.9 万字符）。本卡引用章节：第 3、4、7、8、13 章。\n\n> 免责：技术形态是概率不是保证。AI 内容仅供学习参考，不覆盖个人止损与定投纪律。",

   "source": "02-来源卡/股票大作手回忆录.md",
   "body": "# 股票大作手回忆录\n\n> 一句话：以传奇作手杰西·利弗莫尔为原型的自传体小说，用他\"四次破产、四次翻身\"的一生反复讲同一件事——**顺势而为、耐心等时机、拿住盈利仓、永远不信内幕消息。** 海龟书给了\"规则\"，心理书给了\"心态\"，这本给的是\"真实战场上怎么判断、怎么管住手\"。\n\n## 基本信息\n- 作者：埃德温·勒菲弗（Edwin Lefèvre），美国记者、小说家；主角拉里·利文斯顿的原型 = 杰西·利弗莫尔（Jesse Livermore），20 世纪初最伟大的投机者之一\n- 主题领域：趋势判断 · 择时 · 持仓纪律 · 反内幕\n- 读它的目的：治我的三个毛病——赚一点就跑、下跌时补仓摊平、总想听消息找理由\n\n## 全书脉络\n- 第一幕（第 1–4 章）少年赌客交学费：对赌行里靠\"报价带语言\"赚钱，进正规市场却连败三次。教训：**抓大走势，别赌小波动**；跌了别对市场生气。\n- 第二幕（第 5–6 章）老火鸡与最贵一课：帕特里奇\"这是牛市\"的坚守哲学；第六章因听信他人错过大行情。\n- 第三幕（第 7–9 章）体系成形：老手怀特示范择时、顺势绝地反击、建立自己的操作体系。\n- 第四幕（第 10–14 章）理论成熟与东山再起：最小阻力线体系、试探建仓与金字塔加码、破产四年后靠伯利恒钢铁一役翻身（等待六周的最佳时机）。\n- 第五幕（第 15–22 章）棉花咖啡教训与操盘手记：官方政策这类\"不可预料因素\"、坐庄炒作的战术解剖、顺势而为的实操示范。\n- 第六幕（第 23–24 章）给公众的忠告：解剖\"匿名内幕人士\"的言论如何诱多出货——**知道不做什么，和知道做什么一样重要。**\n\n## 提炼出的知识\n\n### 概念（\"怎么想\"）\n- 最小阻力线 —— 价格沿阻力最小的方向运动；先确定方向，只在方向明确后出手\n- 内幕消息陷阱 —— 匿名\"内部人士\"的利好/解释，往往是机构出货的工具；只信价格行为，不信消息\n\n### 方法（\"怎么做\"）\n- 让利润奔跑 —— 大钱靠\"坐住\"趋势赚来，不是靠快进快出（老火鸡：\"这是牛市，你知道的\"）\n- 试探建仓与加码 —— 先小注试探市场反应，浮盈才金字塔加码；亏损绝不向下摊平\n- 等待最佳时机 —— 宁可错过，不在时机未到时进场（伯利恒钢铁：忍住六周等 100 点关键位）\n\n## 我的感受 / 行动\n\n- 第五章一句戳中我：\"落袋为安不会让你变穷……但在牛市中仅凭 4 个点的利润你也挣不到大钱。\"我赚 2% 就跑，本质是拿小波段利润替代了大趋势利润。\n- \"赚大钱不是靠思考，而是靠坚守\"——我缺的不是判断，是拿住的能力。这跟 交易心理分析 里\"赢家态度\"是一回事，只是这本书用一生故事讲给我听。\n- 第十四章伯利恒钢铁：最值得学的不是\"买在 98 点\"，而是**此前六周他刻意不去交易大厅、管住手等关键位**。我恰恰相反——空仓就手痒。\n- 第 23–24 章值得反复读：散户以为的\"内部消息\"，多半是设计好让他接盘的。A 股题材炒作同理：**利好满天飞时，先问谁在出货。**\n- 行动：把\"让利润奔跑 / 只在盈利时加码 / 等关键点\"抄进我的短线纪律卡，和 海龟交易法则、交易心理分析 三本书合并成一张\"短线纪律核对表\"（下一步做）。\n\n## 本书提炼的知识卡\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 短线纪律核对表 | 方法 | 三本书各管一段：海龟给规则数字（入场/仓位/止损/退出），心理书给让规则执行得下去的自检问句，大 |\n| 离场三闸门 | 方法 | 1. 盘中先看①破没破；拿不准时用 止损触发三问 分类——逻辑破坏走 / 价格噪音可等反 |\n| 等待最佳时机 | 方法 | 利弗莫尔一生最精彩的一战（第十四章）：破产负债后，朋友只给他 500 股伯利恒钢铁的额度，他必须 |\n| 让利润奔跑 | 方法 | 利弗莫尔最出名的一段自白（第五章）：\"我能赚到大钱，从来不是因为我的思考，而是因为我的坚守。对市 |\n| 试探建仓与加码 | 方法 | 利弗莫尔从不\"感觉要涨就满仓\"。他的做法（第十章）：先研究行情走势确定最小阻力线方向，然后先买入 |\n| 内幕消息陷阱 | 概念 | 机构/内线要高价卖掉手里的股票，靠谁接盘？靠散户。他们不会举着喇叭喊\"我要出货了\"，而是用\"匿名 |\n| 最小阻力线 | 概念 | 把市场想成一块倾斜的地面：往上推需要买盘用力（阻力大），往下砸需要卖盘用力（阻力也大），价格最终 |",

   "source": "02-来源卡/量价分析.md",
   "body": "# 量价分析：量价分析创始人威科夫的盘口解读方法\n\n> 一句话：**整本书只找两件事——成交量「确认」了价格，还是出现了「异常」**。确认就继续持有，异常就是变盘的第一个信号。除此之外别无他物。\n\n## 这本书和《威科夫操盘法》的关系（先读这段，别重复劳动）\n\n| | 孟洪涛《威科夫操盘法》 | 库林《量价分析》 |\n|---|---|---|\n| 定位 | 讲**判断**：一根蜡烛的供求含义 | 讲**规则**：把威科夫提炼成可执行的三步 |\n| 核心 | 努力 vs 结果、Spring、吸筹派发 | **投入产出定律**、确认/异常、三步法、多周期传导 |\n| 风格 | 大量案例图，事后标注 | 先立原则，再给单根/多根图例 |\n| 弱项 | 无阈值、无统计 | 无阈值、无统计（一样） |\n\n**两本合起来才完整**：孟洪涛给你「看什么」，库林给你「按什么顺序看」。\n\n## 六大指导原则（第 4 章开头）\n\n| 原则 | 原文要点 |\n|---|---|\n| ① **艺术而非科学** | 「通过量价关系分析并解读图表是一门艺术，绝非科学」「这门技术也难以自动化或者依靠软件实行」。理由是「大多数的分析都是主观的」 |\n| ② **耐心** | 「金融市场犹如一艘巨大的油轮，它不会嘎然停止又迅速启动」。信号出现后趋势还会延续一段 |\n| ③ **相对性** | 成交量只看**相对**：只要同一来源、同一时期，数据不完美也没关系——「我们是将不完美的数据同不完美的数据比较」 |\n| ④ **熟能生巧** | 作者自己「花了六个月的时间每天观察图表」才成为第二天性 |\n| ⑤ **技术分析** | 量价只是技术分析的一部分，必须配支撑阻力与趋势 |\n| ⑥ **确认还是异常** | 「确认还是异常，别无他物」 |\n\n## 威科夫三定律（本书的引用框架）\n\n1. **供求定律**：供不应求则涨；\n2. **因果定律**：横盘（因）的时间越长，后续趋势（果）越大——「整理振荡的时间越长，后续趋势的反转也就越有可能发生」；\n3. **投入产出定律**：价格的幅度（产出）应匹配成交量（投入）——**这是全书最常用的工具**。\n\n## 全书脉络（12 章）\n\n| 章 | 讲什么 |\n|---|---|\n| 1 | 交易之中无新事（历史与人物） |\n| 2 | 为何成交量如此重要 |\n| 3 | 合理的价格 |\n| **4** | **量价分析的首要原则**（六大原则 + 确认/异常 + 三步法 + 多周期） |\n| 5 | 全局视角 |\n| 6 | 结合 K 线图的量价分析 |\n| 7 | 支撑位和阻力位 |\n| 8 | 动态趋势及趋势线 |\n| 9 | 价量分布分析（VAP） |\n| 10-10 | 实例、综合运用 |\n| 12 | 最新发展 |\n\n## 本书提炼的知识卡（3 张）\n\n| 卡 | 类型 | 一句话 |\n|---|---|---|\n| 量价三步法 | 方法 | 微观（单根）→ 宏观（相邻几根）→ 全局（整图定位），只找确认或异常 |\n| 量价异常三例 | 方法 | 长阳低量 = 多头陷阱；短阳高量 = 顶部走弱；涨势中量递减 = 连续异常 |\n| 多周期传导 | 概念 | 快周期的变化传导到慢周期才成为趋势（涟漪 / 发条车） |\n\n## 看过但不建卡的（写明为什么）\n\n| 内容 | 为什么不建卡 |\n|---|---|\n| **投入产出定律（威科夫第三定律）** | 与 努力与结果（孟洪涛版）**是同一条定律**。已在「努力与结果」卡里补了库林版的两个层次（单根 + 趋势）与「连续异常」，不另建卡，避免一物两卡 |\n| 第 9 章 VAP（价量分布） | 需要盘中价量分布数据，A 股 ETF 日线拿不到；且与已有 等量图Equivolume 思路重叠 |\n| 第 7、8 章支撑阻力与趋势线 | 与 支撑与压力的画法、支撑阻力即供求、趋势线一致性画法 重叠 |\n| 「1% 原则」 | 与 2%与6%法则 同类但更粗，不重复 |\n| 做市商开盘测试情绪（夜盘测试） | 依赖开盘头几分钟的 tick 行为，与我的日线 ETF 体系不匹配 |\n\n## 对体系的直接对应\n\n| 我现有的 | 这本书怎么说 |\n|---|---|\n| 形态二「突破 + 次日确认」 | 突破日**必须**放量；放量不足 = 异常 = 不进 |\n| v1.19「看突破前 10 日振幅」 | 库林的因果定律给了另一解释：**振幅小 = 因小 = 果小**（趋势走不远） |\n| 报告里的「成交额面板」 | 只看绝对值不够，要判「这个量配不配这个涨幅」 |\n| 多周期（日线 + 周线） | 本书主张 5/15/30 分钟三车道；我可用「日线 + 周线」两车道替代 |\n\n## 局限\n\n- 作者明确说这门技术**「难以自动化」**——与我的自动化报告体系天然冲突，只能做**半自动**（机器给量比分位，人判断性质）；\n- 「异常」的判断靠经验与相对比较，**没有阈值**；\n- 全书图例是**外汇与指数**，A 股 ETF 的成交量含集合竞价与做市盘；\n- 反复出现「做市商/局内人操纵」的叙述，**不可证伪**，能用的只有量价错配这一层；\n- 与孟洪涛那本**存在大量内容重叠**，两本一起读有重复感（我在卡内已做去重）。\n\n## 来源\n\n原书 epub 已归位 `我的书架/投资与经济/量价分析/`，全文提取件 `量价分析-全文提取.md`（14.2 万字符）。本卡引用第 4 章为主。\n\n> 免责：技术形态是概率不是保证。AI 内容仅供学习参考，不覆盖个人止损与定投纪律。",

   "body": "# 会计恒等式与三表勾稽（记账直觉）\n\n> 一句话：读财报的**第一性原理只有三句话**——①**资产 = 负债 + 所有者权益**（每一笔交易都同时动至少两个科目，报表永远平）；②**利润 ≠ 现金**（赚钱的公司可能因为没现金而倒下）；③**权责发生制**（收入在\"赚得\"时、费用在\"发生\"时入表，不是收付现金时）。这三句话是看懂一切财报的地基。\n\n## 是什么\n\n读财报看景气、财报排雷清单 都是\"用表\"的方法；本卡解决更前置的问题：**表和数字到底是怎么来的**。三张表的分工与勾稽：\n\n| 报表 | 类比 | 时间维度 | 回答的问题 |\n|---|---|---|---|\n| 资产负债表 | 照片 | **某一时点** | 我现在有多少家底？（资产=负债+权益） |\n| 利润表 | 摄像机 | **一段时期** | 这段时间赚没赚钱？（收入−成本−费用） |\n| 现金流量表 | 流水账 | **一段时期** | 现金为什么变了？（只记真实现金进出） |\n\n**三张表是凳子的三条腿**——缺一条就不稳。利润表告诉你\"赚了多少\"，但**利润是意见，现金是事实**：只有现金流量表告诉你真金白银的去向。\n\n## 三条铁律（要变成本能）\n\n### 铁律一：资产 = 负债 + 所有者权益\n- 左边=钱拿去做了什么（现金/存货/设备/应收），右边=钱从哪来（借的=负债，股东的=权益）\n- **任何一笔交易至少同时动两个科目**，所以报表永远平衡\n- 举例：**赊购**存货 → 资产（存货↑）和负债（应付账款↑）同步增加——**不花一分钱现金，资产就变多了**\n- 推论：**虚增利润必然伴随虚增资产**（因为恒等式要平）——所以排雷重点看资产端（财报排雷清单 B 段）\n\n### 铁律二：利润 ≠ 现金\n- 赚的利润可能变成了：存货、固定资产、应收账款——**都不在手上**\n- 极端情形：账上盈利 52 美元，却连 30 美元的原料都买不起（因为钱都压在了设备、存货、应收里）\n- **现金是企业的血脉，利润只是账面数字**；一个盈利的公司完全可能因为现金链断裂而倒下\n- 实战翻译：**经营现金流 ÷ 净利润 < 1 连续多年 = 纸面利润**（读财报看景气 第三步）\n\n### 铁律三：权责发生制 vs 收付实现制\n- **权责发生制**（上市公司用）：收入在\"**赚得**\"时确认，费用在\"**发生**\"时确认——不管钱收没收到\n- **收付实现制**（小企业/服务业常用）：收到钱才算收入，付出钱才算费用\n- 后果：**报表和真实收付款之间永远有时间差**——应收账款（卖了没收钱）、预收账款（收了钱没交货）、待摊费用（付了钱没到期）都是这个时间差的产物\n- 记住：**有收入 ≠ 收到现金，有费用 ≠ 付出现金**\n\n## 三张表之间的勾稽（互相牵动的线）\n\n- 利润表的**净利润** → 结转到资产负债表的**未分配利润/留存收益**（资产端同步变化）\n- 现金流量表的**期末现金** → 等于资产负债表的**货币资金**\n- 资产负债表**资产的增减** → 解释利润与现金流之间的差异（利润去哪了？变成了应收/存货/设备）\n- **折旧**：利润表记费用（减少利润），现金流量表**不加不减**（非付现费用），资产负债表固定资产净值减少——同一笔折旧，三张表三种落法\n\n## 使用要点\n\n1. **看年报顺序**：先看**资产负债表**（家底厚不厚、安不安全）→ 再看**利润表**（赚没赚钱、在哪赚的）→ 最后看**现金流量表**（赚的钱是不是真金白银）。三张表**必须一起看**，单看一张会被误导。\n2. **最该警惕的差异**：利润表很漂亮、经营现金流却很差 → 利润八成变成了应收或存货（要么是业务扩张正常，要么是虚增收入/粉饰——去附注找解释）。\n3. **对 ETF 玩家的用法**：本卡是**地基卡**，本身不直接产生买卖动作；它的作用是让你读到 读财报看景气 的\"三步验证\"和 财报排雷清单 的\"科目扫雷表\"时，**知道每个数字背后的会计含义**，而不是死记指标。\n4. **配合学习顺序**：本卡（记账直觉）→ 读财报看景气（三表分析+好公司标准）→ 安全边际读表法（格雷厄姆防守视角）→ 读财报看景气/财报排雷清单（实战应用）。\n\n## 边界与对照\n\n- 本卡讲的是一般企业会计准则的逻辑；银行/保险/券商的报表结构差异很大（没有\"存货\"\"营业成本\"），本卡不适用\n- \"利润≠现金\"不等于\"利润不重要\"——两者都重要，只是一方管**收益**、一方管**风险**（读财报看景气 结论：风险大看现金流，风险可控看利润）\n- 关联认知：成本口径与止损基准（会计口径 vs 持仓成本口径的区分）· 第二层次思维（数字背后的动机）\n\n## 相关链接\n\n世界上最简单的会计书（本卡底层书，含柠檬汁摊全书故事）· 读财报看景气（正向三步·直接用本卡地基）· 财报排雷清单（反向排雷·用恒等式推出\"虚增利润必虚增资产\"）· 读财报看景气 · 安全边际读表法 · ETF书籍导读（财报区书目）",

   "body": "# 读财报看景气（龙头财报验证三步法）\n\n> 一句话：**用龙头财报验证赛道是不是真景气，只做三件事**——① 增长在不在加速（营收/净利同比）；② 赚钱质量好不好（毛利率趋势 + 扣非净利）；③ 现金有没有说谎（经营现金流 vs 净利润、应收/存货是否暴增）。三关都过 = 赛道景气有财报背书；任何一关亮红灯 = 故事再好也降档。\n\n## 是什么\n\n你买的是 ETF，**不需要学个股深度排雷、会计造假全套**——那是选股者的功课。财报对你只有两个用途：\n\n1. **研究新赛道时验证景气**（新赛道研究五步法 第二步：龙头财报说了算，媒体吹=噪音）\n2. **持仓方向证伪**（路线B 持有中，板块逻辑有没有被财报证伪 → 触发逻辑止损 离场三闸门 闸门②）\n\n三张表速记（一本书读懂财报）：**资产负债表=家底照片（时点）、利润表=赚钱录像（时段）、现金流量表=流水账（风险）**。判断一家公司先问\"它风险大不大\"——**风险大看现金流、风险可控才信利润**（电子书企业：利润 8000 万但经营现金流 −3.2 亿、应收存货暴增，次年亏 5 亿）。\n\n## 触发场景\n\n- 研究新赛道（新赛道研究工作表 第二步）：拿行业龙头（市值第一或相对强度第一）最近 2~3 份季报/年报来验\n- 持仓方向听到重大利好/利空：先看龙头财报基本面变没变，再决定信不信\n\n## 三步法（每步可打勾）\n\n### ① 增长是否\"真加速\"\n| 看什么 | 怎么算 | 红灯 |\n|---|---|---|\n| 营收同比增速 | 本季/本年营收 ÷ 去年同期 −1 | 增速连续 2 季下滑 = 景气拐头 |\n| 净利同比增速 | 同上 | 净利增速 > 营收增速很多 = 可能是降费用/卖资产挤出，先存疑 |\n| 加速还是减速 | 近 3 期增速逐期比较 | 放缓即降档，哪怕绝对增速还高 |\n\n> 尺子：CANSLIM 要求当季 EPS 同比 +25~30% 起步且逐季**加速**（CANSLIM选股法 C/A）——那是\"大牛股\"标准；验证赛道景气只需\"龙头增速向上、没拐头\"，不用那么严。\n\n### ② 赚钱质量好不好\n| 看什么 | 怎么看 | 红灯 |\n|---|---|---|\n| 毛利率趋势 | 近 4~8 季毛利率逐季比 | 持续下滑 = 行业竞争恶化/降价（纸业/彩电案例：毛利率从 28%→15% 即行业从景气转过剩） |\n| 扣非净利 | 剔除营业外收支/补贴/公允价值变动后还剩多少 | 利润主要靠营业外/补贴 = 不可持续，含金量低 |\n| ROE 大致水平 | 净利 ÷ 净资产 | 明显低于行业平均 = 跑不赢同行 |\n\n### ③ 现金有没有说谎（排雷三问）\n| 问 | 查什么 | 红灯 |\n|---|---|---|\n| 赚的钱收回来了吗 | 经营现金流 vs 净利润（连续 2 年以上） | **经营现金流长期为负/远小于净利 = 纸面利润**，靠融资输血（A/B 公司对照：通信设备商应收大增第二年利润翻倍是订单垫资，电子书企业应收大增次年亏 5 亿是卖不动） |\n| 应收是不是暴增 | 应收账款增速 vs 营收增速 | 应收涨得比营收快很多 = 放宽赊销硬冲销量，收不回就是坏账 |\n| 存货是不是暴增 | 存货增速 vs 营收增速 | 存货大增卖不动 = 产品失宠（被替代/过时） |\n\n> 一句话记忆：**\"利润 + 应收存货同涨 + 经营现金流差\" = 三表互相矛盾的暴雷前兆**；反之应收/存货增加但经营现金流好，可能是行业特性（账期长），要结合行业看。\n\n## 使用要点\n\n1. **先行业后个股**：财务数据带行业烙印——毛利率 15% 在彩电是常态、在软件是灾难。对照\"门当户对\"的同业公司看，不拿绝对值论英雄。\n2. **数据从哪取**：同花顺/东方财富 F10 → 财务分析（主要指标 + 资产负债表/现金流量简表）；看增速用\"同比\"，看趋势拉\"单季\"或\"近 N 期\"。\n3. **结果只是输入，不构成买卖触发**：财报验证通过 ≠ 买入信号——买入仍走系统纪律（ETF交易系统 3A 进场篇：大盘档位 → 赛道研究 → 三信号 → 试探仓 + 止损）；财报证伪 ≠ 立即卖出——路线B 的逻辑止损走 离场三闸门 闸门②，价格止损仍看自己持仓的 -5% 线。\n\n## 边界与对照\n\n- 只验\"景气方向\"，不预测股价：财报好但股价可能已透支（题材早已计入预期 → 见 第二层次思维）\n- 景气验证的上游约束：**先看这是不是\"可持续的真成长\"还是\"一次性题材\"**（高估五类：脱离基本面的概念炒作，财报根本验不出）\n- 想进阶：学 WACC/经济利润（跑赢行业平均才算赚钱）与财务分析细节，回 一本书读懂财报 第六~八部原文\n\n## 相关链接\n\n财报排雷清单（姊妹篇·反向排除：读财报前先按\"财报外信号→科目扫雷→操纵手法→董事会报告\"找鬼，先排雷后验证景气）· 新赛道研究五步法（第二步用本卡）· 新赛道研究工作表（第二步填写区）· CANSLIM选股法（C/A 盈利加速的尺子）· 离场三闸门（逻辑止损证伪后离场）· 高估五类（题材 vs 基本面）· 一本书读懂财报（本卡底层书，三表/比率/排雷原文）· 手把手教你读财报（A股年报实操+排雷视角，唐朝）· ETF书籍导读",
   "id": "03-知识/方法/读财报看景气.md"

   "oneliner": "上市公司的财务操纵只有四大类（盈余/现金流/关键指标/并购），先记住每类的危险信号；但真正的高手用的是\"法证式思维模式\"十招——不纠缠数字，而是带着怀疑问\"这数字怎么来的？为什么是现在变的？\"。管理层夸大好消息、隐瞒坏消息的冲动永远不会消失。",
   "source": "03-知识/方法/财务诡计识别框架.md",
   "body": "# 财务诡计识别框架（四大类图谱 + 法证式十招）\n\n> 一句话：上市公司的财务操纵**只有四大类**（盈余/现金流/关键指标/并购），先记住每类的**危险信号**；但真正的高手用的是**\"法证式思维模式\"十招**——不纠缠数字，而是带着怀疑问\"**这数字怎么来的？为什么是现在变的？**\"。**管理层夸大好消息、隐瞒坏消息的冲动永远不会消失。**\n\n## 是什么\n\n财报排雷清单（唐朝）给的是**A股年报常见雷点清单**；本卡给的是**舞弊的完整原理图谱与思维方式**。两卡分工：**原理（本卡）→ 实操清单（唐朝卡）**。\n\n**前提设定**：上市公司管理层**永远有夸大正面、隐瞒负面的冲动**——所以读财报的默认姿态是**适度怀疑**，不是信任。\n\n## 一、四大类诡计图谱（知道\"能怎么骗\"）\n\n### A. 盈余操纵诡计（7种，最常见）\n**虚增当期利润**：\n1. **过早确认收入**——未完成合同就确认 / 超工作量确认 / 买方验收前确认 / 付款能力存疑时确认\n2. **确认虚假收入**——虚构交易 / **回旋镖交易**（买卖双方资金来回流动）/ 关联方对倒\n3. **用一次性或非持续活动推高利润**——卖资产化妆成收入、互换贸易\n4. **把当期费用推迟到以后期间**——费用资本化、藏进资产负债表\n5. **用其他方法隐瞒费用或损失**\n\n**虚增未来利润**（业绩平滑）：\n6. **把当期利润推迟到以后确认**——\"利润蓄水池\"\n7. **把未来费用提前确认在当期**——**\"洗大澡\"**（一次亏够，为次年转回铺垫）\n\n**核心机制（记这一句就够）**：**把不属于本期的收入确认在本期，或把属于本期的费用不确认在本期，当期利润就虚增了**；反之则虚减、为未来腾挪。\n\n### B. 现金流量诡计（3种）\n1. 把**筹资活动**现金流入伪装成**经营活动**流入（让\"造血能力\"显得更强）\n2. 把**经营活动**现金流出归类到其他活动（掩盖经营失血）\n3. 用非持续性活动抬高经营现金流\n\n⚠️ 现金流的**分类**可以被操纵——**看清每笔现金的真实来源，别只看\"经营现金流\"这个总数**。\n\n### C. 关键指标诡计（2种）\n1. 用**高估业绩的误导性指标**——\"调整后利润\"\"EBITDA\"\"每股现金利润\"（把真实成本剔出去）\n2. 歪曲**资产负债表指标**，避免暴露财务恶化（粉饰营运资金、隐藏债务）\n\n### D. 并购会计诡计（3种）\n虚增收入利润 / 虚增现金流量 / 操纵关键指标——**并购是藏污纳垢的重灾区**（商誉、重组费用、并表时间点都可做手脚）。\n\n## 二、法证式思维模式十招（全书精华·怎么识破）\n\n| # | 招法 | 一句话用法 |\n|---|---|---|\n| 1 | **适度怀疑是竞争优势** | 市场有利于好消息传播，能保持客观怀疑的人才赚钱 |\n| 2 | **对变更要十分警惕** | 问\"**为什么**\"更要问\"**为什么是现在**\"（会计政策/披露/高管离职/审计师变更都是红灯） |\n| 3 | **调查过去的\"会计问题\"** | 别只当技术问题——想\"**这些不当操作掩盖了多大问题**\" |\n| 4 | **关注公司文化** | 薄弱制衡、独裁CEO、\"为达目标不惜代价\"= 坏行为温床 |\n| 5 | **别盲目相信宣传的盈利模式** | 非GAAP指标往往剔掉了重要成本；先问\"这个问题本身值不值得被认真对待\" |\n| 6 | **密切关注高管薪酬** | 考核哪个指标，管理层就围猎哪个指标 |\n| 7 | **披露的位置、位置、位置** | **专门去读公司不想让你读的部分**（小字体、枯燥章节、年报附注角落） |\n| 8 | **像打高尔夫，每一击都算数** | 不允许\"加击\"——让你忽略某些费用/现金流出的说法等于作弊 |\n| 9 | **行为模式是可靠信号** | 激进CFO会把习惯带到下家；过去激进压货，之后常伴随收入骤降 |\n| 10 | **保持谦虚，永远好奇，不断学习** | 诡计只换不灭——\"**发生过的将再次发生**\" |\n\n## 使用要点\n\n1. **ETF 玩家的正确用法（边界很重要）**：你买的是 ETF，**单股暴雷已被分散**，不需要每天排查持仓个股。本卡的用法只有三个场景：\n   - **研究新赛道时**：用四大类图谱扫描赛道龙头有没有**系统性造假嫌疑**（软件/半导体/云计算/生物医药是高危行业——税收优惠多+产品难核查）\n   - **看到某赛道被质疑造假时**：用\"法证十招\"判断传闻站不站得住\n   - **理解\"为什么财报不能全信\"**：从而更重视现金流与交叉验证\n2. **最高频的三个红灯**（实战优先记这三条）：\n   - ② **\"为什么是现在\"**——变更会计政策/审计师/高管离职，往往发生在经营拐点\n   - ⑦ **披露的位置**——专门去读年报附注最枯燥的部分\n   - ⑨ **行为模式**——同一管理层/CFO 的激进手法会重复\n3. **和 财报排雷清单 的分工**：本卡记\"**原理与思维**\"，唐朝卡记\"**具体科目信号表**\"。实战：先用法证十招建立怀疑，再用唐朝卡 B 段（科目扫雷表）逐项核对。\n4. **结果只是输入，不构成买卖触发**（同所有排雷工具）：财报可疑 ≠ 做空它，只是从观察池划掉；买入仍走 ETF交易系统 3A 进场篇。\n5. **交叉验证是终极武器**：一份财报可以骗人，但**财报 + 公告 + 行业数据 + 上下游 + 现金流水**的交叉比对很难一起骗——法证式思维的本质就是**多源交叉**。\n\n## 边界与对照\n\n- **不适用于题材股**：由故事/资金驱动的题材炒作根本不看财报，本卡不适用（见 高估五类）\n- **不是定罪工具**：识别框架只能\"把真相框到更小范围\"、支撑\"存疑即排除\"，不构成造假证据（同唐朝卡边界）\n- **A股 vs 美股**：四大类图谱是全球通用原理，A股历史案例（蓝田、康美、康得新等）几乎都能归入其中——**\"发生过的将再次发生\"**\n- 关联认知：第二层次思维（别人都信时多想一层）· 离场三闸门（闸门②逻辑止损：持仓逻辑被财报证伪即走）\n\n## 相关链接\n\n财务诡计（本卡底层书，15种诡计+三案例+十招原文）· 财报排雷清单（唐朝·A股实操清单·姊妹篇）· 读财报看景气（正向三步）· 安全边际读表法（格雷厄姆防守）· 会计恒等式与三表勾稽（地基）· 离场三闸门 · 高估五类 · ETF书籍导读（财报区书目）",

   "body": "# 财报排雷清单（排除法·反向过滤）\n\n> 一句话：**读龙头财报先别急着找\"好\"，先按清单找\"鬼\"**——财报外信号 → 三表科目异常 → 操纵手法识别 → 董事会报告连读，任何一项出现且找不到可信解释，就把这家公司从观察池里排除。宁可错杀而少赚，不能踩雷而亏本。\n\n## 是什么\n\n读财报看景气 回答\"行业景气是不是真的\"（正向三步：增速→质量→现金）；本卡回答前置问题\"**这份财报本身可不可信**\"。老唐的立场：财报不是用来证明公司多好的，是用来**排除**企业的——市场利润无穷、本金有限，解释不了的可疑就排除。\n\n对 ETF 玩家的用途（同上卡）：\n1. **研究新赛道时验证龙头**（新赛道研究五步法 第二步）——先排雷后看景气，顺序别反\n2. **识别靠并购/财技吹出来的\"景气\"**——尤其你关注的软件/半导体/云计算正是造假高危行业（税收优惠多+产品不易核查），但买 ETF 已分散单股暴雷，排雷是为了确认\"行业增长是真的\"，不是对个股做全套尽调\n\n## 触发场景\n\n- 新赛道研究：观察池标的/赛道龙头第一次深度研究（跑全清单 A→D）\n- 听到\"XX 方向龙头业绩爆雷/被质疑造假\"：用清单核对传闻靠不靠谱\n- 日常：不用对每只持仓跑全清单（ETF 已分散），只在深入研究某方向时用\n\n## 排雷清单（A→D 四段，按序过滤）\n\n### A. 财报外的信号（不用翻报表就能滤掉一批）\n出现任意一条 = 直接降档或排除：\n- 无法按时发布财报 / 更换甚至再次更换会计师事务所（对财报有分歧被解聘的先兆）\n- 独立董事集体辞职 / 财务总监更换频繁\n- 大股东持续大量减持（真金白银投票）\n- 主要供应商或销售商可疑（执照没年审/注册地在居民楼/税务资料缺失）\n- 经常跨行业收购、且主要靠发行股票支付（不花现金的收购要小心）\n\n### B. 三表科目扫雷（核心异常信号，每项都要去附注找解释）\n| 科目 | 异常信号 | 可能意味着 |\n|---|---|---|\n| 应收账款 | 增幅**超过**收入增幅 | 放宽赊销硬冲销量 / 提前确认收入 / 虚构收入 |\n| 应收账款 | 一年以上账龄占三成以上 | 收入真实性存疑 |\n| 其他应收/其他应付 | 数额大（\"垃圾筐\"） | 大股东资金占用 / 隐藏利润，优秀公司此项近零 |\n| 预付账款 | 大增、尤其是预付工程款/专利技术款；挂账超一年 | 资金流出通道，将来以收入面孔流回虚增利润 |\n| 存货 | 增幅超过营业成本增幅 | 虚构采购流出资金 / 存货积压不跌价 / 加大生产摊成本 |\n| 存货+毛利率 | **存货周转率降 + 毛利率升（组合拳）** | 基本可按造假对待（滞销却变\"更赚钱\"） |\n| 在建工程 | 迟迟不转固定资产 / 反复追加资金 / 刚转固就大修 | 避折旧美化利润 / 资金出口（金额大难核查） |\n| 长期待摊费用 | 数额大 | 费用资本化伪装，数字越大资产质量越差 |\n| 商誉 | 频繁收购 + 商誉越滚越大 | 减值随时来（进可攻退可守的利润调节器）；还原成资产折旧看负债率 |\n| 货币资金 | 很充裕却借高息债 / 定存多活期少 | 资金可能虚构/冻结/被占用（报表日前几天回来） |\n| 坏账计提 | 比例显著低于同行 / 账龄结构不披露 | 虚增资产、美化利润 |\n| 净利含金量 | 经营现金流 ÷ 净利润 连续数年 <1 | 纸面利润，靠融资输血 |\n| 毛利率 | 显著高于同行 | 要么业内强者，要么造假骗子（二选一，去验证） |\n\n### C. 操纵手法速认（B 段异常背后的\"作案手法\"，反向对照）\n- **收入造假三招**：虚构收入（A股最常见）、借助一次性行为夸大（卖资产化妆成收入/互换贸易）、提前确认收入（完工百分比/发货即确认——灰色地带）\n- **费用造假两招**：虚减费用（推迟入账/费用资本化/不跌价）、**洗大澡**（大额计提减值把责任推给前任或为次年转回做铺垫）\n- 提醒：**利润造假必然反映在资产端**（资产=负债+权益+收入−费用，虚增利润九成靠虚增资产）——所以扫雷重点看资产端科目\n\n### D. 董事会报告连读（判断\"管理层可不可信\"）\n- **把近 3~5 年董事会报告连起来读**：对行业的判断前后一致吗？预测兑现了吗？——言行一致的才可信\n- **拿同行的对比读**：找分歧——管理层都在说行业好话时最危险；有一家\"危机感十足\"往往是对的（茅台 2011-2013 案例：白酒调整前夜只有茅台董事会预警，结果它一枝独秀）\n\n## 使用要点\n\n1. **顺序**：先跑 A（财报外）→ 再 B（扫雷）→ 异常项去附注找解释 → 解释不充分就排除；C/D 是辅助判断手法与可信度。**先排雷后看景气**，别拿着景气故事倒过来给财报找理由。\n2. **与 读财报看景气 的分工**：看景气 = \"增长/质量/现金\"正向三关；排雷 = 反向找鬼。实战中先跑本卡 B 段扫雷（几分钟），干净了再做三步验证。\n3. **结果只是输入，不构成买卖触发**：财报干净 ≠ 买入信号（买入仍走 ETF交易系统 3A 进场篇）；财报排掉一只 ≠ 做空它，只是从你的观察池划掉，市场还会涨跌与你无关。\n4. **数据从哪取**：巨潮资讯/交易所下载年报 PDF，用\"搜索大法\"——搜科目名/数字直接跳附注，逐字读附注（企业不想让你明白的都在那）。\n\n## 边界与对照\n\n- 财报排除 ≠ 证明造假：老唐强调财报分析只是\"把真相框到更小范围\"，不是定罪工具——存疑即可排除，不需要证据链\n- 别过度使用：ETF 玩家不必对单只个股做全套排雷（那是选股者的功课），你的目标是确认\"赛道龙头财报可信、行业增长是真的\"\n- 关联认知：为什么会有公司造假 → 大股东/管理层利益与中小股东不一致，见 第二层次思维（别人都信时多想一层）；题材股财报根本不用看 → 高估五类\n\n## 相关链接\n\n读财报看景气（正向三步·姊妹篇）· 手把手教你读财报（本卡底层书，含茅台逐科目拆解原文）· 一本书读懂财报（三表地基）· 新赛道研究五步法（第二步用本卡）· 新赛道研究工作表（填写区）· 高估五类 · 离场三闸门（闸门②逻辑止损：持仓方向被财报证伪即走）· ETF书籍导读（财报 6 本按序拆：肖星→唐朝已拆，其余缓）",

   "source": "07-复盘笔记/ETF/交易手册-人读/00-先看这里.md",
   "body": "# 先看这里\n\n> 这套手册是给你看的。规则真源在 `交易系统/ETF交易系统.md`，那份给 AI 解析。两边冲突，以真源为准。\n>\n> 你只要记住一句话：**A 线不设止损，B 线必须有止损。**\n\n## 一、你的钱分两半\n\n总资金 1 万元。\n\n| 用途 | 金额 | 干什么 |\n|---|---|---|\n| A 线底仓 | 已投约 1,900 元 | 宽基 ETF，长期定投，不管跌 |\n| B 线弹药 | 计划位 2,000 元 | 题材 ETF，一笔最多 400~500 元试探 |\n| 剩下 | 约 6,100 元 | 不动，留着加档和补仓 |\n\n**为什么只拿 2,000 做 B 线？** 因为 B 线可能亏光一个计划位，而 A 线不会。先保住底仓。\n\n## 二、两条线是两套脑子\n\n| | A 线 宽基 | B 线 题材 |\n|---|---|---|\n| 你买的是什么 | 国家的经济 | 一段情绪 |\n| 跌了怎么办 | **继续买**，摊低成本 | **立刻卖**，认亏走人 |\n| 能扛吗 | 能，越跌越买 | **不能扛**，扛就是赌博 |\n| 止损 | **没有止损** | **必须有，破线就清** |\n| 赚了怎么走 | 估值高了分批卖 | 触发卖出信号就锁利 |\n\n**最重要的一条**：A 线的亏损是「波动」，早晚会回来。B 线的亏损是「永久损失」，题材凉了就再也不回来。\n\n所以：**A 线亏了别砍，B 线亏了别扛。** 这两件事做反了，系统就废了。\n\n## 三、现在该看哪一篇\n\n| 你想干什么 | 看这篇 |\n|---|---|\n| 又要定投了，这个月投多少 | 01-A线-宽基定投 |\n| 想买一只题材 ETF，能不能买 | 02-B线-题材波段 |\n| 信号到了，该现在追还是等回踩 | 02-B线-题材波段「二、追还是等」 |\n| 弱市里出现深跌，想抢反弹 | 02-B线-题材波段「三、深跌反弹」 |\n| 想做更短的，一两天进出 | 03-短线超短 |\n| 今天开盘/午盘/收盘各干什么 | 04-每日动作清单 |\n| 我又犯错了，想看看以前怎么错的 | 05-踩过的坑 |\n\n## 四、三条不能破的底线\n\n1. **B 线单笔亏到止损价，次日开盘清仓。** 不看理由，不看消息，不等反弹。\n2. **浮亏绝不加仓。** 加仓只有一个前提：已经赚钱了。\n3. **同一主线最多 2 只，合计不超过总资金 40%。** 科技类都算一条线。\n\n破了这三条，别的做得再对也没用。\n\n## 五、想深入看什么\n\n| 你想搞明白 | 看这几张卡 |\n|---|---|\n| 止损到底该怎么执行 | 止损触发三问 · 止损单两用 · 成本口径与止损基准 |\n| 为什么 A 不止损、B 必须止损 | 风险是永久损失 · 投资与投机之分（这两张是整套系统的地基） |\n| 进场三信号怎么数 | 止跌企稳三信号 · 试探建仓与加码 · 新赛道研究五步法 |\n| 什么时候该卖 | 离场三闸门 · 趋势持股与卖出信号清单 · 让利润奔跑 |\n| 怎么读市场情绪 | 钟摆与周期 · 第二层次思维 · 情绪风险 |\n| 我总是管不住手 | 交易认知偏差 · 概率思维 · 系统1与系统2 |\n| 想自己做回测 | 路线B大样本回测 · ③线口径诊断 · 行情数据源可用性 |\n\n**不建议一次全读。** 遇到问题再查，查完回手册对照自己的动作。\n\n---\n\n_本手册是 `交易系统/` 的派生版，只做提炼不改规则。改规则先改真源 ETF交易系统，再回来同步这里。_",

   "body": "# A 线：宽基定投\n\n> 一句话：**买国家，不看盘，跌了多买，贵了才卖。**\n\n## 一、买什么\n\n沪深300、上证50、中证500、创业板、上证综指这类**宽基指数 ETF**。\n\n不是行业 ETF。行业 ETF 属于 B 线。\n\n## 二、每月投多少\n\n**基准 500 元。** 加档看估值，不看当天涨跌。\n\n| 估值档位（PE 十年分位） | 加档 n | 本月金额 |\n|---|---|---|\n| 低于 10%（很便宜） | 2 | **845 元** |\n| 10%~30%（便宜） | 1 | **650 元** |\n| 30%~70%（正常） | 0 | **500 元** |\n| 高于 70%（贵） | — | **只持有，不买** |\n\n公式：`本月金额 = 500 × 1.3^n`，n 最多到 2。\n\n**为什么封顶 n=2？** 再加就是赌方向，不是定投。定投靠的是时间，不是单次重仓。\n\n**最容易犯的错**：看到今天大跌 3%，就想多买。**不行。** 加档只看估值分位，不看单日涨跌。跌了但估值还贵，照样投 500。\n\n## 三、怎么执行\n\n1. 打开估值数据（每月一次就够），看沪深300 的 PE 十年分位。\n2. 对表查出 n，算出这个月投多少。\n3. 场内买入，按 100 份整数手。\n4. 剩余零钱转到下个月。\n\n**分位每月查一次，以当日实际数据为准。本手册不记录具体分位值——写死会过期，反而误导。**\n\n## 四、什么时候卖\n\n**只有两种情况卖：**\n\n1. **估值到高分位**（PE 十年分位走高），分批卖。\n2. **达到你定的收益目标**，分批兑现。\n\n**不因为跌了卖，不因为涨了追。**\n\n### 「分批」到底怎么分\n\n**先说为什么不能一把清**：没人能卖在最高点。一把清 = 把择时压力全押在一个点上，卖飞了没仓位、跌下来没钱。分批的意义是**留后手**。\n\n#### 卖出方案 A：按估值分位（主用）\n\n**分 3 批，卖 30% / 30% / 40%。越高越卖。**\n\n| 批次 | 触发（PE 十年分位） | 卖出比例 | 卖完剩几成仓 | 举例：400 份持仓 |\n|---|---|---|---|---|\n| 第 1 批 | **≥ 70%** | **30%** | 剩 7 成 | 卖 100 份（取整到 1 手） |\n| 第 2 批 | **≥ 80%** | **30%** | 剩 4 成 | 再卖 100 份 |\n| 第 3 批 | **≥ 90%** | **40%** | **清仓** | 卖剩下 200 份 |\n\n**为什么越高卖越多？** 70% 只是「开始贵」，还可能有得涨；90% 是「历史极值区」，风险最大。**越危险的位置，仓位应该越轻。**\n\n**为什么第一批只卖 30%？** 卖飞了还有 7 成在场，不会踏空。这就是分批的意义。\n\n#### 卖出方案 B：按目标收益率（怕算不清估值时用）\n\n设一个目标，比如 **+30%**。到了就按同样节奏分批：\n\n| 批次 | 触发（浮盈） | 卖出比例 | 剩几成仓 |\n|---|---|---|---|\n| 第 1 批 | **+30%** | 30% | 7 成 |\n| 第 2 批 | **+40%** | 30% | 4 成 |\n| 第 3 批 | **+50%** | 40% | 清仓 |\n\n目标怎么定？用机会成本倒推：\n\n> **最小目标 = (1 + 通胀 + 理财年化)^年数 − 1**\n\n例：通胀 3% + 理财 4%，定投 5 年 → 1.07⁵ − 1 ≈ **40%**。低于这个数，定投还不如存理财。\n\n#### 卖飞了怎么办（必须提前想好）\n\n卖出后不跌反涨，一路不回头：\n\n**不追。钱放逆回购，等下一轮。**\n\n**为什么？** 你已经赚到了这一段。追回去等于用更高的价格买同样的东西，把利润还回去。**A 线的钱不缺机会，缺的是耐心。**\n\n### 跌了怎么买回来（卖出后的关键一步）\n\n**卖出的钱不是结束，是等它跌回来再买。** 分 3 批接回，跌得越深接得越多：\n\n| 批次 | 触发（从**最后一次卖出价**算） | 买回比例 | 钱从哪来 |\n|---|---|---|---|\n| 第 1 批 | 回落 **10%** | 买回卖出款的 **30%** | 逆回购里的钱 |\n| 第 2 批 | 回落 **20%** | 再买 **30%** | 同上 |\n| 第 3 批 | 回落 **30%** | 全部买回 **40%** | 同上 |\n\n**为什么用「最后一次卖出价」做基准？** 因为那是你实际离场的价格，最贴近你的真实成本。用最高价算会失真（最高价可能根本没卖到）。\n\n**为什么是 10 / 20 / 30% 三档？** 对应 A 股宽基三种回调级别：\n\n| 跌幅 | 性质 | 一年出现几次 |\n|---|---|---|\n| 10% | 普通回调 | 常见，几次 |\n| 20% | 中级调整 | 少，1~2 次 |\n| 30% | 熊市级别 | 更少，几年一次 |\n\n**如果只跌 10% 就反弹怎么办？** 那就只买回 30%，剩下 70% 的钱继续等。**不因为「钱没花完」就提前买。**\n\n#### 双保险：估值先回来也算\n\n如果**估值分位先回落到 50% 以下**，即使价格还没跌够 10%，也**启动第一批买回**。\n\n**为什么加这条？** 因为「跌 10%」和「估值回到 50%」可能不同步。估值是本质，价格是表象。**哪个先到用哪个，不死等价格。**\n\n### 小资金怎么落地（重要）\n\n小资金常见规模：1~4 手（100~400 份）。以下按手数举例。\n\n**按手取整，向下取（1 手 = 100 份）**：\n\n| 持仓份数 | 第 1 批（30%） | 第 2 批（30%） | 第 3 批（40%） |\n|---|---|---|---|\n| **100 份（1 手）** | 分不了批 → **一次卖完** | — | — |\n| **200 份（2 手）** | 100 份 | 100 份 | — |\n| **300 份（3 手）** | 100 份 | 100 份 | 100 份 |\n| **400 份（4 手）** | 100 份 | 100 份 | 200 份 |\n| 500 份以上 | 按 30% 算，取整到 100 的倍数 | 同 | 同 |\n\n**结论**：持仓只有 1 手时，**真到卖的时候只能一把清**——这不是违反「分批」原则，是资金规模限制。**先承认这个现实，别为了「分批」硬拆。**\n\n### 卖完的钱去哪\n\n**不能闲着。** 三个去处，按优先级：\n\n1. **投到另一只还便宜的宽基**（首选）——资金永远流向最便宜的地方。\n2. **继续定投原来那只**（最省心）。\n3. **放国债逆回购**（等机会，见第六节）。\n\n**绝对不做**：卖完就冲进 B 线题材。那是两套脑子，会互相污染。\n\n## 五、A 线绝对不做的三件事\n\n| 不做 | 为什么 |\n|---|---|\n| 设止损 | 宽基跌了会回来，止损等于把波动变成永久损失 |\n| 看日线做波段 | 那是 B 线的做法，用错地方两头亏 |\n| 因为恐慌清仓 | 恐慌时正是定投该买的时候 |\n\n## 六、现金别闲着\n\n不用的钱可以放国债逆回购。要点：\n\n- 自然日计息，T+1 起息。\n- **周四做 1 天期，拿 3 天利息。**\n- 节前倒数第二个交易日是黄金窗口。\n- 沪市 GC001 / 深市 R-001，都是 1000 元起。\n- 下单点「卖出」，不是「买入」。\n- 时间挑 14:00~14:45，15:00 后利率最低。\n\n细节看 国债逆回购速查卡。\n\n---\n\n_真源：ETF交易系统 §二。执行页：定投加档速查。_",

   "body": "# B 线：题材波段\n\n> 一句话：**进场靠等，离场靠触发。等不到就不买，触发了就走。**\n\n## 一、买之前先过三道门\n\n### 第一道门：大盘行不行\n\n看三个指数：上证、沪深300、创业板。**逐个和 20 日线比**。\n\n| 大盘状态 | 能不能买 |\n|---|---|\n| 都站在 20 日线上方，20 日线往上翘 | ✅ 正常做（追/等照旧） |\n| 沪深300 贴着 20 日线（±1.5% 内）走平 | ⚠️ 可以做，但只选「贴近 60 日新高 + 波动率低」的**稳强**标的，试探仓 400~500 |\n| 有指数站上、有指数没站上（2/3 分歧） | ❌ **不买，等方向** |\n| 都在 20 日线下方 | ❌ **默认不买**。唯一例外：深跌反弹（见第三节） |\n\n**为什么分歧态最严？** 14 年回测（2005~2026，219 只题材 ETF）：分歧态随便买 20 日 **−0.37%、胜率 26%**，比全弱市还差。方向打架的时候，等它打完。\n\n**为什么贴线震荡不追领涨？** 领涨组周持续性中位数 0.20，等于随机。上周最强、这周被切换掉是常态——回测里「跑赢指数 5 个点 + 站上 20 日线」在快轮动环境 **−0.90%、胜率 26%**。要买就买「涨得稳、回撤浅」的（距 60 日高点 3% 以内 + 波动率低），轮动切不走它。\n\n### 第二道门：这个状态用什么信号（每档不一样，不是一套信号走天下）\n\n14 年数据（2005~2026，219 只题材 ETF，3 万个事件）按大盘状态分档对打，**每档的最优进场条件不同**：\n\n| 大盘状态 | 硬性进场条件（数据最优解） | 依据 |\n|---|---|---|\n| ✅ 强势 | **创 60 日新高** + 乖离（距 20 日线）≤10% + vol20 ≤2.0 | +1.29%/胜 38%，比加量比版（+1.01%/33%）更好且信号多 4 倍 |\n| ⚠️ 贴线震荡 | **距 60 日高点 ≤3%** + vol20 ≤1.5（稳强型） | +0.50%/胜 36%，全档最优；不追领涨 |\n| ❌ 分歧态 | **无**——空仓等方向 | 全部候选为负（随便买 −0.12%/胜 24%） |\n| ❌ 弱势 | 深跌反弹 C 类（见第三节） | +4.44%/胜 63%，碾压该档其他一切 |\n\n**原「止跌、回踩、突破三个信号必须全齐」的说法作废。** 止跌、回踩降级为**观察项**——它们帮你描述形态、决定追还是等（见第二节），不再是买不买的硬门槛。买不买只看上表。\n\n**量比也不作硬性要求了。** 14 年数据里量比本身无预测力（IC≈0）；强势档实测「去掉量比」比「加上量比」收益更高、胜率更高、信号多 4 倍，分年份 8/12 更优。放量只当参考，不当门槛。\n\n### 第三道门：波动率高不高（一票否决）\n\n算 **20 日波动率（vol20）**：近 20 天每天涨跌幅的标准差。\n\n> **vol20 > 2.0 → 放弃这笔，无论信号多漂亮。**\n\n**为什么**：信号内波动率最高段的交易直接崩（回测 −0.05%，其他段约 +2%）；B 线真实事件里最危险的尾部（vol > 3.5）平均 −1.49%、胜率 24%。高波动 = 极端情绪 = 突破后阴跌概率大。\n\n**数从哪来**：盘前/收盘报告由脚本算好（字段 `vol20`），不用手算。\n\n## 二、追还是等（突破型 vs 回踩型）\n\n信号到了，还有一道岔路：**现在就买，还是等它回踩再买？**\n\n这两条路不是随便选的。**选错会让同一笔交易从赚变成亏。**\n\n**这条判据是通用规则，不限强势态**（2026-10-19 分状态验证，7,735 个突破事件）：强势里可追 +1.10% / 禁追 −0.85%，贴线震荡里可追 +1.14% / 禁追 −0.75%——排序完全一致，分年份 8/8 可追胜禁追。**但它只管「突破式进场」这一件事**：深跌反弹 C 类没有追等选择（固定次日开盘进）；分歧、弱势下第一节已禁开仓，本节用不上。\n\n### 先算三个数\n\n| 要算什么 | 怎么算 | 举例 |\n|---|---|---|\n| **前 10 日振幅** | （前 10 日最高 − 前 10 日最低）÷ 前一日收盘 | 最高 0.837、最低 0.763、昨收 0.782 → **9.46%** |\n| **当天收盘位置** | （收盘 − 当天最低）÷（当天最高 − 当天最低） | 收 0.786、最低 0.779、最高 0.798 → **0.37** |\n| **当天涨幅** | 收盘 ÷ 昨收 − 1 | — |\n\n**三个数都用收盘价算，不看盘中。**\n\n**报告里的数从哪来**：盘前/收盘报告由脚本 `scan_signals.py` 直接算好（字段 `amp10` / `close_pos` / `chase_verdict`），可复现可核对；午盘报告因为是盘中，必须用实时价现算。**算法一样，只是数据源不同。**\n\n### 判定表（就三档）\n\n| 前 10 日振幅 | 当天收盘位置 | 结论 |\n|---|---|---|\n| **< 8%**（窄幅整理） | **≥ 0.8**（收在高位、接近光头） | ✅ **可以追** |\n| **≥ 15%**（大波动） | 任何位置 | ❌ **禁追** |\n| 当天涨幅 ≥ 6%（大阳线） | 任何位置 | ❌ **禁追** |\n| 8% ~ 15% 之间 | 任何位置 | ⏸ **等回踩** |\n\n**为什么振幅大就不能追？** 十年数据实测（294 只 ETF、4,178 个突破事件）：\n\n- 窄平台（振幅 <8%）追进去：平均 **+1.14%**\n- 大波动（振幅 ≥15%）追进去：平均 **−4.83%**，胜率只有 **13%**\n\n同一个信号，追在不同形态上，结果差 6 个百分点。**形态比信号本身更重要。**\n\n**追还是等，会改变止损放哪**（回踩看支撑、突破看进场价）—— 具体算法统一在第四节讲，这里只做选择。\n\n### 执行时点（这条最容易违反）\n\n| 类型 | 什么时候下单 |\n|---|---|\n| **突破型** | **尾盘 14:45 之后**，或**次日开盘** |\n| **回踩型** | 盘中**预挂限价单**，收盘再复核 |\n\n**绝对不在盘中早段追。** 上午 10 点看到的「突破」，到收盘可能已经破了。\n\n**这条规则怎么来的**：2026-10-12 尾盘追买 512980，三个数全不达标，结果一路跌到距止损只剩 1.15%。完整复盘见 05-踩过的坑 坑 3。\n\n### 一条重要提醒\n\n**回踩进仍然是系统首选，追突破只是例外。**\n\n能等就等。等不到就放弃这一笔，不亏钱。追进去亏了，是真亏钱。\n\n---\n\n## 三、深跌反弹（C 类进场：下跌行情专用）\n\n> 一句话：**别人恐慌错杀时接一刀，反弹回 20 日线就走。**\n\n突破和回踩在下跌行情全部失效（大盘弱时回踩进场实测 0.00%）。C 类是弱市唯一的进场方式。\n\n### 触发条件（收盘判定，两条都要齐）\n\n1. 标的收盘**低于 20 日线 12% 以上**（乖离 ≤ −12%）\n2. 大盘处于**急跌态**：沪深300 近 5 日跌幅 ≥ 2%\n\n### 两条护栏\n\n- **乖离深过 18% 不接。** 跌那么深多半是个体暴雷，不是错杀。\n- **阴跌市不做。** 大盘 5 日跌幅不到 2%（慢慢磨）时此法失效（实测 +0.96%、胜率 42%）；急跌恐慌里才灵（+3.93%、胜率 76%）。\n\n### 怎么买\n\n**次日开盘**。止损距离 = 1×ATR（恐慌期 ATR 天然大，按公式仓位自动变小），**试探仓 400~500 起步**。\n\n### 怎么出（三条，先到先走）\n\n| 出场条件             | 动作            |\n| ---------------- | ------------- |\n| 收盘回到 20 日线上方     | 次日开盘卖（均值回归完成） |\n| 收盘 ≤ 进场价 − 1×ATR | 次日开盘无条件清      |\n| 拿满 15 个交易日       | 收盘清           |\n\n**为什么反弹到 20 日线就走，不等更高？** 拿满 15 日比反弹出场平均多赚约 0.6 个点，但没有明确出场锚、资金占满 15 天。回到 20 日线 = 逻辑完成。两者差距小，取纪律性强的。\n\n### 数据底账（219 只题材 ETF，2011~2026，532 个事件）\n\n+3.45%、胜率 65%；分年份 7 赚 3 亏（2015/2016/2019 亏，都不深）；月均 2~4 次，全部集中在下跌行情。\n\n### 三条诚实提醒\n\n1. **幸存者偏差对它最不利**：样本里只有现在还活着的 ETF，清盘暴雷的老 ETF 不在——真实收益会比回测略低。\n2. **跳空穿止损无法避免**（回测最差单笔 −28%），只有仓位公式能兜底。**绝不能因为「已经跌了很多」就重仓——这是 C 类最大的死法。**\n3. **它赚的是恐慌错杀的钱，不是趋势的钱。** 阴跌年份它没用（2026 年实测只有 +0.93%），别指望它当主力。\n\n---\n\n## 四、止损价怎么定（最关键）\n\n**进场那一刻就要写下来，不能事后补。**\n\n| 进场方式 | 止损价 |\n|---|---|\n| 回踩时买（推荐） | 关键支撑下沿 **减 0.5 个 ATR** |\n| 突破时追 | **进场价减 1 个 ATR** |\n| 写不出来 | 退回 成本 × 0.95 兜底 |\n\nATR 就是这只 ETF 平均每天波动多少钱，20 日的。\n\n**为什么突破型要用 −1×ATR？** 因为追进去没有支撑可依，只能用波动幅度兜底。十年回测里 −1×N 的收益/回撤比是 **6.0**，全场最优。\n\n**为什么要写定？** 因为事后人会找理由。「再等等」「马上就反弹了」——这些话会让你亏更多。写死了就没得商量。\n\n**距离也要看**：离止损太近（不到 1 个 ATR）别进，太远（超过 2.5 个 ATR）等回踩。\n\n**止损距离直接决定买多少** —— 止损定完，才轮到算仓位（见第五节）。\n\n## 五、买多少\n\n**先看公式**：\n\n> **计划位 = 账户 × 1% ÷ 止损距离%**\n> **试探仓 = 计划位 × 1/5 ~ 1/4**\n\n止损越宽，买得越少。这样无论哪笔被止损，亏的钱都控制在 100 元左右。\n\n以 1 万账户为例：\n\n| 止损距离 | 计划位 | 试探仓（1/5~1/4） |\n|---|---|---|\n| 5% | 2,000 元 | **400~500 元** |\n| 8% | 1,250 元 | 250~310 元 |\n| 10% | 1,000 元 | 200~250 元 |\n\n**为什么止损宽就要少买？** 因为止损宽意味着单笔可能亏得多。用仓位把亏损压回 100 元，**绝对伤害就恒定**。跳空也不怕。\n\n**为什么先买这么少？** 因为你要先验证判断对不对。对了再加（见第七节），错了亏得起。\n\n## 六、什么时候卖（先分清你拿的是哪种仓）\n\n**两种仓，两套出场，不混用：**\n\n| 仓位类型 | 出场规则看哪 |\n|---|---|\n| 普通仓（突破/回踩进场） | 本节 1~3 |\n| 深跌反弹仓（C 类） | 第三节那张表（回 MA20 ／ −1N ／ 15 日封顶） |\n\n### 1. 触发就走，不判断\n\n| 触发条件 | 动作 |\n|---|---|\n| 收盘价 ≤ 止损价 | **次日开盘无条件清仓** |\n| 逻辑破了（题材证伪、政策变了） | 清 |\n| **拿满 20 个交易日** | **收盘离场，不论盈亏** |\n\n**为什么有 20 日到期线？** 全部回测里 B 线收益有效期就是 20 日，第 20 天后平均不再贡献。到期不走，资金就占着不出力——把仓位还给下一个信号。\n\n**「次日开盘无条件」是什么意思？** 就是不看新闻、不问原因、不等反弹，开盘就卖。\n\n### 2. 浮盈越高，止损线越要往上抬（通用）\n\n| 浮盈 | 止损线放哪 |\n|---|---|\n| 不到 15% | 只守成本 × 0.95，**不往上抬** |\n| 到了 15% | 取「成本×0.95」和「期间最高价×0.92」里更高的那个 |\n| 曾经到过 20% | 止损抬到**成本价**，最差保本 |\n\n三条铁律：**只收紧不放宽、只朝赚钱方向移、只用收盘价判断。**\n\n盘中跌破不算，收盘拉回来就没事。\n\n### 3. 大盘转弱，卖不卖？——**不卖，按原触发走**\n\n这个直觉专门测过（7,284 个持仓事件，2026-10-19）：持仓期间大盘转分歧、转弱势、沪深300 跌破 20 日线、标的跌破 20 日线/10 日线就提前清——**没有一个比「按原触发走」好**：\n\n| 提前清仓规则 | 成绩 vs 基准 +0.71% |\n|---|---|\n| 大盘转分歧即清 | +0.71%（无增益） |\n| 大盘转弱势即清 | +0.63%（更差） |\n| 沪深300 跌破 20 日线即清 | +0.65%（更差） |\n| 标的跌破 10 日线即清 | +0.42%（最差） |\n\n分年份 14 个里 10 个提前清更差。原因：**止损和移动止盈已经替你管住下跌**，看到大盘转弱就清仓，等于主动砍掉还在赚钱的仓位。\n\n**所以大盘状态只在买之前管用（第一节），持仓中不多加卖出动作。** 唯一例外：逻辑破了照清，止损到了照走。\n\n## 七、加仓（只有一种情况能加）\n\n三个条件**同时满足**：\n\n1. 试探仓已经赚了 **3% 以上**。\n2. 收盘站上 5 日线。\n3. 大盘没跌破 20 日线。\n\n三条齐了 → **次日 9:30~9:45 买**，一次补到计划位。\n\n**高开护栏**：次日开盘涨超 2%，别追，挂「昨收×1.01」等回落。一天不回落就放弃这次加仓。\n\n**浮亏永远不加仓。** 这是底线，没有例外。\n\n## 八、一条主线最多 2 只\n\n云计算、算力、通信、PCB、存储、半导体——**都算同一条科技线**。\n\n合计不超过总资金 40%（2,000 元），最多 2 只。\n\n**为什么？** 因为它们一起涨也一起跌。看着分散，其实是一笔重仓。\n\n## 九、买之前最后检查一遍\n\n- [ ] 大盘档位看过了？（强势 / 贴线震荡 / 分歧态 / 弱势，分歧和弱势默认不买）\n- [ ] 若弱势：走的是深跌反弹 C 类？（乖离 ≤ −12% + 大盘急跌态，两条都齐）\n- [ ] **本档硬性进场条件齐了？**（强势=新高+乖离≤10%+vol≤2.0；震荡=距高≤3%+vol≤1.5）\n- [ ] **vol20 算过了？（> 2.0 一票否决）**\n- [ ] **追还是等算过了？**（前 10 日振幅、当天收盘位置、当天涨幅三个数都算出来了吗）\n- [ ] 如果是追：振幅 <8% 且收盘位置 ≥0.8？\n- [ ] 如果是追：止损锚用的是「进场价 −1×ATR」，不是支撑下沿？\n- [ ] 下单时点是尾盘 14:45 后或次日开盘？\n- [ ] 止损价算出来了、写下来了？\n- [ ] 仓位按公式算了？（计划位 = 账户×1% ÷ 止损距离%，试探仓取 1/5~1/4）\n- [ ] 同主线没超过 2 只？\n\n**十一项全勾才下单。少一项就等。**\n\n---\n\n_真源：ETF交易系统 §三（3A 进场 / 3B 离场）。模板：进场准备模板、离场步骤模板。_",

   "oneliner": "⚠️ 口径声明（2026-10-20 补）：本篇讲的是「用 ETF 做隔日」，不是个股短线。  2026-10-20 起，「个股短线」已独立成域：[[短线-00-先看这里]]（人读）／[[短线交易系统]]（AI 读版真源）。两个域平级独立、互不污染。  - 你只想用 ETF 做 1~3 天 → 留在本篇 - 你想做个股短线（打板、龙头、缠论结构） → 去 [[短线-00-先看这里]]  本篇原第七节「书单」已整体迁到 [[短线书籍导读]]（那批书全是个股短线的，放这里会误导）。",

   "body": "# 短线 / 超短线\n\n> ⚠️ **口径声明（2026-10-20 补）**：**本篇讲的是「用 ETF 做隔日」，不是个股短线。**\n>\n> 2026-10-20 起，「个股短线」已独立成域：短线-00-先看这里（人读）／短线交易系统（AI 读版真源）。两个域平级独立、互不污染。\n>\n> - 你只想**用 ETF 做 1~3 天** → 留在本篇\n> - 你想**做个股短线**（打板、龙头、缠论结构） → 去 短线-00-先看这里\n>\n> 本篇原第七节「书单」已整体迁到 短线书籍导读（那批书全是个股短线的，放这里会误导）。\n\n> 一句话：**ETF 做不了真正的超短线。能做的是「隔日情绪」，持仓 1~3 天。**\n\n## 一、先认清现实\n\n很多人说的超短线，在 ETF 上根本不存在。\n\n| 你听说的玩法 | 在 ETF 上行不行 | 原因 |\n|---|---|---|\n| 打板、连板、涨停敢死队 | ❌ 不行 | ETF 没有涨跌停板 |\n| 日内 T+0 反复做 | ❌ 不行 | 场内 ETF 是 **T+1**，当天买的当天不能卖 |\n| 龙头战法、龙虎榜跟席位 | ❌ 不行 | ETF 没有「龙头」，也没有龙虎榜 |\n| 隔日进出、做板块轮动 | ✅ **可以** | T+1 正好对应 1~3 天持仓 |\n\n**只有货币 ETF、债券 ETF 是 T+0**，但它们的波动太小，做不了价差。\n\n所以你的「短线」只有一种形态：**今天买、明天或后天卖，赌一个板块的短期延续。**\n\n## 二、短线比 B 线更严，不是更松\n\n很多人以为短线就是「快进快出、敢赌」。**错。**\n\n短线亏起来比 B 线快，因为你没有时间等它回来。\n\n| 项目 | B 线波段 | 短线 |\n|---|---|---|\n| 持仓 | 3~15 天 | **1~3 天** |\n| 单笔仓位 | 400~500 元 | **300~400 元**（更小） |\n| 止损 | 写定止损价 | **进场价 −1×ATR，更紧** |\n| 加仓 | 满足 3 条件可加 | **一律不加** |\n| 大盘要求 | 三档判定 | **只做①向上，②③都不做** |\n\n**为什么大盘只做①？** 短线没有时间等大盘修复。弱势里的短线，就是逆水行舟。\n\n## 三、能做的三种形态\n\n### 形态一：强势板块的第一次回踩\n\n板块连涨 2~3 天后第一次回调，缩量、不破 5 日线。\n\n- 买点：回踩当天尾盘，或次日开盘\n- 止损：进场价 −1×ATR\n- 目标：反抽回前高附近就走\n\n### 形态二：突破后的第二天确认\n\n放量突破关键位，**第二天不回落**，收盘还在突破位上方。\n\n- 买点：第二天尾盘 14:45 后\n- 止损：突破位下方 1×ATR\n- **绝不第一天追**（这是你 10-12 追 512980 踩过的坑）\n\n### 形态三：超跌反弹的第一根阳线\n\n连跌 4~5 天后，第一次放量收阳。\n\n- 买点：当天尾盘\n- 止损：这根阳线的最低点\n- 目标：反弹到 10 日线附近\n\n## 四、先算一件事：这笔值不值得做\n\n**短线的手续费会吃掉大半利润。**\n\n一笔 400 元，来回佣金约 0.2 元（万五双边），看起来很少。但如果一天做 3 笔，一个月 60 笔，就是 12 元。\n\n而你的单笔目标利润可能只有 8~15 元。\n\n**所以**：一天最多 1 笔，一周最多 3 笔。做多了就是给券商打工。\n\n## 五、必须写交易记录\n\n短线不记录，等于白做。\n\n每笔记四样：\n\n1. 为什么买（哪三种形态之一）\n2. 止损价多少\n3. 实际怎么走的\n4. 赚了还是亏了，为什么\n\n**一个月后回看**：如果胜率低于 40%，说明这套短线不适合你，停掉。\n\n## 六、现在不建议做的三件事\n\n| 不做 | 原因 |\n|---|---|\n| 加杠杆、融资 | 短线波动大，杠杆会让你在正确的方向上爆仓 |\n| 同时持有 3 只以上短线仓 | 看不过来，T+1 又跑不掉 |\n| 亏损后立刻反手再做一笔 | 这叫报复性交易，是亏钱最快的方式 |\n\n## 七、书单：已迁出\n\n**本篇不再列书目。**\n\n原来这里的书目（专业投机原理 / 短线交易秘诀 / 香象渡河 / 达瓦斯 / 利弗莫尔 / 威科夫 …）全部是**个股短线**的书，放在 ETF 手册里会误导。\n\n- **ETF 侧选书** → 只看 ETF书籍导读\n- **个股短线选书** → 看 短线书籍导读\n\n### 唯一允许借用的一层\n\n香象渡河 的**情绪周期四段**（试错 → 主升 → 分歧 → 退潮）。\n\n理由：ETF 做的是「隔日情绪」，这一层讲的是市场参与者的钱往哪走，不是个股形态。\n\n借用方式：**只借判断，不借规则**。判断出「退潮」→ 本篇的仓位下调；但止损线、仓位公式仍按 ETF交易系统 执行，不套用短线的止损与建仓方式。\n\n跨域参考的完整清单与「不能直接用的地方」，见 短线书籍导读 第三节。\n\n## 八、最后一句实话\n\n你现在的 B 线实盘胜率是 **36.1%**（36 笔，−214 元）。\n\n这个数字说明的问题不是「知道得不够」，而是**执行时漏了**。\n\n短线的容错比 B 线更低。**在 B 线胜率没上 45% 之前，别开短线仓。**\n\n---\n\n_本篇是人读版补充章节。AI 读版真源为 ETF交易系统；ETF 侧尚无正式短线章节，等实盘跑出数据后再写入。_",

   "title": "每日动作清单——开盘午盘收盘各做什么",
